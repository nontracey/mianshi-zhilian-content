name: Deploy content

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Upload static content artifact
        uses: actions/upload-artifact@v4
        with:
          name: mianshi-zhilian-content
          path: |
            manifest.json
            staging-manifest.json
            draft-manifest.json
            domains
            topics
            assets
            schemas
