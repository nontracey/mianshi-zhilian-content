name: Deploy content

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Prepare deployment directory
        run: |
          mkdir -p dist/assets
          cp manifest.json staging-manifest.json draft-manifest.json dist/
          cp -R domains topics schemas dist/
          if [ -d assets ]; then cp -R assets dist/; fi
          find dist -name ".DS_Store" -delete
      - name: Ensure Cloudflare Pages project exists
        run: |
          npx wrangler pages project create mianshi-zhilian-content --production-branch=main 2>/dev/null || echo "Project already exists, skipping creation"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sanitize commit message
        id: sanitize
        run: |
          MSG=$(echo "${{ github.event.head_commit.message }}" | head -1 | head -c 200)
          if [ -z "$MSG" ]; then MSG="content update"; fi
          echo "message=$MSG" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mianshi-zhilian-content --commit-dirty=true --commit-message "${{ steps.sanitize.outputs.message }}"
      - name: Verify primary and backup content routes
        run: |
          set -euo pipefail
          primary="https://mianshi-zhilian-content.pages.dev"
          backup="https://mianshizhilian-content.nontracey.de5.net"
          for path in manifest.json staging-manifest.json draft-manifest.json
          do
            curl --fail --silent --show-error --retry 3 "$primary/$path" >"/tmp/primary-$path"
            curl --fail --silent --show-error --retry 3 "$backup/$path" >"/tmp/backup-$path"
            cmp "/tmp/primary-$path" "/tmp/backup-$path"
          done
          domain_path=$(node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("manifest.json","utf8")); console.log(m.domains[0].entry)')
          topic_path=$(node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("domains/java.json","utf8")); for (const c of d.categories) { if (c.topics && c.topics.length) { console.log(c.topics[0]); process.exit(0); } } process.exit(1)')
          asset_path=$(find assets -type f ! -name ".DS_Store" | head -1)
          for path in "$domain_path" "$topic_path" "schemas/manifest.schema.json" "$asset_path"
          do
            curl --fail --silent --show-error --retry 3 "$primary/$path" >/tmp/content-primary-sample
            curl --fail --silent --show-error --retry 3 "$backup/$path" >/tmp/content-backup-sample
          done
