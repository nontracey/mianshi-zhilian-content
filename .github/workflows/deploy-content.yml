name: Deploy content

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci:static
      - name: Prepare deployment directory
        run: |
          mkdir -p dist/assets
          cp manifest.json staging-manifest.json draft-manifest.json dist/
          cp -R domains topics schemas dist/
          if [ -d staging ]; then cp -R staging dist/; fi
          if [ -d draft ]; then cp -R draft dist/; fi
          if [ -d assets ]; then cp -R assets dist/; fi
          find dist -name ".DS_Store" -delete
      - name: Ensure Cloudflare Pages project exists
        run: |
          npx wrangler pages project create mianshi-zhilian-content --production-branch=main 2>/dev/null || echo "Project already exists, skipping creation"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sanitize commit message
        id: sanitize
        run: |
          MSG=$(echo "${{ github.event.head_commit.message }}" | head -1 | head -c 200)
          if [ -z "$MSG" ]; then MSG="content update"; fi
          echo "message=$MSG" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mianshi-zhilian-content --commit-dirty=true --commit-message "${{ steps.sanitize.outputs.message }}"
      - name: Verify primary and backup content routes
        run: |
          set -euo pipefail
          primary="https://mianshi-zhilian-content.pages.dev"
          backup="https://mianshizhilian-content.nontracey.de5.net"

          fetch_and_compare() {
            base="$1"
            path="$2"
            local_path="$3"
            label="$4"
            tmp="/tmp/content-$(echo "$label-$path" | tr '/:' '__')"
            for attempt in $(seq 1 24)
            do
              if curl --fail --silent --show-error --retry 3 --retry-delay 2 \
                -H "Cache-Control: no-cache" \
                "$base/$path?sha=${GITHUB_SHA}&attempt=$attempt" >"$tmp" &&
                cmp -s "$local_path" "$tmp"
              then
                echo "OK: $label/$path matches deployment"
                return 0
              fi
              echo "Waiting for $label/$path to match deployment (attempt $attempt/24)"
              sleep 10
            done
            echo "ERROR: $label/$path did not converge to deployed content"
            if [[ "$path" == *.json ]]; then
              node -e '
                const fs = require("fs");
                const [localPath, remotePath] = process.argv.slice(1);
                const local = JSON.parse(fs.readFileSync(localPath, "utf8"));
                const remote = JSON.parse(fs.readFileSync(remotePath, "utf8"));
                console.log({
                  localContentVersion: local.contentVersion,
                  remoteContentVersion: remote.contentVersion,
                  localUpdatedAt: local.updatedAt,
                  remoteUpdatedAt: remote.updatedAt,
                  localTopicCount: local.topicCount,
                  remoteTopicCount: remote.topicCount,
                });
              ' "$local_path" "$tmp" || true
            fi
            return 1
          }

          verify_path() {
            path="$1"
            if [ -z "$path" ]; then
              return 0
            fi
            fetch_and_compare "$primary" "$path" "$path" "primary"
            fetch_and_compare "$backup" "$path" "$path" "backup"
          }

          for path in manifest.json staging-manifest.json draft-manifest.json
          do
            verify_path "$path"
          done
          domain_path=$(node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("manifest.json","utf8")); console.log(m.domains[0].entry)')
          topic_path=$(node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); for (const c of d.categories) { if (c.topics && c.topics.length) { console.log(c.topics[0]); process.exit(0); } } process.exit(1)' "$domain_path")
          staging_domain_path=$(node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("staging-manifest.json","utf8")); console.log(m.domains[0].entry)')
          draft_domain_path=$(node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("draft-manifest.json","utf8")); console.log(m.domains[0].entry)')
          asset_path=""
          if [ -d assets ]; then
            asset_path=$(find assets -type f ! -name ".DS_Store" | head -1)
          fi
          for path in "$domain_path" "$topic_path" "$staging_domain_path" "$draft_domain_path" "schemas/manifest.schema.json"
          do
            verify_path "$path"
          done
          verify_path "$asset_path"
