name: Deploy content

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Prepare deployment directory
        run: |
          mkdir -p dist/assets
          cp manifest.json staging-manifest.json draft-manifest.json dist/
          cp -R domains topics schemas dist/
          if [ -d assets ]; then cp -R assets dist/; fi
      - name: Ensure Cloudflare Pages project exists
        run: |
          npx wrangler pages project create mianshi-zhilian-content --production-branch=main 2>/dev/null || echo "Project already exists, skipping creation"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sanitize commit message
        id: sanitize
        run: |
          MSG=$(echo "${{ github.event.head_commit.message }}" | head -1 | head -c 200)
          if [ -z "$MSG" ]; then MSG="content update"; fi
          echo "message=$MSG" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mianshi-zhilian-content --commit-dirty=true --commit-message "${{ steps.sanitize.outputs.message }}"
      - name: Verify primary and backup content routes
        run: |
          set -euo pipefail
          for base in \
            "https://mianshi-zhilian-content.pages.dev" \
            "https://mianshizhilian-content.nontracey.de5.net"
          do
            curl --fail --silent --show-error --retry 3 "$base/manifest.json" >/tmp/manifest.json
            curl --fail --silent --show-error --retry 3 "$base/staging-manifest.json" >/tmp/staging-manifest.json
            curl --fail --silent --show-error --retry 3 "$base/draft-manifest.json" >/tmp/draft-manifest.json
          done
