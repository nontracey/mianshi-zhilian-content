<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500" role="img" aria-labelledby="title desc">
  <title id="title">Java GC algorithm tradeoffs</title>
  <desc id="desc">A topic-specific diagram explaining mark sweep, copy evacuation, compaction, generational and region based collectors, tri-color marking barriers, and production GC diagnosis signals.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mini { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .gray { fill: #e5e7eb; stroke: #94a3b8; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="1500"/>
  <g transform="translate(70 0)">
  <text class="title" x="70" y="66">GC 算法：标记之后怎么换取空间和停顿</text>
  <text class="subtitle" x="70" y="98">三种基础算法不是互斥选项；现代收集器把标记、移动、Region、屏障和并发阶段组合起来。</text>

  <rect class="panel" x="70" y="132" width="1220" height="275" rx="16"/>
  <text class="section" x="96" y="170">1. 共同起点：从 GC Roots 标记存活对象</text>

  <rect class="blue" x="105" y="220" width="190" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="251">GC Roots</text>
  <text class="text" x="132" y="274">线程栈 / 静态字段 / JNI</text>

  <path class="arrow" d="M300 255 H350"/>

  <rect class="cyan" x="365" y="220" width="230" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="392" y="251">对象图遍历</text>
  <text class="text" x="392" y="274">标记可达对象为 live</text>

  <path class="arrow" d="M600 255 H650"/>

  <rect class="violet" x="665" y="220" width="235" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="692" y="251">三色标记</text>
  <text class="text" x="692" y="274">white / gray / black</text>

  <path class="arrow" d="M905 255 H955"/>

  <rect class="yellow" x="970" y="220" width="235" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="997" y="251">屏障维护一致性</text>
  <text class="text" x="997" y="274">SATB 或 incremental update</text>

  <rect class="green" x="170" y="325" width="1020" height="42" rx="12" stroke-width="2"/>
  <text class="text" x="197" y="352">并发标记时用户线程还在改引用，写屏障/读屏障用于避免漏标或维护转发表，代价会体现在吞吐和延迟上。</text>

  <rect class="panel" x="70" y="447" width="1220" height="365" rx="16"/>
  <text class="section" x="96" y="485">2. 标记之后的三种基本动作</text>

  <rect class="red" x="105" y="545" width="330" height="150" rx="14" stroke-width="2"/>
  <text class="box-title" x="132" y="579">Mark-Sweep 标记-清除</text>
  <text class="text" x="132" y="608">动作：清理未标记对象</text>
  <text class="text" x="132" y="632">优点：不移动存活对象</text>
  <text class="text" x="132" y="656">代价：碎片、空闲列表、浮动垃圾</text>

  <rect class="yellow" x="515" y="545" width="330" height="150" rx="14" stroke-width="2"/>
  <text class="box-title" x="542" y="579">Copy / Evacuation 复制迁移</text>
  <text class="text" x="542" y="608">动作：把 live 对象搬到 to-space</text>
  <text class="text" x="542" y="632">优点：紧凑、分配快</text>
  <text class="text" x="542" y="656">代价：需要目标空间，存活率高时贵</text>

  <rect class="green" x="925" y="545" width="330" height="150" rx="14" stroke-width="2"/>
  <text class="box-title" x="952" y="579">Mark-Compact 标记-整理</text>
  <text class="text" x="952" y="608">动作：移动 live 对象并更新引用</text>
  <text class="text" x="952" y="632">优点：减少碎片</text>
  <text class="text" x="952" y="656">代价：移动成本和停顿压力</text>

  <text class="mini" x="145" y="740">before: [A][x][B][x][C]</text>
  <text class="mini" x="145" y="765">sweep:  [A][ ][B][ ][C]</text>
  <text class="mini" x="555" y="740">from: [A][x][B]  to: [   ]</text>
  <text class="mini" x="555" y="765">to:   [A][B]      from cleared</text>
  <text class="mini" x="965" y="740">before: [A][ ][B][ ][C]</text>
  <text class="mini" x="965" y="765">after:  [A][B][C][   ]</text>

  <rect class="panel" x="70" y="852" width="600" height="300" rx="16"/>
  <text class="section" x="96" y="890">3. 分代与 Region 如何选动作</text>

  <rect class="blue" x="105" y="950" width="230" height="76" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="981">Young / Eden</text>
  <text class="text" x="132" y="1005">低存活率，复制少量对象</text>

  <path class="arrow" d="M340 988 H385"/>

  <rect class="yellow" x="400" y="950" width="220" height="76" rx="12" stroke-width="2"/>
  <text class="box-title" x="427" y="981">Survivor / Old</text>
  <text class="text" x="427" y="1005">年龄、动态年龄、空间压力</text>

  <rect class="violet" x="105" y="1060" width="515" height="52" rx="12" stroke-width="2"/>
  <text class="text" x="132" y="1092">G1 等 Region 收集器按回收收益选择 Region，复制/整理 live 对象，控制单次停顿预算。</text>

  <rect class="panel" x="690" y="852" width="600" height="300" rx="16"/>
  <text class="section" x="716" y="890">4. 现代版本边界</text>

  <rect class="gray" x="725" y="950" width="245" height="76" rx="12" stroke-width="2"/>
  <text class="box-title" x="752" y="981">CMS</text>
  <text class="text" x="752" y="1005">JDK 14 已移除，属于历史口径</text>

  <rect class="green" x="1005" y="950" width="245" height="76" rx="12" stroke-width="2"/>
  <text class="box-title" x="1032" y="981">G1</text>
  <text class="text" x="1032" y="1005">JDK 9 起 server 默认</text>

  <rect class="cyan" x="780" y="1060" width="415" height="52" rx="12" stroke-width="2"/>
  <text class="text" x="807" y="1092">ZGC 在 JDK 21 引入分代模式，JDK 23 起 ZGC 默认使用分代模式。</text>

  <rect class="panel" x="70" y="1192" width="1220" height="210" rx="16"/>
  <text class="section" x="96" y="1230">5. 线上诊断把算法落到证据</text>

  <rect class="red" x="105" y="1285" width="240" height="62" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="1312">分配速率</text>
  <text class="text" x="132" y="1335">Young GC 频率、TLAB、临时对象</text>

  <rect class="yellow" x="395" y="1285" width="240" height="62" rx="12" stroke-width="2"/>
  <text class="box-title" x="422" y="1312">晋升/迁移失败</text>
  <text class="text" x="422" y="1335">promotion / evacuation failure</text>

  <rect class="green" x="685" y="1285" width="240" height="62" rx="12" stroke-width="2"/>
  <text class="box-title" x="712" y="1312">Live set</text>
  <text class="text" x="712" y="1335">Full/Old GC 后仍占用多少</text>

  <rect class="blue" x="975" y="1285" width="240" height="62" rx="12" stroke-width="2"/>
  <text class="box-title" x="1002" y="1312">碎片/大对象</text>
  <text class="text" x="1002" y="1335">Humongous、空闲块、to-space</text>

  <text class="small" x="96" y="1452">答题抓手：算法取舍 = 存活率、移动成本、碎片、目标空间、停顿预算、并发屏障成本；现代收集器按这些约束组合基础动作。</text>
  </g>
</svg>
