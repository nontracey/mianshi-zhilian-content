<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" aria-labelledby="title desc" role="img" viewBox="0 0 1500 1500"><title id="title">Java GC algorithm tradeoffs</title><desc id="desc">A topic-specific diagram explaining mark sweep, copy evacuation, compaction, generational and region based collectors, tri-color marking barriers, and production GC diagnosis signals.</desc><defs><marker id="arrow" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 32px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.section{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mini{font:600 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.gray{fill:#e5e7eb;stroke:#94a3b8}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1500" height="1500" class="bg"/><g transform="translate(70 0)"><text x="70" y="66" class="title">GC 算法：标记之后怎么换取空间和停顿</text><text x="70" y="98" class="subtitle">三种基础算法不是互斥选项；现代收集器把标记、移动、Region、屏障和并发阶段组合起来。</text><rect width="1220" height="275" x="70" y="132" class="panel" rx="16"/><text x="96" y="170" class="section">1. 共同起点：从 GC Roots 标记存活对象</text><rect width="190" height="70" x="105" y="220" stroke-width="2" class="blue" rx="12"/><text x="132" y="251" class="box-title">GC Roots</text><text x="132" y="274" class="text">线程栈 / 静态字段 / JNI</text><path d="M300 255 H350" class="arrow"/><rect width="230" height="70" x="365" y="220" stroke-width="2" class="cyan" rx="12"/><text x="392" y="251" class="box-title">对象图遍历</text><text x="392" y="274" class="text">标记可达对象为 live</text><path d="M600 255 H650" class="arrow"/><rect width="235" height="70" x="665" y="220" stroke-width="2" class="violet" rx="12"/><text x="692" y="251" class="box-title">三色标记</text><text x="692" y="274" class="text">white / gray / black</text><path d="M905 255 H955" class="arrow"/><rect width="235" height="70" x="970" y="220" stroke-width="2" class="yellow" rx="12"/><text x="997" y="251" class="box-title">屏障维护一致性</text><text x="997" y="274" class="text">SATB 或 incremental update</text><rect width="1020" height="42" x="170" y="325" stroke-width="2" class="green" rx="12"/><text x="197" y="352" class="text">并发标记时用户线程还在改引用，写屏障/读屏障用于避免漏标或维护转发表，代价会体现在吞吐和延迟上。</text><rect width="1220" height="365" x="70" y="447" class="panel" rx="16"/><text x="96" y="485" class="section">2. 标记之后的三种基本动作</text><rect width="330" height="150" x="105" y="545" stroke-width="2" class="red" rx="14"/><text x="132" y="579" class="box-title">Mark-Sweep 标记-清除</text><text x="132" y="608" class="text">动作：清理未标记对象</text><text x="132" y="632" class="text">优点：不移动存活对象</text><text x="132" y="656" class="text">代价：碎片、空闲列表、浮动垃圾</text><rect width="330" height="150" x="515" y="545" stroke-width="2" class="yellow" rx="14"/><text x="542" y="579" class="box-title">Copy / Evacuation 复制迁移</text><text x="542" y="608" class="text">动作：把 live 对象搬到 to-space</text><text x="542" y="632" class="text">优点：紧凑、分配快</text><text x="542" y="656" class="text">代价：需要目标空间，存活率高时贵</text><rect width="330" height="150" x="925" y="545" stroke-width="2" class="green" rx="14"/><text x="952" y="579" class="box-title">Mark-Compact 标记-整理</text><text x="952" y="608" class="text">动作：移动 live 对象并更新引用</text><text x="952" y="632" class="text">优点：减少碎片</text><text x="952" y="656" class="text">代价：移动成本和停顿压力</text><text x="145" y="740" class="mini">before: [A][x][B][x][C]</text><text x="145" y="765" class="mini">sweep: [A][ ][B][ ][C]</text><text x="555" y="740" class="mini">from: [A][x][B] to: [ ]</text><text x="555" y="765" class="mini">to: [A][B] from cleared</text><text x="965" y="740" class="mini">before: [A][ ][B][ ][C]</text><text x="965" y="765" class="mini">after: [A][B][C][ ]</text><rect width="600" height="300" x="70" y="852" class="panel" rx="16"/><text x="96" y="890" class="section">3. 分代与 Region 如何选动作</text><rect width="230" height="76" x="105" y="950" stroke-width="2" class="blue" rx="12"/><text x="132" y="981" class="box-title">Young / Eden</text><text x="132" y="1005" class="text">低存活率，复制少量对象</text><path d="M340 988 H385" class="arrow"/><rect width="220" height="76" x="400" y="950" stroke-width="2" class="yellow" rx="12"/><text x="427" y="981" class="box-title">Survivor / Old</text><text x="427" y="1005" class="text">年龄、动态年龄、空间压力</text><rect width="515" height="52" x="105" y="1060" stroke-width="2" class="violet" rx="12"/><text x="132" y="1092" class="text">G1 等 Region 收集器按回收收益选择 Region，复制/整理 live 对象，控制单次停顿预算。</text><rect width="600" height="300" x="690" y="852" class="panel" rx="16"/><text x="716" y="890" class="section">4. 现代版本边界</text><rect width="245" height="76" x="725" y="950" stroke-width="2" class="gray" rx="12"/><text x="752" y="981" class="box-title">CMS</text><text x="752" y="1005" class="text">JDK 14 已移除，属于历史口径</text><rect width="245" height="76" x="1005" y="950" stroke-width="2" class="green" rx="12"/><text x="1032" y="981" class="box-title">G1</text><text x="1032" y="1005" class="text">JDK 9 起 server 默认</text><rect width="415" height="52" x="780" y="1060" stroke-width="2" class="cyan" rx="12"/><text x="807" y="1092" class="text">ZGC 在 JDK 21 引入分代模式，JDK 23 起 ZGC 默认使用分代模式。</text><rect width="1220" height="210" x="70" y="1192" class="panel" rx="16"/><text x="96" y="1230" class="section">5. 线上诊断把算法落到证据</text><rect width="240" height="62" x="105" y="1285" stroke-width="2" class="red" rx="12"/><text x="132" y="1312" class="box-title">分配速率</text><text x="132" y="1335" class="text">Young GC 频率、TLAB、临时对象</text><rect width="240" height="62" x="395" y="1285" stroke-width="2" class="yellow" rx="12"/><text x="422" y="1312" class="box-title">晋升/迁移失败</text><text x="422" y="1335" class="text">promotion / evacuation failure</text><rect width="240" height="62" x="685" y="1285" stroke-width="2" class="green" rx="12"/><text x="712" y="1312" class="box-title">Live set</text><text x="712" y="1335" class="text">Full/Old GC 后仍占用多少</text><rect width="240" height="62" x="975" y="1285" stroke-width="2" class="blue" rx="12"/><text x="1002" y="1312" class="box-title">碎片/大对象</text><text x="1002" y="1335" class="text">Humongous、空闲块、to-space</text><text x="96" y="1452" class="small">答题抓手：算法取舍 = 存活率、移动成本、碎片、目标空间、停顿预算、并发屏障成本；现代收集器按这些约束组合基础动作。</text></g></svg>