<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" aria-labelledby="title desc" role="img" viewBox="0 0 1400 1160"><title id="title">TCP、UDP 与 QUIC 的传输语义选型</title><desc id="desc">对比 TCP 字节流、UDP 数据报和 QUIC 在 UDP 上实现可靠多流的语义差异，并给出选型决策路径。</desc><defs><marker id="arrow-blue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#059669" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.title{font:800 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.panel-title{font:750 27px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:750 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1e293b}.small{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.tcp{fill:#eff6ff;stroke:#60a5fa}.gray,.quic,.tcp{stroke-width:2;rx:14}.udp{fill:#fffbeb;stroke:#f59e0b}.udp,.warn{stroke-width:2;rx:14}.quic{fill:#ecfdf5;stroke:#34d399}.warn{fill:#fef2f2;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#cbd5e1}.line-blue,.line-green{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow-blue)}.line-green{stroke:#059669;marker-end:url(#arrow-green)}</style></defs><rect width="1400" height="1160" class="bg"/><text x="700" y="56" class="title" text-anchor="middle">TCP / UDP / QUIC 选型看的是传输语义</text><text x="700" y="90" class="subtitle" text-anchor="middle">TCP 提供可靠有序字节流；UDP 提供数据报外壳；QUIC 在 UDP 上重做可靠多流、TLS 与连接迁移</text><rect width="1160" height="350" x="60" y="125" class="panel"/><text x="92" y="168" class="panel-title">1. 三种常见传输服务契约</text><rect width="300" height="180" x="105" y="210" class="tcp"/><text x="257" y="246" class="label" text-anchor="middle">TCP</text><text x="257" y="280" class="small" text-anchor="middle">可靠、按序、字节流</text><text x="257" y="310" class="tiny" text-anchor="middle">三次握手；内核维护连接状态</text><text x="257" y="334" class="tiny" text-anchor="middle">无消息边界，要应用分帧</text><text x="257" y="358" class="tiny" text-anchor="middle">典型：HTTP/1.1、SSH、数据库</text><rect width="300" height="180" x="465" y="210" class="udp"/><text x="615" y="246" class="label" text-anchor="middle">UDP</text><text x="615" y="280" class="small" text-anchor="middle">无连接数据报</text><text x="615" y="310" class="tiny" text-anchor="middle">保留 datagram 边界</text><text x="615" y="334" class="tiny" text-anchor="middle">不保证可靠、顺序、去重、拥塞</text><text x="615" y="358" class="tiny" text-anchor="middle">典型：DNS、RTP、NTP、DHCP</text><rect width="300" height="180" x="825" y="210" class="quic"/><text x="975" y="246" class="label" text-anchor="middle">QUIC / HTTP/3</text><text x="975" y="280" class="small" text-anchor="middle">UDP 外壳上的可靠多流</text><text x="975" y="310" class="tiny" text-anchor="middle">集成 TLS 1.3 与拥塞控制</text><text x="975" y="334" class="tiny" text-anchor="middle">stream 独立重组，CID 支持迁移</text><text x="975" y="358" class="tiny" text-anchor="middle">典型：HTTP/3、移动端链路</text><rect width="1020" height="42" x="105" y="410" class="gray"/><text x="615" y="437" class="small" text-anchor="middle">UDP 不是“不可靠应用”的同义词；可靠性、顺序、拥塞控制可由上层协议承担</text><rect width="1160" height="315" x="60" y="510" class="panel"/><text x="92" y="553" class="panel-title">2. 选型路径：先语义，再时延和部署</text><rect width="230" height="64" x="120" y="590" class="gray"/><text x="235" y="629" class="label" text-anchor="middle">必须可靠按序？</text><path d="M 355 622 L 510 622" class="line-blue"/><rect width="250" height="74" x="515" y="585" class="tcp"/><text x="640" y="614" class="label" text-anchor="middle">能接受 TCP 语义</text><text x="640" y="640" class="tiny" text-anchor="middle">选 TCP：简单、成熟、内核实现</text><path d="M 770 622 L 855 622" class="line-green"/><rect width="230" height="74" x="860" y="585" class="quic"/><text x="975" y="614" class="label" text-anchor="middle">不想要 TCP HOL</text><text x="975" y="640" class="tiny" text-anchor="middle">选 QUIC/HTTP/3</text><rect width="230" height="64" x="120" y="700" class="gray"/><text x="235" y="739" class="label" text-anchor="middle">实时优先？</text><path d="M 355 732 L 510 732" class="line-green"/><rect width="250" height="74" x="515" y="695" class="udp"/><text x="640" y="724" class="label" text-anchor="middle">可容忍丢包</text><text x="640" y="750" class="tiny" text-anchor="middle">UDP + RTP/FEC/应用重传</text><path d="M 770 732 L 855 732" class="line-blue"/><rect width="230" height="74" x="860" y="695" class="udp"/><text x="975" y="724" class="label" text-anchor="middle">短请求/组播</text><text x="975" y="750" class="tiny" text-anchor="middle">DNS/NTP/DHCP/组播</text><rect width="1160" height="210" x="60" y="860" class="panel"/><text x="92" y="903" class="panel-title">3. 面试最容易丢分的边界</text><rect width="330" height="86" x="105" y="940" class="warn"/><text x="270" y="972" class="label" text-anchor="middle">DNS 不是只有 512B</text><text x="270" y="1000" class="tiny" text-anchor="middle">EDNS0 可扩展；TC/AXFR 走 TCP</text><rect width="330" height="86" x="475" y="940" class="warn"/><text x="640" y="972" class="label" text-anchor="middle">UDP 边界也会截断</text><text x="640" y="1000" class="tiny" text-anchor="middle">buffer 小会截断；分片丢失整报文失败</text><rect width="280" height="86" x="845" y="940" class="warn"/><text x="985" y="972" class="label" text-anchor="middle">QUIC 不是“更快丢包”</text><text x="985" y="1000" class="tiny" text-anchor="middle">部署、TLS、迁移、多流降 HOL</text></svg>