<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">volatile happens-before、屏障与原子性边界</title>
  <desc id="desc">展示 volatile 写读建立 happens-before、release/acquire 屏障效果、DCL 安全发布和 count++ 非原子边界。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5f99"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b24634"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #14213d; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .label { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 14px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .code { font: 600 13px Menlo, Consolas, monospace; fill: #263238; }
      .blue { fill: #e8f4ff; stroke: #6aa9df; stroke-width: 2; rx: 12; }
      .green { fill: #e9f7ef; stroke: #58b77d; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff5d6; stroke: #e0ae35; stroke-width: 2; rx: 12; }
      .red { fill: #fdecea; stroke: #cf5d4b; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #a7b5c4; stroke-width: 2; rx: 12; }
      .line { stroke: #1f5f99; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #b24634; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #7b8794; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">volatile：happens-before 与原子性边界</text>
  <text x="50" y="86" class="subtitle">volatile 解决发布可见性和关键重排序，不把读-改-写变成原子事务。</text>

  <rect x="40" y="120" width="1200" height="300" class="panel"/>
  <text x="68" y="156" class="panel-title">1. 发布模式：普通写 + volatile 写，volatile 读 + 普通读</text>
  <rect x="84" y="210" width="160" height="72" class="blue"/>
  <text x="120" y="238" class="label">线程 A</text>
  <text x="110" y="262" class="tiny">data = 42</text>
  <rect x="312" y="210" width="180" height="72" class="green"/>
  <text x="346" y="238" class="label">volatile 写</text>
  <text x="340" y="262" class="tiny">ready = true</text>
  <rect x="560" y="210" width="210" height="72" class="yellow"/>
  <text x="604" y="238" class="label">happens-before</text>
  <text x="598" y="262" class="tiny">同一 volatile 变量</text>
  <rect x="838" y="210" width="180" height="72" class="green"/>
  <text x="872" y="238" class="label">volatile 读</text>
  <text x="874" y="262" class="tiny">看到 true</text>
  <rect x="1086" y="210" width="120" height="72" class="blue"/>
  <text x="1120" y="238" class="label">线程 B</text>
  <text x="1110" y="262" class="tiny">读 data=42</text>
  <line x1="244" y1="246" x2="312" y2="246" class="line"/>
  <line x1="492" y1="246" x2="560" y2="246" class="line"/>
  <line x1="770" y1="246" x2="838" y2="246" class="line"/>
  <line x1="1018" y1="246" x2="1086" y2="246" class="line"/>
  <text x="84" y="354" class="small">A 在 volatile 写之前的普通写，对 B 在 volatile 读之后的普通读可见。</text>

  <rect x="40" y="460" width="585" height="305" class="panel"/>
  <text x="68" y="496" class="panel-title">2. 屏障视角：release / acquire</text>
  <rect x="80" y="548" width="180" height="62" class="gray"/>
  <text x="120" y="574" class="label">普通写</text>
  <text x="110" y="594" class="tiny">不能越过 release</text>
  <rect x="314" y="548" width="190" height="62" class="green"/>
  <text x="358" y="574" class="label">volatile 写</text>
  <text x="346" y="594" class="tiny">StoreStore / StoreLoad</text>
  <line x1="260" y1="579" x2="314" y2="579" class="line"/>
  <rect x="80" y="650" width="180" height="62" class="green"/>
  <text x="124" y="676" class="label">volatile 读</text>
  <text x="108" y="696" class="tiny">LoadLoad / LoadStore</text>
  <rect x="314" y="650" width="190" height="62" class="gray"/>
  <text x="352" y="676" class="label">后续读写</text>
  <text x="348" y="696" class="tiny">不能跑到 acquire 前</text>
  <line x1="260" y1="681" x2="314" y2="681" class="line"/>

  <rect x="655" y="460" width="585" height="305" class="panel"/>
  <text x="683" y="496" class="panel-title">3. DCL：引用发布不能早于初始化被观察</text>
  <rect x="692" y="548" width="142" height="68" class="blue"/>
  <text x="724" y="576" class="label">分配内存</text>
  <text x="724" y="598" class="tiny">allocate</text>
  <rect x="878" y="548" width="142" height="68" class="green"/>
  <text x="910" y="576" class="label">初始化</text>
  <text x="908" y="598" class="tiny">构造字段</text>
  <rect x="1064" y="548" width="142" height="68" class="red"/>
  <text x="1094" y="576" class="label">赋给引用</text>
  <text x="1096" y="598" class="tiny">instance</text>
  <line x1="834" y1="582" x2="878" y2="582" class="line"/>
  <line x1="1020" y1="582" x2="1064" y2="582" class="line-red"/>
  <rect x="692" y="666" width="514" height="52" class="gray"/>
  <text x="720" y="698" class="small">volatile instance 让初始化结果随引用发布给其他线程。</text>

  <rect x="40" y="805" width="1200" height="285" class="panel"/>
  <text x="68" y="841" class="panel-title">4. 原子性边界：count++ 仍是三步竞争</text>
  <rect x="84" y="900" width="150" height="70" class="blue"/>
  <text x="120" y="928" class="label">volatile 读</text>
  <text x="118" y="952" class="tiny">snapshot = 0</text>
  <rect x="294" y="900" width="150" height="70" class="yellow"/>
  <text x="340" y="928" class="label">计算</text>
  <text x="328" y="952" class="tiny">snapshot + 1</text>
  <rect x="504" y="900" width="150" height="70" class="red"/>
  <text x="540" y="928" class="label">volatile 写</text>
  <text x="542" y="952" class="tiny">写回 1</text>
  <rect x="742" y="900" width="170" height="70" class="red"/>
  <text x="776" y="928" class="label">两个线程同写 1</text>
  <text x="778" y="952" class="tiny">丢失一次更新</text>
  <rect x="1000" y="900" width="150" height="70" class="green"/>
  <text x="1036" y="928" class="label">Atomic / Lock</text>
  <text x="1028" y="952" class="tiny">保护整体操作</text>
  <line x1="234" y1="935" x2="294" y2="935" class="line"/>
  <line x1="444" y1="935" x2="504" y2="935" class="line-red"/>
  <line x1="654" y1="935" x2="742" y2="935" class="line-red"/>
  <line x1="912" y1="935" x2="1000" y2="935" class="line"/>
  <text x="84" y="1032" class="small">volatile 解决观察到哪个值，不解决多个线程如何互斥地修改这个值。</text>

  <rect x="40" y="1132" width="1200" height="82" class="panel"/>
  <text x="68" y="1166" class="panel-title">回答抓手</text>
  <text x="190" y="1166" class="small">同一 volatile 变量的写读同步 -> release/acquire 屏障 -> DCL 安全发布 -> count++ 非原子 -> Atomic/LongAdder/锁选型。</text>
</svg>
