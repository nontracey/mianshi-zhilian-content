<svg width="100%" aria-label="Vue响应式原理流程图" role="img" viewBox="0 0 680 260"><title>Vue响应式原理流程图</title><desc>Vue2 defineProperty vs Vue3 Proxy</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="340" y="24" fill="#042C53" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Vue 响应式原理</text><rect width="280" height="120" x="40" y="52" fill="#E6F1FB" stroke="#378ADD" stroke-width=".5" rx="12"/><text x="180" y="74" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Vue2: Object.defineProperty</text><text x="180" y="94" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">getter: 依赖收集</text><text x="180" y="112" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">setter: 触发更新</text><text x="180" y="132" fill="#993C1D" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">局限:</text><text x="180" y="150" fill="#993C1D" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">无法检测新增/删除属性</text><text x="180" y="164" fill="#993C1D" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">数组下标变化检测不到</text><rect width="280" height="120" x="360" y="52" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".5" rx="12"/><text x="500" y="74" fill="#04342C" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Vue3: Proxy</text><text x="500" y="94" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">拦截整个对象的所有操作</text><text x="500" y="112" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">支持新增/删除属性</text><text x="500" y="132" fill="#0F6E56" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">优势:</text><text x="500" y="150" fill="#0F6E56" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">惰性代理，性能更好</text><text x="500" y="164" fill="#0F6E56" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">支持Map/Set等数据结构</text><rect width="520" height="50" x="80" y="190" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="10"/><text x="340" y="210" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">依赖收集: WeakMap(target) -&gt; Map(key) -&gt; Set(effects)</text><text x="340" y="230" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">触发更新: 遍历Set中的effect重新执行</text></svg>