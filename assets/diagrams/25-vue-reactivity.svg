<svg viewBox="0 0 680 260" width="100%" role="img" aria-label="Vue响应式原理流程图">
<title>Vue响应式原理流程图</title><desc>Vue2 defineProperty vs Vue3 Proxy</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Vue 响应式原理</text>
<rect x="40" y="52" width="280" height="120" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="180" y="74" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Vue2: Object.defineProperty</text>
<text x="180" y="94" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">getter: 依赖收集</text>
<text x="180" y="112" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">setter: 触发更新</text>
<text x="180" y="132" text-anchor="middle" font-size="11" font-weight="500" fill="#993C1D" font-family="system-ui, sans-serif">局限:</text>
<text x="180" y="150" text-anchor="middle" font-size="10" font-weight="400" fill="#993C1D" font-family="system-ui, sans-serif">无法检测新增/删除属性</text>
<text x="180" y="164" text-anchor="middle" font-size="10" font-weight="400" fill="#993C1D" font-family="system-ui, sans-serif">数组下标变化检测不到</text>
<rect x="360" y="52" width="280" height="120" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="500" y="74" text-anchor="middle" font-size="12" font-weight="500" fill="#04342C" font-family="system-ui, sans-serif">Vue3: Proxy</text>
<text x="500" y="94" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">拦截整个对象的所有操作</text>
<text x="500" y="112" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">支持新增/删除属性</text>
<text x="500" y="132" text-anchor="middle" font-size="11" font-weight="500" fill="#0F6E56" font-family="system-ui, sans-serif">优势:</text>
<text x="500" y="150" text-anchor="middle" font-size="10" font-weight="400" fill="#0F6E56" font-family="system-ui, sans-serif">惰性代理，性能更好</text>
<text x="500" y="164" text-anchor="middle" font-size="10" font-weight="400" fill="#0F6E56" font-family="system-ui, sans-serif">支持Map/Set等数据结构</text>
<rect x="80" y="190" width="520" height="50" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="210" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">依赖收集: WeakMap(target) -&gt; Map(key) -&gt; Set(effects)</text>
<text x="340" y="230" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">触发更新: 遍历Set中的effect重新执行</text>
</svg>