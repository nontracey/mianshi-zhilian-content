<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">虚拟线程调度、pinning 与资源边界</title>
  <desc id="desc">展示虚拟线程挂载到 carrier、阻塞时卸载、JDK pinning 版本边界、外部资源限流和观测指标。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5f99"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b24634"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #14213d; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .label { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 14px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .code { font: 600 13px Menlo, Consolas, monospace; fill: #263238; }
      .blue { fill: #e8f4ff; stroke: #6aa9df; stroke-width: 2; rx: 12; }
      .green { fill: #e9f7ef; stroke: #58b77d; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff5d6; stroke: #e0ae35; stroke-width: 2; rx: 12; }
      .red { fill: #fdecea; stroke: #cf5d4b; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #a7b5c4; stroke-width: 2; rx: 12; }
      .line { stroke: #1f5f99; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #b24634; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #7b8794; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">Virtual Threads：等待便宜了，资源仍要限流</text>
  <text x="50" y="86" class="subtitle">JDK 21 正式化；JDK 24 改进 synchronized pinning。线程便宜不代表下游容量无限。</text>

  <rect x="40" y="120" width="1200" height="300" class="panel"/>
  <text x="68" y="156" class="panel-title">1. mount / unmount：阻塞等待时释放 carrier</text>
  <rect x="84" y="210" width="160" height="72" class="blue"/>
  <text x="112" y="238" class="label">请求任务</text>
  <text x="104" y="262" class="tiny">每任务创建 VT</text>
  <rect x="312" y="210" width="170" height="72" class="green"/>
  <text x="344" y="238" class="label">虚拟线程</text>
  <text x="342" y="262" class="tiny">mount 到 carrier</text>
  <rect x="550" y="210" width="170" height="72" class="yellow"/>
  <text x="590" y="238" class="label">阻塞 I/O</text>
  <text x="574" y="262" class="tiny">sleep / park / socket</text>
  <rect x="788" y="210" width="170" height="72" class="green"/>
  <text x="824" y="238" class="label">unmount</text>
  <text x="812" y="262" class="tiny">carrier 跑其他任务</text>
  <rect x="1026" y="210" width="170" height="72" class="blue"/>
  <text x="1064" y="238" class="label">remount</text>
  <text x="1050" y="262" class="tiny">I/O 完成后继续</text>
  <line x1="244" y1="246" x2="312" y2="246" class="line"/>
  <line x1="482" y1="246" x2="550" y2="246" class="line"/>
  <line x1="720" y1="246" x2="788" y2="246" class="line"/>
  <line x1="958" y1="246" x2="1026" y2="246" class="line"/>
  <text x="86" y="354" class="small">收益来自等待期间不长期占用平台线程；CPU 计算仍受核心数限制。</text>

  <rect x="40" y="460" width="585" height="305" class="panel"/>
  <text x="68" y="496" class="panel-title">2. 资源边界：虚拟线程多，下游资源仍有限</text>
  <rect x="78" y="548" width="142" height="68" class="blue"/>
  <text x="110" y="576" class="label">大量 VT</text>
  <text x="104" y="598" class="tiny">请求并发提升</text>
  <rect x="270" y="548" width="142" height="68" class="yellow"/>
  <text x="300" y="576" class="label">Semaphore</text>
  <text x="300" y="598" class="tiny">资源预算</text>
  <rect x="462" y="548" width="122" height="68" class="red"/>
  <text x="494" y="576" class="label">DB / HTTP</text>
  <text x="488" y="598" class="tiny">真实瓶颈</text>
  <line x1="220" y1="582" x2="270" y2="582" class="line"/>
  <line x1="412" y1="582" x2="462" y2="582" class="line-red"/>
  <rect x="78" y="662" width="506" height="52" class="gray"/>
  <text x="104" y="694" class="small">不要用固定虚拟线程池保护资源；用连接池、限流和队列。</text>

  <rect x="655" y="460" width="585" height="305" class="panel"/>
  <text x="683" y="496" class="panel-title">3. pinning 版本边界</text>
  <rect x="692" y="548" width="142" height="68" class="red"/>
  <text x="724" y="576" class="label">JDK 21-23</text>
  <text x="714" y="598" class="tiny">sync 阻塞可 pin</text>
  <rect x="878" y="548" width="142" height="68" class="green"/>
  <text x="914" y="576" class="label">JDK 24+</text>
  <text x="906" y="598" class="tiny">JEP 491 改进</text>
  <rect x="1064" y="548" width="142" height="68" class="yellow"/>
  <text x="1090" y="576" class="label">仍要排查</text>
  <text x="1084" y="598" class="tiny">native / 长锁</text>
  <line x1="834" y1="582" x2="878" y2="582" class="line"/>
  <line x1="1020" y1="582" x2="1064" y2="582" class="line-red"/>
  <rect x="692" y="662" width="514" height="52" class="gray"/>
  <text x="720" y="694" class="small">不要把 Java 21 的 synchronized 建议无条件套到 Java 24+。</text>

  <rect x="40" y="805" width="1200" height="285" class="panel"/>
  <text x="68" y="841" class="panel-title">4. 观测和迁移检查</text>
  <rect x="84" y="900" width="160" height="70" class="blue"/>
  <text x="122" y="928" class="label">JFR</text>
  <text x="104" y="952" class="tiny">VirtualThreadPinned</text>
  <rect x="314" y="900" width="160" height="70" class="green"/>
  <text x="344" y="928" class="label">thread dump</text>
  <text x="344" y="952" class="tiny">虚拟线程堆栈</text>
  <rect x="544" y="900" width="160" height="70" class="yellow"/>
  <text x="580" y="928" class="label">连接池等待</text>
  <text x="576" y="952" class="tiny">DB / HTTP</text>
  <rect x="774" y="900" width="160" height="70" class="red"/>
  <text x="806" y="928" class="label">ThreadLocal</text>
  <text x="802" y="952" class="tiny">大对象内存</text>
  <rect x="1004" y="900" width="160" height="70" class="gray"/>
  <text x="1040" y="928" class="label">延迟分布</text>
  <text x="1030" y="952" class="tiny">P95 / P99</text>
  <line x1="244" y1="935" x2="314" y2="935" class="line"/>
  <line x1="474" y1="935" x2="544" y2="935" class="line"/>
  <line x1="704" y1="935" x2="774" y2="935" class="line-red"/>
  <line x1="934" y1="935" x2="1004" y2="935" class="line"/>
  <text x="86" y="1030" class="small">上线验证看瓶颈是否从线程池迁移到资源池、锁、上下文或下游超时。</text>

  <rect x="40" y="1132" width="1200" height="82" class="panel"/>
  <text x="68" y="1166" class="panel-title">回答抓手</text>
  <text x="190" y="1166" class="small">JDK 21 正式 -> mount/unmount -> I/O 适合/CPU 不加速 -> 不池化 -> 资源限流 -> JDK 24 pinning 变化 -> JFR/线程 dump。</text>
</svg>
