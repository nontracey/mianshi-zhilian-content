<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">Reactor 模式的事件分发、线程模型与 Proactor 对比</title>
  <desc id="desc">展示 Reactor 通过多路复用等待 fd readiness，再分发给 handler 进行 read/write；对比单 Reactor、多线程 Reactor、主从 Reactor，以及 Proactor completion 语义。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .h2 { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 700 14px "SFMono-Regular", Consolas, monospace; fill: #0f172a; }
      .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .green { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; }
      .red { fill: #fef2f2; stroke: #f87171; stroke-width: 2; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
      .violet { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .warnArrow { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#warnArrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="warnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="660" y="55" text-anchor="middle">Reactor：等的是“可读可写”，搬数据和业务仍在应用侧</text>
  <text class="subtitle" x="660" y="88" text-anchor="middle">多路复用发现 readiness → Reactor 分发事件 → Handler read/write → 慢业务交给 worker</text>

  <rect class="panel" x="58" y="120" width="1204" height="340" rx="10"/>
  <text class="h2" x="90" y="160">1. 单 Reactor 事件循环：一个线程串起 accept、read/write 和 handler</text>
  <rect class="blue" x="95" y="215" width="190" height="82" rx="8"/>
  <text class="label" x="190" y="245" text-anchor="middle">client fds</text>
  <text class="tiny" x="190" y="272" text-anchor="middle">listen / conn1 / conn2...</text>
  <path class="arrow" d="M288 256 H350"/>
  <rect class="green" x="355" y="215" width="220" height="82" rx="8"/>
  <text class="label" x="465" y="245" text-anchor="middle">select/poll/epoll</text>
  <text class="tiny" x="465" y="272" text-anchor="middle">返回 ready fd 集合</text>
  <path class="arrow" d="M578 256 H640"/>
  <rect class="amber" x="645" y="215" width="220" height="82" rx="8"/>
  <text class="label" x="755" y="245" text-anchor="middle">Reactor dispatch</text>
  <text class="tiny" x="755" y="272" text-anchor="middle">按 fd 找 handler</text>
  <path class="arrow" d="M868 256 H930"/>
  <rect class="violet" x="935" y="215" width="220" height="82" rx="8"/>
  <text class="label" x="1045" y="245" text-anchor="middle">Handler</text>
  <text class="tiny" x="1045" y="272" text-anchor="middle">accept/read/write/business</text>
  <rect class="red" x="355" y="345" width="800" height="52" rx="8"/>
  <text class="text" x="755" y="378" text-anchor="middle">风险：handler 里做慢 DB/RPC/CPU 任务会阻塞事件循环，拖慢所有连接</text>

  <rect class="panel" x="58" y="500" width="1204" height="330" rx="10"/>
  <text class="h2" x="90" y="540">2. 三种线程模型：瓶颈从业务阻塞逐步迁移到 Reactor 分片</text>
  <rect class="gray" x="95" y="595" width="315" height="150" rx="8"/>
  <text class="label" x="252" y="628" text-anchor="middle">单 Reactor 单线程</text>
  <text class="tiny" x="252" y="662" text-anchor="middle">accept + IO + business 都在一条 loop</text>
  <text class="tiny" x="252" y="692" text-anchor="middle">简单；慢 handler 会卡全局</text>
  <rect class="blue" x="502" y="595" width="315" height="150" rx="8"/>
  <text class="label" x="659" y="628" text-anchor="middle">单 Reactor 多线程</text>
  <text class="tiny" x="659" y="662" text-anchor="middle">Reactor 负责 IO，就绪事件丢 worker</text>
  <text class="tiny" x="659" y="692" text-anchor="middle">业务不堵 IO；单 Reactor 仍可能瓶颈</text>
  <rect class="green" x="910" y="595" width="285" height="150" rx="8"/>
  <text class="label" x="1052" y="628" text-anchor="middle">主从 Reactor</text>
  <text class="tiny" x="1052" y="662" text-anchor="middle">Main accept，Sub 分片处理连接 IO</text>
  <text class="tiny" x="1052" y="692" text-anchor="middle">Netty Boss/Worker，Nginx workers</text>

  <rect class="panel" x="58" y="870" width="1204" height="330" rx="10"/>
  <text class="h2" x="90" y="910">3. Reactor vs Proactor：通知“能读”还是通知“读完”</text>
  <rect class="amber" x="95" y="970" width="470" height="108" rx="8"/>
  <text class="label" x="330" y="1002" text-anchor="middle">Reactor readiness</text>
  <text class="text" x="330" y="1032" text-anchor="middle">内核通知 fd 可读/可写，应用再调用 read/write</text>
  <text class="tiny" x="330" y="1058" text-anchor="middle">epoll/kqueue/select；第二阶段数据拷贝仍由调用线程完成</text>
  <rect class="green" x="640" y="970" width="470" height="108" rx="8"/>
  <text class="label" x="875" y="1002" text-anchor="middle">Proactor completion</text>
  <text class="text" x="875" y="1032" text-anchor="middle">提交异步读写，完成后收到结果和状态</text>
  <text class="tiny" x="875" y="1058" text-anchor="middle">Windows IOCP；Linux io_uring 提供 completion 风格接口</text>
  <rect class="red" x="95" y="1128" width="1015" height="52" rx="8"/>
  <text class="text" x="602" y="1161" text-anchor="middle">线上验证：event loop lag、ready backlog、worker 队列、慢 handler、accept 分布、P99 延迟和连接错误率</text>
</svg>
