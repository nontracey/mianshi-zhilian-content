<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">Reactor 模式的事件分发、线程模型与 Proactor 对比</title><desc id="desc">展示 Reactor 通过多路复用等待 fd readiness，再分发给 handler 进行 read/write；对比单 Reactor、多线程 Reactor、主从 Reactor，以及 Proactor completion 语义。</desc><defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:600 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.h2{font:700 24px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:700 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:600 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.amber,.blue,.green{stroke-width:2}.blue,.green{fill:#eff6ff;stroke:#60a5fa}.green{fill:#ecfdf5;stroke:#34d399}.amber{fill:#fffbeb;stroke:#f59e0b}.gray{stroke-width:2}.red{fill:#fef2f2;stroke:#f87171}.red,.violet{stroke-width:2}.gray{fill:#f1f5f9;stroke:#cbd5e1}.violet{fill:#f5f3ff;stroke:#a78bfa}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#2563eb" d="M2,2 L10,6 L2,10 Z"/></marker><marker id="warnArrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#dc2626" d="M2,2 L10,6 L2,10 Z"/></marker></defs><rect width="1320" height="1320" class="bg"/><text x="660" y="55" class="title" text-anchor="middle">Reactor：等的是“可读可写”，搬数据和业务仍在应用侧</text><text x="660" y="88" class="subtitle" text-anchor="middle">多路复用发现 readiness → Reactor 分发事件 → Handler read/write → 慢业务交给 worker</text><rect width="1204" height="340" x="58" y="120" class="panel" rx="10"/><text x="90" y="160" class="h2">1. 单 Reactor 事件循环：一个线程串起 accept、read/write 和 handler</text><rect width="190" height="82" x="95" y="215" class="blue" rx="8"/><text x="190" y="245" class="label" text-anchor="middle">client fds</text><text x="190" y="272" class="tiny" text-anchor="middle">listen / conn1 / conn2...</text><path d="M288 256 H350" class="arrow"/><rect width="220" height="82" x="355" y="215" class="green" rx="8"/><text x="465" y="245" class="label" text-anchor="middle">select/poll/epoll</text><text x="465" y="272" class="tiny" text-anchor="middle">返回 ready fd 集合</text><path d="M578 256 H640" class="arrow"/><rect width="220" height="82" x="645" y="215" class="amber" rx="8"/><text x="755" y="245" class="label" text-anchor="middle">Reactor dispatch</text><text x="755" y="272" class="tiny" text-anchor="middle">按 fd 找 handler</text><path d="M868 256 H930" class="arrow"/><rect width="220" height="82" x="935" y="215" class="violet" rx="8"/><text x="1045" y="245" class="label" text-anchor="middle">Handler</text><text x="1045" y="272" class="tiny" text-anchor="middle">accept/read/write/business</text><rect width="800" height="52" x="355" y="345" class="red" rx="8"/><text x="755" y="378" class="text" text-anchor="middle">风险：handler 里做慢 DB/RPC/CPU 任务会阻塞事件循环，拖慢所有连接</text><rect width="1204" height="330" x="58" y="500" class="panel" rx="10"/><text x="90" y="540" class="h2">2. 三种线程模型：瓶颈从业务阻塞逐步迁移到 Reactor 分片</text><rect width="315" height="150" x="95" y="595" class="gray" rx="8"/><text x="252" y="628" class="label" text-anchor="middle">单 Reactor 单线程</text><text x="252" y="662" class="tiny" text-anchor="middle">accept + IO + business 都在一条 loop</text><text x="252" y="692" class="tiny" text-anchor="middle">简单；慢 handler 会卡全局</text><rect width="315" height="150" x="502" y="595" class="blue" rx="8"/><text x="659" y="628" class="label" text-anchor="middle">单 Reactor 多线程</text><text x="659" y="662" class="tiny" text-anchor="middle">Reactor 负责 IO，就绪事件丢 worker</text><text x="659" y="692" class="tiny" text-anchor="middle">业务不堵 IO；单 Reactor 仍可能瓶颈</text><rect width="285" height="150" x="910" y="595" class="green" rx="8"/><text x="1052" y="628" class="label" text-anchor="middle">主从 Reactor</text><text x="1052" y="662" class="tiny" text-anchor="middle">Main accept，Sub 分片处理连接 IO</text><text x="1052" y="692" class="tiny" text-anchor="middle">Netty Boss/Worker，Nginx workers</text><rect width="1204" height="330" x="58" y="870" class="panel" rx="10"/><text x="90" y="910" class="h2">3. Reactor vs Proactor：通知“能读”还是通知“读完”</text><rect width="470" height="108" x="95" y="970" class="amber" rx="8"/><text x="330" y="1002" class="label" text-anchor="middle">Reactor readiness</text><text x="330" y="1032" class="text" text-anchor="middle">内核通知 fd 可读/可写，应用再调用 read/write</text><text x="330" y="1058" class="tiny" text-anchor="middle">epoll/kqueue/select；第二阶段数据拷贝仍由调用线程完成</text><rect width="470" height="108" x="640" y="970" class="green" rx="8"/><text x="875" y="1002" class="label" text-anchor="middle">Proactor completion</text><text x="875" y="1032" class="text" text-anchor="middle">提交异步读写，完成后收到结果和状态</text><text x="875" y="1058" class="tiny" text-anchor="middle">Windows IOCP；Linux io_uring 提供 completion 风格接口</text><rect width="1015" height="52" x="95" y="1128" class="red" rx="8"/><text x="602" y="1161" class="text" text-anchor="middle">线上验证：event loop lag、ready backlog、worker 队列、慢 handler、accept 分布、P99 延迟和连接错误率</text></svg>