<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">Java generics: compile-time checks, erasure, PECS, type tokens, and heap pollution</title>
  <desc id="desc">A topic-specific diagram explaining Java generics as compile-time type checking plus runtime erasure, with bridge methods, retained Signature metadata, PECS wildcard choice, runtime type token workaround, and heap pollution from raw types.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 33px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-red { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .arrow-green { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="70" y="64">Java 泛型：编译期强类型，运行时擦除</text>
  <text class="subtitle" x="70" y="96">回答泛型题要同时讲收益、擦除实现、PECS、运行时类型令牌、桥接方法和堆污染。</text>

  <rect class="section" x="70" y="130" width="1180" height="315" rx="16"/>
  <text class="section-title" x="96" y="166">1. 编译期发生的事</text>

  <rect class="blue" x="105" y="215" width="225" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="247">源码</text>
  <text class="mono" x="132" y="272">List&lt;String&gt; names</text>
  <text class="text" x="132" y="292">类型参数让 API 意图明确</text>

  <rect class="green" x="390" y="215" width="235" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="417" y="247">编译器检查</text>
  <text class="text" x="417" y="272">禁止 add(Integer)</text>
  <text class="text" x="417" y="292">读取处插入必要强转</text>

  <rect class="yellow" x="685" y="215" width="235" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="712" y="247">类型擦除</text>
  <text class="mono" x="712" y="272">T -&gt; Object / 上界</text>
  <text class="text" x="712" y="292">生成的字节码主要是原始类型</text>

  <rect class="violet" x="980" y="215" width="220" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="1007" y="247">桥接方法</text>
  <text class="text" x="1007" y="272">泛型重写后保持多态</text>
  <text class="mono" x="1007" y="292">bridge method</text>

  <path class="arrow-blue" d="M330 259 H381"/>
  <path class="arrow-blue" d="M625 259 H676"/>
  <path class="arrow-green" d="M920 259 H971"/>

  <rect class="red" x="145" y="340" width="1015" height="62" rx="14" stroke-width="2"/>
  <text class="box-title" x="172" y="369">直接后果</text>
  <text class="text" x="172" y="392">`new T()`、`new T[]`、`obj instanceof List&lt;String&gt;`、`List&lt;int&gt;`、泛型异常类/`catch (T e)` 都不可行或受限。</text>

  <rect class="section" x="70" y="485" width="560" height="335" rx="16"/>
  <text class="section-title" x="96" y="521">2. PECS：读写方向决定通配符</text>

  <rect class="green" x="105" y="570" width="220" height="96" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="602">Producer Extends</text>
  <text class="mono" x="132" y="627">List&lt;? extends Number&gt;</text>
  <text class="text" x="132" y="647">能读 Number，不能安全 add</text>

  <rect class="yellow" x="365" y="570" width="220" height="96" rx="12" stroke-width="2"/>
  <text class="box-title" x="392" y="602">Consumer Super</text>
  <text class="mono" x="392" y="627">List&lt;? super Integer&gt;</text>
  <text class="text" x="392" y="647">能写 Integer，读出是 Object</text>

  <rect class="blue" x="105" y="710" width="480" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="740">典型签名</text>
  <text class="mono" x="132" y="764">Collections.copy(List&lt;? super T&gt; dest, List&lt;? extends T&gt; src)</text>

  <rect class="section" x="690" y="485" width="560" height="335" rx="16"/>
  <text class="section-title" x="716" y="521">3. 运行时想拿类型：显式传，或让父类签名保留</text>

  <rect class="blue" x="725" y="570" width="220" height="96" rx="12" stroke-width="2"/>
  <text class="box-title" x="752" y="602">Class&lt;T&gt; 类型令牌</text>
  <text class="mono" x="752" y="627">Array.newInstance(type,n)</text>
  <text class="text" x="752" y="647">创建数组、反射构造对象</text>

  <rect class="green" x="985" y="570" width="220" height="96" rx="12" stroke-width="2"/>
  <text class="box-title" x="1012" y="602">TypeRef / TypeToken</text>
  <text class="mono" x="1012" y="627">new TypeRef&lt;List&lt;String&gt;&gt;(){}</text>
  <text class="text" x="1012" y="647">通过超类 Signature 取 Type</text>

  <rect class="red" x="725" y="710" width="480" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="752" y="740">注意边界</text>
  <text class="text" x="752" y="764">局部变量的泛型实参运行时不可直接拿；框架靠字段/方法签名或超类型令牌保留。</text>

  <rect class="section" x="70" y="860" width="1180" height="245" rx="16"/>
  <text class="section-title" x="96" y="896">4. 堆污染：绕过编译期检查后，异常常在取出时才爆</text>

  <rect class="yellow" x="105" y="945" width="255" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="977">Raw type / 反射</text>
  <text class="mono" x="132" y="1002">List raw = strings</text>
  <text class="text" x="132" y="1022">绕过 add 类型检查</text>

  <rect class="red" x="425" y="945" width="255" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="452" y="977">heap pollution</text>
  <text class="mono" x="452" y="1002">raw.add(123)</text>
  <text class="text" x="452" y="1022">List&lt;String&gt; 混入 Integer</text>

  <rect class="violet" x="745" y="945" width="255" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="772" y="977">隐式强转</text>
  <text class="mono" x="772" y="1002">String s = list.get(0)</text>
  <text class="text" x="772" y="1022">编译器插入 cast</text>

  <rect class="red" x="1065" y="945" width="145" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="1092" y="977">结果</text>
  <text class="mono" x="1092" y="1002">ClassCastException</text>

  <path class="arrow-red" d="M360 989 H416"/>
  <path class="arrow-red" d="M680 989 H736"/>
  <path class="arrow-red" d="M1000 989 H1056"/>

  <text class="small" x="105" y="1070">定位思路：看 unchecked 警告、raw type、反射写入、JSON 反序列化缺少 TypeReference、以及异常堆栈里的实际类型与期望类型。</text>

  <text class="small" x="96" y="1238">面试抓手：先用“编译器做检查，字节码擦除”定调，再补 PECS、类型令牌、桥接方法和堆污染；别把泛型说成运行时真实存在的类型参数。</text>
</svg>
