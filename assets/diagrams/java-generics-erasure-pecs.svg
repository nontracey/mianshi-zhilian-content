<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">Java generics: compile-time checks, erasure, PECS, type tokens, and heap pollution</title><desc id="desc">A topic-specific diagram explaining Java generics as compile-time type checking plus runtime erasure, with bridge methods, retained Signature metadata, PECS wildcard choice, runtime type token workaround, and heap pollution from raw types.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 33px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.section{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.arrow-blue{stroke:#2563eb;marker-end:url(#arrow-blue)}.arrow-blue,.arrow-green,.arrow-red{stroke-width:3;fill:none}.arrow-red{stroke:#dc2626;marker-end:url(#arrow-red)}.arrow-green{stroke:#16a34a;marker-end:url(#arrow-green)}</style></defs><rect width="1320" height="1320" class="bg"/><text x="70" y="64" class="title">Java 泛型：编译期强类型，运行时擦除</text><text x="70" y="96" class="subtitle">回答泛型题要同时讲收益、擦除实现、PECS、运行时类型令牌、桥接方法和堆污染。</text><rect width="1180" height="315" x="70" y="130" class="section" rx="16"/><text x="96" y="166" class="section-title">1. 编译期发生的事</text><rect width="225" height="88" x="105" y="215" stroke-width="2" class="blue" rx="12"/><text x="132" y="247" class="box-title">源码</text><text x="132" y="272" class="mono">List&lt;String&gt; names</text><text x="132" y="292" class="text">类型参数让 API 意图明确</text><rect width="235" height="88" x="390" y="215" stroke-width="2" class="green" rx="12"/><text x="417" y="247" class="box-title">编译器检查</text><text x="417" y="272" class="text">禁止 add(Integer)</text><text x="417" y="292" class="text">读取处插入必要强转</text><rect width="235" height="88" x="685" y="215" stroke-width="2" class="yellow" rx="12"/><text x="712" y="247" class="box-title">类型擦除</text><text x="712" y="272" class="mono">T -&gt; Object / 上界</text><text x="712" y="292" class="text">生成的字节码主要是原始类型</text><rect width="220" height="88" x="980" y="215" stroke-width="2" class="violet" rx="12"/><text x="1007" y="247" class="box-title">桥接方法</text><text x="1007" y="272" class="text">泛型重写后保持多态</text><text x="1007" y="292" class="mono">bridge method</text><path d="M330 259 H381" class="arrow-blue"/><path d="M625 259 H676" class="arrow-blue"/><path d="M920 259 H971" class="arrow-green"/><rect width="1015" height="62" x="145" y="340" stroke-width="2" class="red" rx="14"/><text x="172" y="369" class="box-title">直接后果</text><text x="172" y="392" class="text">`new T()`、`new T[]`、`obj instanceof List&lt;String&gt;`、`List&lt;int&gt;`、泛型异常类/`catch (T e)` 都不可行或受限。</text><rect width="560" height="335" x="70" y="485" class="section" rx="16"/><text x="96" y="521" class="section-title">2. PECS：读写方向决定通配符</text><rect width="220" height="96" x="105" y="570" stroke-width="2" class="green" rx="12"/><text x="132" y="602" class="box-title">Producer Extends</text><text x="132" y="627" class="mono">List&lt;? extends Number&gt;</text><text x="132" y="647" class="text">能读 Number，不能安全 add</text><rect width="220" height="96" x="365" y="570" stroke-width="2" class="yellow" rx="12"/><text x="392" y="602" class="box-title">Consumer Super</text><text x="392" y="627" class="mono">List&lt;? super Integer&gt;</text><text x="392" y="647" class="text">能写 Integer，读出是 Object</text><rect width="480" height="70" x="105" y="710" stroke-width="2" class="blue" rx="12"/><text x="132" y="740" class="box-title">典型签名</text><text x="132" y="764" class="mono">Collections.copy(List&lt;? super T&gt; dest, List&lt;? extends T&gt; src)</text><rect width="560" height="335" x="690" y="485" class="section" rx="16"/><text x="716" y="521" class="section-title">3. 运行时想拿类型：显式传，或让父类签名保留</text><rect width="220" height="96" x="725" y="570" stroke-width="2" class="blue" rx="12"/><text x="752" y="602" class="box-title">Class&lt;T&gt; 类型令牌</text><text x="752" y="627" class="mono">Array.newInstance(type,n)</text><text x="752" y="647" class="text">创建数组、反射构造对象</text><rect width="220" height="96" x="985" y="570" stroke-width="2" class="green" rx="12"/><text x="1012" y="602" class="box-title">TypeRef / TypeToken</text><text x="1012" y="627" class="mono">new TypeRef&lt;List&lt;String&gt;&gt;(){}</text><text x="1012" y="647" class="text">通过超类 Signature 取 Type</text><rect width="480" height="70" x="725" y="710" stroke-width="2" class="red" rx="12"/><text x="752" y="740" class="box-title">注意边界</text><text x="752" y="764" class="text">局部变量的泛型实参运行时不可直接拿；框架靠字段/方法签名或超类型令牌保留。</text><rect width="1180" height="245" x="70" y="860" class="section" rx="16"/><text x="96" y="896" class="section-title">4. 堆污染：绕过编译期检查后，异常常在取出时才爆</text><rect width="255" height="88" x="105" y="945" stroke-width="2" class="yellow" rx="12"/><text x="132" y="977" class="box-title">Raw type / 反射</text><text x="132" y="1002" class="mono">List raw = strings</text><text x="132" y="1022" class="text">绕过 add 类型检查</text><rect width="255" height="88" x="425" y="945" stroke-width="2" class="red" rx="12"/><text x="452" y="977" class="box-title">heap pollution</text><text x="452" y="1002" class="mono">raw.add(123)</text><text x="452" y="1022" class="text">List&lt;String&gt; 混入 Integer</text><rect width="255" height="88" x="745" y="945" stroke-width="2" class="violet" rx="12"/><text x="772" y="977" class="box-title">隐式强转</text><text x="772" y="1002" class="mono">String s = list.get(0)</text><text x="772" y="1022" class="text">编译器插入 cast</text><rect width="145" height="88" x="1065" y="945" stroke-width="2" class="red" rx="12"/><text x="1092" y="977" class="box-title">结果</text><text x="1092" y="1002" class="mono">ClassCastException</text><path d="M360 989 H416" class="arrow-red"/><path d="M680 989 H736" class="arrow-red"/><path d="M1000 989 H1056" class="arrow-red"/><text x="105" y="1070" class="small">定位思路：看 unchecked 警告、raw type、反射写入、JSON 反序列化缺少 TypeReference、以及异常堆栈里的实际类型与期望类型。</text><text x="96" y="1238" class="small">面试抓手：先用“编译器做检查，字节码擦除”定调，再补 PECS、类型令牌、桥接方法和堆污染；别把泛型说成运行时真实存在的类型参数。</text></svg>