<svg viewBox="0 0 780 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Go slice 与 map 底层结构">
<title>Go slice header 与 map bucket 结构</title><desc>slice 是 {array 指针, len, cap} 三字头指向底层数组；map 是 hmap 指向 buckets 数组，每个 bucket 存 8 组 tophash/key/value 并用 overflow 串联。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<!-- slice -->
<text x="20" y="28" font-size="14" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">slice = 三字头（值传递时只拷贝头，共享底层数组）</text>
<rect x="24" y="42" width="180" height="86" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.6"/>
<text x="114" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">slice header</text>
<text x="36" y="80" font-size="11.5" fill="#2C2C2A" font-family="ui-monospace, monospace">array  ●───────────►</text>
<text x="36" y="100" font-size="11.5" fill="#2C2C2A" font-family="ui-monospace, monospace">len = 3</text>
<text x="36" y="118" font-size="11.5" fill="#2C2C2A" font-family="ui-monospace, monospace">cap = 5</text>
<g font-family="ui-monospace, monospace" font-size="12">
<rect x="300" y="56" width="56" height="40" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.6"/><text x="328" y="80" text-anchor="middle" fill="#04342C">a[0]</text>
<rect x="356" y="56" width="56" height="40" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.6"/><text x="384" y="80" text-anchor="middle" fill="#04342C">a[1]</text>
<rect x="412" y="56" width="56" height="40" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.6"/><text x="440" y="80" text-anchor="middle" fill="#04342C">a[2]</text>
<rect x="468" y="56" width="56" height="40" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.6"/><text x="496" y="80" text-anchor="middle" fill="#8a8880">·</text>
<rect x="524" y="56" width="56" height="40" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.6"/><text x="552" y="80" text-anchor="middle" fill="#8a8880">·</text>
</g>
<line x1="204" y1="74" x2="298" y2="76" stroke="#378ADD" stroke-width="1.4" marker-end="url(#a)"/>
<text x="384" y="116" text-anchor="middle" font-size="10.5" fill="#1D9E75" font-family="system-ui, sans-serif">len 之内可见</text>
<text x="524" y="116" text-anchor="middle" font-size="10.5" fill="#8a8880" font-family="system-ui, sans-serif">cap 余量：append 不超 cap 不扩容</text>
<text x="600" y="80" font-size="10.5" fill="#5F5E5A" font-family="system-ui, sans-serif">超 cap →</text>
<text x="600" y="95" font-size="10.5" fill="#5F5E5A" font-family="system-ui, sans-serif">分配新数组</text>
<text x="600" y="110" font-size="10.5" fill="#5F5E5A" font-family="system-ui, sans-serif">并复制</text>
<!-- map -->
<text x="20" y="176" font-size="14" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">map = *hmap →  buckets 数组（哈希低 B 位选桶，高 8 位做 tophash 快筛）</text>
<rect x="24" y="190" width="170" height="92" rx="8" fill="#FEF3E2" stroke="#BA7517" stroke-width="0.6"/>
<text x="109" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#7A4D0E" font-family="system-ui, sans-serif">hmap</text>
<text x="36" y="228" font-size="11.5" fill="#7A4D0E" font-family="ui-monospace, monospace">count (len)</text>
<text x="36" y="246" font-size="11.5" fill="#7A4D0E" font-family="ui-monospace, monospace">B  (桶数=2^B)</text>
<text x="36" y="264" font-size="11.5" fill="#7A4D0E" font-family="ui-monospace, monospace">buckets ●──────►</text>
<rect x="250" y="190" width="44" height="92" rx="4" fill="#FCEFD6" stroke="#BA7517" stroke-width="0.6"/><text x="272" y="240" text-anchor="middle" font-size="10" fill="#7A4D0E" font-family="system-ui, sans-serif" transform="rotate(-90 272 240)">buckets[]</text>
<line x1="194" y1="259" x2="248" y2="236" stroke="#BA7517" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="340" y="186" width="300" height="118" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.6"/>
<text x="490" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">一个 bucket（bmap，8 槽）</text>
<text x="352" y="226" font-size="11" fill="#2C2C2A" font-family="ui-monospace, monospace">tophash: [h0 h1 h2 … h7]</text>
<text x="352" y="248" font-size="11" fill="#2C2C2A" font-family="ui-monospace, monospace">keys:    [k0 k1 … ]   (键聚拢存)</text>
<text x="352" y="270" font-size="11" fill="#2C2C2A" font-family="ui-monospace, monospace">values:  [v0 v1 … ]   (值聚拢存)</text>
<text x="352" y="292" font-size="11" fill="#C0392B" font-family="ui-monospace, monospace">overflow ●─► 溢出桶（链式解冲突）</text>
<text x="490" y="324" text-anchor="middle" font-size="10.5" fill="#5F5E5A" font-family="system-ui, sans-serif">装载因子 &gt;6.5 触发翻倍扩容，渐进式搬迁；map 非线程安全、遍历无序、元素不可取址</text>
<line x1="640" y1="280" x2="690" y2="280" stroke="#C0392B" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="694" y="262" width="60" height="40" rx="6" fill="#fff" stroke="#C0392B" stroke-width="0.6"/><text x="724" y="286" text-anchor="middle" font-size="10.5" fill="#922B21" font-family="system-ui, sans-serif">overflow</text>
</svg>
