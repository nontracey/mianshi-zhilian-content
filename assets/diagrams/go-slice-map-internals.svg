<svg xmlns="http://www.w3.org/2000/svg" width="100%" aria-label="Go slice 与 map 底层结构" role="img" viewBox="0 0 780 430"><title>Go slice header 与 map bucket 结构</title><desc>slice 是 {array 指针, len, cap} 三字头指向底层数组；map 是 hmap 指向 buckets 数组，每个 bucket 存 8 组 tophash/key/value 并用 overflow 串联。</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="20" y="28" fill="#042C53" font-family="system-ui, sans-serif" font-size="14" font-weight="600">slice = 三字头（值传递时只拷贝头，共享底层数组）</text><rect width="180" height="86" x="24" y="42" fill="#E6F1FB" stroke="#378ADD" stroke-width=".6" rx="8"/><text x="114" y="60" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">slice header</text><text x="36" y="80" fill="#2C2C2A" font-family="ui-monospace, monospace" font-size="11.5">array ●───────────►</text><text x="36" y="100" fill="#2C2C2A" font-family="ui-monospace, monospace" font-size="11.5">len = 3</text><text x="36" y="118" fill="#2C2C2A" font-family="ui-monospace, monospace" font-size="11.5">cap = 5</text><g font-family="ui-monospace, monospace" font-size="12"><rect width="56" height="40" x="300" y="56" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".6"/><text x="328" y="80" fill="#04342C" text-anchor="middle">a[0]</text><rect width="56" height="40" x="356" y="56" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".6"/><text x="384" y="80" fill="#04342C" text-anchor="middle">a[1]</text><rect width="56" height="40" x="412" y="56" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".6"/><text x="440" y="80" fill="#04342C" text-anchor="middle">a[2]</text><rect width="56" height="40" x="468" y="56" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".6"/><text x="496" y="80" fill="#8a8880" text-anchor="middle">·</text><rect width="56" height="40" x="524" y="56" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".6"/><text x="552" y="80" fill="#8a8880" text-anchor="middle">·</text></g><line x1="204" x2="298" y1="74" y2="76" stroke="#378ADD" stroke-width="1.4" marker-end="url(#a)"/><text x="384" y="116" fill="#1D9E75" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">len 之内可见</text><text x="524" y="116" fill="#8a8880" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">cap 余量：append 不超 cap 不扩容</text><text x="600" y="80" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10.5">超 cap →</text><text x="600" y="95" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10.5">分配新数组</text><text x="600" y="110" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10.5">并复制</text><text x="20" y="176" fill="#042C53" font-family="system-ui, sans-serif" font-size="14" font-weight="600">map = *hmap → buckets 数组（哈希低 B 位选桶，高 8 位做 tophash 快筛）</text><rect width="170" height="92" x="24" y="190" fill="#FEF3E2" stroke="#BA7517" stroke-width=".6" rx="8"/><text x="109" y="208" fill="#7A4D0E" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">hmap</text><text x="36" y="228" fill="#7A4D0E" font-family="ui-monospace, monospace" font-size="11.5">count (len)</text><text x="36" y="246" fill="#7A4D0E" font-family="ui-monospace, monospace" font-size="11.5">B (桶数=2^B)</text><text x="36" y="264" fill="#7A4D0E" font-family="ui-monospace, monospace" font-size="11.5">buckets ●──────►</text><rect width="44" height="92" x="250" y="190" fill="#FCEFD6" stroke="#BA7517" stroke-width=".6" rx="4"/><text x="272" y="240" fill="#7A4D0E" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" transform="rotate(-90 272 240)">buckets[]</text><line x1="194" x2="248" y1="259" y2="236" stroke="#BA7517" stroke-width="1.4" marker-end="url(#a)"/><rect width="300" height="118" x="340" y="186" fill="#E6F1FB" stroke="#378ADD" stroke-width=".6" rx="8"/><text x="490" y="204" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">一个 bucket（bmap，8 槽）</text><text x="352" y="226" fill="#2C2C2A" font-family="ui-monospace, monospace" font-size="11">tophash: [h0 h1 h2 … h7]</text><text x="352" y="248" fill="#2C2C2A" font-family="ui-monospace, monospace" font-size="11">keys: [k0 k1 … ] (键聚拢存)</text><text x="352" y="270" fill="#2C2C2A" font-family="ui-monospace, monospace" font-size="11">values: [v0 v1 … ] (值聚拢存)</text><text x="352" y="292" fill="#C0392B" font-family="ui-monospace, monospace" font-size="11">overflow ●─► 溢出桶（链式解冲突）</text><text x="490" y="324" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">装载因子 &gt;6.5 触发翻倍扩容，渐进式搬迁；map 非线程安全、遍历无序、元素不可取址</text><line x1="640" x2="690" y1="280" y2="280" stroke="#C0392B" stroke-width="1.4" marker-end="url(#a)"/><rect width="60" height="40" x="694" y="262" fill="#fff" stroke="#C0392B" stroke-width=".6" rx="6"/><text x="724" y="286" fill="#922B21" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">overflow</text></svg>