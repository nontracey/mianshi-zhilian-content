<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500" role="img" aria-labelledby="title desc">
  <title id="title">Java class loading lifecycle, delegation and diagnostics</title>
  <desc id="desc">A topic-specific diagram explaining Java class loading lifecycle, linking stages, class initialization triggers, Java 9+ class loader hierarchy, parent delegation, delegation break scenarios, and ClassLoader leak diagnostics.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .gray { fill: #e5e7eb; stroke: #94a3b8; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="1500"/>
  <g transform="translate(70 0)">
    <text class="title" x="70" y="66">类加载机制：生命周期、委派与隔离</text>
    <text class="subtitle" x="70" y="98">把“类何时初始化”和“谁定义这个类”拆开讲；再落到 SPI、Web 容器和 ClassLoader 泄漏排查。</text>

    <rect class="panel" x="70" y="130" width="1220" height="305" rx="16"/>
    <text class="section" x="96" y="168">1. 生命周期：loading -> linking -> initialization</text>

    <rect class="blue" x="105" y="225" width="190" height="74" rx="12" stroke-width="2"/>
    <text class="box-title" x="132" y="256">Loading</text>
    <text class="text" x="132" y="280">读取 class 字节流</text>

    <path class="arrow" d="M300 262 H350"/>

    <rect class="yellow" x="365" y="205" width="270" height="114" rx="12" stroke-width="2"/>
    <text class="box-title" x="392" y="238">Linking</text>
    <text class="text" x="392" y="263">Verify：格式/元数据/字节码</text>
    <text class="text" x="392" y="286">Prepare：static 零值或 ConstantValue</text>
    <text class="text" x="392" y="309">Resolve：符号引用可延迟解析</text>

    <path class="arrow" d="M640 262 H690"/>

    <rect class="green" x="705" y="225" width="245" height="74" rx="12" stroke-width="2"/>
    <text class="box-title" x="732" y="256">Initialization</text>
    <text class="text" x="732" y="280">执行 &lt;clinit&gt;，父类先初始化</text>

    <rect class="violet" x="995" y="225" width="230" height="74" rx="12" stroke-width="2"/>
    <text class="box-title" x="1022" y="256">Active use</text>
    <text class="text" x="1022" y="276">new/getstatic/putstatic</text>
    <text class="text" x="1022" y="294">invokestatic/reflection</text>

    <rect class="cyan" x="170" y="350" width="960" height="42" rx="12" stroke-width="2"/>
    <text class="text" x="197" y="377">类字面量、数组创建、读取编译期常量通常不触发初始化；Class.forName 默认触发，loadClass 默认不触发。</text>

    <rect class="panel" x="70" y="475" width="595" height="340" rx="16"/>
    <text class="section" x="96" y="513">2. Java 9+ 类加载器层级</text>

    <rect class="blue" x="170" y="540" width="360" height="64" rx="12" stroke-width="2"/>
    <text class="box-title" x="197" y="568">Bootstrap</text>
    <text class="text" x="197" y="590">java.base 等核心模块；API 中常表现为 null</text>

    <rect class="yellow" x="170" y="640" width="360" height="64" rx="12" stroke-width="2"/>
    <text class="box-title" x="197" y="668">Platform ClassLoader</text>
    <text class="text" x="197" y="690">JDK 平台模块，替代旧 Extension 语境</text>

    <path class="arrow" d="M350 637 V610"/>

    <rect class="green" x="170" y="740" width="360" height="64" rx="12" stroke-width="2"/>
    <text class="box-title" x="197" y="768">Application ClassLoader</text>
    <text class="text" x="197" y="790">classpath / module path</text>

    <path class="arrow" d="M350 737 V710"/>
    <text class="small" x="126" y="724">加载请求先向上委派</text>
    <text class="small" x="535" y="674">父加载器找不到再回落</text>

    <rect class="panel" x="695" y="475" width="595" height="340" rx="16"/>
    <text class="section" x="721" y="513">3. 局部打破委派的真实目的</text>

    <rect class="cyan" x="730" y="575" width="245" height="70" rx="12" stroke-width="2"/>
    <text class="box-title" x="757" y="604">SPI / ServiceLoader</text>
    <text class="text" x="757" y="627">父层接口发现子层实现</text>

    <rect class="yellow" x="1010" y="575" width="245" height="70" rx="12" stroke-width="2"/>
    <text class="box-title" x="1037" y="604">Tomcat</text>
    <text class="text" x="1037" y="627">WebApp 隔离和优先加载</text>

    <rect class="violet" x="730" y="690" width="245" height="70" rx="12" stroke-width="2"/>
    <text class="box-title" x="757" y="719">插件 / 热部署</text>
    <text class="text" x="757" y="742">卸载旧 ClassLoader</text>

    <rect class="red" x="1010" y="690" width="245" height="70" rx="12" stroke-width="2"/>
    <text class="box-title" x="1037" y="719">类型身份</text>
    <text class="text" x="1037" y="742">类名 + ClassLoader 才是类型</text>

    <rect class="panel" x="70" y="875" width="1220" height="260" rx="16"/>
    <text class="section" x="96" y="913">4. 初始化触发与边界</text>

    <rect class="green" x="105" y="975" width="250" height="74" rx="12" stroke-width="2"/>
    <text class="box-title" x="132" y="1005">触发初始化</text>
    <text class="text" x="132" y="1026">new / getstatic / putstatic</text>
    <text class="text" x="132" y="1044">invokestatic</text>

    <rect class="yellow" x="395" y="975" width="250" height="74" rx="12" stroke-width="2"/>
    <text class="box-title" x="422" y="1005">反射</text>
    <text class="text" x="422" y="1029">Class.forName 默认 initialize=true</text>

    <rect class="blue" x="685" y="975" width="250" height="74" rx="12" stroke-width="2"/>
    <text class="box-title" x="712" y="1005">不触发初始化</text>
    <text class="text" x="712" y="1029">类字面量、数组、编译期常量</text>

    <rect class="red" x="975" y="975" width="250" height="74" rx="12" stroke-width="2"/>
    <text class="box-title" x="1002" y="1005">排查误区</text>
    <text class="text" x="1002" y="1029">loadClass 只加载，不执行 &lt;clinit&gt;</text>

    <rect class="panel" x="70" y="1190" width="1220" height="215" rx="16"/>
    <text class="section" x="96" y="1228">5. ClassLoader 泄漏诊断</text>

    <rect class="cyan" x="105" y="1285" width="250" height="62" rx="12" stroke-width="2"/>
    <text class="box-title" x="132" y="1312">Metaspace 趋势</text>
    <text class="text" x="132" y="1335">Full GC 后类数量是否下降</text>

    <rect class="green" x="395" y="1285" width="250" height="62" rx="12" stroke-width="2"/>
    <text class="box-title" x="422" y="1312">jcmd / Arthas</text>
    <text class="mono" x="422" y="1335">VM.classloader_stats</text>

    <rect class="yellow" x="685" y="1285" width="250" height="62" rx="12" stroke-width="2"/>
    <text class="box-title" x="712" y="1312">heap dump</text>
    <text class="text" x="712" y="1335">Path to GC Roots 找旧加载器</text>

    <rect class="violet" x="975" y="1285" width="250" height="62" rx="12" stroke-width="2"/>
    <text class="box-title" x="1002" y="1312">常见根因</text>
    <text class="text" x="1002" y="1335">线程、静态变量、代理类缓存</text>

    <text class="small" x="96" y="1452">答题抓手：生命周期回答“何时初始化”，委派模型回答“由谁定义类”，工程诊断回答“哪个 ClassLoader 没卸载”。</text>
  </g>
</svg>
