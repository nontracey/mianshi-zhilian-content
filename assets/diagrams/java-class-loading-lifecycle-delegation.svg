<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" aria-labelledby="title desc" role="img" viewBox="0 0 1500 1500"><title id="title">Java class loading lifecycle, delegation and diagnostics</title><desc id="desc">A topic-specific diagram explaining Java class loading lifecycle, linking stages, class initialization triggers, Java 9+ class loader hierarchy, parent delegation, delegation break scenarios, and ClassLoader leak diagnostics.</desc><defs><marker id="arrow" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 32px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.section{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1500" height="1500" class="bg"/><g transform="translate(70 0)"><text x="70" y="66" class="title">类加载机制：生命周期、委派与隔离</text><text x="70" y="98" class="subtitle">把“类何时初始化”和“谁定义这个类”拆开讲；再落到 SPI、Web 容器和 ClassLoader 泄漏排查。</text><rect width="1220" height="305" x="70" y="130" class="panel" rx="16"/><text x="96" y="168" class="section">1. 生命周期：loading -&gt; linking -&gt; initialization</text><rect width="190" height="74" x="105" y="225" stroke-width="2" class="blue" rx="12"/><text x="132" y="256" class="box-title">Loading</text><text x="132" y="280" class="text">读取 class 字节流</text><path d="M300 262 H350" class="arrow"/><rect width="270" height="114" x="365" y="205" stroke-width="2" class="yellow" rx="12"/><text x="392" y="238" class="box-title">Linking</text><text x="392" y="263" class="text">Verify：格式/元数据/字节码</text><text x="392" y="286" class="text">Prepare：static 零值或 ConstantValue</text><text x="392" y="309" class="text">Resolve：符号引用可延迟解析</text><path d="M640 262 H690" class="arrow"/><rect width="245" height="74" x="705" y="225" stroke-width="2" class="green" rx="12"/><text x="732" y="256" class="box-title">Initialization</text><text x="732" y="280" class="text">执行 &lt;clinit&gt;，父类先初始化</text><rect width="230" height="74" x="995" y="225" stroke-width="2" class="violet" rx="12"/><text x="1022" y="256" class="box-title">Active use</text><text x="1022" y="276" class="text">new/getstatic/putstatic</text><text x="1022" y="294" class="text">invokestatic/reflection</text><rect width="960" height="42" x="170" y="350" stroke-width="2" class="cyan" rx="12"/><text x="197" y="377" class="text">类字面量、数组创建、读取编译期常量通常不触发初始化；Class.forName 默认触发，loadClass 默认不触发。</text><rect width="595" height="340" x="70" y="475" class="panel" rx="16"/><text x="96" y="513" class="section">2. Java 9+ 类加载器层级</text><rect width="360" height="64" x="170" y="540" stroke-width="2" class="blue" rx="12"/><text x="197" y="568" class="box-title">Bootstrap</text><text x="197" y="590" class="text">java.base 等核心模块；API 中常表现为 null</text><rect width="360" height="64" x="170" y="640" stroke-width="2" class="yellow" rx="12"/><text x="197" y="668" class="box-title">Platform ClassLoader</text><text x="197" y="690" class="text">JDK 平台模块，替代旧 Extension 语境</text><path d="M350 637 V610" class="arrow"/><rect width="360" height="64" x="170" y="740" stroke-width="2" class="green" rx="12"/><text x="197" y="768" class="box-title">Application ClassLoader</text><text x="197" y="790" class="text">classpath / module path</text><path d="M350 737 V710" class="arrow"/><text x="126" y="724" class="small">加载请求先向上委派</text><text x="535" y="674" class="small">父加载器找不到再回落</text><rect width="595" height="340" x="695" y="475" class="panel" rx="16"/><text x="721" y="513" class="section">3. 局部打破委派的真实目的</text><rect width="245" height="70" x="730" y="575" stroke-width="2" class="cyan" rx="12"/><text x="757" y="604" class="box-title">SPI / ServiceLoader</text><text x="757" y="627" class="text">父层接口发现子层实现</text><rect width="245" height="70" x="1010" y="575" stroke-width="2" class="yellow" rx="12"/><text x="1037" y="604" class="box-title">Tomcat</text><text x="1037" y="627" class="text">WebApp 隔离和优先加载</text><rect width="245" height="70" x="730" y="690" stroke-width="2" class="violet" rx="12"/><text x="757" y="719" class="box-title">插件 / 热部署</text><text x="757" y="742" class="text">卸载旧 ClassLoader</text><rect width="245" height="70" x="1010" y="690" stroke-width="2" class="red" rx="12"/><text x="1037" y="719" class="box-title">类型身份</text><text x="1037" y="742" class="text">类名 + ClassLoader 才是类型</text><rect width="1220" height="260" x="70" y="875" class="panel" rx="16"/><text x="96" y="913" class="section">4. 初始化触发与边界</text><rect width="250" height="74" x="105" y="975" stroke-width="2" class="green" rx="12"/><text x="132" y="1005" class="box-title">触发初始化</text><text x="132" y="1026" class="text">new / getstatic / putstatic</text><text x="132" y="1044" class="text">invokestatic</text><rect width="250" height="74" x="395" y="975" stroke-width="2" class="yellow" rx="12"/><text x="422" y="1005" class="box-title">反射</text><text x="422" y="1029" class="text">Class.forName 默认 initialize=true</text><rect width="250" height="74" x="685" y="975" stroke-width="2" class="blue" rx="12"/><text x="712" y="1005" class="box-title">不触发初始化</text><text x="712" y="1029" class="text">类字面量、数组、编译期常量</text><rect width="250" height="74" x="975" y="975" stroke-width="2" class="red" rx="12"/><text x="1002" y="1005" class="box-title">排查误区</text><text x="1002" y="1029" class="text">loadClass 只加载，不执行 &lt;clinit&gt;</text><rect width="1220" height="215" x="70" y="1190" class="panel" rx="16"/><text x="96" y="1228" class="section">5. ClassLoader 泄漏诊断</text><rect width="250" height="62" x="105" y="1285" stroke-width="2" class="cyan" rx="12"/><text x="132" y="1312" class="box-title">Metaspace 趋势</text><text x="132" y="1335" class="text">Full GC 后类数量是否下降</text><rect width="250" height="62" x="395" y="1285" stroke-width="2" class="green" rx="12"/><text x="422" y="1312" class="box-title">jcmd / Arthas</text><text x="422" y="1335" class="mono">VM.classloader_stats</text><rect width="250" height="62" x="685" y="1285" stroke-width="2" class="yellow" rx="12"/><text x="712" y="1312" class="box-title">heap dump</text><text x="712" y="1335" class="text">Path to GC Roots 找旧加载器</text><rect width="250" height="62" x="975" y="1285" stroke-width="2" class="violet" rx="12"/><text x="1002" y="1312" class="box-title">常见根因</text><text x="1002" y="1335" class="text">线程、静态变量、代理类缓存</text><text x="96" y="1452" class="small">答题抓手：生命周期回答“何时初始化”，委派模型回答“由谁定义类”，工程诊断回答“哪个 ClassLoader 没卸载”。</text></g></svg>