<svg viewBox="0 0 680 364" width="100%" role="img" aria-label="秒杀系统架构图">
<title>秒杀系统架构图</title><desc>四层架构设计</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">秒杀系统架构</text>
<rect x="80" y="50" width="520" height="46" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="200" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">CDN/前端</text>
<text x="440" y="78" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">按钮防抖/静态化/倒计时</text>
<line x1="340" y1="96" x2="340" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="80" y="110" width="520" height="46" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="200" y="138" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">网关层</text>
<text x="440" y="138" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">限流(令牌桶)/风控/黑名单</text>
<line x1="340" y1="156" x2="340" y2="170" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="80" y="170" width="520" height="46" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="200" y="198" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">服务层</text>
<text x="440" y="198" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">库存预扣(Redis)/异步下单(MQ)</text>
<line x1="340" y1="216" x2="340" y2="230" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="80" y="230" width="520" height="46" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="200" y="258" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">数据层</text>
<text x="440" y="258" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">乐观锁/分库分表/热点数据</text>
<rect x="80" y="294" width="520" height="50" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="314" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">核心: Redis原子扣减 + MQ异步下单 + 超卖兜底</text>
<text x="340" y="334" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">限流削峰: 只放1/10请求进入服务层，其余快速失败</text>
</svg>