<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1400" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1400"><title id="title">GC Roots reachability analysis and Java reference types</title><desc id="desc">A topic-specific diagram explaining GC Roots, reachability analysis, strong soft weak and phantom references, ReferenceQueue, WeakHashMap, ThreadLocalMap weak key strong value leak risk, and heap dump GC Roots diagnostics.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 32px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}</style></defs><rect width="1320" height="1400" class="bg"/><text x="70" y="64" class="title">GC Roots 与引用类型：对象为什么还活着</text><text x="70" y="96" class="subtitle">从根集合出发做可达性分析；引用强度决定“只剩这种引用时”对象何时被清理。</text><rect width="1180" height="330" x="70" y="130" class="panel" rx="16"/><text x="96" y="166" class="section-title">1. GC Roots 常见来源</text><rect width="230" height="82" x="105" y="225" stroke-width="2" class="blue" rx="12"/><text x="132" y="257" class="box-title">线程栈</text><text x="132" y="282" class="text">局部变量表引用</text><rect width="230" height="82" x="380" y="225" stroke-width="2" class="green" rx="12"/><text x="407" y="257" class="box-title">Class / 静态字段</text><text x="407" y="282" class="text">Class 镜像和静态引用</text><rect width="230" height="82" x="655" y="225" stroke-width="2" class="yellow" rx="12"/><text x="682" y="257" class="box-title">JNI / JVM 内部</text><text x="682" y="282" class="text">native 引用、系统类、JMX/JVMTI</text><rect width="230" height="82" x="930" y="225" stroke-width="2" class="violet" rx="12"/><text x="957" y="257" class="box-title">Monitor</text><text x="957" y="282" class="text">被 synchronized 持有的对象</text><rect width="960" height="50" x="180" y="350" stroke-width="2" class="cyan" rx="12"/><text x="207" y="381" class="text">从这些根出发遍历引用链；可达对象存活，不可达对象进入回收候选。循环引用如果不可达，也能被回收。</text><rect width="1180" height="330" x="70" y="500" class="panel" rx="16"/><text x="96" y="536" class="section-title">2. 四种引用强度和清理时机</text><rect width="245" height="88" x="105" y="600" stroke-width="2" class="red" rx="12"/><text x="132" y="632" class="box-title">Strong</text><text x="132" y="657" class="text">强引用可达则存活</text><text x="132" y="675" class="text">泄漏常来自集合/静态字段持有</text><rect width="245" height="88" x="405" y="600" stroke-width="2" class="yellow" rx="12"/><text x="432" y="632" class="box-title">SoftReference</text><text x="432" y="657" class="text">内存压力下清理</text><text x="432" y="675" class="text">缓存需兜底重建</text><rect width="245" height="88" x="705" y="600" stroke-width="2" class="green" rx="12"/><text x="732" y="632" class="box-title">WeakReference</text><text x="732" y="657" class="text">只剩弱引用可达时清理</text><text x="732" y="675" class="text">WeakHashMap key</text><rect width="205" height="88" x="1005" y="600" stroke-width="2" class="blue" rx="12"/><text x="1032" y="632" class="box-title">PhantomReference</text><text x="1032" y="657" class="text">get() 返回 null</text><text x="1032" y="675" class="text">配合 ReferenceQueue</text><rect width="940" height="50" x="190" y="730" stroke-width="2" class="violet" rx="12"/><text x="217" y="761" class="text">ReferenceQueue 用于收到引用对象被清理后的通知；是否及时入队仍受 GC 时机影响，业务不能依赖精确时间。</text><rect width="575" height="270" x="70" y="870" class="panel" rx="16"/><text x="96" y="906" class="section-title">3. ThreadLocal 泄漏真实链路</text><rect width="190" height="70" x="105" y="965" stroke-width="2" class="blue" rx="12"/><text x="132" y="995" class="box-title">Thread</text><text x="132" y="1018" class="text">长期存活线程</text><rect width="230" height="70" x="345" y="965" stroke-width="2" class="yellow" rx="12"/><text x="372" y="995" class="box-title">ThreadLocalMap.Entry</text><text x="372" y="1018" class="text">key 弱引用，value 强引用</text><path d="M295 1000 H336" class="arrow"/><rect width="360" height="42" x="160" y="1060" stroke-width="2" class="red" rx="12"/><text x="187" y="1087" class="text">key 被回收后，value 仍可能被线程强持有；线程池中必须 remove。</text><rect width="575" height="270" x="675" y="870" class="panel" rx="16"/><text x="701" y="906" class="section-title">4. Heap dump 排查</text><rect width="230" height="70" x="710" y="965" stroke-width="2" class="green" rx="12"/><text x="737" y="995" class="box-title">Dominator Tree</text><text x="737" y="1018" class="text">看 retained size</text><rect width="230" height="70" x="980" y="965" stroke-width="2" class="blue" rx="12"/><text x="1007" y="995" class="box-title">Path to GC Roots</text><text x="1007" y="1018" class="text">查是哪条根链保活</text><rect width="360" height="42" x="780" y="1060" stroke-width="2" class="yellow" rx="12"/><text x="807" y="1087" class="text">先问“谁还引用它”，再决定是泄漏、缓存策略还是正常 live set。</text><text x="96" y="1298" class="small">答题抓手：GC Roots 来源、可达性 vs 引用计数、四种引用回收时机、ReferenceQueue、WeakHashMap、ThreadLocal key 弱 value 强、MAT 引用链。</text></svg>