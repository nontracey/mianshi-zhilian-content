<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1400" viewBox="0 0 1320 1400" role="img" aria-labelledby="title desc">
  <title id="title">GC Roots reachability analysis and Java reference types</title>
  <desc id="desc">A topic-specific diagram explaining GC Roots, reachability analysis, strong soft weak and phantom references, ReferenceQueue, WeakHashMap, ThreadLocalMap weak key strong value leak risk, and heap dump GC Roots diagnostics.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1400"/>
  <text class="title" x="70" y="64">GC Roots 与引用类型：对象为什么还活着</text>
  <text class="subtitle" x="70" y="96">从根集合出发做可达性分析；引用强度决定“只剩这种引用时”对象何时被清理。</text>

  <rect class="panel" x="70" y="130" width="1180" height="330" rx="16"/>
  <text class="section-title" x="96" y="166">1. GC Roots 常见来源</text>

  <rect class="blue" x="105" y="225" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="257">线程栈</text>
  <text class="text" x="132" y="282">局部变量表引用</text>

  <rect class="green" x="380" y="225" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="407" y="257">Class / 静态字段</text>
  <text class="text" x="407" y="282">Class 镜像和静态引用</text>

  <rect class="yellow" x="655" y="225" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="682" y="257">JNI / JVM 内部</text>
  <text class="text" x="682" y="282">native 引用、系统类、JMX/JVMTI</text>

  <rect class="violet" x="930" y="225" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="957" y="257">Monitor</text>
  <text class="text" x="957" y="282">被 synchronized 持有的对象</text>

  <rect class="cyan" x="180" y="350" width="960" height="50" rx="12" stroke-width="2"/>
  <text class="text" x="207" y="381">从这些根出发遍历引用链；可达对象存活，不可达对象进入回收候选。循环引用如果不可达，也能被回收。</text>

  <rect class="panel" x="70" y="500" width="1180" height="330" rx="16"/>
  <text class="section-title" x="96" y="536">2. 四种引用强度和清理时机</text>

  <rect class="red" x="105" y="600" width="245" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="632">Strong</text>
  <text class="text" x="132" y="657">强引用可达则存活</text>
  <text class="text" x="132" y="675">泄漏常来自集合/静态字段持有</text>

  <rect class="yellow" x="405" y="600" width="245" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="432" y="632">SoftReference</text>
  <text class="text" x="432" y="657">内存压力下清理</text>
  <text class="text" x="432" y="675">缓存需兜底重建</text>

  <rect class="green" x="705" y="600" width="245" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="732" y="632">WeakReference</text>
  <text class="text" x="732" y="657">只剩弱引用可达时清理</text>
  <text class="text" x="732" y="675">WeakHashMap key</text>

  <rect class="blue" x="1005" y="600" width="205" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="1032" y="632">PhantomReference</text>
  <text class="text" x="1032" y="657">get() 返回 null</text>
  <text class="text" x="1032" y="675">配合 ReferenceQueue</text>

  <rect class="violet" x="190" y="730" width="940" height="50" rx="12" stroke-width="2"/>
  <text class="text" x="217" y="761">ReferenceQueue 用于收到引用对象被清理后的通知；是否及时入队仍受 GC 时机影响，业务不能依赖精确时间。</text>

  <rect class="panel" x="70" y="870" width="575" height="270" rx="16"/>
  <text class="section-title" x="96" y="906">3. ThreadLocal 泄漏真实链路</text>

  <rect class="blue" x="105" y="965" width="190" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="995">Thread</text>
  <text class="text" x="132" y="1018">长期存活线程</text>

  <rect class="yellow" x="345" y="965" width="230" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="372" y="995">ThreadLocalMap.Entry</text>
  <text class="text" x="372" y="1018">key 弱引用，value 强引用</text>

  <path class="arrow" d="M295 1000 H336"/>

  <rect class="red" x="160" y="1060" width="360" height="42" rx="12" stroke-width="2"/>
  <text class="text" x="187" y="1087">key 被回收后，value 仍可能被线程强持有；线程池中必须 remove。</text>

  <rect class="panel" x="675" y="870" width="575" height="270" rx="16"/>
  <text class="section-title" x="701" y="906">4. Heap dump 排查</text>

  <rect class="green" x="710" y="965" width="230" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="737" y="995">Dominator Tree</text>
  <text class="text" x="737" y="1018">看 retained size</text>

  <rect class="blue" x="980" y="965" width="230" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="1007" y="995">Path to GC Roots</text>
  <text class="text" x="1007" y="1018">查是哪条根链保活</text>

  <rect class="yellow" x="780" y="1060" width="360" height="42" rx="12" stroke-width="2"/>
  <text class="text" x="807" y="1087">先问“谁还引用它”，再决定是泄漏、缓存策略还是正常 live set。</text>

  <text class="small" x="96" y="1298">答题抓手：GC Roots 来源、可达性 vs 引用计数、四种引用回收时机、ReferenceQueue、WeakHashMap、ThreadLocal key 弱 value 强、MAT 引用链。</text>
</svg>
