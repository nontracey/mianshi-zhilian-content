<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1280"><title id="title">CompletableFuture 编排、线程池与异常路径</title><desc id="desc">展示 CompletableFuture 的创建、CompletionStage 编排方法、Async 与非 Async 执行线程、异常处理和超时边界。</desc><defs><marker id="arrow-blue" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#1f5f99" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#b24634" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f7fafc}.title{font:700 30px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#14213d}.subtitle{font:400 15px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.panel{fill:#fff;stroke:#d9e2ec;stroke-width:2;rx:16}.label{fill:#1f2933}.panel-title{font:700 20px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#1f2933}.label{font:700 16px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.small{font:400 14px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#334e68}.tiny{font:400 12px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.blue{fill:#e8f4ff;stroke:#6aa9df}.blue,.gray{stroke-width:2;rx:12}.green{fill:#e9f7ef;stroke:#58b77d}.green,.red,.yellow{stroke-width:2;rx:12}.yellow{fill:#fff5d6;stroke:#e0ae35}.red{fill:#fdecea;stroke:#cf5d4b}.gray{fill:#f1f5f9;stroke:#a7b5c4}.line,.line-red{stroke:#1f5f99;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.line-red{stroke:#b24634;marker-end:url(#arrow-red)}</style></defs><rect width="1280" height="1280" class="bg"/><text x="48" y="56" class="title">CompletableFuture：编排图、执行线程与异常路径</text><text x="50" y="86" class="subtitle">方法名之外，更要看依赖关系、回调线程、公共池风险和超时后底层任务是否还在运行。</text><rect width="1200" height="270" x="40" y="120" class="panel"/><text x="68" y="156" class="panel-title">1. 创建阶段：默认 commonPool 与业务自定义 Executor</text><rect width="168" height="72" x="86" y="210" class="blue"/><text x="126" y="238" class="label">supplyAsync</text><text x="118" y="262" class="tiny">有返回值任务</text><rect width="168" height="72" x="316" y="210" class="blue"/><text x="362" y="238" class="label">runAsync</text><text x="348" y="262" class="tiny">无返回值任务</text><rect width="210" height="72" x="552" y="178" class="red"/><text x="604" y="206" class="label">commonPool</text><text x="584" y="230" class="tiny">JVM 共享，怕阻塞 IO</text><rect width="210" height="72" x="552" y="282" class="green"/><text x="602" y="310" class="label">业务 Executor</text><text x="588" y="334" class="tiny">隔离容量和监控</text><rect width="240" height="72" x="830" y="230" class="gray"/><text x="878" y="258" class="label">CompletionStage 链</text><text x="864" y="282" class="tiny">后续依赖从这里展开</text><line x1="254" x2="316" y1="246" y2="246" class="line"/><line x1="484" x2="552" y1="246" y2="214" class="line-red"/><line x1="484" x2="552" y1="246" y2="318" class="line"/><line x1="762" x2="830" y1="318" y2="266" class="line"/><rect width="585" height="315" x="40" y="430" class="panel"/><text x="68" y="466" class="panel-title">2. 组合方法按依赖关系选择</text><rect width="145" height="68" x="78" y="520" class="green"/><text x="108" y="548" class="label">thenApply</text><text x="112" y="570" class="tiny">T -&gt; U</text><rect width="145" height="68" x="278" y="520" class="yellow"/><text x="304" y="548" class="label">thenCompose</text><text x="302" y="570" class="tiny">T -&gt; CF&lt;U&gt;</text><rect width="108" height="68" x="478" y="520" class="blue"/><text x="502" y="548" class="label">扁平化</text><text x="498" y="570" class="tiny">CF&lt;U&gt;</text><line x1="223" x2="278" y1="554" y2="554" class="line"/><line x1="423" x2="478" y1="554" y2="554" class="line"/><rect width="145" height="68" x="78" y="636" class="green"/><text x="104" y="664" class="label">thenCombine</text><text x="102" y="686" class="tiny">两个结果合并</text><rect width="145" height="68" x="278" y="636" class="yellow"/><text x="326" y="664" class="label">allOf</text><text x="300" y="686" class="tiny">等全部，返回 Void</text><rect width="108" height="68" x="478" y="636" class="blue"/><text x="512" y="664" class="label">anyOf</text><text x="498" y="686" class="tiny">取最快 Object</text><line x1="223" x2="278" y1="670" y2="670" class="line"/><line x1="423" x2="478" y1="670" y2="670" class="line"/><rect width="585" height="315" x="655" y="430" class="panel"/><text x="683" y="466" class="panel-title">3. 回调线程：非 Async 与 Async</text><rect width="160" height="72" x="692" y="522" class="yellow"/><text x="728" y="550" class="label">thenApply</text><text x="714" y="574" class="tiny">完成线程 / 当前线程</text><rect width="160" height="72" x="902" y="522" class="green"/><text x="930" y="550" class="label">轻量转换</text><text x="936" y="574" class="tiny">少一次调度</text><rect width="160" height="72" x="692" y="638" class="blue"/><text x="714" y="666" class="label">thenApplyAsync</text><text x="718" y="690" class="tiny">提交到 Executor</text><rect width="160" height="72" x="902" y="638" class="red"/><text x="936" y="666" class="label">阻塞回调</text><text x="932" y="690" class="tiny">自定义线程池</text><line x1="852" x2="902" y1="558" y2="558" class="line"/><line x1="852" x2="902" y1="674" y2="674" class="line-red"/><rect width="480" height="36" x="692" y="704" class="gray"/><text x="718" y="728" class="small">不要让耗时回调占住上游完成线程。</text><rect width="1200" height="300" x="40" y="785" class="panel"/><text x="68" y="821" class="panel-title">4. 异常和超时：转换、观察、继续传播</text><rect width="150" height="72" x="78" y="872" class="red"/><text x="108" y="900" class="label">exceptionally</text><text x="104" y="924" class="tiny">失败转兜底值</text><rect width="150" height="72" x="278" y="872" class="yellow"/><text x="324" y="900" class="label">handle</text><text x="302" y="924" class="tiny">成败都转换</text><rect width="150" height="72" x="478" y="872" class="blue"/><text x="508" y="900" class="label">whenComplete</text><text x="506" y="924" class="tiny">只观察，不吞异常</text><rect width="150" height="72" x="678" y="872" class="red"/><text x="722" y="900" class="label">orTimeout</text><text x="706" y="924" class="tiny">超时异常完成</text><rect width="180" height="72" x="878" y="872" class="green"/><text x="920" y="900" class="label">completeOnTimeout</text><text x="916" y="924" class="tiny">超时给兜底值</text><line x1="228" x2="278" y1="908" y2="908" class="line"/><line x1="428" x2="478" y1="908" y2="908" class="line"/><line x1="628" x2="678" y1="908" y2="908" class="line-red"/><line x1="828" x2="878" y1="908" y2="908" class="line"/><rect width="1000" height="50" x="104" y="1000" class="gray"/><text x="132" y="1030" class="small">Future 超时完成不代表底层 RPC/DB 调用已停止；真实释放要靠客户端超时、取消和资源池配置。</text><rect width="1200" height="86" x="40" y="1128" class="panel"/><text x="68" y="1162" class="panel-title">回答抓手</text><text x="190" y="1162" class="small">创建和 Executor -&gt; 依赖关系选方法 -&gt; Async 执行线程 -&gt; 异常/超时传播 -&gt; commonPool 和底层任务取消边界。</text></svg>