<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">CPU 调度算法、CFS vruntime 与 EEVDF</title><desc id="desc">展示经典 CPU 调度算法的取舍、Linux CFS 如何用 nice 权重和 vruntime 选择红黑树最左任务，以及 EEVDF 如何用 lag 和 virtual deadline 优化延迟。</desc><defs><marker id="arrow-blue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#059669" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.title{font:800 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.panel-title{font:750 27px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:750 20px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1e293b}.small{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.tiny-strong{font:750 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.classic{fill:#eff6ff;stroke:#60a5fa;stroke-width:2;rx:14}.cfs{fill:#ecfdf5;stroke:#34d399}.cfs,.eevdf,.gray,.risk{stroke-width:2;rx:14}.eevdf{fill:#fff7ed;stroke:#fb923c}.risk{fill:#fef2f2;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#cbd5e1}.line-blue,.line-green{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow-blue)}.line-green{stroke:#059669;marker-end:url(#arrow-green)}</style></defs><rect width="1320" height="1320" class="bg"/><text x="660" y="56" class="title" text-anchor="middle">CPU 调度：公平、响应和吞吐之间的取舍</text><text x="660" y="90" class="subtitle" text-anchor="middle">CFS 讲 vruntime 与权重；EEVDF 讲 lag 与 virtual deadline；生产排查要看 runnable 等待</text><rect width="1200" height="300" x="60" y="125" class="panel"/><text x="92" y="168" class="panel-title">1. 经典算法：每个算法都牺牲一部分目标</text><rect width="210" height="96" x="95" y="210" class="classic"/><text x="200" y="240" class="label" text-anchor="middle">FCFS</text><text x="200" y="266" class="tiny" text-anchor="middle">按到达顺序跑完</text><text x="200" y="289" class="tiny" text-anchor="middle">护航效应，响应差</text><rect width="210" height="96" x="350" y="210" class="classic"/><text x="455" y="240" class="label" text-anchor="middle">SJF / SRTF</text><text x="455" y="266" class="tiny" text-anchor="middle">短任务优先</text><text x="455" y="289" class="tiny" text-anchor="middle">平均等待低，长任务饥饿</text><rect width="210" height="96" x="605" y="210" class="classic"/><text x="710" y="240" class="label" text-anchor="middle">RR</text><text x="710" y="266" class="tiny" text-anchor="middle">固定时间片轮转</text><text x="710" y="289" class="tiny" text-anchor="middle">片长决定响应/切换开销</text><rect width="210" height="96" x="860" y="210" class="classic"/><text x="965" y="240" class="label" text-anchor="middle">MLFQ</text><text x="965" y="266" class="tiny" text-anchor="middle">多队列 + 动态优先级</text><text x="965" y="289" class="tiny" text-anchor="middle">靠 aging 防饥饿</text><rect width="1125" height="48" x="95" y="340" class="gray"/><text x="657" y="369" class="small" text-anchor="middle">面试先讲目标冲突：低延迟、吞吐、公平、避免饥饿不能同时最优，只能按负载取舍</text><rect width="1200" height="365" x="60" y="460" class="panel"/><text x="92" y="503" class="panel-title">2. CFS：用 vruntime 逼近长期按权重公平</text><rect width="245" height="82" x="95" y="545" class="cfs"/><text x="217" y="576" class="label" text-anchor="middle">nice -&gt; weight</text><text x="217" y="602" class="tiny" text-anchor="middle">nice 越小，权重越大</text><path d="M 345 586 L 455 586" class="line-green"/><rect width="285" height="82" x="460" y="545" class="cfs"/><text x="602" y="576" class="label" text-anchor="middle">vruntime</text><text x="602" y="602" class="tiny" text-anchor="middle">delta_exec * NICE_0_LOAD / weight</text><path d="M 750 586 L 860 586" class="line-green"/><rect width="255" height="82" x="865" y="545" class="cfs"/><text x="992" y="576" class="label" text-anchor="middle">rbtree by vruntime</text><text x="992" y="602" class="tiny" text-anchor="middle">leftmost = ran least fairly</text><rect width="180" height="70" x="95" y="675" class="gray"/><text x="185" y="702" class="tiny-strong" text-anchor="middle">Task A</text><text x="185" y="726" class="tiny" text-anchor="middle">nice 0, weight 1024</text><rect width="180" height="70" x="320" y="675" class="gray"/><text x="410" y="702" class="tiny-strong" text-anchor="middle">Task B</text><text x="410" y="726" class="tiny" text-anchor="middle">nice +5, weight 335</text><rect width="180" height="70" x="545" y="675" class="gray"/><text x="635" y="702" class="tiny-strong" text-anchor="middle">Task C</text><text x="635" y="726" class="tiny" text-anchor="middle">nice -5, weight 3121</text><path d="M 730 710 L 835 710" class="line-blue"/><rect width="280" height="70" x="840" y="675" class="cfs"/><text x="980" y="702" class="tiny-strong" text-anchor="middle">pick smallest vruntime</text><text x="980" y="726" class="tiny" text-anchor="middle">运行后 vruntime 增大，再入队</text><rect width="1125" height="42" x="95" y="765" class="risk"/><text x="657" y="792" class="tiny-strong" text-anchor="middle">nice 是比例权重，不是实时优先级；SCHED_FIFO/RR/DEADLINE 属于不同调度类</text><rect width="1200" height="330" x="60" y="860" class="panel"/><text x="92" y="903" class="panel-title">3. EEVDF 与生产排查：公平之外还要看延迟</text><rect width="270" height="82" x="95" y="950" class="eevdf"/><text x="230" y="982" class="label" text-anchor="middle">lag</text><text x="230" y="1008" class="tiny" text-anchor="middle">理想 CPU - 实际 CPU</text><path d="M 370 991 L 480 991" class="line-green"/><rect width="270" height="82" x="485" y="950" class="eevdf"/><text x="620" y="982" class="label" text-anchor="middle">virtual deadline</text><text x="620" y="1008" class="tiny" text-anchor="middle">vruntime + slice</text><path d="M 760 991 L 870 991" class="line-green"/><rect width="270" height="82" x="875" y="950" class="eevdf"/><text x="1010" y="982" class="label" text-anchor="middle">eligible earliest</text><text x="1010" y="1008" class="tiny" text-anchor="middle">更照顾突发唤醒延迟</text><rect width="250" height="70" x="95" y="1070" class="gray"/><text x="220" y="1096" class="tiny-strong" text-anchor="middle">run queue</text><text x="220" y="1120" class="tiny" text-anchor="middle">runnable 等待是否变长</text><rect width="250" height="70" x="380" y="1070" class="gray"/><text x="505" y="1096" class="tiny-strong" text-anchor="middle">context switch</text><text x="505" y="1120" class="tiny" text-anchor="middle">voluntary vs involuntary</text><rect width="250" height="70" x="665" y="1070" class="gray"/><text x="790" y="1096" class="tiny-strong" text-anchor="middle">steal / throttling</text><text x="790" y="1120" class="tiny" text-anchor="middle">虚拟化与 cgroup 限流</text><rect width="270" height="70" x="950" y="1070" class="gray"/><text x="1085" y="1096" class="tiny-strong" text-anchor="middle">perf sched latency</text><text x="1085" y="1120" class="tiny" text-anchor="middle">唤醒到执行等待分布</text></svg>