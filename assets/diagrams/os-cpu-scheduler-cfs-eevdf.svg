<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">CPU 调度算法、CFS vruntime 与 EEVDF</title>
  <desc id="desc">展示经典 CPU 调度算法的取舍、Linux CFS 如何用 nice 权重和 vruntime 选择红黑树最左任务，以及 EEVDF 如何用 lag 和 virtual deadline 优化延迟。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .title { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .panel-title { font: 750 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 750 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny-strong { font: 750 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .classic { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 14; }
      .cfs { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 14; }
      .eevdf { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 14; }
      .risk { fill: #fef2f2; stroke: #f87171; stroke-width: 2; rx: 14; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .line-blue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .line-green { stroke: #059669; stroke-width: 4; fill: none; marker-end: url(#arrow-green); }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="660" y="56" text-anchor="middle">CPU 调度：公平、响应和吞吐之间的取舍</text>
  <text class="subtitle" x="660" y="90" text-anchor="middle">CFS 讲 vruntime 与权重；EEVDF 讲 lag 与 virtual deadline；生产排查要看 runnable 等待</text>

  <rect class="panel" x="60" y="125" width="1200" height="300"/>
  <text class="panel-title" x="92" y="168">1. 经典算法：每个算法都牺牲一部分目标</text>
  <rect class="classic" x="95" y="210" width="210" height="96"/>
  <text class="label" x="200" y="240" text-anchor="middle">FCFS</text>
  <text class="tiny" x="200" y="266" text-anchor="middle">按到达顺序跑完</text>
  <text class="tiny" x="200" y="289" text-anchor="middle">护航效应，响应差</text>
  <rect class="classic" x="350" y="210" width="210" height="96"/>
  <text class="label" x="455" y="240" text-anchor="middle">SJF / SRTF</text>
  <text class="tiny" x="455" y="266" text-anchor="middle">短任务优先</text>
  <text class="tiny" x="455" y="289" text-anchor="middle">平均等待低，长任务饥饿</text>
  <rect class="classic" x="605" y="210" width="210" height="96"/>
  <text class="label" x="710" y="240" text-anchor="middle">RR</text>
  <text class="tiny" x="710" y="266" text-anchor="middle">固定时间片轮转</text>
  <text class="tiny" x="710" y="289" text-anchor="middle">片长决定响应/切换开销</text>
  <rect class="classic" x="860" y="210" width="210" height="96"/>
  <text class="label" x="965" y="240" text-anchor="middle">MLFQ</text>
  <text class="tiny" x="965" y="266" text-anchor="middle">多队列 + 动态优先级</text>
  <text class="tiny" x="965" y="289" text-anchor="middle">靠 aging 防饥饿</text>
  <rect class="gray" x="95" y="340" width="1125" height="48"/>
  <text class="small" x="657" y="369" text-anchor="middle">面试先讲目标冲突：低延迟、吞吐、公平、避免饥饿不能同时最优，只能按负载取舍</text>

  <rect class="panel" x="60" y="460" width="1200" height="365"/>
  <text class="panel-title" x="92" y="503">2. CFS：用 vruntime 逼近长期按权重公平</text>
  <rect class="cfs" x="95" y="545" width="245" height="82"/>
  <text class="label" x="217" y="576" text-anchor="middle">nice -> weight</text>
  <text class="tiny" x="217" y="602" text-anchor="middle">nice 越小，权重越大</text>
  <path class="line-green" d="M 345 586 L 455 586"/>
  <rect class="cfs" x="460" y="545" width="285" height="82"/>
  <text class="label" x="602" y="576" text-anchor="middle">vruntime</text>
  <text class="tiny" x="602" y="602" text-anchor="middle">delta_exec * NICE_0_LOAD / weight</text>
  <path class="line-green" d="M 750 586 L 860 586"/>
  <rect class="cfs" x="865" y="545" width="255" height="82"/>
  <text class="label" x="992" y="576" text-anchor="middle">rbtree by vruntime</text>
  <text class="tiny" x="992" y="602" text-anchor="middle">leftmost = ran least fairly</text>

  <rect class="gray" x="95" y="675" width="180" height="70"/>
  <text class="tiny-strong" x="185" y="702" text-anchor="middle">Task A</text>
  <text class="tiny" x="185" y="726" text-anchor="middle">nice 0, weight 1024</text>
  <rect class="gray" x="320" y="675" width="180" height="70"/>
  <text class="tiny-strong" x="410" y="702" text-anchor="middle">Task B</text>
  <text class="tiny" x="410" y="726" text-anchor="middle">nice +5, weight 335</text>
  <rect class="gray" x="545" y="675" width="180" height="70"/>
  <text class="tiny-strong" x="635" y="702" text-anchor="middle">Task C</text>
  <text class="tiny" x="635" y="726" text-anchor="middle">nice -5, weight 3121</text>
  <path class="line-blue" d="M 730 710 L 835 710"/>
  <rect class="cfs" x="840" y="675" width="280" height="70"/>
  <text class="tiny-strong" x="980" y="702" text-anchor="middle">pick smallest vruntime</text>
  <text class="tiny" x="980" y="726" text-anchor="middle">运行后 vruntime 增大，再入队</text>
  <rect class="risk" x="95" y="765" width="1125" height="42"/>
  <text class="tiny-strong" x="657" y="792" text-anchor="middle">nice 是比例权重，不是实时优先级；SCHED_FIFO/RR/DEADLINE 属于不同调度类</text>

  <rect class="panel" x="60" y="860" width="1200" height="330"/>
  <text class="panel-title" x="92" y="903">3. EEVDF 与生产排查：公平之外还要看延迟</text>
  <rect class="eevdf" x="95" y="950" width="270" height="82"/>
  <text class="label" x="230" y="982" text-anchor="middle">lag</text>
  <text class="tiny" x="230" y="1008" text-anchor="middle">理想 CPU - 实际 CPU</text>
  <path class="line-green" d="M 370 991 L 480 991"/>
  <rect class="eevdf" x="485" y="950" width="270" height="82"/>
  <text class="label" x="620" y="982" text-anchor="middle">virtual deadline</text>
  <text class="tiny" x="620" y="1008" text-anchor="middle">vruntime + slice</text>
  <path class="line-green" d="M 760 991 L 870 991"/>
  <rect class="eevdf" x="875" y="950" width="270" height="82"/>
  <text class="label" x="1010" y="982" text-anchor="middle">eligible earliest</text>
  <text class="tiny" x="1010" y="1008" text-anchor="middle">更照顾突发唤醒延迟</text>

  <rect class="gray" x="95" y="1070" width="250" height="70"/>
  <text class="tiny-strong" x="220" y="1096" text-anchor="middle">run queue</text>
  <text class="tiny" x="220" y="1120" text-anchor="middle">runnable 等待是否变长</text>
  <rect class="gray" x="380" y="1070" width="250" height="70"/>
  <text class="tiny-strong" x="505" y="1096" text-anchor="middle">context switch</text>
  <text class="tiny" x="505" y="1120" text-anchor="middle">voluntary vs involuntary</text>
  <rect class="gray" x="665" y="1070" width="250" height="70"/>
  <text class="tiny-strong" x="790" y="1096" text-anchor="middle">steal / throttling</text>
  <text class="tiny" x="790" y="1120" text-anchor="middle">虚拟化与 cgroup 限流</text>
  <rect class="gray" x="950" y="1070" width="270" height="70"/>
  <text class="tiny-strong" x="1085" y="1096" text-anchor="middle">perf sched latency</text>
  <text class="tiny" x="1085" y="1120" text-anchor="middle">唤醒到执行等待分布</text>
</svg>
