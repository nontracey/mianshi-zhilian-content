<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">进程间通信的拷贝路径、同步责任与选型</title><desc id="desc">展示进程地址空间隔离后，管道和消息队列经内核缓冲复制，共享内存映射同一物理页但需要额外同步，Unix Domain Socket 和 TCP/UDP Socket 适合本机或跨机器通信。</desc><defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:10}.title{font:700 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:600 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.h2{font:700 25px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:700 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:600 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.kernel,.proc{stroke-width:2;rx:8}.proc{fill:#eff6ff;stroke:#60a5fa}.kernel{fill:#fff7ed;stroke:#fb923c}.gray,.shared,.warn{stroke-width:2;rx:8}.shared,.warn{fill:#ecfdf5;stroke:#34d399}.warn{fill:#fef2f2;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#cbd5e1}.arrow{stroke:#2563eb;marker-end:url(#arrow)}.arrow,.greenArrow,.orangeArrow{stroke-width:3;fill:none}.orangeArrow{stroke:#ea580c;marker-end:url(#orangeArrow)}.greenArrow{stroke:#059669;marker-end:url(#greenArrow)}</style><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#2563eb" d="M2,2 L10,6 L2,10 Z"/></marker><marker id="orangeArrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#ea580c" d="M2,2 L10,6 L2,10 Z"/></marker><marker id="greenArrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#059669" d="M2,2 L10,6 L2,10 Z"/></marker></defs><rect width="1320" height="1320" class="bg"/><text x="660" y="55" class="title" text-anchor="middle">IPC 选型要看：拷贝路径、消息边界、生命周期和同步责任</text><text x="660" y="88" class="subtitle" text-anchor="middle">进程地址空间彼此隔离；共享内存快，但不会替你定义互斥和协议</text><rect width="1204" height="520" x="58" y="120" class="panel"/><text x="90" y="162" class="h2">1. 三条典型数据路径</text><rect width="210" height="95" x="95" y="205" class="proc"/><text x="200" y="238" class="label" text-anchor="middle">Process A</text><text x="200" y="268" class="text" text-anchor="middle">user buffer</text><rect width="240" height="95" x="420" y="205" class="kernel"/><text x="540" y="238" class="label" text-anchor="middle">内核缓冲</text><text x="540" y="268" class="text" text-anchor="middle">pipe / FIFO / message queue</text><rect width="210" height="95" x="775" y="205" class="proc"/><text x="880" y="238" class="label" text-anchor="middle">Process B</text><text x="880" y="268" class="text" text-anchor="middle">user buffer</text><path d="M308 252 H416" class="orangeArrow"/><path d="M664 252 H772" class="orangeArrow"/><rect width="150" height="95" x="1025" y="205" class="gray"/><text x="1100" y="238" class="label" text-anchor="middle">语义</text><text x="1100" y="266" class="tiny" text-anchor="middle">管道无边界</text><text x="1100" y="288" class="tiny" text-anchor="middle">消息队列有边界</text><rect width="210" height="95" x="95" y="355" class="proc"/><text x="200" y="388" class="label" text-anchor="middle">Process A</text><text x="200" y="418" class="text" text-anchor="middle">mmap MAP_SHARED</text><rect width="240" height="125" x="420" y="340" class="shared"/><text x="540" y="378" class="label" text-anchor="middle">同一批物理页</text><text x="540" y="407" class="text" text-anchor="middle">POSIX shm / System V shm</text><text x="540" y="433" class="tiny" text-anchor="middle">数据不走每次内核中转</text><rect width="210" height="95" x="775" y="355" class="proc"/><text x="880" y="388" class="label" text-anchor="middle">Process B</text><text x="880" y="418" class="text" text-anchor="middle">mmap MAP_SHARED</text><path d="M308 402 H416" class="greenArrow"/><path d="M664 402 H772" class="greenArrow"/><rect width="150" height="125" x="1025" y="340" class="warn"/><text x="1100" y="374" class="label" text-anchor="middle">必须自带协议</text><text x="1100" y="402" class="tiny" text-anchor="middle">锁/信号量</text><text x="1100" y="424" class="tiny" text-anchor="middle">版本号/长度</text><text x="1100" y="446" class="tiny" text-anchor="middle">崩溃恢复</text><rect width="210" height="88" x="95" y="505" class="proc"/><text x="200" y="538" class="label" text-anchor="middle">Process A</text><text x="200" y="566" class="text" text-anchor="middle">socket endpoint</text><rect width="240" height="88" x="420" y="505" class="kernel"/><text x="540" y="538" class="label" text-anchor="middle">UDS / TCP / UDP</text><text x="540" y="566" class="text" text-anchor="middle">协议栈、队列、背压</text><rect width="210" height="88" x="775" y="505" class="proc"/><text x="880" y="538" class="label" text-anchor="middle">Process B / Remote</text><text x="880" y="566" class="text" text-anchor="middle">socket endpoint</text><path d="M308 549 H416" class="arrow"/><path d="M664 549 H772" class="arrow"/><rect width="150" height="88" x="1025" y="505" class="gray"/><text x="1100" y="538" class="label" text-anchor="middle">额外能力</text><text x="1100" y="566" class="tiny" text-anchor="middle">UDS 可传 fd</text><rect width="1204" height="320" x="58" y="670" class="panel"/><text x="90" y="712" class="h2">2. 选型决策不是只按“快慢”</text><rect width="205" height="86" x="95" y="755" class="gray"/><text x="197" y="785" class="label" text-anchor="middle">顺序字节流</text><text x="197" y="813" class="text" text-anchor="middle">pipe / FIFO / UDS stream</text><rect width="205" height="86" x="330" y="755" class="gray"/><text x="432" y="785" class="label" text-anchor="middle">消息边界</text><text x="432" y="813" class="text" text-anchor="middle">message queue / UDS dgram</text><rect width="205" height="86" x="565" y="755" class="gray"/><text x="667" y="785" class="label" text-anchor="middle">本机大块数据</text><text x="667" y="813" class="text" text-anchor="middle">shared memory + sync</text><rect width="205" height="86" x="800" y="755" class="gray"/><text x="902" y="785" class="label" text-anchor="middle">生命周期事件</text><text x="902" y="813" class="text" text-anchor="middle">signal / eventfd</text><rect width="150" height="86" x="1035" y="755" class="gray"/><text x="1110" y="785" class="label" text-anchor="middle">跨机器</text><text x="1110" y="813" class="text" text-anchor="middle">TCP / UDP</text><rect width="255" height="72" x="95" y="875" class="warn"/><text x="222" y="904" class="label" text-anchor="middle">对象生命周期</text><text x="222" y="931" class="tiny" text-anchor="middle">System V: ipcs/ipcrm；POSIX: unlink</text><rect width="255" height="72" x="385" y="875" class="warn"/><text x="512" y="904" class="label" text-anchor="middle">容量与阻塞</text><text x="512" y="931" class="tiny" text-anchor="middle">pipe size、队列上限、满队列策略</text><rect width="255" height="72" x="675" y="875" class="warn"/><text x="802" y="904" class="label" text-anchor="middle">同步与一致性</text><text x="802" y="931" class="tiny" text-anchor="middle">半包、旧数据、崩溃后锁恢复</text><rect width="220" height="72" x="965" y="875" class="warn"/><text x="1075" y="904" class="label" text-anchor="middle">观测工具</text><text x="1075" y="931" class="tiny" text-anchor="middle">ipcs、/dev/shm、lsof、ss</text><rect width="1204" height="250" x="58" y="1020" class="panel"/><text x="90" y="1062" class="h2">3. 面试高频陷阱</text><rect width="245" height="95" x="95" y="1100" class="warn"/><text x="217" y="1130" class="label" text-anchor="middle">共享内存只共享可见性</text><text x="217" y="1158" class="tiny" text-anchor="middle">不提供互斥、顺序、消息边界</text><rect width="245" height="95" x="380" y="1100" class="warn"/><text x="502" y="1130" class="label" text-anchor="middle">管道是字节流</text><text x="502" y="1158" class="tiny" text-anchor="middle">EOF/EPIPE/SIGPIPE 来自端点关闭</text><rect width="245" height="95" x="665" y="1100" class="warn"/><text x="787" y="1130" class="label" text-anchor="middle">信号不是业务队列</text><text x="787" y="1158" class="tiny" text-anchor="middle">普通信号可能合并；handler 受限制</text><rect width="245" height="95" x="950" y="1100" class="warn"/><text x="1072" y="1130" class="label" text-anchor="middle">别忘清理持久对象</text><text x="1072" y="1158" class="tiny" text-anchor="middle">mq_unlink / shm_unlink / IPC_RMID</text></svg>