<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">进程间通信的拷贝路径、同步责任与选型</title>
  <desc id="desc">展示进程地址空间隔离后，管道和消息队列经内核缓冲复制，共享内存映射同一物理页但需要额外同步，Unix Domain Socket 和 TCP/UDP Socket 适合本机或跨机器通信。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .h2 { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 700 15px "SFMono-Regular", Consolas, monospace; fill: #0f172a; }
      .proc { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 8; }
      .kernel { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 8; }
      .shared { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 8; }
      .warn { fill: #fef2f2; stroke: #f87171; stroke-width: 2; rx: 8; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .orangeArrow { stroke: #ea580c; stroke-width: 3; fill: none; marker-end: url(#orangeArrow); }
      .greenArrow { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#greenArrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ea580c"/>
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="660" y="55" text-anchor="middle">IPC 选型要看：拷贝路径、消息边界、生命周期和同步责任</text>
  <text class="subtitle" x="660" y="88" text-anchor="middle">进程地址空间彼此隔离；共享内存快，但不会替你定义互斥和协议</text>

  <rect class="panel" x="58" y="120" width="1204" height="520"/>
  <text class="h2" x="90" y="162">1. 三条典型数据路径</text>

  <rect class="proc" x="95" y="205" width="210" height="95"/>
  <text class="label" x="200" y="238" text-anchor="middle">Process A</text>
  <text class="text" x="200" y="268" text-anchor="middle">user buffer</text>
  <rect class="kernel" x="420" y="205" width="240" height="95"/>
  <text class="label" x="540" y="238" text-anchor="middle">内核缓冲</text>
  <text class="text" x="540" y="268" text-anchor="middle">pipe / FIFO / message queue</text>
  <rect class="proc" x="775" y="205" width="210" height="95"/>
  <text class="label" x="880" y="238" text-anchor="middle">Process B</text>
  <text class="text" x="880" y="268" text-anchor="middle">user buffer</text>
  <path class="orangeArrow" d="M308 252 H416"/>
  <path class="orangeArrow" d="M664 252 H772"/>
  <rect class="gray" x="1025" y="205" width="150" height="95"/>
  <text class="label" x="1100" y="238" text-anchor="middle">语义</text>
  <text class="tiny" x="1100" y="266" text-anchor="middle">管道无边界</text>
  <text class="tiny" x="1100" y="288" text-anchor="middle">消息队列有边界</text>

  <rect class="proc" x="95" y="355" width="210" height="95"/>
  <text class="label" x="200" y="388" text-anchor="middle">Process A</text>
  <text class="text" x="200" y="418" text-anchor="middle">mmap MAP_SHARED</text>
  <rect class="shared" x="420" y="340" width="240" height="125"/>
  <text class="label" x="540" y="378" text-anchor="middle">同一批物理页</text>
  <text class="text" x="540" y="407" text-anchor="middle">POSIX shm / System V shm</text>
  <text class="tiny" x="540" y="433" text-anchor="middle">数据不走每次内核中转</text>
  <rect class="proc" x="775" y="355" width="210" height="95"/>
  <text class="label" x="880" y="388" text-anchor="middle">Process B</text>
  <text class="text" x="880" y="418" text-anchor="middle">mmap MAP_SHARED</text>
  <path class="greenArrow" d="M308 402 H416"/>
  <path class="greenArrow" d="M664 402 H772"/>
  <rect class="warn" x="1025" y="340" width="150" height="125"/>
  <text class="label" x="1100" y="374" text-anchor="middle">必须自带协议</text>
  <text class="tiny" x="1100" y="402" text-anchor="middle">锁/信号量</text>
  <text class="tiny" x="1100" y="424" text-anchor="middle">版本号/长度</text>
  <text class="tiny" x="1100" y="446" text-anchor="middle">崩溃恢复</text>

  <rect class="proc" x="95" y="505" width="210" height="88"/>
  <text class="label" x="200" y="538" text-anchor="middle">Process A</text>
  <text class="text" x="200" y="566" text-anchor="middle">socket endpoint</text>
  <rect class="kernel" x="420" y="505" width="240" height="88"/>
  <text class="label" x="540" y="538" text-anchor="middle">UDS / TCP / UDP</text>
  <text class="text" x="540" y="566" text-anchor="middle">协议栈、队列、背压</text>
  <rect class="proc" x="775" y="505" width="210" height="88"/>
  <text class="label" x="880" y="538" text-anchor="middle">Process B / Remote</text>
  <text class="text" x="880" y="566" text-anchor="middle">socket endpoint</text>
  <path class="arrow" d="M308 549 H416"/>
  <path class="arrow" d="M664 549 H772"/>
  <rect class="gray" x="1025" y="505" width="150" height="88"/>
  <text class="label" x="1100" y="538" text-anchor="middle">额外能力</text>
  <text class="tiny" x="1100" y="566" text-anchor="middle">UDS 可传 fd</text>

  <rect class="panel" x="58" y="670" width="1204" height="320"/>
  <text class="h2" x="90" y="712">2. 选型决策不是只按“快慢”</text>
  <rect class="gray" x="95" y="755" width="205" height="86"/>
  <text class="label" x="197" y="785" text-anchor="middle">顺序字节流</text>
  <text class="text" x="197" y="813" text-anchor="middle">pipe / FIFO / UDS stream</text>
  <rect class="gray" x="330" y="755" width="205" height="86"/>
  <text class="label" x="432" y="785" text-anchor="middle">消息边界</text>
  <text class="text" x="432" y="813" text-anchor="middle">message queue / UDS dgram</text>
  <rect class="gray" x="565" y="755" width="205" height="86"/>
  <text class="label" x="667" y="785" text-anchor="middle">本机大块数据</text>
  <text class="text" x="667" y="813" text-anchor="middle">shared memory + sync</text>
  <rect class="gray" x="800" y="755" width="205" height="86"/>
  <text class="label" x="902" y="785" text-anchor="middle">生命周期事件</text>
  <text class="text" x="902" y="813" text-anchor="middle">signal / eventfd</text>
  <rect class="gray" x="1035" y="755" width="150" height="86"/>
  <text class="label" x="1110" y="785" text-anchor="middle">跨机器</text>
  <text class="text" x="1110" y="813" text-anchor="middle">TCP / UDP</text>

  <rect class="warn" x="95" y="875" width="255" height="72"/>
  <text class="label" x="222" y="904" text-anchor="middle">对象生命周期</text>
  <text class="tiny" x="222" y="931" text-anchor="middle">System V: ipcs/ipcrm；POSIX: unlink</text>
  <rect class="warn" x="385" y="875" width="255" height="72"/>
  <text class="label" x="512" y="904" text-anchor="middle">容量与阻塞</text>
  <text class="tiny" x="512" y="931" text-anchor="middle">pipe size、队列上限、满队列策略</text>
  <rect class="warn" x="675" y="875" width="255" height="72"/>
  <text class="label" x="802" y="904" text-anchor="middle">同步与一致性</text>
  <text class="tiny" x="802" y="931" text-anchor="middle">半包、旧数据、崩溃后锁恢复</text>
  <rect class="warn" x="965" y="875" width="220" height="72"/>
  <text class="label" x="1075" y="904" text-anchor="middle">观测工具</text>
  <text class="tiny" x="1075" y="931" text-anchor="middle">ipcs、/dev/shm、lsof、ss</text>

  <rect class="panel" x="58" y="1020" width="1204" height="250"/>
  <text class="h2" x="90" y="1062">3. 面试高频陷阱</text>
  <rect class="warn" x="95" y="1100" width="245" height="95"/>
  <text class="label" x="217" y="1130" text-anchor="middle">共享内存只共享可见性</text>
  <text class="tiny" x="217" y="1158" text-anchor="middle">不提供互斥、顺序、消息边界</text>
  <rect class="warn" x="380" y="1100" width="245" height="95"/>
  <text class="label" x="502" y="1130" text-anchor="middle">管道是字节流</text>
  <text class="tiny" x="502" y="1158" text-anchor="middle">EOF/EPIPE/SIGPIPE 来自端点关闭</text>
  <rect class="warn" x="665" y="1100" width="245" height="95"/>
  <text class="label" x="787" y="1130" text-anchor="middle">信号不是业务队列</text>
  <text class="tiny" x="787" y="1158" text-anchor="middle">普通信号可能合并；handler 受限制</text>
  <rect class="warn" x="950" y="1100" width="245" height="95"/>
  <text class="label" x="1072" y="1130" text-anchor="middle">别忘清理持久对象</text>
  <text class="tiny" x="1072" y="1158" text-anchor="middle">mq_unlink / shm_unlink / IPC_RMID</text>
</svg>
