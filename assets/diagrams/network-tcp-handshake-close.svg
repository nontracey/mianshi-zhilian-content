<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">TCP 三次握手、四次挥手、TIME_WAIT/CLOSE_WAIT 与 syncookies</title>
  <desc id="desc">分三段展示 TCP 握手的 seq/ack 闭合、挥手的半关闭状态、TIME_WAIT/CLOSE_WAIT 的归属，以及 SYN queue、accept queue 与 syncookies 的关系。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .title { font: 800 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .panel-title { font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 14; }
      .green { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 14; }
      .amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; rx: 14; }
      .red { fill: #fef2f2; stroke: #f87171; stroke-width: 2; rx: 14; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .line-blue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .line-green { stroke: #059669; stroke-width: 4; fill: none; marker-end: url(#arrow-green); }
      .line-red { stroke: #dc2626; stroke-width: 4; fill: none; marker-end: url(#arrow-red); }
      .lifeline { stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text class="title" x="640" y="58" text-anchor="middle">TCP 三次握手与四次挥手</text>
  <text class="subtitle" x="640" y="92" text-anchor="middle">三次握手闭合 ISN 确认；四次挥手来自全双工半关闭；队列与 syncookies 是服务端抗压边界</text>

  <rect class="panel" x="60" y="120" width="1160" height="300"/>
  <text class="panel-title" x="92" y="162">1. 三次握手：双方都确认对方 ISN</text>
  <rect class="blue" x="105" y="205" width="180" height="64"/>
  <text class="label" x="195" y="244" text-anchor="middle">Client</text>
  <rect class="green" x="995" y="205" width="180" height="64"/>
  <text class="label" x="1085" y="244" text-anchor="middle">Server</text>
  <line class="lifeline" x1="195" y1="276" x2="195" y2="390"/>
  <line class="lifeline" x1="1085" y1="276" x2="1085" y2="390"/>
  <path class="line-blue" d="M 205 292 L 1075 292"/>
  <text class="small" x="640" y="280" text-anchor="middle">1) SYN, seq=x（SYN 占 1 个序号）</text>
  <path class="line-green" d="M 1075 330 L 205 330"/>
  <text class="small" x="640" y="320" text-anchor="middle">2) SYN+ACK, seq=y, ack=x+1</text>
  <path class="line-blue" d="M 205 368 L 1075 368"/>
  <text class="small" x="640" y="358" text-anchor="middle">3) ACK, ack=y+1；双方确认彼此收发能力</text>
  <rect class="gray" x="380" y="386" width="520" height="42"/>
  <text class="small" x="640" y="413" text-anchor="middle">两次缺少“客户端确认服务端 ISN”；四次可把服务端 ACK+SYN 合并</text>

  <rect class="panel" x="60" y="455" width="1160" height="335"/>
  <text class="panel-title" x="92" y="497">2. 四次挥手：FIN 只关闭一个发送方向</text>
  <rect class="blue" x="105" y="535" width="180" height="64"/>
  <text class="label" x="195" y="574" text-anchor="middle">主动关闭方</text>
  <rect class="green" x="995" y="535" width="180" height="64"/>
  <text class="label" x="1085" y="574" text-anchor="middle">被动关闭方</text>
  <path class="line-red" d="M 205 620 L 1075 620"/>
  <text class="small" x="640" y="608" text-anchor="middle">1) FIN, seq=u：我不再发送，但还能接收</text>
  <path class="line-green" d="M 1075 656 L 205 656"/>
  <text class="small" x="640" y="646" text-anchor="middle">2) ACK, ack=u+1；服务端进入 CLOSE_WAIT</text>
  <rect class="amber" x="805" y="676" width="340" height="56"/>
  <text class="small" x="975" y="700" text-anchor="middle">CLOSE_WAIT：已 ACK，对端 FIN</text>
  <text class="tiny" x="975" y="722" text-anchor="middle">应用继续写剩余数据，稍后 close()</text>
  <path class="line-red" d="M 1075 744 L 205 744"/>
  <text class="small" x="640" y="734" text-anchor="middle">3) FIN, seq=v：被动方发送方向也关闭</text>
  <path class="line-green" d="M 205 776 L 1075 776"/>
  <text class="small" x="640" y="766" text-anchor="middle">4) ACK, ack=v+1；主动方进入 TIME_WAIT</text>
  <rect class="red" x="110" y="688" width="250" height="46"/>
  <text class="small" x="235" y="717" text-anchor="middle">TIME_WAIT 在主动 close 方</text>

  <rect class="panel" x="60" y="825" width="1160" height="315"/>
  <text class="panel-title" x="92" y="867">3. 服务端队列与 SYN flood：别把参数混在一起</text>
  <rect class="blue" x="100" y="905" width="210" height="80"/>
  <text class="label" x="205" y="936" text-anchor="middle">SYN 到达</text>
  <text class="tiny" x="205" y="963" text-anchor="middle">半连接还未完成</text>
  <path class="line-blue" d="M 315 945 L 455 945"/>
  <rect class="amber" x="460" y="905" width="250" height="80"/>
  <text class="label" x="585" y="936" text-anchor="middle">SYN queue</text>
  <text class="tiny" x="585" y="963" text-anchor="middle">受 tcp_max_syn_backlog 影响</text>
  <path class="line-green" d="M 715 945 L 855 945"/>
  <rect class="green" x="860" y="905" width="280" height="80"/>
  <text class="label" x="1000" y="936" text-anchor="middle">accept queue</text>
  <text class="tiny" x="1000" y="963" text-anchor="middle">min(listen backlog, somaxconn)</text>
  <rect class="red" x="175" y="1030" width="315" height="70"/>
  <text class="label" x="332" y="1058" text-anchor="middle">SYN flood</text>
  <text class="tiny" x="332" y="1084" text-anchor="middle">只发 SYN 不回 ACK，挤压半连接队列</text>
  <path class="line-red" d="M 492 1065 L 620 995"/>
  <rect class="gray" x="650" y="1022" width="430" height="86"/>
  <text class="label" x="865" y="1054" text-anchor="middle">syncookies 兜底</text>
  <text class="tiny" x="865" y="1080" text-anchor="middle">队列压力高时把连接信息编码进 SYN+ACK 序列号</text>
  <text class="tiny" x="865" y="1102" text-anchor="middle">不是扩队列替代品；选项能力与实现相关</text>

  <rect class="gray" x="84" y="1170" width="1112" height="62"/>
  <text class="small" x="640" y="1197" text-anchor="middle">排查锚点：TIME_WAIT 多看主动关闭和端口耗尽；CLOSE_WAIT 多看应用 close；SYN_RECV 多看半连接队列与攻击/丢包</text>
  <text class="small" x="640" y="1222" text-anchor="middle">调参顺序：先连接复用和 backlog，再看 syncookies；不要再使用已移除的 tcp_tw_recycle</text>
</svg>
