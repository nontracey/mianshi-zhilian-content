<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1280"><title id="title">TCP 三次握手、四次挥手、TIME_WAIT/CLOSE_WAIT 与 syncookies</title><desc id="desc">分三段展示 TCP 握手的 seq/ack 闭合、挥手的半关闭状态、TIME_WAIT/CLOSE_WAIT 的归属，以及 SYN queue、accept queue 与 syncookies 的关系。</desc><defs><marker id="arrow-blue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#059669" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.title{font:800 36px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.panel-title{font:700 27px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1e293b}.small{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.blue{fill:#eff6ff;stroke:#60a5fa}.amber,.blue,.gray{stroke-width:2;rx:14}.green{fill:#ecfdf5;stroke:#34d399}.green,.red{stroke-width:2;rx:14}.amber{fill:#fffbeb;stroke:#f59e0b}.red{fill:#fef2f2;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#cbd5e1}.line-blue{stroke:#2563eb;marker-end:url(#arrow-blue)}.line-blue,.line-green,.line-red{stroke-width:4;fill:none}.line-green{stroke:#059669;marker-end:url(#arrow-green)}.line-red{stroke:#dc2626;marker-end:url(#arrow-red)}.lifeline{stroke:#94a3b8;stroke-width:3;stroke-dasharray:8 8}</style></defs><rect width="1280" height="1280" class="bg"/><text x="640" y="58" class="title" text-anchor="middle">TCP 三次握手与四次挥手</text><text x="640" y="92" class="subtitle" text-anchor="middle">三次握手闭合 ISN 确认；四次挥手来自全双工半关闭；队列与 syncookies 是服务端抗压边界</text><rect width="1160" height="300" x="60" y="120" class="panel"/><text x="92" y="162" class="panel-title">1. 三次握手：双方都确认对方 ISN</text><rect width="180" height="64" x="105" y="205" class="blue"/><text x="195" y="244" class="label" text-anchor="middle">Client</text><rect width="180" height="64" x="995" y="205" class="green"/><text x="1085" y="244" class="label" text-anchor="middle">Server</text><line x1="195" x2="195" y1="276" y2="390" class="lifeline"/><line x1="1085" x2="1085" y1="276" y2="390" class="lifeline"/><path d="M 205 292 L 1075 292" class="line-blue"/><text x="640" y="280" class="small" text-anchor="middle">1) SYN, seq=x（SYN 占 1 个序号）</text><path d="M 1075 330 L 205 330" class="line-green"/><text x="640" y="320" class="small" text-anchor="middle">2) SYN+ACK, seq=y, ack=x+1</text><path d="M 205 368 L 1075 368" class="line-blue"/><text x="640" y="358" class="small" text-anchor="middle">3) ACK, ack=y+1；双方确认彼此收发能力</text><rect width="520" height="42" x="380" y="386" class="gray"/><text x="640" y="413" class="small" text-anchor="middle">两次缺少“客户端确认服务端 ISN”；四次可把服务端 ACK+SYN 合并</text><rect width="1160" height="335" x="60" y="455" class="panel"/><text x="92" y="497" class="panel-title">2. 四次挥手：FIN 只关闭一个发送方向</text><rect width="180" height="64" x="105" y="535" class="blue"/><text x="195" y="574" class="label" text-anchor="middle">主动关闭方</text><rect width="180" height="64" x="995" y="535" class="green"/><text x="1085" y="574" class="label" text-anchor="middle">被动关闭方</text><path d="M 205 620 L 1075 620" class="line-red"/><text x="640" y="608" class="small" text-anchor="middle">1) FIN, seq=u：我不再发送，但还能接收</text><path d="M 1075 656 L 205 656" class="line-green"/><text x="640" y="646" class="small" text-anchor="middle">2) ACK, ack=u+1；服务端进入 CLOSE_WAIT</text><rect width="340" height="56" x="805" y="676" class="amber"/><text x="975" y="700" class="small" text-anchor="middle">CLOSE_WAIT：已 ACK，对端 FIN</text><text x="975" y="722" class="tiny" text-anchor="middle">应用继续写剩余数据，稍后 close()</text><path d="M 1075 744 L 205 744" class="line-red"/><text x="640" y="734" class="small" text-anchor="middle">3) FIN, seq=v：被动方发送方向也关闭</text><path d="M 205 776 L 1075 776" class="line-green"/><text x="640" y="766" class="small" text-anchor="middle">4) ACK, ack=v+1；主动方进入 TIME_WAIT</text><rect width="250" height="46" x="110" y="688" class="red"/><text x="235" y="717" class="small" text-anchor="middle">TIME_WAIT 在主动 close 方</text><rect width="1160" height="315" x="60" y="825" class="panel"/><text x="92" y="867" class="panel-title">3. 服务端队列与 SYN flood：别把参数混在一起</text><rect width="210" height="80" x="100" y="905" class="blue"/><text x="205" y="936" class="label" text-anchor="middle">SYN 到达</text><text x="205" y="963" class="tiny" text-anchor="middle">半连接还未完成</text><path d="M 315 945 L 455 945" class="line-blue"/><rect width="250" height="80" x="460" y="905" class="amber"/><text x="585" y="936" class="label" text-anchor="middle">SYN queue</text><text x="585" y="963" class="tiny" text-anchor="middle">受 tcp_max_syn_backlog 影响</text><path d="M 715 945 L 855 945" class="line-green"/><rect width="280" height="80" x="860" y="905" class="green"/><text x="1000" y="936" class="label" text-anchor="middle">accept queue</text><text x="1000" y="963" class="tiny" text-anchor="middle">min(listen backlog, somaxconn)</text><rect width="315" height="70" x="175" y="1030" class="red"/><text x="332" y="1058" class="label" text-anchor="middle">SYN flood</text><text x="332" y="1084" class="tiny" text-anchor="middle">只发 SYN 不回 ACK，挤压半连接队列</text><path d="M 492 1065 L 620 995" class="line-red"/><rect width="430" height="86" x="650" y="1022" class="gray"/><text x="865" y="1054" class="label" text-anchor="middle">syncookies 兜底</text><text x="865" y="1080" class="tiny" text-anchor="middle">队列压力高时把连接信息编码进 SYN+ACK 序列号</text><text x="865" y="1102" class="tiny" text-anchor="middle">不是扩队列替代品；选项能力与实现相关</text><rect width="1112" height="62" x="84" y="1170" class="gray"/><text x="640" y="1197" class="small" text-anchor="middle">排查锚点：TIME_WAIT 多看主动关闭和端口耗尽；CLOSE_WAIT 多看应用 close；SYN_RECV 多看半连接队列与攻击/丢包</text><text x="640" y="1222" class="small" text-anchor="middle">调参顺序：先连接复用和 backlog，再看 syncookies；不要再使用已移除的 tcp_tw_recycle</text></svg>