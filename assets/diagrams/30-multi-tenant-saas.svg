<svg viewBox="0 0 680 210" width="100%" role="img" aria-label="多租户SaaS架构设计图">
<title>多租户SaaS架构设计图</title><desc>三种数据隔离方案对比</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">多租户数据隔离</text>
<rect x="40" y="52" width="190" height="70" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="135" y="76" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">独立数据库</text>
<text x="135" y="96" text-anchor="middle" font-size="11" font-weight="400" fill="#0F6E56" font-family="system-ui, sans-serif">隔离性最强</text>
<text x="135" y="112" text-anchor="middle" font-size="11" font-weight="400" fill="#993C1D" font-family="system-ui, sans-serif">成本最高</text>
<rect x="250" y="52" width="190" height="70" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="345" y="76" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">共享库独立Schema</text>
<text x="345" y="96" text-anchor="middle" font-size="11" font-weight="400" fill="#0F6E56" font-family="system-ui, sans-serif">中等隔离</text>
<text x="345" y="112" text-anchor="middle" font-size="11" font-weight="400" fill="#993C1D" font-family="system-ui, sans-serif">中等成本</text>
<rect x="460" y="52" width="190" height="70" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="555" y="76" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">共享表行级隔离</text>
<text x="555" y="96" text-anchor="middle" font-size="11" font-weight="400" fill="#0F6E56" font-family="system-ui, sans-serif">隔离性最低</text>
<text x="555" y="112" text-anchor="middle" font-size="11" font-weight="400" fill="#993C1D" font-family="system-ui, sans-serif">成本最低</text>
<rect x="60" y="140" width="560" height="50" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="160" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">租户路由: 请求 -&gt; TenantContext -&gt; 动态数据源切换</text>
<text x="340" y="180" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">ThreadLocal存储租户ID，拦截器自动注入</text>
</svg>