<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1360" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1360"><title id="title">JVM method area specification, HotSpot PermGen and Metaspace boundaries, StringTable, Code Cache, and classloader leak diagnostics</title><desc id="desc">A topic-specific diagram explaining the JVM method area as a specification concept, HotSpot JDK 7 PermGen and JDK 8+ Metaspace implementations, heap class mirrors static fields and StringTable, Code Cache, runtime constant pool, metaspace OOM causes, classloader leak and dynamic proxy paths, and diagnostic commands.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 32px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}</style></defs><rect width="1320" height="1360" class="bg"/><text x="70" y="64" class="title">方法区与元空间：规范、实现和排查边界</text><text x="70" y="96" class="subtitle">不要把方法区、永久代、元空间、字符串常量池、Code Cache 混成一块内存。</text><rect width="1180" height="340" x="70" y="130" class="panel" rx="16"/><text x="96" y="166" class="section-title">1. 规范概念到 HotSpot 实现</text><rect width="270" height="92" x="120" y="230" stroke-width="2" class="blue" rx="12"/><text x="147" y="262" class="box-title">JVM 规范：方法区</text><text x="147" y="287" class="text">类结构、运行时常量池</text><text x="147" y="307" class="text">字段/方法数据等</text><rect width="260" height="92" x="500" y="205" stroke-width="2" class="yellow" rx="12"/><text x="527" y="237" class="box-title">HotSpot JDK 7-</text><text x="527" y="262" class="mono">PermGen</text><text x="527" y="282" class="text">受 MaxPermSize 限制</text><rect width="260" height="92" x="500" y="330" stroke-width="2" class="green" rx="12"/><text x="527" y="362" class="box-title">HotSpot JDK 8+</text><text x="527" y="387" class="mono">Metaspace</text><text x="527" y="407" class="text">类元数据使用本地内存</text><rect width="275" height="92" x="875" y="265" stroke-width="2" class="violet" rx="12"/><text x="902" y="297" class="box-title">参数边界</text><text x="902" y="322" class="mono">MetaspaceSize</text><text x="1028" y="322" class="mono">MaxMetaspaceSize</text><text x="902" y="342" class="text">高水位 / 硬上限</text><path d="M390 276 H491" class="arrow"/><path d="M390 276 C440 330 455 365 491 376" class="arrow"/><path d="M760 251 H866" class="arrow"/><path d="M760 376 H866" class="arrow"/><rect width="1180" height="285" x="70" y="510" class="panel" rx="16"/><text x="96" y="546" class="section-title">2. HotSpot JDK 8+ 常见位置</text><rect width="245" height="82" x="105" y="610" stroke-width="2" class="green" rx="12"/><text x="132" y="642" class="box-title">Metaspace</text><text x="132" y="667" class="text">类元数据、方法/字段元信息</text><rect width="245" height="82" x="400" y="610" stroke-width="2" class="red" rx="12"/><text x="427" y="642" class="box-title">Java Heap</text><text x="427" y="667" class="text">Class 镜像、静态字段值、StringTable</text><rect width="245" height="82" x="695" y="610" stroke-width="2" class="blue" rx="12"/><text x="722" y="642" class="box-title">Code Cache</text><text x="722" y="667" class="text">JIT 编译后的机器码</text><rect width="220" height="82" x="990" y="610" stroke-width="2" class="yellow" rx="12"/><text x="1017" y="642" class="box-title">Runtime Constant Pool</text><text x="1017" y="667" class="text">每个类的常量池结构</text><rect width="1030" height="40" x="145" y="725" stroke-width="2" class="cyan" rx="12"/><text x="172" y="751" class="text">StringTable 和运行时常量池不是同一个概念；JDK 7+ StringTable 在堆中，类元数据常量池结构在 Metaspace 体系中。</text><rect width="1180" height="285" x="70" y="835" class="panel" rx="16"/><text x="96" y="871" class="section-title">3. Metaspace OOM 常见路径</text><rect width="250" height="86" x="105" y="935" stroke-width="2" class="red" rx="12"/><text x="132" y="967" class="box-title">动态类过多</text><text x="132" y="992" class="text">CGLIB/ByteBuddy/Javassist</text><rect width="250" height="86" x="405" y="935" stroke-width="2" class="yellow" rx="12"/><text x="432" y="967" class="box-title">ClassLoader 泄漏</text><text x="432" y="992" class="text">热部署、插件、脚本引擎未卸载</text><rect width="250" height="86" x="705" y="935" stroke-width="2" class="violet" rx="12"/><text x="732" y="967" class="box-title">类卸载条件不满足</text><text x="732" y="992" class="text">Class、实例或加载器仍被引用</text><rect width="205" height="86" x="1005" y="935" stroke-width="2" class="blue" rx="12"/><text x="1032" y="967" class="box-title">工具</text><text x="1032" y="992" class="mono">jcmd VM.metaspace</text><text x="1032" y="1012" class="mono">jmap -clstats</text><rect width="1180" height="105" x="70" y="1160" class="panel" rx="16"/><text x="96" y="1196" class="section-title">4. 答题顺序</text><text x="120" y="1234" class="text">先说方法区是规范，再说 HotSpot 从 PermGen 迁到 Metaspace；随后明确 StringTable、静态字段值、Code Cache 的位置。</text><text x="120" y="1260" class="text">排查 Metaspace OOM 时，围绕类加载数量、ClassLoader 引用链、动态生成类和类卸载条件展开。</text><text x="96" y="1318" class="small">面试抓手：规范 vs 实现、PermGen vs Metaspace、MetaspaceSize/MaxMetaspaceSize、StringTable 位置、ClassLoader 泄漏、jcmd/jmap 排查。</text></svg>