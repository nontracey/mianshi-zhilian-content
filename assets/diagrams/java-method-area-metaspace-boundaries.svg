<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1360" viewBox="0 0 1320 1360" role="img" aria-labelledby="title desc">
  <title id="title">JVM method area specification, HotSpot PermGen and Metaspace boundaries, StringTable, Code Cache, and classloader leak diagnostics</title>
  <desc id="desc">A topic-specific diagram explaining the JVM method area as a specification concept, HotSpot JDK 7 PermGen and JDK 8+ Metaspace implementations, heap class mirrors static fields and StringTable, Code Cache, runtime constant pool, metaspace OOM causes, classloader leak and dynamic proxy paths, and diagnostic commands.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1360"/>
  <text class="title" x="70" y="64">方法区与元空间：规范、实现和排查边界</text>
  <text class="subtitle" x="70" y="96">不要把方法区、永久代、元空间、字符串常量池、Code Cache 混成一块内存。</text>

  <rect class="panel" x="70" y="130" width="1180" height="340" rx="16"/>
  <text class="section-title" x="96" y="166">1. 规范概念到 HotSpot 实现</text>

  <rect class="blue" x="120" y="230" width="270" height="92" rx="12" stroke-width="2"/>
  <text class="box-title" x="147" y="262">JVM 规范：方法区</text>
  <text class="text" x="147" y="287">类结构、运行时常量池</text>
  <text class="text" x="147" y="307">字段/方法数据等</text>

  <rect class="yellow" x="500" y="205" width="260" height="92" rx="12" stroke-width="2"/>
  <text class="box-title" x="527" y="237">HotSpot JDK 7-</text>
  <text class="mono" x="527" y="262">PermGen</text>
  <text class="text" x="527" y="282">受 MaxPermSize 限制</text>

  <rect class="green" x="500" y="330" width="260" height="92" rx="12" stroke-width="2"/>
  <text class="box-title" x="527" y="362">HotSpot JDK 8+</text>
  <text class="mono" x="527" y="387">Metaspace</text>
  <text class="text" x="527" y="407">类元数据使用本地内存</text>

  <rect class="violet" x="875" y="265" width="275" height="92" rx="12" stroke-width="2"/>
  <text class="box-title" x="902" y="297">参数边界</text>
  <text class="mono" x="902" y="322">MetaspaceSize</text>
  <text class="mono" x="1028" y="322">MaxMetaspaceSize</text>
  <text class="text" x="902" y="342">高水位 / 硬上限</text>

  <path class="arrow" d="M390 276 H491"/>
  <path class="arrow" d="M390 276 C440 330 455 365 491 376"/>
  <path class="arrow" d="M760 251 H866"/>
  <path class="arrow" d="M760 376 H866"/>

  <rect class="panel" x="70" y="510" width="1180" height="285" rx="16"/>
  <text class="section-title" x="96" y="546">2. HotSpot JDK 8+ 常见位置</text>

  <rect class="green" x="105" y="610" width="245" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="642">Metaspace</text>
  <text class="text" x="132" y="667">类元数据、方法/字段元信息</text>

  <rect class="red" x="400" y="610" width="245" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="427" y="642">Java Heap</text>
  <text class="text" x="427" y="667">Class 镜像、静态字段值、StringTable</text>

  <rect class="blue" x="695" y="610" width="245" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="722" y="642">Code Cache</text>
  <text class="text" x="722" y="667">JIT 编译后的机器码</text>

  <rect class="yellow" x="990" y="610" width="220" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1017" y="642">Runtime Constant Pool</text>
  <text class="text" x="1017" y="667">每个类的常量池结构</text>

  <rect class="cyan" x="145" y="725" width="1030" height="40" rx="12" stroke-width="2"/>
  <text class="text" x="172" y="751">StringTable 和运行时常量池不是同一个概念；JDK 7+ StringTable 在堆中，类元数据常量池结构在 Metaspace 体系中。</text>

  <rect class="panel" x="70" y="835" width="1180" height="285" rx="16"/>
  <text class="section-title" x="96" y="871">3. Metaspace OOM 常见路径</text>

  <rect class="red" x="105" y="935" width="250" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="967">动态类过多</text>
  <text class="text" x="132" y="992">CGLIB/ByteBuddy/Javassist</text>

  <rect class="yellow" x="405" y="935" width="250" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="432" y="967">ClassLoader 泄漏</text>
  <text class="text" x="432" y="992">热部署、插件、脚本引擎未卸载</text>

  <rect class="violet" x="705" y="935" width="250" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="732" y="967">类卸载条件不满足</text>
  <text class="text" x="732" y="992">Class、实例或加载器仍被引用</text>

  <rect class="blue" x="1005" y="935" width="205" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="1032" y="967">工具</text>
  <text class="mono" x="1032" y="992">jcmd VM.metaspace</text>
  <text class="mono" x="1032" y="1012">jmap -clstats</text>

  <rect class="panel" x="70" y="1160" width="1180" height="105" rx="16"/>
  <text class="section-title" x="96" y="1196">4. 答题顺序</text>
  <text class="text" x="120" y="1234">先说方法区是规范，再说 HotSpot 从 PermGen 迁到 Metaspace；随后明确 StringTable、静态字段值、Code Cache 的位置。</text>
  <text class="text" x="120" y="1260">排查 Metaspace OOM 时，围绕类加载数量、ClassLoader 引用链、动态生成类和类卸载条件展开。</text>

  <text class="small" x="96" y="1318">面试抓手：规范 vs 实现、PermGen vs Metaspace、MetaspaceSize/MaxMetaspaceSize、StringTable 位置、ClassLoader 泄漏、jcmd/jmap 排查。</text>
</svg>
