<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">内存泄漏与 OOM 的排查闭环</title><desc id="desc">展示内存上涨时如何先区分峰值、泄漏和配置问题，再按 Java 堆、堆外、C/C++ native、fd/句柄、cgroup OOM 等区域选择工具并验证修复。</desc><defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:10}.title{font:700 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:600 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.h2{font:700 25px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:700 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:600 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:700 14px &quot;SFMono-Regular&quot;,Consolas,monospace;fill:#0f172a}.blue{fill:#eff6ff;stroke:#60a5fa}.amber,.blue,.gray{stroke-width:2;rx:8}.green{fill:#ecfdf5;stroke:#34d399}.green,.red{stroke-width:2;rx:8}.amber{fill:#fffbeb;stroke:#f59e0b}.red{fill:#fef2f2;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#cbd5e1}.arrow,.warnArrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}.warnArrow{stroke:#dc2626;marker-end:url(#warnArrow)}</style><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#2563eb" d="M2,2 L10,6 L2,10 Z"/></marker><marker id="warnArrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#dc2626" d="M2,2 L10,6 L2,10 Z"/></marker></defs><rect width="1320" height="1320" class="bg"/><text x="660" y="55" class="title" text-anchor="middle">内存上涨别急着调大：先证明是哪一类内存没有回落</text><text x="660" y="88" class="subtitle" text-anchor="middle">泄漏是过程，OOM 是结果；关键证据是回收/压力释放后基线是否持续抬升</text><rect width="1204" height="360" x="58" y="120" class="panel"/><text x="90" y="162" class="h2">1. 先判定趋势：峰值、泄漏还是配置不足</text><rect width="245" height="95" x="95" y="205" class="blue"/><text x="217" y="236" class="label" text-anchor="middle">现象</text><text x="217" y="264" class="text" text-anchor="middle">RSS / heap / native / fd 持续上涨</text><path d="M343 252 H410" class="arrow"/><rect width="245" height="95" x="415" y="205" class="green"/><text x="537" y="236" class="label" text-anchor="middle">制造回收点</text><text x="537" y="260" class="text" text-anchor="middle">Full GC / 流量下降</text><text x="537" y="282" class="text" text-anchor="middle">释放缓存 / 关闭连接</text><path d="M663 252 H730" class="arrow"/><rect width="245" height="95" x="735" y="205" class="amber"/><text x="857" y="236" class="label" text-anchor="middle">看基线是否回落</text><text x="857" y="260" class="text" text-anchor="middle">回落：峰值/容量</text><text x="857" y="282" class="text" text-anchor="middle">不回落：疑似泄漏</text><path d="M983 252 H1050" class="warnArrow"/><rect width="140" height="95" x="1055" y="205" class="red"/><text x="1125" y="236" class="label" text-anchor="middle">结果</text><text x="1125" y="264" class="text" text-anchor="middle">OOM / killer</text><rect width="335" height="82" x="95" y="350" class="gray"/><text x="262" y="380" class="label" text-anchor="middle">配置不足</text><text x="262" y="408" class="tiny" text-anchor="middle">峰值能回落，但上限太小或瞬时大对象太多</text><rect width="335" height="82" x="492" y="350" class="gray"/><text x="659" y="380" class="label" text-anchor="middle">真泄漏</text><text x="659" y="408" class="tiny" text-anchor="middle">回收后基线仍抬升，存在长生命周期持有者</text><rect width="306" height="82" x="889" y="350" class="gray"/><text x="1042" y="380" class="label" text-anchor="middle">观测误读</text><text x="1042" y="408" class="tiny" text-anchor="middle">VIRT 不等于 RSS；page cache 不等于进程泄漏</text><rect width="1204" height="445" x="58" y="515" class="panel"/><text x="90" y="557" class="h2">2. 按区域选择工具，而不是只盯堆</text><rect width="260" height="115" x="95" y="600" class="blue"/><text x="225" y="631" class="label" text-anchor="middle">Java heap</text><text x="225" y="659" class="mono" text-anchor="middle">jstat → jmap dump → MAT</text><text x="225" y="687" class="tiny" text-anchor="middle">Dominator Tree / GC Roots 找持有者</text><rect width="260" height="115" x="390" y="600" class="green"/><text x="520" y="631" class="label" text-anchor="middle">Direct/native</text><text x="520" y="659" class="mono" text-anchor="middle">jcmd VM.native_memory</text><text x="520" y="687" class="tiny" text-anchor="middle">DirectByteBuffer、JNI、线程栈、mmap</text><rect width="260" height="115" x="685" y="600" class="amber"/><text x="815" y="631" class="label" text-anchor="middle">C/C++ heap</text><text x="815" y="659" class="mono" text-anchor="middle">ASan / LSan / valgrind</text><text x="815" y="687" class="tiny" text-anchor="middle">未 free、越界、use-after-free</text><rect width="215" height="115" x="980" y="600" class="red"/><text x="1087" y="631" class="label" text-anchor="middle">fd / 句柄</text><text x="1087" y="659" class="mono" text-anchor="middle">lsof / /proc</text><text x="1087" y="687" class="tiny" text-anchor="middle">连接、文件、eventfd 泄漏</text><rect width="260" height="115" x="95" y="760" class="gray"/><text x="225" y="791" class="label" text-anchor="middle">Linux 进程视角</text><text x="225" y="819" class="mono" text-anchor="middle">/proc/PID/status</text><text x="225" y="844" class="mono" text-anchor="middle">smaps_rollup / pmap</text><rect width="260" height="115" x="390" y="760" class="gray"/><text x="520" y="791" class="label" text-anchor="middle">容器 / cgroup</text><text x="520" y="819" class="mono" text-anchor="middle">memory.current</text><text x="520" y="844" class="mono" text-anchor="middle">oom_kill / dmesg</text><rect width="260" height="115" x="685" y="760" class="gray"/><text x="815" y="791" class="label" text-anchor="middle">栈溢出</text><text x="815" y="819" class="mono" text-anchor="middle">StackOverflowError</text><text x="815" y="844" class="tiny" text-anchor="middle">递归深度/栈帧大，不是堆泄漏</text><rect width="215" height="115" x="980" y="760" class="gray"/><text x="1087" y="791" class="label" text-anchor="middle">验证修复</text><text x="1087" y="819" class="mono" text-anchor="middle">压测曲线</text><text x="1087" y="844" class="tiny" text-anchor="middle">RSS/old gen/fd 基线稳定</text><rect width="1204" height="275" x="58" y="995" class="panel"/><text x="90" y="1037" class="h2">3. 修复方向：找到“持有者”或“所有权边界”</text><rect width="250" height="88" x="95" y="1080" class="red"/><text x="220" y="1110" class="label" text-anchor="middle">长生命周期持有短对象</text><text x="220" y="1138" class="tiny" text-anchor="middle">static cache、listener、ThreadLocal</text><rect width="250" height="88" x="380" y="1080" class="red"/><text x="505" y="1110" class="label" text-anchor="middle">没有容量上限</text><text x="505" y="1138" class="tiny" text-anchor="middle">LRU/TTL/限流/分页/背压</text><rect width="250" height="88" x="665" y="1080" class="red"/><text x="790" y="1110" class="label" text-anchor="middle">资源所有权不清</text><text x="790" y="1138" class="tiny" text-anchor="middle">try-with-resources / defer / RAII</text><rect width="245" height="88" x="950" y="1080" class="red"/><text x="1072" y="1110" class="label" text-anchor="middle">异常路径漏释放</text><text x="1072" y="1138" class="tiny" text-anchor="middle">finally、cleanup hook、超时清理</text><rect width="1100" height="45" x="95" y="1205" class="gray"/><text x="645" y="1234" class="text" text-anchor="middle">结论要能闭环：上涨曲线 → 区域归因 → 持有者/分配栈 → 修复 → 同等压测下基线稳定</text></svg>