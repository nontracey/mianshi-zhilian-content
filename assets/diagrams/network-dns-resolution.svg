<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">DNS resolution path with cache, recursion, iteration, CNAME, CDN scheduling and failures</title>
  <desc id="desc">DNS resolution diagram: client-side cache and system resolver, recursive resolver cache, iterative queries to root, TLD and authoritative DNS, CNAME branch to CDN authoritative DNS, TTL write-back and failure diagnosis.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#64748b" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 18; filter: url(#shadow); }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.3; rx: 12; }
      .cache { fill: #fff7ed; stroke: #f97316; stroke-width: 1.6; rx: 12; }
      .resolver { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.7; rx: 12; }
      .auth { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 12; }
      .cdn { fill: #fdf4ff; stroke: #c026d3; stroke-width: 1.5; rx: 12; }
      .fail { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.4; rx: 12; }
      .tool { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.2; rx: 12; }
      .query { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .answer { fill: none; stroke: #059669; stroke-width: 2.4; stroke-dasharray: 8 6; marker-end: url(#arrow-green); }
      .error { fill: none; stroke: #dc2626; stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow-red); }
      .label { fill: #0f172a; font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section { fill: #0f172a; font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #334155; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { fill: #475569; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .caption { fill: #475569; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .num { fill: #ffffff; font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .numCircle { fill: #2563eb; }
      .greenCircle { fill: #059669; }
      .redCircle { fill: #dc2626; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="58" y="52" class="label">DNS 解析全路径：缓存、递归、迭代、CNAME 与 CDN 调度</text>
  <text x="58" y="84" class="caption">蓝色为查询，绿色虚线为答案/缓存回写，红色虚线为排查时常见失败落点。</text>

  <rect x="48" y="122" width="255" height="410" class="panel"/>
  <text x="76" y="160" class="section">客户端侧</text>
  <rect x="76" y="186" width="199" height="66" class="cache"/>
  <text x="98" y="212" class="small">浏览器/应用缓存</text>
  <text x="98" y="235" class="tiny">命中则不进入系统解析</text>
  <rect x="76" y="282" width="199" height="76" class="cache"/>
  <text x="98" y="309" class="small">系统解析链</text>
  <text x="98" y="332" class="tiny">hosts / nsswitch</text>
  <text x="98" y="350" class="tiny">OS resolver cache</text>
  <rect x="76" y="426" width="199" height="70" class="box"/>
  <text x="98" y="453" class="small">应用拿到 IP</text>
  <text x="98" y="476" class="tiny">继续 TCP/TLS/HTTP</text>

  <rect x="360" y="122" width="280" height="410" class="panel"/>
  <text x="388" y="160" class="section">本地递归 DNS</text>
  <rect x="390" y="186" width="220" height="78" class="resolver"/>
  <text x="414" y="214" class="small">递归解析器</text>
  <text x="414" y="238" class="tiny">对客户端返回最终答案</text>
  <rect x="390" y="294" width="220" height="76" class="cache"/>
  <text x="414" y="321" class="small">递归缓存</text>
  <text x="414" y="344" class="tiny">A/AAAA/CNAME/NS 按 TTL</text>
  <rect x="390" y="426" width="220" height="70" class="box"/>
  <text x="414" y="453" class="small">TTL 写回</text>
  <text x="414" y="476" class="tiny">旧记录到期前仍可命中</text>

  <rect x="700" y="122" width="245" height="410" class="panel"/>
  <text x="728" y="160" class="section">权威链路</text>
  <rect x="730" y="186" width="185" height="62" class="auth"/>
  <text x="752" y="212" class="small">根 DNS</text>
  <text x="752" y="232" class="tiny">返回 TLD NS</text>
  <rect x="730" y="282" width="185" height="62" class="auth"/>
  <text x="752" y="308" class="small">TLD DNS</text>
  <text x="752" y="328" class="tiny">返回权威 NS</text>
  <rect x="730" y="378" width="185" height="82" class="auth"/>
  <text x="752" y="405" class="small">业务权威 DNS</text>
  <text x="752" y="428" class="tiny">返回 A/AAAA</text>
  <text x="752" y="446" class="tiny">或 CNAME</text>

  <rect x="990" y="122" width="240" height="410" class="panel"/>
  <text x="1018" y="160" class="section">CDN 权威</text>
  <rect x="1020" y="196" width="180" height="70" class="cdn"/>
  <text x="1040" y="224" class="small">CNAME 目标域</text>
  <text x="1040" y="247" class="tiny">cdn.example.net</text>
  <rect x="1020" y="306" width="180" height="74" class="cdn"/>
  <text x="1040" y="333" class="small">GeoDNS / ECS</text>
  <text x="1040" y="356" class="tiny">按 LDNS 出口或</text>
  <text x="1040" y="374" class="tiny">客户端子网调度</text>
  <rect x="1020" y="426" width="180" height="70" class="box"/>
  <text x="1040" y="453" class="small">边缘节点 IP</text>
  <text x="1040" y="476" class="tiny">写回递归缓存</text>

  <circle cx="175" cy="270" r="13" class="numCircle"/><text x="171" y="275" class="num">1</text>
  <circle cx="500" cy="278" r="13" class="numCircle"/><text x="496" y="283" class="num">2</text>
  <circle cx="823" cy="266" r="13" class="numCircle"/><text x="819" y="271" class="num">3</text>
  <circle cx="970" cy="390" r="13" class="numCircle"/><text x="966" y="395" class="num">4</text>
  <circle cx="500" cy="402" r="13" class="greenCircle"/><text x="496" y="407" class="num">5</text>

  <path class="query" d="M175 252 L175 282"/>
  <path class="query" d="M275 320 C315 320 338 225 390 225"/>
  <path class="answer" d="M390 332 C324 338 304 460 275 460"/>
  <text x="300" y="356" class="tiny">递归缓存命中</text>
  <path class="query" d="M610 225 C660 225 680 217 730 217"/>
  <path class="query" d="M823 248 L823 282"/>
  <path class="query" d="M823 344 L823 378"/>
  <path class="answer" d="M730 420 C670 420 646 332 610 332"/>
  <path class="query" d="M915 420 C950 420 980 230 1020 230"/>
  <path class="query" d="M1110 266 L1110 306"/>
  <path class="query" d="M1110 380 L1110 426"/>
  <path class="answer" d="M1020 460 C900 520 720 460 610 460"/>
  <path class="answer" d="M390 460 C320 470 300 462 275 462"/>

  <rect x="48" y="590" width="1182" height="292" class="panel"/>
  <text x="76" y="632" class="section">失败模式要先分类，再定位层级</text>
  <rect x="76" y="660" width="250" height="94" class="fail"/>
  <text x="102" y="690" class="small">NXDOMAIN</text>
  <text x="102" y="716" class="tiny">权威确认记录不存在</text>
  <text x="102" y="736" class="tiny">重点看域名、zone 与委派</text>
  <rect x="356" y="660" width="250" height="94" class="fail"/>
  <text x="382" y="690" class="small">SERVFAIL</text>
  <text x="382" y="716" class="tiny">递归或权威处理失败</text>
  <text x="382" y="736" class="tiny">常见于 DNSSEC/超时/配置错</text>
  <rect x="636" y="660" width="250" height="94" class="fail"/>
  <text x="662" y="690" class="small">超时无响应</text>
  <text x="662" y="716" class="tiny">UDP 丢包、网络策略</text>
  <text x="662" y="736" class="tiny">或权威不可达</text>
  <rect x="916" y="660" width="250" height="94" class="fail"/>
  <text x="942" y="690" class="small">错 IP</text>
  <text x="942" y="716" class="tiny">劫持、缓存污染</text>
  <text x="942" y="736" class="tiny">或 GeoDNS 调度偏离</text>

  <path class="error" d="M730 420 C500 520 218 606 200 660"/>
  <path class="error" d="M823 460 C660 542 505 602 482 660"/>
  <path class="error" d="M610 225 C690 492 744 590 760 660"/>
  <path class="error" d="M1110 380 C1100 520 1050 600 1042 660"/>

  <rect x="76" y="790" width="1090" height="58" class="tool"/>
  <text x="102" y="816" class="small">排查顺序</text>
  <text x="204" y="816" class="tiny">dig +trace 看断在哪级</text>
  <text x="420" y="816" class="tiny">直接问权威绕过递归缓存</text>
  <text x="672" y="816" class="tiny">对比多家递归看差异</text>
  <text x="882" y="816" class="tiny">+dnssec/AD 看签名验证</text>
  <text x="204" y="838" class="tiny">whoami.akamai.net 辅助确认 LDNS 出口与 CDN 调度参考点</text>

  <rect x="48" y="928" width="1182" height="226" class="panel"/>
  <text x="76" y="970" class="section">面试表达的关键结论</text>
  <text x="76" y="1004" class="small">1. 客户端到本地递归 DNS 是递归查询；本地递归到根、TLD、权威是迭代查询。</text>
  <text x="76" y="1040" class="small">2. TTL 控制缓存窗口；DNS 已切换不代表旧连接和各层缓存立即消失。</text>
  <text x="76" y="1076" class="small">3. CNAME 到 CDN 后，权威 DNS 常按 LDNS 出口或 ECS 子网返回边缘节点 IP。</text>
  <text x="76" y="1112" class="small">4. DoH/DoT 保护客户端到递归解析器这一段；DNSSEC 保护记录真实性，不负责加密查询。</text>
  <text x="76" y="1186" class="caption">不要把 hosts、浏览器缓存、OS cache 的顺序说成所有平台完全一致；也不要把 EDNS0 前的 512B 限制当成现代 DNS 的固定上限。</text>
</svg>
