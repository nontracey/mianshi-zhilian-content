<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1420" viewBox="0 0 1320 1420" role="img" aria-labelledby="title desc">
  <title id="title">JVM heap allocation, young GC, promotion, G1 humongous objects, and OOM diagnostics</title>
  <desc id="desc">A topic-specific diagram explaining JVM heap allocation path: escape analysis and scalar replacement, TLAB and Eden allocation, young GC copying to survivor, age and dynamic tenuring, promotion to old generation, traditional generational collectors versus G1 regions and humongous objects, and heap OOM diagnostic flow.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1420"/>
  <text class="title" x="70" y="64">堆内存：对象分配、晋升与 OOM 排查路径</text>
  <text class="subtitle" x="70" y="96">语义上对象从堆分配；具体布局受收集器影响，不能把某一种分代比例当成 JVM 规范。</text>

  <rect class="panel" x="70" y="130" width="1180" height="380" rx="16"/>
  <text class="section-title" x="96" y="166">1. 对象分配主路径</text>

  <rect class="blue" x="105" y="225" width="180" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="257">new 对象</text>
  <text class="text" x="132" y="282">语义上需要实例</text>

  <rect class="cyan" x="340" y="225" width="220" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="367" y="257">逃逸分析</text>
  <text class="text" x="367" y="282">可能标量替换，消除实际分配</text>

  <rect class="green" x="615" y="225" width="200" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="642" y="257">TLAB</text>
  <text class="text" x="642" y="282">线程本地分配缓冲，减少竞争</text>

  <rect class="yellow" x="870" y="225" width="200" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="897" y="257">Eden / Young Region</text>
  <text class="text" x="897" y="282">快速指针碰撞分配</text>

  <rect class="red" x="1110" y="225" width="105" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1137" y="257">失败</text>
  <text class="text" x="1137" y="282">触发 GC/OOM</text>

  <path class="arrow" d="M285 266 H331"/>
  <path class="arrow" d="M560 266 H606"/>
  <path class="arrow" d="M815 266 H861"/>
  <path class="arrow" d="M1070 266 H1101"/>

  <rect class="violet" x="165" y="360" width="980" height="62" rx="12" stroke-width="2"/>
  <text class="box-title" x="192" y="389">大对象边界</text>
  <text class="text" x="192" y="412">传统收集器可能按 PretenureSizeThreshold 进入老年代；G1 中超过半个 Region 的对象按 Humongous 处理。</text>

  <rect class="panel" x="70" y="550" width="575" height="330" rx="16"/>
  <text class="section-title" x="96" y="586">2. Young GC 与晋升</text>

  <rect class="yellow" x="105" y="640" width="230" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="671">Young / Minor GC</text>
  <text class="text" x="132" y="696">从 GC Roots 判断可达对象</text>

  <rect class="green" x="375" y="640" width="230" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="402" y="671">Survivor</text>
  <text class="text" x="402" y="696">复制存活对象，年龄加一</text>

  <rect class="red" x="105" y="760" width="230" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="791">晋升 Old</text>
  <text class="text" x="132" y="816">年龄、动态年龄、Survivor 放不下</text>

  <rect class="blue" x="375" y="760" width="230" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="402" y="791">仍在 Survivor</text>
  <text class="text" x="402" y="816">未达晋升条件，等待下次回收</text>

  <path class="arrow" d="M335 679 H366"/>
  <path class="arrow" d="M490 718 C490 738 235 738 220 751"/>
  <path class="arrow" d="M490 718 V751"/>

  <rect class="panel" x="675" y="550" width="575" height="330" rx="16"/>
  <text class="section-title" x="701" y="586">3. 收集器差异</text>

  <rect class="green" x="710" y="640" width="230" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="737" y="672">传统分代</text>
  <text class="text" x="737" y="697">Eden / S0 / S1 / Old</text>
  <text class="mono" x="737" y="716">NewRatio, SurvivorRatio</text>

  <rect class="blue" x="980" y="640" width="230" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="1007" y="672">G1</text>
  <text class="text" x="1007" y="697">Region 化，Young 动态调整</text>
  <text class="text" x="1007" y="716">Humongous 对象单独处理</text>

  <rect class="yellow" x="710" y="770" width="500" height="56" rx="12" stroke-width="2"/>
  <text class="text" x="737" y="804">调优参数要结合收集器：同一个 -Xmn / SurvivorRatio / PretenureSizeThreshold 未必都生效。</text>

  <rect class="panel" x="70" y="920" width="1180" height="260" rx="16"/>
  <text class="section-title" x="96" y="956">4. 堆 OOM/频繁 GC 诊断</text>

  <rect class="red" x="105" y="1010" width="250" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="1042">Live Set 过大</text>
  <text class="text" x="132" y="1067">Full/Old GC 后占用降不下来</text>

  <rect class="yellow" x="405" y="1010" width="250" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="432" y="1042">分配速率过高</text>
  <text class="text" x="432" y="1067">Young GC 频繁，Eden 很快打满</text>

  <rect class="violet" x="705" y="1010" width="250" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="732" y="1042">晋升/担保压力</text>
  <text class="text" x="732" y="1067">Survivor 放不下，Old 增长快</text>

  <rect class="blue" x="1005" y="1010" width="205" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1032" y="1042">工具</text>
  <text class="text" x="1032" y="1067">GC log / heap dump / MAT / JFR</text>

  <text class="small" x="96" y="1308">答题抓手：对象分配不是只背 Eden；要讲 TLAB、逃逸分析、Young GC、Survivor 年龄、动态年龄、G1 Region/Humongous 和 heap dump 诊断。</text>
</svg>
