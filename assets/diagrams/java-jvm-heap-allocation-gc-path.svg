<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1420" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1420"><title id="title">JVM heap allocation, young GC, promotion, G1 humongous objects, and OOM diagnostics</title><desc id="desc">A topic-specific diagram explaining JVM heap allocation path: escape analysis and scalar replacement, TLAB and Eden allocation, young GC copying to survivor, age and dynamic tenuring, promotion to old generation, traditional generational collectors versus G1 regions and humongous objects, and heap OOM diagnostic flow.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 32px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}</style></defs><rect width="1320" height="1420" class="bg"/><text x="70" y="64" class="title">堆内存：对象分配、晋升与 OOM 排查路径</text><text x="70" y="96" class="subtitle">语义上对象从堆分配；具体布局受收集器影响，不能把某一种分代比例当成 JVM 规范。</text><rect width="1180" height="380" x="70" y="130" class="panel" rx="16"/><text x="96" y="166" class="section-title">1. 对象分配主路径</text><rect width="180" height="82" x="105" y="225" stroke-width="2" class="blue" rx="12"/><text x="132" y="257" class="box-title">new 对象</text><text x="132" y="282" class="text">语义上需要实例</text><rect width="220" height="82" x="340" y="225" stroke-width="2" class="cyan" rx="12"/><text x="367" y="257" class="box-title">逃逸分析</text><text x="367" y="282" class="text">可能标量替换，消除实际分配</text><rect width="200" height="82" x="615" y="225" stroke-width="2" class="green" rx="12"/><text x="642" y="257" class="box-title">TLAB</text><text x="642" y="282" class="text">线程本地分配缓冲，减少竞争</text><rect width="200" height="82" x="870" y="225" stroke-width="2" class="yellow" rx="12"/><text x="897" y="257" class="box-title">Eden / Young Region</text><text x="897" y="282" class="text">快速指针碰撞分配</text><rect width="105" height="82" x="1110" y="225" stroke-width="2" class="red" rx="12"/><text x="1137" y="257" class="box-title">失败</text><text x="1137" y="282" class="text">触发 GC/OOM</text><path d="M285 266 H331" class="arrow"/><path d="M560 266 H606" class="arrow"/><path d="M815 266 H861" class="arrow"/><path d="M1070 266 H1101" class="arrow"/><rect width="980" height="62" x="165" y="360" stroke-width="2" class="violet" rx="12"/><text x="192" y="389" class="box-title">大对象边界</text><text x="192" y="412" class="text">传统收集器可能按 PretenureSizeThreshold 进入老年代；G1 中超过半个 Region 的对象按 Humongous 处理。</text><rect width="575" height="330" x="70" y="550" class="panel" rx="16"/><text x="96" y="586" class="section-title">2. Young GC 与晋升</text><rect width="230" height="78" x="105" y="640" stroke-width="2" class="yellow" rx="12"/><text x="132" y="671" class="box-title">Young / Minor GC</text><text x="132" y="696" class="text">从 GC Roots 判断可达对象</text><rect width="230" height="78" x="375" y="640" stroke-width="2" class="green" rx="12"/><text x="402" y="671" class="box-title">Survivor</text><text x="402" y="696" class="text">复制存活对象，年龄加一</text><rect width="230" height="78" x="105" y="760" stroke-width="2" class="red" rx="12"/><text x="132" y="791" class="box-title">晋升 Old</text><text x="132" y="816" class="text">年龄、动态年龄、Survivor 放不下</text><rect width="230" height="78" x="375" y="760" stroke-width="2" class="blue" rx="12"/><text x="402" y="791" class="box-title">仍在 Survivor</text><text x="402" y="816" class="text">未达晋升条件，等待下次回收</text><path d="M335 679 H366" class="arrow"/><path d="M490 718 C490 738 235 738 220 751" class="arrow"/><path d="M490 718 V751" class="arrow"/><rect width="575" height="330" x="675" y="550" class="panel" rx="16"/><text x="701" y="586" class="section-title">3. 收集器差异</text><rect width="230" height="86" x="710" y="640" stroke-width="2" class="green" rx="12"/><text x="737" y="672" class="box-title">传统分代</text><text x="737" y="697" class="text">Eden / S0 / S1 / Old</text><text x="737" y="716" class="mono">NewRatio, SurvivorRatio</text><rect width="230" height="86" x="980" y="640" stroke-width="2" class="blue" rx="12"/><text x="1007" y="672" class="box-title">G1</text><text x="1007" y="697" class="text">Region 化，Young 动态调整</text><text x="1007" y="716" class="text">Humongous 对象单独处理</text><rect width="500" height="56" x="710" y="770" stroke-width="2" class="yellow" rx="12"/><text x="737" y="804" class="text">调优参数要结合收集器：同一个 -Xmn / SurvivorRatio / PretenureSizeThreshold 未必都生效。</text><rect width="1180" height="260" x="70" y="920" class="panel" rx="16"/><text x="96" y="956" class="section-title">4. 堆 OOM/频繁 GC 诊断</text><rect width="250" height="82" x="105" y="1010" stroke-width="2" class="red" rx="12"/><text x="132" y="1042" class="box-title">Live Set 过大</text><text x="132" y="1067" class="text">Full/Old GC 后占用降不下来</text><rect width="250" height="82" x="405" y="1010" stroke-width="2" class="yellow" rx="12"/><text x="432" y="1042" class="box-title">分配速率过高</text><text x="432" y="1067" class="text">Young GC 频繁，Eden 很快打满</text><rect width="250" height="82" x="705" y="1010" stroke-width="2" class="violet" rx="12"/><text x="732" y="1042" class="box-title">晋升/担保压力</text><text x="732" y="1067" class="text">Survivor 放不下，Old 增长快</text><rect width="205" height="82" x="1005" y="1010" stroke-width="2" class="blue" rx="12"/><text x="1032" y="1042" class="box-title">工具</text><text x="1032" y="1067" class="text">GC log / heap dump / MAT / JFR</text><text x="96" y="1308" class="small">答题抓手：对象分配不是只背 Eden；要讲 TLAB、逃逸分析、Young GC、Survivor 年龄、动态年龄、G1 Region/Humongous 和 heap dump 诊断。</text></svg>