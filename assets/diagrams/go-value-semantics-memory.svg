<svg viewBox="0 0 780 410" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Go 值语义与零值">
<title>Go 值语义：赋值/传参拷贝值，引用类型只拷贝头</title><desc>值类型（int/struct/array）赋值与传参整体拷贝，改副本不影响原值；slice/map/chan/指针拷贝的是头或指针，共享底层；各类型有确定零值。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="390" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">Go 只有值传递：区别在"拷贝的是什么"</text>
<!-- value type -->
<rect x="24" y="46" width="352" height="150" rx="9" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.6"/>
<text x="200" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C" font-family="system-ui, sans-serif">值类型：int / 数组 / struct → 整体拷贝</text>
<rect x="44" y="84" width="120" height="60" rx="6" fill="#fff" stroke="#1D9E75" stroke-width="0.6"/><text x="104" y="104" text-anchor="middle" font-size="11" fill="#04342C" font-family="ui-monospace, monospace">p := Point{1,2}</text><text x="104" y="126" text-anchor="middle" font-size="11" fill="#04342C" font-family="ui-monospace, monospace">{X:1 Y:2}</text>
<rect x="236" y="84" width="120" height="60" rx="6" fill="#fff" stroke="#1D9E75" stroke-width="0.6"/><text x="296" y="104" text-anchor="middle" font-size="11" fill="#04342C" font-family="ui-monospace, monospace">q := p  // 拷贝</text><text x="296" y="126" text-anchor="middle" font-size="11" fill="#04342C" font-family="ui-monospace, monospace">{X:1 Y:2} 独立</text>
<line x1="164" y1="114" x2="234" y2="114" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#a)"/>
<text x="200" y="166" text-anchor="middle" font-size="11" fill="#04342C" font-family="system-ui, sans-serif">改 q.X 不影响 p；大 struct 传参有拷贝成本</text>
<text x="200" y="184" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="system-ui, sans-serif">想改原值/避免拷贝 → 传 *Point</text>
<!-- reference-like -->
<rect x="404" y="46" width="352" height="150" rx="9" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.6"/>
<text x="580" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">引用语义：slice/map/chan/指针 → 拷头共享底层</text>
<rect x="424" y="84" width="120" height="60" rx="6" fill="#fff" stroke="#378ADD" stroke-width="0.6"/><text x="484" y="104" text-anchor="middle" font-size="11" fill="#042C53" font-family="ui-monospace, monospace">s := []int{1,2}</text><text x="484" y="126" text-anchor="middle" font-size="11" fill="#042C53" font-family="ui-monospace, monospace">头{ptr,len,cap}</text>
<rect x="616" y="84" width="120" height="60" rx="6" fill="#fff" stroke="#378ADD" stroke-width="0.6"/><text x="676" y="104" text-anchor="middle" font-size="11" fill="#042C53" font-family="ui-monospace, monospace">t := s</text><text x="676" y="126" text-anchor="middle" font-size="11" fill="#042C53" font-family="ui-monospace, monospace">头拷贝 ptr 同源</text>
<line x1="544" y1="114" x2="614" y2="114" stroke="#378ADD" stroke-width="1.4" marker-end="url(#a)"/>
<text x="580" y="166" text-anchor="middle" font-size="11" fill="#042C53" font-family="system-ui, sans-serif">t[0]=9 会改到 s（共享底层数组）</text>
<text x="580" y="184" text-anchor="middle" font-size="11" fill="#C0392B" font-family="system-ui, sans-serif">坑：append 触发扩容后 t 与 s 解绑</text>
<!-- zero values -->
<rect x="24" y="214" width="732" height="176" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="40" y="238" font-size="14" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">零值：声明即可用，无未初始化内存</text>
<g font-family="ui-monospace, monospace" font-size="12" fill="#2C2C2A">
<text x="48" y="268">int / float / complex</text><text x="320" y="268" fill="#1D9E75">0</text>
<text x="48" y="294">bool</text><text x="320" y="294" fill="#1D9E75">false</text>
<text x="48" y="320">string</text><text x="320" y="320" fill="#1D9E75">""（空串，非 nil）</text>
<text x="440" y="268">pointer / func / interface</text><text x="710" y="268" fill="#C0392B" text-anchor="end">nil</text>
<text x="440" y="294">slice / map / chan</text><text x="710" y="294" fill="#C0392B" text-anchor="end">nil</text>
<text x="440" y="320">struct</text><text x="710" y="320" fill="#1D9E75" text-anchor="end">各字段递归取零值</text>
</g>
<text x="40" y="360" font-size="11" fill="#5F5E5A" font-family="system-ui, sans-serif">关键差别：nil slice 可直接 append；nil map 只能读不能写（写 panic），必须 make 后用。</text>
<text x="40" y="380" font-size="11" fill="#5F5E5A" font-family="system-ui, sans-serif">值接收者方法拿到的是副本；要改自身状态用指针接收者。</text>
</svg>
