<svg viewBox="0 0 680 360" width="100%" role="img" aria-label="DDD战略设计全景图">
<title>DDD战略设计全景图</title><desc>核心域、支撑域、通用域的划分</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">DDD 战略设计</text>
<circle cx="340" cy="160" r="100" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="160" text-anchor="middle" font-size="16" font-weight="500" fill="#04342C" font-family="system-ui, sans-serif">核心域</text>
<text x="340" y="180" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">Core Domain</text>
<circle cx="180" cy="160" r="70" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="180" y="160" text-anchor="middle" font-size="14" font-weight="500" fill="#412402" font-family="system-ui, sans-serif">支撑域</text>
<circle cx="500" cy="160" r="70" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="500" y="160" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">通用域</text>
<rect x="60" y="280" width="560" height="60" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="300" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">限界上下文 (Bounded Context)</text>
<text x="340" y="320" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">每个上下文有独立的模型和语言，通过上下文映射定义关系</text>
<text x="340" y="334" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">防腐层(ACL) / 共享内核(SK) / 客户方-供应方(C-S)</text>
</svg>