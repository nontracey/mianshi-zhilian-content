<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1280"><title id="title">RabbitMQ 消息可靠性三段失败窗口</title><desc id="desc">展示 RabbitMQ 消息从生产者到 Broker 再到消费者的可靠性链路，包含 publisher confirm、mandatory return、durable topology、quorum queue、manual ack、retry、DLX、DLQ 和幂等边界。</desc><defs><marker id="arrow-blue" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-orange" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#b45309" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 30px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#172033}.subtitle{font:400 15px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.panel{fill:#fff;stroke:#d9e2ec;stroke-width:2;rx:14}.box-title{fill:#1f2933}.panel-title{font:700 20px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#1f2933}.box-title{font:700 16px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.small{font:400 13px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#334e68}.tiny{font:400 12px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.blue{fill:#e8f2ff;stroke:#60a5fa;stroke-width:2;rx:12}.green{fill:#e8f8ef;stroke:#4ade80}.gray,.green,.orange,.red,.yellow{stroke-width:2;rx:12}.yellow{fill:#fff7d6;stroke:#facc15}.orange{fill:#fff1e6;stroke:#fb923c}.red{fill:#feecec;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#94a3b8}.line{stroke:#2563eb;marker-end:url(#arrow-blue)}.line,.line-orange,.line-red{stroke-width:3;fill:none}.line-orange{stroke:#b45309;marker-end:url(#arrow-orange)}.line-red{stroke:#dc2626;marker-end:url(#arrow-red)}.dash{stroke-dasharray:7 6}</style></defs><rect width="1280" height="1280" class="bg"/><text x="48" y="56" class="title">RabbitMQ 可靠性：把“不丢”拆成三个可恢复窗口</text><text x="50" y="86" class="subtitle">目标不是承诺 exactly-once，而是让失败有信号、状态可追踪、消息可重试、消费可幂等。</text><rect width="1200" height="360" x="40" y="120" class="panel"/><text x="68" y="156" class="panel-title">1. 发布端：Confirm 管到达，Return 管不可路由</text><rect width="160" height="70" x="80" y="230" class="blue"/><text x="123" y="257" class="box-title">Producer</text><text x="104" y="279" class="tiny">send log / correlation id</text><rect width="170" height="70" x="318" y="230" class="yellow"/><text x="360" y="257" class="box-title">Exchange</text><text x="348" y="279" class="tiny">mandatory / alternate</text><rect width="180" height="70" x="568" y="230" class="green"/><text x="616" y="257" class="box-title">Queue</text><text x="592" y="279" class="tiny">durable / quorum</text><rect width="165" height="70" x="830" y="205" class="green"/><text x="880" y="232" class="box-title">Confirm Ack</text><text x="855" y="254" class="tiny">记录 CONFIRMED</text><rect width="165" height="70" x="830" y="315" class="red"/><text x="885" y="342" class="box-title">Return</text><text x="858" y="364" class="tiny">不可路由，需补偿</text><line x1="240" x2="318" y1="265" y2="265" class="line"/><line x1="488" x2="568" y1="265" y2="265" class="line"/><path d="M748,255 C780,240 798,238 830,240" class="line"/><path d="M410,300 C475,365 735,365 830,350" class="line-red"/><path d="M900,205 C805,150 230,150 160,230" class="line-orange dash"/><text x="85" y="412" class="small">Confirm 超时属于未知态：可能已写入，也可能没到达；按业务键重试并让消费者幂等，不能直接丢弃。</text><text x="85" y="440" class="small">Return 说明 Exchange 收到了但无法路由；处理方式是修正绑定、落库补偿或转 alternate exchange。</text><rect width="1200" height="285" x="40" y="520" class="panel"/><text x="68" y="556" class="panel-title">2. Broker 端：持久化、复制和容量共同决定数据安全</text><rect width="165" height="68" x="78" y="625" class="yellow"/><text x="118" y="652" class="box-title">Durable topology</text><text x="105" y="674" class="tiny">exchange / queue</text><rect width="165" height="68" x="312" y="625" class="blue"/><text x="352" y="652" class="box-title">Persistent msg</text><text x="345" y="674" class="tiny">delivery mode</text><rect width="165" height="68" x="546" y="625" class="green"/><text x="592" y="652" class="box-title">Quorum queue</text><text x="586" y="674" class="tiny">Raft replicas</text><rect width="165" height="68" x="780" y="625" class="orange"/><text x="827" y="652" class="box-title">Back pressure</text><text x="812" y="674" class="tiny">disk / memory alarm</text><rect width="165" height="68" x="1014" y="625" class="gray"/><text x="1060" y="652" class="box-title">Observability</text><text x="1045" y="674" class="tiny">ready / unacked / DLQ</text><line x1="243" x2="312" y1="659" y2="659" class="line"/><line x1="477" x2="546" y1="659" y2="659" class="line"/><line x1="711" x2="780" y1="659" y2="659" class="line"/><line x1="945" x2="1014" y1="659" y2="659" class="line"/><text x="82" y="750" class="small">只设 persistent 不够：还要确认 Broker 已接收、队列存在、磁盘/副本健康，并监控积压和水位。</text><text x="82" y="778" class="small">RabbitMQ 4.x 关键持久队列优先看 quorum queue；classic mirrored queues 已退出 4.x。</text><rect width="1200" height="395" x="40" y="845" class="panel"/><text x="68" y="881" class="panel-title">3. 消费端：处理成功后 Ack，失败按类别进入重试或死信</text><rect width="150" height="62" x="78" y="950" class="green"/><text x="126" y="975" class="box-title">Queue</text><text x="105" y="996" class="tiny">ready / unacked</text><rect width="170" height="62" x="304" y="950" class="blue"/><text x="354" y="975" class="box-title">Consumer</text><text x="335" y="996" class="tiny">manual ack + prefetch</text><rect width="150" height="58" x="552" y="900" class="green"/><text x="607" y="924" class="box-title">Ack</text><text x="585" y="944" class="tiny">处理后确认</text><rect width="150" height="58" x="552" y="1003" class="orange"/><text x="596" y="1027" class="box-title">Retry</text><text x="577" y="1047" class="tiny">退避 / 次数上限</text><rect width="150" height="58" x="780" y="1003" class="red"/><text x="831" y="1027" class="box-title">DLX</text><text x="810" y="1047" class="tiny">requeue=false</text><rect width="150" height="58" x="1008" y="1003" class="gray"/><text x="1050" y="1027" class="box-title">DLQ</text><text x="1036" y="1047" class="tiny">告警 / 修复 / 回放</text><path d="M228,981 C255,981 274,981 304,981" class="line"/><path d="M474,981 C510,940 522,929 552,929" class="line"/><path d="M474,981 C510,1015 522,1032 552,1032" class="line-orange"/><path d="M702,1032 C730,1032 750,1032 780,1032" class="line-red"/><line x1="930" x2="1008" y1="1032" y2="1032" class="line-red"/><path d="M622,1061 C555,1112 170,1108 153,1012" class="line-orange dash"/><text x="82" y="1190" class="small">Ack 丢失或连接断开会触发重投；消费者要用业务唯一键或消费日志跳过重复，幂等不是可选项。</text><text x="82" y="1218" class="small">DLQ 不是终点：要有 owner、告警、原因分类、修复脚本和安全回放流程。</text></svg>