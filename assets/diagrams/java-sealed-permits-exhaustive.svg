<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">Java sealed classes permits hierarchy and exhaustive matching boundaries</title><desc id="desc">A topic-specific diagram explaining Java sealed classes and interfaces, permits lists, final sealed and non-sealed direct subclasses, module and package visibility constraints, exhaustive pattern matching in Java 21 switch, and boundaries compared with enum, final class, and ordinary interfaces.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 32px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.cyan{fill:#cffafe;stroke:#06b6d4}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}</style></defs><rect width="1320" height="1320" class="bg"/><text x="70" y="64" class="title">Sealed Classes：受控开放的类型层次</text><text x="70" y="96" class="subtitle">Java 17 正式引入 sealed；Java 21 的 pattern switch 可利用封闭层次做穷举检查。</text><rect width="1180" height="390" x="70" y="130" class="panel" rx="16"/><text x="96" y="166" class="section-title">1. permits 列出允许的直接子类型</text><rect width="340" height="86" x="480" y="210" stroke-width="2" class="blue" rx="12"/><text x="507" y="242" class="box-title">sealed interface Expr</text><text x="507" y="267" class="mono">permits Const, Add, Negate, ExtensionExpr</text><rect width="230" height="88" x="105" y="365" stroke-width="2" class="green" rx="12"/><text x="132" y="397" class="box-title">final 子类型</text><text x="132" y="422" class="mono">record Const(...)</text><text x="132" y="442" class="text">到这里关闭</text><rect width="230" height="88" x="385" y="365" stroke-width="2" class="green" rx="12"/><text x="412" y="397" class="box-title">final 子类型</text><text x="412" y="422" class="mono">record Add(...)</text><text x="412" y="442" class="text">值分支</text><rect width="230" height="88" x="665" y="365" stroke-width="2" class="yellow" rx="12"/><text x="692" y="397" class="box-title">sealed 子层次</text><text x="692" y="422" class="mono">sealed interface Negate</text><text x="692" y="442" class="text">继续 permits</text><rect width="230" height="88" x="945" y="365" stroke-width="2" class="red" rx="12"/><text x="972" y="397" class="box-title">non-sealed 子类型</text><text x="972" y="422" class="mono">ExtensionExpr</text><text x="972" y="442" class="text">重新开放，需兜底</text><path d="M570 296 C500 330 325 345 220 356" class="arrow"/><path d="M625 296 C590 330 540 345 500 356" class="arrow"/><path d="M690 296 C720 330 750 345 780 356" class="arrow"/><path d="M760 296 C850 330 1000 345 1060 356" class="arrow"/><rect width="250" height="64" x="150" y="230" stroke-width="2" class="cyan" rx="12"/><text x="177" y="258" class="box-title">编译器可见性</text><text x="177" y="280" class="text">同一命名模块；未命名模块通常同包</text><rect width="575" height="280" x="70" y="560" class="panel" rx="16"/><text x="96" y="596" class="section-title">2. 三种直接子类型策略</text><rect width="230" height="72" x="105" y="645" stroke-width="2" class="green" rx="12"/><text x="132" y="676" class="box-title">final</text><text x="132" y="699" class="text">分支到此结束，最利于穷举</text><rect width="230" height="72" x="375" y="645" stroke-width="2" class="yellow" rx="12"/><text x="402" y="676" class="box-title">sealed</text><text x="402" y="699" class="text">继续收紧下一层 permits</text><rect width="230" height="72" x="235" y="745" stroke-width="2" class="red" rx="12"/><text x="262" y="776" class="box-title">non-sealed</text><text x="262" y="799" class="text">重新开放，外部可继续继承</text><rect width="575" height="280" x="675" y="560" class="panel" rx="16"/><text x="701" y="596" class="section-title">3. 和 pattern switch 的关系</text><rect width="230" height="82" x="710" y="645" stroke-width="2" class="blue" rx="12"/><text x="737" y="676" class="box-title">Java 17</text><text x="737" y="701" class="text">sealed 类型层次稳定</text><text x="737" y="719" class="text">可用 instanceof pattern</text><rect width="230" height="82" x="980" y="645" stroke-width="2" class="green" rx="12"/><text x="1007" y="676" class="box-title">Java 21</text><text x="1007" y="701" class="text">pattern switch 正式</text><text x="1007" y="719" class="text">封闭层次可做穷举检查</text><rect width="230" height="54" x="845" y="755" stroke-width="2" class="red" rx="12"/><text x="872" y="787" class="text">有 non-sealed 分支时，匹配逻辑要保留开放分支处理。</text><rect width="1180" height="265" x="70" y="880" class="panel" rx="16"/><text x="96" y="916" class="section-title">4. 建模取舍</text><rect width="245" height="86" x="105" y="970" stroke-width="2" class="green" rx="12"/><text x="132" y="1002" class="box-title">适合 sealed</text><text x="132" y="1027" class="text">表达式 AST、领域事件</text><text x="132" y="1045" class="text">支付方式、命令结果</text><rect width="245" height="86" x="400" y="970" stroke-width="2" class="yellow" rx="12"/><text x="427" y="1002" class="box-title">enum 更适合</text><text x="427" y="1027" class="text">分支只有常量</text><text x="427" y="1045" class="text">每个分支结构相同</text><rect width="245" height="86" x="695" y="970" stroke-width="2" class="blue" rx="12"/><text x="722" y="1002" class="box-title">普通接口更适合</text><text x="722" y="1027" class="text">插件、SPI、第三方扩展</text><text x="722" y="1045" class="text">子类型集合未知</text><rect width="210" height="86" x="990" y="970" stroke-width="2" class="red" rx="12"/><text x="1017" y="1002" class="box-title">误区</text><text x="1017" y="1027" class="text">sealed 不是 final 别名</text><text x="1017" y="1045" class="text">non-sealed 会重新开放</text><text x="96" y="1238" class="small">答题抓手：Java 17 sealed 正式、permits 限定直接子类、子类必须 final/sealed/non-sealed、模块/包可见性、Java 21 switch 穷举价值。</text></svg>