<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">Java sealed classes permits hierarchy and exhaustive matching boundaries</title>
  <desc id="desc">A topic-specific diagram explaining Java sealed classes and interfaces, permits lists, final sealed and non-sealed direct subclasses, module and package visibility constraints, exhaustive pattern matching in Java 21 switch, and boundaries compared with enum, final class, and ordinary interfaces.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="70" y="64">Sealed Classes：受控开放的类型层次</text>
  <text class="subtitle" x="70" y="96">Java 17 正式引入 sealed；Java 21 的 pattern switch 可利用封闭层次做穷举检查。</text>

  <rect class="panel" x="70" y="130" width="1180" height="390" rx="16"/>
  <text class="section-title" x="96" y="166">1. permits 列出允许的直接子类型</text>

  <rect class="blue" x="480" y="210" width="340" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="507" y="242">sealed interface Expr</text>
  <text class="mono" x="507" y="267">permits Const, Add, Negate, ExtensionExpr</text>

  <rect class="green" x="105" y="365" width="230" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="397">final 子类型</text>
  <text class="mono" x="132" y="422">record Const(...)</text>
  <text class="text" x="132" y="442">到这里关闭</text>

  <rect class="green" x="385" y="365" width="230" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="412" y="397">final 子类型</text>
  <text class="mono" x="412" y="422">record Add(...)</text>
  <text class="text" x="412" y="442">值分支</text>

  <rect class="yellow" x="665" y="365" width="230" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="692" y="397">sealed 子层次</text>
  <text class="mono" x="692" y="422">sealed interface Negate</text>
  <text class="text" x="692" y="442">继续 permits</text>

  <rect class="red" x="945" y="365" width="230" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="972" y="397">non-sealed 子类型</text>
  <text class="mono" x="972" y="422">ExtensionExpr</text>
  <text class="text" x="972" y="442">重新开放，需兜底</text>

  <path class="arrow" d="M570 296 C500 330 325 345 220 356"/>
  <path class="arrow" d="M625 296 C590 330 540 345 500 356"/>
  <path class="arrow" d="M690 296 C720 330 750 345 780 356"/>
  <path class="arrow" d="M760 296 C850 330 1000 345 1060 356"/>

  <rect class="cyan" x="150" y="230" width="250" height="64" rx="12" stroke-width="2"/>
  <text class="box-title" x="177" y="258">编译器可见性</text>
  <text class="text" x="177" y="280">同一命名模块；未命名模块通常同包</text>

  <rect class="panel" x="70" y="560" width="575" height="280" rx="16"/>
  <text class="section-title" x="96" y="596">2. 三种直接子类型策略</text>

  <rect class="green" x="105" y="645" width="230" height="72" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="676">final</text>
  <text class="text" x="132" y="699">分支到此结束，最利于穷举</text>

  <rect class="yellow" x="375" y="645" width="230" height="72" rx="12" stroke-width="2"/>
  <text class="box-title" x="402" y="676">sealed</text>
  <text class="text" x="402" y="699">继续收紧下一层 permits</text>

  <rect class="red" x="235" y="745" width="230" height="72" rx="12" stroke-width="2"/>
  <text class="box-title" x="262" y="776">non-sealed</text>
  <text class="text" x="262" y="799">重新开放，外部可继续继承</text>

  <rect class="panel" x="675" y="560" width="575" height="280" rx="16"/>
  <text class="section-title" x="701" y="596">3. 和 pattern switch 的关系</text>

  <rect class="blue" x="710" y="645" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="737" y="676">Java 17</text>
  <text class="text" x="737" y="701">sealed 类型层次稳定</text>
  <text class="text" x="737" y="719">可用 instanceof pattern</text>

  <rect class="green" x="980" y="645" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1007" y="676">Java 21</text>
  <text class="text" x="1007" y="701">pattern switch 正式</text>
  <text class="text" x="1007" y="719">封闭层次可做穷举检查</text>

  <rect class="red" x="845" y="755" width="230" height="54" rx="12" stroke-width="2"/>
  <text class="text" x="872" y="787">有 non-sealed 分支时，匹配逻辑要保留开放分支处理。</text>

  <rect class="panel" x="70" y="880" width="1180" height="265" rx="16"/>
  <text class="section-title" x="96" y="916">4. 建模取舍</text>

  <rect class="green" x="105" y="970" width="245" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="1002">适合 sealed</text>
  <text class="text" x="132" y="1027">表达式 AST、领域事件</text>
  <text class="text" x="132" y="1045">支付方式、命令结果</text>

  <rect class="yellow" x="400" y="970" width="245" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="427" y="1002">enum 更适合</text>
  <text class="text" x="427" y="1027">分支只有常量</text>
  <text class="text" x="427" y="1045">每个分支结构相同</text>

  <rect class="blue" x="695" y="970" width="245" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="722" y="1002">普通接口更适合</text>
  <text class="text" x="722" y="1027">插件、SPI、第三方扩展</text>
  <text class="text" x="722" y="1045">子类型集合未知</text>

  <rect class="red" x="990" y="970" width="210" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="1017" y="1002">误区</text>
  <text class="text" x="1017" y="1027">sealed 不是 final 别名</text>
  <text class="text" x="1017" y="1045">non-sealed 会重新开放</text>

  <text class="small" x="96" y="1238">答题抓手：Java 17 sealed 正式、permits 限定直接子类、子类必须 final/sealed/non-sealed、模块/包可见性、Java 21 switch 穷举价值。</text>
</svg>
