<svg xmlns="http://www.w3.org/2000/svg" width="100%" aria-label="Redis 五种数据类型的底层编码" role="img" viewBox="0 0 780 430"><title>Redis 对象类型与底层编码及切换阈值</title><desc>每种对外类型按元素数量/大小在紧凑编码与展开编码间切换：小数据用 listpack/intset 省内存，超阈值转 hashtable/skiplist 保性能。</desc><text x="390" y="26" fill="#042C53" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">type 是对外语义，encoding 随规模自动切换（小→紧凑省内存，大→展开保性能）</text><g font-family="system-ui, sans-serif"><rect width="146" height="160" x="24" y="50" fill="#E6F1FB" stroke="#378ADD" stroke-width=".6" rx="9"/><text x="97" y="72" fill="#042C53" font-size="13" font-weight="600" text-anchor="middle">String</text><text x="36" y="98" fill="#2C2C2A" font-size="11">int：整数值</text><text x="36" y="122" fill="#2C2C2A" font-size="11">embstr：≤44B 短串</text><text x="36" y="138" fill="#5F5E5A" font-size="10.5">（与对象头连续分配）</text><text x="36" y="162" fill="#2C2C2A" font-size="11">raw：&gt;44B / 被修改</text><text x="36" y="192" fill="#5F5E5A" font-size="10.5">SDS：记 len，O(1)</text><text x="36" y="206" fill="#5F5E5A" font-size="10.5">取长、二进制安全</text><rect width="146" height="160" x="186" y="50" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".6" rx="9"/><text x="259" y="72" fill="#04342C" font-size="13" font-weight="600" text-anchor="middle">List</text><text x="198" y="98" fill="#04342C" font-size="11">quicklist</text><text x="198" y="120" fill="#444441" font-size="10.5">= 双向链表串起</text><text x="198" y="136" fill="#444441" font-size="10.5">多个 listpack 节点</text><text x="198" y="166" fill="#5F5E5A" font-size="10.5">兼顾内存紧凑与</text><text x="198" y="182" fill="#5F5E5A" font-size="10.5">两端 O(1) 插删</text><rect width="146" height="160" x="348" y="50" fill="#FEF3E2" stroke="#BA7517" stroke-width=".6" rx="9"/><text x="421" y="72" fill="#7A4D0E" font-size="13" font-weight="600" text-anchor="middle">Hash</text><text x="360" y="98" fill="#7A4D0E" font-size="11">listpack：小</text><text x="360" y="118" fill="#444441" font-size="10.5">字段少且短时</text><text x="360" y="150" fill="#7A4D0E" font-size="11">hashtable：大</text><text x="360" y="170" fill="#444441" font-size="10.5">超 hash-max-</text><text x="360" y="186" fill="#444441" font-size="10.5">listpack-entries/value</text><rect width="146" height="160" x="510" y="50" fill="#F3E8FB" stroke="#8E44AD" stroke-width=".6" rx="9"/><text x="583" y="72" fill="#5B2C6F" font-size="13" font-weight="600" text-anchor="middle">Set</text><text x="522" y="98" fill="#5B2C6F" font-size="11">intset：全是整数</text><text x="522" y="124" fill="#5B2C6F" font-size="11">listpack：少量小元素</text><text x="522" y="160" fill="#5B2C6F" font-size="11">hashtable：超阈值</text><text x="522" y="186" fill="#444441" font-size="10.5">SINTER 等靠 dict O(1)</text><rect width="84" height="160" x="672" y="50" fill="#FBE9E7" stroke="#C0392B" stroke-width=".6" rx="9"/><text x="714" y="72" fill="#922B21" font-size="13" font-weight="600" text-anchor="middle">ZSet</text><text x="684" y="96" fill="#922B21" font-size="10.5">listpack：小</text><text x="684" y="126" fill="#922B21" font-size="10.5">skiplist</text><text x="684" y="142" fill="#444441" font-size="10.5">+ dict</text><text x="684" y="170" fill="#444441" font-size="10">跳表按 score</text><text x="684" y="184" fill="#444441" font-size="10">范围查 O(logN)</text><text x="684" y="198" fill="#444441" font-size="10">dict 查单 O(1)</text></g><rect width="732" height="180" x="24" y="226" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="10"/><text x="40" y="250" fill="#042C53" font-family="system-ui, sans-serif" font-size="14" font-weight="600">编码切换是单向的（小→大不回退），由配置阈值触发</text><g fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="11.5"><text x="48" y="280">• String：整数→int；≤44B→embstr；超长或 APPEND/SETRANGE 改写→raw</text><text x="48" y="306">• Hash/ZSet：元素数 ≤128 且每项 ≤64B 用 listpack，超任一阈值转 hashtable / skiplist</text><text x="48" y="332">• Set：纯整数且 ≤512 用 intset；含非整数小集合用 listpack；再大转 hashtable</text><text x="48" y="358" fill="#7A4D0E">阈值由 hash-max-listpack-entries、zset-max-listpack-entries、set-max-intset-entries 等配置控制</text><text x="48" y="384" fill="#C0392B">面试点：为什么小集合省内存（紧凑连续、无指针开销）、大集合保性能（哈希/跳表保证复杂度）</text></g></svg>