<svg viewBox="0 0 680 575" width="100%" role="img" aria-label="JVM运行时数据区布局图">
<title>JVM运行时数据区布局图</title><desc>展示JVM内存分为线程私有和共享区域</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="30" y="20" width="620" height="540" rx="20" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">JVM 运行时数据区</text>
<rect x="50" y="78" width="280" height="460" rx="14" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="190" y="106" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C" font-family="system-ui, sans-serif">线程私有</text>
<rect x="72" y="122" width="236" height="60" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="190" y="146" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">程序计数器</text>
<text x="190" y="164" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">记录字节码行号，不会OOM</text>
<rect x="72" y="198" width="236" height="130" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="190" y="220" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C" font-family="system-ui, sans-serif">虚拟机栈</text>
<text x="190" y="238" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">每个方法调用创建栈帧</text>
<rect x="86" y="250" width="208" height="60" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="190" y="270" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">局部变量表</text>
<text x="190" y="286" text-anchor="middle" font-size="10" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">操作数栈 | 动态链接 | 返回地址</text>
<text x="190" y="302" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">溢出: StackOverflowError / OOM</text>
<rect x="72" y="344" width="236" height="50" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="190" y="363" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">本地方法栈</text>
<text x="190" y="381" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">为Native方法服务</text>
<rect x="72" y="410" width="236" height="32" rx="6" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
<text x="190" y="430" text-anchor="middle" font-size="11" font-weight="400" fill="#4B1528" font-family="system-ui, sans-serif">HotSpot将两者合二为一</text>
<rect x="350" y="78" width="280" height="460" rx="14" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="490" y="106" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C" font-family="system-ui, sans-serif">线程共享</text>
<rect x="372" y="122" width="236" height="280" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="490" y="146" text-anchor="middle" font-size="13" font-weight="500" fill="#04342C" font-family="system-ui, sans-serif">堆 (Heap)</text>
<text x="490" y="164" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">存放对象实例，GC管理区域</text>
<rect x="388" y="182" width="204" height="96" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="490" y="200" text-anchor="middle" font-size="12" font-weight="500" fill="#412402" font-family="system-ui, sans-serif">新生代 (Young)</text>
<rect x="398" y="214" width="56" height="50" rx="4" fill="#FFFFFF" stroke="#EF9F27" stroke-width="0.5"/>
<text x="426" y="236" text-anchor="middle" font-size="11" font-weight="400" fill="#633806" font-family="system-ui, sans-serif">Eden</text>
<text x="426" y="252" text-anchor="middle" font-size="10" font-weight="400" fill="#854F0B" font-family="system-ui, sans-serif">80%</text>
<rect x="462" y="214" width="56" height="50" rx="4" fill="#FFFFFF" stroke="#EF9F27" stroke-width="0.5"/>
<text x="490" y="236" text-anchor="middle" font-size="11" font-weight="400" fill="#633806" font-family="system-ui, sans-serif">S0</text>
<text x="490" y="252" text-anchor="middle" font-size="10" font-weight="400" fill="#854F0B" font-family="system-ui, sans-serif">10%</text>
<rect x="526" y="214" width="56" height="50" rx="4" fill="#FFFFFF" stroke="#EF9F27" stroke-width="0.5"/>
<text x="554" y="236" text-anchor="middle" font-size="11" font-weight="400" fill="#633806" font-family="system-ui, sans-serif">S1</text>
<text x="554" y="252" text-anchor="middle" font-size="10" font-weight="400" fill="#854F0B" font-family="system-ui, sans-serif">10%</text>
<rect x="388" y="294" width="204" height="42" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="490" y="319" text-anchor="middle" font-size="12" font-weight="500" fill="#501313" font-family="system-ui, sans-serif">老年代 (Old)</text>
<rect x="388" y="348" width="204" height="28" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="490" y="366" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">Minor GC - Major GC - Full GC</text>
<rect x="372" y="418" width="236" height="68" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="490" y="444" text-anchor="middle" font-size="13" font-weight="500" fill="#04342C" font-family="system-ui, sans-serif">方法区 (元空间)</text>
<text x="490" y="462" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">类信息、常量、静态变量</text>
<text x="490" y="478" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">JDK8+: Metaspace使用本地内存</text>
<text x="340" y="550" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">程序计数器是唯一不会发生OOM的区域</text>
</svg>