<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#4A90D9;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#E74C3C;stop-opacity:0.05"/>
    </linearGradient>
  </defs>
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#2C3E50">JVM 运行时数据区</text>
  <!-- Thread Private -->
  <rect x="30" y="60" width="350" height="380" rx="8" fill="url(#g1)" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="205" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A90D9">线程私有</text>
  <!-- PC Register -->
  <rect x="50" y="100" width="310" height="70" rx="6" fill="white" stroke="#4A90D9"/>
  <text x="205" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">程序计数器</text>
  <text x="205" y="148" text-anchor="middle" font-size="11" fill="#7F8C8D">字节码行号指示器 · 唯一无 OOM 区域</text>
  <!-- VM Stack -->
  <rect x="50" y="185" width="310" height="110" rx="6" fill="white" stroke="#4A90D9"/>
  <text x="205" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">虚拟机栈</text>
  <text x="205" y="232" text-anchor="middle" font-size="11" fill="#7F8C8D">栈帧 = 局部变量表 + 操作数栈 + 动态链接 + 返回地址</text>
  <text x="205" y="252" text-anchor="middle" font-size="11" fill="#E74C3C">StackOverflowError · OutOfMemoryError</text>
  <!-- Native Method Stack -->
  <rect x="50" y="310" width="310" height="70" rx="6" fill="white" stroke="#4A90D9"/>
  <text x="205" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">本地方法栈</text>
  <text x="205" y="358" text-anchor="middle" font-size="11" fill="#7F8C8D">为 Native 方法服务（HotSpot 与虚拟机栈合一）</text>
  <!-- Thread Shared -->
  <rect x="420" y="60" width="350" height="380" rx="8" fill="url(#g2)" stroke="#E74C3C" stroke-width="1.5"/>
  <text x="595" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#E74C3C">线程共享</text>
  <!-- Heap -->
  <rect x="440" y="100" width="310" height="180" rx="6" fill="white" stroke="#E74C3C"/>
  <text x="595" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">堆 (Heap)</text>
  <text x="595" y="148" text-anchor="middle" font-size="11" fill="#7F8C8D">对象实例 · 数组 · GC 主要管理区域</text>
  <!-- Heap Generations -->
  <rect x="460" y="165" width="130" height="100" rx="4" fill="#FDF2E9" stroke="#E67E22"/>
  <text x="525" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#E67E22">新生代</text>
  <text x="525" y="205" text-anchor="middle" font-size="10" fill="#7F8C8D">Eden + S0 + S1</text>
  <text x="525" y="225" text-anchor="middle" font-size="10" fill="#7F8C8D">Minor GC</text>
  <rect x="610" y="165" width="120" height="100" rx="4" fill="#FDEDEC" stroke="#E74C3C"/>
  <text x="670" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#E74C3C">老年代</text>
  <text x="670" y="205" text-anchor="middle" font-size="10" fill="#7F8C8D">长期存活对象</text>
  <text x="670" y="225" text-anchor="middle" font-size="10" fill="#7F8C8D">Major GC</text>
  <!-- Method Area -->
  <rect x="440" y="300" width="310" height="120" rx="6" fill="white" stroke="#E74C3C"/>
  <text x="595" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C3E50">方法区 (元空间)</text>
  <text x="595" y="348" text-anchor="middle" font-size="11" fill="#7F8C8D">类信息 · 运行时常量池 · 静态变量 · JIT 编译代码</text>
  <text x="595" y="370" text-anchor="middle" font-size="11" fill="#7F8C8D">Java 8+ 使用本地内存（Metaspace）替代永久代</text>
</svg>
