<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, sans-serif" viewBox="0 0 800 500"><defs><linearGradient id="g1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" style="stop-color:#4a90d9;stop-opacity:.15"/><stop offset="100%" style="stop-color:#4a90d9;stop-opacity:.05"/></linearGradient><linearGradient id="g2" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" style="stop-color:#e74c3c;stop-opacity:.15"/><stop offset="100%" style="stop-color:#e74c3c;stop-opacity:.05"/></linearGradient></defs><text x="400" y="35" fill="#2C3E50" font-size="18" font-weight="bold" text-anchor="middle">JVM 运行时数据区</text><rect width="350" height="380" x="30" y="60" fill="url(#g1)" stroke="#4A90D9" stroke-width="1.5" rx="8"/><text x="205" y="85" fill="#4A90D9" font-size="14" font-weight="bold" text-anchor="middle">线程私有</text><rect width="310" height="70" x="50" y="100" fill="#fff" stroke="#4A90D9" rx="6"/><text x="205" y="125" fill="#2C3E50" font-size="13" font-weight="bold" text-anchor="middle">程序计数器</text><text x="205" y="148" fill="#7F8C8D" font-size="11" text-anchor="middle">字节码行号指示器 · 唯一无 OOM 区域</text><rect width="310" height="110" x="50" y="185" fill="#fff" stroke="#4A90D9" rx="6"/><text x="205" y="210" fill="#2C3E50" font-size="13" font-weight="bold" text-anchor="middle">虚拟机栈</text><text x="205" y="232" fill="#7F8C8D" font-size="11" text-anchor="middle">栈帧 = 局部变量表 + 操作数栈 + 动态链接 + 返回地址</text><text x="205" y="252" fill="#E74C3C" font-size="11" text-anchor="middle">StackOverflowError · OutOfMemoryError</text><rect width="310" height="70" x="50" y="310" fill="#fff" stroke="#4A90D9" rx="6"/><text x="205" y="335" fill="#2C3E50" font-size="13" font-weight="bold" text-anchor="middle">本地方法栈</text><text x="205" y="358" fill="#7F8C8D" font-size="11" text-anchor="middle">为 Native 方法服务（HotSpot 与虚拟机栈合一）</text><rect width="350" height="380" x="420" y="60" fill="url(#g2)" stroke="#E74C3C" stroke-width="1.5" rx="8"/><text x="595" y="85" fill="#E74C3C" font-size="14" font-weight="bold" text-anchor="middle">线程共享</text><rect width="310" height="180" x="440" y="100" fill="#fff" stroke="#E74C3C" rx="6"/><text x="595" y="125" fill="#2C3E50" font-size="13" font-weight="bold" text-anchor="middle">堆 (Heap)</text><text x="595" y="148" fill="#7F8C8D" font-size="11" text-anchor="middle">对象实例 · 数组 · GC 主要管理区域</text><rect width="130" height="100" x="460" y="165" fill="#FDF2E9" stroke="#E67E22" rx="4"/><text x="525" y="185" fill="#E67E22" font-size="11" font-weight="bold" text-anchor="middle">新生代</text><text x="525" y="205" fill="#7F8C8D" font-size="10" text-anchor="middle">Eden + S0 + S1</text><text x="525" y="225" fill="#7F8C8D" font-size="10" text-anchor="middle">Minor GC</text><rect width="120" height="100" x="610" y="165" fill="#FDEDEC" stroke="#E74C3C" rx="4"/><text x="670" y="185" fill="#E74C3C" font-size="11" font-weight="bold" text-anchor="middle">老年代</text><text x="670" y="205" fill="#7F8C8D" font-size="10" text-anchor="middle">长期存活对象</text><text x="670" y="225" fill="#7F8C8D" font-size="10" text-anchor="middle">Major GC</text><rect width="310" height="120" x="440" y="300" fill="#fff" stroke="#E74C3C" rx="6"/><text x="595" y="325" fill="#2C3E50" font-size="13" font-weight="bold" text-anchor="middle">方法区 (元空间)</text><text x="595" y="348" fill="#7F8C8D" font-size="11" text-anchor="middle">类信息 · 运行时常量池 · 静态变量 · JIT 编译代码</text><text x="595" y="370" fill="#7F8C8D" font-size="11" text-anchor="middle">Java 8+ 使用本地内存（Metaspace）替代永久代</text></svg>