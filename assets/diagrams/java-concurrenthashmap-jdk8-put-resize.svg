<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">JDK 8+ ConcurrentHashMap put/get/resize 主路径</title>
  <desc id="desc">展示 ConcurrentHashMap 的 Node[]、CAS、桶头 synchronized、ForwardingNode 协助扩容、CounterCell 计数和弱一致读。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5f99"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b24634"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #14213d; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .label { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 14px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .code { font: 600 13px Menlo, Consolas, monospace; fill: #263238; }
      .blue { fill: #e8f4ff; stroke: #6aa9df; stroke-width: 2; rx: 12; }
      .green { fill: #e9f7ef; stroke: #58b77d; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff5d6; stroke: #e0ae35; stroke-width: 2; rx: 12; }
      .red { fill: #fdecea; stroke: #cf5d4b; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #a7b5c4; stroke-width: 2; rx: 12; }
      .line { stroke: #1f5f99; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line-red { stroke: #b24634; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #7b8794; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">ConcurrentHashMap：JDK 8+ 的桶级并发路径</text>
  <text x="50" y="86" class="subtitle">主线是 Node[]、CAS、桶头锁、协助扩容和弱一致读；Segment 只作为历史对比。</text>

  <rect x="40" y="120" width="1200" height="230" class="panel"/>
  <text x="68" y="156" class="panel-title">1. 数据结构：Node[] + 链表 / TreeBin</text>
  <rect x="84" y="200" width="160" height="74" class="green"/>
  <text x="128" y="230" class="label">table</text>
  <text x="112" y="254" class="code">volatile Node[]</text>
  <rect x="320" y="182" width="138" height="58" class="blue"/>
  <text x="366" y="208" class="label">Node</text>
  <text x="342" y="228" class="tiny">hash/key/volatile val/next</text>
  <rect x="320" y="260" width="138" height="58" class="blue"/>
  <text x="360" y="286" class="label">Node</text>
  <text x="346" y="306" class="tiny">链表尾插</text>
  <rect x="536" y="200" width="150" height="74" class="yellow"/>
  <text x="584" y="230" class="label">TreeBin</text>
  <text x="562" y="254" class="tiny">冲突高时树化</text>
  <rect x="764" y="200" width="170" height="74" class="red"/>
  <text x="800" y="230" class="label">ForwardingNode</text>
  <text x="790" y="254" class="tiny">迁移中 / 指向 nextTable</text>
  <rect x="1012" y="200" width="160" height="74" class="gray"/>
  <text x="1050" y="230" class="label">JDK 7</text>
  <text x="1034" y="254" class="tiny">Segment 历史对比</text>
  <line x1="244" y1="237" x2="320" y2="211" class="line"/>
  <line x1="244" y1="237" x2="320" y2="289" class="line"/>
  <line x1="458" y1="237" x2="536" y2="237" class="line"/>
  <line x1="686" y1="237" x2="764" y2="237" class="line-red"/>
  <line x1="934" y1="237" x2="1012" y2="237" class="dash"/>
  <text x="84" y="320" class="small">树化阈值与 HashMap 类似：链表长且表容量足够时树化；容量不足时优先扩容。</text>

  <rect x="40" y="390" width="1200" height="330" class="panel"/>
  <text x="68" y="426" class="panel-title">2. put 主路径：空桶 CAS，非空桶锁桶头</text>
  <rect x="78" y="468" width="138" height="72" class="red"/>
  <text x="116" y="496" class="label">null 检查</text>
  <text x="102" y="520" class="tiny">key/value 禁止 null</text>
  <rect x="246" y="468" width="138" height="72" class="blue"/>
  <text x="286" y="496" class="label">spread</text>
  <text x="268" y="520" class="tiny">定位桶 index</text>
  <rect x="414" y="468" width="138" height="72" class="yellow"/>
  <text x="448" y="496" class="label">initTable</text>
  <text x="438" y="520" class="tiny">sizeCtl + CAS</text>
  <rect x="582" y="468" width="138" height="72" class="green"/>
  <text x="612" y="496" class="label">空桶 CAS</text>
  <text x="608" y="520" class="tiny">casTabAt</text>
  <rect x="750" y="468" width="162" height="72" class="red"/>
  <text x="784" y="496" class="label">MOVED?</text>
  <text x="774" y="520" class="tiny">helpTransfer</text>
  <rect x="942" y="468" width="172" height="72" class="blue"/>
  <text x="976" y="496" class="label">锁桶头 f</text>
  <text x="968" y="520" class="tiny">synchronized(f)</text>
  <line x1="216" y1="504" x2="246" y2="504" class="line"/>
  <line x1="384" y1="504" x2="414" y2="504" class="line"/>
  <line x1="552" y1="504" x2="582" y2="504" class="line"/>
  <line x1="720" y1="504" x2="750" y2="504" class="line-red"/>
  <line x1="912" y1="504" x2="942" y2="504" class="line"/>
  <rect x="328" y="596" width="190" height="70" class="gray"/>
  <text x="370" y="626" class="label">链表 / TreeBin</text>
  <text x="354" y="650" class="tiny">覆盖、尾插、树更新</text>
  <rect x="584" y="596" width="190" height="70" class="gray"/>
  <text x="632" y="626" class="label">addCount</text>
  <text x="610" y="650" class="tiny">baseCount / CounterCell</text>
  <rect x="840" y="596" width="190" height="70" class="gray"/>
  <text x="888" y="626" class="label">resize 检查</text>
  <text x="872" y="650" class="tiny">阈值触发迁移</text>
  <path d="M 1028 540 C 1000 588, 642 590, 518 596" class="line"/>
  <line x1="518" y1="631" x2="584" y2="631" class="line"/>
  <line x1="774" y1="631" x2="840" y2="631" class="line"/>

  <rect x="40" y="760" width="585" height="310" class="panel"/>
  <text x="68" y="796" class="panel-title">3. 协助扩容：多个线程一起搬桶</text>
  <rect x="78" y="844" width="148" height="72" class="yellow"/>
  <text x="118" y="872" class="label">sizeCtl</text>
  <text x="102" y="896" class="tiny">初始化/扩容状态</text>
  <rect x="258" y="844" width="148" height="72" class="blue"/>
  <text x="296" y="872" class="label">nextTable</text>
  <text x="284" y="896" class="tiny">新数组</text>
  <rect x="438" y="844" width="148" height="72" class="green"/>
  <text x="476" y="872" class="label">transferIndex</text>
  <text x="462" y="896" class="tiny">分段领取任务</text>
  <line x1="226" y1="880" x2="258" y2="880" class="line"/>
  <line x1="406" y1="880" x2="438" y2="880" class="line"/>
  <rect x="158" y="966" width="338" height="58" class="red"/>
  <text x="228" y="996" class="label">ForwardingNode 标记已迁移桶</text>
  <path d="M 512 916 C 506 948, 450 958, 327 966" class="line-red"/>
  <text x="86" y="1046" class="small">put/get 遇到 ForwardingNode，会协助迁移或转向新表查找。</text>

  <rect x="655" y="760" width="585" height="310" class="panel"/>
  <text x="683" y="796" class="panel-title">4. 读、统计和复合操作边界</text>
  <rect x="688" y="844" width="138" height="72" class="green"/>
  <text x="728" y="872" class="label">get</text>
  <text x="706" y="896" class="tiny">volatile 读，无桶锁</text>
  <rect x="858" y="844" width="138" height="72" class="yellow"/>
  <text x="902" y="872" class="label">size</text>
  <text x="878" y="896" class="tiny">baseCount + cells</text>
  <rect x="1028" y="844" width="138" height="72" class="blue"/>
  <text x="1068" y="872" class="label">迭代</text>
  <text x="1048" y="896" class="tiny">弱一致，不 fail-fast</text>
  <rect x="688" y="966" width="220" height="64" class="red"/>
  <text x="724" y="994" class="label">get + put 不是原子</text>
  <text x="718" y="1014" class="tiny">check-then-act 竞态</text>
  <rect x="946" y="966" width="220" height="64" class="green"/>
  <text x="982" y="994" class="label">compute / merge / LongAdder</text>
  <text x="990" y="1014" class="tiny">原子复合更新</text>
  <line x1="908" y1="998" x2="946" y2="998" class="line"/>
  <text x="692" y="1052" class="small">跨 key 不变量仍需要外部同步、事务或重新建模。</text>

  <rect x="40" y="1110" width="1200" height="92" class="panel"/>
  <text x="68" y="1144" class="panel-title">回答抓手</text>
  <text x="190" y="1144" class="small">JDK 8+ 主线：空桶 CAS、桶头 synchronized、ForwardingNode 协助扩容、CounterCell 计数、弱一致读。</text>
  <text x="190" y="1176" class="small">不要把单个方法线程安全扩展成外部复合逻辑安全；计数、去重、跨 key 约束要选正确 API 或同步边界。</text>
</svg>
