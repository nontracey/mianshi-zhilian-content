<svg width="100%" aria-label="MVCC版本链示意图" role="img" viewBox="0 0 680 320"><title>MVCC版本链示意图</title><desc>多版本并发控制的ReadView机制</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="340" y="24" fill="#042C53" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">MVCC 版本链</text><text x="340" y="44" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">多版本并发控制 - ReadView机制</text><rect width="620" height="60" x="30" y="64" fill="#EEEDFE" stroke="#7F77DD" stroke-width=".5" rx="10"/><text x="340" y="84" fill="#26215C" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">每行隐藏字段</text><text x="170" y="104" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">DB_TRX_ID (事务ID)</text><text x="380" y="104" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">DB_ROLL_PTR (回滚指针)</text><text x="560" y="104" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">DB_ROW_ID</text><text x="100" y="144" fill="#042C53" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">版本链:</text><rect width="140" height="48" x="180" y="160" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".5" rx="8"/><text x="250" y="178" fill="#042C53" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">V3</text><text x="250" y="196" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">trx_id=300</text><line x1="320" x2="350" y1="184" y2="184" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><rect width="140" height="48" x="350" y="160" fill="#FAEEDA" stroke="#BA7517" stroke-width=".5" rx="8"/><text x="420" y="178" fill="#042C53" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">V2</text><text x="420" y="196" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">trx_id=200</text><line x1="490" x2="520" y1="184" y2="184" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><rect width="140" height="48" x="520" y="160" fill="#E6F1FB" stroke="#378ADD" stroke-width=".5" rx="8"/><text x="590" y="178" fill="#042C53" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">V1</text><text x="590" y="196" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">trx_id=100</text><rect width="520" height="70" x="80" y="230" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="10"/><text x="340" y="250" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">ReadView 快照读判断规则</text><text x="340" y="270" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">RC: 每次SELECT创建新ReadView</text><text x="340" y="288" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">RR: 事务中只在首次SELECT创建ReadView</text></svg>