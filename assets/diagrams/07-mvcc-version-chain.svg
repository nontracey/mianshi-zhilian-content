<svg viewBox="0 0 680 320" width="100%" role="img" aria-label="MVCC版本链示意图">
<title>MVCC版本链示意图</title><desc>多版本并发控制的ReadView机制</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">MVCC 版本链</text>
<text x="340" y="44" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">多版本并发控制 - ReadView机制</text>
<rect x="30" y="64" width="620" height="60" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="340" y="84" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C" font-family="system-ui, sans-serif">每行隐藏字段</text>
<text x="170" y="104" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">DB_TRX_ID (事务ID)</text>
<text x="380" y="104" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">DB_ROLL_PTR (回滚指针)</text>
<text x="560" y="104" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">DB_ROW_ID</text>
<text x="100" y="144" text-anchor="start" font-size="13" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">版本链:</text>
<rect x="180" y="160" width="140" height="48" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="250" y="178" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">V3</text>
<text x="250" y="196" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">trx_id=300</text>
<line x1="320" y1="184" x2="350" y2="184" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="350" y="160" width="140" height="48" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="420" y="178" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">V2</text>
<text x="420" y="196" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">trx_id=200</text>
<line x1="490" y1="184" x2="520" y2="184" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="520" y="160" width="140" height="48" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="590" y="178" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">V1</text>
<text x="590" y="196" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">trx_id=100</text>
<rect x="80" y="230" width="520" height="70" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="250" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">ReadView 快照读判断规则</text>
<text x="340" y="270" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">RC: 每次SELECT创建新ReadView</text>
<text x="340" y="288" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">RR: 事务中只在首次SELECT创建ReadView</text>
</svg>