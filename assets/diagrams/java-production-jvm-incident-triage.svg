<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1280"><title id="title">线上 JVM 故障排查证据链</title><desc id="desc">展示线上 JVM 故障从止血保现场到 CPU、OOM、GC、RT 四条症状路线，再到修复复验和复盘的闭环。</desc><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#1f5f99" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#b24634" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f7fafc}.title{font:700 30px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#14213d}.subtitle{font:400 15px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.panel{fill:#fff;stroke:#d9e2ec;stroke-width:2;rx:16}.label{fill:#1f2933}.panel-title{font:700 20px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#1f2933}.label{font:700 16px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.small{font:400 14px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#334e68}.tiny{font:400 12px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.blue{fill:#e8f4ff;stroke:#6aa9df}.blue,.gray{stroke-width:2;rx:12}.green{fill:#e9f7ef;stroke:#58b77d}.green,.red,.yellow{stroke-width:2;rx:12}.yellow{fill:#fff5d6;stroke:#e0ae35}.red{fill:#fdecea;stroke:#cf5d4b}.gray{fill:#f1f5f9;stroke:#a7b5c4}.line{stroke:#1f5f99;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1280" height="1280" class="bg"/><text x="48" y="56" class="title">线上 JVM 故障：从现场证据到可复验根因</text><text x="50" y="86" class="subtitle">先保护用户和证据，再按主症状下钻；工具是为验证假设服务的。</text><rect width="1200" height="230" x="40" y="120" class="panel"/><text x="68" y="156" class="panel-title">1. 事故入口：止血与取证同时推进</text><rect width="156" height="82" x="76" y="196" class="red"/><text x="120" y="228" class="label">告警/反馈</text><text x="106" y="252" class="tiny">错误率 / RT / OOM</text><rect width="156" height="82" x="278" y="196" class="green"/><text x="322" y="228" class="label">先止血</text><text x="304" y="252" class="tiny">摘流量 / 限流 / 回滚</text><rect width="156" height="82" x="480" y="196" class="yellow"/><text x="524" y="228" class="label">保现场</text><text x="502" y="252" class="tiny">留一台带病实例</text><rect width="222" height="82" x="682" y="196" class="blue"/><text x="746" y="228" class="label">保存证据</text><text x="706" y="252" class="tiny">日志 / dump / JFR / 监控 / 发布记录</text><rect width="222" height="82" x="950" y="196" class="gray"/><text x="1004" y="228" class="label">选择主症状</text><text x="978" y="252" class="tiny">CPU / OOM / GC / RT</text><line x1="232" x2="278" y1="237" y2="237" class="line"/><line x1="434" x2="480" y1="237" y2="237" class="line"/><line x1="636" x2="682" y1="237" y2="237" class="line"/><line x1="904" x2="950" y1="237" y2="237" class="line"/><rect width="585" height="360" x="40" y="388" class="panel"/><text x="68" y="424" class="panel-title">2. CPU 高：线程 id 到 Java 栈</text><rect width="118" height="70" x="72" y="468" class="blue"/><text x="102" y="496" class="label">top</text><text x="92" y="518" class="tiny">找 Java PID</text><rect width="154" height="70" x="216" y="468" class="blue"/><text x="238" y="496" class="label">top -H / pidstat</text><text x="250" y="518" class="tiny">找热线程 TID</text><rect width="86" height="70" x="396" y="468" class="yellow"/><text x="416" y="496" class="label">hex</text><text x="410" y="518" class="tiny">转 nid</text><rect width="84" height="70" x="508" y="468" class="green"/><text x="528" y="496" class="label">jcmd</text><text x="522" y="518" class="tiny">线程栈</text><line x1="190" x2="216" y1="503" y2="503" class="line"/><line x1="370" x2="396" y1="503" y2="503" class="line"/><line x1="482" x2="508" y1="503" y2="503" class="line"/><rect width="240" height="92" x="72" y="588" class="gray"/><text x="98" y="620" class="small">业务线程 RUNNABLE</text><text x="98" y="646" class="tiny">死循环 / 正则 / 序列化 / 重试</text><rect width="246" height="92" x="346" y="588" class="gray"/><text x="372" y="620" class="small">GC 或 native 线程</text><text x="372" y="646" class="tiny">转 GC 日志 / JFR / 系统工具</text><text x="78" y="716" class="small">连续抓多次线程 dump，确认热点栈是否稳定，再决定修代码还是转资源路线。</text><rect width="585" height="360" x="655" y="388" class="panel"/><text x="683" y="424" class="panel-title">3. OOM/内存：按错误类型分入口</text><rect width="126" height="70" x="688" y="468" class="green"/><text x="724" y="496" class="label">Heap</text><text x="710" y="518" class="tiny">dump / MAT</text><rect width="126" height="70" x="840" y="468" class="blue"/><text x="864" y="496" class="label">Metaspace</text><text x="858" y="518" class="tiny">ClassLoader</text><rect width="126" height="70" x="992" y="468" class="yellow"/><text x="1020" y="496" class="label">Direct</text><text x="1016" y="518" class="tiny">NIO / Netty</text><rect width="204" height="92" x="688" y="588" class="gray"/><text x="714" y="620" class="small">native / thread</text><text x="714" y="646" class="tiny">NMT / -Xss / ulimit / pid limit</text><rect width="246" height="92" x="926" y="588" class="red"/><text x="952" y="620" class="small">容器 OOMKilled</text><text x="952" y="646" class="tiny">RSS、cgroup 事件、系统日志</text><text x="692" y="716" class="small">结论要能说清谁保活、为什么释放不了、是泄漏还是容量不足。</text><rect width="585" height="286" x="40" y="786" class="panel"/><text x="68" y="822" class="panel-title">4. GC/RT：把 JVM 信号和业务时间线对齐</text><rect width="142" height="70" x="72" y="864" class="blue"/><text x="102" y="892" class="label">GC 日志</text><text x="92" y="914" class="tiny">pause / 原因 / 水位</text><rect width="142" height="70" x="244" y="864" class="yellow"/><text x="270" y="892" class="label">Safepoint</text><text x="266" y="914" class="tiny">停顿归因</text><rect width="142" height="70" x="416" y="864" class="green"/><text x="450" y="892" class="label">业务 RT</text><text x="438" y="914" class="tiny">p99 / 错误率</text><line x1="214" x2="244" y1="899" y2="899" class="line"/><line x1="386" x2="416" y1="899" y2="899" class="line"/><rect width="486" height="58" x="72" y="974" class="gray"/><text x="96" y="1004" class="small">Full/Old 后水位不降看存活集；RT 高但 GC 不重合就转下游、锁和线程池。</text><rect width="585" height="286" x="655" y="786" class="panel"/><text x="683" y="822" class="panel-title">5. 修复与复验：证明有效再收口</text><rect width="144" height="76" x="688" y="864" class="yellow"/><text x="724" y="894" class="label">最小变更</text><text x="714" y="918" class="tiny">代码 / 参数 / 限流</text><rect width="144" height="76" x="868" y="864" class="green"/><text x="904" y="894" class="label">同指标复验</text><text x="896" y="918" class="tiny">CPU / RT / GC / 错误率</text><rect width="144" height="76" x="1048" y="864" class="blue"/><text x="1084" y="894" class="label">复盘预防</text><text x="1076" y="918" class="tiny">监控 / 压测 / 容量</text><line x1="832" x2="868" y1="902" y2="902" class="line"/><line x1="1012" x2="1048" y1="902" y2="902" class="line"/><rect width="504" height="50" x="688" y="982" class="gray"/><text x="714" y="1012" class="small">一次只改一个变量；没有前后对比的调参不算根因闭环。</text><rect width="1200" height="92" x="40" y="1110" class="panel"/><text x="68" y="1144" class="panel-title">回答抓手</text><text x="190" y="1144" class="small">影响面、取证、假设、工具、代码或资源根因、最小修复、同指标复验、预防措施。</text><text x="190" y="1176" class="small">能说清“这个命令要验证什么假设”，比罗列一串工具更重要。</text></svg>