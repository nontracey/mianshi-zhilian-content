<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" aria-labelledby="title desc" role="img" viewBox="0 0 1500 1500"><title id="title">Java garbage collector selection and diagnostics</title><desc id="desc">A topic-specific diagram explaining Java garbage collector selection by SLO, JDK version boundaries, collector mechanisms, and GC log diagnostics.</desc><defs><marker id="arrow" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 32px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.section{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.gray{fill:#e5e7eb;stroke:#94a3b8}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1500" height="1500" class="bg"/><g transform="translate(70 0)"><text x="70" y="66" class="title">垃圾收集器选型：先看目标，再看版本和证据</text><text x="70" y="98" class="subtitle">收集器不是背名称表；要把吞吐、P99 停顿、堆规模、JDK 版本、CPU/内存余量和日志信号放在一起判断。</text><rect width="1220" height="305" x="70" y="130" class="panel" rx="16"/><text x="96" y="168" class="section">1. 版本与定位边界</text><rect width="200" height="86" x="105" y="220" stroke-width="2" class="blue" rx="12"/><text x="132" y="252" class="box-title">Serial</text><text x="132" y="276" class="text">单线程 STW</text><text x="132" y="294" class="text">显式用于小堆/工具</text><rect width="200" height="86" x="325" y="220" stroke-width="2" class="yellow" rx="12"/><text x="352" y="252" class="box-title">Parallel</text><text x="352" y="276" class="text">吞吐优先</text><text x="352" y="294" class="text">批处理/后台计算</text><rect width="200" height="86" x="545" y="220" stroke-width="2" class="gray" rx="12"/><text x="572" y="252" class="box-title">CMS</text><text x="572" y="276" class="text">历史低停顿</text><text x="572" y="294" class="text">JDK 14 已移除</text><rect width="200" height="86" x="765" y="220" stroke-width="2" class="green" rx="12"/><text x="792" y="252" class="box-title">G1</text><text x="792" y="276" class="text">Region + Mixed GC</text><text x="792" y="294" class="text">JDK 9 server 默认</text><rect width="220" height="86" x="985" y="220" stroke-width="2" class="cyan" rx="12"/><text x="1012" y="252" class="box-title">ZGC / Shenandoah</text><text x="1012" y="276" class="text">极低停顿，大堆友好</text><text x="1012" y="294" class="text">版本/发行版要确认</text><rect width="900" height="46" x="205" y="340" stroke-width="2" class="violet" rx="12"/><text x="232" y="369" class="text">ZGC：JDK 15 转正，JDK 21 引入分代，JDK 23 使用 ZGC 时默认分代，JDK 24 移除非分代模式。</text><rect width="1220" height="315" x="70" y="475" class="panel" rx="16"/><text x="96" y="513" class="section">2. 按业务目标选择，不按名字选择</text><rect width="245" height="88" x="105" y="570" stroke-width="2" class="red" rx="12"/><text x="132" y="602" class="box-title">吞吐优先</text><text x="132" y="627" class="text">可接受较长 STW</text><text x="132" y="645" class="text">优先评估 Parallel</text><path d="M355 614 H410" class="arrow"/><rect width="245" height="88" x="425" y="570" stroke-width="2" class="green" rx="12"/><text x="452" y="602" class="box-title">常规在线服务</text><text x="452" y="627" class="text">关注 P95/P99</text><text x="452" y="645" class="text">G1 作为默认基线</text><path d="M675 614 H730" class="arrow"/><rect width="245" height="88" x="745" y="570" stroke-width="2" class="cyan" rx="12"/><text x="772" y="602" class="box-title">极低停顿 / 大堆</text><text x="772" y="627" class="text">P999 严格或 TB 级堆</text><text x="772" y="645" class="text">压测 ZGC / Shenandoah</text><rect width="230" height="88" x="1005" y="570" stroke-width="2" class="yellow" rx="12"/><text x="1032" y="602" class="box-title">小堆短任务</text><text x="1032" y="627" class="text">启动/足迹更重要</text><text x="1032" y="645" class="text">可显式选择 Serial</text><rect width="930" height="46" x="175" y="700" stroke-width="2" class="blue" rx="12"/><text x="202" y="729" class="text">显式参数通常优先于 JVM 默认选择；默认值随 JDK、运行环境和未来 JEP 变化，生产要打印实际 flags。</text><rect width="595" height="330" x="70" y="830" class="panel" rx="16"/><text x="96" y="868" class="section">3. 关键机制</text><rect width="230" height="80" x="105" y="930" stroke-width="2" class="yellow" rx="12"/><text x="132" y="961" class="box-title">Parallel / Serial</text><text x="132" y="985" class="text">STW 并行或单线程</text><rect width="230" height="80" x="385" y="930" stroke-width="2" class="green" rx="12"/><text x="412" y="961" class="box-title">G1</text><text x="412" y="985" class="text">Remembered Set + evacuation</text><rect width="510" height="62" x="105" y="1040" stroke-width="2" class="cyan" rx="12"/><text x="132" y="1068" class="text">ZGC/Shenandoah 用屏障和并发重定位换低停顿；代价是 CPU、内存余量和实现复杂度。</text><rect width="595" height="330" x="695" y="830" class="panel" rx="16"/><text x="721" y="868" class="section">4. 失败信号</text><rect width="240" height="62" x="730" y="930" stroke-width="2" class="red" rx="12"/><text x="757" y="957" class="box-title">G1</text><text x="757" y="980" class="text">Humongous / to-space exhausted</text><rect width="240" height="62" x="1010" y="930" stroke-width="2" class="violet" rx="12"/><text x="1037" y="957" class="box-title">ZGC / Shenandoah</text><text x="1037" y="980" class="text">Allocation stall / CPU 抢占</text><rect width="420" height="52" x="780" y="1030" stroke-width="2" class="yellow" rx="12"/><text x="807" y="1063" class="text">Parallel 的问题常表现为 Full GC 长停顿；CMS 历史系统要看碎片和 concurrent mode failure。</text><rect width="1220" height="205" x="70" y="1200" class="panel" rx="16"/><text x="96" y="1238" class="section">5. 上线验证</text><rect width="230" height="62" x="105" y="1290" stroke-width="2" class="blue" rx="12"/><text x="132" y="1317" class="box-title">实际 flags</text><text x="132" y="1340" class="mono">PrintCommandLineFlags</text><rect width="230" height="62" x="385" y="1290" stroke-width="2" class="green" rx="12"/><text x="412" y="1317" class="box-title">GC 日志</text><text x="412" y="1340" class="mono">-Xlog:gc*</text><rect width="230" height="62" x="665" y="1290" stroke-width="2" class="yellow" rx="12"/><text x="692" y="1317" class="box-title">业务指标</text><text x="692" y="1340" class="text">P99/P999、吞吐、超时</text><rect width="230" height="62" x="945" y="1290" stroke-width="2" class="red" rx="12"/><text x="972" y="1317" class="box-title">资源余量</text><text x="972" y="1340" class="text">CPU、RSS、容器 limit</text><text x="96" y="1452" class="small">答题抓手：选收集器 = 业务目标 + JDK/发行版 + 堆规模 + 日志证据 + 压测验证；不要把旧 CMS 经验当成现代默认。</text></g></svg>