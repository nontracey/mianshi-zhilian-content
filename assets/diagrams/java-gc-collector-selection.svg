<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500" role="img" aria-labelledby="title desc">
  <title id="title">Java garbage collector selection and diagnostics</title>
  <desc id="desc">A topic-specific diagram explaining Java garbage collector selection by SLO, JDK version boundaries, collector mechanisms, and GC log diagnostics.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .gray { fill: #e5e7eb; stroke: #94a3b8; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1500" height="1500"/>
  <g transform="translate(70 0)">
    <text class="title" x="70" y="66">垃圾收集器选型：先看目标，再看版本和证据</text>
    <text class="subtitle" x="70" y="98">收集器不是背名称表；要把吞吐、P99 停顿、堆规模、JDK 版本、CPU/内存余量和日志信号放在一起判断。</text>

    <rect class="panel" x="70" y="130" width="1220" height="305" rx="16"/>
    <text class="section" x="96" y="168">1. 版本与定位边界</text>

    <rect class="blue" x="105" y="220" width="200" height="86" rx="12" stroke-width="2"/>
    <text class="box-title" x="132" y="252">Serial</text>
    <text class="text" x="132" y="276">单线程 STW</text>
    <text class="text" x="132" y="294">显式用于小堆/工具</text>

    <rect class="yellow" x="325" y="220" width="200" height="86" rx="12" stroke-width="2"/>
    <text class="box-title" x="352" y="252">Parallel</text>
    <text class="text" x="352" y="276">吞吐优先</text>
    <text class="text" x="352" y="294">批处理/后台计算</text>

    <rect class="gray" x="545" y="220" width="200" height="86" rx="12" stroke-width="2"/>
    <text class="box-title" x="572" y="252">CMS</text>
    <text class="text" x="572" y="276">历史低停顿</text>
    <text class="text" x="572" y="294">JDK 14 已移除</text>

    <rect class="green" x="765" y="220" width="200" height="86" rx="12" stroke-width="2"/>
    <text class="box-title" x="792" y="252">G1</text>
    <text class="text" x="792" y="276">Region + Mixed GC</text>
    <text class="text" x="792" y="294">JDK 9 server 默认</text>

    <rect class="cyan" x="985" y="220" width="220" height="86" rx="12" stroke-width="2"/>
    <text class="box-title" x="1012" y="252">ZGC / Shenandoah</text>
    <text class="text" x="1012" y="276">极低停顿，大堆友好</text>
    <text class="text" x="1012" y="294">版本/发行版要确认</text>

    <rect class="violet" x="205" y="340" width="900" height="46" rx="12" stroke-width="2"/>
    <text class="text" x="232" y="369">ZGC：JDK 15 转正，JDK 21 引入分代，JDK 23 使用 ZGC 时默认分代，JDK 24 移除非分代模式。</text>

    <rect class="panel" x="70" y="475" width="1220" height="315" rx="16"/>
    <text class="section" x="96" y="513">2. 按业务目标选择，不按名字选择</text>

    <rect class="red" x="105" y="570" width="245" height="88" rx="12" stroke-width="2"/>
    <text class="box-title" x="132" y="602">吞吐优先</text>
    <text class="text" x="132" y="627">可接受较长 STW</text>
    <text class="text" x="132" y="645">优先评估 Parallel</text>

    <path class="arrow" d="M355 614 H410"/>

    <rect class="green" x="425" y="570" width="245" height="88" rx="12" stroke-width="2"/>
    <text class="box-title" x="452" y="602">常规在线服务</text>
    <text class="text" x="452" y="627">关注 P95/P99</text>
    <text class="text" x="452" y="645">G1 作为默认基线</text>

    <path class="arrow" d="M675 614 H730"/>

    <rect class="cyan" x="745" y="570" width="245" height="88" rx="12" stroke-width="2"/>
    <text class="box-title" x="772" y="602">极低停顿 / 大堆</text>
    <text class="text" x="772" y="627">P999 严格或 TB 级堆</text>
    <text class="text" x="772" y="645">压测 ZGC / Shenandoah</text>

    <rect class="yellow" x="1005" y="570" width="230" height="88" rx="12" stroke-width="2"/>
    <text class="box-title" x="1032" y="602">小堆短任务</text>
    <text class="text" x="1032" y="627">启动/足迹更重要</text>
    <text class="text" x="1032" y="645">可显式选择 Serial</text>

    <rect class="blue" x="175" y="700" width="930" height="46" rx="12" stroke-width="2"/>
    <text class="text" x="202" y="729">显式参数通常优先于 JVM 默认选择；默认值随 JDK、运行环境和未来 JEP 变化，生产要打印实际 flags。</text>

    <rect class="panel" x="70" y="830" width="595" height="330" rx="16"/>
    <text class="section" x="96" y="868">3. 关键机制</text>

    <rect class="yellow" x="105" y="930" width="230" height="80" rx="12" stroke-width="2"/>
    <text class="box-title" x="132" y="961">Parallel / Serial</text>
    <text class="text" x="132" y="985">STW 并行或单线程</text>

    <rect class="green" x="385" y="930" width="230" height="80" rx="12" stroke-width="2"/>
    <text class="box-title" x="412" y="961">G1</text>
    <text class="text" x="412" y="985">Remembered Set + evacuation</text>

    <rect class="cyan" x="105" y="1040" width="510" height="62" rx="12" stroke-width="2"/>
    <text class="text" x="132" y="1068">ZGC/Shenandoah 用屏障和并发重定位换低停顿；代价是 CPU、内存余量和实现复杂度。</text>

    <rect class="panel" x="695" y="830" width="595" height="330" rx="16"/>
    <text class="section" x="721" y="868">4. 失败信号</text>

    <rect class="red" x="730" y="930" width="240" height="62" rx="12" stroke-width="2"/>
    <text class="box-title" x="757" y="957">G1</text>
    <text class="text" x="757" y="980">Humongous / to-space exhausted</text>

    <rect class="violet" x="1010" y="930" width="240" height="62" rx="12" stroke-width="2"/>
    <text class="box-title" x="1037" y="957">ZGC / Shenandoah</text>
    <text class="text" x="1037" y="980">Allocation stall / CPU 抢占</text>

    <rect class="yellow" x="780" y="1030" width="420" height="52" rx="12" stroke-width="2"/>
    <text class="text" x="807" y="1063">Parallel 的问题常表现为 Full GC 长停顿；CMS 历史系统要看碎片和 concurrent mode failure。</text>

    <rect class="panel" x="70" y="1200" width="1220" height="205" rx="16"/>
    <text class="section" x="96" y="1238">5. 上线验证</text>

    <rect class="blue" x="105" y="1290" width="230" height="62" rx="12" stroke-width="2"/>
    <text class="box-title" x="132" y="1317">实际 flags</text>
    <text class="mono" x="132" y="1340">PrintCommandLineFlags</text>

    <rect class="green" x="385" y="1290" width="230" height="62" rx="12" stroke-width="2"/>
    <text class="box-title" x="412" y="1317">GC 日志</text>
    <text class="mono" x="412" y="1340">-Xlog:gc*</text>

    <rect class="yellow" x="665" y="1290" width="230" height="62" rx="12" stroke-width="2"/>
    <text class="box-title" x="692" y="1317">业务指标</text>
    <text class="text" x="692" y="1340">P99/P999、吞吐、超时</text>

    <rect class="red" x="945" y="1290" width="230" height="62" rx="12" stroke-width="2"/>
    <text class="box-title" x="972" y="1317">资源余量</text>
    <text class="text" x="972" y="1340">CPU、RSS、容器 limit</text>

    <text class="small" x="96" y="1452">答题抓手：选收集器 = 业务目标 + JDK/发行版 + 堆规模 + 日志证据 + 压测验证；不要把旧 CMS 经验当成现代默认。</text>
  </g>
</svg>
