<svg viewBox="0 0 680 330" width="100%" role="img" aria-label="滑动窗口示意图">
<title>滑动窗口示意图</title><desc>连续子数组/子串问题的通用解法</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">滑动窗口</text>
<text x="340" y="44" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">解决连续子数组/子串问题</text>
<rect x="120" y="70" width="50" height="40" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="145" y="94" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">a</text>
<rect x="180" y="70" width="50" height="40" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="205" y="94" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">b</text>
<rect x="240" y="70" width="50" height="40" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="265" y="94" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">c</text>
<rect x="300" y="70" width="50" height="40" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="325" y="94" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">b</text>
<rect x="360" y="70" width="50" height="40" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="385" y="94" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">d</text>
<rect x="420" y="70" width="50" height="40" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="445" y="94" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">e</text>
<rect x="480" y="70" width="50" height="40" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="505" y="94" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">f</text>
<rect x="175" y="118" width="185" height="24" rx="4" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4,2"/>
<text x="268" y="158" text-anchor="middle" font-size="12" font-weight="500" fill="#0F6E56" font-family="system-ui, sans-serif">窗口 [left, right)</text>
<text x="200" y="178" text-anchor="middle" font-size="11" font-weight="400" fill="#993C1D" font-family="system-ui, sans-serif">left</text>
<line x1="195" y1="112" x2="195" y2="118" stroke="#993C1D" stroke-width="1.5" marker-end="url(#a)"/>
<text x="320" y="178" text-anchor="middle" font-size="11" font-weight="400" fill="#185FA5" font-family="system-ui, sans-serif">right</text>
<line x1="315" y1="112" x2="315" y2="118" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="80" y="200" width="520" height="110" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="220" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">模板代码</text>
<text x="340" y="242" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">int left = 0;</text>
<text x="340" y="260" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">for (int right = 0; right &lt; n; right++) {</text>
<text x="340" y="278" text-anchor="middle" font-size="11" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">    // 扩展窗口: 加入 s[right]</text>
<text x="340" y="296" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">    while (needShrink()) { shrink left++; }</text>
<text x="340" y="306" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">}</text>
</svg>