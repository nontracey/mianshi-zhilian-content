<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1420" viewBox="0 0 1320 1420" role="img" aria-labelledby="title desc">
  <title id="title">Java NIO and Netty Reactor pipeline, framing, ByteBuf, event loop isolation, and production diagnostics</title>
  <desc id="desc">A topic-specific diagram explaining Java BIO NIO AIO positioning, NIO Channel Buffer Selector, Netty boss and worker event loops, inbound and outbound pipeline, ByteBuf reference counting and frame decoding, slow task offloading, backpressure, and diagnostics such as event loop lag and ByteBuf leaks.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1420"/>
  <text class="title" x="70" y="64">Java NIO 与 Netty：从就绪事件到协议消息</text>
  <text class="subtitle" x="70" y="96">NIO 解决多连接就绪复用，Netty 把 Reactor、Pipeline、ByteBuf、拆包和线程隔离做成工程化框架。</text>

  <rect class="panel" x="70" y="130" width="1180" height="230" rx="16"/>
  <text class="section-title" x="96" y="166">1. IO 模型定位</text>

  <rect class="yellow" x="110" y="215" width="250" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="137" y="247">BIO</text>
  <text class="text" x="137" y="272">同步阻塞，一连接一线程常见</text>

  <rect class="blue" x="400" y="215" width="250" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="427" y="247">NIO</text>
  <text class="text" x="427" y="272">同步非阻塞 + Selector 多路复用</text>

  <rect class="violet" x="690" y="215" width="250" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="717" y="247">AIO</text>
  <text class="text" x="717" y="272">异步完成通知，使用场景需评估</text>

  <rect class="green" x="980" y="215" width="210" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1007" y="247">Reactor</text>
  <text class="text" x="1007" y="272">事件循环分发就绪事件</text>

  <rect class="panel" x="70" y="405" width="1180" height="325" rx="16"/>
  <text class="section-title" x="96" y="441">2. Netty 主从 Reactor 与 Pipeline</text>

  <rect class="blue" x="105" y="500" width="170" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="532">Client</text>
  <text class="text" x="132" y="557">连接 / 发字节流</text>

  <rect class="green" x="325" y="500" width="210" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="352" y="532">Boss EventLoop</text>
  <text class="mono" x="352" y="557">accept</text>

  <rect class="green" x="585" y="500" width="220" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="612" y="532">Worker EventLoop</text>
  <text class="text" x="612" y="557">Selector 等待读写就绪</text>

  <rect class="yellow" x="855" y="500" width="295" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="882" y="532">ChannelPipeline</text>
  <text class="text" x="882" y="557">入站 head→tail，出站 tail→head</text>

  <path class="arrow-blue" d="M275 541 H316"/>
  <path class="arrow-blue" d="M535 541 H576"/>
  <path class="arrow-blue" d="M805 541 H846"/>

  <rect class="cyan" x="140" y="625" width="235" height="58" rx="12" stroke-width="2"/>
  <text class="box-title" x="167" y="660">Channel 绑定一个 EventLoop</text>

  <rect class="red" x="450" y="625" width="260" height="58" rx="12" stroke-width="2"/>
  <text class="box-title" x="477" y="660">EventLoop 不能跑慢 SQL/RPC/文件 IO</text>

  <rect class="blue" x="785" y="625" width="320" height="58" rx="12" stroke-width="2"/>
  <text class="box-title" x="812" y="660">慢任务交给业务线程池或独立 Executor</text>

  <path class="dash" d="M710 654 H776"/>

  <rect class="panel" x="70" y="770" width="575" height="300" rx="16"/>
  <text class="section-title" x="96" y="806">3. 字节流到消息：ByteBuf 与 FrameDecoder</text>

  <rect class="blue" x="105" y="855" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="887">ByteBuf</text>
  <text class="text" x="132" y="912">reader/writer index 分离</text>
  <text class="text" x="132" y="930">池化、切片、组合减少拷贝</text>

  <rect class="yellow" x="375" y="855" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="402" y="887">FrameDecoder</text>
  <text class="text" x="402" y="912">长度字段/分隔符/定长</text>
  <text class="text" x="402" y="930">解决粘包和半包</text>

  <rect class="red" x="105" y="970" width="230" height="64" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="1000">引用计数</text>
  <text class="text" x="132" y="1022">retain/release 错误会泄漏</text>

  <rect class="green" x="375" y="970" width="230" height="64" rx="12" stroke-width="2"/>
  <text class="box-title" x="402" y="1000">协议处理</text>
  <text class="text" x="402" y="1022">完整消息再交给业务 Handler</text>

  <rect class="panel" x="675" y="770" width="575" height="300" rx="16"/>
  <text class="section-title" x="701" y="806">4. 线上排查与压测指标</text>

  <rect class="red" x="710" y="855" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="737" y="887">EventLoop lag</text>
  <text class="text" x="737" y="912">慢任务、GC、锁竞争</text>
  <text class="text" x="737" y="930">会拖慢多个 Channel</text>

  <rect class="yellow" x="980" y="855" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1007" y="887">写缓冲水位</text>
  <text class="text" x="1007" y="912">高/低水位与可写状态</text>
  <text class="mono" x="1007" y="930">channelWritabilityChanged</text>

  <rect class="blue" x="710" y="970" width="230" height="64" rx="12" stroke-width="2"/>
  <text class="box-title" x="737" y="1000">连接与 backlog</text>
  <text class="text" x="737" y="1022">accept 队列、连接暴涨、FD 限制</text>

  <rect class="green" x="980" y="970" width="230" height="64" rx="12" stroke-width="2"/>
  <text class="box-title" x="1007" y="1000">Leak Detector</text>
  <text class="text" x="1007" y="1022">定位 ByteBuf 未释放路径</text>

  <rect class="panel" x="70" y="1110" width="1180" height="115" rx="16"/>
  <text class="section-title" x="96" y="1146">5. 面试表达顺序</text>
  <text class="text" x="120" y="1184">先讲 BIO/NIO/AIO 的阻塞语义，再讲 NIO 三件套；然后把 Reactor 映射到 Netty 的 Boss/Worker、Pipeline、ByteBuf 和 FrameDecoder。</text>
  <text class="text" x="120" y="1210">最后补工程边界：EventLoop 不阻塞、协议必须拆包、ByteBuf 要释放、写水位做背压、线上看 EventLoop lag 和泄漏日志。</text>

  <text class="small" x="96" y="1348">答题抓手：NIO 不是异步 IO；Selector 只通知就绪，读写仍由应用线程执行；Netty 是 NIO/Reactor 的工程化封装。</text>
</svg>
