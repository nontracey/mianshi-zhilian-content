<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1420" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1420"><title id="title">Java NIO and Netty Reactor pipeline, framing, ByteBuf, event loop isolation, and production diagnostics</title><desc id="desc">A topic-specific diagram explaining Java BIO NIO AIO positioning, NIO Channel Buffer Selector, Netty boss and worker event loops, inbound and outbound pipeline, ByteBuf reference counting and frame decoding, slow task offloading, backpressure, and diagnostics such as event loop lag and ByteBuf leaks.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 32px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.arrow-blue{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:7 6}</style></defs><rect width="1320" height="1420" class="bg"/><text x="70" y="64" class="title">Java NIO 与 Netty：从就绪事件到协议消息</text><text x="70" y="96" class="subtitle">NIO 解决多连接就绪复用，Netty 把 Reactor、Pipeline、ByteBuf、拆包和线程隔离做成工程化框架。</text><rect width="1180" height="230" x="70" y="130" class="panel" rx="16"/><text x="96" y="166" class="section-title">1. IO 模型定位</text><rect width="250" height="82" x="110" y="215" stroke-width="2" class="yellow" rx="12"/><text x="137" y="247" class="box-title">BIO</text><text x="137" y="272" class="text">同步阻塞，一连接一线程常见</text><rect width="250" height="82" x="400" y="215" stroke-width="2" class="blue" rx="12"/><text x="427" y="247" class="box-title">NIO</text><text x="427" y="272" class="text">同步非阻塞 + Selector 多路复用</text><rect width="250" height="82" x="690" y="215" stroke-width="2" class="violet" rx="12"/><text x="717" y="247" class="box-title">AIO</text><text x="717" y="272" class="text">异步完成通知，使用场景需评估</text><rect width="210" height="82" x="980" y="215" stroke-width="2" class="green" rx="12"/><text x="1007" y="247" class="box-title">Reactor</text><text x="1007" y="272" class="text">事件循环分发就绪事件</text><rect width="1180" height="325" x="70" y="405" class="panel" rx="16"/><text x="96" y="441" class="section-title">2. Netty 主从 Reactor 与 Pipeline</text><rect width="170" height="82" x="105" y="500" stroke-width="2" class="blue" rx="12"/><text x="132" y="532" class="box-title">Client</text><text x="132" y="557" class="text">连接 / 发字节流</text><rect width="210" height="82" x="325" y="500" stroke-width="2" class="green" rx="12"/><text x="352" y="532" class="box-title">Boss EventLoop</text><text x="352" y="557" class="mono">accept</text><rect width="220" height="82" x="585" y="500" stroke-width="2" class="green" rx="12"/><text x="612" y="532" class="box-title">Worker EventLoop</text><text x="612" y="557" class="text">Selector 等待读写就绪</text><rect width="295" height="82" x="855" y="500" stroke-width="2" class="yellow" rx="12"/><text x="882" y="532" class="box-title">ChannelPipeline</text><text x="882" y="557" class="text">入站 head→tail，出站 tail→head</text><path d="M275 541 H316" class="arrow-blue"/><path d="M535 541 H576" class="arrow-blue"/><path d="M805 541 H846" class="arrow-blue"/><rect width="235" height="58" x="140" y="625" stroke-width="2" class="cyan" rx="12"/><text x="167" y="660" class="box-title">Channel 绑定一个 EventLoop</text><rect width="260" height="58" x="450" y="625" stroke-width="2" class="red" rx="12"/><text x="477" y="660" class="box-title">EventLoop 不能跑慢 SQL/RPC/文件 IO</text><rect width="320" height="58" x="785" y="625" stroke-width="2" class="blue" rx="12"/><text x="812" y="660" class="box-title">慢任务交给业务线程池或独立 Executor</text><path d="M710 654 H776" class="dash"/><rect width="575" height="300" x="70" y="770" class="panel" rx="16"/><text x="96" y="806" class="section-title">3. 字节流到消息：ByteBuf 与 FrameDecoder</text><rect width="230" height="82" x="105" y="855" stroke-width="2" class="blue" rx="12"/><text x="132" y="887" class="box-title">ByteBuf</text><text x="132" y="912" class="text">reader/writer index 分离</text><text x="132" y="930" class="text">池化、切片、组合减少拷贝</text><rect width="230" height="82" x="375" y="855" stroke-width="2" class="yellow" rx="12"/><text x="402" y="887" class="box-title">FrameDecoder</text><text x="402" y="912" class="text">长度字段/分隔符/定长</text><text x="402" y="930" class="text">解决粘包和半包</text><rect width="230" height="64" x="105" y="970" stroke-width="2" class="red" rx="12"/><text x="132" y="1000" class="box-title">引用计数</text><text x="132" y="1022" class="text">retain/release 错误会泄漏</text><rect width="230" height="64" x="375" y="970" stroke-width="2" class="green" rx="12"/><text x="402" y="1000" class="box-title">协议处理</text><text x="402" y="1022" class="text">完整消息再交给业务 Handler</text><rect width="575" height="300" x="675" y="770" class="panel" rx="16"/><text x="701" y="806" class="section-title">4. 线上排查与压测指标</text><rect width="230" height="82" x="710" y="855" stroke-width="2" class="red" rx="12"/><text x="737" y="887" class="box-title">EventLoop lag</text><text x="737" y="912" class="text">慢任务、GC、锁竞争</text><text x="737" y="930" class="text">会拖慢多个 Channel</text><rect width="230" height="82" x="980" y="855" stroke-width="2" class="yellow" rx="12"/><text x="1007" y="887" class="box-title">写缓冲水位</text><text x="1007" y="912" class="text">高/低水位与可写状态</text><text x="1007" y="930" class="mono">channelWritabilityChanged</text><rect width="230" height="64" x="710" y="970" stroke-width="2" class="blue" rx="12"/><text x="737" y="1000" class="box-title">连接与 backlog</text><text x="737" y="1022" class="text">accept 队列、连接暴涨、FD 限制</text><rect width="230" height="64" x="980" y="970" stroke-width="2" class="green" rx="12"/><text x="1007" y="1000" class="box-title">Leak Detector</text><text x="1007" y="1022" class="text">定位 ByteBuf 未释放路径</text><rect width="1180" height="115" x="70" y="1110" class="panel" rx="16"/><text x="96" y="1146" class="section-title">5. 面试表达顺序</text><text x="120" y="1184" class="text">先讲 BIO/NIO/AIO 的阻塞语义，再讲 NIO 三件套；然后把 Reactor 映射到 Netty 的 Boss/Worker、Pipeline、ByteBuf 和 FrameDecoder。</text><text x="120" y="1210" class="text">最后补工程边界：EventLoop 不阻塞、协议必须拆包、ByteBuf 要释放、写水位做背压、线上看 EventLoop lag 和泄漏日志。</text><text x="96" y="1348" class="small">答题抓手：NIO 不是异步 IO；Selector 只通知就绪，读写仍由应用线程执行；Netty 是 NIO/Reactor 的工程化封装。</text></svg>