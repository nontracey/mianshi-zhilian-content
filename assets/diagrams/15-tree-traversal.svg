<svg viewBox="0 0 680 290" width="100%" role="img" aria-label="二叉树遍历示意图">
<title>二叉树遍历示意图</title><desc>前序、中序、后序、层序四种遍历方式</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">二叉树遍历</text>
