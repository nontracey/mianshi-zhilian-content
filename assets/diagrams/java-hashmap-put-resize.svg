<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">Java HashMap put, treeify, resize, and key contract</title>
  <desc id="desc">A topic-specific diagram showing HashMap spread hash, bucket index calculation, collision handling, treeification conditions, resize split by old capacity bit, key equals/hashCode contract, and thread-safety boundaries.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 33px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .chip { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-red { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .arrow-green { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="70" y="64">HashMap：从 hash 到桶，再到树化与扩容</text>
  <text class="subtitle" x="70" y="96">JDK 8+ 的核心不是背源码，而是说清定位、冲突、阈值、resize 拆桶、key 契约和线程安全边界。</text>

  <rect class="section" x="70" y="130" width="1180" height="265" rx="16"/>
  <text class="section-title" x="96" y="166">1. 定位桶：高位扰动 + 2 的幂容量</text>

  <rect class="blue" x="105" y="205" width="210" height="84" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="237">key.hashCode()</text>
  <text class="mono" x="132" y="262">int h</text>
  <text class="text" x="132" y="281">可能只在高位有差异</text>

  <rect class="green" x="370" y="205" width="240" height="84" rx="12" stroke-width="2"/>
  <text class="box-title" x="397" y="237">spread</text>
  <text class="mono" x="397" y="262">h ^ (h &gt;&gt;&gt; 16)</text>
  <text class="text" x="397" y="281">让高位参与低位桶定位</text>

  <rect class="yellow" x="665" y="205" width="220" height="84" rx="12" stroke-width="2"/>
  <text class="box-title" x="692" y="237">index</text>
  <text class="mono" x="692" y="262">(n - 1) &amp; hash</text>
  <text class="text" x="692" y="281">n 保持 2 的幂</text>

  <rect class="cyan" x="940" y="205" width="235" height="84" rx="12" stroke-width="2"/>
  <text class="box-title" x="967" y="237">Node[] table</text>
  <text class="text" x="967" y="262">桶里放链表头或 TreeNode 根</text>
  <text class="mono" x="967" y="281">null key hash = 0</text>

  <path class="arrow-blue" d="M315 247 H361"/>
  <path class="arrow-blue" d="M610 247 H656"/>
  <path class="arrow-blue" d="M885 247 H931"/>
  <text class="small" x="105" y="345">容量为 2 的幂让位运算等价于取模；扩容时新增的 oldCap 那一位，决定节点留在原桶还是移动到原桶 + oldCap。</text>

  <rect class="section" x="70" y="435" width="580" height="470" rx="16"/>
  <text class="section-title" x="96" y="471">2. put 冲突处理：覆盖、链表、红黑树</text>

  <rect class="blue" x="105" y="515" width="170" height="76" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="547">桶为空</text>
  <text class="mono" x="132" y="572">newNode</text>

  <rect class="green" x="335" y="515" width="255" height="76" rx="12" stroke-width="2"/>
  <text class="box-title" x="362" y="547">hash 相等且 equals</text>
  <text class="text" x="362" y="572">覆盖旧 value，返回 oldValue</text>

  <rect class="yellow" x="105" y="640" width="210" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="672">链表桶</text>
  <text class="text" x="132" y="697">JDK 8 尾插，保留顺序</text>
  <text class="mono" x="132" y="717">binCount</text>

  <rect class="violet" x="380" y="640" width="210" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="407" y="672">树桶</text>
  <text class="text" x="407" y="697">TreeNode 插入/覆盖</text>
  <text class="mono" x="407" y="717">O(log n)</text>

  <rect class="red" x="105" y="775" width="485" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="807">树化门槛要说完整</text>
  <text class="text" x="132" y="832">链表长度达到 8 且 table 长度至少 64 才树化；否则优先 resize。</text>
  <text class="text" x="132" y="852">resize/split 后树节点数小于等于 6，可退化为链表。</text>

  <path class="arrow-blue" d="M210 591 V631"/>
  <path class="arrow-green" d="M462 591 V631"/>
  <path class="arrow-red" d="M210 726 C210 755 210 758 210 775"/>
  <path class="arrow-green" d="M315 682 H371"/>

  <rect class="section" x="690" y="435" width="560" height="470" rx="16"/>
  <text class="section-title" x="716" y="471">3. resize：不重新算 hash，只按 oldCap bit 拆桶</text>

  <rect class="blue" x="725" y="520" width="205" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="752" y="552">oldCap = 16</text>
  <text class="mono" x="752" y="577">index = hash &amp; 15</text>

  <rect class="green" x="1000" y="520" width="205" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1027" y="552">newCap = 32</text>
  <text class="mono" x="1027" y="577">index = hash &amp; 31</text>

  <rect class="yellow" x="725" y="665" width="205" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="752" y="697">(hash &amp; oldCap) == 0</text>
  <text class="text" x="752" y="722">留在原桶 j</text>

  <rect class="violet" x="1000" y="665" width="205" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1027" y="697">(hash &amp; oldCap) != 0</text>
  <text class="text" x="1027" y="722">移动到 j + oldCap</text>

  <rect class="red" x="725" y="800" width="480" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="752" y="830">触发条件</text>
  <text class="text" x="752" y="854">size 超过 threshold = capacity * loadFactor；默认 16 和 0.75，只是常见默认值。</text>

  <path class="arrow-blue" d="M930 561 H991"/>
  <path class="arrow-green" d="M827 602 V656"/>
  <path class="arrow-green" d="M1102 602 V656"/>
  <text class="small" x="725" y="626">扩容为两倍，所以新掩码只比旧掩码多出 oldCap 那一位。</text>

  <rect class="section" x="70" y="945" width="1180" height="245" rx="16"/>
  <text class="section-title" x="96" y="981">4. key 契约与并发边界</text>

  <rect class="green" x="105" y="1025" width="260" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="1057">equals / hashCode</text>
  <text class="text" x="132" y="1082">equals 为 true 必须 hashCode 相等</text>
  <text class="text" x="132" y="1102">hash 相等不要求 equals 为 true</text>

  <rect class="yellow" x="405" y="1025" width="250" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="432" y="1057">不可变 key</text>
  <text class="text" x="432" y="1082">插入后改变参与 hash/equals 的字段</text>
  <text class="text" x="432" y="1102">会让同一个对象也找不回</text>

  <rect class="red" x="695" y="1025" width="250" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="722" y="1057">非线程安全</text>
  <text class="text" x="722" y="1082">并发 put 会丢更新或结构异常</text>
  <text class="text" x="722" y="1102">不能靠 JDK 8 尾插当并发容器</text>

  <rect class="blue" x="985" y="1025" width="210" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="1012" y="1057">并发替代</text>
  <text class="text" x="1012" y="1082">ConcurrentHashMap</text>
  <text class="text" x="1012" y="1102">或外部同步/不可变快照</text>

  <text class="small" x="105" y="1160">面试抓手：先讲 put 主线，再补 resize 位拆分；最后主动提醒树化门槛、null key/value、key 可变性和并发边界。</text>
</svg>
