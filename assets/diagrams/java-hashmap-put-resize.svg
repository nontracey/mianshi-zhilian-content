<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">Java HashMap put, treeify, resize, and key contract</title><desc id="desc">A topic-specific diagram showing HashMap spread hash, bucket index calculation, collision handling, treeification conditions, resize split by old capacity bit, key equals/hashCode contract, and thread-safety boundaries.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 33px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.section{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.arrow-blue{stroke:#2563eb;marker-end:url(#arrow-blue)}.arrow-blue,.arrow-green,.arrow-red{stroke-width:3;fill:none}.arrow-red{stroke:#dc2626;marker-end:url(#arrow-red)}.arrow-green{stroke:#16a34a;marker-end:url(#arrow-green)}</style></defs><rect width="1320" height="1320" class="bg"/><text x="70" y="64" class="title">HashMap：从 hash 到桶，再到树化与扩容</text><text x="70" y="96" class="subtitle">JDK 8+ 的核心不是背源码，而是说清定位、冲突、阈值、resize 拆桶、key 契约和线程安全边界。</text><rect width="1180" height="265" x="70" y="130" class="section" rx="16"/><text x="96" y="166" class="section-title">1. 定位桶：高位扰动 + 2 的幂容量</text><rect width="210" height="84" x="105" y="205" stroke-width="2" class="blue" rx="12"/><text x="132" y="237" class="box-title">key.hashCode()</text><text x="132" y="262" class="mono">int h</text><text x="132" y="281" class="text">可能只在高位有差异</text><rect width="240" height="84" x="370" y="205" stroke-width="2" class="green" rx="12"/><text x="397" y="237" class="box-title">spread</text><text x="397" y="262" class="mono">h ^ (h &gt;&gt;&gt; 16)</text><text x="397" y="281" class="text">让高位参与低位桶定位</text><rect width="220" height="84" x="665" y="205" stroke-width="2" class="yellow" rx="12"/><text x="692" y="237" class="box-title">index</text><text x="692" y="262" class="mono">(n - 1) &amp; hash</text><text x="692" y="281" class="text">n 保持 2 的幂</text><rect width="235" height="84" x="940" y="205" stroke-width="2" class="cyan" rx="12"/><text x="967" y="237" class="box-title">Node[] table</text><text x="967" y="262" class="text">桶里放链表头或 TreeNode 根</text><text x="967" y="281" class="mono">null key hash = 0</text><path d="M315 247 H361" class="arrow-blue"/><path d="M610 247 H656" class="arrow-blue"/><path d="M885 247 H931" class="arrow-blue"/><text x="105" y="345" class="small">容量为 2 的幂让位运算等价于取模；扩容时新增的 oldCap 那一位，决定节点留在原桶还是移动到原桶 + oldCap。</text><rect width="580" height="470" x="70" y="435" class="section" rx="16"/><text x="96" y="471" class="section-title">2. put 冲突处理：覆盖、链表、红黑树</text><rect width="170" height="76" x="105" y="515" stroke-width="2" class="blue" rx="12"/><text x="132" y="547" class="box-title">桶为空</text><text x="132" y="572" class="mono">newNode</text><rect width="255" height="76" x="335" y="515" stroke-width="2" class="green" rx="12"/><text x="362" y="547" class="box-title">hash 相等且 equals</text><text x="362" y="572" class="text">覆盖旧 value，返回 oldValue</text><rect width="210" height="86" x="105" y="640" stroke-width="2" class="yellow" rx="12"/><text x="132" y="672" class="box-title">链表桶</text><text x="132" y="697" class="text">JDK 8 尾插，保留顺序</text><text x="132" y="717" class="mono">binCount</text><rect width="210" height="86" x="380" y="640" stroke-width="2" class="violet" rx="12"/><text x="407" y="672" class="box-title">树桶</text><text x="407" y="697" class="text">TreeNode 插入/覆盖</text><text x="407" y="717" class="mono">O(log n)</text><rect width="485" height="82" x="105" y="775" stroke-width="2" class="red" rx="12"/><text x="132" y="807" class="box-title">树化门槛要说完整</text><text x="132" y="832" class="text">链表长度达到 8 且 table 长度至少 64 才树化；否则优先 resize。</text><text x="132" y="852" class="text">resize/split 后树节点数小于等于 6，可退化为链表。</text><path d="M210 591 V631" class="arrow-blue"/><path d="M462 591 V631" class="arrow-green"/><path d="M210 726 C210 755 210 758 210 775" class="arrow-red"/><path d="M315 682 H371" class="arrow-green"/><rect width="560" height="470" x="690" y="435" class="section" rx="16"/><text x="716" y="471" class="section-title">3. resize：不重新算 hash，只按 oldCap bit 拆桶</text><rect width="205" height="82" x="725" y="520" stroke-width="2" class="blue" rx="12"/><text x="752" y="552" class="box-title">oldCap = 16</text><text x="752" y="577" class="mono">index = hash &amp; 15</text><rect width="205" height="82" x="1000" y="520" stroke-width="2" class="green" rx="12"/><text x="1027" y="552" class="box-title">newCap = 32</text><text x="1027" y="577" class="mono">index = hash &amp; 31</text><rect width="205" height="82" x="725" y="665" stroke-width="2" class="yellow" rx="12"/><text x="752" y="697" class="box-title">(hash &amp; oldCap) == 0</text><text x="752" y="722" class="text">留在原桶 j</text><rect width="205" height="82" x="1000" y="665" stroke-width="2" class="violet" rx="12"/><text x="1027" y="697" class="box-title">(hash &amp; oldCap) != 0</text><text x="1027" y="722" class="text">移动到 j + oldCap</text><rect width="480" height="70" x="725" y="800" stroke-width="2" class="red" rx="12"/><text x="752" y="830" class="box-title">触发条件</text><text x="752" y="854" class="text">size 超过 threshold = capacity * loadFactor；默认 16 和 0.75，只是常见默认值。</text><path d="M930 561 H991" class="arrow-blue"/><path d="M827 602 V656" class="arrow-green"/><path d="M1102 602 V656" class="arrow-green"/><text x="725" y="626" class="small">扩容为两倍，所以新掩码只比旧掩码多出 oldCap 那一位。</text><rect width="1180" height="245" x="70" y="945" class="section" rx="16"/><text x="96" y="981" class="section-title">4. key 契约与并发边界</text><rect width="260" height="88" x="105" y="1025" stroke-width="2" class="green" rx="12"/><text x="132" y="1057" class="box-title">equals / hashCode</text><text x="132" y="1082" class="text">equals 为 true 必须 hashCode 相等</text><text x="132" y="1102" class="text">hash 相等不要求 equals 为 true</text><rect width="250" height="88" x="405" y="1025" stroke-width="2" class="yellow" rx="12"/><text x="432" y="1057" class="box-title">不可变 key</text><text x="432" y="1082" class="text">插入后改变参与 hash/equals 的字段</text><text x="432" y="1102" class="text">会让同一个对象也找不回</text><rect width="250" height="88" x="695" y="1025" stroke-width="2" class="red" rx="12"/><text x="722" y="1057" class="box-title">非线程安全</text><text x="722" y="1082" class="text">并发 put 会丢更新或结构异常</text><text x="722" y="1102" class="text">不能靠 JDK 8 尾插当并发容器</text><rect width="210" height="88" x="985" y="1025" stroke-width="2" class="blue" rx="12"/><text x="1012" y="1057" class="box-title">并发替代</text><text x="1012" y="1082" class="text">ConcurrentHashMap</text><text x="1012" y="1102" class="text">或外部同步/不可变快照</text><text x="105" y="1160" class="small">面试抓手：先讲 put 主线，再补 resize 位拆分；最后主动提醒树化门槛、null key/value、key 可变性和并发边界。</text></svg>