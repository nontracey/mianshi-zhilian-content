<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">ZGC 低停顿路径与选型验证</title>
  <desc id="desc">展示分代 ZGC 的并发标记、并发转移、着色指针、读屏障、短 STW 阶段、版本时间线和选型验证指标。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5f99"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b24634"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #14213d; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .label { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 14px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .code { font: 600 13px Menlo, Consolas, monospace; fill: #263238; }
      .blue { fill: #e8f4ff; stroke: #6aa9df; stroke-width: 2; rx: 12; }
      .green { fill: #e9f7ef; stroke: #58b77d; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff5d6; stroke: #e0ae35; stroke-width: 2; rx: 12; }
      .red { fill: #fdecea; stroke: #cf5d4b; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #a7b5c4; stroke-width: 2; rx: 12; }
      .line { stroke: #1f5f99; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line-red { stroke: #b24634; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #7b8794; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">ZGC/Shenandoah：并发转移如何压缩停顿</text>
  <text x="50" y="86" class="subtitle">低停顿来自屏障、并发线程和额外余量的交换；选型要和业务尾延迟、CPU、RSS 一起验证。</text>

  <rect x="40" y="120" width="1200" height="330" class="panel"/>
  <text x="68" y="156" class="panel-title">1. ZGC 回收路径：把大部分工作移出 STW</text>
  <rect x="76" y="196" width="160" height="86" class="blue"/>
  <text x="116" y="226" class="label">应用分配</text>
  <text x="103" y="252" class="small">对象进入分代堆</text>
  <rect x="276" y="176" width="190" height="126" class="green"/>
  <text x="326" y="210" class="label">分代堆</text>
  <text x="318" y="238" class="small">Young：短命对象</text>
  <text x="318" y="262" class="small">Old：长寿对象</text>
  <rect x="506" y="196" width="156" height="86" class="yellow"/>
  <text x="548" y="226" class="label">并发标记</text>
  <text x="530" y="252" class="small">找出存活对象</text>
  <rect x="702" y="196" width="156" height="86" class="yellow"/>
  <text x="744" y="226" class="label">并发转移</text>
  <text x="724" y="252" class="small">搬迁到新地址</text>
  <rect x="898" y="176" width="156" height="126" class="blue"/>
  <text x="936" y="210" class="label">着色指针</text>
  <text x="922" y="238" class="small">引用携带标记</text>
  <text x="922" y="262" class="small">与重映射状态</text>
  <rect x="1094" y="196" width="110" height="86" class="red"/>
  <text x="1118" y="226" class="label">读屏障</text>
  <text x="1114" y="252" class="small">修正旧地址</text>
  <line x1="236" y1="239" x2="276" y2="239" class="line"/>
  <line x1="466" y1="239" x2="506" y2="239" class="line"/>
  <line x1="662" y1="239" x2="702" y2="239" class="line"/>
  <line x1="858" y1="239" x2="898" y2="239" class="line"/>
  <line x1="1054" y1="239" x2="1094" y2="239" class="line-red"/>
  <rect x="358" y="340" width="460" height="66" class="gray"/>
  <text x="386" y="368" class="small">短 STW：根处理、同步点、少量阶段协调；不是零停顿</text>
  <text x="386" y="392" class="small">主要收益：pause 不再随堆大小线性增长，尾延迟更可控</text>
  <path d="M 584 282 C 584 314, 584 326, 584 340" class="dash"/>
  <path d="M 780 282 C 760 318, 722 334, 690 340" class="dash"/>

  <rect x="40" y="490" width="560" height="300" class="panel"/>
  <text x="68" y="526" class="panel-title">2. 版本口径：按分代 ZGC 讲</text>
  <rect x="78" y="568" width="112" height="78" class="gray"/>
  <text x="108" y="598" class="label">JDK 15</text>
  <text x="100" y="622" class="tiny">ZGC product</text>
  <rect x="218" y="568" width="112" height="78" class="blue"/>
  <text x="248" y="598" class="label">JDK 21</text>
  <text x="236" y="622" class="tiny">引入分代</text>
  <rect x="358" y="568" width="112" height="78" class="green"/>
  <text x="388" y="598" class="label">JDK 23</text>
  <text x="374" y="622" class="tiny">默认分代</text>
  <rect x="498" y="568" width="74" height="78" class="red"/>
  <text x="512" y="598" class="label">JDK 24</text>
  <text x="506" y="622" class="tiny">移除旧模式</text>
  <line x1="190" y1="607" x2="218" y2="607" class="line"/>
  <line x1="330" y1="607" x2="358" y2="607" class="line"/>
  <line x1="470" y1="607" x2="498" y2="607" class="line-red"/>
  <rect x="78" y="692" width="494" height="56" class="gray"/>
  <text x="104" y="724" class="small">新配置：使用 `-XX:+UseZGC`，不要依赖旧 `ZGenerational` 开关</text>

  <rect x="640" y="490" width="600" height="300" class="panel"/>
  <text x="668" y="526" class="panel-title">3. 选型基线：先问瓶颈在哪里</text>
  <rect x="672" y="568" width="124" height="78" class="green"/>
  <text x="722" y="598" class="label">G1</text>
  <text x="692" y="622" class="tiny">多数服务基线</text>
  <rect x="830" y="568" width="124" height="78" class="blue"/>
  <text x="872" y="598" class="label">ZGC</text>
  <text x="850" y="622" class="tiny">尾延迟/大堆</text>
  <rect x="988" y="568" width="124" height="78" class="blue"/>
  <text x="1000" y="598" class="label">Shenandoah</text>
  <text x="1010" y="622" class="tiny">低停顿需求</text>
  <rect x="830" y="682" width="124" height="58" class="yellow"/>
  <text x="856" y="706" class="label">Parallel</text>
  <text x="858" y="726" class="tiny">吞吐/批处理</text>
  <path d="M 796 607 C 812 607, 816 607, 830 607" class="line"/>
  <path d="M 954 607 C 970 607, 974 607, 988 607" class="line"/>
  <path d="M 892 646 C 892 662, 892 666, 892 682" class="line"/>
  <text x="678" y="766" class="small">如果 G1 pause 已满足 SLO，迁移低停顿 GC 未必能带来业务收益。</text>

  <rect x="40" y="830" width="1200" height="360" class="panel"/>
  <text x="68" y="866" class="panel-title">4. 上线验证：低停顿收益要和资源成本一起看</text>
  <rect x="78" y="910" width="170" height="78" class="blue"/>
  <text x="118" y="940" class="label">GC pause</text>
  <text x="104" y="964" class="small">p95 / p99 / max</text>
  <rect x="286" y="910" width="170" height="78" class="green"/>
  <text x="330" y="940" class="label">业务尾延迟</text>
  <text x="326" y="964" class="small">p99 / p999</text>
  <rect x="494" y="910" width="170" height="78" class="yellow"/>
  <text x="548" y="940" class="label">CPU</text>
  <text x="514" y="964" class="small">并发 GC 与业务线程</text>
  <rect x="702" y="910" width="170" height="78" class="red"/>
  <text x="752" y="940" class="label">RSS</text>
  <text x="726" y="964" class="small">容器 limit / 余量</text>
  <rect x="910" y="910" width="170" height="78" class="gray"/>
  <text x="952" y="940" class="label">Stall</text>
  <text x="934" y="964" class="small">分配速率与回收能力</text>
  <line x1="248" y1="949" x2="286" y2="949" class="line"/>
  <line x1="456" y1="949" x2="494" y2="949" class="line"/>
  <line x1="664" y1="949" x2="702" y2="949" class="line"/>
  <line x1="872" y1="949" x2="910" y2="949" class="line-red"/>
  <rect x="78" y="1038" width="484" height="90" class="green"/>
  <text x="110" y="1070" class="label">继续推进</text>
  <text x="108" y="1096" class="small">pause 和业务尾延迟改善，CPU/RSS 成本可接受</text>
  <rect x="618" y="1038" width="484" height="90" class="red"/>
  <text x="650" y="1070" class="label">回退或重新调优</text>
  <text x="648" y="1096" class="small">CPU/RSS 触顶、Stall 增多，或业务指标没有改善</text>
  <text x="78" y="1164" class="small">回答抓手：先拿 G1 作基线，再用压测和灰度证明 ZGC/Shenandoah 是否解决主要矛盾。</text>
</svg>
