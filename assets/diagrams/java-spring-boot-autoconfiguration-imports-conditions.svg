<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1280"><title id="title">Spring Boot 自动配置导入、条件过滤和用户配置覆盖</title><desc id="desc">展示 Spring Boot 自动配置从 @SpringBootApplication、@EnableAutoConfiguration、AutoConfigurationImportSelector、AutoConfiguration.imports，到 exclude、条件注解、BeanDefinition、用户配置覆盖和条件报告的链路。</desc><defs><marker id="arrow-blue" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#b45309" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 30px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#172033}.subtitle{font:400 15px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.panel{fill:#fff;stroke:#d9e2ec;stroke-width:2;rx:16}.box-title{fill:#1f2933}.panel-title{font:700 20px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#1f2933}.box-title{font:700 16px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.small{font:400 13px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#334e68}.tiny{font:400 12px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.blue{fill:#e8f2ff;stroke:#60a5fa;stroke-width:2;rx:12}.green{fill:#e8f8ef;stroke:#4ade80}.gray,.green,.orange,.red,.yellow{stroke-width:2;rx:12}.yellow{fill:#fff7d6;stroke:#facc15}.orange{fill:#fff1e6;stroke:#fb923c}.red{fill:#feecec;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#94a3b8}.line,.line-red{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.line-red{stroke:#b45309;marker-end:url(#arrow-red)}</style></defs><rect width="1280" height="1280" class="bg"/><text x="48" y="56" class="title">Spring Boot 自动配置：候选类导入后，还要经过条件裁剪</text><text x="50" y="86" class="subtitle">这里讨论 auto-configuration，不是 IoC 依赖注入的 by-type 自动注入。</text><rect width="1200" height="260" x="40" y="120" class="panel"/><text x="68" y="156" class="panel-title">1. 入口和候选类定位</text><rect width="210" height="66" x="78" y="220" class="blue"/><text x="118" y="242" class="box-title">SpringBootApp</text><text x="104" y="263" class="tiny">@SpringBootApplication</text><text x="112" y="280" class="tiny">@EnableAutoConfiguration</text><rect width="230" height="66" x="348" y="220" class="yellow"/><text x="404" y="242" class="box-title">ImportSelector</text><text x="382" y="263" class="tiny">AutoConfigurationImportSelector</text><text x="404" y="280" class="tiny">收集候选、去重、排除</text><rect width="270" height="66" x="638" y="220" class="green"/><text x="668" y="246" class="box-title">AutoConfiguration.imports</text><text x="670" y="268" class="tiny">META-INF/spring/ 一行一个类</text><rect width="180" height="66" x="968" y="220" class="orange"/><text x="1008" y="246" class="box-title">replacements</text><text x="990" y="268" class="tiny">类迁移时处理 before/after/exclude</text><line x1="288" x2="348" y1="253" y2="253" class="line"/><line x1="578" x2="638" y1="253" y2="253" class="line"/><line x1="908" x2="968" y1="253" y2="253" class="line"/><text x="78" y="340" class="small">Boot 4.x/3.x 自定义自动配置应写入 imports 文件；自动配置类不要被组件扫描发现，也不应自己开启大范围组件扫描。</text><rect width="1200" height="390" x="40" y="420" class="panel"/><text x="68" y="456" class="panel-title">2. 条件过滤：自动配置不是无条件生效</text><rect width="190" height="62" x="82" y="520" class="green"/><text x="116" y="545" class="box-title">OnClass</text><text x="106" y="566" class="tiny">依赖类存在</text><rect width="190" height="62" x="322" y="520" class="yellow"/><text x="350" y="545" class="box-title">OnMissingBean</text><text x="346" y="566" class="tiny">用户未声明同类 Bean</text><rect width="190" height="62" x="562" y="520" class="orange"/><text x="604" y="545" class="box-title">OnProperty</text><text x="588" y="566" class="tiny">配置开关匹配</text><rect width="190" height="62" x="802" y="520" class="blue"/><text x="834" y="545" class="box-title">Web / Resource</text><text x="828" y="566" class="tiny">运行环境匹配</text><rect width="145" height="62" x="1038" y="520" class="red"/><text x="1074" y="545" class="box-title">exclude</text><text x="1060" y="566" class="tiny">显式排除</text><line x1="272" x2="322" y1="551" y2="551" class="line"/><line x1="512" x2="562" y1="551" y2="551" class="line"/><line x1="752" x2="802" y1="551" y2="551" class="line"/><line x1="992" x2="1038" y1="551" y2="551" class="line-red"/><rect width="230" height="62" x="180" y="675" class="green"/><text x="224" y="700" class="box-title">BeanDefinition</text><text x="206" y="721" class="tiny">条件通过才进入容器定义</text><rect width="230" height="62" x="520" y="675" class="yellow"/><text x="564" y="700" class="box-title">User Bean wins</text><text x="546" y="721" class="tiny">OnMissingBean 给用户配置让位</text><rect width="230" height="62" x="860" y="675" class="gray"/><text x="898" y="700" class="box-title">Conditions report</text><text x="886" y="721" class="tiny">debug 或 Actuator 排查</text><path d="M1110,582 C1110,642 296,630 296,675" class="line"/><line x1="410" x2="520" y1="706" y2="706" class="line"/><line x1="750" x2="860" y1="706" y2="706" class="line"/><text x="78" y="775" class="small">OnBean / OnMissingBean 基于已处理的 BeanDefinition 判断，官方建议主要用于自动配置类，因为自动配置会在用户配置之后处理。</text><rect width="585" height="275" x="40" y="850" class="panel"/><text x="68" y="886" class="panel-title">3. 自定义 starter 应怎么拆</text><rect width="220" height="64" x="82" y="945" class="blue"/><text x="112" y="971" class="box-title">xxx-spring-boot</text><text x="104" y="993" class="tiny">auto-config + properties + API</text><rect width="220" height="64" x="360" y="945" class="green"/><text x="388" y="971" class="box-title">xxx-spring-boot-starter</text><text x="388" y="993" class="tiny">依赖聚合和 opinion</text><rect width="220" height="64" x="82" y="1040" class="yellow"/><text x="126" y="1066" class="box-title">metadata</text><text x="104" y="1088" class="tiny">配置提示和 IDE 体验</text><rect width="220" height="64" x="360" y="1040" class="orange"/><text x="404" y="1066" class="box-title">ApplicationContextRunner</text><text x="386" y="1088" class="tiny">测试 classpath/property/bean 条件</text><rect width="585" height="275" x="655" y="850" class="panel"/><text x="683" y="886" class="panel-title">4. 常见误区和排查</text><text x="692" y="936" class="small">把自动配置类放进组件扫描，会绕过 imports 管理，顺序和条件更难控。</text><text x="692" y="974" class="small">只用旧 spring.factories 的 EnableAutoConfiguration key，在 Boot 3/4 下会失效。</text><text x="692" y="1012" class="small">把 @AutoConfigureAfter 当成 Bean 创建顺序，是常见误解；它只影响定义顺序。</text><text x="692" y="1050" class="small">先看 imports、exclude、条件报告、用户 Bean 覆盖，再看 classpath 和属性绑定。</text><text x="692" y="1088" class="small">测试要覆盖“依赖存在/缺失、用户 Bean 存在/缺失、属性开关”三组输入。</text><rect width="1200" height="64" x="40" y="1170" class="panel"/><text x="68" y="1207" class="panel-title">回答抓手</text><text x="190" y="1207" class="small">Boot 4.x/3.x -&gt; EnableAutoConfiguration -&gt; ImportSelector -&gt; imports/replacements -&gt; exclude -&gt; Conditional -&gt; BeanDefinition -&gt; 用户 Bean 覆盖 -&gt; conditions 报告。</text></svg>