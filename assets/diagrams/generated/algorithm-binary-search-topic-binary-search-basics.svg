<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" aria-labelledby="title desc" role="img" viewBox="0 0 980 520"><title id="title">二分查找区间收缩过程</title><desc id="desc">在有序数组中查找 31，展示 left、mid、right 三轮如何收缩。</desc><rect width="980" height="520" fill="#f8fafc" rx="18"/><text x="40" y="48" fill="#0f172a" font-size="24" font-weight="700">二分查找：找 target=31</text><text x="40" y="78" fill="#475569" font-size="14">不变量：答案如果存在，一定在闭区间 [left, right] 内；比较 nums[mid] 后丢弃不可能的一半。</text><g font-family="system-ui, sans-serif" text-anchor="middle"><g><text x="0" y="28" fill="#0f172a" font-size="16" font-weight="700" text-anchor="start" transform="translate(54 118)">Round 1: [0,8], mid=4, nums[mid]=31 命中</text><g transform="translate(54 118) translate(0 50)"><rect width="78" height="52" x="0" y="0" fill="#fff" stroke="#cbd5e1"/><text x="39" y="31" font-size="18">3</text><rect width="78" height="52" x="78" y="0" fill="#fff" stroke="#cbd5e1"/><text x="117" y="31" font-size="18">8</text><rect width="78" height="52" x="156" y="0" fill="#fff" stroke="#cbd5e1"/><text x="195" y="31" font-size="18">12</text><rect width="78" height="52" x="234" y="0" fill="#fff" stroke="#cbd5e1"/><text x="273" y="31" font-size="18">24</text><rect width="78" height="52" x="312" y="0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="351" y="31" font-size="18" font-weight="700">31</text><rect width="78" height="52" x="390" y="0" fill="#fff" stroke="#cbd5e1"/><text x="429" y="31" font-size="18">45</text><rect width="78" height="52" x="468" y="0" fill="#fff" stroke="#cbd5e1"/><text x="507" y="31" font-size="18">56</text><rect width="78" height="52" x="546" y="0" fill="#fff" stroke="#cbd5e1"/><text x="585" y="31" font-size="18">70</text><rect width="78" height="52" x="624" y="0" fill="#fff" stroke="#cbd5e1"/><text x="663" y="31" font-size="18">91</text><text x="39" y="-10" fill="#2563eb" font-size="13" font-weight="700">left=0</text><text x="351" y="-10" fill="#16a34a" font-size="13" font-weight="700">mid=4</text><text x="663" y="-10" fill="#dc2626" font-size="13" font-weight="700">right=8</text></g></g><g transform="translate(54 260)"><text x="0" y="20" fill="#0f172a" font-size="16" font-weight="700" text-anchor="start">边界模板对照</text><rect width="260" height="110" x="0" y="42" fill="#eff6ff" stroke="#60a5fa" rx="10"/><text x="130" y="72" fill="#1d4ed8" font-size="15" font-weight="700">标准二分</text><text x="130" y="100" fill="#1e3a8a" font-size="13">mid 命中直接返回</text><text x="130" y="124" fill="#1e3a8a" font-size="13">小于 target: left=mid+1</text><text x="130" y="146" fill="#1e3a8a" font-size="13">大于 target: right=mid-1</text><rect width="260" height="110" x="300" y="42" fill="#f0fdf4" stroke="#4ade80" rx="10"/><text x="430" y="72" fill="#15803d" font-size="15" font-weight="700">左边界</text><text x="430" y="100" fill="#166534" font-size="13">nums[mid] &gt;= target</text><text x="430" y="124" fill="#166534" font-size="13">仍向左收缩 right</text><text x="430" y="146" fill="#166534" font-size="13">最终校验 nums[left]</text><rect width="260" height="110" x="600" y="42" fill="#fff7ed" stroke="#fb923c" rx="10"/><text x="730" y="72" fill="#c2410c" font-size="15" font-weight="700">右边界</text><text x="730" y="100" fill="#9a3412" font-size="13">nums[mid] &lt;= target</text><text x="730" y="124" fill="#9a3412" font-size="13">仍向右收缩 left</text><text x="730" y="146" fill="#9a3412" font-size="13">最终校验 nums[right]</text></g></g></svg>