<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">二分查找区间收缩过程</title>
  <desc id="desc">在有序数组中查找 31，展示 left、mid、right 三轮如何收缩。</desc>
  <rect width="980" height="520" rx="18" fill="#f8fafc"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#0f172a">二分查找：找 target=31</text>
  <text x="40" y="78" font-size="14" fill="#475569">不变量：答案如果存在，一定在闭区间 [left, right] 内；比较 nums[mid] 后丢弃不可能的一半。</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(54 118)">
      <text x="0" y="28" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a">Round 1: [0,8], mid=4, nums[mid]=31 命中</text>
      <g transform="translate(0 50)">
        <rect x="0" y="0" width="78" height="52" fill="#fff" stroke="#cbd5e1"/><text x="39" y="31" font-size="18">3</text>
        <rect x="78" y="0" width="78" height="52" fill="#fff" stroke="#cbd5e1"/><text x="117" y="31" font-size="18">8</text>
        <rect x="156" y="0" width="78" height="52" fill="#fff" stroke="#cbd5e1"/><text x="195" y="31" font-size="18">12</text>
        <rect x="234" y="0" width="78" height="52" fill="#fff" stroke="#cbd5e1"/><text x="273" y="31" font-size="18">24</text>
        <rect x="312" y="0" width="78" height="52" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="351" y="31" font-size="18" font-weight="700">31</text>
        <rect x="390" y="0" width="78" height="52" fill="#fff" stroke="#cbd5e1"/><text x="429" y="31" font-size="18">45</text>
        <rect x="468" y="0" width="78" height="52" fill="#fff" stroke="#cbd5e1"/><text x="507" y="31" font-size="18">56</text>
        <rect x="546" y="0" width="78" height="52" fill="#fff" stroke="#cbd5e1"/><text x="585" y="31" font-size="18">70</text>
        <rect x="624" y="0" width="78" height="52" fill="#fff" stroke="#cbd5e1"/><text x="663" y="31" font-size="18">91</text>
        <text x="39" y="-10" font-size="13" fill="#2563eb" font-weight="700">left=0</text>
        <text x="351" y="-10" font-size="13" fill="#16a34a" font-weight="700">mid=4</text>
        <text x="663" y="-10" font-size="13" fill="#dc2626" font-weight="700">right=8</text>
      </g>
    </g>
    <g transform="translate(54 260)">
      <text x="0" y="20" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a">边界模板对照</text>
      <rect x="0" y="42" width="260" height="110" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
      <text x="130" y="72" font-size="15" font-weight="700" fill="#1d4ed8">标准二分</text>
      <text x="130" y="100" font-size="13" fill="#1e3a8a">mid 命中直接返回</text>
      <text x="130" y="124" font-size="13" fill="#1e3a8a">小于 target: left=mid+1</text>
      <text x="130" y="146" font-size="13" fill="#1e3a8a">大于 target: right=mid-1</text>
      <rect x="300" y="42" width="260" height="110" rx="10" fill="#f0fdf4" stroke="#4ade80"/>
      <text x="430" y="72" font-size="15" font-weight="700" fill="#15803d">左边界</text>
      <text x="430" y="100" font-size="13" fill="#166534">nums[mid] &gt;= target</text>
      <text x="430" y="124" font-size="13" fill="#166534">仍向左收缩 right</text>
      <text x="430" y="146" font-size="13" fill="#166534">最终校验 nums[left]</text>
      <rect x="600" y="42" width="260" height="110" rx="10" fill="#fff7ed" stroke="#fb923c"/>
      <text x="730" y="72" font-size="15" font-weight="700" fill="#c2410c">右边界</text>
      <text x="730" y="100" font-size="13" fill="#9a3412">nums[mid] &lt;= target</text>
      <text x="730" y="124" font-size="13" fill="#9a3412">仍向右收缩 left</text>
      <text x="730" y="146" font-size="13" fill="#9a3412">最终校验 nums[right]</text>
    </g>
  </g>
</svg>
