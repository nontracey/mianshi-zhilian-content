<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode 56 合并区间：排序后的线性合并</title>
  <desc id="desc">展示按起点排序后，维护结果末尾区间 last，遇到重叠扩右端，遇到断开追加新区间。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#334155"/></marker>
  </defs>
  <rect width="1120" height="680" rx="16" fill="#f8fafc"/>
  <text x="44" y="56" font-size="28" font-weight="800" fill="#0f172a">合并区间：只和结果末尾 last 比较</text>
  <text x="44" y="88" font-size="15" fill="#475569">排序后 [[1,3],[2,6],[8,10],[15,18]]；last 的右端只会扩张，不会被截短。</text>

  <line x1="90" y1="172" x2="940" y2="172" stroke="#94a3b8" stroke-width="2"/>
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="132" y="194">1</text><text x="216" y="194">3</text><text x="426" y="194">8</text><text x="510" y="194">10</text><text x="720" y="194">15</text><text x="846" y="194">18</text>
  </g>
  <text x="70" y="136" font-size="17" font-weight="800" fill="#0f172a">排序后扫描</text>
  <rect x="132" y="220" width="84" height="28" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="174" y="214" font-size="13" text-anchor="middle" fill="#1e3a8a">[1,3]</text>
  <rect x="174" y="268" width="168" height="28" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="258" y="262" font-size="13" text-anchor="middle" fill="#1e3a8a">[2,6]</text>
  <rect x="426" y="316" width="84" height="28" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="468" y="310" font-size="13" text-anchor="middle" fill="#1e3a8a">[8,10]</text>
  <rect x="720" y="364" width="126" height="28" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="783" y="358" font-size="13" text-anchor="middle" fill="#1e3a8a">[15,18]</text>

  <path d="M216 248 C236 258 252 262 274 268" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="132" y="448" width="210" height="32" rx="6" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <text x="237" y="440" font-size="13" text-anchor="middle" fill="#166534">合并为 [1,6]</text>
  <path d="M258 300 L238 446" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="426" y="448" width="84" height="32" rx="6" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <text x="468" y="440" font-size="13" text-anchor="middle" fill="#166534">[8,10]</text>
  <rect x="720" y="448" width="126" height="32" rx="6" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <text x="783" y="440" font-size="13" text-anchor="middle" fill="#166534">[15,18]</text>
  <path d="M342 464 L424 464" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M510 464 L718 464" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="610" y="132" width="400" height="132" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="632" y="166" font-size="17" font-weight="800" fill="#166534">重叠判断</text>
  <text x="632" y="198" font-size="15" fill="#166534">cur.start=2 &lt;= last.end=3</text>
  <text x="632" y="226" font-size="15" fill="#166534">last.end=max(3,6)=6</text>
  <rect x="610" y="300" width="400" height="132" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="632" y="334" font-size="17" font-weight="800" fill="#9a3412">断开判断</text>
  <text x="632" y="366" font-size="15" fill="#9a3412">cur.start=8 > last.end=6</text>
  <text x="632" y="394" font-size="15" fill="#9a3412">由于后续起点更大，last 不会再被合并。</text>

  <rect x="130" y="548" width="850" height="70" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="154" y="578" font-size="16" font-weight="800" fill="#3730a3">不变量</text>
  <text x="238" y="578" font-size="15" fill="#3730a3">结果列表始终有序且互不重叠；last 是唯一还可能被当前区间扩展的合并段。</text>
</svg>
