<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">LeetCode 56 合并区间：排序后的线性合并</title><desc id="desc">展示按起点排序后，维护结果末尾区间 last，遇到重叠扩右端，遇到断开追加新区间。</desc><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#334155" d="M1,1 L9,5 L1,9 Z"/></marker></defs><rect width="1120" height="680" fill="#f8fafc" rx="16"/><text x="44" y="56" fill="#0f172a" font-size="28" font-weight="800">合并区间：只和结果末尾 last 比较</text><text x="44" y="88" fill="#475569" font-size="15">排序后 [[1,3],[2,6],[8,10],[15,18]]；last 的右端只会扩张，不会被截短。</text><line x1="90" x2="940" y1="172" y2="172" stroke="#94a3b8" stroke-width="2"/><g fill="#64748b" font-size="12" text-anchor="middle"><text x="132" y="194">1</text><text x="216" y="194">3</text><text x="426" y="194">8</text><text x="510" y="194">10</text><text x="720" y="194">15</text><text x="846" y="194">18</text></g><text x="70" y="136" fill="#0f172a" font-size="17" font-weight="800">排序后扫描</text><rect width="84" height="28" x="132" y="220" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" rx="6"/><text x="174" y="214" fill="#1e3a8a" font-size="13" text-anchor="middle">[1,3]</text><rect width="168" height="28" x="174" y="268" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" rx="6"/><text x="258" y="262" fill="#1e3a8a" font-size="13" text-anchor="middle">[2,6]</text><rect width="84" height="28" x="426" y="316" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" rx="6"/><text x="468" y="310" fill="#1e3a8a" font-size="13" text-anchor="middle">[8,10]</text><rect width="126" height="28" x="720" y="364" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" rx="6"/><text x="783" y="358" fill="#1e3a8a" font-size="13" text-anchor="middle">[15,18]</text><path fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)" d="M216 248 C236 258 252 262 274 268"/><rect width="210" height="32" x="132" y="448" fill="#22c55e" stroke="#15803d" stroke-width="2" rx="6"/><text x="237" y="440" fill="#166534" font-size="13" text-anchor="middle">合并为 [1,6]</text><path stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)" d="M258 300 L238 446"/><rect width="84" height="32" x="426" y="448" fill="#22c55e" stroke="#15803d" stroke-width="2" rx="6"/><text x="468" y="440" fill="#166534" font-size="13" text-anchor="middle">[8,10]</text><rect width="126" height="32" x="720" y="448" fill="#22c55e" stroke="#15803d" stroke-width="2" rx="6"/><text x="783" y="440" fill="#166534" font-size="13" text-anchor="middle">[15,18]</text><path stroke="#334155" stroke-width="3" marker-end="url(#arrow)" d="M342 464 L424 464"/><path stroke="#334155" stroke-width="3" marker-end="url(#arrow)" d="M510 464 L718 464"/><rect width="400" height="132" x="610" y="132" fill="#ecfdf5" stroke="#22c55e" stroke-width="2" rx="12"/><text x="632" y="166" fill="#166534" font-size="17" font-weight="800">重叠判断</text><text x="632" y="198" fill="#166534" font-size="15">cur.start=2 &lt;= last.end=3</text><text x="632" y="226" fill="#166534" font-size="15">last.end=max(3,6)=6</text><rect width="400" height="132" x="610" y="300" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="632" y="334" fill="#9a3412" font-size="17" font-weight="800">断开判断</text><text x="632" y="366" fill="#9a3412" font-size="15">cur.start=8 &gt; last.end=6</text><text x="632" y="394" fill="#9a3412" font-size="15">由于后续起点更大，last 不会再被合并。</text><rect width="850" height="70" x="130" y="548" fill="#eef2ff" stroke="#6366f1" stroke-width="2" rx="12"/><text x="154" y="578" fill="#3730a3" font-size="16" font-weight="800">不变量</text><text x="238" y="578" fill="#3730a3" font-size="15">结果列表始终有序且互不重叠；last 是唯一还可能被当前区间扩展的合并段。</text></svg>