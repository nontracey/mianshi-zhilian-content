<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode 55: 跳跃游戏：真实状态图解</title>
  <desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1120" height="680" rx="18" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" fill="#0f172a" font-weight="900" text-anchor="start">LeetCode 55: 跳跃游戏：真实状态图解</text>
  <text x="40" y="82" font-size="15" fill="#475569" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text>
  <rect x="70" y="175" width="74" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="107" y="204" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">2</text><text x="107" y="241" font-size="11" fill="#64748b" font-weight="500" text-anchor="middle">0</text><rect x="144" y="175" width="74" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="181" y="204" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">3</text><text x="181" y="241" font-size="11" fill="#64748b" font-weight="500" text-anchor="middle">1</text><rect x="218" y="175" width="74" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="255" y="204" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">1</text><text x="255" y="241" font-size="11" fill="#64748b" font-weight="500" text-anchor="middle">2</text><rect x="292" y="175" width="74" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="329" y="204" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">1</text><text x="329" y="241" font-size="11" fill="#64748b" font-weight="500" text-anchor="middle">3</text><rect x="366" y="175" width="74" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="403" y="204" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">4</text><text x="403" y="241" font-size="11" fill="#64748b" font-weight="500" text-anchor="middle">4</text><text x="107" y="149" font-size="13" fill="#2563eb" font-weight="800" text-anchor="middle">i=0 reach=2</text><path d="M107,154 L107,173" stroke="#2563eb" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="181" y="263" font-size="13" fill="#16a34a" font-weight="800" text-anchor="middle">i=1 reach=4</text><path d="M181,247 L181,223" stroke="#16a34a" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="520" y="155" width="320" height="86" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="534" y="181" font-size="15" fill="#9a3412" font-weight="800" text-anchor="start">维护最远可达</text><text x="534" y="205" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">i 不能超过 farthest；</text><text x="534" y="223" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">每到一个位置就更新 farthest=</text><text x="534" y="241" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">max(farthest,i+nums</text><rect x="145" y="315" width="230" height="34" rx="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="260" y="338" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">farthest &gt;= last -&gt; true</text>
</svg>
