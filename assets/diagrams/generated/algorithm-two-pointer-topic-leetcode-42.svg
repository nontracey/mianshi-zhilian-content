<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">LeetCode 42 接雨水：较小 max 侧先结算</title><desc id="desc">展示接雨水双指针解法如何维护 leftMax/rightMax，并在较小 max 侧结算当前格水量。</desc><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#334155" d="M1,1 L9,5 L1,9 Z"/></marker></defs><rect width="1120" height="680" fill="#f8fafc" rx="16"/><text x="44" y="56" fill="#0f172a" font-size="28" font-weight="800">接雨水：结算 leftMax/rightMax 较小的一侧</text><text x="44" y="88" fill="#475569" font-size="15">height=[0,1,0,2,1,0,1,3,2,1,2,1]；蓝色为柱子，浅蓝为可接的水。</text><line x1="70" x2="940" y1="382" y2="382" stroke="#94a3b8" stroke-width="2"/><g><rect width="38" height="0" x="92" y="382" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/><rect width="38" height="70" x="164" y="312" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/><rect width="38" height="70" x="236" y="312" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/><rect width="38" height="0" x="236" y="382" fill="#60a5fa"/><rect width="38" height="140" x="308" y="242" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/><rect width="38" height="70" x="380" y="242" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/><rect width="38" height="70" x="380" y="312" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/><rect width="38" height="140" x="452" y="242" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/><rect width="38" height="70" x="524" y="242" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/><rect width="38" height="70" x="524" y="312" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/><rect width="38" height="210" x="596" y="172" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/><rect width="38" height="140" x="668" y="242" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/><rect width="38" height="70" x="740" y="242" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/><rect width="38" height="70" x="740" y="312" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/><rect width="38" height="140" x="812" y="242" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/><rect width="38" height="70" x="884" y="312" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/></g><g fill="#64748b" font-size="12" text-anchor="middle"><text x="111" y="410">0</text><text x="183" y="410">1</text><text x="255" y="410">2</text><text x="327" y="410">3</text><text x="399" y="410">4</text><text x="471" y="410">5</text><text x="543" y="410">6</text><text x="615" y="410">7</text><text x="687" y="410">8</text><text x="759" y="410">9</text><text x="831" y="410">10</text><text x="903" y="410">11</text></g><path stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)" d="M327 458 L327 386"/><text x="327" y="482" fill="#16a34a" font-size="14" font-weight="900" text-anchor="middle">leftMax=2</text><path stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)" d="M615 458 L615 386"/><text x="615" y="482" fill="#dc2626" font-size="14" font-weight="900" text-anchor="middle">rightMax=3</text><rect width="370" height="138" x="650" y="130" fill="#ecfdf5" stroke="#22c55e" stroke-width="2" rx="12"/><text x="674" y="164" fill="#166534" font-size="17" font-weight="800">双指针结算</text><text x="674" y="196" fill="#166534" font-size="15">leftMax=2 &lt;= rightMax=3</text><text x="674" y="224" fill="#166534" font-size="15">结算 left 侧：water += leftMax - height[left]</text><text x="674" y="250" fill="#166534" font-size="15">再执行 left++。</text><rect width="370" height="150" x="650" y="310" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="674" y="344" fill="#9a3412" font-size="17" font-weight="800">为什么安全</text><text x="674" y="376" fill="#9a3412" font-size="15">较小的 max 决定当前水位上限。</text><text x="674" y="404" fill="#9a3412" font-size="15">另一侧已经有不低于它的墙。</text><text x="674" y="432" fill="#9a3412" font-size="15">未来移动不会降低已结算格子的水量。</text><rect width="860" height="70" x="120" y="540" fill="#eef2ff" stroke="#6366f1" stroke-width="2" rx="12"/><text x="146" y="570" fill="#3730a3" font-size="16" font-weight="800">对比单调栈</text><text x="264" y="570" fill="#3730a3" font-size="15">双指针按列纵向结算；单调栈遇到右墙后按层横向结算凹槽。</text></svg>