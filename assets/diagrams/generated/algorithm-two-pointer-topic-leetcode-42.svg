<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode 42 接雨水：较小 max 侧先结算</title>
  <desc id="desc">展示接雨水双指针解法如何维护 leftMax/rightMax，并在较小 max 侧结算当前格水量。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#334155"/></marker>
  </defs>
  <rect width="1120" height="680" rx="16" fill="#f8fafc"/>
  <text x="44" y="56" font-size="28" font-weight="800" fill="#0f172a">接雨水：结算 leftMax/rightMax 较小的一侧</text>
  <text x="44" y="88" font-size="15" fill="#475569">height=[0,1,0,2,1,0,1,3,2,1,2,1]；蓝色为柱子，浅蓝为可接的水。</text>

  <line x1="70" y1="382" x2="940" y2="382" stroke="#94a3b8" stroke-width="2"/>
  <g>
    <rect x="92" y="382" width="38" height="0" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/>
    <rect x="164" y="312" width="38" height="70" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/>
    <rect x="236" y="312" width="38" height="70" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/><rect x="236" y="382" width="38" height="0" fill="#60a5fa"/>
    <rect x="308" y="242" width="38" height="140" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/>
    <rect x="380" y="242" width="38" height="70" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/><rect x="380" y="312" width="38" height="70" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/>
    <rect x="452" y="242" width="38" height="140" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/>
    <rect x="524" y="242" width="38" height="70" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/><rect x="524" y="312" width="38" height="70" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/>
    <rect x="596" y="172" width="38" height="210" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/>
    <rect x="668" y="242" width="38" height="140" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/>
    <rect x="740" y="242" width="38" height="70" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/><rect x="740" y="312" width="38" height="70" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/>
    <rect x="812" y="242" width="38" height="140" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/>
    <rect x="884" y="312" width="38" height="70" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/>
  </g>
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="111" y="410">0</text><text x="183" y="410">1</text><text x="255" y="410">2</text><text x="327" y="410">3</text><text x="399" y="410">4</text><text x="471" y="410">5</text><text x="543" y="410">6</text><text x="615" y="410">7</text><text x="687" y="410">8</text><text x="759" y="410">9</text><text x="831" y="410">10</text><text x="903" y="410">11</text>
  </g>
  <path d="M327 458 L327 386" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="327" y="482" font-size="14" font-weight="900" text-anchor="middle" fill="#16a34a">leftMax=2</text>
  <path d="M615 458 L615 386" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="615" y="482" font-size="14" font-weight="900" text-anchor="middle" fill="#dc2626">rightMax=3</text>

  <rect x="650" y="130" width="370" height="138" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="674" y="164" font-size="17" font-weight="800" fill="#166534">双指针结算</text>
  <text x="674" y="196" font-size="15" fill="#166534">leftMax=2 &lt;= rightMax=3</text>
  <text x="674" y="224" font-size="15" fill="#166534">结算 left 侧：water += leftMax - height[left]</text>
  <text x="674" y="250" font-size="15" fill="#166534">再执行 left++。</text>

  <rect x="650" y="310" width="370" height="150" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="674" y="344" font-size="17" font-weight="800" fill="#9a3412">为什么安全</text>
  <text x="674" y="376" font-size="15" fill="#9a3412">较小的 max 决定当前水位上限。</text>
  <text x="674" y="404" font-size="15" fill="#9a3412">另一侧已经有不低于它的墙。</text>
  <text x="674" y="432" font-size="15" fill="#9a3412">未来移动不会降低已结算格子的水量。</text>

  <rect x="120" y="540" width="860" height="70" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="146" y="570" font-size="16" font-weight="800" fill="#3730a3">对比单调栈</text>
  <text x="264" y="570" font-size="15" fill="#3730a3">双指针按列纵向结算；单调栈遇到右墙后按层横向结算凹槽。</text>
</svg>
