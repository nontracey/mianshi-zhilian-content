<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode 11 盛最多水的容器：短板指针移动</title>
  <desc id="desc">展示左右指针、当前面积、短板淘汰理由和最大面积更新过程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#334155"/></marker>
  </defs>
  <rect width="1120" height="680" rx="16" fill="#f8fafc"/>
  <text x="44" y="56" font-size="28" font-weight="800" fill="#0f172a">盛最多水的容器：每轮丢弃短板边界</text>
  <text x="44" y="88" font-size="15" fill="#475569">height=[1,8,6,2,5,4,8,3,7]；当前最优来自 left=1, right=8，面积 49。</text>

  <line x1="78" y1="392" x2="744" y2="392" stroke="#94a3b8" stroke-width="2"/>
  <rect x="90" y="366" width="44" height="26" rx="5" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="162" y="184" width="44" height="208" rx="5" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <rect x="234" y="236" width="44" height="156" rx="5" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="306" y="340" width="44" height="52" rx="5" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="378" y="262" width="44" height="130" rx="5" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="450" y="288" width="44" height="104" rx="5" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="522" y="184" width="44" height="208" rx="5" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="594" y="314" width="44" height="78" rx="5" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <rect x="666" y="210" width="44" height="182" rx="5" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="112" y="418">0</text><text x="184" y="418">1</text><text x="256" y="418">2</text><text x="328" y="418">3</text><text x="400" y="418">4</text><text x="472" y="418">5</text><text x="544" y="418">6</text><text x="616" y="418">7</text><text x="688" y="418">8</text>
  </g>
  <g font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">
    <text x="112" y="356">1</text><text x="184" y="174">8</text><text x="256" y="226">6</text><text x="328" y="330">2</text><text x="400" y="252">5</text><text x="472" y="278">4</text><text x="544" y="174">8</text><text x="616" y="304">3</text><text x="688" y="200">7</text>
  </g>
  <path d="M184 458 L184 402" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="184" y="480" font-size="15" font-weight="900" text-anchor="middle" fill="#16a34a">left=1</text>
  <path d="M688 458 L688 402" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="688" y="480" font-size="15" font-weight="900" text-anchor="middle" fill="#dc2626">right=8</text>
  <rect x="184" y="210" width="504" height="182" fill="#22c55e" opacity="0.12" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 6"/>

  <rect x="790" y="148" width="280" height="134" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="812" y="182" font-size="17" font-weight="800" fill="#166534">当前面积</text>
  <text x="812" y="214" font-size="15" fill="#166534">min(8, 7) * (8 - 1)</text>
  <text x="812" y="242" font-size="15" fill="#166534">= 7 * 7 = 49，更新 best</text>
  <rect x="790" y="322" width="280" height="154" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="812" y="356" font-size="17" font-weight="800" fill="#9a3412">为什么移动短板</text>
  <text x="812" y="388" font-size="15" fill="#9a3412">若移动高边，宽度变小，短板仍受 7 限制。</text>
  <text x="812" y="418" font-size="15" fill="#9a3412">只有移动 right，才可能找到更高短板。</text>
  <text x="812" y="448" font-size="15" fill="#9a3412">等高时移动任一侧都不漏解。</text>
  <path d="M790 218 L710 238" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="110" y="550" width="850" height="70" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="134" y="580" font-size="16" font-weight="800" fill="#3730a3">淘汰证明</text>
  <text x="230" y="580" font-size="15" fill="#3730a3">以旧短板为边界的所有更窄容器，面积上界不超过当前短板高度乘更小宽度。</text>
</svg>
