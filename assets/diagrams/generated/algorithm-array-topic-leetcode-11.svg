<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">LeetCode 11 盛最多水的容器：短板指针移动</title><desc id="desc">展示左右指针、当前面积、短板淘汰理由和最大面积更新过程。</desc><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#334155" d="M1,1 L9,5 L1,9 Z"/></marker></defs><rect width="1120" height="680" fill="#f8fafc" rx="16"/><text x="44" y="56" fill="#0f172a" font-size="28" font-weight="800">盛最多水的容器：每轮丢弃短板边界</text><text x="44" y="88" fill="#475569" font-size="15">height=[1,8,6,2,5,4,8,3,7]；当前最优来自 left=1, right=8，面积 49。</text><line x1="78" x2="744" y1="392" y2="392" stroke="#94a3b8" stroke-width="2"/><rect width="44" height="26" x="90" y="366" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" rx="5"/><rect width="44" height="208" x="162" y="184" fill="#22c55e" stroke="#15803d" stroke-width="2" rx="5"/><rect width="44" height="156" x="234" y="236" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" rx="5"/><rect width="44" height="52" x="306" y="340" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" rx="5"/><rect width="44" height="130" x="378" y="262" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" rx="5"/><rect width="44" height="104" x="450" y="288" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" rx="5"/><rect width="44" height="208" x="522" y="184" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" rx="5"/><rect width="44" height="78" x="594" y="314" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" rx="5"/><rect width="44" height="182" x="666" y="210" fill="#22c55e" stroke="#15803d" stroke-width="2" rx="5"/><g fill="#475569" font-size="12" text-anchor="middle"><text x="112" y="418">0</text><text x="184" y="418">1</text><text x="256" y="418">2</text><text x="328" y="418">3</text><text x="400" y="418">4</text><text x="472" y="418">5</text><text x="544" y="418">6</text><text x="616" y="418">7</text><text x="688" y="418">8</text></g><g fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle"><text x="112" y="356">1</text><text x="184" y="174">8</text><text x="256" y="226">6</text><text x="328" y="330">2</text><text x="400" y="252">5</text><text x="472" y="278">4</text><text x="544" y="174">8</text><text x="616" y="304">3</text><text x="688" y="200">7</text></g><path stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)" d="M184 458 L184 402"/><text x="184" y="480" fill="#16a34a" font-size="15" font-weight="900" text-anchor="middle">left=1</text><path stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)" d="M688 458 L688 402"/><text x="688" y="480" fill="#dc2626" font-size="15" font-weight="900" text-anchor="middle">right=8</text><rect width="504" height="182" x="184" y="210" fill="#22c55e" stroke="#16a34a" stroke-dasharray="8 6" stroke-width="2" opacity=".12"/><rect width="280" height="134" x="790" y="148" fill="#ecfdf5" stroke="#22c55e" stroke-width="2" rx="12"/><text x="812" y="182" fill="#166534" font-size="17" font-weight="800">当前面积</text><text x="812" y="214" fill="#166534" font-size="15">min(8, 7) * (8 - 1)</text><text x="812" y="242" fill="#166534" font-size="15">= 7 * 7 = 49，更新 best</text><rect width="280" height="154" x="790" y="322" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="812" y="356" fill="#9a3412" font-size="17" font-weight="800">为什么移动短板</text><text x="812" y="388" fill="#9a3412" font-size="15">若移动高边，宽度变小，短板仍受 7 限制。</text><text x="812" y="418" fill="#9a3412" font-size="15">只有移动 right，才可能找到更高短板。</text><text x="812" y="448" fill="#9a3412" font-size="15">等高时移动任一侧都不漏解。</text><path stroke="#334155" stroke-width="3" marker-end="url(#arrow)" d="M790 218 L710 238"/><rect width="850" height="70" x="110" y="550" fill="#eef2ff" stroke="#6366f1" stroke-width="2" rx="12"/><text x="134" y="580" fill="#3730a3" font-size="16" font-weight="800">淘汰证明</text><text x="230" y="580" fill="#3730a3" font-size="15">以旧短板为边界的所有更窄容器，面积上界不超过当前短板高度乘更小宽度。</text></svg>