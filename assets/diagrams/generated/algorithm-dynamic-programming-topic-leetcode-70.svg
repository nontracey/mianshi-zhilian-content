<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode 70: 爬楼梯：真实状态图解</title>
  <desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1120" height="680" rx="18" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" fill="#0f172a" font-weight="900" text-anchor="start">LeetCode 70: 爬楼梯：真实状态图解</text>
  <text x="40" y="82" font-size="15" fill="#475569" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text>
  <rect x="70" y="160" width="92" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="116" y="189" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">f1=1</text><rect x="162" y="160" width="92" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="208" y="189" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">f2=2</text><rect x="254" y="160" width="92" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="300" y="189" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">f3=3</text><rect x="346" y="160" width="92" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="392" y="189" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">f4=5</text><rect x="438" y="160" width="92" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="484" y="189" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">f5=8</text><rect x="610" y="145" width="280" height="86" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="624" y="171" font-size="15" fill="#9a3412" font-weight="800" text-anchor="start">最后一步分类</text><text x="624" y="195" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">到第 n 阶只可能从 n-1 走 1 </text><text x="624" y="213" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">阶，</text><text x="624" y="231" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">或从 n-2 走 2 阶。</text><path d="M250,250 L340,250" stroke="#16a34a" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="245" y="285" font-size="17" fill="#16a34a" font-weight="900" text-anchor="start">f(n)=f(n-1)+f(n-2)</text>
</svg>
