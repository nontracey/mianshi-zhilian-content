<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">双指针技巧：三类移动与不变量</title>
  <desc id="desc">对比相向指针、快慢指针和分离指针的真实移动规则，以及没有单调性时不能硬套双指针。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#334155"/></marker>
  </defs>
  <rect width="1120" height="680" rx="16" fill="#f8fafc"/>
  <text x="44" y="56" font-size="28" font-weight="800" fill="#0f172a">双指针技巧：先证明能排除，再移动指针</text>
  <text x="44" y="88" font-size="15" fill="#475569">不同双指针的共同点不是“两根指针”，而是每次移动都维护可解释的不变量。</text>

  <rect x="54" y="128" width="320" height="190" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="78" y="164" font-size="18" font-weight="800" fill="#1d4ed8">对撞指针：有序两数和</text>
  <g font-size="15" font-weight="800" text-anchor="middle">
    <rect x="78" y="192" width="42" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="99" y="219" fill="#0f172a">1</text>
    <rect x="122" y="192" width="42" height="42" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="143" y="219" fill="#0f172a">3</text>
    <rect x="166" y="192" width="42" height="42" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="187" y="219" fill="#0f172a">4</text>
    <rect x="210" y="192" width="42" height="42" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="231" y="219" fill="#0f172a">6</text>
    <rect x="254" y="192" width="42" height="42" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="275" y="219" fill="#0f172a">8</text>
    <rect x="298" y="192" width="42" height="42" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="319" y="219" fill="#0f172a">11</text>
  </g>
  <path d="M99 252 L99 236" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="99" y="276" font-size="14" font-weight="900" text-anchor="middle" fill="#16a34a">L</text>
  <path d="M319 252 L319 236" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="319" y="276" font-size="14" font-weight="900" text-anchor="middle" fill="#dc2626">R</text>
  <text x="78" y="304" font-size="14" fill="#1e3a8a">sum 小则 L++，sum 大则 R--，每轮排除一个端点。</text>

  <rect x="400" y="128" width="320" height="190" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="424" y="164" font-size="18" font-weight="800" fill="#166534">快慢指针：原地压缩</text>
  <g font-size="15" font-weight="800" text-anchor="middle">
    <rect x="424" y="192" width="46" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="447" y="219" fill="#0f172a">A</text>
    <rect x="472" y="192" width="46" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="495" y="219" fill="#0f172a">B</text>
    <rect x="520" y="192" width="46" height="42" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="543" y="219" fill="#0f172a">X</text>
    <rect x="568" y="192" width="46" height="42" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="591" y="219" fill="#0f172a">C</text>
    <rect x="616" y="192" width="46" height="42" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="639" y="219" fill="#0f172a">D</text>
  </g>
  <path d="M543 252 L543 236" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="543" y="276" font-size="14" font-weight="900" text-anchor="middle" fill="#2563eb">fast</text>
  <path d="M495 252 L495 236" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="495" y="276" font-size="14" font-weight="900" text-anchor="middle" fill="#16a34a">slow</text>
  <text x="424" y="304" font-size="14" fill="#166534">[0, slow) 始终是有效前缀；fast 只负责扫描候选。</text>

  <rect x="746" y="128" width="320" height="190" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="770" y="164" font-size="18" font-weight="800" fill="#9a3412">分离指针：合并有序序列</text>
  <text x="770" y="204" font-size="15" fill="#9a3412">A: 1 4 7</text>
  <text x="770" y="236" font-size="15" fill="#9a3412">B: 2 3 8</text>
  <path d="M870 206 L914 206" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M870 238 L914 238" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="930" y="224" font-size="15" fill="#9a3412">谁小先写入结果</text>
  <text x="770" y="304" font-size="14" fill="#9a3412">不变量：结果前缀有序，未处理后缀仍各自有序。</text>

  <rect x="130" y="398" width="860" height="156" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="160" y="436" font-size="19" font-weight="800" fill="#3730a3">选型检查</text>
  <text x="160" y="470" font-size="16" fill="#3730a3">有序性、短板约束、已处理前缀、速度差追赶，至少要有一个可证明的不变量。</text>
  <text x="160" y="504" font-size="16" fill="#3730a3">如果每次移动只是“试试看”，双指针很可能漏解，应回到哈希、排序、DP 或枚举。</text>
</svg>
