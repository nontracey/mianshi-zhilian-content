<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">LeetCode 27 移除元素：快慢指针原地覆盖</title><desc id="desc">展示 fast 扫描数组、slow 维护保留区，遇到非 val 才写入并扩大结果区。</desc><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#334155" d="M1,1 L9,5 L1,9 Z"/></marker></defs><rect width="1120" height="680" fill="#f8fafc" rx="16"/><text x="44" y="56" fill="#0f172a" font-size="28" font-weight="800">移除元素：slow 左侧始终是保留结果</text><text x="44" y="88" fill="#475569" font-size="15">nums=[3,2,2,3], val=3；顺序保留的快慢指针写法。</text><text x="70" y="136" fill="#0f172a" font-size="17" font-weight="800">扫描过程</text><g font-size="17" font-weight="800" text-anchor="middle"><rect width="70" height="54" x="70" y="160" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="8"/><text x="105" y="194" fill="#0f172a">3</text><rect width="70" height="54" x="140" y="160" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/><text x="175" y="194" fill="#0f172a">2</text><rect width="70" height="54" x="210" y="160" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/><text x="245" y="194" fill="#0f172a">2</text><rect width="70" height="54" x="280" y="160" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="8"/><text x="315" y="194" fill="#0f172a">3</text></g><path stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)" d="M105 142 L105 158"/><text x="105" y="132" fill="#16a34a" font-size="14" font-weight="900" text-anchor="middle">slow=0</text><path stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" d="M175 142 L175 158"/><text x="175" y="132" fill="#2563eb" font-size="14" font-weight="900" text-anchor="middle">fast=1</text><rect width="410" height="128" x="500" y="140" fill="#ecfdf5" stroke="#22c55e" stroke-width="2" rx="12"/><text x="524" y="174" fill="#166534" font-size="17" font-weight="800">fast 指向 2，保留</text><text x="524" y="206" fill="#166534" font-size="15">nums[fast] != val，所以 nums[slow] = nums[fast]</text><text x="524" y="234" fill="#166534" font-size="15">随后 slow++，保留区扩大。</text><path stroke="#334155" stroke-width="3" marker-end="url(#arrow)" d="M210 188 L498 202"/><text x="70" y="332" fill="#0f172a" font-size="17" font-weight="800">覆盖后</text><g font-size="17" font-weight="800" text-anchor="middle"><rect width="70" height="54" x="70" y="356" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/><text x="105" y="390" fill="#0f172a">2</text><rect width="70" height="54" x="140" y="356" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/><text x="175" y="390" fill="#0f172a">2</text><rect width="70" height="54" x="210" y="356" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="8"/><text x="245" y="390" fill="#94a3b8">?</text><rect width="70" height="54" x="280" y="356" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="8"/><text x="315" y="390" fill="#94a3b8">?</text></g><path stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)" d="M210 430 L210 412"/><text x="210" y="454" fill="#16a34a" font-size="14" font-weight="900" text-anchor="middle">slow=2</text><text x="70" y="486" fill="#475569" font-size="15">返回 slow=2；只要求前两个元素有效，后面的旧值不用清理。</text><rect width="410" height="136" x="500" y="338" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="524" y="372" fill="#9a3412" font-size="17" font-weight="800">不变量</text><text x="524" y="404" fill="#9a3412" font-size="15">[0, slow) 全部 != val，且保持原相对顺序。</text><text x="524" y="432" fill="#9a3412" font-size="15">[slow, fast) 是已扫描但不再关心的区域。</text><rect width="820" height="70" x="140" y="548" fill="#eef2ff" stroke="#6366f1" stroke-width="2" rx="12"/><text x="166" y="578" fill="#3730a3" font-size="16" font-weight="800">常见错点</text><text x="270" y="578" fill="#3730a3" font-size="15">不要在遇到 val 时推进 slow；返回的是 slow，不是 slow+1。</text></svg>