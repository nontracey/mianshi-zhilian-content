<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode 27 移除元素：快慢指针原地覆盖</title>
  <desc id="desc">展示 fast 扫描数组、slow 维护保留区，遇到非 val 才写入并扩大结果区。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#334155"/></marker>
  </defs>
  <rect width="1120" height="680" rx="16" fill="#f8fafc"/>
  <text x="44" y="56" font-size="28" font-weight="800" fill="#0f172a">移除元素：slow 左侧始终是保留结果</text>
  <text x="44" y="88" font-size="15" fill="#475569">nums=[3,2,2,3], val=3；顺序保留的快慢指针写法。</text>

  <text x="70" y="136" font-size="17" font-weight="800" fill="#0f172a">扫描过程</text>
  <g font-size="17" font-weight="800" text-anchor="middle">
    <rect x="70" y="160" width="70" height="54" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="105" y="194" fill="#0f172a">3</text>
    <rect x="140" y="160" width="70" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="175" y="194" fill="#0f172a">2</text>
    <rect x="210" y="160" width="70" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="245" y="194" fill="#0f172a">2</text>
    <rect x="280" y="160" width="70" height="54" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="315" y="194" fill="#0f172a">3</text>
  </g>
  <path d="M105 142 L105 158" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="105" y="132" font-size="14" font-weight="900" text-anchor="middle" fill="#16a34a">slow=0</text>
  <path d="M175 142 L175 158" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="175" y="132" font-size="14" font-weight="900" text-anchor="middle" fill="#2563eb">fast=1</text>

  <rect x="500" y="140" width="410" height="128" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="524" y="174" font-size="17" font-weight="800" fill="#166534">fast 指向 2，保留</text>
  <text x="524" y="206" font-size="15" fill="#166534">nums[fast] != val，所以 nums[slow] = nums[fast]</text>
  <text x="524" y="234" font-size="15" fill="#166534">随后 slow++，保留区扩大。</text>
  <path d="M210 188 L498 202" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="70" y="332" font-size="17" font-weight="800" fill="#0f172a">覆盖后</text>
  <g font-size="17" font-weight="800" text-anchor="middle">
    <rect x="70" y="356" width="70" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="105" y="390" fill="#0f172a">2</text>
    <rect x="140" y="356" width="70" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="175" y="390" fill="#0f172a">2</text>
    <rect x="210" y="356" width="70" height="54" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="245" y="390" fill="#94a3b8">?</text>
    <rect x="280" y="356" width="70" height="54" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="315" y="390" fill="#94a3b8">?</text>
  </g>
  <path d="M210 430 L210 412" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="210" y="454" font-size="14" font-weight="900" text-anchor="middle" fill="#16a34a">slow=2</text>
  <text x="70" y="486" font-size="15" fill="#475569">返回 slow=2；只要求前两个元素有效，后面的旧值不用清理。</text>

  <rect x="500" y="338" width="410" height="136" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="524" y="372" font-size="17" font-weight="800" fill="#9a3412">不变量</text>
  <text x="524" y="404" font-size="15" fill="#9a3412">[0, slow) 全部 != val，且保持原相对顺序。</text>
  <text x="524" y="432" font-size="15" fill="#9a3412">[slow, fast) 是已扫描但不再关心的区域。</text>

  <rect x="140" y="548" width="820" height="70" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="166" y="578" font-size="16" font-weight="800" fill="#3730a3">常见错点</text>
  <text x="270" y="578" font-size="15" fill="#3730a3">不要在遇到 val 时推进 slow；返回的是 slow，不是 slow+1。</text>
</svg>
