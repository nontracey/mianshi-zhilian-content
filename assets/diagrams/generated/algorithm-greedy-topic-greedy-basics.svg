<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">贪心算法基础：真实状态图解</title><desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="8"/></filter></defs><rect width="1120" height="680" fill="#f8fafc" rx="18"/><text x="40" y="52" fill="#0f172a" font-size="28" font-weight="900" text-anchor="start">贪心算法基础：真实状态图解</text><text x="40" y="82" fill="#475569" font-size="15" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text><rect width="120" height="26" x="90" y="180" fill="#bfdbfe" rx="6"/><rect width="90" height="26" x="230" y="180" fill="#bbf7d0" rx="6"/><rect width="170" height="26" x="340" y="180" fill="#fecaca" rx="6"/><rect width="100" height="26" x="530" y="180" fill="#bbf7d0" rx="6"/><text x="90" y="160" fill="#0f172a" font-size="16" font-weight="900" text-anchor="start">按结束时间选活动</text><rect width="250" height="86" x="650" y="150" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="664" y="176" fill="#9a3412" font-size="15" font-weight="800" text-anchor="start">局部最优条件</text><text x="664" y="200" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">每次选择最早结束且不冲突的活动，</text><text x="664" y="218" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">为后续留下最多空间。</text><path fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)" d="M270,250 L575,250"/><text x="330" y="285" fill="#166534" font-size="15" font-weight="800" text-anchor="start">选择绿色区间，跳过冲突区间</text></svg>