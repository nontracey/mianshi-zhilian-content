<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">贪心算法基础：真实状态图解</title>
  <desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1120" height="680" rx="18" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" fill="#0f172a" font-weight="900" text-anchor="start">贪心算法基础：真实状态图解</text>
  <text x="40" y="82" font-size="15" fill="#475569" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text>
  <rect x="90" y="180" width="120" height="26" rx="6" fill="#bfdbfe"/><rect x="230" y="180" width="90" height="26" rx="6" fill="#bbf7d0"/><rect x="340" y="180" width="170" height="26" rx="6" fill="#fecaca"/><rect x="530" y="180" width="100" height="26" rx="6" fill="#bbf7d0"/><text x="90" y="160" font-size="16" fill="#0f172a" font-weight="900" text-anchor="start">按结束时间选活动</text><rect x="650" y="150" width="250" height="86" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="664" y="176" font-size="15" fill="#9a3412" font-weight="800" text-anchor="start">局部最优条件</text><text x="664" y="200" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">每次选择最早结束且不冲突的活动，</text><text x="664" y="218" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">为后续留下最多空间。</text><path d="M270,250 L575,250" stroke="#16a34a" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="330" y="285" font-size="15" fill="#166534" font-weight="800" text-anchor="start">选择绿色区间，跳过冲突区间</text>
</svg>
