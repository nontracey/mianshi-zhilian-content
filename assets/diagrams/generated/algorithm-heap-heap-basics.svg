<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">堆与优先队列基础：真实状态图解</title><desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="8"/></filter></defs><rect width="1120" height="680" fill="#f8fafc" rx="18"/><text x="40" y="52" fill="#0f172a" font-size="28" font-weight="900" text-anchor="start">堆与优先队列基础：真实状态图解</text><text x="40" y="82" fill="#475569" font-size="15" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text><path fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)" d="M250,162 L170,208"/><path fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)" d="M250,162 L330,208"/><path fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)" d="M170,252 L120,298"/><path fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)" d="M170,252 L220,298"/><path fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)" d="M330,252 L300,298"/><circle cx="250" cy="140" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="250" y="146" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">9</text><circle cx="170" cy="230" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="170" y="236" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">7</text><circle cx="330" cy="230" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="330" y="236" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">5</text><circle cx="120" cy="320" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="120" y="326" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">3</text><circle cx="220" cy="320" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="220" y="326" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">4</text><circle cx="300" cy="320" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="300" y="326" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">1</text><rect width="300" height="86" x="520" y="150" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="534" y="176" fill="#9a3412" font-size="15" font-weight="800" text-anchor="start">堆性质</text><text x="534" y="200" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">每个父节点都不小于子节点；</text><text x="534" y="218" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">只保证堆顶是最大/最小，</text><text x="534" y="236" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">不保证整棵树有序。</text><rect width="56" height="46" x="520" y="310" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/><text x="548" y="339" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">9</text><rect width="56" height="46" x="576" y="310" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="6"/><text x="604" y="339" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">7</text><rect width="56" height="46" x="632" y="310" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="6"/><text x="660" y="339" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">5</text><rect width="56" height="46" x="688" y="310" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="6"/><text x="716" y="339" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">3</text><rect width="56" height="46" x="744" y="310" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="6"/><text x="772" y="339" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">4</text><rect width="56" height="46" x="800" y="310" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="6"/><text x="828" y="339" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">1</text></svg>