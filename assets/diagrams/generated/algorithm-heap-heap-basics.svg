<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">堆与优先队列基础：真实状态图解</title>
  <desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1120" height="680" rx="18" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" fill="#0f172a" font-weight="900" text-anchor="start">堆与优先队列基础：真实状态图解</text>
  <text x="40" y="82" font-size="15" fill="#475569" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text>
  <path d="M250,162 L170,208" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M250,162 L330,208" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M170,252 L120,298" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M170,252 L220,298" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M330,252 L300,298" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><circle cx="250" cy="140" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="250" y="146" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">9</text><circle cx="170" cy="230" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="170" y="236" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">7</text><circle cx="330" cy="230" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="330" y="236" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">5</text><circle cx="120" cy="320" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="120" y="326" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">3</text><circle cx="220" cy="320" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="220" y="326" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">4</text><circle cx="300" cy="320" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="300" y="326" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">1</text><rect x="520" y="150" width="300" height="86" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="534" y="176" font-size="15" fill="#9a3412" font-weight="800" text-anchor="start">堆性质</text><text x="534" y="200" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">每个父节点都不小于子节点；</text><text x="534" y="218" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">只保证堆顶是最大/最小，</text><text x="534" y="236" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">不保证整棵树有序。</text><rect x="520" y="310" width="56" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="548" y="339" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">9</text><rect x="576" y="310" width="56" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="604" y="339" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">7</text><rect x="632" y="310" width="56" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="660" y="339" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">5</text><rect x="688" y="310" width="56" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="716" y="339" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">3</text><rect x="744" y="310" width="56" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="772" y="339" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">4</text><rect x="800" y="310" width="56" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="828" y="339" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">1</text>
</svg>
