<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">BFS 与 DFS 模板：真实状态图解</title>
  <desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1120" height="680" rx="18" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" fill="#0f172a" font-weight="900" text-anchor="start">BFS 与 DFS 模板：真实状态图解</text>
  <text x="40" y="82" font-size="15" fill="#475569" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text>
  <path d="M260,152 L160,213" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M260,152 L360,213" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M160,257 L105,318" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M160,257 L215,318" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M360,257 L360,318" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><circle cx="260" cy="130" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="260" y="136" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">A</text><circle cx="160" cy="235" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="160" y="241" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">B</text><circle cx="360" cy="235" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="360" y="241" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">C</text><circle cx="105" cy="340" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="105" y="346" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">D</text><circle cx="215" cy="340" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="215" y="346" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">E</text><circle cx="360" cy="340" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="360" y="346" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">F</text><text x="635" y="121" font-size="14" fill="#7c3aed" font-weight="900" text-anchor="middle">DFS stack path</text><rect x="560" y="203" width="150" height="34" rx="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/><text x="635" y="225" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">A</text><rect x="560" y="169" width="150" height="34" rx="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/><text x="635" y="191" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">B</text><rect x="560" y="135" width="150" height="34" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="635" y="157" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">D</text><text x="745" y="121" font-size="14" fill="#7c3aed" font-weight="900" text-anchor="middle">BFS queue</text><rect x="670" y="169" width="150" height="34" rx="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/><text x="745" y="191" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">B</text><rect x="670" y="135" width="150" height="34" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="745" y="157" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">C</text><rect x="530" y="315" width="300" height="86" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="544" y="341" font-size="15" fill="#9a3412" font-weight="800" text-anchor="start">遍历差异</text><text x="544" y="365" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">DFS 走深路径并回溯；</text><text x="544" y="383" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">BFS 按层推进，</text><text x="544" y="401" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">天然适合最短步数。</text>
</svg>
