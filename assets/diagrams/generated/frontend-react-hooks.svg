<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">React Fiber Linked List 与调度模型</title>
  <desc id="desc">组件渲染生成 Fiber 链表，workInProgress/current 双树切换，最终 commit 阶段提交 DOM。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }</style>
  </defs>
  <rect width="1000" height="440" rx="18" fill="#f8fafc"/>
  <text x="40" y="48" font-size="26" fill="#0f172a" font-weight="900">React Fiber Linked List 与调度模型</text>
  <text x="40" y="74" font-size="14" fill="#64748b">Component -> Fiber Node 链表 -> workInProgress/current 双树 -> Commit DOM</text>

  <!-- Component render -->
  <rect x="40" y="110" width="140" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="138" font-size="13" fill="#1e40af" font-weight="800" text-anchor="middle">Component</text>
  <text x="110" y="156" font-size="11" fill="#3b82f6" text-anchor="middle">渲染</text>

  <!-- Arrow -->
  <line x1="180" y1="140" x2="215" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Fiber Node Chain (workInProgress) -->
  <rect x="220" y="90" width="360" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="235" y="114" font-size="13" fill="#1d4ed8" font-weight="900">workInProgress Fiber Tree</text>

  <!-- Fiber nodes connected -->
  <rect x="240" y="125" width="80" height="40" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="280" y="150" font-size="11" fill="#1e40af" font-weight="700" text-anchor="middle">App</text>

  <line x1="320" y1="145" x2="345" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="350" y="125" width="80" height="40" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="390" y="150" font-size="11" fill="#1e40af" font-weight="700" text-anchor="middle">List</text>

  <line x1="430" y1="145" x2="455" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="460" y="125" width="80" height="40" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="500" y="150" font-size="11" fill="#1e40af" font-weight="700" text-anchor="middle">Item</text>

  <!-- Labels below chain -->
  <text x="280" y="190" font-size="10" fill="#64748b" text-anchor="middle">memoizedState</text>
  <text x="390" y="190" font-size="10" fill="#64748b" text-anchor="middle">updateQueue</text>
  <text x="500" y="190" font-size="10" fill="#64748b" text-anchor="middle">effectTag</text>

  <!-- Arrow to current tree -->
  <line x1="580" y1="140" x2="625" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Current Fiber Tree -->
  <rect x="630" y="90" width="160" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="645" y="114" font-size="13" fill="#166534" font-weight="900">current 树</text>

  <rect x="650" y="125" width="55" height="40" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
  <text x="677" y="150" font-size="11" fill="#166534" font-weight="700" text-anchor="middle">App</text>

  <line x1="705" y1="145" x2="720" y2="145" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="725" y="125" width="55" height="40" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
  <text x="752" y="150" font-size="11" fill="#166534" font-weight="700" text-anchor="middle">List</text>

  <!-- Commit phase -->
  <line x1="790" y1="140" x2="830" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="835" y="100" width="140" height="80" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="905" y="132" font-size="13" fill="#92400e" font-weight="800" text-anchor="middle">提交阶段</text>
  <text x="905" y="152" font-size="11" fill="#b45309" text-anchor="middle">DOM 变更</text>
  <text x="905" y="168" font-size="11" fill="#b45309" text-anchor="middle">执行副作用</text>

  <!-- Hooks linked list detail -->
  <text x="40" y="250" font-size="14" fill="#0f172a" font-weight="800">Hook 链表（memoizedState 字段）</text>

  <rect x="40" y="270" width="90" height="44" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="85" y="290" font-size="11" fill="#9d174d" font-weight="700" text-anchor="middle">useState</text>
  <text x="85" y="304" font-size="9" fill="#ec4899" text-anchor="middle">memoizedState</text>

  <line x1="130" y1="292" x2="155" y2="292" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="160" y="270" width="90" height="44" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="205" y="290" font-size="11" fill="#9d174d" font-weight="700" text-anchor="middle">useEffect</text>
  <text x="205" y="304" font-size="9" fill="#ec4899" text-anchor="middle">依赖 + 清理</text>

  <line x1="250" y1="292" x2="275" y2="292" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="280" y="270" width="90" height="44" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="325" y="290" font-size="11" fill="#9d174d" font-weight="700" text-anchor="middle">useRef</text>
  <text x="325" y="304" font-size="9" fill="#ec4899" text-anchor="middle">current: value</text>

  <line x1="370" y1="292" x2="395" y2="292" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="400" y="270" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="430" y="296" font-size="11" fill="#475569" font-weight="700" text-anchor="middle">...</text>

  <text x="530" y="296" font-size="11" fill="#64748b" font-weight="600">next -> null</text>

  <!-- Scheduling -->
  <text x="40" y="360" font-size="14" fill="#0f172a" font-weight="800">调度</text>

  <rect x="40" y="375" width="180" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="130" y="395" font-size="11" fill="#075985" font-weight="700" text-anchor="middle">Scheduler（MessageChannel）</text>
  <text x="130" y="409" font-size="9" fill="#0284c7" text-anchor="middle">时间切片</text>

  <line x1="220" y1="397" x2="255" y2="397" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="260" y="375" width="180" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="350" y="395" font-size="11" fill="#075985" font-weight="700" text-anchor="middle">并发渲染</text>
  <text x="350" y="409" font-size="9" fill="#0284c7" text-anchor="middle">可中断</text>

  <line x1="440" y1="397" x2="475" y2="397" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="480" y="375" width="160" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="560" y="395" font-size="11" fill="#92400e" font-weight="700" text-anchor="middle">同步提交</text>
  <text x="560" y="409" font-size="9" fill="#b45309" text-anchor="middle">阻塞式 DOM 操作</text>
</svg>
