<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">LeetCode 49: 字母异位词分组：真实状态图解</title><desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="8"/></filter></defs><rect width="1120" height="680" fill="#f8fafc" rx="18"/><text x="40" y="52" fill="#0f172a" font-size="28" font-weight="900" text-anchor="start">LeetCode 49: 字母异位词分组：真实状态图解</text><text x="40" y="82" fill="#475569" font-size="15" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text><rect width="235" height="170" x="70" y="145" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="12"/><text x="95" y="178" fill="#0f172a" font-size="16" font-weight="900" text-anchor="start">输入单词</text><text x="105" y="215" fill="#0f172a" font-size="15" font-weight="800" text-anchor="start">eat, tea, ate</text><text x="105" y="245" fill="#0f172a" font-size="15" font-weight="800" text-anchor="start">tan, nat</text><text x="105" y="275" fill="#0f172a" font-size="15" font-weight="800" text-anchor="start">bat</text><path fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" d="M320,225 L455,225"/><rect width="330" height="170" x="470" y="145" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="12"/><text x="495" y="178" fill="#1d4ed8" font-size="16" font-weight="900" text-anchor="start">key = 排序后字符串</text><text x="505" y="215" fill="#0f172a" font-size="15" font-weight="800" text-anchor="start">aet -&gt; [eat, tea, ate]</text><text x="505" y="245" fill="#0f172a" font-size="15" font-weight="800" text-anchor="start">ant -&gt; [tan, nat]</text><text x="505" y="275" fill="#0f172a" font-size="15" font-weight="800" text-anchor="start">abt -&gt; [bat]</text></svg>