<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode 49: 字母异位词分组：真实状态图解</title>
  <desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1120" height="680" rx="18" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" fill="#0f172a" font-weight="900" text-anchor="start">LeetCode 49: 字母异位词分组：真实状态图解</text>
  <text x="40" y="82" font-size="15" fill="#475569" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text>
  <rect x="70" y="145" width="235" height="170" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="95" y="178" font-size="16" fill="#0f172a" font-weight="900" text-anchor="start">输入单词</text><text x="105" y="215" font-size="15" fill="#0f172a" font-weight="800" text-anchor="start">eat, tea, ate</text><text x="105" y="245" font-size="15" fill="#0f172a" font-weight="800" text-anchor="start">tan, nat</text><text x="105" y="275" font-size="15" fill="#0f172a" font-weight="800" text-anchor="start">bat</text><path d="M320,225 L455,225" stroke="#2563eb" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="470" y="145" width="330" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="495" y="178" font-size="16" fill="#1d4ed8" font-weight="900" text-anchor="start">key = 排序后字符串</text><text x="505" y="215" font-size="15" fill="#0f172a" font-weight="800" text-anchor="start">aet -&gt; [eat, tea, ate]</text><text x="505" y="245" font-size="15" fill="#0f172a" font-weight="800" text-anchor="start">ant -&gt; [tan, nat]</text><text x="505" y="275" font-size="15" fill="#0f172a" font-weight="800" text-anchor="start">abt -&gt; [bat]</text>
</svg>
