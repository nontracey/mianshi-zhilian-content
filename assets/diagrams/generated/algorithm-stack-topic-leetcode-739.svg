</text><text x="432" y="226" font-size="11" fill="#64748b" font-weight="500" text-anchor="middle">6</text><rect x="461" y="160" width="58" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="490" y="189" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">73</text><text x="490" y="226" font-size="11" fill="#64748b" font-weight="500" text-anchor="middle">7</text><text x="374" y="134" font-size="13" fill="#2563eb" font-weight="800" text-anchor="middle">i=5,72</text><path d="M374,139 L374,158" stroke="#2563eb" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="645" y="136" font-size="14" fill="#7c3aed" font-weight="900" text-anchor="middle">单调递减栈</text><rect x="570" y="184" width="150" height="34" rx="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/><text x="645" y="206" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">idx3:71</text><rect x="570" y="150" width="150" height="34" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="645" y="172" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">idx4:69</text><path d="M520,185 L570,225" stroke="#2563eb" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="710" y="155" width="230" height="86" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="724" y="181" font-size="15" fill="#9a3412" font-weight="800" text-anchor="start">弹栈结算</text><text x="724" y="205" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">72 大于 69 和 71，</text><text x="724" y="223" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">分别得到等待 1 天和 2 天。</text><text x="724" y="241" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">栈里只留未找到升温日的下标。</text>
