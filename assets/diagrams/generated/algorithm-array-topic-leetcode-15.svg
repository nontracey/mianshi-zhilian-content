<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode 15 三数之和：排序、双指针与去重</title>
  <desc id="desc">展示三数之和在排序后固定 i，按 sum 正负移动左右指针，并在命中后跳过重复值。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#334155"/></marker>
  </defs>
  <rect width="1120" height="680" rx="16" fill="#f8fafc"/>
  <text x="44" y="56" font-size="28" font-weight="800" fill="#0f172a">三数之和：固定 i 后退化为有序两数之和</text>
  <text x="44" y="88" font-size="15" fill="#475569">排序后 nums=[-4,-1,-1,0,1,2]；固定 i=1 的 -1，用 L/R 找和为 1 的两数。</text>

  <g>
    <rect x="70" y="154" width="78" height="56" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="148" y="154" width="78" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <rect x="226" y="154" width="78" height="56" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="304" y="154" width="78" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="382" y="154" width="78" height="56" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="460" y="154" width="78" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="109" y="187" font-size="18" font-weight="800" text-anchor="middle" fill="#0f172a">-4</text>
    <text x="187" y="187" font-size="18" font-weight="800" text-anchor="middle" fill="#4c1d95">-1</text>
    <text x="265" y="187" font-size="18" font-weight="800" text-anchor="middle" fill="#0f172a">-1</text>
    <text x="343" y="187" font-size="18" font-weight="800" text-anchor="middle" fill="#166534">0</text>
    <text x="421" y="187" font-size="18" font-weight="800" text-anchor="middle" fill="#0f172a">1</text>
    <text x="499" y="187" font-size="18" font-weight="800" text-anchor="middle" fill="#991b1b">2</text>
    <text x="109" y="232" font-size="12" fill="#64748b" text-anchor="middle">0</text>
    <text x="187" y="232" font-size="12" fill="#64748b" text-anchor="middle">1</text>
    <text x="265" y="232" font-size="12" fill="#64748b" text-anchor="middle">2</text>
    <text x="343" y="232" font-size="12" fill="#64748b" text-anchor="middle">3</text>
    <text x="421" y="232" font-size="12" fill="#64748b" text-anchor="middle">4</text>
    <text x="499" y="232" font-size="12" fill="#64748b" text-anchor="middle">5</text>
  </g>
  <path d="M187 136 L187 152" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="187" y="126" font-size="15" font-weight="900" text-anchor="middle" fill="#7c3aed">i=-1</text>
  <path d="M343 250 L343 214" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="343" y="274" font-size="15" font-weight="900" text-anchor="middle" fill="#16a34a">L=0</text>
  <path d="M499 250 L499 214" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="499" y="274" font-size="15" font-weight="900" text-anchor="middle" fill="#dc2626">R=2</text>

  <rect x="620" y="132" width="360" height="124" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="642" y="166" font-size="17" font-weight="800" fill="#9a3412">本轮 sum</text>
  <text x="642" y="198" font-size="15" fill="#9a3412">-1 + 0 + 2 = 1 &gt; 0</text>
  <text x="642" y="226" font-size="15" fill="#9a3412">需要更小的值，所以 R 左移。</text>
  <path d="M620 204 L540 196" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="118" y="348" width="376" height="78" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="140" y="380" font-size="17" font-weight="800" fill="#166534">命中后</text>
  <text x="222" y="380" font-size="15" fill="#166534">[-1, -1, 2] 或 [-1, 0, 1] 加入结果。</text>
  <text x="140" y="406" font-size="15" fill="#166534">随后跳过连续重复的 L/R，再同时收缩。</text>

  <rect x="620" y="330" width="360" height="148" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="642" y="364" font-size="17" font-weight="800" fill="#3730a3">去重不变量</text>
  <text x="642" y="396" font-size="15" fill="#3730a3">1. i 与前一个值相同，直接跳过。</text>
  <text x="642" y="424" font-size="15" fill="#3730a3">2. 只有命中答案后才跳过重复 L/R。</text>
  <text x="642" y="452" font-size="15" fill="#3730a3">3. sum 不等于 0 时只按单调性移动一侧。</text>

  <path d="M500 510 C410 566 292 566 198 510" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="350" y="592" font-size="15" font-weight="800" text-anchor="middle" fill="#475569">L 与 R 在 i 右侧单调靠拢，每个二元组最多处理一次</text>
</svg>
