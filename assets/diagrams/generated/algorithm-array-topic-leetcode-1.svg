<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode 1 两数之和：哈希表命中过程</title>
  <desc id="desc">展示遍历 nums 时先查 complement 再写入哈希表，从而避免使用同一个元素两次。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#334155"/></marker>
  </defs>
  <rect width="1120" height="680" rx="16" fill="#f8fafc"/>
  <text x="44" y="56" font-size="28" font-weight="800" fill="#0f172a">两数之和：先查补数，再写当前值</text>
  <text x="44" y="88" font-size="15" fill="#475569">nums=[2,7,11,15], target=9；map 只保存“已扫描前缀”的 value -> index。</text>

  <text x="70" y="138" font-size="17" font-weight="800" fill="#0f172a">数组扫描</text>
  <rect x="70" y="166" width="82" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="152" y="166" width="82" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="234" y="166" width="82" height="56" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="316" y="166" width="82" height="56" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="111" y="199" font-size="19" font-weight="800" text-anchor="middle" fill="#0f172a">2</text>
  <text x="193" y="199" font-size="19" font-weight="800" text-anchor="middle" fill="#0f172a">7</text>
  <text x="275" y="199" font-size="19" font-weight="800" text-anchor="middle" fill="#0f172a">11</text>
  <text x="357" y="199" font-size="19" font-weight="800" text-anchor="middle" fill="#0f172a">15</text>
  <text x="111" y="244" font-size="13" text-anchor="middle" fill="#64748b">i=0</text>
  <text x="193" y="244" font-size="13" text-anchor="middle" fill="#64748b">i=1</text>
  <text x="275" y="244" font-size="13" text-anchor="middle" fill="#64748b">i=2</text>
  <text x="357" y="244" font-size="13" text-anchor="middle" fill="#64748b">i=3</text>
  <text x="193" y="145" font-size="14" font-weight="800" text-anchor="middle" fill="#16a34a">当前 x=7</text>
  <path d="M193 150 L193 164" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="500" y="132" width="260" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="522" y="164" font-size="17" font-weight="800" fill="#1d4ed8">本轮计算</text>
  <text x="522" y="194" font-size="15" fill="#1e3a8a">need = target - x = 9 - 7 = 2</text>
  <text x="522" y="220" font-size="15" fill="#1e3a8a">先查 need，再决定是否写入 x</text>
  <path d="M398 194 L498 194" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="120" y="330" width="280" height="150" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="142" y="362" font-size="17" font-weight="800" fill="#0f172a">map: value -> index</text>
  <line x1="142" y1="382" x2="378" y2="382" stroke="#cbd5e1" stroke-width="2"/>
  <text x="156" y="418" font-size="16" font-weight="800" fill="#0f172a">2</text>
  <text x="242" y="418" font-size="16" fill="#475569">-></text>
  <text x="318" y="418" font-size="16" font-weight="800" fill="#0f172a">0</text>
  <text x="156" y="454" font-size="14" fill="#64748b">只保存 i=0 的前缀</text>

  <path d="M630 242 C610 300 438 340 400 386" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="560" y="340" width="390" height="142" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="582" y="374" font-size="17" font-weight="800" fill="#166534">命中 complement</text>
  <text x="582" y="404" font-size="15" fill="#166534">map 中存在 2 -> 0，当前下标是 1。</text>
  <text x="582" y="432" font-size="15" fill="#166534">返回 [0, 1]，两个下标来自不同轮次。</text>
  <text x="582" y="460" font-size="15" fill="#166534">如果没命中，才执行 map.put(x, i)。</text>

  <rect x="160" y="548" width="790" height="70" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="184" y="578" font-size="16" font-weight="800" fill="#9a3412">不变量</text>
  <text x="270" y="578" font-size="15" fill="#9a3412">map 始终只包含当前 i 左侧元素，因此 complement 命中时不会使用同一个元素两次。</text>
</svg>
