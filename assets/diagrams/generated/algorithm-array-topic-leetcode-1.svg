<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">LeetCode 1 两数之和：哈希表命中过程</title><desc id="desc">展示遍历 nums 时先查 complement 再写入哈希表，从而避免使用同一个元素两次。</desc><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#334155" d="M1,1 L9,5 L1,9 Z"/></marker></defs><rect width="1120" height="680" fill="#f8fafc" rx="16"/><text x="44" y="56" fill="#0f172a" font-size="28" font-weight="800">两数之和：先查补数，再写当前值</text><text x="44" y="88" fill="#475569" font-size="15">nums=[2,7,11,15], target=9；map 只保存“已扫描前缀”的 value -&gt; index。</text><text x="70" y="138" fill="#0f172a" font-size="17" font-weight="800">数组扫描</text><rect width="82" height="56" x="70" y="166" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/><rect width="82" height="56" x="152" y="166" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/><rect width="82" height="56" x="234" y="166" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="8"/><rect width="82" height="56" x="316" y="166" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="8"/><text x="111" y="199" fill="#0f172a" font-size="19" font-weight="800" text-anchor="middle">2</text><text x="193" y="199" fill="#0f172a" font-size="19" font-weight="800" text-anchor="middle">7</text><text x="275" y="199" fill="#0f172a" font-size="19" font-weight="800" text-anchor="middle">11</text><text x="357" y="199" fill="#0f172a" font-size="19" font-weight="800" text-anchor="middle">15</text><text x="111" y="244" fill="#64748b" font-size="13" text-anchor="middle">i=0</text><text x="193" y="244" fill="#64748b" font-size="13" text-anchor="middle">i=1</text><text x="275" y="244" fill="#64748b" font-size="13" text-anchor="middle">i=2</text><text x="357" y="244" fill="#64748b" font-size="13" text-anchor="middle">i=3</text><text x="193" y="145" fill="#16a34a" font-size="14" font-weight="800" text-anchor="middle">当前 x=7</text><path stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)" d="M193 150 L193 164"/><rect width="260" height="110" x="500" y="132" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="12"/><text x="522" y="164" fill="#1d4ed8" font-size="17" font-weight="800">本轮计算</text><text x="522" y="194" fill="#1e3a8a" font-size="15">need = target - x = 9 - 7 = 2</text><text x="522" y="220" fill="#1e3a8a" font-size="15">先查 need，再决定是否写入 x</text><path stroke="#334155" stroke-width="3" marker-end="url(#arrow)" d="M398 194 L498 194"/><rect width="280" height="150" x="120" y="330" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" rx="12"/><text x="142" y="362" fill="#0f172a" font-size="17" font-weight="800">map: value -&gt; index</text><line x1="142" x2="378" y1="382" y2="382" stroke="#cbd5e1" stroke-width="2"/><text x="156" y="418" fill="#0f172a" font-size="16" font-weight="800">2</text><text x="242" y="418" fill="#475569" font-size="16">-&gt;</text><text x="318" y="418" fill="#0f172a" font-size="16" font-weight="800">0</text><text x="156" y="454" fill="#64748b" font-size="14">只保存 i=0 的前缀</text><path fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" d="M630 242 C610 300 438 340 400 386"/><rect width="390" height="142" x="560" y="340" fill="#ecfdf5" stroke="#22c55e" stroke-width="2" rx="12"/><text x="582" y="374" fill="#166534" font-size="17" font-weight="800">命中 complement</text><text x="582" y="404" fill="#166534" font-size="15">map 中存在 2 -&gt; 0，当前下标是 1。</text><text x="582" y="432" fill="#166534" font-size="15">返回 [0, 1]，两个下标来自不同轮次。</text><text x="582" y="460" fill="#166534" font-size="15">如果没命中，才执行 map.put(x, i)。</text><rect width="790" height="70" x="160" y="548" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="184" y="578" fill="#9a3412" font-size="16" font-weight="800">不变量</text><text x="270" y="578" fill="#9a3412" font-size="15">map 始终只包含当前 i 左侧元素，因此 complement 命中时不会使用同一个元素两次。</text></svg>