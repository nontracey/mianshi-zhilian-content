<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">寻找峰值的坡度二分</title>
  <desc id="desc">比较 nums[mid] 与 nums[mid+1]，沿有峰值的一侧收缩。</desc>
  <rect width="980" height="520" rx="18" fill="#f8fafc"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#0f172a">LeetCode 162：比较坡度而不是比较 target</text>
  <text x="40" y="78" font-size="14" fill="#475569">边界外视为 -∞，只要某侧是上坡，沿上坡方向最终必有峰值。</text>
  <polyline points="100,360 210,300 320,180 430,340 540,260 650,130 760,310" fill="none" stroke="#2563eb" stroke-width="4"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <circle cx="100" cy="360" r="9" fill="#2563eb"/><text x="100" y="390" font-size="13">1</text>
    <circle cx="210" cy="300" r="9" fill="#2563eb"/><text x="210" y="330" font-size="13">2</text>
    <circle cx="320" cy="180" r="11" fill="#16a34a"/><text x="320" y="165" font-size="13" fill="#166534" font-weight="700">peak</text><text x="320" y="210" font-size="13">3</text>
    <circle cx="430" cy="340" r="9" fill="#2563eb"/><text x="430" y="370" font-size="13">1</text>
    <circle cx="540" cy="260" r="9" fill="#2563eb"/><text x="540" y="290" font-size="13">5</text>
    <circle cx="650" cy="130" r="11" fill="#16a34a"/><text x="650" y="115" font-size="13" fill="#166534" font-weight="700">peak</text><text x="650" y="160" font-size="13">6</text>
    <circle cx="760" cy="310" r="9" fill="#2563eb"/><text x="760" y="340" font-size="13">4</text>
    <rect x="75" y="405" width="760" height="72" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="455" y="433" font-size="15" fill="#0f172a" font-weight="700">若 nums[mid] &lt; nums[mid+1]：右侧上坡，left = mid + 1</text>
    <text x="455" y="459" font-size="15" fill="#0f172a" font-weight="700">否则：mid 可能就是峰值，right = mid</text>
  </g>
  <path d="M540 246 L640 146" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#16a34a"/></marker></defs>
</svg>
