<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">队列基础：真实状态图解</title>
  <desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1120" height="680" rx="18" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" fill="#0f172a" font-weight="900" text-anchor="start">队列基础：真实状态图解</text>
  <text x="40" y="82" font-size="15" fill="#475569" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text>
  <rect x="120" y="180" width="70" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="155" y="209" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">A</text><rect x="190" y="180" width="70" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="225" y="209" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">B</text><rect x="260" y="180" width="70" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="295" y="209" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">C</text><rect x="330" y="180" width="70" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="365" y="209" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">_</text><rect x="400" y="180" width="70" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="435" y="209" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">_</text><text x="155" y="154" font-size="13" fill="#16a34a" font-weight="800" text-anchor="middle">front</text><path d="M155,159 L155,178" stroke="#16a34a" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="365" y="154" font-size="13" fill="#2563eb" font-weight="800" text-anchor="middle">rear</text><path d="M365,159 L365,178" stroke="#2563eb" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="560" y="155" width="300" height="86" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="574" y="181" font-size="15" fill="#9a3412" font-weight="800" text-anchor="start">先进先出</text><text x="574" y="205" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">BFS、</text><text x="574" y="223" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">消息缓冲、</text><text x="574" y="241" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">生产消费都依赖队头出、</text><path d="M185,290 L355,290" stroke="#64748b" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="220" y="325" font-size="14" fill="#334155" font-weight="800" text-anchor="start">dequeue A -&gt; front 前进</text>
