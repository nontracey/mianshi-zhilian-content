<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">队列基础：真实状态图解</title><desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="8"/></filter></defs><rect width="1120" height="680" fill="#f8fafc" rx="18"/><text x="40" y="52" fill="#0f172a" font-size="28" font-weight="900" text-anchor="start">队列基础：真实状态图解</text><text x="40" y="82" fill="#475569" font-size="15" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text><rect width="70" height="46" x="120" y="180" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/><text x="155" y="209" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">A</text><rect width="70" height="46" x="190" y="180" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/><text x="225" y="209" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">B</text><rect width="70" height="46" x="260" y="180" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/><text x="295" y="209" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">C</text><rect width="70" height="46" x="330" y="180" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="6"/><text x="365" y="209" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">_</text><rect width="70" height="46" x="400" y="180" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="6"/><text x="435" y="209" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">_</text><text x="155" y="154" fill="#16a34a" font-size="13" font-weight="800" text-anchor="middle">front</text><path fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)" d="M155,159 L155,178"/><text x="365" y="154" fill="#2563eb" font-size="13" font-weight="800" text-anchor="middle">rear</text><path fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" d="M365,159 L365,178"/><rect width="300" height="86" x="560" y="155" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="574" y="181" fill="#9a3412" font-size="15" font-weight="800" text-anchor="start">先进先出</text><text x="574" y="205" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">BFS、</text><text x="574" y="223" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">消息缓冲、</text><text x="574" y="241" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">生产消费都依赖队头出、</text><path fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" d="M185,290 L355,290"/><text x="220" y="325" fill="#334155" font-size="14" font-weight="800" text-anchor="start">dequeue A -&gt; front 前进</text></svg>