<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">哈希表基础：真实状态图解</title><desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="8"/></filter></defs><rect width="1120" height="680" fill="#f8fafc" rx="18"/><text x="40" y="52" fill="#0f172a" font-size="28" font-weight="900" text-anchor="start">哈希表基础：真实状态图解</text><text x="40" y="82" fill="#475569" font-size="15" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text><rect width="180" height="170" x="80" y="145" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="12"/><text x="110" y="178" fill="#1d4ed8" font-size="16" font-weight="900" text-anchor="start">hash(key) % m</text><text x="120" y="220" fill="#0f172a" font-size="15" font-weight="800" text-anchor="start">&quot;cat&quot; -&gt; 2</text><text x="120" y="250" fill="#0f172a" font-size="15" font-weight="800" text-anchor="start">&quot;act&quot; -&gt; 2</text><path fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" d="M275,220 L410,220"/><rect width="300" height="190" x="420" y="140" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="12"/><text x="450" y="172" fill="#0f172a" font-size="16" font-weight="900" text-anchor="start">bucket[2]</text><rect width="80" height="38" x="455" y="205" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/><text x="495" y="230" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">cat</text><path fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)" d="M535,224 L585,224"/><rect width="80" height="38" x="585" y="205" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="8"/><text x="625" y="230" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">act</text><rect width="220" height="86" x="720" y="190" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="734" y="216" fill="#9a3412" font-size="15" font-weight="800" text-anchor="start">冲突处理</text><text x="734" y="240" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">链地址/开放寻址解决冲突；</text><text x="734" y="258" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">负载因子过高要扩容重哈希。</text></svg>