<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">哈希表基础：真实状态图解</title>
  <desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1120" height="680" rx="18" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" fill="#0f172a" font-weight="900" text-anchor="start">哈希表基础：真实状态图解</text>
  <text x="40" y="82" font-size="15" fill="#475569" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text>
  <rect x="80" y="145" width="180" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="110" y="178" font-size="16" fill="#1d4ed8" font-weight="900" text-anchor="start">hash(key) % m</text><text x="120" y="220" font-size="15" fill="#0f172a" font-weight="800" text-anchor="start">&quot;cat&quot; -&gt; 2</text><text x="120" y="250" font-size="15" fill="#0f172a" font-weight="800" text-anchor="start">&quot;act&quot; -&gt; 2</text><path d="M275,220 L410,220" stroke="#2563eb" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="420" y="140" width="300" height="190" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="450" y="172" font-size="16" fill="#0f172a" font-weight="900" text-anchor="start">bucket[2]</text><rect x="455" y="205" width="80" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="495" y="230" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">cat</text><path d="M535,224 L585,224" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="585" y="205" width="80" height="38" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="625" y="230" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">act</text><rect x="720" y="190" width="220" height="86" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="734" y="216" font-size="15" fill="#9a3412" font-weight="800" text-anchor="start">冲突处理</text><text x="734" y="240" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">链地址/开放寻址解决冲突；</text><text x="734" y="258" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">负载因子过高要扩容重哈希。</text>
</svg>
