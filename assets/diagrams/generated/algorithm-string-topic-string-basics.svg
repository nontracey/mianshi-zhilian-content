<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">字符串基础：真实状态图解</title><desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="8"/></filter></defs><rect width="1120" height="680" fill="#f8fafc" rx="18"/><text x="40" y="52" fill="#0f172a" font-size="28" font-weight="900" text-anchor="start">字符串基础：真实状态图解</text><text x="40" y="82" fill="#475569" font-size="15" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text><rect width="56" height="46" x="80" y="170" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="6"/><text x="108" y="199" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">h</text><text x="108" y="236" fill="#64748b" font-size="11" font-weight="500" text-anchor="middle">0</text><rect width="56" height="46" x="136" y="170" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/><text x="164" y="199" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">e</text><text x="164" y="236" fill="#64748b" font-size="11" font-weight="500" text-anchor="middle">1</text><rect width="56" height="46" x="192" y="170" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/><text x="220" y="199" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">l</text><text x="220" y="236" fill="#64748b" font-size="11" font-weight="500" text-anchor="middle">2</text><rect width="56" height="46" x="248" y="170" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/><text x="276" y="199" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">l</text><text x="276" y="236" fill="#64748b" font-size="11" font-weight="500" text-anchor="middle">3</text><rect width="56" height="46" x="304" y="170" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="6"/><text x="332" y="199" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">o</text><text x="332" y="236" fill="#64748b" font-size="11" font-weight="500" text-anchor="middle">4</text><text x="164" y="144" fill="#2563eb" font-size="13" font-weight="800" text-anchor="middle">i</text><path fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" d="M164,149 L164,168"/><text x="276" y="144" fill="#16a34a" font-size="13" font-weight="800" text-anchor="middle">j</text><path fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)" d="M276,149 L276,168"/><rect width="330" height="86" x="500" y="150" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="514" y="176" fill="#9a3412" font-size="15" font-weight="800" text-anchor="start">常见状态</text><text x="514" y="200" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">字符串题常围绕字符扫描、</text><text x="514" y="218" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">窗口、</text><text x="514" y="236" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">频次表、</text><rect width="300" height="70" x="90" y="300" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="12"/><text x="115" y="333" fill="#1d4ed8" font-size="16" font-weight="900" text-anchor="start">freq: h1 e1 l2 o1</text></svg>