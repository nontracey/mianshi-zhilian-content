<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">字符串基础：真实状态图解</title>
  <desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1120" height="680" rx="18" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" fill="#0f172a" font-weight="900" text-anchor="start">字符串基础：真实状态图解</text>
  <text x="40" y="82" font-size="15" fill="#475569" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text>
  <rect x="80" y="170" width="56" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="108" y="199" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">h</text><text x="108" y="236" font-size="11" fill="#64748b" font-weight="500" text-anchor="middle">0</text><rect x="136" y="170" width="56" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="164" y="199" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">e</text><text x="164" y="236" font-size="11" fill="#64748b" font-weight="500" text-anchor="middle">1</text><rect x="192" y="170" width="56" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="220" y="199" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">l</text><text x="220" y="236" font-size="11" fill="#64748b" font-weight="500" text-anchor="middle">2</text><rect x="248" y="170" width="56" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="276" y="199" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">l</text><text x="276" y="236" font-size="11" fill="#64748b" font-weight="500" text-anchor="middle">3</text><rect x="304" y="170" width="56" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="332" y="199" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">o</text><text x="332" y="236" font-size="11" fill="#64748b" font-weight="500" text-anchor="middle">4</text><text x="164" y="144" font-size="13" fill="#2563eb" font-weight="800" text-anchor="middle">i</text><path d="M164,149 L164,168" stroke="#2563eb" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="276" y="144" font-size="13" fill="#16a34a" font-weight="800" text-anchor="middle">j</text><path d="M276,149 L276,168" stroke="#16a34a" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="500" y="150" width="330" height="86" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="514" y="176" font-size="15" fill="#9a3412" font-weight="800" text-anchor="start">常见状态</text><text x="514" y="200" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">字符串题常围绕字符扫描、</text><text x="514" y="218" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">窗口、</text><text x="514" y="236" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">频次表、</text><rect x="90" y="300" width="300" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="115" y="333" font-size="16" fill="#1d4ed8" font-weight="900" text-anchor="start">freq: h1 e1 l2 o1</text>
</svg>
