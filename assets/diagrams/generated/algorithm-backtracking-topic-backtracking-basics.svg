<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">回溯基础：真实状态图解</title>
  <desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1120" height="680" rx="18" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" fill="#0f172a" font-weight="900" text-anchor="start">回溯基础：真实状态图解</text>
  <text x="40" y="82" font-size="15" fill="#475569" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text>
  <path d="M320,117 L190,183" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M320,117 L450,183" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M190,227 L130,293" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M190,227 L250,293" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M450,227 L450,293" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><circle cx="320" cy="95" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="320" y="101" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">path</text><circle cx="190" cy="205" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="190" y="211" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">选择 A</text><circle cx="450" cy="205" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="450" y="211" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">选择 B</text><circle cx="130" cy="315" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="130" y="321" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">继续</text><circle cx="250" cy="315" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="250" y="321" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">撤销</text><circle cx="450" cy="315" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="450" y="321" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">剪枝</text><rect x="610" y="150" width="280" height="86" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="624" y="176" font-size="15" fill="#9a3412" font-weight="800" text-anchor="start">模板动作</text><text x="624" y="200" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">做选择 -&gt; 递归 -&gt; 撤销选择；</text><text x="624" y="218" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">剪枝要在进入无效子树前发生。</text>
</svg>
