<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">LeetCode 347: 前 K 个高频元素：真实状态图解</title><desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="8"/></filter></defs><rect width="1120" height="680" fill="#f8fafc" rx="18"/><text x="40" y="44" fill="#0f172a" font-size="24" font-weight="900" text-anchor="start">LeetCode 347: 前 K 个高频元素：</text><text x="40" y="76" fill="#0f172a" font-size="24" font-weight="900" text-anchor="start">真实状态图解</text><text x="40" y="108" fill="#475569" font-size="15" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text><rect width="220" height="150" x="80" y="145" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="12"/><text x="105" y="178" fill="#1d4ed8" font-size="16" font-weight="900" text-anchor="start">freq map</text><text x="120" y="212" fill="#0f172a" font-size="16" font-weight="800" text-anchor="start">1 -&gt; 3</text><text x="120" y="242" fill="#0f172a" font-size="16" font-weight="800" text-anchor="start">2 -&gt; 2</text><text x="120" y="272" fill="#0f172a" font-size="16" font-weight="800" text-anchor="start">3 -&gt; 1</text><path fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)" d="M315,220 L460,220"/><text x="545" y="141" fill="#7c3aed" font-size="14" font-weight="900" text-anchor="middle">minHeap size=2</text><rect width="150" height="34" x="470" y="189" fill="#fff" stroke="#8b5cf6" stroke-width="2" rx="4"/><text x="545" y="211" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">2:2</text><rect width="150" height="34" x="470" y="155" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" rx="4"/><text x="545" y="177" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">1:3</text><rect width="230" height="86" x="690" y="165" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="704" y="191" fill="#9a3412" font-size="15" font-weight="800" text-anchor="start">保留 TopK</text><text x="704" y="215" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">小根堆按频次排序，</text><text x="704" y="233" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">超过 k 就弹掉频次最低的元素。</text></svg>