<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode 347: 前 K 个高频元素：真实状态图解</title>
  <desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1120" height="680" rx="18" fill="#f8fafc"/>
  <text x="40" y="44" font-size="24" fill="#0f172a" font-weight="900" text-anchor="start">LeetCode 347: 前 K 个高频元素：</text>
  <text x="40" y="76" font-size="24" fill="#0f172a" font-weight="900" text-anchor="start">真实状态图解</text>
  <text x="40" y="108" font-size="15" fill="#475569" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text>
  <rect x="80" y="145" width="220" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="105" y="178" font-size="16" fill="#1d4ed8" font-weight="900" text-anchor="start">freq map</text><text x="120" y="212" font-size="16" fill="#0f172a" font-weight="800" text-anchor="start">1 -&gt; 3</text><text x="120" y="242" font-size="16" fill="#0f172a" font-weight="800" text-anchor="start">2 -&gt; 2</text><text x="120" y="272" font-size="16" fill="#0f172a" font-weight="800" text-anchor="start">3 -&gt; 1</text><path d="M315,220 L460,220" stroke="#475569" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="545" y="141" font-size="14" fill="#7c3aed" font-weight="900" text-anchor="middle">minHeap size=2</text><rect x="470" y="189" width="150" height="34" rx="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/><text x="545" y="211" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">2:2</text><rect x="470" y="155" width="150" height="34" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="545" y="177" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">1:3</text><rect x="690" y="165" width="230" height="86" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="704" y="191" font-size="15" fill="#9a3412" font-weight="800" text-anchor="start">保留 TopK</text><text x="704" y="215" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">小根堆按频次排序，</text><text x="704" y="233" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">超过 k 就弹掉频次最低的元素。</text>
</svg>
