 font-weight="800" text-anchor="middle">prev</text><path d="M482,267 L510,267" stroke="#0284c7" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="518" y="245" width="62" height="44" rx="8" fill="#dcfce7" stroke="#0284c7" stroke-width="2"/><text x="549" y="273" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">3</text><path d="M580,267 L608,267" stroke="#0284c7" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="616" y="245" width="62" height="44" rx="8" fill="#dcfce7" stroke="#0284c7" stroke-width="2"/><text x="647" y="273" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">2</text><path d="M678,267 L706,267" stroke="#0284c7" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="714" y="245" width="62" height="44" rx="8" fill="#dcfce7" stroke="#0284c7" stroke-width="2"/><text x="745" y="273" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">1</text><path d="M776,267 L804,267" stroke="#0284c7" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="812" y="245" width="62" height="44" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="843" y="273" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">next</text><rect x="585" y="125" width="255" height="86" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="599" y="151" font-size="15" fill="#9a3412" font-weight="800" text-anchor="start">关键保存</text><text x="599" y="175" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">先保存 groupNext，</text><text x="599" y="193" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">再在组内反转，</text><text x="599" y="211" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">最后 prev.next 接新头 3，</text>
