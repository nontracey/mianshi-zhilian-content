  <text x="40" y="76" font-size="24" fill="#0f172a" font-weight="900" text-anchor="start">真实状态图解</text>
  <text x="40" y="108" font-size="15" fill="#475569" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text>
