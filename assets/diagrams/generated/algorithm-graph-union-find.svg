anchor="middle">0</text><circle cx="150" cy="410" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="150" y="416" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">1</text><circle cx="290" cy="410" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="290" y="416" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">2</text><circle cx="550" cy="320" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="550" y="326" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">3</text><circle cx="550" cy="410" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="550" y="416" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">4</text><rect x="620" y="145" width="260" height="86" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="634" y="171" font-size="15" fill="#9a3412" font-weight="800" text-anchor="start">路径压缩</text><text x="634" y="195" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">find(x) 沿 parent 找根</text><text x="634" y="213" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">，</text><text x="634" y="231" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">并把路径上节点直接挂到根，</text>
