<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode 125 验证回文串：过滤与对撞比较</title>
  <desc id="desc">展示左右指针跳过非字母数字字符、统一大小写后比较，并在不等时立即返回 false。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#334155"/></marker>
  </defs>
  <rect width="1120" height="680" rx="16" fill="#f8fafc"/>
  <text x="44" y="56" font-size="28" font-weight="800" fill="#0f172a">验证回文串：边过滤边对撞比较</text>
  <text x="44" y="88" font-size="15" fill="#475569">原串 “A man, a plan, a canal: Panama”，只比较字母数字且忽略大小写。</text>

  <text x="70" y="136" font-size="17" font-weight="800" fill="#0f172a">过滤后的有效字符序列</text>
  <g font-size="16" font-weight="800" text-anchor="middle">
    <rect x="70" y="160" width="54" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="97" y="191" fill="#0f172a">a</text>
    <rect x="124" y="160" width="54" height="48" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="151" y="191" fill="#0f172a">m</text>
    <rect x="178" y="160" width="54" height="48" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="205" y="191" fill="#0f172a">a</text>
    <rect x="232" y="160" width="54" height="48" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="259" y="191" fill="#0f172a">n</text>
    <rect x="286" y="160" width="54" height="48" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="313" y="191" fill="#0f172a">a</text>
    <rect x="340" y="160" width="54" height="48" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="367" y="191" fill="#0f172a">p</text>
    <rect x="394" y="160" width="54" height="48" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="421" y="191" fill="#0f172a">l</text>
    <rect x="448" y="160" width="54" height="48" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="475" y="191" fill="#0f172a">a</text>
    <rect x="502" y="160" width="54" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="529" y="191" fill="#0f172a">a</text>
  </g>
  <path d="M97 226 L97 210" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="97" y="250" font-size="14" font-weight="900" text-anchor="middle" fill="#16a34a">L</text>
  <path d="M529 226 L529 210" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="529" y="250" font-size="14" font-weight="900" text-anchor="middle" fill="#dc2626">R</text>
  <path d="M124 284 C230 338 390 338 502 284" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="313" y="358" font-size="15" font-weight="800" text-anchor="middle" fill="#475569">相等则 L++、R--，继续向中间收缩</text>

  <rect x="650" y="132" width="370" height="132" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="674" y="166" font-size="17" font-weight="800" fill="#9a3412">跳过噪声字符</text>
  <text x="674" y="198" font-size="15" fill="#9a3412">空格、逗号、冒号不参与比较。</text>
  <text x="674" y="226" font-size="15" fill="#9a3412">代码中用 while 循环分别推进 L/R。</text>

  <rect x="650" y="310" width="370" height="150" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="674" y="344" font-size="17" font-weight="800" fill="#166534">比较规则</text>
  <text x="674" y="376" font-size="15" fill="#166534">Character.toLowerCase(s[L])</text>
  <text x="674" y="404" font-size="15" fill="#166534">与 Character.toLowerCase(s[R]) 比较。</text>
  <text x="674" y="432" font-size="15" fill="#166534">若不等，立即 false；交错后返回 true。</text>

  <rect x="120" y="520" width="860" height="72" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="146" y="552" font-size="16" font-weight="800" fill="#3730a3">边界</text>
  <text x="218" y="552" font-size="15" fill="#3730a3">全是标点或空白时，两个指针会自然交错，按题意返回 true。</text>
</svg>
