<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">LeetCode 125 验证回文串：过滤与对撞比较</title><desc id="desc">展示左右指针跳过非字母数字字符、统一大小写后比较，并在不等时立即返回 false。</desc><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#334155" d="M1,1 L9,5 L1,9 Z"/></marker></defs><rect width="1120" height="680" fill="#f8fafc" rx="16"/><text x="44" y="56" fill="#0f172a" font-size="28" font-weight="800">验证回文串：边过滤边对撞比较</text><text x="44" y="88" fill="#475569" font-size="15">原串 “A man, a plan, a canal: Panama”，只比较字母数字且忽略大小写。</text><text x="70" y="136" fill="#0f172a" font-size="17" font-weight="800">过滤后的有效字符序列</text><g font-size="16" font-weight="800" text-anchor="middle"><rect width="54" height="48" x="70" y="160" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/><text x="97" y="191" fill="#0f172a">a</text><rect width="54" height="48" x="124" y="160" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="8"/><text x="151" y="191" fill="#0f172a">m</text><rect width="54" height="48" x="178" y="160" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="8"/><text x="205" y="191" fill="#0f172a">a</text><rect width="54" height="48" x="232" y="160" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="8"/><text x="259" y="191" fill="#0f172a">n</text><rect width="54" height="48" x="286" y="160" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="8"/><text x="313" y="191" fill="#0f172a">a</text><rect width="54" height="48" x="340" y="160" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="8"/><text x="367" y="191" fill="#0f172a">p</text><rect width="54" height="48" x="394" y="160" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="8"/><text x="421" y="191" fill="#0f172a">l</text><rect width="54" height="48" x="448" y="160" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="8"/><text x="475" y="191" fill="#0f172a">a</text><rect width="54" height="48" x="502" y="160" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="8"/><text x="529" y="191" fill="#0f172a">a</text></g><path stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)" d="M97 226 L97 210"/><text x="97" y="250" fill="#16a34a" font-size="14" font-weight="900" text-anchor="middle">L</text><path stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)" d="M529 226 L529 210"/><text x="529" y="250" fill="#dc2626" font-size="14" font-weight="900" text-anchor="middle">R</text><path fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" d="M124 284 C230 338 390 338 502 284"/><text x="313" y="358" fill="#475569" font-size="15" font-weight="800" text-anchor="middle">相等则 L++、R--，继续向中间收缩</text><rect width="370" height="132" x="650" y="132" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="674" y="166" fill="#9a3412" font-size="17" font-weight="800">跳过噪声字符</text><text x="674" y="198" fill="#9a3412" font-size="15">空格、逗号、冒号不参与比较。</text><text x="674" y="226" fill="#9a3412" font-size="15">代码中用 while 循环分别推进 L/R。</text><rect width="370" height="150" x="650" y="310" fill="#ecfdf5" stroke="#22c55e" stroke-width="2" rx="12"/><text x="674" y="344" fill="#166534" font-size="17" font-weight="800">比较规则</text><text x="674" y="376" fill="#166534" font-size="15">Character.toLowerCase(s[L])</text><text x="674" y="404" fill="#166534" font-size="15">与 Character.toLowerCase(s[R]) 比较。</text><text x="674" y="432" fill="#166534" font-size="15">若不等，立即 false；交错后返回 true。</text><rect width="860" height="72" x="120" y="520" fill="#eef2ff" stroke="#6366f1" stroke-width="2" rx="12"/><text x="146" y="552" fill="#3730a3" font-size="16" font-weight="800">边界</text><text x="218" y="552" fill="#3730a3" font-size="15">全是标点或空白时，两个指针会自然交错，按题意返回 true。</text></svg>