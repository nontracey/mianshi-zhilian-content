<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">设计题基础：真实状态图解</title><desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="8"/></filter></defs><rect width="1120" height="680" fill="#f8fafc" rx="18"/><text x="40" y="52" fill="#0f172a" font-size="28" font-weight="900" text-anchor="start">设计题基础：真实状态图解</text><text x="40" y="82" fill="#475569" font-size="15" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text><rect width="210" height="150" x="75" y="135" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="12"/><text x="100" y="168" fill="#1d4ed8" font-size="16" font-weight="900" text-anchor="start">HashMap: key -&gt; node</text><text x="110" y="205" fill="#0f172a" font-size="15" font-weight="800" text-anchor="start">2 -&gt; Node(2)</text><text x="110" y="235" fill="#0f172a" font-size="15" font-weight="800" text-anchor="start">5 -&gt; Node(5)</text><text x="110" y="265" fill="#0f172a" font-size="15" font-weight="800" text-anchor="start">7 -&gt; Node(7)</text><path fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" d="M300,210 L390,210"/><rect width="66" height="44" x="390" y="190" fill="#fff" stroke="#0284c7" stroke-width="2" rx="8"/><text x="423" y="218" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">HEAD</text><path fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" d="M456,212 L472,212"/><rect width="66" height="44" x="480" y="190" fill="#dcfce7" stroke="#0284c7" stroke-width="2" rx="8"/><text x="513" y="218" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">7</text><path fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" d="M546,212 L562,212"/><rect width="66" height="44" x="570" y="190" fill="#fff" stroke="#0284c7" stroke-width="2" rx="8"/><text x="603" y="218" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">5</text><path fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" d="M636,212 L652,212"/><rect width="66" height="44" x="660" y="190" fill="#fff" stroke="#0284c7" stroke-width="2" rx="8"/><text x="693" y="218" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">2</text><path fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" d="M726,212 L742,212"/><rect width="66" height="44" x="750" y="190" fill="#fff" stroke="#0284c7" stroke-width="2" rx="8"/><text x="783" y="218" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">TAIL</text><rect width="300" height="104" x="645" y="285" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="665" y="314" fill="#9a3412" font-size="15" font-weight="800" text-anchor="start">访问即移动到头部</text><text x="665" y="340" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">get/put 命中：先从链表摘下节点，</text><text x="665" y="358" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">再插到 HEAD 后，保持最近使用在左。</text><text x="665" y="376" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">容量满时删除 TAIL 前的最久未用节点。</text></svg>