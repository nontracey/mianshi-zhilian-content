<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">设计题基础：真实状态图解</title>
  <desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1120" height="680" rx="18" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" fill="#0f172a" font-weight="900" text-anchor="start">设计题基础：真实状态图解</text>
  <text x="40" y="82" font-size="15" fill="#475569" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text>
  <rect x="75" y="135" width="210" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="100" y="168" font-size="16" fill="#1d4ed8" font-weight="900" text-anchor="start">HashMap: key -&gt; node</text><text x="110" y="205" font-size="15" fill="#0f172a" font-weight="800" text-anchor="start">2 -&gt; Node(2)</text><text x="110" y="235" font-size="15" fill="#0f172a" font-weight="800" text-anchor="start">5 -&gt; Node(5)</text><text x="110" y="265" font-size="15" fill="#0f172a" font-weight="800" text-anchor="start">7 -&gt; Node(7)</text><path d="M300,210 L390,210" stroke="#2563eb" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="390" y="190" width="66" height="44" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="423" y="218" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">HEAD</text><path d="M456,212 L472,212" stroke="#0284c7" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="480" y="190" width="66" height="44" rx="8" fill="#dcfce7" stroke="#0284c7" stroke-width="2"/><text x="513" y="218" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">7</text><path d="M546,212 L562,212" stroke="#0284c7" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="570" y="190" width="66" height="44" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="603" y="218" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">5</text><path d="M636,212 L652,212" stroke="#0284c7" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="660" y="190" width="66" height="44" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="693" y="218" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">2</text><path d="M726,212 L742,212" stroke="#0284c7" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="750" y="190" width="66" height="44" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="783" y="218" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">TAIL</text><rect x="645" y="285" width="300" height="104" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="665" y="314" font-size="15" fill="#9a3412" font-weight="800" text-anchor="start">访问即移动到头部</text><text x="665" y="340" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">get/put 命中：先从链表摘下节点，</text><text x="665" y="358" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">再插到 HEAD 后，保持最近使用在左。</text><text x="665" y="376" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">容量满时删除 TAIL 前的最久未用节点。</text>
</svg>
