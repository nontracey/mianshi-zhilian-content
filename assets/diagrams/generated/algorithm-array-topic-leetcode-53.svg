<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode 53 最大子数组和：Kadane 状态转移</title>
  <desc id="desc">展示 cur 表示以 i 结尾的最大和，best 表示全局最大值，以及何时延续或重启。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#334155"/></marker>
  </defs>
  <rect width="1120" height="680" rx="16" fill="#f8fafc"/>
  <text x="44" y="56" font-size="28" font-weight="800" fill="#0f172a">最大子数组和：cur 是“必须以 i 结尾”的状态</text>
  <text x="44" y="88" font-size="15" fill="#475569">nums=[-2,1,-3,4,-1,2,1,-5,4]；最佳连续区间是 [4,-1,2,1]，和为 6。</text>

  <text x="70" y="136" font-size="17" font-weight="800" fill="#0f172a">原数组</text>
  <g>
    <rect x="70" y="158" width="64" height="52" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="134" y="158" width="64" height="52" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="198" y="158" width="64" height="52" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="262" y="158" width="64" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="326" y="158" width="64" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="390" y="158" width="64" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="454" y="158" width="64" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="518" y="158" width="64" height="52" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="582" y="158" width="64" height="52" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="102" y="190" font-size="17" font-weight="800" text-anchor="middle" fill="#0f172a">-2</text>
    <text x="166" y="190" font-size="17" font-weight="800" text-anchor="middle" fill="#0f172a">1</text>
    <text x="230" y="190" font-size="17" font-weight="800" text-anchor="middle" fill="#0f172a">-3</text>
    <text x="294" y="190" font-size="17" font-weight="800" text-anchor="middle" fill="#166534">4</text>
    <text x="358" y="190" font-size="17" font-weight="800" text-anchor="middle" fill="#166534">-1</text>
    <text x="422" y="190" font-size="17" font-weight="800" text-anchor="middle" fill="#166534">2</text>
    <text x="486" y="190" font-size="17" font-weight="800" text-anchor="middle" fill="#166534">1</text>
    <text x="550" y="190" font-size="17" font-weight="800" text-anchor="middle" fill="#0f172a">-5</text>
    <text x="614" y="190" font-size="17" font-weight="800" text-anchor="middle" fill="#0f172a">4</text>
  </g>

  <text x="70" y="280" font-size="17" font-weight="800" fill="#0f172a">cur = max(nums[i], cur + nums[i])</text>
  <g>
    <rect x="70" y="302" width="64" height="52" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <rect x="134" y="302" width="64" height="52" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="198" y="302" width="64" height="52" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <rect x="262" y="302" width="64" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="326" y="302" width="64" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="390" y="302" width="64" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="454" y="302" width="64" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="518" y="302" width="64" height="52" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="582" y="302" width="64" height="52" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="102" y="334" font-size="17" font-weight="800" text-anchor="middle" fill="#991b1b">-2</text>
    <text x="166" y="334" font-size="17" font-weight="800" text-anchor="middle" fill="#0f172a">1</text>
    <text x="230" y="334" font-size="17" font-weight="800" text-anchor="middle" fill="#991b1b">-2</text>
    <text x="294" y="334" font-size="17" font-weight="800" text-anchor="middle" fill="#166534">4</text>
    <text x="358" y="334" font-size="17" font-weight="800" text-anchor="middle" fill="#166534">3</text>
    <text x="422" y="334" font-size="17" font-weight="800" text-anchor="middle" fill="#166534">5</text>
    <text x="486" y="334" font-size="17" font-weight="800" text-anchor="middle" fill="#166534">6</text>
    <text x="550" y="334" font-size="17" font-weight="800" text-anchor="middle" fill="#0f172a">1</text>
    <text x="614" y="334" font-size="17" font-weight="800" text-anchor="middle" fill="#0f172a">5</text>
  </g>
  <path d="M230 362 C252 400 274 400 294 362" stroke="#f97316" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="262" y="428" font-size="14" text-anchor="middle" font-weight="800" fill="#9a3412">cur+x &lt; x，重启</text>

  <rect x="720" y="150" width="330" height="124" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="742" y="184" font-size="17" font-weight="800" fill="#166534">best 更新</text>
  <text x="742" y="216" font-size="15" fill="#166534">扫描到 i=6 时 cur=6</text>
  <text x="742" y="244" font-size="15" fill="#166534">best=max(previous, 6)=6</text>
  <path d="M646 328 L718 220" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="720" y="318" width="330" height="152" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="742" y="352" font-size="17" font-weight="800" fill="#3730a3">边界提醒</text>
  <text x="742" y="384" font-size="15" fill="#3730a3">答案不能初始化为 0：全负数组也要取最大负数。</text>
  <text x="742" y="414" font-size="15" fill="#3730a3">若要返回区间，重启时记录候选 start。</text>
  <text x="742" y="444" font-size="15" fill="#3730a3">更新 best 时固化 start/end。</text>

  <rect x="150" y="530" width="820" height="70" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="174" y="560" font-size="16" font-weight="800" fill="#9a3412">核心区别</text>
  <text x="278" y="560" font-size="15" fill="#9a3412">cur 是局部状态，best 是全局答案；把两者混掉是这题最常见错误。</text>
</svg>
