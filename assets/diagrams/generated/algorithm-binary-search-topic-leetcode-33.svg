<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" aria-labelledby="title desc" role="img" viewBox="0 0 980 520"><title id="title">搜索旋转排序数组的有序半区判断</title><desc id="desc">用 nums=[4,5,6,7,0,1,2], target=0 展示两轮二分。</desc><rect width="980" height="520" fill="#f8fafc" rx="18"/><text x="40" y="48" fill="#0f172a" font-size="24" font-weight="700">LeetCode 33：先判断哪一半有序</text><text x="40" y="78" fill="#475569" font-size="14">旋转数组被 mid 切开后，至少有一侧仍然有序；只在有序侧判断 target 是否落入范围。</text><g font-family="system-ui, sans-serif" text-anchor="middle"><g><text x="0" y="-24" fill="#0f172a" font-size="16" font-weight="700" text-anchor="start" transform="translate(70 125)">Round 1: left=0, mid=3, right=6</text><g transform="translate(70 125)"><rect width="78" height="52" x="0" y="0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="39" y="31" font-size="18">4</text><rect width="78" height="52" x="78" y="0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="117" y="31" font-size="18">5</text><rect width="78" height="52" x="156" y="0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="195" y="31" font-size="18">6</text><rect width="78" height="52" x="234" y="0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="273" y="31" font-size="18" font-weight="700">7</text><rect width="78" height="52" x="312" y="0" fill="#fee2e2" stroke="#ef4444"/><text x="351" y="31" font-size="18">0</text><rect width="78" height="52" x="390" y="0" fill="#fee2e2" stroke="#ef4444"/><text x="429" y="31" font-size="18">1</text><rect width="78" height="52" x="468" y="0" fill="#fee2e2" stroke="#ef4444"/><text x="507" y="31" font-size="18">2</text></g><text x="273" y="82" fill="#166534" font-size="14" transform="translate(70 125)">nums[left] &lt;= nums[mid]，左半 [4,5,6,7] 有序</text><text x="273" y="110" fill="#991b1b" font-size="14" transform="translate(70 125)">target=0 不在 [4,7) 内，所以丢弃左半，left=mid+1</text></g><g transform="translate(70 310)"><text x="0" y="-24" fill="#0f172a" font-size="16" font-weight="700" text-anchor="start">Round 2: left=4, mid=5, right=6</text><rect width="78" height="52" x="312" y="0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="351" y="31" font-size="18">0</text><rect width="78" height="52" x="390" y="0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="429" y="31" font-size="18" font-weight="700">1</text><rect width="78" height="52" x="468" y="0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="507" y="31" font-size="18">2</text><text x="429" y="82" fill="#166534" font-size="14">左半 [0,1] 有序，target=0 落在 [0,1) 内</text><text x="429" y="110" fill="#991b1b" font-size="14">right=mid-1 后只剩 index=4，下一轮命中 nums[4]=0</text></g></g></svg>