<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">链表基础：真实状态图解</title><desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="8"/></filter></defs><rect width="1120" height="680" fill="#f8fafc" rx="18"/><text x="40" y="52" fill="#0f172a" font-size="28" font-weight="900" text-anchor="start">链表基础：真实状态图解</text><text x="40" y="82" fill="#475569" font-size="15" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text><rect width="64" height="44" x="100" y="180" fill="#fff" stroke="#0284c7" stroke-width="2" rx="8"/><text x="132" y="208" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">head</text><path fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" d="M164,202 L192,202"/><rect width="64" height="44" x="200" y="180" fill="#fff" stroke="#0284c7" stroke-width="2" rx="8"/><text x="232" y="208" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">10</text><path fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" d="M264,202 L292,202"/><rect width="64" height="44" x="300" y="180" fill="#fff" stroke="#0284c7" stroke-width="2" rx="8"/><text x="332" y="208" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">20</text><path fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" d="M364,202 L392,202"/><text x="332" y="168" fill="#2563eb" font-size="13" font-weight="800" text-anchor="middle">curr</text><rect width="64" height="44" x="400" y="180" fill="#fff" stroke="#0284c7" stroke-width="2" rx="8"/><text x="432" y="208" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">30</text><path fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" d="M464,202 L492,202"/><rect width="64" height="44" x="500" y="180" fill="#fff" stroke="#0284c7" stroke-width="2" rx="8"/><text x="532" y="208" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">null</text><rect width="290" height="86" x="590" y="155" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="604" y="181" fill="#9a3412" font-size="15" font-weight="800" text-anchor="start">链表特点</text><text x="604" y="205" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">节点分散存储，</text><text x="604" y="223" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">通过 next 串起来；</text><text x="604" y="241" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">插入删除改指针快，</text><path fill="none" stroke="#dc2626" stroke-dasharray="5 5" stroke-width="2.5" marker-end="url(#arrow)" d="M292,250 C315,310 390,310 400,250"/><text x="260" y="330" fill="#dc2626" font-size="15" font-weight="900" text-anchor="start">删除 20：prev.next = curr.next</text></svg>