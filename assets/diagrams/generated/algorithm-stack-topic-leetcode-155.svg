<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">LeetCode 155: 最小栈：真实状态图解</title><desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="8"/></filter></defs><rect width="1120" height="680" fill="#f8fafc" rx="18"/><text x="40" y="52" fill="#0f172a" font-size="28" font-weight="900" text-anchor="start">LeetCode 155: 最小栈：真实状态图解</text><text x="40" y="82" fill="#475569" font-size="15" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text><text x="225" y="136" fill="#7c3aed" font-size="14" font-weight="900" text-anchor="middle">data stack</text><rect width="130" height="34" x="160" y="252" fill="#fff" stroke="#8b5cf6" stroke-width="2" rx="4"/><text x="225" y="274" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">2</text><rect width="130" height="34" x="160" y="218" fill="#fff" stroke="#8b5cf6" stroke-width="2" rx="4"/><text x="225" y="240" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">0</text><rect width="130" height="34" x="160" y="184" fill="#fff" stroke="#8b5cf6" stroke-width="2" rx="4"/><text x="225" y="206" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">3</text><rect width="130" height="34" x="160" y="150" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" rx="4"/><text x="225" y="172" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">0</text><text x="455" y="136" fill="#16a34a" font-size="14" font-weight="900" text-anchor="middle">min stack</text><rect width="130" height="34" x="390" y="218" fill="#fff" stroke="#8b5cf6" stroke-width="2" rx="4"/><text x="455" y="240" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">2</text><rect width="130" height="34" x="390" y="184" fill="#fff" stroke="#8b5cf6" stroke-width="2" rx="4"/><text x="455" y="206" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">0</text><rect width="130" height="34" x="390" y="150" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" rx="4"/><text x="455" y="172" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">0</text><path fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)" d="M300,245 L390,245"/><rect width="280" height="86" x="620" y="165" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="634" y="191" fill="#9a3412" font-size="15" font-weight="800" text-anchor="start">同步维护最小值</text><text x="634" y="215" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">push(x) 时 minStack</text><text x="634" y="233" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">压入 min(x, 当前最小)；</text><text x="634" y="251" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">pop 时两个栈一起弹。</text></svg>