<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">数组基础：连续内存、随机访问与搬移成本</title><desc id="desc">展示数组地址计算、随机访问、中间插入导致的后缀搬移，以及前缀和对区间查询的复用。</desc><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#334155" d="M1,1 L9,5 L1,9 Z"/></marker></defs><rect width="1120" height="680" fill="#f8fafc" rx="16"/><text x="44" y="56" fill="#0f172a" font-size="28" font-weight="800">数组基础：从地址到搬移</text><text x="44" y="88" fill="#475569" font-size="15">连续内存让下标访问是一次地址计算；中间插入/删除要移动后缀元素。</text><text x="64" y="132" fill="#0f172a" font-size="17" font-weight="800">1. 连续内存与随机访问</text><rect width="92" height="56" x="64" y="156" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="8"/><rect width="92" height="56" x="156" y="156" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="8"/><rect width="92" height="56" x="248" y="156" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/><rect width="92" height="56" x="340" y="156" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="8"/><rect width="92" height="56" x="432" y="156" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="8"/><text x="110" y="188" fill="#0f172a" font-size="18" font-weight="800" text-anchor="middle">A</text><text x="202" y="188" fill="#0f172a" font-size="18" font-weight="800" text-anchor="middle">B</text><text x="294" y="188" fill="#0f172a" font-size="18" font-weight="800" text-anchor="middle">C</text><text x="386" y="188" fill="#0f172a" font-size="18" font-weight="800" text-anchor="middle">D</text><text x="478" y="188" fill="#0f172a" font-size="18" font-weight="800" text-anchor="middle">E</text><text x="110" y="232" fill="#64748b" font-size="13" text-anchor="middle">i=0</text><text x="202" y="232" fill="#64748b" font-size="13" text-anchor="middle">i=1</text><text x="294" y="232" fill="#64748b" font-size="13" text-anchor="middle">i=2</text><text x="386" y="232" fill="#64748b" font-size="13" text-anchor="middle">i=3</text><text x="478" y="232" fill="#64748b" font-size="13" text-anchor="middle">i=4</text><path fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)" d="M294 146 L294 116 L604 116"/><rect width="390" height="88" x="620" y="92" fill="#ecfdf5" stroke="#16a34a" stroke-width="2" rx="12"/><text x="640" y="122" fill="#166534" font-size="16" font-weight="800">arr[2] = *(base + 2 * elementSize)</text><text x="640" y="150" fill="#166534" font-size="14">不需要扫描前两个元素，所以访问复杂度是 O(1)。</text><text x="64" y="302" fill="#0f172a" font-size="17" font-weight="800">2. index=2 插入 X：必须从尾部向右搬移</text><rect width="78" height="52" x="64" y="326" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="8"/><rect width="78" height="52" x="142" y="326" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="8"/><rect width="78" height="52" x="220" y="326" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/><rect width="78" height="52" x="298" y="326" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="8"/><rect width="78" height="52" x="376" y="326" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="8"/><rect width="78" height="52" x="454" y="326" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="8"/><text x="103" y="358" fill="#0f172a" font-size="17" font-weight="800" text-anchor="middle">A</text><text x="181" y="358" fill="#0f172a" font-size="17" font-weight="800" text-anchor="middle">B</text><text x="259" y="358" fill="#92400e" font-size="17" font-weight="800" text-anchor="middle">X</text><text x="337" y="358" fill="#0f172a" font-size="17" font-weight="800" text-anchor="middle">C</text><text x="415" y="358" fill="#0f172a" font-size="17" font-weight="800" text-anchor="middle">D</text><text x="493" y="358" fill="#0f172a" font-size="17" font-weight="800" text-anchor="middle">E</text><path fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#arrow)" d="M298 398 C328 436 366 436 376 398"/><path fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#arrow)" d="M376 398 C406 436 444 436 454 398"/><path fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#arrow)" d="M454 398 C484 436 522 436 532 398"/><rect width="390" height="112" x="620" y="312" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="640" y="344" fill="#9a3412" font-size="16" font-weight="800">搬移不变量</text><text x="640" y="372" fill="#9a3412" font-size="14">从后往前移动，先腾出 index=2 的位置。</text><text x="640" y="398" fill="#9a3412" font-size="14">移动元素数量与后缀长度相关，最坏 O(n)。</text><text x="64" y="492" fill="#0f172a" font-size="17" font-weight="800">3. 区间问题：用预处理避免重复扫描</text><rect width="156" height="56" x="64" y="518" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" rx="10"/><text x="142" y="550" fill="#312e81" font-size="15" font-weight="800" text-anchor="middle">nums: 2 1 3 4</text><path stroke="#334155" stroke-width="3" marker-end="url(#arrow)" d="M230 546 L350 546"/><rect width="214" height="56" x="364" y="518" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="10"/><text x="471" y="550" fill="#075985" font-size="15" font-weight="800" text-anchor="middle">prefix: 0 2 3 6 10</text><path stroke="#334155" stroke-width="3" marker-end="url(#arrow)" d="M588 546 L708 546"/><rect width="286" height="76" x="724" y="508" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="12"/><text x="744" y="538" fill="#166534" font-size="15" font-weight="800">sum[1..3] = prefix[4] - prefix[1]</text><text x="744" y="564" fill="#166534" font-size="14">把多次区间求和从 O(n) 降到 O(1)。</text></svg>