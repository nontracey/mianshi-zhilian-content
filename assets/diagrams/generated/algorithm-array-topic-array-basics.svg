<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">数组基础：连续内存、随机访问与搬移成本</title>
  <desc id="desc">展示数组地址计算、随机访问、中间插入导致的后缀搬移，以及前缀和对区间查询的复用。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#334155"/></marker>
  </defs>
  <rect width="1120" height="680" rx="16" fill="#f8fafc"/>
  <text x="44" y="56" font-size="28" font-weight="800" fill="#0f172a">数组基础：从地址到搬移</text>
  <text x="44" y="88" font-size="15" fill="#475569">连续内存让下标访问是一次地址计算；中间插入/删除要移动后缀元素。</text>

  <text x="64" y="132" font-size="17" font-weight="800" fill="#0f172a">1. 连续内存与随机访问</text>
  <rect x="64" y="156" width="92" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="156" y="156" width="92" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="248" y="156" width="92" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="340" y="156" width="92" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="432" y="156" width="92" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="188" font-size="18" font-weight="800" text-anchor="middle" fill="#0f172a">A</text>
  <text x="202" y="188" font-size="18" font-weight="800" text-anchor="middle" fill="#0f172a">B</text>
  <text x="294" y="188" font-size="18" font-weight="800" text-anchor="middle" fill="#0f172a">C</text>
  <text x="386" y="188" font-size="18" font-weight="800" text-anchor="middle" fill="#0f172a">D</text>
  <text x="478" y="188" font-size="18" font-weight="800" text-anchor="middle" fill="#0f172a">E</text>
  <text x="110" y="232" font-size="13" text-anchor="middle" fill="#64748b">i=0</text>
  <text x="202" y="232" font-size="13" text-anchor="middle" fill="#64748b">i=1</text>
  <text x="294" y="232" font-size="13" text-anchor="middle" fill="#64748b">i=2</text>
  <text x="386" y="232" font-size="13" text-anchor="middle" fill="#64748b">i=3</text>
  <text x="478" y="232" font-size="13" text-anchor="middle" fill="#64748b">i=4</text>
  <path d="M294 146 L294 116 L604 116" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="620" y="92" width="390" height="88" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="122" font-size="16" font-weight="800" fill="#166534">arr[2] = *(base + 2 * elementSize)</text>
  <text x="640" y="150" font-size="14" fill="#166534">不需要扫描前两个元素，所以访问复杂度是 O(1)。</text>

  <text x="64" y="302" font-size="17" font-weight="800" fill="#0f172a">2. index=2 插入 X：必须从尾部向右搬移</text>
  <rect x="64" y="326" width="78" height="52" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="142" y="326" width="78" height="52" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="220" y="326" width="78" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="298" y="326" width="78" height="52" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="376" y="326" width="78" height="52" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="454" y="326" width="78" height="52" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="103" y="358" font-size="17" font-weight="800" text-anchor="middle" fill="#0f172a">A</text>
  <text x="181" y="358" font-size="17" font-weight="800" text-anchor="middle" fill="#0f172a">B</text>
  <text x="259" y="358" font-size="17" font-weight="800" text-anchor="middle" fill="#92400e">X</text>
  <text x="337" y="358" font-size="17" font-weight="800" text-anchor="middle" fill="#0f172a">C</text>
  <text x="415" y="358" font-size="17" font-weight="800" text-anchor="middle" fill="#0f172a">D</text>
  <text x="493" y="358" font-size="17" font-weight="800" text-anchor="middle" fill="#0f172a">E</text>
  <path d="M298 398 C328 436 366 436 376 398" stroke="#f97316" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M376 398 C406 436 444 436 454 398" stroke="#f97316" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M454 398 C484 436 522 436 532 398" stroke="#f97316" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="620" y="312" width="390" height="112" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="640" y="344" font-size="16" font-weight="800" fill="#9a3412">搬移不变量</text>
  <text x="640" y="372" font-size="14" fill="#9a3412">从后往前移动，先腾出 index=2 的位置。</text>
  <text x="640" y="398" font-size="14" fill="#9a3412">移动元素数量与后缀长度相关，最坏 O(n)。</text>

  <text x="64" y="492" font-size="17" font-weight="800" fill="#0f172a">3. 区间问题：用预处理避免重复扫描</text>
  <rect x="64" y="518" width="156" height="56" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="142" y="550" font-size="15" font-weight="800" text-anchor="middle" fill="#312e81">nums: 2 1 3 4</text>
  <path d="M230 546 L350 546" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="364" y="518" width="214" height="56" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="471" y="550" font-size="15" font-weight="800" text-anchor="middle" fill="#075985">prefix: 0 2 3 6 10</text>
  <path d="M588 546 L708 546" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="724" y="508" width="286" height="76" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="744" y="538" font-size="15" font-weight="800" fill="#166534">sum[1..3] = prefix[4] - prefix[1]</text>
  <text x="744" y="564" font-size="14" fill="#166534">把多次区间求和从 O(n) 降到 O(1)。</text>
</svg>
