<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">栈基础：真实状态图解</title>
  <desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1120" height="680" rx="18" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" fill="#0f172a" font-weight="900" text-anchor="start">栈基础：真实状态图解</text>
  <text x="40" y="82" font-size="15" fill="#475569" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text>
  <text x="250" y="136" font-size="14" fill="#7c3aed" font-weight="900" text-anchor="middle">push A,B,C</text><rect x="180" y="218" width="140" height="34" rx="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/><text x="250" y="240" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">A</text><rect x="180" y="184" width="140" height="34" rx="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/><text x="250" y="206" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">B</text><rect x="180" y="150" width="140" height="34" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="250" y="172" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">C</text><path d="M330,205 L430,205" stroke="#2563eb" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="500" y="170" font-size="14" fill="#7c3aed" font-weight="900" text-anchor="middle">pop -&gt; C</text><rect x="430" y="218" width="140" height="34" rx="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/><text x="500" y="240" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">A</text><rect x="430" y="184" width="140" height="34" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="500" y="206" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">B</text><rect x="650" y="170" width="260" height="86" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="664" y="196" font-size="15" fill="#9a3412" font-weight="800" text-anchor="start">后进先出</text><text x="664" y="220" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">栈顶是唯一可见操作点，</text><text x="664" y="238" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">函数调用栈、</text><text x="664" y="256" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">括号匹配、</text>
</svg>
