<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">栈基础：真实状态图解</title><desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="8"/></filter></defs><rect width="1120" height="680" fill="#f8fafc" rx="18"/><text x="40" y="52" fill="#0f172a" font-size="28" font-weight="900" text-anchor="start">栈基础：真实状态图解</text><text x="40" y="82" fill="#475569" font-size="15" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text><text x="250" y="136" fill="#7c3aed" font-size="14" font-weight="900" text-anchor="middle">push A,B,C</text><rect width="140" height="34" x="180" y="218" fill="#fff" stroke="#8b5cf6" stroke-width="2" rx="4"/><text x="250" y="240" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">A</text><rect width="140" height="34" x="180" y="184" fill="#fff" stroke="#8b5cf6" stroke-width="2" rx="4"/><text x="250" y="206" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">B</text><rect width="140" height="34" x="180" y="150" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" rx="4"/><text x="250" y="172" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">C</text><path fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" d="M330,205 L430,205"/><text x="500" y="170" fill="#7c3aed" font-size="14" font-weight="900" text-anchor="middle">pop -&gt; C</text><rect width="140" height="34" x="430" y="218" fill="#fff" stroke="#8b5cf6" stroke-width="2" rx="4"/><text x="500" y="240" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">A</text><rect width="140" height="34" x="430" y="184" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" rx="4"/><text x="500" y="206" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">B</text><rect width="260" height="86" x="650" y="170" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="664" y="196" fill="#9a3412" font-size="15" font-weight="800" text-anchor="start">后进先出</text><text x="664" y="220" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">栈顶是唯一可见操作点，</text><text x="664" y="238" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">函数调用栈、</text><text x="664" y="256" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">括号匹配、</text></svg>