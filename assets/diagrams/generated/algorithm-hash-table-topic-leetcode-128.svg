<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">LeetCode 128: 最长连续序列：真实状态图解</title><desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="8"/></filter></defs><rect width="1120" height="680" fill="#f8fafc" rx="18"/><text x="40" y="52" fill="#0f172a" font-size="28" font-weight="900" text-anchor="start">LeetCode 128: 最长连续序列：真实状态图解</text><text x="40" y="82" fill="#475569" font-size="15" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text><rect width="64" height="46" x="70" y="160" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="6"/><text x="102" y="189" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">100</text><text x="102" y="226" fill="#64748b" font-size="11" font-weight="500" text-anchor="middle">0</text><rect width="64" height="46" x="134" y="160" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/><text x="166" y="189" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">4</text><text x="166" y="226" fill="#64748b" font-size="11" font-weight="500" text-anchor="middle">1</text><rect width="64" height="46" x="198" y="160" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="6"/><text x="230" y="189" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">200</text><text x="230" y="226" fill="#64748b" font-size="11" font-weight="500" text-anchor="middle">2</text><rect width="64" height="46" x="262" y="160" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/><text x="294" y="189" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">1</text><text x="294" y="226" fill="#64748b" font-size="11" font-weight="500" text-anchor="middle">3</text><rect width="64" height="46" x="326" y="160" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/><text x="358" y="189" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">3</text><text x="358" y="226" fill="#64748b" font-size="11" font-weight="500" text-anchor="middle">4</text><rect width="64" height="46" x="390" y="160" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/><text x="422" y="189" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">2</text><text x="422" y="226" fill="#64748b" font-size="11" font-weight="500" text-anchor="middle">5</text><rect width="330" height="70" x="90" y="290" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="12"/><text x="115" y="322" fill="#1d4ed8" font-size="16" font-weight="900" text-anchor="start">set 包含 1,2,3,4,100,200</text><rect width="300" height="86" x="560" y="160" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="574" y="186" fill="#9a3412" font-size="15" font-weight="800" text-anchor="start">只从序列起点扩张</text><text x="574" y="210" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">只有 x-1 不在 set 时才从 x</text><text x="574" y="228" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">开始数，</text><text x="574" y="246" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">否则会重复扫描。</text></svg>