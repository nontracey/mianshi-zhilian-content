t 包含 1,2,3,4,100,200</text><rect x="560" y="160" width="300" height="86" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="574" y="186" font-size="15" fill="#9a3412" font-weight="800" text-anchor="start">只从序列起点扩张</text><text x="574" y="210" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">只有 x-1 不在 set 时才从 x</text><text x="574" y="228" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start"> 开始数，</text><text x="574" y="246" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">否则会重复扫描。</text>
