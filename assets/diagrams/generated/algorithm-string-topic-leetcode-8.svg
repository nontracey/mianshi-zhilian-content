<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode 8: 字符串转换整数 (atoi)：真实状态图解</title>
  <desc id="desc">用输入字符带、状态流、指针推进和溢出判断说明 atoi 的解析过程。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
  </defs>
  <rect width="1120" height="680" rx="18" fill="#f8fafc"/>
  <text x="40" y="44" font-size="24" fill="#0f172a" font-weight="900" text-anchor="start">LeetCode 8: 字符串转换整数 (atoi)：</text>
  <text x="40" y="76" font-size="24" fill="#0f172a" font-weight="900" text-anchor="start">真实状态图解</text>
  <text x="40" y="108" font-size="15" fill="#475569" font-weight="500" text-anchor="start">输入示例 "  -42 with words"，看清空格、符号、数字和停止条件。</text>

  <text x="70" y="145" font-size="16" fill="#1d4ed8" font-weight="900" text-anchor="start">1. 输入字符带与指针</text>
  <rect x="70" y="165" width="52" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="96" y="194" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">空格</text><text x="96" y="234" font-size="12" fill="#475569" text-anchor="middle">i=0</text>
  <rect x="132" y="165" width="52" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="158" y="194" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">空格</text><text x="158" y="234" font-size="12" fill="#475569" text-anchor="middle">i=1</text>
  <rect x="194" y="165" width="52" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="220" y="194" font-size="18" fill="#0f172a" font-weight="900" text-anchor="middle">-</text><text x="220" y="234" font-size="12" fill="#475569" text-anchor="middle">i=2</text>
  <rect x="256" y="165" width="52" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="282" y="194" font-size="18" fill="#0f172a" font-weight="900" text-anchor="middle">4</text><text x="282" y="234" font-size="12" fill="#475569" text-anchor="middle">i=3</text>
  <rect x="318" y="165" width="52" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="344" y="194" font-size="18" fill="#0f172a" font-weight="900" text-anchor="middle">2</text><text x="344" y="234" font-size="12" fill="#475569" text-anchor="middle">i=4</text>
  <rect x="380" y="165" width="70" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="415" y="194" font-size="16" fill="#0f172a" font-weight="900" text-anchor="middle">w</text><text x="415" y="234" font-size="12" fill="#475569" text-anchor="middle">i=5 停</text>

  <text x="520" y="145" font-size="16" fill="#166534" font-weight="900" text-anchor="start">2. 状态流不是套图</text>
  <rect x="520" y="168" width="112" height="44" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="576" y="196" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">skip space</text>
  <path d="M632,190 L674,190" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="684" y="168" width="96" height="44" rx="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="732" y="196" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">sign=-1</text>
  <path d="M780,190 L822,190" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="832" y="168" width="116" height="44" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="890" y="196" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">build num</text>
  <path d="M890,212 L890,252" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="828" y="262" width="124" height="44" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="890" y="290" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle">meet letter stop</text>

  <rect x="70" y="285" width="390" height="190" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="316" font-size="16" fill="#0f172a" font-weight="900" text-anchor="start">3. 指针推进表</text>
  <text x="92" y="348" font-size="13" fill="#475569" font-weight="800" text-anchor="start">读到的字符</text><text x="210" y="348" font-size="13" fill="#475569" font-weight="800" text-anchor="start">动作</text><text x="350" y="348" font-size="13" fill="#475569" font-weight="800" text-anchor="start">状态</text>
  <line x1="90" y1="360" x2="440" y2="360" stroke="#e2e8f0" stroke-width="2"/>
  <text x="92" y="386" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">空格, 空格</text><text x="210" y="386" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">持续跳过</text><text x="350" y="386" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">未开始</text>
  <text x="92" y="418" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">-</text><text x="210" y="418" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">记录 sign=-1</text><text x="350" y="418" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">等数字</text>
  <text x="92" y="450" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">4, 2</text><text x="210" y="450" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">ans = ans*10+d</text><text x="350" y="450" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">ans=42</text>

  <rect x="520" y="340" width="360" height="135" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="540" y="370" font-size="16" fill="#9a3412" font-weight="900" text-anchor="start">4. 每加一位先做溢出判断</text>
  <text x="540" y="402" font-size="13" fill="#7c2d12" font-weight="700" text-anchor="start">如果 ans &gt; INT_MAX/10，提前返回边界值。</text>
  <text x="540" y="430" font-size="13" fill="#7c2d12" font-weight="700" text-anchor="start">本例没有溢出：sign * ans = -42。</text>
  <text x="540" y="458" font-size="13" fill="#7c2d12" font-weight="700" text-anchor="start">遇到 w 停止，后面的 "ith words" 不再读取。</text>

  <path d="M415,213 C470,250 510,280 560,340" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
</svg>
