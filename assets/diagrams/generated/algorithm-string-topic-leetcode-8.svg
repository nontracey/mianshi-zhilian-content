<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">LeetCode 8: 字符串转换整数 (atoi)：真实状态图解</title><desc id="desc">用输入字符带、状态流、指针推进和溢出判断说明 atoi 的解析过程。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker></defs><rect width="1120" height="680" fill="#f8fafc" rx="18"/><text x="40" y="44" fill="#0f172a" font-size="24" font-weight="900" text-anchor="start">LeetCode 8: 字符串转换整数 (atoi)：</text><text x="40" y="76" fill="#0f172a" font-size="24" font-weight="900" text-anchor="start">真实状态图解</text><text x="40" y="108" fill="#475569" font-size="15" font-weight="500" text-anchor="start">输入示例 &quot; -42 with words&quot;，看清空格、符号、数字和停止条件。</text><text x="70" y="145" fill="#1d4ed8" font-size="16" font-weight="900" text-anchor="start">1. 输入字符带与指针</text><rect width="52" height="48" x="70" y="165" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="8"/><text x="96" y="194" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">空格</text><text x="96" y="234" fill="#475569" font-size="12" text-anchor="middle">i=0</text><rect width="52" height="48" x="132" y="165" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="8"/><text x="158" y="194" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">空格</text><text x="158" y="234" fill="#475569" font-size="12" text-anchor="middle">i=1</text><rect width="52" height="48" x="194" y="165" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/><text x="220" y="194" fill="#0f172a" font-size="18" font-weight="900" text-anchor="middle">-</text><text x="220" y="234" fill="#475569" font-size="12" text-anchor="middle">i=2</text><rect width="52" height="48" x="256" y="165" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/><text x="282" y="194" fill="#0f172a" font-size="18" font-weight="900" text-anchor="middle">4</text><text x="282" y="234" fill="#475569" font-size="12" text-anchor="middle">i=3</text><rect width="52" height="48" x="318" y="165" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/><text x="344" y="194" fill="#0f172a" font-size="18" font-weight="900" text-anchor="middle">2</text><text x="344" y="234" fill="#475569" font-size="12" text-anchor="middle">i=4</text><rect width="70" height="48" x="380" y="165" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="8"/><text x="415" y="194" fill="#0f172a" font-size="16" font-weight="900" text-anchor="middle">w</text><text x="415" y="234" fill="#475569" font-size="12" text-anchor="middle">i=5 停</text><text x="520" y="145" fill="#166534" font-size="16" font-weight="900" text-anchor="start">2. 状态流不是套图</text><rect width="112" height="44" x="520" y="168" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="22"/><text x="576" y="196" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">skip space</text><path fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)" d="M632,190 L674,190"/><rect width="96" height="44" x="684" y="168" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="22"/><text x="732" y="196" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">sign=-1</text><path fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)" d="M780,190 L822,190"/><rect width="116" height="44" x="832" y="168" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="22"/><text x="890" y="196" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">build num</text><path fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)" d="M890,212 L890,252"/><rect width="124" height="44" x="828" y="262" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="22"/><text x="890" y="290" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">meet letter stop</text><rect width="390" height="190" x="70" y="285" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="12"/><text x="90" y="316" fill="#0f172a" font-size="16" font-weight="900" text-anchor="start">3. 指针推进表</text><text x="92" y="348" fill="#475569" font-size="13" font-weight="800" text-anchor="start">读到的字符</text><text x="210" y="348" fill="#475569" font-size="13" font-weight="800" text-anchor="start">动作</text><text x="350" y="348" fill="#475569" font-size="13" font-weight="800" text-anchor="start">状态</text><line x1="90" x2="440" y1="360" y2="360" stroke="#e2e8f0" stroke-width="2"/><text x="92" y="386" fill="#0f172a" font-size="13" font-weight="700" text-anchor="start">空格, 空格</text><text x="210" y="386" fill="#0f172a" font-size="13" font-weight="700" text-anchor="start">持续跳过</text><text x="350" y="386" fill="#0f172a" font-size="13" font-weight="700" text-anchor="start">未开始</text><text x="92" y="418" fill="#0f172a" font-size="13" font-weight="700" text-anchor="start">-</text><text x="210" y="418" fill="#0f172a" font-size="13" font-weight="700" text-anchor="start">记录 sign=-1</text><text x="350" y="418" fill="#0f172a" font-size="13" font-weight="700" text-anchor="start">等数字</text><text x="92" y="450" fill="#0f172a" font-size="13" font-weight="700" text-anchor="start">4, 2</text><text x="210" y="450" fill="#0f172a" font-size="13" font-weight="700" text-anchor="start">ans = ans*10+d</text><text x="350" y="450" fill="#0f172a" font-size="13" font-weight="700" text-anchor="start">ans=42</text><rect width="360" height="135" x="520" y="340" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="540" y="370" fill="#9a3412" font-size="16" font-weight="900" text-anchor="start">4. 每加一位先做溢出判断</text><text x="540" y="402" fill="#7c2d12" font-size="13" font-weight="700" text-anchor="start">如果 ans &gt; INT_MAX/10，提前返回边界值。</text><text x="540" y="430" fill="#7c2d12" font-size="13" font-weight="700" text-anchor="start">本例没有溢出：sign * ans = -42。</text><text x="540" y="458" fill="#7c2d12" font-size="13" font-weight="700" text-anchor="start">遇到 w 停止，后面的 &quot;ith words&quot; 不再读取。</text><path fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" d="M415,213 C470,250 510,280 560,340"/></svg>