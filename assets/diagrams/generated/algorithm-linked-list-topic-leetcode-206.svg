<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode 206: 反转链表：真实状态图解</title>
  <desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1120" height="680" rx="18" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" fill="#0f172a" font-weight="900" text-anchor="start">LeetCode 206: 反转链表：真实状态图解</text>
  <text x="40" y="82" font-size="15" fill="#475569" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text>
  <rect x="120" y="190" width="60" height="44" rx="8" fill="#f1f5f9" stroke="#0284c7" stroke-width="2"/><text x="150" y="218" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">null</text><path d="M180,212 L214,212" stroke="#0284c7" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="150" y="178" font-size="13" fill="#2563eb" font-weight="800" text-anchor="middle">prev</text><rect x="222" y="190" width="60" height="44" rx="8" fill="#fee2e2" stroke="#0284c7" stroke-width="2"/><text x="252" y="218" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">1</text><path d="M282,212 L316,212" stroke="#0284c7" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="252" y="178" font-size="13" fill="#2563eb" font-weight="800" text-anchor="middle">curr</text><rect x="324" y="190" width="60" height="44" rx="8" fill="#dbeafe" stroke="#0284c7" stroke-width="2"/><text x="354" y="218" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">2</text><path d="M384,212 L418,212" stroke="#0284c7" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="354" y="178" font-size="13" fill="#2563eb" font-weight="800" text-anchor="middle">next</text><rect x="426" y="190" width="60" height="44" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/><text x="456" y="218" font-size="15" fill="#0f172a" font-weight="800" text-anchor="middle">3</text><path d="M275,215 C240,285 200,285 172,215" stroke="#dc2626" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="600" y="160" width="280" height="86" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="614" y="186" font-size="15" fill="#9a3412" font-weight="800" text-anchor="start">三指针循环</text><text x="614" y="210" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">保存 next，</text><text x="614" y="228" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">curr.next 指向 prev，</text><text x="614" y="246" font-size="12" fill="#7c2d12" font-weight="500" text-anchor="start">再整体右移 prev/curr。</text><text x="130" y="330" font-size="16" fill="#dc2626" font-weight="900" text-anchor="start">curr.next = prev</text>
</svg>
