<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">LeetCode 206: 反转链表：真实状态图解</title><desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="8"/></filter></defs><rect width="1120" height="680" fill="#f8fafc" rx="18"/><text x="40" y="52" fill="#0f172a" font-size="28" font-weight="900" text-anchor="start">LeetCode 206: 反转链表：真实状态图解</text><text x="40" y="82" fill="#475569" font-size="15" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text><rect width="60" height="44" x="120" y="190" fill="#f1f5f9" stroke="#0284c7" stroke-width="2" rx="8"/><text x="150" y="218" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">null</text><path fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" d="M180,212 L214,212"/><text x="150" y="178" fill="#2563eb" font-size="13" font-weight="800" text-anchor="middle">prev</text><rect width="60" height="44" x="222" y="190" fill="#fee2e2" stroke="#0284c7" stroke-width="2" rx="8"/><text x="252" y="218" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">1</text><path fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" d="M282,212 L316,212"/><text x="252" y="178" fill="#2563eb" font-size="13" font-weight="800" text-anchor="middle">curr</text><rect width="60" height="44" x="324" y="190" fill="#dbeafe" stroke="#0284c7" stroke-width="2" rx="8"/><text x="354" y="218" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">2</text><path fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" d="M384,212 L418,212"/><text x="354" y="178" fill="#2563eb" font-size="13" font-weight="800" text-anchor="middle">next</text><rect width="60" height="44" x="426" y="190" fill="#fff" stroke="#0284c7" stroke-width="2" rx="8"/><text x="456" y="218" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">3</text><path fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)" d="M275,215 C240,285 200,285 172,215"/><rect width="280" height="86" x="600" y="160" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="614" y="186" fill="#9a3412" font-size="15" font-weight="800" text-anchor="start">三指针循环</text><text x="614" y="210" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">保存 next，</text><text x="614" y="228" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">curr.next 指向 prev，</text><text x="614" y="246" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">再整体右移 prev/curr。</text><text x="130" y="330" fill="#dc2626" font-size="16" font-weight="900" text-anchor="start">curr.next = prev</text></svg>