<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="380" aria-labelledby="title desc" role="img" viewBox="0 0 1060 380"><title id="title">Avalonia 渲染管线</title><desc id="desc">XAML -&gt; Control Tree -&gt; Style System -&gt; Layout -&gt; Skia Render -&gt; Platform Backend 的完整渲染管线。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="6" flood-color="#0f172a" flood-opacity=".1" stdDeviation="6"/></filter><style>text{font-family:&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,sans-serif}</style></defs><rect width="1060" height="380" fill="#f8fafc" rx="18"/><text x="40" y="48" fill="#0f172a" font-size="26" font-weight="900">Avalonia 渲染管线</text><text x="40" y="74" fill="#64748b" font-size="14">XAML -&gt; Control Tree -&gt; Style System -&gt; Layout -&gt; Skia Render -&gt; Platform Backend</text><rect width="130" height="60" x="30" y="110" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="95" y="138" fill="#1e40af" font-size="13" font-weight="800" text-anchor="middle">XAML</text><text x="95" y="156" fill="#3b82f6" font-size="10" text-anchor="middle">视图标记</text><line x1="160" x2="190" y1="140" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="150" height="70" x="195" y="105" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="270" y="133" fill="#166534" font-size="13" font-weight="800" text-anchor="middle">Control Tree</text><text x="270" y="151" fill="#22c55e" font-size="10" text-anchor="middle">逻辑树 / 视觉树</text><text x="270" y="165" fill="#22c55e" font-size="10" text-anchor="middle">数据绑定</text><line x1="345" x2="375" y1="140" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="150" height="70" x="380" y="105" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="455" y="133" fill="#92400e" font-size="13" font-weight="800" text-anchor="middle">Style System</text><text x="455" y="151" fill="#b45309" font-size="10" text-anchor="middle">CSS 选择器</text><text x="455" y="165" fill="#b45309" font-size="10" text-anchor="middle">伪类</text><line x1="530" x2="560" y1="140" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="140" height="70" x="565" y="105" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="635" y="133" fill="#3730a3" font-size="13" font-weight="800" text-anchor="middle">Layout</text><text x="635" y="151" fill="#6366f1" font-size="10" text-anchor="middle">测量 + 排列</text><text x="635" y="165" fill="#6366f1" font-size="10" text-anchor="middle">Grid / StackPanel</text><line x1="705" x2="735" y1="140" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="140" height="70" x="740" y="105" fill="#fce7f3" stroke="#ec4899" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="810" y="133" fill="#9d174d" font-size="13" font-weight="800" text-anchor="middle">Skia Render</text><text x="810" y="151" fill="#ec4899" font-size="10" text-anchor="middle">绘制指令</text><text x="810" y="165" fill="#ec4899" font-size="10" text-anchor="middle">光栅化</text><line x1="880" x2="910" y1="140" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="120" height="80" x="915" y="100" fill="#fee2e2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="975" y="130" fill="#991b1b" font-size="12" font-weight="800" text-anchor="middle">Platform</text><text x="975" y="148" fill="#ef4444" font-size="10" text-anchor="middle">Win32</text><text x="975" y="162" fill="#ef4444" font-size="10" text-anchor="middle">X11 / macOS</text><text x="975" y="176" fill="#ef4444" font-size="10" text-anchor="middle">WASM</text><text x="40" y="230" fill="#0f172a" font-size="14" font-weight="800">合成与 MVVM</text><rect width="160" height="50" x="40" y="248" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" rx="8"/><text x="120" y="270" fill="#075985" font-size="11" font-weight="700" text-anchor="middle">Composition Layer</text><text x="120" y="286" fill="#0284c7" font-size="9" text-anchor="middle">脏区域 / 图层管理</text><rect width="160" height="50" x="220" y="248" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" rx="8"/><text x="300" y="270" fill="#075985" font-size="11" font-weight="700" text-anchor="middle">MVVM Binding</text><text x="300" y="286" fill="#0284c7" font-size="9" text-anchor="middle">编译绑定</text><rect width="160" height="50" x="400" y="248" fill="#fef9c3" stroke="#eab308" stroke-width="1.5" rx="8"/><text x="480" y="270" fill="#854d0e" font-size="11" font-weight="700" text-anchor="middle">StyledProperty</text><text x="480" y="286" fill="#ca8a04" font-size="9" text-anchor="middle">样式 / 主题 / 动画</text><rect width="160" height="50" x="580" y="248" fill="#fef9c3" stroke="#eab308" stroke-width="1.5" rx="8"/><text x="660" y="270" fill="#854d0e" font-size="11" font-weight="700" text-anchor="middle">DirectProperty</text><text x="660" y="286" fill="#ca8a04" font-size="9" text-anchor="middle">高性能直接字段</text><rect width="180" height="50" x="780" y="248" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5" rx="8"/><text x="870" y="270" fill="#6b21a8" font-size="11" font-weight="700" text-anchor="middle">Theme / StyleInclude</text><text x="870" y="286" fill="#a855f7" font-size="9" text-anchor="middle">Fluent / Simple / 自定义</text><rect width="960" height="40" x="40" y="320" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" rx="8"/><text x="520" y="345" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">Skia 统一跨平台渲染，像素级一致。平台后端仅处理窗口、输入、剪贴板。</text></svg>