<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="380" viewBox="0 0 1060 380" role="img" aria-labelledby="title desc">
  <title id="title">Avalonia 渲染管线</title>
  <desc id="desc">XAML -> Control Tree -> Style System -> Layout -> Skia Render -> Platform Backend 的完整渲染管线。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }</style>
  </defs>
  <rect width="1060" height="380" rx="18" fill="#f8fafc"/>
  <text x="40" y="48" font-size="26" fill="#0f172a" font-weight="900">Avalonia 渲染管线</text>
  <text x="40" y="74" font-size="14" fill="#64748b">XAML -> Control Tree -> Style System -> Layout -> Skia Render -> Platform Backend</text>

  <!-- XAML -->
  <rect x="30" y="110" width="130" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="95" y="138" font-size="13" fill="#1e40af" font-weight="800" text-anchor="middle">XAML</text>
  <text x="95" y="156" font-size="10" fill="#3b82f6" text-anchor="middle">视图标记</text>

  <line x1="160" y1="140" x2="190" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Control Tree -->
  <rect x="195" y="105" width="150" height="70" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="270" y="133" font-size="13" fill="#166534" font-weight="800" text-anchor="middle">Control Tree</text>
  <text x="270" y="151" font-size="10" fill="#22c55e" text-anchor="middle">逻辑树 / 视觉树</text>
  <text x="270" y="165" font-size="10" fill="#22c55e" text-anchor="middle">数据绑定</text>

  <line x1="345" y1="140" x2="375" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Style System -->
  <rect x="380" y="105" width="150" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="455" y="133" font-size="13" fill="#92400e" font-weight="800" text-anchor="middle">Style System</text>
  <text x="455" y="151" font-size="10" fill="#b45309" text-anchor="middle">CSS 选择器</text>
  <text x="455" y="165" font-size="10" fill="#b45309" text-anchor="middle">伪类</text>

  <line x1="530" y1="140" x2="560" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layout -->
  <rect x="565" y="105" width="140" height="70" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="635" y="133" font-size="13" fill="#3730a3" font-weight="800" text-anchor="middle">Layout</text>
  <text x="635" y="151" font-size="10" fill="#6366f1" text-anchor="middle">测量 + 排列</text>
  <text x="635" y="165" font-size="10" fill="#6366f1" text-anchor="middle">Grid / StackPanel</text>

  <line x1="705" y1="140" x2="735" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Skia Render -->
  <rect x="740" y="105" width="140" height="70" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
  <text x="810" y="133" font-size="13" fill="#9d174d" font-weight="800" text-anchor="middle">Skia Render</text>
  <text x="810" y="151" font-size="10" fill="#ec4899" text-anchor="middle">绘制指令</text>
  <text x="810" y="165" font-size="10" fill="#ec4899" text-anchor="middle">光栅化</text>

  <line x1="880" y1="140" x2="910" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Platform Backend -->
  <rect x="915" y="100" width="120" height="80" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="975" y="130" font-size="12" fill="#991b1b" font-weight="800" text-anchor="middle">Platform</text>
  <text x="975" y="148" font-size="10" fill="#ef4444" text-anchor="middle">Win32</text>
  <text x="975" y="162" font-size="10" fill="#ef4444" text-anchor="middle">X11 / macOS</text>
  <text x="975" y="176" font-size="10" fill="#ef4444" text-anchor="middle">WASM</text>

  <!-- Bottom: Composition layer -->
  <text x="40" y="230" font-size="14" fill="#0f172a" font-weight="800">合成与 MVVM</text>

  <rect x="40" y="248" width="160" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="120" y="270" font-size="11" fill="#075985" font-weight="700" text-anchor="middle">Composition Layer</text>
  <text x="120" y="286" font-size="9" fill="#0284c7" text-anchor="middle">脏区域 / 图层管理</text>

  <rect x="220" y="248" width="160" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="300" y="270" font-size="11" fill="#075985" font-weight="700" text-anchor="middle">MVVM Binding</text>
  <text x="300" y="286" font-size="9" fill="#0284c7" text-anchor="middle">编译绑定</text>

  <rect x="400" y="248" width="160" height="50" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="480" y="270" font-size="11" fill="#854d0e" font-weight="700" text-anchor="middle">StyledProperty</text>
  <text x="480" y="286" font-size="9" fill="#ca8a04" text-anchor="middle">样式 / 主题 / 动画</text>

  <rect x="580" y="248" width="160" height="50" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="660" y="270" font-size="11" fill="#854d0e" font-weight="700" text-anchor="middle">DirectProperty</text>
  <text x="660" y="286" font-size="9" fill="#ca8a04" text-anchor="middle">高性能直接字段</text>

  <!-- Theme toggle -->
  <rect x="780" y="248" width="180" height="50" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="870" y="270" font-size="11" fill="#6b21a8" font-weight="700" text-anchor="middle">Theme / StyleInclude</text>
  <text x="870" y="286" font-size="9" fill="#a855f7" text-anchor="middle">Fluent / Simple / 自定义</text>

  <!-- Consistency note -->
  <rect x="40" y="320" width="960" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="520" y="345" font-size="12" fill="#166534" font-weight="700" text-anchor="middle">Skia 统一跨平台渲染，像素级一致。平台后端仅处理窗口、输入、剪贴板。</text>
</svg>
