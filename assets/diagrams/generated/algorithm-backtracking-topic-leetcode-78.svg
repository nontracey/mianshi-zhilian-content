/text><circle cx="160" cy="315" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="160" y="321" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">[1,2]</text><circle cx="280" cy="315" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="280" y="321" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">[1]</text><circle cx="400" cy="315" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="400" y="321" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">[2]</text><circle cx="520" cy="315" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="520" y="321" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">[]</text><rect width="250" height="86" x="620" y="160" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="634" y="186" fill="#9a3412" font-size="15" font-weight="800" text-anchor="start">每个节点都是答案</text><text x="634" y="210" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">子集问题不是只在叶子收集；</text><text x="634" y="228" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">进入每一层都可以先收集当前 path。</text></svg>