<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes 网络路径拓扑</title>
  <desc id="desc">外部请求经过 LoadBalancer、Ingress、Service、EndpointSlice 到达 Pod IP 的完整转发路径。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }</style>
  </defs>
  <rect width="1000" height="420" rx="18" fill="#f8fafc"/>
  <text x="40" y="48" font-size="26" fill="#0f172a" font-weight="900">Kubernetes 网络路径拓扑</text>
  <text x="40" y="74" font-size="14" fill="#64748b">外部请求 -> LoadBalancer -> Ingress -> Service -> EndpointSlice -> Pod IP 的完整转发路径</text>

  <!-- External Request -->
  <rect x="30" y="130" width="130" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="95" y="164" font-size="13" fill="#92400e" font-weight="800" text-anchor="middle">外部请求</text>

  <!-- Arrow 1 -->
  <line x1="160" y1="158" x2="195" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LoadBalancer -->
  <rect x="200" y="120" width="140" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="270" y="150" font-size="13" fill="#1e40af" font-weight="800" text-anchor="middle">LoadBalancer</text>
  <text x="270" y="170" font-size="11" fill="#3b82f6" text-anchor="middle">云负载均衡器</text>

  <!-- Arrow 2 -->
  <line x1="340" y1="158" x2="375" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ingress Controller -->
  <rect x="380" y="120" width="140" height="70" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="150" font-size="13" fill="#166534" font-weight="800" text-anchor="middle">Ingress</text>
  <text x="450" y="170" font-size="11" fill="#22c55e" text-anchor="middle">L7 路由规则</text>

  <!-- Arrow 3 -->
  <line x1="520" y1="158" x2="555" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Service -->
  <rect x="560" y="120" width="140" height="70" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="150" font-size="13" fill="#3730a3" font-weight="800" text-anchor="middle">Service</text>
  <text x="630" y="170" font-size="11" fill="#6366f1" text-anchor="middle">ClusterIP / NodePort</text>

  <!-- Arrow 4 -->
  <line x1="700" y1="158" x2="735" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- EndpointSlice -->
  <rect x="740" y="120" width="120" height="70" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="150" font-size="13" fill="#9d174d" font-weight="800" text-anchor="middle">EndpointSlice</text>
  <text x="800" y="170" font-size="11" fill="#ec4899" text-anchor="middle">选择 Pod</text>

  <!-- Arrow 5 -->
  <line x1="860" y1="158" x2="895" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pod -->
  <rect x="900" y="130" width="80" height="56" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="154" font-size="13" fill="#6b21a8" font-weight="800" text-anchor="middle">Pod</text>
  <text x="940" y="170" font-size="11" fill="#a855f7" text-anchor="middle">Pod IP</text>

  <!-- Bottom: internal traffic -->
  <text x="40" y="260" font-size="14" fill="#0f172a" font-weight="800">内部流量与策略</text>

  <!-- Cluster Internal Pod -->
  <rect x="40" y="280" width="150" height="50" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="115" y="310" font-size="12" fill="#854d0e" font-weight="700" text-anchor="middle">集群 Pod</text>
  <line x1="190" y1="305" x2="225" y2="305" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- kube-proxy / eBPF -->
  <rect x="230" y="280" width="160" height="50" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="310" y="300" font-size="12" fill="#075985" font-weight="700" text-anchor="middle">kube-proxy / eBPF</text>
  <text x="310" y="318" font-size="10" fill="#0284c7" text-anchor="middle">iptables / ipvs</text>

  <!-- NetworkPolicy -->
  <rect x="450" y="280" width="150" height="50" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="525" y="300" font-size="12" fill="#991b1b" font-weight="700" text-anchor="middle">NetworkPolicy</text>
  <text x="525" y="318" font-size="10" fill="#ef4444" text-anchor="middle">Pod 级防火墙</text>

  <!-- DNS -->
  <rect x="660" y="280" width="130" height="50" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="725" y="300" font-size="12" fill="#166534" font-weight="700" text-anchor="middle">CoreDNS</text>
  <text x="725" y="318" font-size="10" fill="#16a34a" text-anchor="middle">服务发现</text>

  <!-- Arrows from bottom to Service -->
  <line x1="310" y1="280" x2="630" y2="190" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="525" y1="280" x2="940" y2="190" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
</svg>
