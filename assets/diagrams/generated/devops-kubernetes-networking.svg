<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" aria-labelledby="title desc" role="img" viewBox="0 0 1000 420"><title id="title">Kubernetes 网络路径拓扑</title><desc id="desc">外部请求经过 LoadBalancer、Ingress、Service、EndpointSlice 到达 Pod IP 的完整转发路径。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="6" flood-color="#0f172a" flood-opacity=".1" stdDeviation="6"/></filter><style>text{font-family:&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,sans-serif}</style></defs><rect width="1000" height="420" fill="#f8fafc" rx="18"/><text x="40" y="48" fill="#0f172a" font-size="26" font-weight="900">Kubernetes 网络路径拓扑</text><text x="40" y="74" fill="#64748b" font-size="14">外部请求 -&gt; LoadBalancer -&gt; Ingress -&gt; Service -&gt; EndpointSlice -&gt; Pod IP 的完整转发路径</text><rect width="130" height="56" x="30" y="130" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="95" y="164" fill="#92400e" font-size="13" font-weight="800" text-anchor="middle">外部请求</text><line x1="160" x2="195" y1="158" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="140" height="70" x="200" y="120" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="270" y="150" fill="#1e40af" font-size="13" font-weight="800" text-anchor="middle">LoadBalancer</text><text x="270" y="170" fill="#3b82f6" font-size="11" text-anchor="middle">云负载均衡器</text><line x1="340" x2="375" y1="158" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="140" height="70" x="380" y="120" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="450" y="150" fill="#166534" font-size="13" font-weight="800" text-anchor="middle">Ingress</text><text x="450" y="170" 