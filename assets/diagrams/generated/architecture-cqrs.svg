<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="400" aria-labelledby="title desc" role="img" viewBox="0 0 1060 400"><title id="title">CQRS 写读分离架构</title><desc id="desc">Command API -&gt; Write Model -&gt; Event Store -&gt; Projection Worker -&gt; Read Model -&gt; Query API 的完整数据流。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="6" flood-color="#0f172a" flood-opacity=".1" stdDeviation="6"/></filter><style>text{font-family:&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,sans-serif}</style></defs><rect width="1060" height="400" fill="#f8fafc" rx="18"/><text x="40" y="48" fill="#0f172a" font-size="26" font-weight="900">CQRS 写读分离架构</text><text x="40" y="74" fill="#64748b" font-size="14">Command API -&gt; Write Model -&gt; Event Store -&gt; Projection Worker -&gt; Read Model -&gt; Query API</text><rect width="520" height="240" x="25" y="95" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="6 3" stroke-width="1" rx="14"/><text x="40" y="118" fill="#1d4ed8" font-size="13" font-weight="800">写侧（强一致）</text><rect width="140" height="60" x="40" y="135" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="110" y="163" fill="#1e40af" font-size="13" font-weight="800" text-anchor="middle">Command API</text><text x="110" y="181" fill="#3b82f6" font-size="10" text-anchor="middle">CreateOrder</text><line x1="180" x2="210" y1="165" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="150" height="70" x="215" y="130" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="290" y="158" fill="#166534" font-size="13" font-weight="800" text-anchor="middle">Write Model</text><text x="290" y="176" fill="#22c55e" font-size="10" text-anchor="middle">DDD 聚合</text><text x="290" y="190" fill="#22c55e" font-size="10" text-anchor="middle">业务不变量</text><line x1="365" x2="395" y1="165" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="130" height="60" x="400" y="135" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="465" y="163" fill="#92400e" font-size="12" font-weight="800" text-anchor="middle">Outbox / Event</text><text x="465" y="181" fill="#b45309" font-size="10" text-anchor="middle">原子写入</text><line x1="465" x2="465" y1="195" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="190" height="55" x="370" y="232" fill="#fef9c3" stroke="#eab308" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="465" y="257" fill="#854d0e" font-size="13" font-weight="800" text-anchor="middle">Event Store</text><text x="465" y="275" fill="#ca8a04" font-size="10" text-anchor="middle">仅追加事件日志</text><line x1="560" x2="615" y1="260" y2="260" stroke="#f59e0b" stroke-dasharray="6 3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="587" y="250" fill="#92400e" font-size="10" font-weight="700" text-anchor="middle">异步</text><rect width="415" height="240" x="620" y="95" fill="#f0fdf4" stroke="#86efac" stroke-dasharray="6 3" stroke-width="1" rx="14"/><text x="635" y="118" fill="#166534" font-size="13" font-weight="800">读侧（最终一致）</text><rect width="160" height="65" x="635" y="135" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="715" y="160" fill="#3730a3" font-size="13" font-weight="800" text-anchor="middle">Projection</text><text x="715" y="178" fill="#6366f1" font-size="10" text-anchor="middle">幂等消费者</text><text x="715" y="192" fill="#6366f1" font-size="10" text-anchor="middle">重试 + 死信队列</text><line x1="795" x2="825" y1="168" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="160" height="65" x="830" y="135" fill="#fce7f3" stroke="#ec4899" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="910" y="158" fill="#9d174d" font-size="13" font-weight="800" text-anchor="middle">Read Model</text><text x="910" y="176" fill="#ec4899" font-size="10" text-anchor="middle">宽表 / 索引</text><text x="910" y="190" fill="#ec4899" font-size="10" text-anchor="middle">物化视图</text><line x1="910" x2="910" y1="200" y2="238" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="160" height="55" x="830" y="242" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="910" y="267" fill="#6b21a8" font-size="13" font-weight="800" text-anchor="middle">Query API</text><text x="910" y="285" fill="#a855f7" font-size="10" text-anchor="middle">搜索 / 过滤 / 聚合</text><rect width="355" height="55" x="635" y="310" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="10"/><text x="812" y="333" fill="#991b1b" font-size="12" font-weight="800" text-anchor="middle">可观测性</text><text x="812" y="352" fill="#ef4444" font-size="10" text-anchor="middle">事件延迟 | 消费位移 | 投影失败 | 死信队列深度</text></svg>