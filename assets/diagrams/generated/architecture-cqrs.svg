<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="400" viewBox="0 0 1060 400" role="img" aria-labelledby="title desc">
  <title id="title">CQRS 写读分离架构</title>
  <desc id="desc">Command API -> Write Model -> Event Store -> Projection Worker -> Read Model -> Query API 的完整数据流。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }</style>
  </defs>
  <rect width="1060" height="400" rx="18" fill="#f8fafc"/>
  <text x="40" y="48" font-size="26" fill="#0f172a" font-weight="900">CQRS 写读分离架构</text>
  <text x="40" y="74" font-size="14" fill="#64748b">Command API -> Write Model -> Event Store -> Projection Worker -> Read Model -> Query API</text>

  <!-- Write side label -->
  <rect x="25" y="95" width="520" height="240" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="40" y="118" font-size="13" fill="#1d4ed8" font-weight="800">写侧（强一致）</text>

  <!-- Command API -->
  <rect x="40" y="135" width="140" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="163" font-size="13" fill="#1e40af" font-weight="800" text-anchor="middle">Command API</text>
  <text x="110" y="181" font-size="10" fill="#3b82f6" text-anchor="middle">CreateOrder</text>

  <line x1="180" y1="165" x2="210" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Write Model -->
  <rect x="215" y="130" width="150" height="70" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="158" font-size="13" fill="#166534" font-weight="800" text-anchor="middle">Write Model</text>
  <text x="290" y="176" font-size="10" fill="#22c55e" text-anchor="middle">DDD 聚合</text>
  <text x="290" y="190" font-size="10" fill="#22c55e" text-anchor="middle">业务不变量</text>

  <line x1="365" y1="165" x2="395" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Transaction + Outbox -->
  <rect x="400" y="135" width="130" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="465" y="163" font-size="12" fill="#92400e" font-weight="800" text-anchor="middle">Outbox / Event</text>
  <text x="465" y="181" font-size="10" fill="#b45309" text-anchor="middle">原子写入</text>

  <!-- Arrow down to Event Store -->
  <line x1="465" y1="195" x2="465" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Event Store -->
  <rect x="370" y="232" width="190" height="55" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2" filter="url(#shadow)"/>
  <text x="465" y="257" font-size="13" fill="#854d0e" font-weight="800" text-anchor="middle">Event Store</text>
  <text x="465" y="275" font-size="10" fill="#ca8a04" text-anchor="middle">仅追加事件日志</text>

  <!-- Async arrow crossing the boundary -->
  <line x1="560" y1="260" x2="615" y2="260" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="587" y="250" font-size="10" fill="#92400e" font-weight="700" text-anchor="middle">异步</text>

  <!-- Read side label -->
  <rect x="620" y="95" width="415" height="240" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="635" y="118" font-size="13" fill="#166534" font-weight="800">读侧（最终一致）</text>

  <!-- Projection Worker -->
  <rect x="635" y="135" width="160" height="65" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="715" y="160" font-size="13" fill="#3730a3" font-weight="800" text-anchor="middle">Projection</text>
  <text x="715" y="178" font-size="10" fill="#6366f1" text-anchor="middle">幂等消费者</text>
  <text x="715" y="192" font-size="10" fill="#6366f1" text-anchor="middle">重试 + 死信队列</text>

  <line x1="795" y1="168" x2="825" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Read Model -->
  <rect x="830" y="135" width="160" height="65" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
  <text x="910" y="158" font-size="13" fill="#9d174d" font-weight="800" text-anchor="middle">Read Model</text>
  <text x="910" y="176" font-size="10" fill="#ec4899" text-anchor="middle">宽表 / 索引</text>
  <text x="910" y="190" font-size="10" fill="#ec4899" text-anchor="middle">物化视图</text>

  <!-- Query API -->
  <line x1="910" y1="200" x2="910" y2="238" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="830" y="242" width="160" height="55" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
  <text x="910" y="267" font-size="13" fill="#6b21a8" font-weight="800" text-anchor="middle">Query API</text>
  <text x="910" y="285" font-size="10" fill="#a855f7" text-anchor="middle">搜索 / 过滤 / 聚合</text>

  <!-- Bottom: Lag monitoring -->
  <rect x="635" y="310" width="355" height="55" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="812" y="333" font-size="12" fill="#991b1b" font-weight="800" text-anchor="middle">可观测性</text>
  <text x="812" y="352" font-size="10" fill="#ef4444" text-anchor="middle">事件延迟 | 消费位移 | 投影失败 | 死信队列深度</text>
</svg>
