<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" aria-labelledby="title desc" role="img" viewBox="0 0 1080 380"><title id="title">Webpack 构建流水线</title><desc id="desc">Entry -&gt; Resolve -&gt; Loader Transform -&gt; Module Graph -&gt; Plugin Hooks -&gt; Chunk Graph -&gt; Output 的完整构建链路。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="6" flood-color="#0f172a" flood-opacity=".1" stdDeviation="6"/></filter><style>text{font-family:&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,sans-serif}</style></defs><rect width="1080" height="380" fill="#f8fafc" rx="18"/><text x="40" y="48" fill="#0f172a" font-size="26" font-weight="900">Webpack 构建流水线</text><text x="40" y="74" fill="#64748b" font-size="14">Entry -&gt; Resolve -&gt; Loader -&gt; Module Graph -&gt; Plugins -&gt; Chunk Graph -&gt; Output</text><rect width="120" height="60" x="30" y="120" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="90" y="148" fill="#1e40af" font-size="13" font-weight="800" text-anchor="middle">Entry</text><text x="90" y="166" fill="#3b82f6" font-size="10" text-anchor="middle">./src/index.js</text><line x1="150" x2="175" y1="150" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="120" height="60" x="180" y="120" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="240" y="148" fill="#166534" font-size="13" font-weight="800" text-anchor="middle">Resolve</text><text x="240" y="166" fill="#22c55e" font-size="10" text-anchor="middle">别名 / 扩展名</text><line x1="300" x2="325" y1="150" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="140" height="60" x="330" y="120" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="400" y="148" fill="#92400e" font-size="13" font-weight="800" text-anchor="middle">Loader Transform</text><text x="400" y="166" fill="#b45309" font-size="10" text-anchor="middle">从右到左链式执行</text><line x1="470" x2="495" y1="150" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="150" height="80" x="500" y="110" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="575" y="142" fill="#3730a3" font-size="13" font-weight="800" text-anchor="middle">Module Graph</text><text x="575" y="160" fill="#6366f1" font-size="10" text-anchor="middle">依赖树</text><text x="575" y="176" fill="#6366f1" font-size="10" text-anchor="middle">递归解析</text><line x1="650" x2="675" y1="150" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="150" height="80" x="680" y="110" fill="#fce7f3" stroke="#ec4899" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="755" y="142" fill="#9d174d" font-size="13" font-weight="800" text-anchor="middle">Plugin Hooks</text><text x="755" y="160" fill="#ec4899" font-size="10" text-anchor="middle">Tapable 生命周期</text><text x="755" y="176" fill="#ec4899" font-size="10" text-anchor="middle">optimize / processAssets</text><line x1="830" x2="855" y1="150" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="130" height="80" x="860" y="110" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" filter="url(#shadow)" rx="10"/><text x="925" y="142" fill="#6b21a8" font-size="13" font-weight="800" text-anchor="middle">Chunk Graph</text><text x="925" y="160" fill="#a855f7" font-size="10" text-anchor="middle">SplitChunks</text><text x="925" y="176" fill="#a855f7" font-size="10" text-anchor="middle">代码分割</text><line x1="925" x2="925" y1="190" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect width="180" height="70" x="830" y="240" fill="#fee2e2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)" rx="10"/><text x