<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc">
  <title id="title">Webpack 构建流水线</title>
  <desc id="desc">Entry -> Resolve -> Loader Transform -> Module Graph -> Plugin Hooks -> Chunk Graph -> Output 的完整构建链路。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }</style>
  </defs>
  <rect width="1080" height="380" rx="18" fill="#f8fafc"/>
  <text x="40" y="48" font-size="26" fill="#0f172a" font-weight="900">Webpack 构建流水线</text>
  <text x="40" y="74" font-size="14" fill="#64748b">Entry -> Resolve -> Loader -> Module Graph -> Plugins -> Chunk Graph -> Output</text>

  <!-- Entry -->
  <rect x="30" y="120" width="120" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="148" font-size="13" fill="#1e40af" font-weight="800" text-anchor="middle">Entry</text>
  <text x="90" y="166" font-size="10" fill="#3b82f6" text-anchor="middle">./src/index.js</text>

  <line x1="150" y1="150" x2="175" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Resolve -->
  <rect x="180" y="120" width="120" height="60" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="148" font-size="13" fill="#166534" font-weight="800" text-anchor="middle">Resolve</text>
  <text x="240" y="166" font-size="10" fill="#22c55e" text-anchor="middle">别名 / 扩展名</text>

  <line x1="300" y1="150" x2="325" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loader Transform -->
  <rect x="330" y="120" width="140" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="148" font-size="13" fill="#92400e" font-weight="800" text-anchor="middle">Loader Transform</text>
  <text x="400" y="166" font-size="10" fill="#b45309" text-anchor="middle">从右到左链式执行</text>

  <line x1="470" y1="150" x2="495" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Module Graph -->
  <rect x="500" y="110" width="150" height="80" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="575" y="142" font-size="13" fill="#3730a3" font-weight="800" text-anchor="middle">Module Graph</text>
  <text x="575" y="160" font-size="10" fill="#6366f1" text-anchor="middle">依赖树</text>
  <text x="575" y="176" font-size="10" fill="#6366f1" text-anchor="middle">递归解析</text>

  <line x1="650" y1="150" x2="675" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Plugin Hooks -->
  <rect x="680" y="110" width="150" height="80" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
  <text x="755" y="142" font-size="13" fill="#9d174d" font-weight="800" text-anchor="middle">Plugin Hooks</text>
  <text x="755" y="160" font-size="10" fill="#ec4899" text-anchor="middle">Tapable 生命周期</text>
  <text x="755" y="176" font-size="10" fill="#ec4899" text-anchor="middle">optimize / processAssets</text>

  <line x1="830" y1="150" x2="855" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Chunk Graph -->
  <rect x="860" y="110" width="130" height="80" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
  <text x="925" y="142" font-size="13" fill="#6b21a8" font-weight="800" text-anchor="middle">Chunk Graph</text>
  <text x="925" y="160" font-size="10" fill="#a855f7" text-anchor="middle">SplitChunks</text>
  <text x="925" y="176" font-size="10" fill="#a855f7" text-anchor="middle">代码分割</text>

  <!-- Down arrow to Output -->
  <line x1="925" y1="190" x2="925" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="830" y="240" width="180" height="70" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="268" font-size="13" fill="#991b1b" font-weight="800" text-anchor="middle">输出（emit）</text>
  <text x="920" y="288" font-size="10" fill="#ef4444" text-anchor="middle">[name].[contenthash].js</text>
  <text x="920" y="302" font-size="10" fill="#ef4444" text-anchor="middle">source map / 产物</text>

  <!-- Bottom: Cross-cutting concerns -->
  <text x="40" y="280" font-size="14" fill="#0f172a" font-weight="800">横切关注点</text>

  <rect x="40" y="295" width="130" height="44" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="105" y="315" font-size="11" fill="#854d0e" font-weight="700" text-anchor="middle">Tree Shaking</text>
  <text x="105" y="331" font-size="9" fill="#ca8a04" text-anchor="middle">sideEffects + Terser</text>

  <rect x="190" y="295" width="130" height="44" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="255" y="315" font-size="11" fill="#854d0e" font-weight="700" text-anchor="middle">HMR</text>
  <text x="255" y="331" font-size="9" fill="#ca8a04" text-anchor="middle">WebSocket + accept</text>

  <rect x="340" y="295" width="130" height="44" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="405" y="315" font-size="11" fill="#854d0e" font-weight="700" text-anchor="middle">缓存</text>
  <text x="405" y="331" font-size="9" fill="#ca8a04" text-anchor="middle">文件系统缓存</text>

  <rect x="490" y="295" width="130" height="44" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="555" y="315" font-size="11" fill="#854d0e" font-weight="700" text-anchor="middle">Source Map</text>
  <text x="555" y="331" font-size="9" fill="#ca8a04" text-anchor="middle">devtool 配置</text>

  <!-- Arrows from cross-cutting to pipeline -->
  <line x1="105" y1="295" x2="575" y2="190" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="405" y1="295" x2="575" y2="190" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
</svg>
