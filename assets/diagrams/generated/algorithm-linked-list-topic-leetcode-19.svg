<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">LeetCode 19: 删除链表的倒数第 N 个结点：真实状态图解</title><desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="8"/></filter></defs><rect width="1120" height="680" fill="#f8fafc" rx="18"/><text x="40" y="44" fill="#0f172a" font-size="24" font-weight="900" text-anchor="start">LeetCode 19: 删除链表的倒数第 N 个结点：</text><text x="40" y="76" fill="#0f172a" font-size="24" font-weight="900" text-anchor="start">真实状态图解</text><text x="40" y="108" fill="#475569" font-size="15" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text><rect width="64" height="44" x="90" y="190" fill="#fff" stroke="#0284c7" stroke-width="2" rx="8"/><text x="122" y="218" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">dummy</text><path fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" d="M154,212 L180,212"/><text x="122" y="178" fill="#16a34a" font-size="13" font-weight="800" text-anchor="middle">slow</text><rect width="64" height="44" x="188" y="190" fill="#fff" stroke="#0284c7" stroke-width="2" rx="8"/><text x="220" y="218" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">1</text><path fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" d="M252,212 L278,212"/><rect width="64" height="44" x="286" y="190" fill="#fff" stroke="#0284c7" stroke-width="2" rx="8"/><text x="318" y="218" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">2</text><path fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" d="M350,212 L376,212"/><text x="318" y="178" fill="#2563eb" font-size="13" font-weight="800" text-anchor="middle">fast</text><rect width="64" height="44" x="384" y="190" fill="#fff" stroke="#0284c7" stroke-width="2" rx="8"/><text x="416" y="218" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">3</text><path fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" d="M448,212 L474,212"/><rect width="64" height="44" x="482" y="190" fill="#fee2e2" stroke="#0284c7" stroke-width="2" rx="8"/><text x="514" y="218" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">4</text><path fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)" d="M546,212 L572,212"/><rect width="64" height="44" x="580" y="190" fill="#fff" stroke="#0284c7" stroke-width="2" rx="8"/><text x="612" y="218" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">5</text><path fill="none" stroke="#dc2626" stroke-dasharray="6 6" stroke-width="2.5" marker-end="url(#arrow)" d="M414,235 C438,300 488,300 512,235"/><rect width="270" height="86" x="640" y="160" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="12"/><text x="654" y="186" fill="#9a3412" font-size="15" font-weight="800" text-anchor="start">固定间距 n=2</text><text x="654" y="210" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">fast 先走 n 步；</text><text x="654" y="228" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">同步移动后 slow 停在待删节点 4</text><text x="654" y="246" fill="#7c2d12" font-size="12" font-weight="500" text-anchor="start">的前驱 3。</text><text x="300" y="330" fill="#dc2626" font-size="15" font-weight="900" text-anchor="start">删除: slow.next = slow.next.next</text></svg>