<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">图基础：真实状态图解</title>
  <desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1120" height="680" rx="18" fill="#f8fafc"/>
  <text x="40" y="52" font-size="28" fill="#0f172a" font-weight="900" text-anchor="start">图基础：真实状态图解</text>
  <text x="40" y="82" font-size="15" fill="#475569" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text>
  <path d="M220,142 L120,213" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M220,142 L320,213" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M120,257 L220,328" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M320,257 L220,328" stroke="#94a3b8" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><circle cx="220" cy="120" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="220" y="126" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">A</text><circle cx="120" cy="235" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="120" y="241" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">B</text><circle cx="320" cy="235" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="320" y="241" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">C</text><circle cx="220" cy="350" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="220" y="356" font-size="14" fill="#0f172a" font-weight="800" text-anchor="middle">D</text><rect x="540" y="145" width="270" height="190" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="565" y="178" font-size="16" fill="#1d4ed8" font-weight="900" text-anchor="start">邻接表</text><text x="570" y="215" font-size="15" fill="#0f172a" font-weight="800" text-anchor="start">A: B, C</text><text x="570" y="245" font-size="15" fill="#0f172a" font-weight="800" text-anchor="start">B: D</text><text x="570" y="275" font-size="15" fill="#0f172a" font-weight="800" text-anchor="start">C: D</text><text x="570" y="305" font-size="15" fill="#0f172a" font-weight="800" text-anchor="start">D: -</text>
</svg>
