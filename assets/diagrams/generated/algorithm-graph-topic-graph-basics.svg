<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" aria-labelledby="title desc" role="img" viewBox="0 0 1120 680"><title id="title">图基础：真实状态图解</title><desc id="desc">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M2,2 L10,6 L2,10 Z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="8"/></filter></defs><rect width="1120" height="680" fill="#f8fafc" rx="18"/><text x="40" y="52" fill="#0f172a" font-size="28" font-weight="900" text-anchor="start">图基础：真实状态图解</text><text x="40" y="82" fill="#475569" font-size="15" font-weight="500" text-anchor="start">用具体输入、指针/状态表和边界变化解释算法，而不是套流程图。</text><path fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)" d="M220,142 L120,213"/><path fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)" d="M220,142 L320,213"/><path fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)" d="M120,257 L220,328"/><path fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)" d="M320,257 L220,328"/><circle cx="220" cy="120" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="220" y="126" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">A</text><circle cx="120" cy="235" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="120" y="241" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">B</text><circle cx="320" cy="235" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="320" y="241" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">C</text><circle cx="220" cy="350" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="220" y="356" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">D</text><rect width="270" height="190" x="540" y="14