<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">查找排序数组中目标值的左右边界</title>
  <desc id="desc">使用 nums=[5,7,7,8,8,10], target=8 展示 lower_bound 和 upper_bound。</desc>
  <rect width="980" height="520" rx="18" fill="#f8fafc"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#0f172a">LeetCode 34：两次边界二分</text>
  <text x="40" y="78" font-size="14" fill="#475569">左边界找第一个 &gt;= target；右边界找第一个 &gt; target，再减一。</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(90 135)">
      <text x="0" y="-22" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a">数组与答案区间</text>
      <rect x="0" y="0" width="90" height="56" fill="#fff" stroke="#cbd5e1"/><text x="45" y="34" font-size="18">5</text>
      <rect x="90" y="0" width="90" height="56" fill="#fff" stroke="#cbd5e1"/><text x="135" y="34" font-size="18">7</text>
      <rect x="180" y="0" width="90" height="56" fill="#fff" stroke="#cbd5e1"/><text x="225" y="34" font-size="18">7</text>
      <rect x="270" y="0" width="90" height="56" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="315" y="34" font-size="18" font-weight="700">8</text>
      <rect x="360" y="0" width="90" height="56" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="405" y="34" font-size="18" font-weight="700">8</text>
      <rect x="450" y="0" width="90" height="56" fill="#fff" stroke="#cbd5e1"/><text x="495" y="34" font-size="18">10</text>
      <text x="315" y="86" font-size="14" fill="#16a34a" font-weight="700">leftBound = 3</text>
      <text x="405" y="110" font-size="14" fill="#16a34a" font-weight="700">rightBound = 4</text>
    </g>
    <g transform="translate(90 285)">
      <rect x="0" y="0" width="360" height="150" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
      <text x="180" y="32" font-size="16" fill="#1d4ed8" font-weight="700">第一次：lower_bound(8)</text>
      <text x="180" y="68" font-size="14" fill="#1e3a8a">nums[mid] &gt;= 8 时继续向左</text>
      <text x="180" y="98" font-size="14" fill="#1e3a8a">最终停在 index=3</text>
      <text x="180" y="128" font-size="14" fill="#1e3a8a">校验 nums[3] == 8</text>
      <rect x="420" y="0" width="360" height="150" rx="12" fill="#fff7ed" stroke="#fb923c"/>
      <text x="600" y="32" font-size="16" fill="#c2410c" font-weight="700">第二次：upper_bound(8)</text>
      <text x="600" y="68" font-size="14" fill="#9a3412">nums[mid] &lt;= 8 时继续向右</text>
      <text x="600" y="98" font-size="14" fill="#9a3412">第一个 &gt;8 的位置是 index=5</text>
      <text x="600" y="128" font-size="14" fill="#9a3412">右边界 = 5 - 1 = 4</text>
    </g>
  </g>
</svg>
