<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" aria-labelledby="title desc" role="img" viewBox="0 0 980 520"><title id="title">查找排序数组中目标值的左右边界</title><desc id="desc">使用 nums=[5,7,7,8,8,10], target=8 展示 lower_bound 和 upper_bound。</desc><rect width="980" height="520" fill="#f8fafc" rx="18"/><text x="40" y="48" fill="#0f172a" font-size="24" font-weight="700">LeetCode 34：两次边界二分</text><text x="40" y="78" fill="#475569" font-size="14">左边界找第一个 &gt;= target；右边界找第一个 &gt; target，再减一。</text><g font-family="system-ui, sans-serif" text-anchor="middle"><g transform="translate(90 135)"><text x="0" y="-22" fill="#0f172a" font-size="16" font-weight="700" text-anchor="start">数组与答案区间</text><rect width="90" height="56" x="0" y="0" fill="#fff" stroke="#cbd5e1"/><text x="45" y="34" font-size="18">5</text><rect width="90" height="56" x="90" y="0" fill="#fff" stroke="#cbd5e1"/><text x="135" y="34" font-size="18">7</text><rect width="90" height="56" x="180" y="0" fill="#fff" stroke="#cbd5e1"/><text x="225" y="34" font-size="18">7</text><rect width="90" height="56" x="270" y="0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="315" y="34" font-size="18" font-weight="700">8</text><rect width="90" height="56" x="360" y="0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="405" y="34" font-size="18" font-weight="700">8</text><rect width="90" height="56" x="450" y="0" fill="#fff" stroke="#cbd5e1"/><text x="495" y="34" font-size="18">10</text><text x="315" y="86" fill="#16a34a" font-size="14" font-weight="700">leftBound = 3</text><text x="405" y="110" fill="#16a34a" font-size="14" font-weight="700">rightBound = 4</text></g><g transform="translate(90 285)"><rect width="360" height="150" x="0" y="0" fill="#eff6ff" stroke="#60a5fa" rx="12"/><text x="180" y="32" fill="#1d4ed8" font-size="16" font-weight="700">第一次：lower_bound(8)</text><text x="180" y="68" fill="#1e3a8a" font-size="14">nums[mid] &gt;= 8 时继续向左</text><text x="180" y="98" fill="#1e3a8a" font-size="14">最终停在 index=3</text><text x="180" y="128" fill="#1e3a8a" font-size="14">校验 nums[3] == 8</text><rect width="360" height="150" x="420" y="0" fill="#fff7ed" stroke="#fb923c" rx="12"/><text x="600" y="32" fill="#c2410c" font-size="16" font-weight="700">第二次：upper_bound(8)</text><text x="600" y="68" fill="#9a3412" font-size="14">nums[mid] &lt;= 8 时继续向右</text><text x="600" y="98" fill="#9a3412" font-size="14">第一个 &gt;8 的位置是 index=5</text><text x="600" y="128" fill="#9a3412" font-size="14">右边界 = 5 - 1 = 4</text></g></g></svg>