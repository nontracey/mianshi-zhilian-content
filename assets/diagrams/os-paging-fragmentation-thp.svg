<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">分页、分段、大页的碎片与 THP 风险</title><desc id="desc">用 4KB 页、可变长度段和 2MB HugePage 示例说明内部碎片、外部碎片、高阶连续页不足以及透明大页排查指标。</desc><defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:600 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.h2{font:700 24px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:700 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:600 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:700 14px &quot;SFMono-Regular&quot;,Consolas,monospace;fill:#0f172a}.blue,.green{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#34d399}.amber{fill:#fffbeb;stroke:#f59e0b}.amber,.gray,.red{stroke-width:2}.red{fill:#fef2f2;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#cbd5e1}.arrow,.warnArrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}.warnArrow{stroke:#dc2626;marker-end:url(#warnArrow)}</style><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#2563eb" d="M2,2 L10,6 L2,10 Z"/></marker><marker id="warnArrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#dc2626" d="M2,2 L10,6 L2,10 Z"/></marker></defs><rect width="1320" height="1320" class="bg"/><text x="660" y="55" class="title" text-anchor="middle">碎片不是一个词：分页浪费在块内，分段失败在连续空间</text><text x="660" y="88" class="subtitle" text-anchor="middle">大页减少 TLB 压力，但 2MB 连续页帧、拆分、回收粒度和 compaction 都会影响尾延迟</text><rect width="1204" height="315" x="58" y="120" class="panel" rx="10"/><text x="90" y="160" class="h2">1. 内部碎片：页大小固定，最后一页可能用不满</text><text x="100" y="220" class="label">10KB 对象，4KB 页大小</text><rect width="260" height="70" x="95" y="250" class="blue" rx="8"/><rect width="260" height="70" x="375" y="250" class="blue" rx="8"/><rect width="260" height="70" x="655" y="250" class="amber" rx="8"/><text x="225" y="292" class="mono" text-anchor="middle">Page 1: 4KB used</text><text x="505" y="292" class="mono" text-anchor="middle">Page 2: 4KB used</text><text x="785" y="282" class="mono" text-anchor="middle">Page 3: 2KB used</text><text x="785" y="306" class="mono" text-anchor="middle">2KB waste inside</text><rect width="235" height="105" x="960" y="235" class="green" rx="8"/><text x="1077" y="270" class="label" text-anchor="middle">结论</text><text x="1077" y="298" class="text" text-anchor="middle">总能分散映射</text><text x="1077" y="322" class="tiny" text-anchor="middle">代价是尾页和页表开销</text><rect width="1204" height="315" x="58" y="475" class="panel" rx="10"/><text x="90" y="515" class="h2">2. 外部碎片：可变长度段释放后，空闲总量够但不连续</text><rect width="155" height="70" x="95" y="570" class="green" rx="8"/><text x="172" y="612" class="mono" text-anchor="middle">5KB free</text><rect width="95" height="70" x="260" y="570" class="gray" rx="8"/><text x="307" y="612" class="mono" text-anchor="middle">3KB used</text><rect width="155" height="70" x="365" y="570" class="green" rx="8"/><text x="442" y="612" class="mono" text-anchor="middle">5KB free</text><rect width="120" height="70" x="530" y="570" class="gray" rx="8"/><text x="590" y="612" class="mono" text-anchor="middle">used</text><path d="M675 605 H745" class="warnArrow"/><rect width="220" height="100" x="755" y="555" class="red" rx="8"/><text x="865" y="590" class="label" text-anchor="middle">申请 6KB 连续段</text><text x="865" y="620" class="text" text-anchor="middle">总空闲 10KB</text><text x="865" y="644" class="tiny" text-anchor="middle">但没有一块连续 6KB</text><rect width="185" height="100" x="1010" y="555" class="amber" rx="8"/><text x="1102" y="590" class="label" text-anchor="middle">处理代价</text><text x="1102" y="620" class="text" text-anchor="middle">compaction</text><text x="1102" y="644" class="tiny" text-anchor="middle">移动/暂停/锁竞争</text><rect width="1204" height="390" x="58" y="830" class="panel" rx="10"/><text x="90" y="870" class="h2">3. 大页 / THP：2MB 页需要高阶连续页帧，收益和风险都更粗粒度</text><rect width="245" height="88" x="95" y="925" class="blue" rx="8"/><text x="217" y="955" class="label" text-anchor="middle">普通 4KB 页</text><text x="217" y="983" class="text" text-anchor="middle">映射灵活，回收细</text><text x="217" y="1007" class="tiny" text-anchor="middle">TLB 覆盖范围较小</text><path d="M343 969 H405" class="arrow"/><rect width="260" height="88" x="410" y="925" class="green" rx="8"/><text x="540" y="955" class="label" text-anchor="middle">2MB HugePage</text><text x="540" y="983" class="text" text-anchor="middle">512 个 4KB 连续页</text><text x="540" y="1007" class="tiny" text-anchor="middle">TLB miss 更少，内部碎片更大</text><path d="M673 969 H735" class="warnArrow"/><rect width="245" height="88" x="740" y="925" class="red" rx="8"/><text x="862" y="955" class="label" text-anchor="middle">连续块不足</text><text x="862" y="983" class="text" text-anchor="middle">触发 compaction</text><text x="862" y="1007" class="tiny" text-anchor="middle">或退化回 4KB 页</text><path d="M988 969 H1050" class="warnArrow"/><rect width="140" height="88" x="1055" y="925" class="amber" rx="8"/><text x="1125" y="955" class="label" text-anchor="middle">尾延迟</text><text x="1125" y="983" class="tiny" text-anchor="middle">缺页路径</text><text x="1125" y="1007" class="tiny" text-anchor="middle">同步整理</text><rect width="335" height="82" x="95" y="1065" class="gray" rx="8"/><text x="262" y="1095" class="label" text-anchor="middle">确认是否用了大页</text><text x="262" y="1122" class="mono" text-anchor="middle">smaps: AnonHugePages</text><rect width="335" height="82" x="492" y="1065" class="gray" rx="8"/><text x="659" y="1095" class="label" text-anchor="middle">确认 THP 策略</text><text x="659" y="1122" class="mono" text-anchor="middle">transparent_hugepage/enabled</text><rect width="306" height="82" x="889" y="1065" class="gray" rx="8"/><text x="1042" y="1095" class="label" text-anchor="middle">确认高阶空闲块</text><text x="1042" y="1122" class="mono" text-anchor="middle">buddyinfo / pagetypeinfo</text><rect width="1100" height="44" x="95" y="1245" class="gray" rx="8"/><text x="645" y="1273" class="text" text-anchor="middle">结论：大页不是总更好；数据库等低尾延迟场景要把 TLB 收益和 compaction/回收粒度一起评估</text></svg>