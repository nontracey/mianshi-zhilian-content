<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">分页、分段、大页的碎片与 THP 风险</title>
  <desc id="desc">用 4KB 页、可变长度段和 2MB HugePage 示例说明内部碎片、外部碎片、高阶连续页不足以及透明大页排查指标。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .h2 { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 700 14px "SFMono-Regular", Consolas, monospace; fill: #0f172a; }
      .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .green { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; }
      .red { fill: #fef2f2; stroke: #f87171; stroke-width: 2; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
      .violet { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; }
      .line { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .warnArrow { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#warnArrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="warnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="660" y="55" text-anchor="middle">碎片不是一个词：分页浪费在块内，分段失败在连续空间</text>
  <text class="subtitle" x="660" y="88" text-anchor="middle">大页减少 TLB 压力，但 2MB 连续页帧、拆分、回收粒度和 compaction 都会影响尾延迟</text>

  <rect class="panel" x="58" y="120" width="1204" height="315" rx="10"/>
  <text class="h2" x="90" y="160">1. 内部碎片：页大小固定，最后一页可能用不满</text>
  <text class="label" x="100" y="220">10KB 对象，4KB 页大小</text>
  <rect class="blue" x="95" y="250" width="260" height="70" rx="8"/>
  <rect class="blue" x="375" y="250" width="260" height="70" rx="8"/>
  <rect class="amber" x="655" y="250" width="260" height="70" rx="8"/>
  <text class="mono" x="225" y="292" text-anchor="middle">Page 1: 4KB used</text>
  <text class="mono" x="505" y="292" text-anchor="middle">Page 2: 4KB used</text>
  <text class="mono" x="785" y="282" text-anchor="middle">Page 3: 2KB used</text>
  <text class="mono" x="785" y="306" text-anchor="middle">2KB waste inside</text>
  <rect class="green" x="960" y="235" width="235" height="105" rx="8"/>
  <text class="label" x="1077" y="270" text-anchor="middle">结论</text>
  <text class="text" x="1077" y="298" text-anchor="middle">总能分散映射</text>
  <text class="tiny" x="1077" y="322" text-anchor="middle">代价是尾页和页表开销</text>

  <rect class="panel" x="58" y="475" width="1204" height="315" rx="10"/>
  <text class="h2" x="90" y="515">2. 外部碎片：可变长度段释放后，空闲总量够但不连续</text>
  <rect class="green" x="95" y="570" width="155" height="70" rx="8"/>
  <text class="mono" x="172" y="612" text-anchor="middle">5KB free</text>
  <rect class="gray" x="260" y="570" width="95" height="70" rx="8"/>
  <text class="mono" x="307" y="612" text-anchor="middle">3KB used</text>
  <rect class="green" x="365" y="570" width="155" height="70" rx="8"/>
  <text class="mono" x="442" y="612" text-anchor="middle">5KB free</text>
  <rect class="gray" x="530" y="570" width="120" height="70" rx="8"/>
  <text class="mono" x="590" y="612" text-anchor="middle">used</text>
  <path class="warnArrow" d="M675 605 H745"/>
  <rect class="red" x="755" y="555" width="220" height="100" rx="8"/>
  <text class="label" x="865" y="590" text-anchor="middle">申请 6KB 连续段</text>
  <text class="text" x="865" y="620" text-anchor="middle">总空闲 10KB</text>
  <text class="tiny" x="865" y="644" text-anchor="middle">但没有一块连续 6KB</text>
  <rect class="amber" x="1010" y="555" width="185" height="100" rx="8"/>
  <text class="label" x="1102" y="590" text-anchor="middle">处理代价</text>
  <text class="text" x="1102" y="620" text-anchor="middle">compaction</text>
  <text class="tiny" x="1102" y="644" text-anchor="middle">移动/暂停/锁竞争</text>

  <rect class="panel" x="58" y="830" width="1204" height="390" rx="10"/>
  <text class="h2" x="90" y="870">3. 大页 / THP：2MB 页需要高阶连续页帧，收益和风险都更粗粒度</text>
  <rect class="blue" x="95" y="925" width="245" height="88" rx="8"/>
  <text class="label" x="217" y="955" text-anchor="middle">普通 4KB 页</text>
  <text class="text" x="217" y="983" text-anchor="middle">映射灵活，回收细</text>
  <text class="tiny" x="217" y="1007" text-anchor="middle">TLB 覆盖范围较小</text>
  <path class="arrow" d="M343 969 H405"/>
  <rect class="green" x="410" y="925" width="260" height="88" rx="8"/>
  <text class="label" x="540" y="955" text-anchor="middle">2MB HugePage</text>
  <text class="text" x="540" y="983" text-anchor="middle">512 个 4KB 连续页</text>
  <text class="tiny" x="540" y="1007" text-anchor="middle">TLB miss 更少，内部碎片更大</text>
  <path class="warnArrow" d="M673 969 H735"/>
  <rect class="red" x="740" y="925" width="245" height="88" rx="8"/>
  <text class="label" x="862" y="955" text-anchor="middle">连续块不足</text>
  <text class="text" x="862" y="983" text-anchor="middle">触发 compaction</text>
  <text class="tiny" x="862" y="1007" text-anchor="middle">或退化回 4KB 页</text>
  <path class="warnArrow" d="M988 969 H1050"/>
  <rect class="amber" x="1055" y="925" width="140" height="88" rx="8"/>
  <text class="label" x="1125" y="955" text-anchor="middle">尾延迟</text>
  <text class="tiny" x="1125" y="983" text-anchor="middle">缺页路径</text>
  <text class="tiny" x="1125" y="1007" text-anchor="middle">同步整理</text>

  <rect class="gray" x="95" y="1065" width="335" height="82" rx="8"/>
  <text class="label" x="262" y="1095" text-anchor="middle">确认是否用了大页</text>
  <text class="mono" x="262" y="1122" text-anchor="middle">smaps: AnonHugePages</text>
  <rect class="gray" x="492" y="1065" width="335" height="82" rx="8"/>
  <text class="label" x="659" y="1095" text-anchor="middle">确认 THP 策略</text>
  <text class="mono" x="659" y="1122" text-anchor="middle">transparent_hugepage/enabled</text>
  <rect class="gray" x="889" y="1065" width="306" height="82" rx="8"/>
  <text class="label" x="1042" y="1095" text-anchor="middle">确认高阶空闲块</text>
  <text class="mono" x="1042" y="1122" text-anchor="middle">buddyinfo / pagetypeinfo</text>

  <rect class="gray" x="95" y="1245" width="1100" height="44" rx="8"/>
  <text class="text" x="645" y="1273" text-anchor="middle">结论：大页不是总更好；数据库等低尾延迟场景要把 TLB 收益和 compaction/回收粒度一起评估</text>
</svg>
