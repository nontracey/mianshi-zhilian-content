<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1180" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1180"><title id="title">TCP 可靠传输：累积 ACK、快速重传、RTO 与 SACK</title><desc id="desc">展示发送窗口里一个报文段丢失后，接收方如何持续返回累积 ACK，并通过 SACK 告诉发送方哪些乱序数据已经收到；发送方根据 dup-ACK、RTO 和 SACK scoreboard 选择重传。</desc><defs><marker id="arrow-blue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#059669" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.title{font:800 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.panel-title{font:750 27px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1e293b}.small{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.box-blue{fill:#eff6ff;stroke:#60a5fa}.box-blue,.box-green,.box-red{stroke-width:2;rx:14}.box-green{fill:#ecfdf5;stroke:#34d399}.box-red{fill:#fef2f2;stroke:#f87171}.box-amber,.box-gray{fill:#fffbeb;stroke:#f59e0b;stroke-width:2;rx:14}.box-gray{fill:#f1f5f9;stroke:#cbd5e1}.line-blue,.line-green{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow-blue)}.line-green{stroke:#059669;marker-end:url(#arrow-green)}.drop,.line-red{stroke:#dc2626;fill:none}.line-red{stroke-width:4;marker-end:url(#arrow-red)}.drop{stroke-width:5;stroke-dasharray:10 8}.lifeline{stroke:#94a3b8;stroke-width:3;stroke-dasharray:8 8}</style></defs><rect width="1280" height="1180" class="bg"/><text x="640" y="56" class="title" text-anchor="middle">TCP 可靠传输不是“永不丢”，而是闭环修复</text><text x="640" y="90" class="subtitle" text-anchor="middle">字节序号定位缺口，累积 ACK 推进左边界，dup-ACK/RTO 触发重传，SACK 告诉发送方哪些乱序岛已收到</text><rect width="1160" height="455" x="60" y="120" class="panel"/><text x="92" y="164" class="panel-title">1. 一个段丢失后的真实报文视角</text><rect width="190" height="58" x="105" y="200" class="box-blue"/><text x="200" y="236" class="label" text-anchor="middle">Sender</text><rect width="190" height="58" x="985" y="200" class="box-green"/><text x="1080" y="236" class="label" text-anchor="middle">Receiver</text><line x1="200" x2="200" y1="266" y2="540" class="lifeline"/><line x1="1080" x2="1080" y1="266" y2="540" class="lifeline"/><path d="M 210 292 L 1070 292" class="line-blue"/><text x="640" y="280" class="small" text-anchor="middle">seg1: seq=1000..1199 到达，接收方期望 1200</text><path d="M 1070 326 L 210 326" class="line-green"/><text x="640" y="317" class="small" text-anchor="middle">ACK=1200（累积 ACK：1200 前都收齐）</text><path d="M 210 370 C 470 362 690 362 950 370" class="drop"/><text x="640" y="356" class="small" text-anchor="middle">seg2: seq=1200..1399 在网络中丢失</text><text x="986" y="377" fill="#dc2626" class="label" text-anchor="middle">×</text><path d="M 210 414 L 1070 414" class="line-blue"/><text x="640" y="402" class="small" text-anchor="middle">seg3: seq=1400..1599 乱序到达，接收方不能交付给应用</text><path d="M 1070 448 L 210 448" class="line-green"/><text x="640" y="439" class="small" text-anchor="middle">dup-ACK=1200 + SACK [1400,1600)</text><path d="M 210 492 L 1070 492" class="line-blue"/><text x="640" y="480" class="small" text-anchor="middle">seg4/seg5 到达后仍回 ACK=1200，并追加更多 SACK 块</text><path d="M 1070 526 L 210 526" class="line-green"/><text x="640" y="517" class="small" text-anchor="middle">第 3 个 dup-ACK 到达：发送方可快速重传缺口 seg2</text><rect width="1160" height="345" x="60" y="610" class="panel"/><text x="92" y="654" class="panel-title">2. 发送方的丢包恢复决策</text><rect width="230" height="72" x="95" y="700" class="box-blue"/><text x="210" y="730" class="label" text-anchor="middle">ACK 推进</text><text x="210" y="754" class="tiny" text-anchor="middle">highestAck 右移，清 dup 计数</text><rect width="245" height="72" x="385" y="700" class="box-amber"/><text x="507" y="730" class="label" text-anchor="middle">重复 ACK</text><text x="507" y="754" class="tiny" text-anchor="middle">缺口未补，dupAckCount++</text><path d="M 330 736 L 380 736" class="line-blue"/><rect width="245" height="92" x="690" y="685" class="box-green"/><text x="812" y="716" class="label" text-anchor="middle">3 dup-ACK</text><text x="812" y="742" class="tiny" text-anchor="middle">快速重传缺口段</text><text x="812" y="764" class="tiny" text-anchor="middle">进入快速恢复，窗口按算法降速</text><path d="M 635 736 L 685 736" class="line-green"/><rect width="180" height="92" x="985" y="685" class="box-red"/><text x="1075" y="716" class="label" text-anchor="middle">RTO 到期</text><text x="1075" y="742" class="tiny" text-anchor="middle">无 ACK 进展</text><text x="1075" y="764" class="tiny" text-anchor="middle">重传 + 指数退避</text><path d="M 940 736 L 980 736" class="line-red"/><rect width="430" height="82" x="150" y="825" class="box-gray"/><text x="365" y="855" class="label" text-anchor="middle">SACK scoreboard</text><text x="365" y="881" class="tiny" text-anchor="middle">记录 [1400,1600)、[1600,1800) 等已收到区间</text><path d="M 585 866 L 750 790" class="line-green"/><text x="870" y="920" class="small" text-anchor="middle">只补缺口 [1200,1400)</text><text x="870" y="944" class="tiny" text-anchor="middle">避免把已到达的乱序数据再发一遍</text><rect width="1160" height="120" x="60" y="990" class="panel"/><text x="92" y="1034" class="panel-title">3. 面试表达锚点</text><text x="640" y="1069" class="small" text-anchor="middle">可靠性主线：seq/ack 定位字节边界 → 接收缓冲按序交付 → RTO/快速重传修复缺口 → SACK 降低多丢包重传成本</text><text x="640" y="1097" class="small" text-anchor="middle">边界：校验和只发现损坏；Karn 避免重传 ACK 污染 RTT；RACK/TLP 是现代 Linux 对 dup-ACK/RTO 的补充</text></svg>