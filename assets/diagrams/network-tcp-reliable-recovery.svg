<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1180" viewBox="0 0 1280 1180" role="img" aria-labelledby="title desc">
  <title id="title">TCP 可靠传输：累积 ACK、快速重传、RTO 与 SACK</title>
  <desc id="desc">展示发送窗口里一个报文段丢失后，接收方如何持续返回累积 ACK，并通过 SACK 告诉发送方哪些乱序数据已经收到；发送方根据 dup-ACK、RTO 和 SACK scoreboard 选择重传。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .title { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .panel-title { font: 750 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box-blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 14; }
      .box-green { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 14; }
      .box-red { fill: #fef2f2; stroke: #f87171; stroke-width: 2; rx: 14; }
      .box-amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; rx: 14; }
      .box-gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .line-blue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .line-green { stroke: #059669; stroke-width: 4; fill: none; marker-end: url(#arrow-green); }
      .line-red { stroke: #dc2626; stroke-width: 4; fill: none; marker-end: url(#arrow-red); }
      .drop { stroke: #dc2626; stroke-width: 5; stroke-dasharray: 10 8; fill: none; }
      .lifeline { stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1180"/>
  <text class="title" x="640" y="56" text-anchor="middle">TCP 可靠传输不是“永不丢”，而是闭环修复</text>
  <text class="subtitle" x="640" y="90" text-anchor="middle">字节序号定位缺口，累积 ACK 推进左边界，dup-ACK/RTO 触发重传，SACK 告诉发送方哪些乱序岛已收到</text>

  <rect class="panel" x="60" y="120" width="1160" height="455"/>
  <text class="panel-title" x="92" y="164">1. 一个段丢失后的真实报文视角</text>
  <rect class="box-blue" x="105" y="200" width="190" height="58"/>
  <text class="label" x="200" y="236" text-anchor="middle">Sender</text>
  <rect class="box-green" x="985" y="200" width="190" height="58"/>
  <text class="label" x="1080" y="236" text-anchor="middle">Receiver</text>
  <line class="lifeline" x1="200" y1="266" x2="200" y2="540"/>
  <line class="lifeline" x1="1080" y1="266" x2="1080" y2="540"/>

  <path class="line-blue" d="M 210 292 L 1070 292"/>
  <text class="small" x="640" y="280" text-anchor="middle">seg1: seq=1000..1199 到达，接收方期望 1200</text>
  <path class="line-green" d="M 1070 326 L 210 326"/>
  <text class="small" x="640" y="317" text-anchor="middle">ACK=1200（累积 ACK：1200 前都收齐）</text>

  <path class="drop" d="M 210 370 C 470 362 690 362 950 370"/>
  <text class="small" x="640" y="356" text-anchor="middle">seg2: seq=1200..1399 在网络中丢失</text>
  <text class="label" x="986" y="377" text-anchor="middle" fill="#dc2626">×</text>

  <path class="line-blue" d="M 210 414 L 1070 414"/>
  <text class="small" x="640" y="402" text-anchor="middle">seg3: seq=1400..1599 乱序到达，接收方不能交付给应用</text>
  <path class="line-green" d="M 1070 448 L 210 448"/>
  <text class="small" x="640" y="439" text-anchor="middle">dup-ACK=1200 + SACK [1400,1600)</text>

  <path class="line-blue" d="M 210 492 L 1070 492"/>
  <text class="small" x="640" y="480" text-anchor="middle">seg4/seg5 到达后仍回 ACK=1200，并追加更多 SACK 块</text>
  <path class="line-green" d="M 1070 526 L 210 526"/>
  <text class="small" x="640" y="517" text-anchor="middle">第 3 个 dup-ACK 到达：发送方可快速重传缺口 seg2</text>

  <rect class="panel" x="60" y="610" width="1160" height="345"/>
  <text class="panel-title" x="92" y="654">2. 发送方的丢包恢复决策</text>
  <rect class="box-blue" x="95" y="700" width="230" height="72"/>
  <text class="label" x="210" y="730" text-anchor="middle">ACK 推进</text>
  <text class="tiny" x="210" y="754" text-anchor="middle">highestAck 右移，清 dup 计数</text>

  <rect class="box-amber" x="385" y="700" width="245" height="72"/>
  <text class="label" x="507" y="730" text-anchor="middle">重复 ACK</text>
  <text class="tiny" x="507" y="754" text-anchor="middle">缺口未补，dupAckCount++</text>
  <path class="line-blue" d="M 330 736 L 380 736"/>

  <rect class="box-green" x="690" y="685" width="245" height="92"/>
  <text class="label" x="812" y="716" text-anchor="middle">3 dup-ACK</text>
  <text class="tiny" x="812" y="742" text-anchor="middle">快速重传缺口段</text>
  <text class="tiny" x="812" y="764" text-anchor="middle">进入快速恢复，窗口按算法降速</text>
  <path class="line-green" d="M 635 736 L 685 736"/>

  <rect class="box-red" x="985" y="685" width="180" height="92"/>
  <text class="label" x="1075" y="716" text-anchor="middle">RTO 到期</text>
  <text class="tiny" x="1075" y="742" text-anchor="middle">无 ACK 进展</text>
  <text class="tiny" x="1075" y="764" text-anchor="middle">重传 + 指数退避</text>
  <path class="line-red" d="M 940 736 L 980 736"/>

  <rect class="box-gray" x="150" y="825" width="430" height="82"/>
  <text class="label" x="365" y="855" text-anchor="middle">SACK scoreboard</text>
  <text class="tiny" x="365" y="881" text-anchor="middle">记录 [1400,1600)、[1600,1800) 等已收到区间</text>
  <path class="line-green" d="M 585 866 L 750 790"/>
  <text class="small" x="870" y="920" text-anchor="middle">只补缺口 [1200,1400)</text>
  <text class="tiny" x="870" y="944" text-anchor="middle">避免把已到达的乱序数据再发一遍</text>

  <rect class="panel" x="60" y="990" width="1160" height="120"/>
  <text class="panel-title" x="92" y="1034">3. 面试表达锚点</text>
  <text class="small" x="640" y="1069" text-anchor="middle">可靠性主线：seq/ack 定位字节边界 → 接收缓冲按序交付 → RTO/快速重传修复缺口 → SACK 降低多丢包重传成本</text>
  <text class="small" x="640" y="1097" text-anchor="middle">边界：校验和只发现损坏；Karn 避免重传 ACK 污染 RTT；RACK/TLP 是现代 Linux 对 dup-ACK/RTO 的补充</text>
</svg>
