<svg width="100%" aria-label="AQS队列结构图" role="img" viewBox="0 0 680 280"><title>AQS队列结构图</title><desc>CLH变体队列的Node链表结构</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="340" y="24" fill="#042C53" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">AQS 队列结构</text><text x="340" y="44" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">AbstractQueuedSynchronizer: CLH变体队列</text><rect width="160" height="36" x="260" y="64" fill="#FAEEDA" stroke="#BA7517" stroke-width=".5" rx="8"/><text x="340" y="86" fill="#412402" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">state (volatile int)</text><text x="340" y="100" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">0=未锁定, 1=已锁定, &gt;1=重入次数</text><text x="140" y="132" fill="#042C53" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="start">CLH队列:</text><rect width="90" height="36" x="100" y="144" fill="#E6F1FB" stroke="#378ADD" stroke-width=".5" rx="6"/><text x="145" y="166" fill="#042C53" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">head</text><line x1="190" x2="210" y1="162" y2="162" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><rect width="90" height="36" x="210" y="144" fill="#EEEDFE" stroke="#7F77DD" stroke-width=".5" rx="6"/><text x="255" y="166" fill="#042C53" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Node A</text><line x1="300" x2="320" y1="162" y2="162" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><rect width="90" height="36" x="320" y="144" fill="#FAEEDA" stroke="#BA7517" stroke-width=".5" rx="6"/><text x="365" y="166" fill="#042C53" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Node B</text><line x1="410" x2="430" y1="162" y2="162" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><rect width="90" height="36" x="430" y="144" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".5" rx="6"/><text x="475" y="166" fill="#042C53" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Node C</text><line x1="520" x2="540" y1="162" y2="162" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><rect width="90" height="36" x="540" y="144" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="6"/><text x="585" y="166" fill="#042C53" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">tail</text><rect width="520" height="60" x="80" y="200" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="10"/><text x="340" y="220" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Node结构</text><text x="340" y="240" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">thread: 等待的线程 | waitStatus: 状态 | prev/next: 前后指针</text><text x="340" y="254" fill="#888780" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">独占模式(EXCLUSIVE) / 共享模式(SHARED)</text></svg>