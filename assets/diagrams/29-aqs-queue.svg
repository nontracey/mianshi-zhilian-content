<svg viewBox="0 0 680 280" width="100%" role="img" aria-label="AQS队列结构图">
<title>AQS队列结构图</title><desc>CLH变体队列的Node链表结构</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">AQS 队列结构</text>
<text x="340" y="44" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">AbstractQueuedSynchronizer: CLH变体队列</text>
<rect x="260" y="64" width="160" height="36" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="340" y="86" text-anchor="middle" font-size="13" font-weight="500" fill="#412402" font-family="system-ui, sans-serif">state (volatile int)</text>
<text x="340" y="100" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">0=未锁定, 1=已锁定, &gt;1=重入次数</text>
<text x="140" y="132" text-anchor="start" font-size="13" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">CLH队列:</text>
<rect x="100" y="144" width="90" height="36" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="145" y="166" text-anchor="middle" font-size="11" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">head</text>
<line x1="190" y1="162" x2="210" y2="162" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="210" y="144" width="90" height="36" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="255" y="166" text-anchor="middle" font-size="11" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Node A</text>
<line x1="300" y1="162" x2="320" y2="162" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="320" y="144" width="90" height="36" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="365" y="166" text-anchor="middle" font-size="11" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Node B</text>
<line x1="410" y1="162" x2="430" y2="162" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="430" y="144" width="90" height="36" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="475" y="166" text-anchor="middle" font-size="11" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Node C</text>
<line x1="520" y1="162" x2="540" y2="162" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="540" y="144" width="90" height="36" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="585" y="166" text-anchor="middle" font-size="11" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">tail</text>
<rect x="80" y="200" width="520" height="60" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="220" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">Node结构</text>
<text x="340" y="240" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">thread: 等待的线程 | waitStatus: 状态 | prev/next: 前后指针</text>
<text x="340" y="254" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">独占模式(EXCLUSIVE) / 共享模式(SHARED)</text>
</svg>