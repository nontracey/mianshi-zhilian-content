<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1360" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1360"><title id="title">Java pattern matching versions, flow scoping, switch patterns, record patterns, and sealed exhaustiveness</title><desc id="desc">A topic-specific diagram explaining Java pattern matching version boundaries: instanceof type patterns in Java 16, sealed classes in Java 17, switch and record patterns in Java 21, flow scoping, null handling, guards, record deconstruction, dominance, sealed exhaustiveness, and open hierarchy default handling.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 32px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}</style></defs><rect width="1320" height="1360" class="bg"/><text x="70" y="64" class="title">Pattern Matching：让类型测试、绑定和穷举交给编译器</text><text x="70" y="96" class="subtitle">版本边界要说准：Java 16 instanceof，Java 17 sealed，Java 21 switch 与 record patterns。</text><rect width="1180" height="230" x="70" y="130" class="panel" rx="16"/><text x="96" y="166" class="section-title">1. 版本时间线</text><rect width="245" height="82" x="120" y="215" stroke-width="2" class="green" rx="12"/><text x="147" y="247" class="box-title">Java 16</text><text x="147" y="272" class="text">instanceof type pattern 正式</text><rect width="245" height="82" x="430" y="215" stroke-width="2" class="blue" rx="12"/><text x="457" y="247" class="box-title">Java 17</text><text x="457" y="272" class="text">sealed classes 正式</text><rect width="245" height="82" x="740" y="215" stroke-width="2" class="violet" rx="12"/><text x="767" y="247" class="box-title">Java 21</text><text x="767" y="272" class="text">switch patterns / record patterns 正式</text><path d="M365 256 H421" class="arrow"/><path d="M675 256 H731" class="arrow"/><rect width="160" height="82" x="1030" y="215" stroke-width="2" class="yellow" rx="12"/><text x="1057" y="247" class="box-title">答题口径</text><text x="1057" y="272" class="text">不要笼统归到 Java 17</text><rect width="575" height="330" x="70" y="405" class="panel" rx="16"/><text x="96" y="441" class="section-title">2. instanceof 模式与 flow scoping</text><rect width="245" height="86" x="105" y="495" stroke-width="2" class="blue" rx="12"/><text x="132" y="527" class="box-title">类型测试 + 绑定</text><text x="132" y="552" class="mono">obj instanceof String s</text><text x="132" y="570" class="text">匹配成功后 s 可用</text><rect width="220" height="86" x="390" y="495" stroke-width="2" class="green" rx="12"/><text x="417" y="527" class="box-title">守卫条件</text><text x="417" y="552" class="mono">&amp;&amp; s.length() &gt; 3</text><text x="417" y="570" class="text">右侧能使用 s</text><rect width="360" height="64" x="175" y="625" stroke-width="2" class="red" rx="12"/><text x="202" y="654" class="box-title">作用域由控制流决定</text><text x="202" y="674" class="text">只有编译器能证明匹配成功的路径，模式变量才可见。</text><rect width="575" height="330" x="675" y="405" class="panel" rx="16"/><text x="701" y="441" class="section-title">3. Java 21 switch / record patterns</text><rect width="230" height="76" x="710" y="495" stroke-width="2" class="cyan" rx="12"/><text x="737" y="526" class="box-title">case null</text><text x="737" y="550" class="text">显式定义 null 语义</text><rect width="230" height="76" x="980" y="495" stroke-width="2" class="green" rx="12"/><text x="1007" y="526" class="box-title">类型模式 + when</text><text x="1007" y="550" class="text">类型绑定后继续守卫</text><rect width="230" height="76" x="710" y="615" stroke-width="2" class="yellow" rx="12"/><text x="737" y="646" class="box-title">record pattern</text><text x="737" y="670" class="mono">Point(int x, int y)</text><rect width="230" height="76" x="980" y="615" stroke-width="2" class="red" rx="12"/><text x="1007" y="646" class="box-title">支配关系</text><text x="1007" y="670" class="text">宽 case 放前会遮住窄 case</text><rect width="1180" height="285" x="70" y="775" class="panel" rx="16"/><text x="96" y="811" class="section-title">4. sealed 穷举与开放层次边界</text><rect width="250" height="82" x="105" y="875" stroke-width="2" class="blue" rx="12"/><text x="132" y="907" class="box-title">sealed selector</text><text x="132" y="932" class="text">编译器知道 permitted 子类</text><rect width="250" height="82" x="405" y="875" stroke-width="2" class="green" rx="12"/><text x="432" y="907" class="box-title">穷举覆盖</text><text x="432" y="932" class="text">覆盖全部分支可省 default</text><rect width="250" height="82" x="705" y="875" stroke-width="2" class="yellow" rx="12"/><text x="732" y="907" class="box-title">新增子类型</text><text x="732" y="932" class="text">遗漏分支变成编译期问题</text><rect width="190" height="82" x="1005" y="875" stroke-width="2" class="red" rx="12"/><text x="1032" y="907" class="box-title">开放层次</text><text x="1032" y="932" class="text">需要 default 或兜底分支</text><path d="M355 916 H396" class="arrow"/><path d="M655 916 H696" class="arrow"/><path d="M955 916 H996" class="arrow"/><rect width="980" height="42" x="170" y="995" stroke-width="2" class="cyan" rx="12"/><text x="197" y="1022" class="text">价值不是语法更短，而是减少不安全强转、明确 null 策略、让穷举和不可达分支由编译器检查。</text><rect width="1180" height="120" x="70" y="1095" class="panel" rx="16"/><text x="96" y="1131" class="section-title">5. 工程边界</text><text x="120" y="1170" class="text">类型层次设计混乱时，pattern matching 只会把复杂性集中到 switch；复杂 guard 仍然需要单元测试和覆盖率保障。</text><text x="120" y="1196" class="text">Visitor 仍适合“操作经常新增、类型层次稳定”的场景；sealed + switch 更适合“类型集合封闭、分派集中”的场景。</text><text x="96" y="1288" class="small">答题抓手：版本口径、flow scoping、case null、when guard、record 解构、支配关系、sealed 穷举、开放类型兜底。</text></svg>