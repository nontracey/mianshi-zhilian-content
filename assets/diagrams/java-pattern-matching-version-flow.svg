<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1360" viewBox="0 0 1320 1360" role="img" aria-labelledby="title desc">
  <title id="title">Java pattern matching versions, flow scoping, switch patterns, record patterns, and sealed exhaustiveness</title>
  <desc id="desc">A topic-specific diagram explaining Java pattern matching version boundaries: instanceof type patterns in Java 16, sealed classes in Java 17, switch and record patterns in Java 21, flow scoping, null handling, guards, record deconstruction, dominance, sealed exhaustiveness, and open hierarchy default handling.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1360"/>
  <text class="title" x="70" y="64">Pattern Matching：让类型测试、绑定和穷举交给编译器</text>
  <text class="subtitle" x="70" y="96">版本边界要说准：Java 16 instanceof，Java 17 sealed，Java 21 switch 与 record patterns。</text>

  <rect class="panel" x="70" y="130" width="1180" height="230" rx="16"/>
  <text class="section-title" x="96" y="166">1. 版本时间线</text>

  <rect class="green" x="120" y="215" width="245" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="147" y="247">Java 16</text>
  <text class="text" x="147" y="272">instanceof type pattern 正式</text>

  <rect class="blue" x="430" y="215" width="245" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="457" y="247">Java 17</text>
  <text class="text" x="457" y="272">sealed classes 正式</text>

  <rect class="violet" x="740" y="215" width="245" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="767" y="247">Java 21</text>
  <text class="text" x="767" y="272">switch patterns / record patterns 正式</text>

  <path class="arrow" d="M365 256 H421"/>
  <path class="arrow" d="M675 256 H731"/>

  <rect class="yellow" x="1030" y="215" width="160" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1057" y="247">答题口径</text>
  <text class="text" x="1057" y="272">不要笼统归到 Java 17</text>

  <rect class="panel" x="70" y="405" width="575" height="330" rx="16"/>
  <text class="section-title" x="96" y="441">2. instanceof 模式与 flow scoping</text>

  <rect class="blue" x="105" y="495" width="245" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="527">类型测试 + 绑定</text>
  <text class="mono" x="132" y="552">obj instanceof String s</text>
  <text class="text" x="132" y="570">匹配成功后 s 可用</text>

  <rect class="green" x="390" y="495" width="220" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="417" y="527">守卫条件</text>
  <text class="mono" x="417" y="552">&amp;&amp; s.length() &gt; 3</text>
  <text class="text" x="417" y="570">右侧能使用 s</text>

  <rect class="red" x="175" y="625" width="360" height="64" rx="12" stroke-width="2"/>
  <text class="box-title" x="202" y="654">作用域由控制流决定</text>
  <text class="text" x="202" y="674">只有编译器能证明匹配成功的路径，模式变量才可见。</text>

  <rect class="panel" x="675" y="405" width="575" height="330" rx="16"/>
  <text class="section-title" x="701" y="441">3. Java 21 switch / record patterns</text>

  <rect class="cyan" x="710" y="495" width="230" height="76" rx="12" stroke-width="2"/>
  <text class="box-title" x="737" y="526">case null</text>
  <text class="text" x="737" y="550">显式定义 null 语义</text>

  <rect class="green" x="980" y="495" width="230" height="76" rx="12" stroke-width="2"/>
  <text class="box-title" x="1007" y="526">类型模式 + when</text>
  <text class="text" x="1007" y="550">类型绑定后继续守卫</text>

  <rect class="yellow" x="710" y="615" width="230" height="76" rx="12" stroke-width="2"/>
  <text class="box-title" x="737" y="646">record pattern</text>
  <text class="mono" x="737" y="670">Point(int x, int y)</text>

  <rect class="red" x="980" y="615" width="230" height="76" rx="12" stroke-width="2"/>
  <text class="box-title" x="1007" y="646">支配关系</text>
  <text class="text" x="1007" y="670">宽 case 放前会遮住窄 case</text>

  <rect class="panel" x="70" y="775" width="1180" height="285" rx="16"/>
  <text class="section-title" x="96" y="811">4. sealed 穷举与开放层次边界</text>

  <rect class="blue" x="105" y="875" width="250" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="907">sealed selector</text>
  <text class="text" x="132" y="932">编译器知道 permitted 子类</text>

  <rect class="green" x="405" y="875" width="250" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="432" y="907">穷举覆盖</text>
  <text class="text" x="432" y="932">覆盖全部分支可省 default</text>

  <rect class="yellow" x="705" y="875" width="250" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="732" y="907">新增子类型</text>
  <text class="text" x="732" y="932">遗漏分支变成编译期问题</text>

  <rect class="red" x="1005" y="875" width="190" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1032" y="907">开放层次</text>
  <text class="text" x="1032" y="932">需要 default 或兜底分支</text>

  <path class="arrow" d="M355 916 H396"/>
  <path class="arrow" d="M655 916 H696"/>
  <path class="arrow" d="M955 916 H996"/>

  <rect class="cyan" x="170" y="995" width="980" height="42" rx="12" stroke-width="2"/>
  <text class="text" x="197" y="1022">价值不是语法更短，而是减少不安全强转、明确 null 策略、让穷举和不可达分支由编译器检查。</text>

  <rect class="panel" x="70" y="1095" width="1180" height="120" rx="16"/>
  <text class="section-title" x="96" y="1131">5. 工程边界</text>
  <text class="text" x="120" y="1170">类型层次设计混乱时，pattern matching 只会把复杂性集中到 switch；复杂 guard 仍然需要单元测试和覆盖率保障。</text>
  <text class="text" x="120" y="1196">Visitor 仍适合“操作经常新增、类型层次稳定”的场景；sealed + switch 更适合“类型集合封闭、分派集中”的场景。</text>

  <text class="small" x="96" y="1288">答题抓手：版本口径、flow scoping、case null、when guard、record 解构、支配关系、sealed 穷举、开放类型兜底。</text>
</svg>
