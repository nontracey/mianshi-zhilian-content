<svg width="100%" aria-label="策略模式示意图" role="img" viewBox="0 0 680 340"><title>策略模式示意图</title><desc>通过接口多态消除if-else分支</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="340" y="24" fill="#042C53" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">策略模式</text><text x="340" y="44" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">消除if-else，运行时切换算法</text><rect width="180" height="40" x="250" y="64" fill="#EEEDFE" stroke="#7F77DD" stroke-width=".5" rx="8"/><text x="340" y="88" fill="#26215C" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">&lt;&lt;interface&gt;&gt; Strategy</text><rect width="150" height="40" x="80" y="140" fill="#E6F1FB" stroke="#378ADD" stroke-width=".5" rx="8"/><text x="155" y="164" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">StrategyA</text><line x1="340" x2="155" y1="104" y2="138" stroke="#7F77DD" stroke-width=".8"/><rect width="150" height="40" x="280" y="140" fill="#E1F5EE" stroke="#378ADD" stroke-width=".5" rx="8"/><text x="355" y="164" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">StrategyB</text><line x1="340" x2="355" y1="104" y2="138" stroke="#7F77DD" stroke-width=".8"/><rect width="150" height="40" x="480" y="140" fill="#FAEEDA" stroke="#378ADD" stroke-width=".5" rx="8"/><text x="555" y="164" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">StrategyC</text><line x1="340" x2="555" y1="104" y2="138" stroke="#7F77DD" stroke-width=".8"/><rect width="240" height="40" x="220" y="210" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="8"/><text x="340" y="234" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Context (持有Strategy引用)</text><rect width="520" height="50" x="80" y="270" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="10"/><text x="340" y="290" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Spring中: Map&lt;String, Strategy&gt; 注入</text><text x="340" y="308" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">根据key选择策略，无需if-else</text></svg>