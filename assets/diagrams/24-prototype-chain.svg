<svg viewBox="0 0 680 280" width="100%" role="img" aria-label="原型链示意图">
<title>原型链示意图</title><desc>JavaScript原型继承的查找机制</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">JavaScript 原型链</text>
<rect x="80" y="56" width="160" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="160" y="74" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">const obj = {}</text>
<text x="160" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">obj.__proto__</text>
<rect x="320" y="56" width="160" height="44" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="400" y="74" text-anchor="middle" font-size="12" font-weight="500" fill="#26215C" font-family="system-ui, sans-serif">Object.prototype</text>
<text x="400" y="92" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">constructor / toString</text>
<line x1="240" y1="78" x2="318" y2="78" stroke="#378ADD" stroke-width="1" marker-end="url(#a)"/>
<text x="280" y="70" text-anchor="middle" font-size="10" font-weight="400" fill="#378ADD" font-family="system-ui, sans-serif">__proto__</text>
<rect x="540" y="56" width="80" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="580" y="82" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">null</text>
<line x1="480" y1="78" x2="538" y2="78" stroke="#B4B2A9" stroke-width="1" marker-end="url(#a)"/>
<rect x="80" y="130" width="160" height="44" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="160" y="148" text-anchor="middle" font-size="12" font-weight="500" fill="#412402" font-family="system-ui, sans-serif">function Foo(){}</text>
<text x="160" y="166" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">Foo.prototype</text>
<line x1="160" y1="100" x2="160" y2="128" stroke="#BA7517" stroke-width="1" marker-end="url(#a)"/>
<rect x="80" y="200" width="520" height="60" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="220" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">属性查找规则</text>
<text x="340" y="240" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">obj -&gt; obj.__proto__ -&gt; Object.prototype -&gt; null</text>
<text x="340" y="254" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">找到即停，未找到返回undefined</text>
</svg>