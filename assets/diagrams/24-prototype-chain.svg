<svg width="100%" aria-label="原型链示意图" role="img" viewBox="0 0 680 280"><title>原型链示意图</title><desc>JavaScript原型继承的查找机制</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="340" y="24" fill="#042C53" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">JavaScript 原型链</text><rect width="160" height="44" x="80" y="56" fill="#E6F1FB" stroke="#378ADD" stroke-width=".5" rx="8"/><text x="160" y="74" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">const obj = {}</text><text x="160" y="92" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">obj.__proto__</text><rect width="160" height="44" x="320" y="56" fill="#EEEDFE" stroke="#7F77DD" stroke-width=".5" rx="8"/><text x="400" y="74" fill="#26215C" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Object.prototype</text><text x="400" y="92" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">constructor / toString</text><line x1="240" x2="318" y1="78" y2="78" stroke="#378ADD" stroke-width="1" marker-end="url(#a)"/><text x="280" y="70" fill="#378ADD" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">__proto__</text><rect width="80" height="44" x="540" y="56" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="8"/><text x="580" y="82" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">null</text><line x1="480" x2="538" y1="78" y2="78" stroke="#B4B2A9" stroke-width="1" marker-end="url(#a)"/><rect width="160" height="44" x="80" y="130" fill="#FAEEDA" stroke="#BA7517" stroke-width=".5" rx="8"/><text x="160" y="148" fill="#412402" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">function Foo(){}</text><text x="160" y="166" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">Foo.prototype</text><line x1="160" x2="160" y1="100" y2="128" stroke="#BA7517" stroke-width="1" marker-end="url(#a)"/><rect width="520" height="60" x="80" y="200" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="10"/><text x="340" y="220" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">属性查找规则</text><text x="340" y="240" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">obj -&gt; obj.__proto__ -&gt; Object.prototype -&gt; null</text><text x="340" y="254" fill="#888780" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">找到即停，未找到返回undefined</text></svg>