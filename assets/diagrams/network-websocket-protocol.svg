<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">WebSocket 握手、帧结构与生产链路</title><desc id="desc">展示 WebSocket 从 HTTP Upgrade 或扩展 CONNECT 握手进入帧协议，解释客户端 mask、控制帧规则、心跳、重连和多实例消息总线。</desc><defs><marker id="arrow-blue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#059669" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.title{font:800 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.panel-title{font:750 27px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:750 20px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1e293b}.small{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.tiny-strong{font:750 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.edge{stroke-width:2;rx:14}.net{fill:#eff6ff;stroke:#60a5fa}.net,.server{stroke-width:2;rx:14}.edge{fill:#f0fdfa;stroke:#2dd4bf}.server{fill:#ecfdf5;stroke:#34d399}.frame{stroke-width:2}.gray,.rule,.warn{stroke-width:2;rx:14}.warn{fill:#fff7ed;stroke:#fb923c}.rule{fill:#fef2f2;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#cbd5e1}.frame{fill:#eef2ff;stroke:#818cf8;rx:10}.line-blue,.line-green{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow-blue)}.line-green{stroke:#059669;marker-end:url(#arrow-green)}</style></defs><rect width="1320" height="1320" class="bg"/><text x="660" y="56" class="title" text-anchor="middle">WebSocket：先用 HTTP 握手，再切到消息帧</text><text x="660" y="90" class="subtitle" text-anchor="middle">要讲清的是协议切换、帧规则、心跳重连和集群广播，不是只说“长连接”</text><rect width="1200" height="325" x="60" y="125" class="panel"/><text x="92" y="168" class="panel-title">1. Opening handshake：HTTP/1.1 Upgrade 或 HTTP/2/3 扩展 CONNECT</text><rect width="220" height="76" x="95" y="205" class="net"/><text x="205" y="236" class="label" text-anchor="middle">Browser</text><text x="205" y="262" class="tiny" text-anchor="middle">Origin、Cookie、Key</text><path d="M 320 243 L 400 243" class="line-blue"/><rect width="220" height="76" x="405" y="205" class="edge"/><text x="515" y="236" class="label" text-anchor="middle">Nginx / LB</text><text x="515" y="262" class="tiny" text-anchor="middle">透传 Upgrade</text><path d="M 630 243 L 710 243" class="line-blue"/><rect width="250" height="76" x="715" y="205" class="server"/><text x="840" y="236" class="label" text-anchor="middle">WebSocket Server</text><text x="840" y="262" class="tiny" text-anchor="middle">校验鉴权与 Origin</text><path d="M 970 243 L 1050 243" class="line-green"/><rect width="165" height="76" x="1055" y="205" class="server"/><text x="1137" y="236" class="label" text-anchor="middle">101</text><text x="1137" y="262" class="tiny" text-anchor="middle">切到 WS 帧</text><rect width="505" height="88" x="95" y="315" class="gray"/><text x="125" y="343" class="tiny-strong">HTTP/1.1 request</text><text x="125" y="369" class="tiny">GET /ws + Upgrade: websocket + Connection: Upgrade</text><text x="125" y="392" class="tiny">Sec-WebSocket-Key / Version: 13 / Origin / Cookie</text><rect width="570" height="88" x="650" y="315" class="gray"/><text x="680" y="343" class="tiny-strong">Server response</text><text x="680" y="369" class="tiny">Sec-WebSocket-Accept = base64(SHA1(key + GUID))</text><text x="680" y="392" class="tiny">HTTP/2/3 不用 Upgrade，使用 Extended CONNECT + :protocol = websocket</text><rect width="1200" height="315" x="60" y="485" class="panel"/><text x="92" y="528" class="panel-title">2. Frame anatomy：mask 和控制帧规则是面试高频细节</text><rect width="155" height="80" x="100" y="575" class="frame"/><text x="177" y="604" class="label" text-anchor="middle">Byte 0</text><text x="177" y="630" class="tiny" text-anchor="middle">FIN / RSV / opcode</text><rect width="165" height="80" x="270" y="575" class="frame"/><text x="352" y="604" class="label" text-anchor="middle">Byte 1</text><text x="352" y="630" class="tiny" text-anchor="middle">MASK / payload len</text><rect width="175" height="80" x="450" y="575" class="frame"/><text x="537" y="604" class="label" text-anchor="middle">Ext len</text><text x="537" y="630" class="tiny" text-anchor="middle">126 =&gt; 2B, 127 =&gt; 8B</text><rect width="190" height="80" x="640" y="575" class="frame"/><text x="735" y="604" class="label" text-anchor="middle">Masking key</text><text x="735" y="630" class="tiny" text-anchor="middle">客户端帧才有 4B</text><rect width="375" height="80" x="845" y="575" class="frame"/><text x="1032" y="604" class="label" text-anchor="middle">Payload</text><text x="1032" y="630" class="tiny" text-anchor="middle">text / binary / continuation / control</text><rect width="345" height="60" x="100" y="700" class="rule"/><text x="272" y="724" class="tiny-strong" text-anchor="middle">客户端 -&gt; 服务端：MASK 必须为 1</text><text x="272" y="747" class="tiny" text-anchor="middle">不校验 mask 应按 1002 协议错误关闭</text><rect width="345" height="60" x="490" y="700" class="rule"/><text x="662" y="724" class="tiny-strong" text-anchor="middle">服务端 -&gt; 客户端：通常不 mask</text><text x="662" y="747" class="tiny" text-anchor="middle">mask 是防代理缓存投毒，不是加密</text><rect width="345" height="60" x="875" y="700" class="rule"/><text x="1047" y="724" class="tiny-strong" text-anchor="middle">控制帧：close / ping / pong</text><text x="1047" y="747" class="tiny" text-anchor="middle">payload &lt;= 125，FIN 必须为 1，不可分片</text><rect width="1200" height="360" x="60" y="835" class="panel"/><text x="92" y="878" class="panel-title">3. Production path：心跳、重连、补拉和多实例广播</text><rect width="205" height="78" x="95" y="935" class="net"/><text x="197" y="966" class="label" text-anchor="middle">Browser client</text><text x="197" y="992" class="tiny" text-anchor="middle">自动 pong，JS 不暴露协议 ping</text><path d="M 305 974 L 395 974" class="line-green"/><rect width="180" height="78" x="400" y="935" class="edge"/><text x="490" y="966" class="label" text-anchor="middle">Sticky LB</text><text x="490" y="992" class="tiny" text-anchor="middle">idle timeout 要大于心跳</text><path d="M 585 974 L 675 940" class="line-green"/><path d="M 585 974 L 675 1048" class="line-green"/><rect width="205" height="78" x="680" y="900" class="server"/><text x="782" y="931" class="label" text-anchor="middle">WS node A</text><text x="782" y="957" class="tiny" text-anchor="middle">server ping / app pong</text><rect width="205" height="78" x="680" y="1010" class="server"/><text x="782" y="1041" class="label" text-anchor="middle">WS node B</text><text x="782" y="1067" class="tiny" text-anchor="middle">重连后重订阅</text><path d="M 890 939 L 990 974" class="line-blue"/><path d="M 890 1049 L 990 974" class="line-blue"/><rect width="225" height="78" x="995" y="935" class="warn"/><text x="1107" y="966" class="label" text-anchor="middle">Redis / Kafka / NATS</text><text x="1107" y="992" class="tiny" text-anchor="middle">跨实例房间广播</text><rect width="1125" height="52" x="95" y="1120" class="gray"/><text x="657" y="1142" class="small" text-anchor="middle">断线重连不要固定间隔：指数退避 + 抖动；重连后重新鉴权、重订阅，并用 sequence/lastEventId 补拉缺口</text><text x="657" y="1164" class="tiny" text-anchor="middle">Nginx 默认 60s 无上游数据会关闭连接：调 proxy_read_timeout，且让服务端定期发送 ping 或应用心跳响应</text></svg>