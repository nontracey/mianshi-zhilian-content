<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">WebSocket 握手、帧结构与生产链路</title>
  <desc id="desc">展示 WebSocket 从 HTTP Upgrade 或扩展 CONNECT 握手进入帧协议，解释客户端 mask、控制帧规则、心跳、重连和多实例消息总线。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .title { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .panel-title { font: 750 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 750 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny-strong { font: 750 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .net { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 14; }
      .edge { fill: #f0fdfa; stroke: #2dd4bf; stroke-width: 2; rx: 14; }
      .server { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 14; }
      .warn { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 14; }
      .rule { fill: #fef2f2; stroke: #f87171; stroke-width: 2; rx: 14; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .frame { fill: #eef2ff; stroke: #818cf8; stroke-width: 2; rx: 10; }
      .line-blue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .line-green { stroke: #059669; stroke-width: 4; fill: none; marker-end: url(#arrow-green); }
      .line-red { stroke: #dc2626; stroke-width: 4; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="660" y="56" text-anchor="middle">WebSocket：先用 HTTP 握手，再切到消息帧</text>
  <text class="subtitle" x="660" y="90" text-anchor="middle">要讲清的是协议切换、帧规则、心跳重连和集群广播，不是只说“长连接”</text>

  <rect class="panel" x="60" y="125" width="1200" height="325"/>
  <text class="panel-title" x="92" y="168">1. Opening handshake：HTTP/1.1 Upgrade 或 HTTP/2/3 扩展 CONNECT</text>
  <rect class="net" x="95" y="205" width="220" height="76"/>
  <text class="label" x="205" y="236" text-anchor="middle">Browser</text>
  <text class="tiny" x="205" y="262" text-anchor="middle">Origin、Cookie、Key</text>
  <path class="line-blue" d="M 320 243 L 400 243"/>
  <rect class="edge" x="405" y="205" width="220" height="76"/>
  <text class="label" x="515" y="236" text-anchor="middle">Nginx / LB</text>
  <text class="tiny" x="515" y="262" text-anchor="middle">透传 Upgrade</text>
  <path class="line-blue" d="M 630 243 L 710 243"/>
  <rect class="server" x="715" y="205" width="250" height="76"/>
  <text class="label" x="840" y="236" text-anchor="middle">WebSocket Server</text>
  <text class="tiny" x="840" y="262" text-anchor="middle">校验鉴权与 Origin</text>
  <path class="line-green" d="M 970 243 L 1050 243"/>
  <rect class="server" x="1055" y="205" width="165" height="76"/>
  <text class="label" x="1137" y="236" text-anchor="middle">101</text>
  <text class="tiny" x="1137" y="262" text-anchor="middle">切到 WS 帧</text>

  <rect class="gray" x="95" y="315" width="505" height="88"/>
  <text class="tiny-strong" x="125" y="343">HTTP/1.1 request</text>
  <text class="tiny" x="125" y="369">GET /ws + Upgrade: websocket + Connection: Upgrade</text>
  <text class="tiny" x="125" y="392">Sec-WebSocket-Key / Version: 13 / Origin / Cookie</text>
  <rect class="gray" x="650" y="315" width="570" height="88"/>
  <text class="tiny-strong" x="680" y="343">Server response</text>
  <text class="tiny" x="680" y="369">Sec-WebSocket-Accept = base64(SHA1(key + GUID))</text>
  <text class="tiny" x="680" y="392">HTTP/2/3 不用 Upgrade，使用 Extended CONNECT + :protocol = websocket</text>

  <rect class="panel" x="60" y="485" width="1200" height="315"/>
  <text class="panel-title" x="92" y="528">2. Frame anatomy：mask 和控制帧规则是面试高频细节</text>
  <rect class="frame" x="100" y="575" width="155" height="80"/>
  <text class="label" x="177" y="604" text-anchor="middle">Byte 0</text>
  <text class="tiny" x="177" y="630" text-anchor="middle">FIN / RSV / opcode</text>
  <rect class="frame" x="270" y="575" width="165" height="80"/>
  <text class="label" x="352" y="604" text-anchor="middle">Byte 1</text>
  <text class="tiny" x="352" y="630" text-anchor="middle">MASK / payload len</text>
  <rect class="frame" x="450" y="575" width="175" height="80"/>
  <text class="label" x="537" y="604" text-anchor="middle">Ext len</text>
  <text class="tiny" x="537" y="630" text-anchor="middle">126 => 2B, 127 => 8B</text>
  <rect class="frame" x="640" y="575" width="190" height="80"/>
  <text class="label" x="735" y="604" text-anchor="middle">Masking key</text>
  <text class="tiny" x="735" y="630" text-anchor="middle">客户端帧才有 4B</text>
  <rect class="frame" x="845" y="575" width="375" height="80"/>
  <text class="label" x="1032" y="604" text-anchor="middle">Payload</text>
  <text class="tiny" x="1032" y="630" text-anchor="middle">text / binary / continuation / control</text>
  <rect class="rule" x="100" y="700" width="345" height="60"/>
  <text class="tiny-strong" x="272" y="724" text-anchor="middle">客户端 -> 服务端：MASK 必须为 1</text>
  <text class="tiny" x="272" y="747" text-anchor="middle">不校验 mask 应按 1002 协议错误关闭</text>
  <rect class="rule" x="490" y="700" width="345" height="60"/>
  <text class="tiny-strong" x="662" y="724" text-anchor="middle">服务端 -> 客户端：通常不 mask</text>
  <text class="tiny" x="662" y="747" text-anchor="middle">mask 是防代理缓存投毒，不是加密</text>
  <rect class="rule" x="875" y="700" width="345" height="60"/>
  <text class="tiny-strong" x="1047" y="724" text-anchor="middle">控制帧：close / ping / pong</text>
  <text class="tiny" x="1047" y="747" text-anchor="middle">payload &lt;= 125，FIN 必须为 1，不可分片</text>

  <rect class="panel" x="60" y="835" width="1200" height="360"/>
  <text class="panel-title" x="92" y="878">3. Production path：心跳、重连、补拉和多实例广播</text>
  <rect class="net" x="95" y="935" width="205" height="78"/>
  <text class="label" x="197" y="966" text-anchor="middle">Browser client</text>
  <text class="tiny" x="197" y="992" text-anchor="middle">自动 pong，JS 不暴露协议 ping</text>
  <path class="line-green" d="M 305 974 L 395 974"/>
  <rect class="edge" x="400" y="935" width="180" height="78"/>
  <text class="label" x="490" y="966" text-anchor="middle">Sticky LB</text>
  <text class="tiny" x="490" y="992" text-anchor="middle">idle timeout 要大于心跳</text>
  <path class="line-green" d="M 585 974 L 675 940"/>
  <path class="line-green" d="M 585 974 L 675 1048"/>
  <rect class="server" x="680" y="900" width="205" height="78"/>
  <text class="label" x="782" y="931" text-anchor="middle">WS node A</text>
  <text class="tiny" x="782" y="957" text-anchor="middle">server ping / app pong</text>
  <rect class="server" x="680" y="1010" width="205" height="78"/>
  <text class="label" x="782" y="1041" text-anchor="middle">WS node B</text>
  <text class="tiny" x="782" y="1067" text-anchor="middle">重连后重订阅</text>
  <path class="line-blue" d="M 890 939 L 990 974"/>
  <path class="line-blue" d="M 890 1049 L 990 974"/>
  <rect class="warn" x="995" y="935" width="225" height="78"/>
  <text class="label" x="1107" y="966" text-anchor="middle">Redis / Kafka / NATS</text>
  <text class="tiny" x="1107" y="992" text-anchor="middle">跨实例房间广播</text>

  <rect class="gray" x="95" y="1120" width="1125" height="52"/>
  <text class="small" x="657" y="1142" text-anchor="middle">断线重连不要固定间隔：指数退避 + 抖动；重连后重新鉴权、重订阅，并用 sequence/lastEventId 补拉缺口</text>
  <text class="tiny" x="657" y="1164" text-anchor="middle">Nginx 默认 60s 无上游数据会关闭连接：调 proxy_read_timeout，且让服务端定期发送 ping 或应用心跳响应</text>
</svg>
