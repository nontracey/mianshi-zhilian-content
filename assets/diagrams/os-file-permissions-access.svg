<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">Linux 文件权限判定：路径、身份、权限位与特殊位</title>
  <desc id="desc">展示 Linux 访问一个文件时先检查路径目录执行权限，再根据进程有效用户和组选择 owner/group/other 权限位，并结合 umask、SUID、SGID、Sticky Bit 理解常见排障边界。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .h2 { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 700 28px "SFMono-Regular", Consolas, monospace; fill: #0f172a; }
      .monoSmall { font: 700 17px "SFMono-Regular", Consolas, monospace; fill: #1f2937; }
      .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 8; }
      .green { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 8; }
      .amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; rx: 8; }
      .red { fill: #fef2f2; stroke: #f87171; stroke-width: 2; rx: 8; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .warn { stroke: #dc2626; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb" />
    </marker>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="660" y="55" text-anchor="middle">文件权限不是只背 755：路径、身份、权限位一起判</text>
  <text class="subtitle" x="660" y="88" text-anchor="middle">能否访问 = 每级目录可穿越 + 进程身份匹配 + 操作需要的权限位</text>

  <rect class="panel" x="58" y="120" width="1204" height="260"/>
  <text class="h2" x="90" y="162">1. 先把 ls -l 拆成可解释的字段</text>
  <text class="mono" x="130" y="225">-rwsr-sr-t  1  alice  devs  app.sh</text>
  <rect class="blue" x="95" y="260" width="140" height="72"/>
  <text class="label" x="165" y="288" text-anchor="middle">owner</text>
  <text class="monoSmall" x="165" y="314" text-anchor="middle">r w s</text>
  <rect class="green" x="260" y="260" width="140" height="72"/>
  <text class="label" x="330" y="288" text-anchor="middle">group</text>
  <text class="monoSmall" x="330" y="314" text-anchor="middle">r - s</text>
  <rect class="amber" x="425" y="260" width="140" height="72"/>
  <text class="label" x="495" y="288" text-anchor="middle">other</text>
  <text class="monoSmall" x="495" y="314" text-anchor="middle">r - t</text>
  <rect class="gray" x="620" y="250" width="265" height="92"/>
  <text class="label" x="752" y="282" text-anchor="middle">s/t 的小写说明</text>
  <text class="text" x="752" y="311" text-anchor="middle">原本 x 位也存在；大写 S/T 则表示没有 x</text>
  <rect class="red" x="918" y="250" width="280" height="92"/>
  <text class="label" x="1058" y="282" text-anchor="middle">排障先确认身份</text>
  <text class="text" x="1058" y="311" text-anchor="middle">看服务进程的有效 UID/GID 和附加组</text>

  <rect class="panel" x="58" y="410" width="1204" height="355"/>
  <text class="h2" x="90" y="452">2. 一次访问的判定顺序</text>
  <rect class="blue" x="92" y="495" width="235" height="96"/>
  <text class="label" x="209" y="525" text-anchor="middle">路径可穿越</text>
  <text class="text" x="209" y="553" text-anchor="middle">/a /a/b 每级目录都要 x</text>
  <text class="text" x="209" y="578" text-anchor="middle">列目录名还需要目录 r</text>
  <path class="line" d="M330 543 H420"/>
  <rect class="green" x="425" y="495" width="235" height="96"/>
  <text class="label" x="542" y="525" text-anchor="middle">选择权限类别</text>
  <text class="text" x="542" y="553" text-anchor="middle">owner 优先，其次 group/附加组</text>
  <text class="text" x="542" y="578" text-anchor="middle">都不匹配才看 other</text>
  <path class="line" d="M664 543 H754"/>
  <rect class="amber" x="760" y="495" width="235" height="96"/>
  <text class="label" x="877" y="525" text-anchor="middle">匹配操作位</text>
  <text class="text" x="877" y="553" text-anchor="middle">文件读/写/执行看 r/w/x</text>
  <text class="text" x="877" y="578" text-anchor="middle">目录创建删除需要 w+x</text>
  <path class="line" d="M999 543 H1088"/>
  <rect class="red" x="1093" y="495" width="115" height="96"/>
  <text class="label" x="1150" y="538" text-anchor="middle">允许</text>
  <text class="text" x="1150" y="567" text-anchor="middle">或拒绝</text>

  <rect class="gray" x="92" y="630" width="350" height="86"/>
  <text class="label" x="267" y="661" text-anchor="middle">删除/重命名看父目录</text>
  <text class="text" x="267" y="690" text-anchor="middle">目标文件有 w 不代表能被删；父目录 w+x 才关键</text>
  <rect class="gray" x="485" y="630" width="330" height="86"/>
  <text class="label" x="650" y="661" text-anchor="middle">ACL 会改写 group 类判断</text>
  <text class="text" x="650" y="690" text-anchor="middle">有 ACL mask 时，组和命名用户/组会被 mask 限制</text>
  <rect class="gray" x="858" y="630" width="350" height="86"/>
  <text class="label" x="1033" y="661" text-anchor="middle">root 是特权例外</text>
  <text class="text" x="1033" y="690" text-anchor="middle">生产排障仍要按服务实际运行用户复现</text>

  <rect class="panel" x="58" y="795" width="1204" height="220"/>
  <text class="h2" x="90" y="837">3. umask 是按位屏蔽，不是十进制相减</text>
  <rect class="blue" x="100" y="875" width="270" height="92"/>
  <text class="label" x="235" y="907" text-anchor="middle">普通文件</text>
  <text class="monoSmall" x="235" y="936" text-anchor="middle">0666 &amp; ~0022 = 0644</text>
  <rect class="green" x="420" y="875" width="270" height="92"/>
  <text class="label" x="555" y="907" text-anchor="middle">目录</text>
  <text class="monoSmall" x="555" y="936" text-anchor="middle">0777 &amp; ~0022 = 0755</text>
  <rect class="amber" x="740" y="875" width="430" height="92"/>
  <text class="label" x="955" y="907" text-anchor="middle">为什么新文件通常没有 x</text>
  <text class="text" x="955" y="936" text-anchor="middle">创建普通文件默认请求 0666，程序显式请求才会带执行位</text>

  <rect class="panel" x="58" y="1045" width="1204" height="225"/>
  <text class="h2" x="90" y="1087">4. 特殊位要讲场景和风险</text>
  <rect class="blue" x="92" y="1125" width="265" height="90"/>
  <text class="label" x="224" y="1155" text-anchor="middle">SUID：可执行文件</text>
  <text class="text" x="224" y="1183" text-anchor="middle">执行时有效用户变为文件所有者</text>
  <rect class="green" x="390" y="1125" width="265" height="90"/>
  <text class="label" x="522" y="1155" text-anchor="middle">SGID：文件或目录</text>
  <text class="text" x="522" y="1183" text-anchor="middle">目录中新文件继承属组，适合共享目录</text>
  <rect class="amber" x="688" y="1125" width="265" height="90"/>
  <text class="label" x="820" y="1155" text-anchor="middle">Sticky：公共可写目录</text>
  <text class="tiny" x="820" y="1179" text-anchor="middle">限制删除/重命名：</text>
  <text class="tiny" x="820" y="1201" text-anchor="middle">文件主、目录主或 root</text>
  <rect class="red" x="986" y="1125" width="222" height="90"/>
  <text class="label" x="1097" y="1155" text-anchor="middle">安全底线</text>
  <text class="tiny" x="1097" y="1179" text-anchor="middle">少用 777；审计 SUID</text>
  <text class="tiny" x="1097" y="1201" text-anchor="middle">别 chmod -R 644 目录</text>
</svg>
