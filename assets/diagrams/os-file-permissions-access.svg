<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">Linux 文件权限判定：路径、身份、权限位与特殊位</title><desc id="desc">展示 Linux 访问一个文件时先检查路径目录执行权限，再根据进程有效用户和组选择 owner/group/other 权限位，并结合 umask、SUID、SGID、Sticky Bit 理解常见排障边界。</desc><defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:10}.title{font:700 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:600 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.h2{font:700 25px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:700 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:600 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:700 28px &quot;SFMono-Regular&quot;,Consolas,monospace;fill:#0f172a}.monoSmall{font:700 17px &quot;SFMono-Regular&quot;,Consolas,monospace;fill:#1f2937}.blue{fill:#eff6ff;stroke:#60a5fa}.amber,.blue,.gray{stroke-width:2;rx:8}.green{fill:#ecfdf5;stroke:#34d399}.green,.red{stroke-width:2;rx:8}.amber{fill:#fffbeb;stroke:#f59e0b}.red{fill:#fef2f2;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#cbd5e1}.line{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#2563eb" d="M2,2 L10,6 L2,10 Z"/></marker></defs><rect width="1320" height="1320" class="bg"/><text x="660" y="55" class="title" text-anchor="middle">文件权限不是只背 755：路径、身份、权限位一起判</text><text x="660" y="88" class="subtitle" text-anchor="middle">能否访问 = 每级目录可穿越 + 进程身份匹配 + 操作需要的权限位</text><rect width="1204" height="260" x="58" y="120" class="panel"/><text x="90" y="162" class="h2">1. 先把 ls -l 拆成可解释的字段</text><text x="130" y="225" class="mono">-rwsr-sr-t 1 alice devs app.sh</text><rect width="140" height="72" x="95" y="260" class="blue"/><text x="165" y="288" class="label" text-anchor="middle">owner</text><text x="165" y="314" class="monoSmall" text-anchor="middle">r w s</text><rect width="140" height="72" x="260" y="260" class="green"/><text x="330" y="288" class="label" text-anchor="middle">group</text><text x="330" y="314" class="monoSmall" text-anchor="middle">r - s</text><rect width="140" height="72" x="425" y="260" class="amber"/><text x="495" y="288" class="label" text-anchor="middle">other</text><text x="495" y="314" class="monoSmall" text-anchor="middle">r - t</text><rect width="265" height="92" x="620" y="250" class="gray"/><text x="752" y="282" class="label" text-anchor="middle">s/t 的小写说明</text><text x="752" y="311" class="text" text-anchor="middle">原本 x 位也存在；大写 S/T 则表示没有 x</text><rect width="280" height="92" x="918" y="250" class="red"/><text x="1058" y="282" class="label" text-anchor="middle">排障先确认身份</text><text x="1058" y="311" class="text" text-anchor="middle">看服务进程的有效 UID/GID 和附加组</text><rect width="1204" height="355" x="58" y="410" class="panel"/><text x="90" y="452" class="h2">2. 一次访问的判定顺序</text><rect width="235" height="96" x="92" y="495" class="blue"/><text x="209" y="525" class="label" text-anchor="middle">路径可穿越</text><text x="209" y="553" class="text" text-anchor="middle">/a /a/b 每级目录都要 x</text><text x="209" y="578" class="text" text-anchor="middle">列目录名还需要目录 r</text><path d="M330 543 H420" class="line"/><rect width="235" height="96" x="425" y="495" class="green"/><text x="542" y="525" class="label" text-anchor="middle">选择权限类别</text><text x="542" y="553" class="text" text-anchor="middle">owner 优先，其次 group/附加组</text><text x="542" y="578" class="text" text-anchor="middle">都不匹配才看 other</text><path d="M664 543 H754" class="line"/><rect width="235" height="96" x="760" y="495" class="amber"/><text x="877" y="525" class="label" text-anchor="middle">匹配操作位</text><text x="877" y="553" class="text" text-anchor="middle">文件读/写/执行看 r/w/x</text><text x="877" y="578" class="text" text-anchor="middle">目录创建删除需要 w+x</text><path d="M999 543 H1088" class="line"/><rect width="115" height="96" x="1093" y="495" class="red"/><text x="1150" y="538" class="label" text-anchor="middle">允许</text><text x="1150" y="567" class="text" text-anchor="middle">或拒绝</text><rect width="350" height="86" x="92" y="630" class="gray"/><text x="267" y="661" class="label" text-anchor="middle">删除/重命名看父目录</text><text x="267" y="690" class="text" text-anchor="middle">目标文件有 w 不代表能被删；父目录 w+x 才关键</text><rect width="330" height="86" x="485" y="630" class="gray"/><text x="650" y="661" class="label" text-anchor="middle">ACL 会改写 group 类判断</text><text x="650" y="690" class="text" text-anchor="middle">有 ACL mask 时，组和命名用户/组会被 mask 限制</text><rect width="350" height="86" x="858" y="630" class="gray"/><text x="1033" y="661" class="label" text-anchor="middle">root 是特权例外</text><text x="1033" y="690" class="text" text-anchor="middle">生产排障仍要按服务实际运行用户复现</text><rect width="1204" height="220" x="58" y="795" class="panel"/><text x="90" y="837" class="h2">3. umask 是按位屏蔽，不是十进制相减</text><rect width="270" height="92" x="100" y="875" class="blue"/><text x="235" y="907" class="label" text-anchor="middle">普通文件</text><text x="235" y="936" class="monoSmall" text-anchor="middle">0666 &amp; ~0022 = 0644</text><rect width="270" height="92" x="420" y="875" class="green"/><text x="555" y="907" class="label" text-anchor="middle">目录</text><text x="555" y="936" class="monoSmall" text-anchor="middle">0777 &amp; ~0022 = 0755</text><rect width="430" height="92" x="740" y="875" class="amber"/><text x="955" y="907" class="label" text-anchor="middle">为什么新文件通常没有 x</text><text x="955" y="936" class="text" text-anchor="middle">创建普通文件默认请求 0666，程序显式请求才会带执行位</text><rect width="1204" height="225" x="58" y="1045" class="panel"/><text x="90" y="1087" class="h2">4. 特殊位要讲场景和风险</text><rect width="265" height="90" x="92" y="1125" class="blue"/><text x="224" y="1155" class="label" text-anchor="middle">SUID：可执行文件</text><text x="224" y="1183" class="text" text-anchor="middle">执行时有效用户变为文件所有者</text><rect width="265" height="90" x="390" y="1125" class="green"/><text x="522" y="1155" class="label" text-anchor="middle">SGID：文件或目录</text><text x="522" y="1183" class="text" text-anchor="middle">目录中新文件继承属组，适合共享目录</text><rect width="265" height="90" x="688" y="1125" class="amber"/><text x="820" y="1155" class="label" text-anchor="middle">Sticky：公共可写目录</text><text x="820" y="1179" class="tiny" text-anchor="middle">限制删除/重命名：</text><text x="820" y="1201" class="tiny" text-anchor="middle">文件主、目录主或 root</text><rect width="222" height="90" x="986" y="1125" class="red"/><text x="1097" y="1155" class="label" text-anchor="middle">安全底线</text><text x="1097" y="1179" class="tiny" text-anchor="middle">少用 777；审计 SUID</text><text x="1097" y="1201" class="tiny" text-anchor="middle">别 chmod -R 644 目录</text></svg>