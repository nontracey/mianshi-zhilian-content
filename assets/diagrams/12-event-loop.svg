<svg width="100%" aria-label="Event Loop机制图" role="img" viewBox="0 0 680 328"><title>Event Loop机制图</title><desc>JavaScript单线程异步执行模型</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="340" y="24" fill="#042C53" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Event Loop 机制</text><text x="340" y="44" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">JavaScript 单线程异步模型</text><rect width="150" height="120" x="60" y="64" fill="#E6F1FB" stroke="#378ADD" stroke-width=".5" rx="10"/><text x="135" y="84" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">调用栈 (Call Stack)</text><text x="135" y="104" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">同步代码执行</text><rect width="110" height="24" x="80" y="116" fill="#FFF" stroke="#378ADD" stroke-width=".5" rx="4"/><text x="135" y="132" fill="#042C53" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">main()</text><rect width="150" height="120" x="250" y="64" fill="#FAEEDA" stroke="#BA7517" stroke-width=".5" rx="10"/><text x="325" y="84" fill="#412402" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Web APIs</text><text x="325" y="104" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">setTimeout</text><text x="325" y="120" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">fetch/DOM事件</text><text x="325" y="136" fill="#888780" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">异步操作委托</text><rect width="180" height="56" x="440" y="64" fill="#EEEDFE" stroke="#7F77DD" stroke-width=".5" rx="10"/><text x="530" y="84" fill="#26215C" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">宏任务队列</text><text x="530" y="104" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">setTimeout/setInterval</text><rect width="180" height="54" x="440" y="130" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".5" rx="10"/><text x="530" y="150" fill="#04342C" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">微任务队列</text><text x="530" y="168" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">Promise.then/MutationObs</text><line x1="210" x2="248" y1="124" y2="124" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><line x1="400" x2="438" y1="92" y2="92" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><line x1="400" x2="438" y1="150" y2="150" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><path fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)" d="M530 184 L530 210 L135 210 L135 184"/><text x="340" y="226" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Event Loop: 栈空时先清微任务，再取宏任务</text><rect width="520" height="60" x="80" y="248" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="10"/><text x="340" y="268" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">执行顺序: 同步代码 -&gt; 微任务 -&gt; 宏任务 -&gt; 渲染</text><text x="340" y="290" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">Node.js: timers -&gt; poll -&gt; check (process.nextTick优先)</text></svg>