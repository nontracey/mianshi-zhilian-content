<svg viewBox="0 0 680 328" width="100%" role="img" aria-label="Event Loop机制图">
<title>Event Loop机制图</title><desc>JavaScript单线程异步执行模型</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Event Loop 机制</text>
<text x="340" y="44" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">JavaScript 单线程异步模型</text>
<rect x="60" y="64" width="150" height="120" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="135" y="84" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">调用栈 (Call Stack)</text>
<text x="135" y="104" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">同步代码执行</text>
<rect x="80" y="116" width="110" height="24" rx="4" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
<text x="135" y="132" text-anchor="middle" font-size="11" font-weight="400" fill="#042C53" font-family="system-ui, sans-serif">main()</text>
<rect x="250" y="64" width="150" height="120" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="325" y="84" text-anchor="middle" font-size="12" font-weight="500" fill="#412402" font-family="system-ui, sans-serif">Web APIs</text>
<text x="325" y="104" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">setTimeout</text>
<text x="325" y="120" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">fetch/DOM事件</text>
<text x="325" y="136" text-anchor="middle" font-size="11" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">异步操作委托</text>
<rect x="440" y="64" width="180" height="56" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="530" y="84" text-anchor="middle" font-size="12" font-weight="500" fill="#26215C" font-family="system-ui, sans-serif">宏任务队列</text>
<text x="530" y="104" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">setTimeout/setInterval</text>
<rect x="440" y="130" width="180" height="54" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="530" y="150" text-anchor="middle" font-size="12" font-weight="500" fill="#04342C" font-family="system-ui, sans-serif">微任务队列</text>
<text x="530" y="168" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">Promise.then/MutationObs</text>
<line x1="210" y1="124" x2="248" y2="124" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<line x1="400" y1="92" x2="438" y2="92" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<line x1="400" y1="150" x2="438" y2="150" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<path d="M530 184 L530 210 L135 210 L135 184" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="340" y="226" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">Event Loop: 栈空时先清微任务，再取宏任务</text>
<rect x="80" y="248" width="520" height="60" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="268" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">执行顺序: 同步代码 -&gt; 微任务 -&gt; 宏任务 -&gt; 渲染</text>
<text x="340" y="290" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">Node.js: timers -&gt; poll -&gt; check (process.nextTick优先)</text>
</svg>