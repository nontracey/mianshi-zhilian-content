<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1280"><title id="title">本地消息表、RocketMQ 事务消息和消费幂等</title><desc id="desc">展示本地消息表在本地事务中写业务表和 outbox，relay 扫描投递、失败重试、consumer inbox 幂等，以及 RocketMQ 事务消息的 half message、本地事务、commit/rollback 和事务回查。</desc><defs><marker id="arrow-blue" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#b45309" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 30px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#172033}.subtitle{font:400 15px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.panel{fill:#fff;stroke:#d9e2ec;stroke-width:2;rx:16}.box-title{fill:#1f2933}.panel-title{font:700 20px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#1f2933}.box-title{font:700 16px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.small{font:400 13px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#334e68}.tiny{font:400 12px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.blue{fill:#e8f2ff;stroke:#60a5fa;stroke-width:2;rx:12}.green{fill:#e8f8ef;stroke:#4ade80}.gray,.green,.orange,.red,.yellow{stroke-width:2;rx:12}.yellow{fill:#fff7d6;stroke:#facc15}.orange{fill:#fff1e6;stroke:#fb923c}.red{fill:#feecec;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#94a3b8}.line,.line-red{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.line-red{stroke:#b45309;marker-end:url(#arrow-red)}</style></defs><rect width="1280" height="1280" class="bg"/><text x="48" y="56" class="title">最终一致消息方案：先保证“该发”，再保证“可重放”</text><text x="50" y="86" class="subtitle">生产关键是本地事务、投递补偿、消费幂等和可观测告警，不是把消息发送塞进业务事务。</text><rect width="1200" height="340" x="40" y="120" class="panel"/><text x="68" y="156" class="panel-title">1. 本地消息表 / Outbox：业务表和消息表同本地事务提交</text><rect width="185" height="66" x="82" y="225" class="blue"/><text x="122" y="251" class="box-title">Command</text><text x="110" y="273" class="tiny">create order / pay success</text><rect width="200" height="66" x="326" y="190" class="green"/><text x="372" y="216" class="box-title">business table</text><text x="354" y="238" class="tiny">订单、支付、库存流水</text><rect width="200" height="66" x="326" y="295" class="yellow"/><text x="374" y="321" class="box-title">outbox table</text><text x="350" y="343" class="tiny">event_id/status/retry/next_retry_at</text><rect width="180" height="66" x="604" y="242" class="orange"/><text x="648" y="268" class="box-title">Relay</text><text x="626" y="290" class="tiny">scan / CDC / binlog tailing</text><rect width="160" height="66" x="862" y="242" class="red"/><text x="912" y="268" class="box-title">MQ</text><text x="890" y="290" class="tiny">at-least-once delivery</text><rect width="130" height="66" x="1080" y="242" class="gray"/><text x="1114" y="268" class="box-title">Consumer</text><text x="1098" y="290" class="tiny">inbox/idempotent</text><line x1="267" x2="326" y1="258" y2="223" class="line"/><line x1="267" x2="326" y1="258" y2="328" class="line"/><line x1="526" x2="604" y1="328" y2="275" class="line"/><line x1="784" x2="862" y1="275" y2="275" class="line"/><line x1="1022" x2="1080" y1="275" y2="275" class="line"/><text x="82" y="412" class="small">发送成功但标记 SENT 前崩溃，会产生重复投递；这不是 bug，而是 at-least-once 设计下必须由 inbox/唯一键/状态机消化。</text><rect width="1200" height="315" x="40" y="500" class="panel"/><text x="68" y="536" class="panel-title">2. RocketMQ 事务消息：半消息 + 本地事务 + 二次确认 + 回查</text><rect width="180" height="62" x="78" y="622" class="blue"/><text x="118" y="647" class="box-title">send half</text><text x="104" y="668" class="tiny">Broker 持久化但暂不可见</text><rect width="190" height="62" x="316" y="622" class="yellow"/><text x="354" y="647" class="box-title">local transaction</text><text x="342" y="668" class="tiny">写订单 / 支付流水</text><rect width="155" height="62" x="580" y="585" class="green"/><text x="622" y="610" class="box-title">Commit</text><text x="606" y="631" class="tiny">消息对消费者可见</text><rect width="155" height="62" x="580" y="690" class="red"/><text x="622" y="715" class="box-title">Rollback</text><text x="608" y="736" class="tiny">半消息丢弃</text><rect width="210" height="62" x="920" y="622" class="orange"/><text x="956" y="647" class="box-title">transaction check</text><text x="955" y="668" class="tiny">二次确认缺失时回查</text><line x1="258" x2="316" y1="653" y2="653" class="line"/><path d="M506,653 C535,653 548,616 580,616" class="line"/><path d="M506,653 C535,653 548,721 580,721" class="line-red"/><path d="M920,653 C840,610 785,603 735,616" class="line"/><path d="M920,653 C840,720 785,730 735,721" class="line-red"/><text x="530" y="597" class="tiny">本地提交</text><text x="530" y="742" class="tiny">本地回滚</text><text x="78" y="770" class="small">RocketMQ 官方文档强调事务消息只保证生产端本地事务和下游分支的最终一致，不保证消费结果与上游执行结果一致。</text><text x="78" y="795" class="small">所以消费者仍要做重试和幂等；事务消息适合能接受异步执行的场景。</text><rect width="585" height="270" x="40" y="855" class="panel"/><text x="68" y="891" class="panel-title">3. 状态机和告警</text><rect width="120" height="58" x="82" y="950" class="yellow"/><text x="118" y="974" class="box-title">NEW</text><text x="104" y="994" class="tiny">刚写入</text><rect width="120" height="58" x="238" y="950" class="orange"/><text x="264" y="974" class="box-title">SENDING</text><text x="258" y="994" class="tiny">抢占中</text><rect width="120" height="58" x="394" y="950" class="green"/><text x="430" y="974" class="box-title">SENT</text><text x="412" y="994" class="tiny">已投递</text><rect width="120" height="58" x="238" y="1038" class="red"/><text x="266" y="1062" class="box-title">FAILED</text><text x="256" y="1082" class="tiny">超限告警</text><line x1="202" x2="238" y1="979" y2="979" class="line"/><line x1="358" x2="394" y1="979" y2="979" class="line"/><path d="M298,1008 C298,1022 298,1026 298,1038" class="line-red"/><rect width="585" height="270" x="655" y="855" class="panel"/><text x="683" y="891" class="panel-title">4. 选型边界</text><text x="692" y="944" class="small">本地消息表：通用、可审计、可重放，但要维护 relay、重试和清理。</text><text x="692" y="982" class="small">RocketMQ 事务消息：Broker 原生半消息和回查，依赖 RocketMQ 语义。</text><text x="692" y="1020" class="small">最大努力通知：支付回调、外部通知等场景，强调重试和人工补偿。</text><text x="692" y="1058" class="small">Seata：同步协调多分支；消息方案更偏异步最终一致和解耦。</text><text x="692" y="1096" class="small">核心指标：积压量、最老未发年龄、重试次数、死信、消费去重命中率。</text><rect width="1200" height="64" x="40" y="1170" class="panel"/><text x="68" y="1207" class="panel-title">回答抓手</text><text x="190" y="1207" class="small">业务事务 + outbox -&gt; relay/CDC -&gt; MQ -&gt; inbox 幂等 -&gt; 失败重试/告警；RocketMQ = half + local tx + commit/rollback + check；不要承诺消费 exactly-once。</text></svg>