<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Microsoft YaHei, sans-serif">
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2C3E50">RAG (检索增强生成) Pipeline</text>
  <!-- Step boxes -->
  <rect x="20" y="70" width="140" height="80" rx="8" fill="#3498DB" opacity="0.15" stroke="#3498DB"/>
  <text x="90" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#3498DB">文档加载</text>
  <text x="90" y="120" text-anchor="middle" font-size="10" fill="#7F8C8D">PDF/网页/DB</text>
  <text x="90" y="135" text-anchor="middle" font-size="10" fill="#7F8C8D">文本提取</text>
  <!-- Arrow -->
  <line x1="165" y1="110" x2="195" y2="110" stroke="#BDC3C7" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Chunking -->
  <rect x="200" y="70" width="140" height="80" rx="8" fill="#2ECC71" opacity="0.15" stroke="#2ECC71"/>
  <text x="270" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#2ECC71">文本分块</text>
  <text x="270" y="120" text-anchor="middle" font-size="10" fill="#7F8C8D">Chunk Size</text>
  <text x="270" y="135" text-anchor="middle" font-size="10" fill="#7F8C8D">Overlap 策略</text>
  <line x1="345" y1="110" x2="375" y2="110" stroke="#BDC3C7" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Embedding -->
  <rect x="380" y="70" width="140" height="80" rx="8" fill="#9B59B6" opacity="0.15" stroke="#9B59B6"/>
  <text x="450" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#9B59B6">向量嵌入</text>
  <text x="450" y="120" text-anchor="middle" font-size="10" fill="#7F8C8D">Embedding API</text>
  <text x="450" y="135" text-anchor="middle" font-size="10" fill="#7F8C8d">1536 维向量</text>
  <line x1="525" y1="110" x2="555" y2="110" stroke="#BDC3C7" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Vector Store -->
  <rect x="560" y="70" width="140" height="80" rx="8" fill="#E67E22" opacity="0.15" stroke="#E67E22"/>
  <text x="630" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#E67E22">向量存储</text>
  <text x="630" y="120" text-anchor="middle" font-size="10" fill="#7F8C8D">Milvus/Pinecone</text>
  <text x="630" y="135" text-anchor="middle" font-size="10" fill="#7F8C8D">索引 + 持久化</text>
  <!-- Query flow -->
  <rect x="20" y="200" width="140" height="60" rx="8" fill="#E74C3C" opacity="0.15" stroke="#E74C3C"/>
  <text x="90" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#E74C3C">用户提问</text>
  <text x="90" y="245" text-anchor="middle" font-size="10" fill="#7F8C8D">Query</text>
  <line x1="165" y1="230" x2="195" y2="230" stroke="#BDC3C7" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Retrieval -->
  <rect x="200" y="200" width="140" height="60" rx="8" fill="#9B59B6" opacity="0.15" stroke="#9B59B6"/>
  <text x="270" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#9B59B6">检索</text>
  <text x="270" y="245" text-anchor="middle" font-size="10" fill="#7F8C8D">Top-K 相似文档</text>
  <line x1="345" y1="230" x2="375" y2="230" stroke="#BDC3C7" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Rerank -->
  <rect x="380" y="200" width="140" height="60" rx="8" fill="#1ABC9C" opacity="0.15" stroke="#1ABC9C"/>
  <text x="450" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#1ABC9C">重排序</text>
  <text x="450" y="245" text-anchor="middle" font-size="10" fill="#7F8C8D">Cross-Encoder</text>
  <line x1="525" y1="230" x2="555" y2="230" stroke="#BDC3C7" stroke-width="2" marker-end="url(#arr)"/>
  <!-- LLM Generate -->
  <rect x="560" y="190" width="140" height="80" rx="8" fill="#E74C3C" opacity="0.15" stroke="#E74C3C"/>
  <text x="630" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#E74C3C">LLM 生成</text>
  <text x="630" y="240" text-anchor="middle" font-size="10" fill="#7F8C8D">Prompt = Query</text>
  <text x="630" y="255" text-anchor="middle" font-size="10" fill="#7F8C8D">+ Retrieved Docs</text>
  <!-- Answer -->
  <rect x="560" y="300" width="140" height="50" rx="8" fill="#27AE60" opacity="0.15" stroke="#27AE60"/>
  <text x="630" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#27AE60">✅ 生成回答</text>
  <line x1="630" y1="275" x2="630" y2="295" stroke="#BDC3C7" stroke-width="2" marker-end="url(#arr)"/>
  <text x="400" y="380" text-anchor="middle" font-size="11" fill="#7F8C8D">核心价值：让 LLM 基于最新/私有数据生成准确回答，减少幻觉</text>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#BDC3C7"/></marker>
  </defs>
</svg>
