<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">Apache Seata 事务角色、AT 模式和四种事务模型</title>
  <desc id="desc">展示 Seata v2.6 中 TC、TM、RM、XID 传播、AT 模式 before image/after image/undo_log/全局锁，以及 AT、TCC、Saga、XA 四种模型的选型边界。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .box-title { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 13px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .blue { fill: #e8f2ff; stroke: #60a5fa; stroke-width: 2; rx: 12; }
      .green { fill: #e8f8ef; stroke: #4ade80; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff7d6; stroke: #facc15; stroke-width: 2; rx: 12; }
      .orange { fill: #fff1e6; stroke: #fb923c; stroke-width: 2; rx: 12; }
      .red { fill: #feecec; stroke: #f87171; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #b45309; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">Seata：用 XID 把全局事务、分支事务和资源管理串起来</text>
  <text x="50" y="86" class="subtitle">回答重点不是背四个模式，而是说明 TC/TM/RM、undo_log、全局锁、补偿和资源阻塞的取舍。</text>

  <rect x="40" y="120" width="1200" height="255" class="panel"/>
  <text x="68" y="156" class="panel-title">1. 三个角色和 XID 传播</text>
  <rect x="78" y="218" width="180" height="66" class="blue"/>
  <text x="118" y="244" class="box-title">TM</text>
  <text x="98" y="266" class="tiny">@GlobalTransactional 边界</text>
  <rect x="334" y="218" width="190" height="66" class="red"/>
  <text x="382" y="244" class="box-title">TC</text>
  <text x="360" y="266" class="tiny">全局/分支状态与决议</text>
  <rect x="600" y="180" width="190" height="66" class="green"/>
  <text x="648" y="206" class="box-title">RM: order</text>
  <text x="626" y="228" class="tiny">注册分支、报状态</text>
  <rect x="600" y="280" width="190" height="66" class="green"/>
  <text x="646" y="306" class="box-title">RM: stock</text>
  <text x="626" y="328" class="tiny">本地事务 + undo</text>
  <rect x="866" y="228" width="220" height="66" class="yellow"/>
  <text x="912" y="254" class="box-title">XID</text>
  <text x="892" y="276" class="tiny">Header / RootContext 传递</text>
  <line x1="258" y1="251" x2="334" y2="251" class="line"/>
  <line x1="524" y1="251" x2="600" y2="213" class="line"/>
  <line x1="524" y1="251" x2="600" y2="313" class="line"/>
  <line x1="790" y1="213" x2="866" y2="251" class="line"/>
  <line x1="790" y1="313" x2="866" y2="261" class="line"/>
  <text x="78" y="362" class="small">TM 向 TC 开启全局事务，XID 沿微服务调用链传递；RM 按 XID 注册本地分支，由 TC 驱动全局提交或回滚。</text>

  <rect x="40" y="415" width="1200" height="385" class="panel"/>
  <text x="68" y="451" class="panel-title">2. AT 模式：一阶段提交业务和回滚日志，二阶段轻提交或反向补偿</text>
  <rect x="78" y="525" width="145" height="62" class="blue"/>
  <text x="112" y="550" class="box-title">SQL parse</text>
  <text x="98" y="571" class="tiny">识别表、where、PK</text>
  <rect x="278" y="525" width="160" height="62" class="yellow"/>
  <text x="318" y="550" class="box-title">before image</text>
  <text x="304" y="571" class="tiny">修改前快照</text>
  <rect x="493" y="525" width="145" height="62" class="orange"/>
  <text x="530" y="550" class="box-title">business SQL</text>
  <text x="520" y="571" class="tiny">执行业务更新</text>
  <rect x="693" y="525" width="160" height="62" class="yellow"/>
  <text x="734" y="550" class="box-title">after image</text>
  <text x="720" y="571" class="tiny">修改后快照</text>
  <rect x="908" y="525" width="145" height="62" class="green"/>
  <text x="950" y="550" class="box-title">undo_log</text>
  <text x="928" y="571" class="tiny">与业务同本地事务</text>
  <line x1="223" y1="556" x2="278" y2="556" class="line"/>
  <line x1="438" y1="556" x2="493" y2="556" class="line"/>
  <line x1="638" y1="556" x2="693" y2="556" class="line"/>
  <line x1="853" y1="556" x2="908" y2="556" class="line"/>
  <rect x="166" y="665" width="210" height="62" class="red"/>
  <text x="208" y="690" class="box-title">global lock</text>
  <text x="190" y="711" class="tiny">本地提交前向 TC 申请</text>
  <rect x="520" y="665" width="210" height="62" class="green"/>
  <text x="562" y="690" class="box-title">global commit</text>
  <text x="548" y="711" class="tiny">异步批量清理 undo</text>
  <rect x="874" y="665" width="230" height="62" class="orange"/>
  <text x="920" y="690" class="box-title">global rollback</text>
  <text x="900" y="711" class="tiny">校验 after image 后回放 before</text>
  <path d="M980,587 C980,620 271,625 271,665" class="line-red"/>
  <line x1="376" y1="696" x2="520" y2="696" class="line"/>
  <line x1="730" y1="696" x2="874" y2="696" class="line"/>
  <text x="78" y="760" class="small">AT 要求关系型数据库支持本地 ACID，并通过 JDBC 访问；普通 SELECT 不加全局读锁，SELECT FOR UPDATE 可参与全局锁判断。</text>

  <rect x="40" y="840" width="585" height="285" class="panel"/>
  <text x="68" y="876" class="panel-title">3. 四种模型怎么选</text>
  <rect x="82" y="930" width="220" height="58" class="green"/>
  <text x="120" y="954" class="box-title">AT</text>
  <text x="104" y="974" class="tiny">低侵入 CRUD，依赖 undo_log</text>
  <rect x="360" y="930" width="220" height="58" class="yellow"/>
  <text x="398" y="954" class="box-title">TCC</text>
  <text x="386" y="974" class="tiny">Try/Confirm/Cancel，强业务控制</text>
  <rect x="82" y="1030" width="220" height="58" class="orange"/>
  <text x="120" y="1054" class="box-title">Saga</text>
  <text x="104" y="1074" class="tiny">长流程编排，靠补偿，隔离弱</text>
  <rect x="360" y="1030" width="220" height="58" class="red"/>
  <text x="398" y="1054" class="box-title">XA</text>
  <text x="386" y="1074" class="tiny">资源支持 XA，prepare 后阻塞</text>

  <rect x="655" y="840" width="585" height="285" class="panel"/>
  <text x="683" y="876" class="panel-title">4. 排查和边界</text>
  <text x="692" y="936" class="small">先查 XID 是否传到下游：Header、RootContext、线程池上下文。</text>
  <text x="692" y="974" class="small">再查分支状态、全局锁冲突、undo_log 是否完整、after image 是否被旁路更新破坏。</text>
  <text x="692" y="1012" class="small">AT 不适合复杂 SQL、非 JDBC 资源和高冲突热点写；TCC 要处理幂等、空回滚、悬挂。</text>
  <text x="692" y="1050" class="small">Saga 要接受隔离不足；XA 要接受 prepare 后资源阻塞和性能下降。</text>
  <text x="692" y="1088" class="small">很多最终一致场景用本地消息表或事务消息更轻。</text>

  <rect x="40" y="1170" width="1200" height="64" class="panel"/>
  <text x="68" y="1207" class="panel-title">回答抓手</text>
  <text x="190" y="1207" class="small">v2.6 -> TC/TM/RM -> XID -> AT 一阶段 before/after/undo/global lock -> 二阶段 commit/rollback -> TCC/Saga/XA 取舍 -> XID/锁/undo 排查。</text>
</svg>
