<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, sans-serif" viewBox="0 0 800 520"><text x="400" y="30" fill="#2C3E50" font-size="18" font-weight="bold" text-anchor="middle">TCP 三次握手与四次挥手</text><rect width="100" height="30" x="80" y="55" fill="#3498DB" stroke="#3498DB" opacity=".2" rx="4"/><text x="130" y="75" fill="#3498DB" font-size="13" font-weight="bold" text-anchor="middle">客户端</text><rect width="100" height="30" x="620" y="55" fill="#E74C3C" stroke="#E74C3C" opacity=".2" rx="4"/><text x="670" y="75" fill="#E74C3C" font-size="13" font-weight="bold" text-anchor="middle">服务端</text><line x1="130" x2="130" y1="90" y2="280" stroke="#3498DB" stroke-dasharray="4" stroke-width="2"/><line x1="670" x2="670" y1="90" y2="280" stroke="#E74C3C" stroke-dasharray="4" stroke-width="2"/><text x="400" y="108" fill="#27AE60" font-size="14" font-weight="bold" text-anchor="middle">三次握手</text><line x1="135" x2="665" y1="130" y2="155" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="138" fill="#2C3E50" font-size="12" text-anchor="middle">① SYN, seq=x</text><line x1="665" x2="135" y1="170" y2="195" stroke="#E67E22" stroke-width="2" marker-end="url(#arrow2)"/><text x="400" y="178" fill="#2C3E50" font-size="12" text-anchor="middle">② SYN+ACK, seq=y, ack=x+1</text><line x1="135" x2="665" y1="210" y2="235" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="218" fill="#2C3E50" font-size="12" text-anchor="middle">③ ACK, seq=x+1, ack=y+1</text><rect width="200" height="25" x="300" y="250" fill="#27AE60" stroke="#27AE60" opacity=".15" rx="4"/><text x="400" y="268" fill="#27AE60" font-size="12" font-weight="bold" text-anchor="middle">连接建立 ESTABLISHED</text><line x1="50" x2="750" y1="295" y2="295" stroke="#BDC3C7" stroke-dasharray="6" stroke-width="1"/><text x="400" y="318" fill="#E74C3C" font-size="14" font-weight="bold" text-anchor="middle">四次挥手</text><line x1="135" x2="665" y1="335" y2="355" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrow2)"/><text x="400" y="342" fill="#2C3E50" font-size="12" text-anchor="middle">① FIN, seq=u</text><line x1="665" x2="135" y1="365" y2="385" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="372" fill="#2C3E50" font-size="12" text-anchor="middle">② ACK, ack=u+1</text><line x1="665" x2="135" y1="395" y2="415" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrow2)"/><text x="400" y="402" fill="#2C3E50" font-size="12" text-anchor="middle">③ FIN, seq=w</text><line x1="135" x2="665" y1="425" y2="445" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="432" fill="#2C3E50" font-size="12" text-anchor="middle">④ ACK, ack=w+1</text><rect width="180" height="40" x="50" y="460" fill="#F39C12" stroke="#F39C12" opacity=".15" rx="4"/><text x="140" y="485" fill="#F39C12" font-size="11" text-anchor="middle">TIME_WAIT (2MSL)</text><text x="400" y="510" fill="#7F8C8D" font-size="11" text-anchor="middle">为什么握手三次而挥手四次？因为服务端的 ACK 和 FIN 可能分开发送</text><defs><marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="8" refY="3"><path fill="#27AE60" d="M0,0 L8,3 L0,6"/></marker><marker id="arrow2" markerHeight="6" markerWidth="8" orient="auto" refX="8" refY="3"><path fill="#E74C3C" d="M0,0 L8,3 L0,6"/></marker></defs></svg>