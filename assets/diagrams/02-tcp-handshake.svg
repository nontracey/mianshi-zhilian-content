<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Microsoft YaHei, sans-serif">
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2C3E50">TCP 三次握手与四次挥手</text>
  <!-- Client / Server labels -->
  <rect x="80" y="55" width="100" height="30" rx="4" fill="#3498DB" opacity="0.2" stroke="#3498DB"/>
  <text x="130" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#3498DB">客户端</text>
  <rect x="620" y="55" width="100" height="30" rx="4" fill="#E74C3C" opacity="0.2" stroke="#E74C3C"/>
  <text x="670" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#E74C3C">服务端</text>
  <!-- Vertical lines -->
  <line x1="130" y1="90" x2="130" y2="280" stroke="#3498DB" stroke-width="2" stroke-dasharray="4"/>
  <line x1="670" y1="90" x2="670" y2="280" stroke="#E74C3C" stroke-width="2" stroke-dasharray="4"/>
  <!-- Three-way handshake -->
  <text x="400" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#27AE60">三次握手</text>
  <!-- SYN -->
  <line x1="135" y1="130" x2="665" y2="155" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="138" text-anchor="middle" font-size="12" fill="#2C3E50">① SYN, seq=x</text>
  <!-- SYN-ACK -->
  <line x1="665" y1="170" x2="135" y2="195" stroke="#E67E22" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="400" y="178" text-anchor="middle" font-size="12" fill="#2C3E50">② SYN+ACK, seq=y, ack=x+1</text>
  <!-- ACK -->
  <line x1="135" y1="210" x2="665" y2="235" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="218" text-anchor="middle" font-size="12" fill="#2C3E50">③ ACK, seq=x+1, ack=y+1</text>
  <!-- Connection established -->
  <rect x="300" y="250" width="200" height="25" rx="4" fill="#27AE60" opacity="0.15" stroke="#27AE60"/>
  <text x="400" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#27AE60">连接建立 ESTABLISHED</text>
  <!-- Separator -->
  <line x1="50" y1="295" x2="750" y2="295" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="6"/>
  <!-- Four-way handshake -->
  <text x="400" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#E74C3C">四次挥手</text>
  <!-- FIN -->
  <line x1="135" y1="335" x2="665" y2="355" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="400" y="342" text-anchor="middle" font-size="12" fill="#2C3E50">① FIN, seq=u</text>
  <!-- ACK -->
  <line x1="665" y1="365" x2="135" y2="385" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="372" text-anchor="middle" font-size="12" fill="#2C3E50">② ACK, ack=u+1</text>
  <!-- FIN -->
  <line x1="665" y1="395" x2="135" y2="415" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="400" y="402" text-anchor="middle" font-size="12" fill="#2C3E50">③ FIN, seq=w</text>
  <!-- ACK -->
  <line x1="135" y1="425" x2="665" y2="445" stroke="#27AE60" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="432" text-anchor="middle" font-size="12" fill="#2C3E50">④ ACK, ack=w+1</text>
  <!-- TIME_WAIT -->
  <rect x="50" y="460" width="180" height="40" rx="4" fill="#F39C12" opacity="0.15" stroke="#F39C12"/>
  <text x="140" y="485" text-anchor="middle" font-size="11" fill="#F39C12">TIME_WAIT (2MSL)</text>
  <text x="400" y="510" text-anchor="middle" font-size="11" fill="#7F8C8D">为什么握手三次而挥手四次？因为服务端的 ACK 和 FIN 可能分开发送</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#27AE60"/></marker>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#E74C3C"/></marker>
  </defs>
</svg>
