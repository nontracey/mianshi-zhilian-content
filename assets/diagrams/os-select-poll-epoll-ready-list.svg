<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">select/poll 线性扫描与 epoll ready list</title>
  <desc id="desc">展示 select、poll 每轮复制和线性扫描全部 fd，与 epoll 注册兴趣集合、等待队列回调和 ready list 的差异，并说明 LT/ET、ONESHOT、EXCLUSIVE 等边界。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .h2 { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 700 14px "SFMono-Regular", Consolas, monospace; fill: #0f172a; }
      .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .green { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; }
      .red { fill: #fef2f2; stroke: #f87171; stroke-width: 2; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
      .violet { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .warnArrow { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#warnArrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="warnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="660" y="55" text-anchor="middle">select/poll 慢在每轮扫全集，epoll 快在只取 ready list</text>
  <text class="subtitle" x="660" y="88" text-anchor="middle">多路复用都是 readiness；epoll 优势来自兴趣集合常驻内核和状态变化回调</text>

  <rect class="panel" x="58" y="120" width="1204" height="310" rx="10"/>
  <text class="h2" x="90" y="160">1. select / poll：每次调用都把“全部关注集合”交给内核扫描</text>
  <rect class="blue" x="95" y="215" width="210" height="82" rx="8"/>
  <text class="label" x="200" y="245" text-anchor="middle">select fd_set</text>
  <text class="tiny" x="200" y="272" text-anchor="middle">位图，受 FD_SETSIZE 限制</text>
  <path class="arrow" d="M308 256 H370"/>
  <rect class="amber" x="375" y="215" width="210" height="82" rx="8"/>
  <text class="label" x="480" y="245" text-anchor="middle">每轮复制</text>
  <text class="tiny" x="480" y="272" text-anchor="middle">用户态 → 内核态</text>
  <path class="arrow" d="M588 256 H650"/>
  <rect class="red" x="655" y="215" width="210" height="82" rx="8"/>
  <text class="label" x="760" y="245" text-anchor="middle">内核 O(n) 扫描</text>
  <text class="tiny" x="760" y="272" text-anchor="middle">检查所有 fd 是否 ready</text>
  <path class="arrow" d="M868 256 H930"/>
  <rect class="gray" x="935" y="215" width="220" height="82" rx="8"/>
  <text class="label" x="1045" y="245" text-anchor="middle">用户态再扫</text>
  <text class="tiny" x="1045" y="272" text-anchor="middle">找哪些 fd 真的就绪</text>
  <rect class="green" x="95" y="335" width="1060" height="46" rx="8"/>
  <text class="text" x="625" y="364" text-anchor="middle">poll 把位图换成 pollfd 数组，去掉固定 1024 限制，但仍是复制数组 + 内核线性扫描 + 用户态扫描 revents</text>

  <rect class="panel" x="58" y="470" width="1204" height="385" rx="10"/>
  <text class="h2" x="90" y="510">2. epoll：兴趣集合常驻内核，fd 状态变化时进入 ready list</text>
  <rect class="blue" x="95" y="565" width="210" height="82" rx="8"/>
  <text class="label" x="200" y="595" text-anchor="middle">epoll_create</text>
  <text class="tiny" x="200" y="622" text-anchor="middle">创建 eventpoll 实例</text>
  <path class="arrow" d="M308 606 H370"/>
  <rect class="green" x="375" y="565" width="210" height="82" rx="8"/>
  <text class="label" x="480" y="595" text-anchor="middle">epoll_ctl ADD/MOD</text>
  <text class="tiny" x="480" y="622" text-anchor="middle">维护兴趣集合，O(log n)</text>
  <path class="arrow" d="M588 606 H650"/>
  <rect class="violet" x="655" y="565" width="210" height="82" rx="8"/>
  <text class="label" x="760" y="595" text-anchor="middle">等待队列回调</text>
  <text class="tiny" x="760" y="622" text-anchor="middle">fd 状态变化触发</text>
  <path class="arrow" d="M868 606 H930"/>
  <rect class="amber" x="935" y="565" width="220" height="82" rx="8"/>
  <text class="label" x="1045" y="595" text-anchor="middle">ready list</text>
  <text class="tiny" x="1045" y="622" text-anchor="middle">epoll_wait 返回就绪事件</text>

  <rect class="gray" x="95" y="700" width="315" height="82" rx="8"/>
  <text class="label" x="252" y="730" text-anchor="middle">不是所有操作 O(1)</text>
  <text class="tiny" x="252" y="758" text-anchor="middle">ctl 维护集合；wait 复制 ready events</text>
  <rect class="gray" x="502" y="700" width="315" height="82" rx="8"/>
  <text class="label" x="659" y="730" text-anchor="middle">大量连接少量活跃最有利</text>
  <text class="tiny" x="659" y="758" text-anchor="middle">全活跃时优势会缩小</text>
  <rect class="gray" x="910" y="700" width="285" height="82" rx="8"/>
  <text class="label" x="1052" y="730" text-anchor="middle">普通文件不适合</text>
  <text class="tiny" x="1052" y="758" text-anchor="middle">通常总是 ready 或返回 EPERM</text>

  <rect class="panel" x="58" y="895" width="1204" height="330" rx="10"/>
  <text class="h2" x="90" y="935">3. LT / ET / ONESHOT / EXCLUSIVE：性能和正确性的边界</text>
  <rect class="green" x="95" y="990" width="250" height="82" rx="8"/>
  <text class="label" x="220" y="1020" text-anchor="middle">LT 默认</text>
  <text class="tiny" x="220" y="1048" text-anchor="middle">条件仍满足就重复通知，安全但可能多唤醒</text>
  <rect class="amber" x="380" y="990" width="250" height="82" rx="8"/>
  <text class="label" x="505" y="1020" text-anchor="middle">ET 边缘触发</text>
  <text class="tiny" x="505" y="1048" text-anchor="middle">必须非阻塞循环读到 EAGAIN</text>
  <rect class="violet" x="665" y="990" width="250" height="82" rx="8"/>
  <text class="label" x="790" y="1020" text-anchor="middle">ONESHOT</text>
  <text class="tiny" x="790" y="1048" text-anchor="middle">避免多线程同时处理同一 fd，处理完重激活</text>
  <rect class="red" x="950" y="990" width="245" height="82" rx="8"/>
  <text class="label" x="1072" y="1020" text-anchor="middle">EXCLUSIVE</text>
  <text class="tiny" x="1072" y="1048" text-anchor="middle">缓解共享 listen fd 的 accept 惊群</text>

  <rect class="gray" x="95" y="1145" width="1100" height="44" rx="8"/>
  <text class="text" x="645" y="1173" text-anchor="middle">排查要看：空轮询、频繁 epoll_ctl、ET 漏读、ONESHOT 未重激活、accept EAGAIN、ready backlog 与 P99</text>
</svg>
