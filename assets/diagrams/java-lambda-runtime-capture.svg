<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">Java Lambda target typing, invokedynamic, capture, and method references</title>
  <desc id="desc">A topic-specific diagram explaining how Java lambda expressions depend on a target functional interface, compile to invokedynamic call sites linked by LambdaMetafactory, capture effectively-final variables, differ from anonymous inner classes in this semantics, and map to method reference forms.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 33px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="70" y="64">Lambda：目标类型驱动，不是匿名内部类换皮</text>
  <text class="subtitle" x="70" y="96">核心链路是函数式接口 SAM、目标类型推断、invokedynamic、LambdaMetafactory、变量捕获和 this 语义。</text>

  <rect class="section" x="70" y="130" width="1180" height="315" rx="16"/>
  <text class="section-title" x="96" y="166">1. 从源码到运行时链接</text>

  <rect class="blue" x="105" y="215" width="210" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="247">Lambda 源码</text>
  <text class="mono" x="132" y="272">(a, b) -&gt; a + b</text>
  <text class="text" x="132" y="292">本身没有独立类型</text>

  <rect class="green" x="375" y="215" width="220" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="402" y="247">目标类型</text>
  <text class="mono" x="402" y="272">@FunctionalInterface</text>
  <text class="text" x="402" y="292">单一抽象方法 SAM</text>

  <rect class="yellow" x="655" y="215" width="220" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="682" y="247">字节码调用点</text>
  <text class="mono" x="682" y="272">invokedynamic</text>
  <text class="text" x="682" y="292">延迟到链接期绑定</text>

  <rect class="violet" x="935" y="215" width="245" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="962" y="247">LambdaMetafactory</text>
  <text class="text" x="962" y="272">链接 MethodHandle</text>
  <text class="mono" x="962" y="292">生成/复用函数对象</text>

  <path class="arrow-blue" d="M315 259 H366"/>
  <path class="arrow-blue" d="M595 259 H646"/>
  <path class="arrow-green" d="M875 259 H926"/>

  <rect class="red" x="145" y="340" width="995" height="62" rx="14" stroke-width="2"/>
  <text class="box-title" x="172" y="369">不要说成“匿名内部类语法糖”</text>
  <text class="text" x="172" y="392">匿名内部类通常生成独立类，`this` 指向匿名类；Lambda 的 `this` 指向外部对象，字节码模型也不同。</text>

  <rect class="section" x="70" y="485" width="580" height="335" rx="16"/>
  <text class="section-title" x="96" y="521">2. 变量捕获与 this</text>

  <rect class="green" x="105" y="570" width="230" height="96" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="602">effectively final</text>
  <text class="text" x="132" y="627">局部变量值被捕获</text>
  <text class="text" x="132" y="647">后续不能再修改</text>

  <rect class="yellow" x="380" y="570" width="230" height="96" rx="12" stroke-width="2"/>
  <text class="box-title" x="407" y="602">有捕获 Lambda</text>
  <text class="text" x="407" y="627">函数对象携带捕获值</text>
  <text class="text" x="407" y="647">每组捕获值可能有实例</text>

  <rect class="blue" x="105" y="710" width="230" height="76" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="740">无捕获 Lambda</text>
  <text class="text" x="132" y="764">JVM 可复用无状态实例</text>

  <rect class="red" x="380" y="710" width="230" height="76" rx="12" stroke-width="2"/>
  <text class="box-title" x="407" y="740">副作用风险</text>
  <text class="text" x="407" y="764">Stream/异步中别改共享状态</text>

  <rect class="section" x="690" y="485" width="560" height="335" rx="16"/>
  <text class="section-title" x="716" y="521">3. 方法引用：只是在签名匹配时更清晰</text>

  <rect class="blue" x="725" y="570" width="225" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="752" y="602">静态方法</text>
  <text class="mono" x="752" y="627">Integer::parseInt</text>

  <rect class="green" x="990" y="570" width="225" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1017" y="602">特定对象实例方法</text>
  <text class="mono" x="1017" y="627">System.out::println</text>

  <rect class="yellow" x="725" y="700" width="225" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="752" y="732">类的实例方法</text>
  <text class="mono" x="752" y="757">String::length</text>

  <rect class="violet" x="990" y="700" width="225" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1017" y="732">构造器</text>
  <text class="mono" x="1017" y="757">ArrayList::new</text>

  <rect class="section" x="70" y="860" width="1180" height="245" rx="16"/>
  <text class="section-title" x="96" y="896">4. 工程边界</text>

  <rect class="yellow" x="105" y="945" width="260" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="977">可读性</text>
  <text class="text" x="132" y="1002">简单行为用 Lambda</text>
  <text class="text" x="132" y="1022">复杂分支抽方法命名</text>

  <rect class="red" x="405" y="945" width="260" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="432" y="977">checked exception</text>
  <text class="text" x="432" y="1002">目标接口没 throws 时</text>
  <text class="text" x="432" y="1022">不能直接抛受检异常</text>

  <rect class="green" x="705" y="945" width="260" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="732" y="977">分配与性能</text>
  <text class="text" x="732" y="1002">无捕获可复用</text>
  <text class="text" x="732" y="1022">有捕获关注热路径分配</text>

  <rect class="blue" x="1005" y="945" width="205" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="1032" y="977">排查</text>
  <text class="text" x="1032" y="1002">JFR/async-profiler</text>
  <text class="text" x="1032" y="1022">看闭包分配和调用热点</text>

  <text class="small" x="105" y="1070">方法引用是否可用，只看它能否适配目标函数式接口的参数和返回值；不要为了“高级”牺牲可读性。</text>

  <text class="small" x="96" y="1238">面试抓手：先说目标类型和 SAM，再说 invokedynamic 与 this 差异；最后补捕获变量、方法引用、Stream 副作用和性能排查。</text>
</svg>
