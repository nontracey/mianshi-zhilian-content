<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">Java Lambda target typing, invokedynamic, capture, and method references</title><desc id="desc">A topic-specific diagram explaining how Java lambda expressions depend on a target functional interface, compile to invokedynamic call sites linked by LambdaMetafactory, capture effectively-final variables, differ from anonymous inner classes in this semantics, and map to method reference forms.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 33px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.section{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.arrow-blue,.arrow-green{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.arrow-green{stroke:#16a34a;marker-end:url(#arrow-green)}</style></defs><rect width="1320" height="1320" class="bg"/><text x="70" y="64" class="title">Lambda：目标类型驱动，不是匿名内部类换皮</text><text x="70" y="96" class="subtitle">核心链路是函数式接口 SAM、目标类型推断、invokedynamic、LambdaMetafactory、变量捕获和 this 语义。</text><rect width="1180" height="315" x="70" y="130" class="section" rx="16"/><text x="96" y="166" class="section-title">1. 从源码到运行时链接</text><rect width="210" height="88" x="105" y="215" stroke-width="2" class="blue" rx="12"/><text x="132" y="247" class="box-title">Lambda 源码</text><text x="132" y="272" class="mono">(a, b) -&gt; a + b</text><text x="132" y="292" class="text">本身没有独立类型</text><rect width="220" height="88" x="375" y="215" stroke-width="2" class="green" rx="12"/><text x="402" y="247" class="box-title">目标类型</text><text x="402" y="272" class="mono">@FunctionalInterface</text><text x="402" y="292" class="text">单一抽象方法 SAM</text><rect width="220" height="88" x="655" y="215" stroke-width="2" class="yellow" rx="12"/><text x="682" y="247" class="box-title">字节码调用点</text><text x="682" y="272" class="mono">invokedynamic</text><text x="682" y="292" class="text">延迟到链接期绑定</text><rect width="245" height="88" x="935" y="215" stroke-width="2" class="violet" rx="12"/><text x="962" y="247" class="box-title">LambdaMetafactory</text><text x="962" y="272" class="text">链接 MethodHandle</text><text x="962" y="292" class="mono">生成/复用函数对象</text><path d="M315 259 H366" class="arrow-blue"/><path d="M595 259 H646" class="arrow-blue"/><path d="M875 259 H926" class="arrow-green"/><rect width="995" height="62" x="145" y="340" stroke-width="2" class="red" rx="14"/><text x="172" y="369" class="box-title">不要说成“匿名内部类语法糖”</text><text x="172" y="392" class="text">匿名内部类通常生成独立类，`this` 指向匿名类；Lambda 的 `this` 指向外部对象，字节码模型也不同。</text><rect width="580" height="335" x="70" y="485" class="section" rx="16"/><text x="96" y="521" class="section-title">2. 变量捕获与 this</text><rect width="230" height="96" x="105" y="570" stroke-width="2" class="green" rx="12"/><text x="132" y="602" class="box-title">effectively final</text><text x="132" y="627" class="text">局部变量值被捕获</text><text x="132" y="647" class="text">后续不能再修改</text><rect width="230" height="96" x="380" y="570" stroke-width="2" class="yellow" rx="12"/><text x="407" y="602" class="box-title">有捕获 Lambda</text><text x="407" y="627" class="text">函数对象携带捕获值</text><text x="407" y="647" class="text">每组捕获值可能有实例</text><rect width="230" height="76" x="105" y="710" stroke-width="2" class="blue" rx="12"/><text x="132" y="740" class="box-title">无捕获 Lambda</text><text x="132" y="764" class="text">JVM 可复用无状态实例</text><rect width="230" height="76" x="380" y="710" stroke-width="2" class="red" rx="12"/><text x="407" y="740" class="box-title">副作用风险</text><text x="407" y="764" class="text">Stream/异步中别改共享状态</text><rect width="560" height="335" x="690" y="485" class="section" rx="16"/><text x="716" y="521" class="section-title">3. 方法引用：只是在签名匹配时更清晰</text><rect width="225" height="82" x="725" y="570" stroke-width="2" class="blue" rx="12"/><text x="752" y="602" class="box-title">静态方法</text><text x="752" y="627" class="mono">Integer::parseInt</text><rect width="225" height="82" x="990" y="570" stroke-width="2" class="green" rx="12"/><text x="1017" y="602" class="box-title">特定对象实例方法</text><text x="1017" y="627" class="mono">System.out::println</text><rect width="225" height="82" x="725" y="700" stroke-width="2" class="yellow" rx="12"/><text x="752" y="732" class="box-title">类的实例方法</text><text x="752" y="757" class="mono">String::length</text><rect width="225" height="82" x="990" y="700" stroke-width="2" class="violet" rx="12"/><text x="1017" y="732" class="box-title">构造器</text><text x="1017" y="757" class="mono">ArrayList::new</text><rect width="1180" height="245" x="70" y="860" class="section" rx="16"/><text x="96" y="896" class="section-title">4. 工程边界</text><rect width="260" height="88" x="105" y="945" stroke-width="2" class="yellow" rx="12"/><text x="132" y="977" class="box-title">可读性</text><text x="132" y="1002" class="text">简单行为用 Lambda</text><text x="132" y="1022" class="text">复杂分支抽方法命名</text><rect width="260" height="88" x="405" y="945" stroke-width="2" class="red" rx="12"/><text x="432" y="977" class="box-title">checked exception</text><text x="432" y="1002" class="text">目标接口没 throws 时</text><text x="432" y="1022" class="text">不能直接抛受检异常</text><rect width="260" height="88" x="705" y="945" stroke-width="2" class="green" rx="12"/><text x="732" y="977" class="box-title">分配与性能</text><text x="732" y="1002" class="text">无捕获可复用</text><text x="732" y="1022" class="text">有捕获关注热路径分配</text><rect width="205" height="88" x="1005" y="945" stroke-width="2" class="blue" rx="12"/><text x="1032" y="977" class="box-title">排查</text><text x="1032" y="1002" class="text">JFR/async-profiler</text><text x="1032" y="1022" class="text">看闭包分配和调用热点</text><text x="105" y="1070" class="small">方法引用是否可用，只看它能否适配目标函数式接口的参数和返回值；不要为了“高级”牺牲可读性。</text><text x="96" y="1238" class="small">面试抓手：先说目标类型和 SAM，再说 invokedynamic 与 this 差异；最后补捕获变量、方法引用、Stream 副作用和性能排查。</text></svg>