<svg viewBox="0 0 780 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一致性哈希环与虚拟节点">
<title>一致性哈希：哈希环、虚拟节点与顺时针归属</title><desc>节点和 key 哈希到同一个环上，key 顺时针找到第一个节点；虚拟节点把每个物理节点散布多点以均衡负载；增删节点只影响相邻一段。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="390" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">一致性哈希环（0 … 2³²-1 首尾相接）</text>
<circle cx="250" cy="245" r="150" fill="none" stroke="#B4B2A9" stroke-width="2"/>
<text x="250" y="80" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="system-ui, sans-serif">0 / 2³²</text>
<!-- physical nodes -->
<circle cx="325" cy="115" r="11" fill="#378ADD" stroke="#042C53" stroke-width="1"/><text x="343" y="108" font-size="12" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">Node A</text>
<circle cx="325" cy="375" r="11" fill="#1D9E75" stroke="#04342C" stroke-width="1"/><text x="343" y="392" font-size="12" font-weight="600" fill="#04342C" font-family="system-ui, sans-serif">Node B</text>
<circle cx="100" cy="245" r="11" fill="#BA7517" stroke="#7A4D0E" stroke-width="1"/><text x="20" y="249" font-size="12" font-weight="600" fill="#7A4D0E" font-family="system-ui, sans-serif">Node C</text>
<!-- virtual nodes -->
<circle cx="175" cy="115" r="7" fill="#9CC3EC" stroke="#378ADD" stroke-width="0.8"/><text x="150" y="104" font-size="9.5" fill="#5F5E5A" font-family="system-ui, sans-serif">A#2</text>
<circle cx="400" cy="245" r="7" fill="#8FD3BC" stroke="#1D9E75" stroke-width="0.8"/><text x="412" y="249" font-size="9.5" fill="#5F5E5A" font-family="system-ui, sans-serif">B#2</text>
<circle cx="175" cy="375" r="7" fill="#E0BE86" stroke="#BA7517" stroke-width="0.8"/><text x="150" y="395" font-size="9.5" fill="#5F5E5A" font-family="system-ui, sans-serif">C#2</text>
<!-- key -->
<circle cx="378" cy="170" r="8" fill="#C0392B" stroke="#922B21" stroke-width="1"/><text x="392" y="166" font-size="11" font-weight="600" fill="#922B21" font-family="system-ui, sans-serif">key k</text>
<path d="M 388 182 A 150 150 0 0 1 333 366" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="430" y="300" font-size="10.5" fill="#C0392B" font-family="system-ui, sans-serif">顺时针找到</text>
<text x="430" y="315" font-size="10.5" fill="#C0392B" font-family="system-ui, sans-serif">第一个节点 → B</text>
<!-- explanation -->
<rect x="478" y="70" width="288" height="360" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="494" y="96" font-size="13" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">为什么用它</text>
<g font-family="system-ui, sans-serif" font-size="11.5" fill="#2C2C2A">
<text x="494" y="120">• 节点和 key 用同一哈希函数映到环上</text>
<text x="494" y="142">• key 归属：从其位置顺时针遇到的</text>
<text x="510" y="158">第一个节点</text>
<text x="494" y="186" font-weight="600" fill="#1D9E75">增删节点只动一段</text>
<text x="494" y="208">• 加节点：只接管它与前驱之间的 key</text>
<text x="494" y="230">• 删节点：其 key 顺移给下一个节点</text>
<text x="494" y="252">→ 对比取模 hash%N：N 变则几乎全部</text>
<text x="510" y="268">重映射、缓存雪崩</text>
<text x="494" y="296" font-weight="600" fill="#BA7517">虚拟节点解决倾斜</text>
<text x="494" y="318">• 每个物理节点散布成多个虚拟节点</text>
<text x="494" y="340">• 节点少时分布不均 → 虚拟节点拉平</text>
<text x="510" y="356">负载、缩小迁移粒度</text>
<text x="494" y="384" fill="#5F5E5A">应用：分布式缓存分片、一致性路由、</text>
<text x="510" y="400" fill="#5F5E5A">DHT；环用有序结构存便于二分定位</text>
</g>
</svg>
