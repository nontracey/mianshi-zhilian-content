<svg xmlns="http://www.w3.org/2000/svg" width="100%" aria-label="一致性哈希环与虚拟节点" role="img" viewBox="0 0 780 470"><title>一致性哈希：哈希环、虚拟节点与顺时针归属</title><desc>节点和 key 哈希到同一个环上，key 顺时针找到第一个节点；虚拟节点把每个物理节点散布多点以均衡负载；增删节点只影响相邻一段。</desc><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2 1L8 5L2 9"/></marker></defs><text x="390" y="28" fill="#042C53" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">一致性哈希环（0 … 2³²-1 首尾相接）</text><circle cx="250" cy="245" r="150" fill="none" stroke="#B4B2A9" stroke-width="2"/><text x="250" y="80" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">0 / 2³²</text><circle cx="325" cy="115" r="11" fill="#378ADD" stroke="#042C53" stroke-width="1"/><text x="343" y="108" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Node A</text><circle cx="325" cy="375" r="11" fill="#1D9E75" stroke="#04342C" stroke-width="1"/><text x="343" y="392" fill="#04342C" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Node B</text><circle cx="100" cy="245" r="11" fill="#BA7517" stroke="#7A4D0E" stroke-width="1"/><text x="20" y="249" fill="#7A4D0E" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Node C</text><circle cx="175" cy="115" r="7" fill="#9CC3EC" stroke="#378ADD" stroke-width=".8"/><text x="150" y="104" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="9.5">A#2</text><circle cx="400" cy="245" r="7" fill="#8FD3BC" stroke="#1D9E75" stroke-width=".8"/><text x="412" y="249" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="9.5">B#2</text><circle cx="175" cy="375" r="7" fill="#E0BE86" stroke="#BA7517" stroke-width=".8"/><text x="150" y="395" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="9.5">C#2</text><circle cx="378" cy="170" r="8" fill="#C0392B" stroke="#922B21" stroke-width="1"/><text x="392" y="166" fill="#922B21" font-family="system-ui, sans-serif" font-size="11" font-weight="600">key k</text><path fill="none" stroke="#C0392B" stroke-dasharray="5 4" stroke-width="1.8" marker-end="url(#a)" d="M 388 182 A 150 150 0 0 1 333 366"/><text x="430" y="300" fill="#C0392B" font-family="system-ui, sans-serif" font-size="10.5">顺时针找到</text><text x="430" y="315" fill="#C0392B" font-family="system-ui, sans-serif" font-size="10.5">第一个节点 → B</text><rect width="288" height="360" x="478" y="70" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="10"/><text x="494" y="96" fill="#042C53" font-family="system-ui, sans-serif" font-size="13" font-weight="600">为什么用它</text><g fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="11.5"><text x="494" y="120">• 节点和 key 用同一哈希函数映到环上</text><text x="494" y="142">• key 归属：从其位置顺时针遇到的</text><text x="510" y="158">第一个节点</text><text x="494" y="186" fill="#1D9E75" font-weight="600">增删节点只动一段</text><text x="494" y="208">• 加节点：只接管它与前驱之间的 key</text><text x="494" y="230">• 删节点：其 key 顺移给下一个节点</text><text x="494" y="252">→ 对比取模 hash%N：N 变则几乎全部</text><text x="510" y="268">重映射、缓存雪崩</text><text x="494" y="296" fill="#BA7517" font-weight="600">虚拟节点解决倾斜</text><text x="494" y="318">• 每个物理节点散布成多个虚拟节点</text><text x="494" y="340">• 节点少时分布不均 → 虚拟节点拉平</text><text x="510" y="356">负载、缩小迁移粒度</text><text x="494" y="384" fill="#5F5E5A">应用：分布式缓存分片、一致性路由、</text><text x="510" y="400" fill="#5F5E5A">DHT；环用有序结构存便于二分定位</text></g></svg>