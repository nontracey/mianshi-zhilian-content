<svg viewBox="0 0 680 370" width="100%" role="img" aria-label="SpringMVC请求处理流程图">
<title>SpringMVC请求处理流程图</title><desc>从请求接收到响应返回的完整流程</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">SpringMVC 请求处理流程</text>
<rect x="200" y="50" width="280" height="38" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="340" y="70" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">DispatcherServlet</text>
<text x="520" y="72" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">前端控制器接收请求</text>
<line x1="340" y1="88" x2="340" y2="102" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="200" y="102" width="280" height="38" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="340" y="122" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">HandlerMapping</text>
<text x="520" y="124" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">查找对应的Handler</text>
<line x1="340" y1="140" x2="340" y2="154" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="200" y="154" width="280" height="38" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="340" y="174" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">HandlerAdapter</text>
<text x="520" y="176" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">执行Handler方法</text>
<line x1="340" y1="192" x2="340" y2="206" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="200" y="206" width="280" height="38" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="226" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Controller</text>
<text x="520" y="228" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">业务逻辑处理</text>
<line x1="340" y1="244" x2="340" y2="258" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="200" y="258" width="280" height="38" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="340" y="278" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">ViewResolver</text>
<text x="520" y="280" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">解析视图名称</text>
<line x1="340" y1="296" x2="340" y2="310" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="200" y="310" width="280" height="38" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="340" y="330" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">View</text>
<text x="520" y="332" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">渲染并返回响应</text>
</svg>