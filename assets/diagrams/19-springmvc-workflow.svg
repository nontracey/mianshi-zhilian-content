<svg width="100%" aria-label="SpringMVC请求处理流程图" role="img" viewBox="0 0 680 370"><title>SpringMVC请求处理流程图</title><desc>从请求接收到响应返回的完整流程</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="340" y="24" fill="#042C53" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">SpringMVC 请求处理流程</text><rect width="280" height="38" x="200" y="50" fill="#E6F1FB" stroke="#378ADD" stroke-width=".5" rx="8"/><text x="340" y="70" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">DispatcherServlet</text><text x="520" y="72" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">前端控制器接收请求</text><line x1="340" x2="340" y1="88" y2="102" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><rect width="280" height="38" x="200" y="102" fill="#EEEDFE" stroke="#7F77DD" stroke-width=".5" rx="8"/><text x="340" y="122" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">HandlerMapping</text><text x="520" y="124" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">查找对应的Handler</text><line x1="340" x2="340" y1="140" y2="154" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><rect width="280" height="38" x="200" y="154" fill="#FAEEDA" stroke="#BA7517" stroke-width=".5" rx="8"/><text x="340" y="174" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">HandlerAdapter</text><text x="520" y="176" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">执行Handler方法</text><line x1="340" x2="340" y1="192" y2="206" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><rect width="280" height="38" x="200" y="206" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".5" rx="8"/><text x="340" y="226" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Controller</text><text x="520" y="228" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">业务逻辑处理</text><line x1="340" x2="340" y1="244" y2="258" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><rect width="280" height="38" x="200" y="258" fill="#FCEBEB" stroke="#A32D2D" stroke-width=".5" rx="8"/><text x="340" y="278" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">ViewResolver</text><text x="520" y="280" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">解析视图名称</text><line x1="340" x2="340" y1="296" y2="310" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><rect width="280" height="38" x="200" y="310" fill="#E6F1FB" stroke="#378ADD" stroke-width=".5" rx="8"/><text x="340" y="330" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">View</text><text x="520" y="332" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">渲染并返回响应</text></svg>