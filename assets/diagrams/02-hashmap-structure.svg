<svg viewBox="0 0 680 380" width="100%" role="img" aria-label="HashMap底层结构图">
<title>HashMap底层结构图</title><desc>数组+链表+红黑树</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="28" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">HashMap 底层结构</text>
