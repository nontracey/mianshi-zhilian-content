<line x1="418" y1="198" x2="400" y2="218" stroke="#D85A30" stroke-width="1"/>
<line x1="442" y1="198" x2="460" y2="218" stroke="#D85A30" stroke-width="1"/>
<rect x="370" y="218" width="60" height="28" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="400" y="236" text-anchor="middle" font-size="10" font-weight="400" fill="#4A1B0C" font-family="system-ui, sans-serif">左(红)</text>
<rect x="430" y="218" width="60" height="28" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="460" y="236" text-anchor="middle" font-size="10" font-weight="400" fill="#4A1B0C" font-family="system-ui, sans-serif">右(黑)</text>
<rect x="60" y="280" width="560" height="80" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="302" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">转换阈值</text>
<text x="340" y="322" text-anchor="middle" font-size="12" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">链表 -&gt; 红黑树: 长度&gt;8 且数组&gt;=64</text>
<text x="340" y="340" text-anchor="middle" font-size="12" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">红黑树 -&gt; 链表: 节点&lt;6 时退化</text>
<text x="340" y="356" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">默认容量16, 负载因子0.75, 扩容2倍</text>
</svg>