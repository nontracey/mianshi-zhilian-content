<text x="582" y="116" text-anchor="middle" font-size="11" font-weight="400" fill="#042C53" font-family="system-ui, sans-serif">[n-1]</text>
<text x="150" y="152" text-anchor="middle" font-size="12" font-weight="500" fill="#0F6E56" font-family="system-ui, sans-serif">链表 (&lt;=8节点)</text>
