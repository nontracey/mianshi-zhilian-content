<text x="418" y="116" text-anchor="middle" font-size="11" font-weight="400" fill="#042C53" font-family="system-ui, sans-serif">[4]</text>
<rect x="470" y="96" width="60" height="32" rx="4" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="500" y="116" text-anchor="middle" font-size="11" font-weight="400" fill="#042C53" font-family="system-ui, sans-serif">...</text>
