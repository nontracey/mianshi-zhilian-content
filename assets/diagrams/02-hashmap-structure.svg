<rect x="108" y="292" width="84" height="42" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="150" y="310" text-anchor="middle" font-size="10" font-weight="400" fill="#04342C" font-family="system-ui, sans-serif">hash: 0x7C</text>
