<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">Java record generated members, compact constructor, shallow immutability, and framework boundaries</title>
  <desc id="desc">A topic-specific diagram explaining Java record components, generated fields, accessors, canonical constructor, equals/hashCode/toString, compact constructor validation and normalization, shallow immutability, defensive copy for mutable components, and use boundaries versus POJO, Lombok, and JPA entities.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="70" y="64">Record：语言级数据载体，不是所有 POJO 的替代</text>
  <text class="subtitle" x="70" y="96">Java 16 正式引入。组件列表定义状态和值语义；不可变是浅不可变，框架边界要单独判断。</text>

  <rect class="panel" x="70" y="130" width="1180" height="360" rx="16"/>
  <text class="section-title" x="96" y="166">1. 从组件列表生成值语义成员</text>

  <rect class="blue" x="105" y="230" width="260" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="262">Record 声明</text>
  <text class="mono" x="132" y="287">record Point(int x, int y)</text>
  <text class="text" x="132" y="307">组件列表就是公开契约</text>

  <rect class="green" x="430" y="200" width="210" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="457" y="232">字段</text>
  <text class="mono" x="457" y="257">private final x/y</text>

  <rect class="green" x="430" y="315" width="210" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="457" y="347">访问器</text>
  <text class="mono" x="457" y="372">x() / y()</text>

  <rect class="yellow" x="705" y="200" width="220" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="732" y="232">规范构造器</text>
  <text class="text" x="732" y="257">按组件顺序初始化</text>

  <rect class="violet" x="705" y="315" width="220" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="732" y="347">equals/hashCode/toString</text>
  <text class="text" x="732" y="372">基于全部组件生成</text>

  <rect class="cyan" x="990" y="255" width="190" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="1017" y="287">类限制</text>
  <text class="text" x="1017" y="312">隐式 final</text>
  <text class="text" x="1017" y="332">继承 java.lang.Record</text>

  <path class="arrow" d="M365 274 H421"/>
  <path class="arrow" d="M640 241 H696"/>
  <path class="arrow" d="M640 356 H696"/>
  <path class="arrow" d="M925 299 H981"/>

  <rect class="panel" x="70" y="535" width="575" height="315" rx="16"/>
  <text class="section-title" x="96" y="571">2. 紧凑构造器：校验、归一化、防御性拷贝</text>

  <rect class="yellow" x="105" y="620" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="652">参数校验</text>
  <text class="mono" x="132" y="677">if (start &gt; end) throw</text>

  <rect class="green" x="375" y="620" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="402" y="652">参数归一化</text>
  <text class="mono" x="402" y="677">email.toLowerCase()</text>

  <rect class="red" x="105" y="740" width="230" height="74" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="772">可变组件</text>
  <text class="text" x="132" y="796">引用 final，不代表内容不可变</text>

  <rect class="blue" x="375" y="740" width="230" height="74" rx="12" stroke-width="2"/>
  <text class="box-title" x="402" y="772">防御性拷贝</text>
  <text class="mono" x="402" y="796">List.copyOf(items)</text>

  <rect class="panel" x="675" y="535" width="575" height="315" rx="16"/>
  <text class="section-title" x="701" y="571">3. 适用与不适用</text>

  <rect class="green" x="710" y="620" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="737" y="652">适合</text>
  <text class="text" x="737" y="677">DTO / 值对象 / 查询结果</text>

  <rect class="green" x="980" y="620" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1007" y="652">适合</text>
  <text class="text" x="1007" y="677">领域事件 / Map Key</text>

  <rect class="red" x="710" y="740" width="230" height="74" rx="12" stroke-width="2"/>
  <text class="box-title" x="737" y="772">不适合</text>
  <text class="text" x="737" y="796">可变生命周期实体</text>

  <rect class="red" x="980" y="740" width="230" height="74" rx="12" stroke-width="2"/>
  <text class="box-title" x="1007" y="772">需确认</text>
  <text class="text" x="1007" y="796">JPA 代理、旧 JSON/Bean 约定</text>

  <rect class="panel" x="70" y="890" width="1180" height="260" rx="16"/>
  <text class="section-title" x="96" y="926">4. 和 POJO / Lombok 的取舍</text>

  <rect class="blue" x="105" y="980" width="250" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="1012">Record</text>
  <text class="text" x="132" y="1037">JDK 语言特性，值语义强</text>
  <text class="text" x="132" y="1055">访问器是 component()</text>

  <rect class="yellow" x="405" y="980" width="250" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="432" y="1012">普通 POJO</text>
  <text class="text" x="432" y="1037">继承、可变状态、框架兼容强</text>
  <text class="text" x="432" y="1055">样板代码更多</text>

  <rect class="violet" x="705" y="980" width="250" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="732" y="1012">Lombok @Value</text>
  <text class="text" x="732" y="1037">注解处理器生成样板</text>
  <text class="text" x="732" y="1055">可兼容旧 JDK/Builder</text>

  <rect class="red" x="1005" y="980" width="205" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="1032" y="1012">误区</text>
  <text class="text" x="1032" y="1037">不是深不可变</text>
  <text class="text" x="1032" y="1055">不是 Entity 默认选型</text>

  <text class="small" x="96" y="1238">答题抓手：Java 16 正式、组件生成成员、访问器不是 getX、紧凑构造器、防御性拷贝、浅不可变、框架兼容边界。</text>
</svg>
