<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">Java record generated members, compact constructor, shallow immutability, and framework boundaries</title><desc id="desc">A topic-specific diagram explaining Java record components, generated fields, accessors, canonical constructor, equals/hashCode/toString, compact constructor validation and normalization, shallow immutability, defensive copy for mutable components, and use boundaries versus POJO, Lombok, and JPA entities.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 32px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}</style></defs><rect width="1320" height="1320" class="bg"/><text x="70" y="64" class="title">Record：语言级数据载体，不是所有 POJO 的替代</text><text x="70" y="96" class="subtitle">Java 16 正式引入。组件列表定义状态和值语义；不可变是浅不可变，框架边界要单独判断。</text><rect width="1180" height="360" x="70" y="130" class="panel" rx="16"/><text x="96" y="166" class="section-title">1. 从组件列表生成值语义成员</text><rect width="260" height="88" x="105" y="230" stroke-width="2" class="blue" rx="12"/><text x="132" y="262" class="box-title">Record 声明</text><text x="132" y="287" class="mono">record Point(int x, int y)</text><text x="132" y="307" class="text">组件列表就是公开契约</text><rect width="210" height="82" x="430" y="200" stroke-width="2" class="green" rx="12"/><text x="457" y="232" class="box-title">字段</text><text x="457" y="257" class="mono">private final x/y</text><rect width="210" height="82" x="430" y="315" stroke-width="2" class="green" rx="12"/><text x="457" y="347" class="box-title">访问器</text><text x="457" y="372" class="mono">x() / y()</text><rect width="220" height="82" x="705" y="200" stroke-width="2" class="yellow" rx="12"/><text x="732" y="232" class="box-title">规范构造器</text><text x="732" y="257" class="text">按组件顺序初始化</text><rect width="220" height="82" x="705" y="315" stroke-width="2" class="violet" rx="12"/><text x="732" y="347" class="box-title">equals/hashCode/toString</text><text x="732" y="372" class="text">基于全部组件生成</text><rect width="190" height="88" x="990" y="255" stroke-width="2" class="cyan" rx="12"/><text x="1017" y="287" class="box-title">类限制</text><text x="1017" y="312" class="text">隐式 final</text><text x="1017" y="332" class="text">继承 java.lang.Record</text><path d="M365 274 H421" class="arrow"/><path d="M640 241 H696" class="arrow"/><path d="M640 356 H696" class="arrow"/><path d="M925 299 H981" class="arrow"/><rect width="575" height="315" x="70" y="535" class="panel" rx="16"/><text x="96" y="571" class="section-title">2. 紧凑构造器：校验、归一化、防御性拷贝</text><rect width="230" height="82" x="105" y="620" stroke-width="2" class="yellow" rx="12"/><text x="132" y="652" class="box-title">参数校验</text><text x="132" y="677" class="mono">if (start &gt; end) throw</text><rect width="230" height="82" x="375" y="620" stroke-width="2" class="green" rx="12"/><text x="402" y="652" class="box-title">参数归一化</text><text x="402" y="677" class="mono">email.toLowerCase()</text><rect width="230" height="74" x="105" y="740" stroke-width="2" class="red" rx="12"/><text x="132" y="772" class="box-title">可变组件</text><text x="132" y="796" class="text">引用 final，不代表内容不可变</text><rect width="230" height="74" x="375" y="740" stroke-width="2" class="blue" rx="12"/><text x="402" y="772" class="box-title">防御性拷贝</text><text x="402" y="796" class="mono">List.copyOf(items)</text><rect width="575" height="315" x="675" y="535" class="panel" rx="16"/><text x="701" y="571" class="section-title">3. 适用与不适用</text><rect width="230" height="82" x="710" y="620" stroke-width="2" class="green" rx="12"/><text x="737" y="652" class="box-title">适合</text><text x="737" y="677" class="text">DTO / 值对象 / 查询结果</text><rect width="230" height="82" x="980" y="620" stroke-width="2" class="green" rx="12"/><text x="1007" y="652" class="box-title">适合</text><text x="1007" y="677" class="text">领域事件 / Map Key</text><rect width="230" height="74" x="710" y="740" stroke-width="2" class="red" rx="12"/><text x="737" y="772" class="box-title">不适合</text><text x="737" y="796" class="text">可变生命周期实体</text><rect width="230" height="74" x="980" y="740" stroke-width="2" class="red" rx="12"/><text x="1007" y="772" class="box-title">需确认</text><text x="1007" y="796" class="text">JPA 代理、旧 JSON/Bean 约定</text><rect width="1180" height="260" x="70" y="890" class="panel" rx="16"/><text x="96" y="926" class="section-title">4. 和 POJO / Lombok 的取舍</text><rect width="250" height="86" x="105" y="980" stroke-width="2" class="blue" rx="12"/><text x="132" y="1012" class="box-title">Record</text><text x="132" y="1037" class="text">JDK 语言特性，值语义强</text><text x="132" y="1055" class="text">访问器是 component()</text><rect width="250" height="86" x="405" y="980" stroke-width="2" class="yellow" rx="12"/><text x="432" y="1012" class="box-title">普通 POJO</text><text x="432" y="1037" class="text">继承、可变状态、框架兼容强</text><text x="432" y="1055" class="text">样板代码更多</text><rect width="250" height="86" x="705" y="980" stroke-width="2" class="violet" rx="12"/><text x="732" y="1012" class="box-title">Lombok @Value</text><text x="732" y="1037" class="text">注解处理器生成样板</text><text x="732" y="1055" class="text">可兼容旧 JDK/Builder</text><rect width="205" height="86" x="1005" y="980" stroke-width="2" class="red" rx="12"/><text x="1032" y="1012" class="box-title">误区</text><text x="1032" y="1037" class="text">不是深不可变</text><text x="1032" y="1055" class="text">不是 Entity 默认选型</text><text x="96" y="1238" class="small">答题抓手：Java 16 正式、组件生成成员、访问器不是 getX、紧凑构造器、防御性拷贝、浅不可变、框架兼容边界。</text></svg>