<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">Spring Cloud Gateway 路由与过滤器链</title>
  <desc id="desc">展示 Spring Cloud Gateway Server WebFlux/Web MVC 的请求进入、路由断言匹配、过滤器链、目标 URI、负载均衡、转发响应、限流和熔断失败路径。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .box-title { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 13px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .blue { fill: #e8f2ff; stroke: #60a5fa; stroke-width: 2; rx: 12; }
      .green { fill: #e8f8ef; stroke: #4ade80; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff7d6; stroke: #facc15; stroke-width: 2; rx: 12; }
      .orange { fill: #fff1e6; stroke: #fb923c; stroke-width: 2; rx: 12; }
      .red { fill: #feecec; stroke: #f87171; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #b45309; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">Gateway：Route、Predicate、Filter 决定一次请求怎么走</text>
  <text x="50" y="86" class="subtitle">2026 口径要区分 Server WebFlux、Server Web MVC 和 Proxy Exchange，避免把旧 WebFlux 经验套到全部场景。</text>

  <rect x="40" y="120" width="1200" height="230" class="panel"/>
  <text x="68" y="156" class="panel-title">0. 版本形态：先确认你跑的是哪一种 Gateway</text>
  <rect x="78" y="210" width="220" height="72" class="blue"/>
  <text x="112" y="238" class="box-title">Server WebFlux</text>
  <text x="104" y="262" class="tiny">Reactor Netty / 响应式过滤器</text>
  <rect x="382" y="210" width="220" height="72" class="green"/>
  <text x="420" y="238" class="box-title">Server Web MVC</text>
  <text x="410" y="262" class="tiny">Servlet/MVC 风格路由函数</text>
  <rect x="686" y="210" width="220" height="72" class="yellow"/>
  <text x="730" y="238" class="box-title">Proxy Exchange</text>
  <text x="708" y="262" class="tiny">控制器方法里手动代理</text>
  <rect x="990" y="210" width="180" height="72" class="orange"/>
  <text x="1025" y="238" class="box-title">5.0.2</text>
  <text x="1016" y="262" class="tiny">Boot 4 / Framework 7</text>
  <text x="78" y="318" class="small">Server 是完整 API 网关；Proxy Exchange 更像在 WebFlux/MVC handler 里手写代理。不同形态的过滤器 API、线程模型和部署依赖不同。</text>

  <rect x="40" y="390" width="1200" height="390" class="panel"/>
  <text x="68" y="426" class="panel-title">1. 请求链路：先匹配 Route，再组装过滤器链</text>
  <rect x="78" y="492" width="145" height="62" class="blue"/>
  <text x="116" y="517" class="box-title">Client</text>
  <text x="96" y="538" class="tiny">HTTP request</text>
  <rect x="268" y="492" width="170" height="62" class="green"/>
  <text x="292" y="517" class="box-title">HandlerMapping</text>
  <text x="292" y="538" class="tiny">读取 RouteDefinition</text>
  <rect x="483" y="492" width="170" height="62" class="yellow"/>
  <text x="520" y="517" class="box-title">Predicate</text>
  <text x="506" y="538" class="tiny">Path/Host/Header/Method</text>
  <rect x="698" y="492" width="150" height="62" class="orange"/>
  <text x="734" y="517" class="box-title">No match</text>
  <text x="728" y="538" class="tiny">404 / next handler</text>
  <rect x="904" y="492" width="220" height="62" class="green"/>
  <text x="946" y="517" class="box-title">Matched Route</text>
  <text x="930" y="538" class="tiny">GlobalFilter + route filters</text>
  <line x1="223" y1="523" x2="268" y2="523" class="line"/>
  <line x1="438" y1="523" x2="483" y2="523" class="line"/>
  <line x1="653" y1="523" x2="698" y2="523" class="line-red"/>
  <path d="M653,523 C740,452 812,452 904,523" class="line"/>

  <rect x="90" y="650" width="170" height="62" class="yellow"/>
  <text x="126" y="675" class="box-title">Pre filters</text>
  <text x="112" y="696" class="tiny">鉴权/限流/改写/CORS</text>
  <rect x="330" y="650" width="160" height="62" class="blue"/>
  <text x="366" y="675" class="box-title">Target URI</text>
  <text x="354" y="696" class="tiny">lb:// / http / forward</text>
  <rect x="560" y="650" width="170" height="62" class="green"/>
  <text x="596" y="675" class="box-title">LoadBalancer</text>
  <text x="586" y="696" class="tiny">按服务名选实例</text>
  <rect x="800" y="650" width="160" height="62" class="orange"/>
  <text x="834" y="675" class="box-title">Routing</text>
  <text x="824" y="696" class="tiny">Netty / MVC proxy</text>
  <rect x="1030" y="650" width="150" height="62" class="gray"/>
  <text x="1060" y="675" class="box-title">Post filters</text>
  <text x="1052" y="696" class="tiny">响应头/指标/日志</text>
  <path d="M1014,554 C1014,606 175,600 175,650" class="line"/>
  <line x1="260" y1="681" x2="330" y2="681" class="line"/>
  <line x1="490" y1="681" x2="560" y2="681" class="line"/>
  <line x1="730" y1="681" x2="800" y2="681" class="line"/>
  <line x1="960" y1="681" x2="1030" y2="681" class="line"/>

  <rect x="40" y="820" width="585" height="305" class="panel"/>
  <text x="68" y="856" class="panel-title">2. 失败路径必须提前设计</text>
  <rect x="82" y="918" width="220" height="64" class="red"/>
  <text x="126" y="944" class="box-title">401 / 403</text>
  <text x="104" y="966" class="tiny">鉴权认证前置拒绝</text>
  <rect x="360" y="918" width="220" height="64" class="yellow"/>
  <text x="408" y="944" class="box-title">429</text>
  <text x="386" y="966" class="tiny">限流器拒绝，保留可观测标签</text>
  <rect x="82" y="1030" width="220" height="64" class="orange"/>
  <text x="124" y="1056" class="box-title">CircuitBreaker</text>
  <text x="104" y="1078" class="tiny">超时/异常/fallback</text>
  <rect x="360" y="1030" width="220" height="64" class="gray"/>
  <text x="404" y="1056" class="box-title">Retry</text>
  <text x="384" y="1078" class="tiny">只给幂等请求明确预算</text>

  <rect x="655" y="820" width="585" height="305" class="panel"/>
  <text x="683" y="856" class="panel-title">3. 生产排查和容量边界</text>
  <text x="692" y="922" class="small">WebFlux 过滤器里阻塞调用会占用事件循环，容易放大尾延迟。</text>
  <text x="692" y="960" class="small">改写 body、缓存 body、聚合响应会消耗内存，要设大小和超时。</text>
  <text x="692" y="998" class="small">路由顺序、Predicate 优先级、StripPrefix/RewritePath 很容易误伤路径。</text>
  <text x="692" y="1036" class="small">Actuator 路由端点、指标、trace 和 access log 要能定位命中路线。</text>
  <text x="692" y="1074" class="small">网关不应承载重业务编排；鉴权、限流、观测、轻量改写最合适。</text>

  <rect x="40" y="1170" width="1200" height="64" class="panel"/>
  <text x="68" y="1207" class="panel-title">回答抓手</text>
  <text x="190" y="1207" class="small">形态选择 -> RouteDefinition -> Predicate 命中 -> Global/route filters -> target URI -> LB/转发 -> post filter -> 401/429/熔断/重试 -> 可观测和容量边界。</text>
</svg>
