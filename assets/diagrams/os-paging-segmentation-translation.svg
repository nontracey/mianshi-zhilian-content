<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">分页、分段与段页式地址翻译</title><desc id="desc">对比分页、分段、段页式的地址拆分、查表路径、异常点，以及现代 Linux x86-64 平坦分段和页表权限的边界。</desc><defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:600 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.h2{font:700 24px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:700 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:600 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:700 14px &quot;SFMono-Regular&quot;,Consolas,monospace;fill:#0f172a}.amber,.blue,.green{stroke-width:2}.blue,.green{fill:#eff6ff;stroke:#60a5fa}.green{fill:#ecfdf5;stroke:#34d399}.amber{fill:#fffbeb;stroke:#f59e0b}.gray{stroke-width:2}.red{fill:#fef2f2;stroke:#f87171}.red,.violet{stroke-width:2}.gray{fill:#f1f5f9;stroke:#cbd5e1}.violet{fill:#f5f3ff;stroke:#a78bfa}.arrow,.warnArrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}.warnArrow{stroke:#dc2626;marker-end:url(#warnArrow)}</style><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#2563eb" d="M2,2 L10,6 L2,10 Z"/></marker><marker id="warnArrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#dc2626" d="M2,2 L10,6 L2,10 Z"/></marker></defs><rect width="1320" height="1320" class="bg"/><text x="660" y="55" class="title" text-anchor="middle">分页、分段、段页式：核心差异在“地址先按什么含义拆”</text><text x="660" y="88" class="subtitle" text-anchor="middle">分页解决物理页框管理，分段表达逻辑边界；现代 Linux/x86-64 主要用页表权限做隔离</text><rect width="1204" height="330" x="58" y="120" class="panel" rx="10"/><text x="90" y="160" class="h2">1. 分页 Paging：固定页大小，虚拟页号映射到物理页帧</text><rect width="310" height="78" x="95" y="198" class="blue" rx="8"/><text x="250" y="228" class="label" text-anchor="middle">虚拟地址</text><text x="250" y="254" class="mono" text-anchor="middle">VPN | page offset</text><path d="M408 237 H485" class="arrow"/><rect width="245" height="78" x="490" y="198" class="green" rx="8"/><text x="612" y="228" class="label" text-anchor="middle">TLB 命中</text><text x="612" y="254" class="mono" text-anchor="middle">VPN -&gt; PFN</text><path d="M738 237 H815" class="arrow"/><rect width="315" height="78" x="820" y="198" class="blue" rx="8"/><text x="977" y="228" class="label" text-anchor="middle">物理地址</text><text x="977" y="254" class="mono" text-anchor="middle">PFN | same offset</text><rect width="245" height="76" x="490" y="318" class="amber" rx="8"/><text x="612" y="347" class="label" text-anchor="middle">TLB 未命中</text><text x="612" y="374" class="tiny" text-anchor="middle">多级页表遍历 + P/RW/US/NX</text><path d="M612 318 V280" class="arrow"/><rect width="315" height="76" x="820" y="318" class="red" rx="8"/><text x="977" y="347" class="label" text-anchor="middle">异常点</text><text x="977" y="374" class="tiny" text-anchor="middle">缺页、权限违规、COW、换页</text><path d="M738 356 H815" class="warnArrow"/><rect width="1204" height="330" x="58" y="490" class="panel" rx="10"/><text x="90" y="530" class="h2">2. 分段 Segmentation：段号先确定逻辑边界，再做 base/limit/权限检查</text><rect width="310" height="78" x="95" y="570" class="violet" rx="8"/><text x="250" y="600" class="label" text-anchor="middle">逻辑地址</text><text x="250" y="626" class="mono" text-anchor="middle">segment selector | offset</text><path d="M408 609 H485" class="arrow"/><rect width="285" height="78" x="490" y="570" class="green" rx="8"/><text x="632" y="600" class="label" text-anchor="middle">段表 / 描述符</text><text x="632" y="626" class="mono" text-anchor="middle">base, limit, permission</text><path d="M778 609 H855" class="arrow"/><rect width="275" height="78" x="860" y="570" class="blue" rx="8"/><text x="997" y="600" class="label" text-anchor="middle">线性地址</text><text x="997" y="626" class="mono" text-anchor="middle">base + offset</text><rect width="285" height="76" x="490" y="690" class="red" rx="8"/><text x="632" y="719" class="label" text-anchor="middle">越界或权限不符</text><text x="632" y="746" class="tiny" text-anchor="middle">触发段保护异常</text><path d="M632 690 V652" class="warnArrow"/><rect width="275" height="76" x="860" y="690" class="amber" rx="8"/><text x="997" y="719" class="label" text-anchor="middle">可变长度段</text><text x="997" y="746" class="tiny" text-anchor="middle">释放后容易产生外部碎片</text><rect width="1204" height="335" x="58" y="860" class="panel" rx="10"/><text x="90" y="900" class="h2">3. 段页式与现代 Linux 边界：逻辑语义保留，物理管理仍靠分页</text><rect width="285" height="78" x="95" y="945" class="violet" rx="8"/><text x="237" y="975" class="label" text-anchor="middle">段页式地址</text><text x="237" y="1001" class="mono" text-anchor="middle">segment | page | offset</text><path d="M383 984 H445" class="arrow"/><rect width="240" height="78" x="450" y="945" class="green" rx="8"/><text x="570" y="975" class="label" text-anchor="middle">先查段表</text><text x="570" y="1001" class="tiny" text-anchor="middle">找到该段页表和权限</text><path d="M693 984 H755" class="arrow"/><rect width="220" height="78" x="760" y="945" class="blue" rx="8"/><text x="870" y="975" class="label" text-anchor="middle">再查页表</text><text x="870" y="1001" class="tiny" text-anchor="middle">页号映射到页帧</text><path d="M983 984 H1045" class="arrow"/><rect width="145" height="78" x="1050" y="945" class="green" rx="8"/><text x="1122" y="975" class="label" text-anchor="middle">物理页帧</text><text x="1122" y="1001" class="tiny" text-anchor="middle">PFN + offset</text><rect width="335" height="78" x="95" y="1065" class="gray" rx="8"/><text x="262" y="1095" class="label" text-anchor="middle">x86-64 通用模型</text><text x="262" y="1122" class="tiny" text-anchor="middle">CS/DS/SS 等近似平坦，base 通常为 0</text><rect width="335" height="78" x="492" y="1065" class="gray" rx="8"/><text x="659" y="1095" class="label" text-anchor="middle">FS/GS 例外</text><text x="659" y="1122" class="tiny" text-anchor="middle">常用于 TLS、per-CPU 等特殊基址</text><rect width="306" height="78" x="889" y="1065" class="gray" rx="8"/><text x="1042" y="1095" class="label" text-anchor="middle">隔离主体</text><text x="1042" y="1122" class="tiny" text-anchor="middle">VMA 布局 + 页表 RW/US/NX 权限</text><rect width="1100" height="44" x="95" y="1230" class="gray" rx="8"/><text x="645" y="1258" class="text" text-anchor="middle">面试表达：分页是物理页框管理方案，分段是逻辑保护模型；现代 OS 把大部分工程能力压在分页和页表生态上</text></svg>