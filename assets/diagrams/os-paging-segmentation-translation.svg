<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">分页、分段与段页式地址翻译</title>
  <desc id="desc">对比分页、分段、段页式的地址拆分、查表路径、异常点，以及现代 Linux x86-64 平坦分段和页表权限的边界。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .h2 { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 700 14px "SFMono-Regular", Consolas, monospace; fill: #0f172a; }
      .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .green { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; }
      .red { fill: #fef2f2; stroke: #f87171; stroke-width: 2; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
      .violet { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .warnArrow { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#warnArrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="warnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="660" y="55" text-anchor="middle">分页、分段、段页式：核心差异在“地址先按什么含义拆”</text>
  <text class="subtitle" x="660" y="88" text-anchor="middle">分页解决物理页框管理，分段表达逻辑边界；现代 Linux/x86-64 主要用页表权限做隔离</text>

  <rect class="panel" x="58" y="120" width="1204" height="330" rx="10"/>
  <text class="h2" x="90" y="160">1. 分页 Paging：固定页大小，虚拟页号映射到物理页帧</text>
  <rect class="blue" x="95" y="198" width="310" height="78" rx="8"/>
  <text class="label" x="250" y="228" text-anchor="middle">虚拟地址</text>
  <text class="mono" x="250" y="254" text-anchor="middle">VPN | page offset</text>
  <path class="arrow" d="M408 237 H485"/>
  <rect class="green" x="490" y="198" width="245" height="78" rx="8"/>
  <text class="label" x="612" y="228" text-anchor="middle">TLB 命中</text>
  <text class="mono" x="612" y="254" text-anchor="middle">VPN -> PFN</text>
  <path class="arrow" d="M738 237 H815"/>
  <rect class="blue" x="820" y="198" width="315" height="78" rx="8"/>
  <text class="label" x="977" y="228" text-anchor="middle">物理地址</text>
  <text class="mono" x="977" y="254" text-anchor="middle">PFN | same offset</text>

  <rect class="amber" x="490" y="318" width="245" height="76" rx="8"/>
  <text class="label" x="612" y="347" text-anchor="middle">TLB 未命中</text>
  <text class="tiny" x="612" y="374" text-anchor="middle">多级页表遍历 + P/RW/US/NX</text>
  <path class="arrow" d="M612 318 V280"/>
  <rect class="red" x="820" y="318" width="315" height="76" rx="8"/>
  <text class="label" x="977" y="347" text-anchor="middle">异常点</text>
  <text class="tiny" x="977" y="374" text-anchor="middle">缺页、权限违规、COW、换页</text>
  <path class="warnArrow" d="M738 356 H815"/>

  <rect class="panel" x="58" y="490" width="1204" height="330" rx="10"/>
  <text class="h2" x="90" y="530">2. 分段 Segmentation：段号先确定逻辑边界，再做 base/limit/权限检查</text>
  <rect class="violet" x="95" y="570" width="310" height="78" rx="8"/>
  <text class="label" x="250" y="600" text-anchor="middle">逻辑地址</text>
  <text class="mono" x="250" y="626" text-anchor="middle">segment selector | offset</text>
  <path class="arrow" d="M408 609 H485"/>
  <rect class="green" x="490" y="570" width="285" height="78" rx="8"/>
  <text class="label" x="632" y="600" text-anchor="middle">段表 / 描述符</text>
  <text class="mono" x="632" y="626" text-anchor="middle">base, limit, permission</text>
  <path class="arrow" d="M778 609 H855"/>
  <rect class="blue" x="860" y="570" width="275" height="78" rx="8"/>
  <text class="label" x="997" y="600" text-anchor="middle">线性地址</text>
  <text class="mono" x="997" y="626" text-anchor="middle">base + offset</text>

  <rect class="red" x="490" y="690" width="285" height="76" rx="8"/>
  <text class="label" x="632" y="719" text-anchor="middle">越界或权限不符</text>
  <text class="tiny" x="632" y="746" text-anchor="middle">触发段保护异常</text>
  <path class="warnArrow" d="M632 690 V652"/>
  <rect class="amber" x="860" y="690" width="275" height="76" rx="8"/>
  <text class="label" x="997" y="719" text-anchor="middle">可变长度段</text>
  <text class="tiny" x="997" y="746" text-anchor="middle">释放后容易产生外部碎片</text>

  <rect class="panel" x="58" y="860" width="1204" height="335" rx="10"/>
  <text class="h2" x="90" y="900">3. 段页式与现代 Linux 边界：逻辑语义保留，物理管理仍靠分页</text>
  <rect class="violet" x="95" y="945" width="285" height="78" rx="8"/>
  <text class="label" x="237" y="975" text-anchor="middle">段页式地址</text>
  <text class="mono" x="237" y="1001" text-anchor="middle">segment | page | offset</text>
  <path class="arrow" d="M383 984 H445"/>
  <rect class="green" x="450" y="945" width="240" height="78" rx="8"/>
  <text class="label" x="570" y="975" text-anchor="middle">先查段表</text>
  <text class="tiny" x="570" y="1001" text-anchor="middle">找到该段页表和权限</text>
  <path class="arrow" d="M693 984 H755"/>
  <rect class="blue" x="760" y="945" width="220" height="78" rx="8"/>
  <text class="label" x="870" y="975" text-anchor="middle">再查页表</text>
  <text class="tiny" x="870" y="1001" text-anchor="middle">页号映射到页帧</text>
  <path class="arrow" d="M983 984 H1045"/>
  <rect class="green" x="1050" y="945" width="145" height="78" rx="8"/>
  <text class="label" x="1122" y="975" text-anchor="middle">物理页帧</text>
  <text class="tiny" x="1122" y="1001" text-anchor="middle">PFN + offset</text>

  <rect class="gray" x="95" y="1065" width="335" height="78" rx="8"/>
  <text class="label" x="262" y="1095" text-anchor="middle">x86-64 通用模型</text>
  <text class="tiny" x="262" y="1122" text-anchor="middle">CS/DS/SS 等近似平坦，base 通常为 0</text>
  <rect class="gray" x="492" y="1065" width="335" height="78" rx="8"/>
  <text class="label" x="659" y="1095" text-anchor="middle">FS/GS 例外</text>
  <text class="tiny" x="659" y="1122" text-anchor="middle">常用于 TLS、per-CPU 等特殊基址</text>
  <rect class="gray" x="889" y="1065" width="306" height="78" rx="8"/>
  <text class="label" x="1042" y="1095" text-anchor="middle">隔离主体</text>
  <text class="tiny" x="1042" y="1122" text-anchor="middle">VMA 布局 + 页表 RW/US/NX 权限</text>

  <rect class="gray" x="95" y="1230" width="1100" height="44" rx="8"/>
  <text class="text" x="645" y="1258" text-anchor="middle">面试表达：分页是物理页框管理方案，分段是逻辑保护模型；现代 OS 把大部分工程能力压在分页和页表生态上</text>
</svg>
