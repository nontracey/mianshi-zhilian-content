<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">Linux 常用命令排查证据链</title><desc id="desc">展示 Linux 排障时从资源、进程、文件描述符/网络到日志的四层证据链，并标出安全护栏，例如时间窗、print0/xargs -0、SIGTERM 升级和 rm 前 dry-run。</desc><defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:10}.title{font:700 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:600 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.h2{font:700 25px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:700 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:600 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:700 14px &quot;SFMono-Regular&quot;,Consolas,monospace;fill:#0f172a}.blue{fill:#eff6ff;stroke:#60a5fa}.amber,.blue,.gray{stroke-width:2;rx:8}.green{fill:#ecfdf5;stroke:#34d399}.green,.red{stroke-width:2;rx:8}.amber{fill:#fffbeb;stroke:#f59e0b}.red{fill:#fef2f2;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#cbd5e1}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#2563eb" d="M2,2 L10,6 L2,10 Z"/></marker></defs><rect width="1320" height="1320" class="bg"/><text x="660" y="55" class="title" text-anchor="middle">常用命令不是清单：它们要串成可证伪的排查链</text><text x="660" y="88" class="subtitle" text-anchor="middle">先缩小问题层级，再用两类证据交叉验证，最后带护栏执行修复动作</text><rect width="1204" height="470" x="58" y="120" class="panel"/><text x="90" y="162" class="h2">1. 线上机器变慢：四层下钻</text><rect width="235" height="115" x="95" y="205" class="blue"/><text x="212" y="236" class="label" text-anchor="middle">资源层</text><text x="212" y="264" class="mono" text-anchor="middle">top / free / df / iostat</text><text x="212" y="286" class="tiny" text-anchor="middle">CPU、内存 available</text><text x="212" y="306" class="tiny" text-anchor="middle">容量/inode、await</text><path d="M333 262 H405" class="arrow"/><rect width="235" height="115" x="410" y="205" class="green"/><text x="527" y="236" class="label" text-anchor="middle">进程层</text><text x="527" y="264" class="mono" text-anchor="middle">ps / pidstat / top -H</text><text x="527" y="291" class="tiny" text-anchor="middle">哪个进程或线程消耗资源</text><path d="M648 262 H720" class="arrow"/><rect width="235" height="115" x="725" y="205" class="amber"/><text x="842" y="236" class="label" text-anchor="middle">fd / 网络层</text><text x="842" y="264" class="mono" text-anchor="middle">ss / lsof / curl / tcpdump</text><text x="842" y="291" class="tiny" text-anchor="middle">端口、连接、句柄、协议证据</text><path d="M963 262 H1035" class="arrow"/><rect width="145" height="115" x="1040" y="205" class="red"/><text x="1112" y="236" class="label" text-anchor="middle">日志层</text><text x="1112" y="264" class="mono" text-anchor="middle">sed / grep</text><text x="1112" y="291" class="mono" text-anchor="middle">awk / sort</text><rect width="330" height="120" x="95" y="370" class="gray"/><text x="260" y="402" class="label" text-anchor="middle">磁盘满要三证合一</text><text x="260" y="431" class="mono" text-anchor="middle">df -h + df -i + du -xhd1</text><text x="260" y="459" class="tiny" text-anchor="middle">df -h 看容量；df -i 看 inode；du 找目录归属</text><rect width="330" height="120" x="495" y="370" class="gray"/><text x="660" y="402" class="label" text-anchor="middle">df 与 du 不一致</text><text x="660" y="431" class="mono" text-anchor="middle">lsof | grep deleted</text><text x="660" y="459" class="tiny" text-anchor="middle">文件已 unlink 但 fd 仍被进程持有</text><rect width="290" height="120" x="895" y="370" class="gray"/><text x="1040" y="402" class="label" text-anchor="middle">日志 TopN</text><text x="1040" y="431" class="mono" text-anchor="middle">sed window | awk count</text><text x="1040" y="459" class="tiny" text-anchor="middle">先切时间窗，再流式聚合</text><rect width="1204" height="310" x="58" y="625" class="panel"/><text x="90" y="667" class="h2">2. 管道组合：每段只做一件事</text><rect width="190" height="86" x="95" y="715" class="blue"/><text x="190" y="746" class="label" text-anchor="middle">过滤</text><text x="190" y="775" class="mono" text-anchor="middle">grep / sed window</text><path d="M288 758 H348" class="arrow"/><rect width="190" height="86" x="355" y="715" class="green"/><text x="450" y="746" class="label" text-anchor="middle">切片</text><text x="450" y="775" class="mono" text-anchor="middle">awk &apos;{print $1}&apos;</text><path d="M548 758 H608" class="arrow"/><rect width="190" height="86" x="615" y="715" class="amber"/><text x="710" y="746" class="label" text-anchor="middle">聚合</text><text x="710" y="775" class="mono" text-anchor="middle">awk c[$1]++</text><path d="M808 758 H868" class="arrow"/><rect width="190" height="86" x="875" y="715" class="red"/><text x="970" y="746" class="label" text-anchor="middle">排序/截断</text><text x="970" y="775" class="mono" text-anchor="middle">sort -rn | head</text><rect width="1090" height="52" x="95" y="840" class="gray"/><text x="640" y="873" class="text" text-anchor="middle">大文件优先按时间窗/采样缩小输入；100G 日志直接全量 sort 可能把临时目录打满</text><rect width="1204" height="300" x="58" y="970" class="panel"/><text x="90" y="1012" class="h2">3. 安全护栏：命令会改变现场</text><rect width="245" height="92" x="95" y="1055" class="red"/><text x="217" y="1085" class="label" text-anchor="middle">删除前 dry-run</text><text x="217" y="1113" class="mono" text-anchor="middle">printf &apos;%q\n&apos; &quot;$target&quot;</text><text x="217" y="1136" class="tiny" text-anchor="middle">确认路径、挂载点、变量非空</text><rect width="245" height="92" x="380" y="1055" class="red"/><text x="502" y="1085" class="label" text-anchor="middle">终止进程分级</text><text x="502" y="1113" class="mono" text-anchor="middle">TERM → wait → kill -0 → KILL</text><text x="502" y="1136" class="tiny" text-anchor="middle">先给刷盘、关连接、写日志机会</text><rect width="245" height="92" x="665" y="1055" class="red"/><text x="787" y="1085" class="label" text-anchor="middle">文件名要保真</text><text x="787" y="1113" class="mono" text-anchor="middle">find -print0 | xargs -0</text><text x="787" y="1136" class="tiny" text-anchor="middle">空格、换行、通配符都不能切坏</text><rect width="245" height="92" x="950" y="1055" class="red"/><text x="1072" y="1085" class="label" text-anchor="middle">抓包要限量落盘</text><text x="1072" y="1113" class="mono" text-anchor="middle">tcpdump -c N -w file</text><text x="1072" y="1136" class="tiny" text-anchor="middle">避免 stdout 刷屏和无限文件增长</text><rect width="1090" height="52" x="95" y="1190" class="gray"/><text x="640" y="1223" class="text" text-anchor="middle">危险动作前先缩小作用域：路径、时间窗、PID、端口、用户、挂载点，每个都要能被另一条命令验证</text></svg>