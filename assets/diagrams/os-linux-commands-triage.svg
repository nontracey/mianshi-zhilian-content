<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">Linux 常用命令排查证据链</title>
  <desc id="desc">展示 Linux 排障时从资源、进程、文件描述符/网络到日志的四层证据链，并标出安全护栏，例如时间窗、print0/xargs -0、SIGTERM 升级和 rm 前 dry-run。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .h2 { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 700 14px "SFMono-Regular", Consolas, monospace; fill: #0f172a; }
      .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 8; }
      .green { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 8; }
      .amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; rx: 8; }
      .red { fill: #fef2f2; stroke: #f87171; stroke-width: 2; rx: 8; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="660" y="55" text-anchor="middle">常用命令不是清单：它们要串成可证伪的排查链</text>
  <text class="subtitle" x="660" y="88" text-anchor="middle">先缩小问题层级，再用两类证据交叉验证，最后带护栏执行修复动作</text>

  <rect class="panel" x="58" y="120" width="1204" height="470"/>
  <text class="h2" x="90" y="162">1. 线上机器变慢：四层下钻</text>
  <rect class="blue" x="95" y="205" width="235" height="115"/>
  <text class="label" x="212" y="236" text-anchor="middle">资源层</text>
  <text class="mono" x="212" y="264" text-anchor="middle">top / free / df / iostat</text>
  <text class="tiny" x="212" y="286" text-anchor="middle">CPU、内存 available</text>
  <text class="tiny" x="212" y="306" text-anchor="middle">容量/inode、await</text>
  <path class="arrow" d="M333 262 H405"/>
  <rect class="green" x="410" y="205" width="235" height="115"/>
  <text class="label" x="527" y="236" text-anchor="middle">进程层</text>
  <text class="mono" x="527" y="264" text-anchor="middle">ps / pidstat / top -H</text>
  <text class="tiny" x="527" y="291" text-anchor="middle">哪个进程或线程消耗资源</text>
  <path class="arrow" d="M648 262 H720"/>
  <rect class="amber" x="725" y="205" width="235" height="115"/>
  <text class="label" x="842" y="236" text-anchor="middle">fd / 网络层</text>
  <text class="mono" x="842" y="264" text-anchor="middle">ss / lsof / curl / tcpdump</text>
  <text class="tiny" x="842" y="291" text-anchor="middle">端口、连接、句柄、协议证据</text>
  <path class="arrow" d="M963 262 H1035"/>
  <rect class="red" x="1040" y="205" width="145" height="115"/>
  <text class="label" x="1112" y="236" text-anchor="middle">日志层</text>
  <text class="mono" x="1112" y="264" text-anchor="middle">sed / grep</text>
  <text class="mono" x="1112" y="291" text-anchor="middle">awk / sort</text>

  <rect class="gray" x="95" y="370" width="330" height="120"/>
  <text class="label" x="260" y="402" text-anchor="middle">磁盘满要三证合一</text>
  <text class="mono" x="260" y="431" text-anchor="middle">df -h + df -i + du -xhd1</text>
  <text class="tiny" x="260" y="459" text-anchor="middle">df -h 看容量；df -i 看 inode；du 找目录归属</text>
  <rect class="gray" x="495" y="370" width="330" height="120"/>
  <text class="label" x="660" y="402" text-anchor="middle">df 与 du 不一致</text>
  <text class="mono" x="660" y="431" text-anchor="middle">lsof | grep deleted</text>
  <text class="tiny" x="660" y="459" text-anchor="middle">文件已 unlink 但 fd 仍被进程持有</text>
  <rect class="gray" x="895" y="370" width="290" height="120"/>
  <text class="label" x="1040" y="402" text-anchor="middle">日志 TopN</text>
  <text class="mono" x="1040" y="431" text-anchor="middle">sed window | awk count</text>
  <text class="tiny" x="1040" y="459" text-anchor="middle">先切时间窗，再流式聚合</text>

  <rect class="panel" x="58" y="625" width="1204" height="310"/>
  <text class="h2" x="90" y="667">2. 管道组合：每段只做一件事</text>
  <rect class="blue" x="95" y="715" width="190" height="86"/>
  <text class="label" x="190" y="746" text-anchor="middle">过滤</text>
  <text class="mono" x="190" y="775" text-anchor="middle">grep / sed window</text>
  <path class="arrow" d="M288 758 H348"/>
  <rect class="green" x="355" y="715" width="190" height="86"/>
  <text class="label" x="450" y="746" text-anchor="middle">切片</text>
  <text class="mono" x="450" y="775" text-anchor="middle">awk '{print $1}'</text>
  <path class="arrow" d="M548 758 H608"/>
  <rect class="amber" x="615" y="715" width="190" height="86"/>
  <text class="label" x="710" y="746" text-anchor="middle">聚合</text>
  <text class="mono" x="710" y="775" text-anchor="middle">awk c[$1]++</text>
  <path class="arrow" d="M808 758 H868"/>
  <rect class="red" x="875" y="715" width="190" height="86"/>
  <text class="label" x="970" y="746" text-anchor="middle">排序/截断</text>
  <text class="mono" x="970" y="775" text-anchor="middle">sort -rn | head</text>
  <rect class="gray" x="95" y="840" width="1090" height="52"/>
  <text class="text" x="640" y="873" text-anchor="middle">大文件优先按时间窗/采样缩小输入；100G 日志直接全量 sort 可能把临时目录打满</text>

  <rect class="panel" x="58" y="970" width="1204" height="300"/>
  <text class="h2" x="90" y="1012">3. 安全护栏：命令会改变现场</text>
  <rect class="red" x="95" y="1055" width="245" height="92"/>
  <text class="label" x="217" y="1085" text-anchor="middle">删除前 dry-run</text>
  <text class="mono" x="217" y="1113" text-anchor="middle">printf '%q\n' "$target"</text>
  <text class="tiny" x="217" y="1136" text-anchor="middle">确认路径、挂载点、变量非空</text>
  <rect class="red" x="380" y="1055" width="245" height="92"/>
  <text class="label" x="502" y="1085" text-anchor="middle">终止进程分级</text>
  <text class="mono" x="502" y="1113" text-anchor="middle">TERM → wait → kill -0 → KILL</text>
  <text class="tiny" x="502" y="1136" text-anchor="middle">先给刷盘、关连接、写日志机会</text>
  <rect class="red" x="665" y="1055" width="245" height="92"/>
  <text class="label" x="787" y="1085" text-anchor="middle">文件名要保真</text>
  <text class="mono" x="787" y="1113" text-anchor="middle">find -print0 | xargs -0</text>
  <text class="tiny" x="787" y="1136" text-anchor="middle">空格、换行、通配符都不能切坏</text>
  <rect class="red" x="950" y="1055" width="245" height="92"/>
  <text class="label" x="1072" y="1085" text-anchor="middle">抓包要限量落盘</text>
  <text class="mono" x="1072" y="1113" text-anchor="middle">tcpdump -c N -w file</text>
  <text class="tiny" x="1072" y="1136" text-anchor="middle">避免 stdout 刷屏和无限文件增长</text>
  <rect class="gray" x="95" y="1190" width="1090" height="52"/>
  <text class="text" x="640" y="1223" text-anchor="middle">危险动作前先缩小作用域：路径、时间窗、PID、端口、用户、挂载点，每个都要能被另一条命令验证</text>
</svg>
