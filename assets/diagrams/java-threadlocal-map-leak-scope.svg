<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">ThreadLocalMap 存储、泄漏和上下文边界</title>
  <desc id="desc">展示 Thread 持有 ThreadLocalMap，Entry 使用弱 key 和强 value，线程池复用导致残留值，并对比 InheritableThreadLocal 和 ScopedValue 的作用域边界。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5f99"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b24634"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #14213d; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .label { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 14px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .code { font: 600 13px Menlo, Consolas, monospace; fill: #263238; }
      .blue { fill: #e8f4ff; stroke: #6aa9df; stroke-width: 2; rx: 12; }
      .green { fill: #e9f7ef; stroke: #58b77d; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff5d6; stroke: #e0ae35; stroke-width: 2; rx: 12; }
      .red { fill: #fdecea; stroke: #cf5d4b; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #a7b5c4; stroke-width: 2; rx: 12; }
      .line { stroke: #1f5f99; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #b24634; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #7b8794; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">ThreadLocal：值在线程里，生命周期要自己收口</text>
  <text x="50" y="86" class="subtitle">ThreadLocal 是 key；真正持有 value 的是当前 Thread 的 ThreadLocalMap。</text>

  <rect x="40" y="120" width="1200" height="300" class="panel"/>
  <text x="68" y="156" class="panel-title">1. 存储结构：Thread -> ThreadLocalMap -> Entry[]</text>
  <rect x="84" y="208" width="160" height="74" class="blue"/>
  <text x="126" y="236" class="label">Thread</text>
  <text x="112" y="260" class="tiny">worker-17</text>
  <rect x="300" y="208" width="190" height="74" class="yellow"/>
  <text x="336" y="236" class="label">threadLocals</text>
  <text x="334" y="260" class="tiny">ThreadLocalMap</text>
  <rect x="546" y="178" width="210" height="74" class="green"/>
  <text x="598" y="206" class="label">Entry.key</text>
  <text x="584" y="230" class="tiny">WeakReference&lt;ThreadLocal&gt;</text>
  <rect x="546" y="292" width="210" height="74" class="red"/>
  <text x="594" y="320" class="label">Entry.value</text>
  <text x="596" y="344" class="tiny">业务对象强引用</text>
  <rect x="830" y="178" width="158" height="74" class="gray"/>
  <text x="864" y="206" class="label">ThreadLocal</text>
  <text x="868" y="230" class="tiny">访问 key</text>
  <rect x="830" y="292" width="158" height="74" class="red"/>
  <text x="870" y="320" class="label">RequestCtx</text>
  <text x="864" y="344" class="tiny">user / traceId</text>
  <line x1="244" y1="245" x2="300" y2="245" class="line"/>
  <line x1="490" y1="245" x2="546" y2="215" class="line"/>
  <line x1="490" y1="245" x2="546" y2="329" class="line-red"/>
  <line x1="756" y1="215" x2="830" y2="215" class="dash"/>
  <line x1="756" y1="329" x2="830" y2="329" class="line-red"/>
  <text x="84" y="384" class="small">set/get/remove 都访问当前线程自己的 map；ThreadLocal 对象本身不保存业务值。</text>

  <rect x="40" y="460" width="1200" height="275" class="panel"/>
  <text x="68" y="496" class="panel-title">2. 泄漏与串数据：弱 key 不能替代 remove</text>
  <rect x="84" y="552" width="182" height="72" class="blue"/>
  <text x="120" y="580" class="label">请求 A set</text>
  <text x="118" y="604" class="tiny">value 留在 worker</text>
  <rect x="326" y="552" width="182" height="72" class="yellow"/>
  <text x="368" y="580" class="label">未 remove</text>
  <text x="354" y="604" class="tiny">逻辑请求结束</text>
  <rect x="568" y="552" width="182" height="72" class="red"/>
  <text x="604" y="580" class="label">worker 复用</text>
  <text x="594" y="604" class="tiny">请求 B 执行</text>
  <rect x="810" y="552" width="182" height="72" class="red"/>
  <text x="846" y="580" class="label">读到旧值</text>
  <text x="842" y="604" class="tiny">串用户 / 串租户</text>
  <rect x="1030" y="552" width="150" height="72" class="green"/>
  <text x="1066" y="580" class="label">finally</text>
  <text x="1062" y="604" class="tiny">remove 收口</text>
  <line x1="266" y1="588" x2="326" y2="588" class="line"/>
  <line x1="508" y1="588" x2="568" y2="588" class="line-red"/>
  <line x1="750" y1="588" x2="810" y2="588" class="line-red"/>
  <line x1="992" y1="588" x2="1030" y2="588" class="line"/>
  <text x="86" y="686" class="small">key 被 GC 成 null 时，value 仍可能被 Entry 强持有；启发式清理不等于请求结束清理。</text>

  <rect x="40" y="775" width="585" height="310" class="panel"/>
  <text x="68" y="811" class="panel-title">3. InheritableThreadLocal：只在线程创建时复制</text>
  <rect x="80" y="866" width="152" height="72" class="blue"/>
  <text x="118" y="894" class="label">父线程</text>
  <text x="108" y="918" class="tiny">set parent-1</text>
  <rect x="278" y="866" width="152" height="72" class="yellow"/>
  <text x="316" y="894" class="label">new Thread</text>
  <text x="300" y="918" class="tiny">复制 inheritable map</text>
  <rect x="476" y="866" width="112" height="72" class="green"/>
  <text x="508" y="894" class="label">子线程</text>
  <text x="498" y="918" class="tiny">看到副本</text>
  <line x1="232" y1="902" x2="278" y2="902" class="line"/>
  <line x1="430" y1="902" x2="476" y2="902" class="line"/>
  <rect x="80" y="984" width="508" height="58" class="red"/>
  <text x="108" y="1018" class="small">线程池 worker 已存在；提交新任务不会重新复制父线程当前值。</text>

  <rect x="655" y="775" width="585" height="310" class="panel"/>
  <text x="683" y="811" class="panel-title">4. ScopedValue：作用域内只读上下文</text>
  <rect x="692" y="866" width="150" height="72" class="blue"/>
  <text x="724" y="894" class="label">bind scope</text>
  <text x="720" y="918" class="tiny">进入调用块</text>
  <rect x="886" y="866" width="150" height="72" class="green"/>
  <text x="918" y="894" class="label">callee get</text>
  <text x="916" y="918" class="tiny">只读访问</text>
  <rect x="1080" y="866" width="124" height="72" class="gray"/>
  <text x="1112" y="894" class="label">scope end</text>
  <text x="1104" y="918" class="tiny">绑定失效</text>
  <line x1="842" y1="902" x2="886" y2="902" class="line"/>
  <line x1="1036" y1="902" x2="1080" y2="902" class="line"/>
  <rect x="692" y="984" width="512" height="58" class="gray"/>
  <text x="718" y="1018" class="small">JDK 25 正式特性；适合只读上下文、虚拟线程和结构化并发。</text>

  <rect x="40" y="1125" width="1200" height="90" class="panel"/>
  <text x="68" y="1160" class="panel-title">排查抓手</text>
  <text x="188" y="1160" class="small">看 Thread -> threadLocals -> Entry -> value 引用链；结合 worker 复用、MDC/用户上下文残留和 remove 路径。</text>
  <text x="188" y="1192" class="small">核心原则：隐式上下文要有边界；跨线程传播要显式捕获、恢复、清理。</text>
</svg>
