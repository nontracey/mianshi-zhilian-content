<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">一次 IO 的两阶段与同步异步分界</title>
  <desc id="desc">用五条泳道展示阻塞 IO、非阻塞 IO、多路复用、信号驱动 IO 和异步 IO 在数据准备阶段、数据拷贝阶段、就绪通知与完成通知上的差异。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .h2 { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 700 16px "SFMono-Regular", Consolas, monospace; fill: #0f172a; }
      .lane { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
      .prep { fill: #dbeafe; stroke: #60a5fa; stroke-width: 2; rx: 7; }
      .copy { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 7; }
      .ready { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 7; }
      .async { fill: #fce7f3; stroke: #f472b6; stroke-width: 2; rx: 7; }
      .warn { fill: #fef2f2; stroke: #f87171; stroke-width: 2; rx: 7; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 7; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="660" y="55" text-anchor="middle">IO 模型的核心：就绪通知不等于完成通知</text>
  <text class="subtitle" x="660" y="88" text-anchor="middle">阻塞/非阻塞看数据准备怎么等；同步/异步看数据拷贝是否由调用线程完成</text>

  <rect class="panel" x="58" y="120" width="1204" height="660"/>
  <text class="h2" x="90" y="162">1. 五种模型放在同一条两阶段时间线上</text>
  <rect class="prep" x="360" y="190" width="305" height="54"/>
  <text class="label" x="512" y="222" text-anchor="middle">阶段 1：数据准备</text>
  <rect class="copy" x="690" y="190" width="305" height="54"/>
  <text class="label" x="842" y="222" text-anchor="middle">阶段 2：拷贝到用户 buffer</text>
  <rect class="ready" x="1020" y="190" width="170" height="54"/>
  <text class="label" x="1105" y="222" text-anchor="middle">返回/通知</text>

  <rect class="lane" x="92" y="270" width="1116" height="72"/>
  <text class="label" x="148" y="315" text-anchor="middle">阻塞 IO</text>
  <text class="mono" x="245" y="315" text-anchor="middle">recv()</text>
  <path class="arrow" d="M292 306 H350"/>
  <rect class="prep" x="360" y="286" width="305" height="40"/>
  <text class="text" x="512" y="311" text-anchor="middle">线程睡眠，等内核缓冲区有数据</text>
  <path class="arrow" d="M668 306 H686"/>
  <rect class="copy" x="690" y="286" width="305" height="40"/>
  <text class="text" x="842" y="311" text-anchor="middle">同一个调用等待拷贝完成</text>
  <path class="arrow" d="M998 306 H1016"/>
  <text class="text" x="1105" y="311" text-anchor="middle">recv 返回</text>

  <rect class="lane" x="92" y="362" width="1116" height="72"/>
  <text class="label" x="148" y="407" text-anchor="middle">非阻塞 IO</text>
  <text class="mono" x="245" y="407" text-anchor="middle">recv()</text>
  <rect class="warn" x="360" y="378" width="305" height="40"/>
  <text class="text" x="512" y="403" text-anchor="middle">未就绪立即 EAGAIN，别空转轮询</text>
  <path class="arrow" d="M668 398 H686"/>
  <rect class="copy" x="690" y="378" width="305" height="40"/>
  <text class="text" x="842" y="403" text-anchor="middle">就绪后那次 recv 仍负责拷贝</text>
  <path class="arrow" d="M998 398 H1016"/>
  <text class="text" x="1105" y="403" text-anchor="middle">同步返回</text>

  <rect class="lane" x="92" y="454" width="1116" height="72"/>
  <text class="label" x="148" y="499" text-anchor="middle">多路复用</text>
  <text class="mono" x="245" y="499" text-anchor="middle">epoll_wait</text>
  <rect class="ready" x="360" y="470" width="305" height="40"/>
  <text class="text" x="512" y="495" text-anchor="middle">一个线程等很多 fd 的就绪事件</text>
  <path class="arrow" d="M668 490 H686"/>
  <rect class="copy" x="690" y="470" width="305" height="40"/>
  <text class="text" x="842" y="495" text-anchor="middle">返回就绪 fd 后，应用自己 recv</text>
  <path class="arrow" d="M998 490 H1016"/>
  <text class="text" x="1105" y="495" text-anchor="middle">同步 IO</text>

  <rect class="lane" x="92" y="546" width="1116" height="72"/>
  <text class="label" x="148" y="591" text-anchor="middle">信号驱动</text>
  <text class="mono" x="245" y="591" text-anchor="middle">SIGIO</text>
  <rect class="ready" x="360" y="562" width="305" height="40"/>
  <text class="text" x="512" y="587" text-anchor="middle">内核通知“可读”，不是通知“已读”</text>
  <path class="arrow" d="M668 582 H686"/>
  <rect class="copy" x="690" y="562" width="305" height="40"/>
  <text class="text" x="842" y="587" text-anchor="middle">信号处理后仍要应用读数据</text>
  <path class="arrow" d="M998 582 H1016"/>
  <text class="text" x="1105" y="587" text-anchor="middle">同步 IO</text>

  <rect class="lane" x="92" y="638" width="1116" height="82"/>
  <text class="label" x="148" y="686" text-anchor="middle">异步 IO</text>
  <text class="mono" x="245" y="686" text-anchor="middle">submit</text>
  <path class="arrow" d="M292 678 H350"/>
  <rect class="async" x="360" y="654" width="635" height="48"/>
  <text class="text" x="677" y="683" text-anchor="middle">提交请求后返回；完成路径推进并投递 CQE/回调</text>
  <path class="arrow" d="M998 678 H1016"/>
  <text class="text" x="1105" y="683" text-anchor="middle">完成通知</text>

  <rect class="panel" x="58" y="815" width="1204" height="230"/>
  <text class="h2" x="90" y="857">2. 面试判断口径：两个维度，不要混成一个词</text>
  <rect class="gray" x="110" y="890" width="245" height="95"/>
  <text class="label" x="232" y="922" text-anchor="middle">阻塞/非阻塞</text>
  <text class="text" x="232" y="951" text-anchor="middle">第一阶段调用线程</text>
  <text class="text" x="232" y="975" text-anchor="middle">是否睡眠等待就绪</text>
  <rect class="gray" x="390" y="890" width="245" height="95"/>
  <text class="label" x="512" y="922" text-anchor="middle">同步/异步</text>
  <text class="text" x="512" y="951" text-anchor="middle">第二阶段数据拷贝</text>
  <text class="text" x="512" y="975" text-anchor="middle">是否仍由调用线程完成</text>
  <rect class="warn" x="670" y="890" width="245" height="95"/>
  <text class="label" x="792" y="922" text-anchor="middle">epoll 不是异步</text>
  <text class="text" x="792" y="951" text-anchor="middle">它返回的是就绪 fd</text>
  <text class="text" x="792" y="975" text-anchor="middle">不是已完成的读结果</text>
  <rect class="async" x="950" y="890" width="245" height="95"/>
  <text class="label" x="1072" y="922" text-anchor="middle">io_uring 口径</text>
  <text class="text" x="1072" y="951" text-anchor="middle">SQ 提交，CQ 收完成</text>
  <text class="text" x="1072" y="975" text-anchor="middle">具体是否零拷贝看操作</text>

  <rect class="panel" x="58" y="1080" width="1204" height="190"/>
  <text class="h2" x="90" y="1122">3. 高频误区</text>
  <rect class="warn" x="92" y="1155" width="350" height="76"/>
  <text class="label" x="267" y="1184" text-anchor="middle">ET 模式必须配非阻塞</text>
  <text class="text" x="267" y="1213" text-anchor="middle">循环读到 EAGAIN，否则容易丢事件或卡死循环</text>
  <rect class="warn" x="485" y="1155" width="330" height="76"/>
  <text class="label" x="650" y="1184" text-anchor="middle">POSIX AIO 不是网络主路径</text>
  <text class="text" x="650" y="1213" text-anchor="middle">Linux glibc 实现有线程成本，服务端常用 epoll</text>
  <rect class="warn" x="858" y="1155" width="350" height="76"/>
  <text class="label" x="1033" y="1184" text-anchor="middle">异步也要看完成语义</text>
  <text class="text" x="1033" y="1213" text-anchor="middle">CQE/回调表示操作结束，别把就绪事件当完成事件</text>
</svg>
