<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">一次 IO 的两阶段与同步异步分界</title><desc id="desc">用五条泳道展示阻塞 IO、非阻塞 IO、多路复用、信号驱动 IO 和异步 IO 在数据准备阶段、数据拷贝阶段、就绪通知与完成通知上的差异。</desc><defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:10}.title{font:700 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:600 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.h2{font:700 25px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:700 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.mono{font:700 16px &quot;SFMono-Regular&quot;,Consolas,monospace;fill:#0f172a}.lane{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1.5;rx:8}.copy,.prep{stroke-width:2;rx:7}.prep{fill:#dbeafe;stroke:#60a5fa}.copy{fill:#fef3c7;stroke:#f59e0b}.async,.gray{stroke-width:2;rx:7}.ready{fill:#ecfdf5;stroke:#34d399}.ready,.warn{stroke-width:2;rx:7}.async{fill:#fce7f3;stroke:#f472b6}.warn{fill:#fef2f2;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#cbd5e1}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#2563eb" d="M2,2 L10,6 L2,10 Z"/></marker></defs><rect width="1320" height="1320" class="bg"/><text x="660" y="55" class="title" text-anchor="middle">IO 模型的核心：就绪通知不等于完成通知</text><text x="660" y="88" class="subtitle" text-anchor="middle">阻塞/非阻塞看数据准备怎么等；同步/异步看数据拷贝是否由调用线程完成</text><rect width="1204" height="660" x="58" y="120" class="panel"/><text x="90" y="162" class="h2">1. 五种模型放在同一条两阶段时间线上</text><rect width="305" height="54" x="360" y="190" class="prep"/><text x="512" y="222" class="label" text-anchor="middle">阶段 1：数据准备</text><rect width="305" height="54" x="690" y="190" class="copy"/><text x="842" y="222" class="label" text-anchor="middle">阶段 2：拷贝到用户 buffer</text><rect width="170" height="54" x="1020" y="190" class="ready"/><text x="1105" y="222" class="label" text-anchor="middle">返回/通知</text><rect width="1116" height="72" x="92" y="270" class="lane"/><text x="148" y="315" class="label" text-anchor="middle">阻塞 IO</text><text x="245" y="315" class="mono" text-anchor="middle">recv()</text><path d="M292 306 H350" class="arrow"/><rect width="305" height="40" x="360" y="286" class="prep"/><text x="512" y="311" class="text" text-anchor="middle">线程睡眠，等内核缓冲区有数据</text><path d="M668 306 H686" class="arrow"/><rect width="305" height="40" x="690" y="286" class="copy"/><text x="842" y="311" class="text" text-anchor="middle">同一个调用等待拷贝完成</text><path d="M998 306 H1016" class="arrow"/><text x="1105" y="311" class="text" text-anchor="middle">recv 返回</text><rect width="1116" height="72" x="92" y="362" class="lane"/><text x="148" y="407" class="label" text-anchor="middle">非阻塞 IO</text><text x="245" y="407" class="mono" text-anchor="middle">recv()</text><rect width="305" height="40" x="360" y="378" class="warn"/><text x="512" y="403" class="text" text-anchor="middle">未就绪立即 EAGAIN，别空转轮询</text><path d="M668 398 H686" class="arrow"/><rect width="305" height="40" x="690" y="378" class="copy"/><text x="842" y="403" class="text" text-anchor="middle">就绪后那次 recv 仍负责拷贝</text><path d="M998 398 H1016" class="arrow"/><text x="1105" y="403" class="text" text-anchor="middle">同步返回</text><rect width="1116" height="72" x="92" y="454" class="lane"/><text x="148" y="499" class="label" text-anchor="middle">多路复用</text><text x="245" y="499" class="mono" text-anchor="middle">epoll_wait</text><rect width="305" height="40" x="360" y="470" class="ready"/><text x="512" y="495" class="text" text-anchor="middle">一个线程等很多 fd 的就绪事件</text><path d="M668 490 H686" class="arrow"/><rect width="305" height="40" x="690" y="470" class="copy"/><text x="842" y="495" class="text" text-anchor="middle">返回就绪 fd 后，应用自己 recv</text><path d="M998 490 H1016" class="arrow"/><text x="1105" y="495" class="text" text-anchor="middle">同步 IO</text><rect width="1116" height="72" x="92" y="546" class="lane"/><text x="148" y="591" class="label" text-anchor="middle">信号驱动</text><text x="245" y="591" class="mono" text-anchor="middle">SIGIO</text><rect width="305" height="40" x="360" y="562" class="ready"/><text x="512" y="587" class="text" text-anchor="middle">内核通知“可读”，不是通知“已读”</text><path d="M668 582 H686" class="arrow"/><rect width="305" height="40" x="690" y="562" class="copy"/><text x="842" y="587" class="text" text-anchor="middle">信号处理后仍要应用读数据</text><path d="M998 582 H1016" class="arrow"/><text x="1105" y="587" class="text" text-anchor="middle">同步 IO</text><rect width="1116" height="82" x="92" y="638" class="lane"/><text x="148" y="686" class="label" text-anchor="middle">异步 IO</text><text x="245" y="686" class="mono" text-anchor="middle">submit</text><path d="M292 678 H350" class="arrow"/><rect width="635" height="48" x="360" y="654" class="async"/><text x="677" y="683" class="text" text-anchor="middle">提交请求后返回；完成路径推进并投递 CQE/回调</text><path d="M998 678 H1016" class="arrow"/><text x="1105" y="683" class="text" text-anchor="middle">完成通知</text><rect width="1204" height="230" x="58" y="815" class="panel"/><text x="90" y="857" class="h2">2. 面试判断口径：两个维度，不要混成一个词</text><rect width="245" height="95" x="110" y="890" class="gray"/><text x="232" y="922" class="label" text-anchor="middle">阻塞/非阻塞</text><text x="232" y="951" class="text" text-anchor="middle">第一阶段调用线程</text><text x="232" y="975" class="text" text-anchor="middle">是否睡眠等待就绪</text><rect width="245" height="95" x="390" y="890" class="gray"/><text x="512" y="922" class="label" text-anchor="middle">同步/异步</text><text x="512" y="951" class="text" text-anchor="middle">第二阶段数据拷贝</text><text x="512" y="975" class="text" text-anchor="middle">是否仍由调用线程完成</text><rect width="245" height="95" x="670" y="890" class="warn"/><text x="792" y="922" class="label" text-anchor="middle">epoll 不是异步</text><text x="792" y="951" class="text" text-anchor="middle">它返回的是就绪 fd</text><text x="792" y="975" class="text" text-anchor="middle">不是已完成的读结果</text><rect width="245" height="95" x="950" y="890" class="async"/><text x="1072" y="922" class="label" text-anchor="middle">io_uring 口径</text><text x="1072" y="951" class="text" text-anchor="middle">SQ 提交，CQ 收完成</text><text x="1072" y="975" class="text" text-anchor="middle">具体是否零拷贝看操作</text><rect width="1204" height="190" x="58" y="1080" class="panel"/><text x="90" y="1122" class="h2">3. 高频误区</text><rect width="350" height="76" x="92" y="1155" class="warn"/><text x="267" y="1184" class="label" text-anchor="middle">ET 模式必须配非阻塞</text><text x="267" y="1213" class="text" text-anchor="middle">循环读到 EAGAIN，否则容易丢事件或卡死循环</text><rect width="330" height="76" x="485" y="1155" class="warn"/><text x="650" y="1184" class="label" text-anchor="middle">POSIX AIO 不是网络主路径</text><text x="650" y="1213" class="text" text-anchor="middle">Linux glibc 实现有线程成本，服务端常用 epoll</text><rect width="350" height="76" x="858" y="1155" class="warn"/><text x="1033" y="1184" class="label" text-anchor="middle">异步也要看完成语义</text><text x="1033" y="1213" class="text" text-anchor="middle">CQE/回调表示操作结束，别把就绪事件当完成事件</text></svg>