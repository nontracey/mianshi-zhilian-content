<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">Spring IoC 容器内部链路</title>
  <desc id="desc">展示配置元数据进入 BeanDefinition 注册表、BeanFactory 后处理器、getBean 创建链路、依赖候选选择、BeanPostProcessor 与 AOP 代理返回缓存。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .box-title { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 13px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .code { font: 600 13px Menlo, Consolas, monospace; fill: #263238; }
      .blue { fill: #e8f2ff; stroke: #60a5fa; stroke-width: 2; rx: 12; }
      .green { fill: #e8f8ef; stroke: #4ade80; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff7d6; stroke: #facc15; stroke-width: 2; rx: 12; }
      .orange { fill: #fff1e6; stroke: #fb923c; stroke-width: 2; rx: 12; }
      .red { fill: #feecec; stroke: #f87171; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #b45309; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">Spring IoC 容器：从 BeanDefinition 到可用对象</text>
  <text x="50" y="86" class="subtitle">核心不是替业务类 new 对象，而是围绕元数据、候选依赖、生命周期扩展点和代理对象建立可控装配链。</text>

  <rect x="40" y="120" width="1200" height="270" class="panel"/>
  <text x="68" y="156" class="panel-title">1. 启动期：配置来源进入 BeanDefinition 注册表</text>
  <rect x="76" y="208" width="168" height="68" class="blue"/>
  <text x="105" y="235" class="box-title">@Component</text>
  <text x="92" y="258" class="tiny">扫描候选组件</text>
  <rect x="282" y="208" width="168" height="68" class="blue"/>
  <text x="318" y="235" class="box-title">@Bean / XML</text>
  <text x="309" y="258" class="tiny">显式声明对象配方</text>
  <rect x="488" y="208" width="168" height="68" class="blue"/>
  <text x="527" y="235" class="box-title">@Import</text>
  <text x="509" y="258" class="tiny">选择器或注册器扩展</text>
  <rect x="720" y="198" width="210" height="88" class="green"/>
  <text x="755" y="230" class="box-title">BeanDefinition</text>
  <text x="742" y="254" class="tiny">class / scope / lazy / init</text>
  <text x="742" y="273" class="tiny">qualifier / dependsOn</text>
  <rect x="1004" y="198" width="188" height="88" class="yellow"/>
  <text x="1034" y="230" class="box-title">BFPP 介入</text>
  <text x="1030" y="254" class="tiny">改元数据而非实例</text>
  <text x="1030" y="273" class="tiny">占位符/配置类增强</text>
  <line x1="244" y1="242" x2="282" y2="242" class="line"/>
  <line x1="450" y1="242" x2="488" y2="242" class="line"/>
  <line x1="656" y1="242" x2="720" y2="242" class="line"/>
  <line x1="930" y1="242" x2="1004" y2="242" class="line"/>
  <text x="78" y="336" class="small">启动期先沉淀“怎么创建”的配方，BeanFactoryPostProcessor 只调整配方；真正实例通常在刷新单例或 getBean 时创建。</text>

  <rect x="40" y="430" width="765" height="480" class="panel"/>
  <text x="68" y="466" class="panel-title">2. getBean：缓存命中或按配方创建</text>
  <rect x="78" y="520" width="150" height="64" class="orange"/>
  <text x="108" y="546" class="box-title">getBean</text>
  <text x="96" y="568" class="tiny">name / type 入口</text>
  <rect x="280" y="520" width="170" height="64" class="green"/>
  <text x="309" y="546" class="box-title">单例缓存</text>
  <text x="306" y="568" class="tiny">命中直接返回</text>
  <rect x="512" y="520" width="210" height="64" class="blue"/>
  <text x="550" y="546" class="box-title">createBean</text>
  <text x="534" y="568" class="tiny">构造器或工厂方法</text>
  <line x1="228" y1="552" x2="280" y2="552" class="line"/>
  <line x1="450" y1="552" x2="512" y2="552" class="line"/>

  <rect x="78" y="646" width="150" height="64" class="blue"/>
  <text x="112" y="672" class="box-title">实例化</text>
  <text x="101" y="694" class="tiny">对象已出现</text>
  <rect x="280" y="646" width="170" height="64" class="yellow"/>
  <text x="302" y="672" class="box-title">依赖描述符</text>
  <text x="304" y="694" class="tiny">字段/方法/构造参数</text>
  <rect x="512" y="646" width="210" height="64" class="green"/>
  <text x="553" y="672" class="box-title">注入依赖</text>
  <text x="534" y="694" class="tiny">构造器 / setter / 字段</text>
  <line x1="153" y1="584" x2="153" y2="646" class="line"/>
  <line x1="228" y1="678" x2="280" y2="678" class="line"/>
  <line x1="450" y1="678" x2="512" y2="678" class="line"/>

  <rect x="78" y="772" width="150" height="64" class="gray"/>
  <text x="107" y="798" class="box-title">Aware/init</text>
  <text x="97" y="820" class="tiny">回调和初始化</text>
  <rect x="280" y="772" width="170" height="64" class="gray"/>
  <text x="306" y="798" class="box-title">BPP after</text>
  <text x="302" y="820" class="tiny">可返回代理对象</text>
  <rect x="512" y="772" width="210" height="64" class="red"/>
  <text x="553" y="798" class="box-title">AOP proxy</text>
  <text x="535" y="820" class="tiny">调用方拿到代理</text>
  <line x1="617" y1="710" x2="153" y2="772" class="line-red"/>
  <line x1="228" y1="804" x2="280" y2="804" class="line"/>
  <line x1="450" y1="804" x2="512" y2="804" class="line"/>
  <text x="78" y="872" class="small">AOP、事务、校验等横切能力多在 BeanPostProcessor 阶段接入；调用方拿到的可能已经不是原始对象。</text>

  <rect x="835" y="430" width="405" height="480" class="panel"/>
  <text x="864" y="466" class="panel-title">3. 候选依赖选择</text>
  <rect x="872" y="516" width="330" height="56" class="blue"/>
  <text x="898" y="550" class="small">按 ResolvableType 找类型候选，泛型也参与匹配</text>
  <rect x="872" y="592" width="330" height="56" class="green"/>
  <text x="898" y="626" class="small">@Primary 优先；@Fallback 作为兜底候选</text>
  <rect x="872" y="668" width="330" height="56" class="yellow"/>
  <text x="898" y="702" class="small">@Qualifier、bean name、参数名继续收窄</text>
  <rect x="872" y="744" width="330" height="56" class="orange"/>
  <text x="898" y="778" class="small">集合/Map 注入收集多 Bean，并按顺序排序</text>
  <rect x="872" y="820" width="330" height="56" class="gray"/>
  <text x="898" y="854" class="small">无候选、多个候选或懒加载代理会走不同错误/降级路径</text>

  <rect x="40" y="950" width="585" height="250" class="panel"/>
  <text x="68" y="986" class="panel-title">4. 容器边界</text>
  <rect x="82" y="1042" width="235" height="70" class="blue"/>
  <text x="112" y="1069" class="box-title">FactoryBean</text>
  <text x="104" y="1092" class="tiny">默认取产品，&amp;name 取工厂</text>
  <rect x="360" y="1042" width="225" height="70" class="green"/>
  <text x="392" y="1069" class="box-title">ObjectProvider</text>
  <text x="382" y="1092" class="tiny">延迟、可选、每次获取</text>
  <text x="82" y="1152" class="small">prototype 注入 singleton 只会装配一次；需要按请求获取时用</text>
  <text x="82" y="1178" class="small">Provider、ObjectFactory、@Lookup 或作用域代理。</text>

  <rect x="655" y="950" width="585" height="250" class="panel"/>
  <text x="683" y="986" class="panel-title">5. 回答抓手</text>
  <text x="692" y="1038" class="small">BeanDefinition 配方 -> BeanFactoryPostProcessor 改元数据</text>
  <text x="692" y="1064" class="small">-> getBean 创建 -> DependencyDescriptor 选候选</text>
  <text x="692" y="1090" class="small">-> BeanPostProcessor 接入初始化和 AOP -> 缓存/销毁。</text>
  <text x="692" y="1140" class="small">排查先问：BeanDefinition 有没有注册、条件是否生效、</text>
  <text x="692" y="1166" class="small">候选是否冲突、拿到原对象还是代理、作用域是否符合预期。</text>
</svg>
