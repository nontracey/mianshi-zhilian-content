<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1400" viewBox="0 0 1320 1400" role="img" aria-labelledby="title desc">
  <title id="title">JVM runtime data areas and HotSpot implementation boundaries</title>
  <desc id="desc">A topic-specific diagram explaining JVM runtime data areas: program counter, JVM stack, native method stack, heap, method area and runtime constant pool, plus HotSpot JDK 8+ boundaries for metaspace, heap class mirrors and static fields, StringTable, code cache, direct memory, and OOM triage paths.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1400"/>
  <text class="title" x="70" y="64">JVM 运行时数据区：规范区域与 HotSpot 实现边界</text>
  <text class="subtitle" x="70" y="96">先分线程私有/共享，再分 JVM 规范和 HotSpot JDK 8+ 的落地位置；OOM 排查先判断是哪一块。</text>

  <rect class="panel" x="70" y="130" width="1180" height="430" rx="16"/>
  <text class="section-title" x="96" y="166">1. JVM 规范中的运行时数据区</text>

  <rect class="panel" x="105" y="205" width="520" height="330" rx="14"/>
  <text class="section-title" x="130" y="240">线程私有：随线程创建和销毁</text>

  <rect class="blue" x="135" y="280" width="440" height="64" rx="12" stroke-width="2"/>
  <text class="box-title" x="162" y="310">程序计数器</text>
  <text class="text" x="300" y="310">当前线程字节码执行位置；native 方法时值可为空</text>

  <rect class="green" x="135" y="365" width="440" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="162" y="397">Java 虚拟机栈</text>
  <text class="text" x="300" y="393">栈帧：局部变量表、操作数栈、动态链接</text>
  <text class="text" x="300" y="417">返回地址；异常：StackOverflowError / OOME</text>

  <rect class="yellow" x="135" y="465" width="440" height="64" rx="12" stroke-width="2"/>
  <text class="box-title" x="162" y="496">本地方法栈</text>
  <text class="text" x="300" y="490">服务 native 方法</text>
  <text class="text" x="300" y="512">HotSpot 中不单独拆分为另一套结构</text>

  <rect class="panel" x="675" y="205" width="540" height="330" rx="14"/>
  <text class="section-title" x="700" y="240">线程共享：随 JVM 生命周期存在</text>

  <rect class="red" x="710" y="280" width="460" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="737" y="312">堆 Heap</text>
  <text class="text" x="865" y="312">对象实例和数组；GC 主要管理区域</text>
  <text class="text" x="865" y="334">分代/region 是具体收集器实现策略</text>

  <rect class="violet" x="710" y="395" width="460" height="92" rx="12" stroke-width="2"/>
  <text class="box-title" x="737" y="427">方法区 Method Area</text>
  <text class="text" x="910" y="423">规范概念：类结构、运行时常量池、字段/方法数据</text>
  <text class="text" x="910" y="447">HotSpot 旧实现是 PermGen；JDK 8+ 类元数据在 Metaspace</text>

  <rect class="panel" x="70" y="600" width="1180" height="305" rx="16"/>
  <text class="section-title" x="96" y="636">2. HotSpot JDK 8+ 常见落地位置</text>

  <rect class="violet" x="105" y="690" width="245" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="722">Metaspace</text>
  <text class="text" x="132" y="747">类元数据，使用本地内存</text>

  <rect class="red" x="400" y="690" width="245" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="427" y="722">Java Heap</text>
  <text class="text" x="427" y="747">Class 镜像、静态字段值、StringTable</text>

  <rect class="blue" x="695" y="690" width="245" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="722" y="722">Code Cache</text>
  <text class="text" x="722" y="747">JIT 编译后的机器码</text>

  <rect class="yellow" x="990" y="690" width="220" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1017" y="722">Direct Memory</text>
  <text class="text" x="1017" y="747">非运行时数据区；NIO/Netty 常见</text>

  <rect class="cyan" x="145" y="815" width="1030" height="50" rx="12" stroke-width="2"/>
  <text class="text" x="172" y="846">答题要区分：方法区是规范概念；永久代/元空间是 HotSpot 实现；字符串常量池和运行时常量池不是同一个东西。</text>

  <rect class="panel" x="70" y="945" width="1180" height="250" rx="16"/>
  <text class="section-title" x="96" y="981">3. OOM/错误先按区域分流</text>

  <rect class="red" x="105" y="1035" width="250" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="1067">Java heap space</text>
  <text class="text" x="132" y="1092">heap dump / MAT / GC Roots</text>

  <rect class="violet" x="405" y="1035" width="250" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="432" y="1067">Metaspace</text>
  <text class="text" x="432" y="1092">类加载数、ClassLoader 泄漏、动态代理</text>

  <rect class="green" x="705" y="1035" width="250" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="732" y="1067">StackOverflowError</text>
  <text class="text" x="732" y="1092">递归深度、线程栈大小、调用链</text>

  <rect class="yellow" x="1005" y="1035" width="205" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1032" y="1067">Direct buffer memory</text>
  <text class="text" x="1032" y="1092">NMT、直接内存、ByteBuffer/Netty</text>

  <text class="small" x="96" y="1308">面试抓手：五块区域、线程私有/共享、栈帧结构、方法区规范与 Metaspace 实现、StringTable 位置、Direct Memory 边界、按 OOM 类型选工具。</text>
</svg>
