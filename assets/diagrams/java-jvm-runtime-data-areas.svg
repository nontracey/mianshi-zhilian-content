<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1400" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1400"><title id="title">JVM runtime data areas and HotSpot implementation boundaries</title><desc id="desc">A topic-specific diagram explaining JVM runtime data areas: program counter, JVM stack, native method stack, heap, method area and runtime constant pool, plus HotSpot JDK 8+ boundaries for metaspace, heap class mirrors and static fields, StringTable, code cache, direct memory, and OOM triage paths.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 32px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}</style></defs><rect width="1320" height="1400" class="bg"/><text x="70" y="64" class="title">JVM 运行时数据区：规范区域与 HotSpot 实现边界</text><text x="70" y="96" class="subtitle">先分线程私有/共享，再分 JVM 规范和 HotSpot JDK 8+ 的落地位置；OOM 排查先判断是哪一块。</text><rect width="1180" height="430" x="70" y="130" class="panel" rx="16"/><text x="96" y="166" class="section-title">1. JVM 规范中的运行时数据区</text><rect width="520" height="330" x="105" y="205" class="panel" rx="14"/><text x="130" y="240" class="section-title">线程私有：随线程创建和销毁</text><rect width="440" height="64" x="135" y="280" stroke-width="2" class="blue" rx="12"/><text x="162" y="310" class="box-title">程序计数器</text><text x="300" y="310" class="text">当前线程字节码执行位置；native 方法时值可为空</text><rect width="440" height="82" x="135" y="365" stroke-width="2" class="green" rx="12"/><text x="162" y="397" class="box-title">Java 虚拟机栈</text><text x="300" y="393" class="text">栈帧：局部变量表、操作数栈、动态链接</text><text x="300" y="417" class="text">返回地址；异常：StackOverflowError / OOME</text><rect width="440" height="64" x="135" y="465" stroke-width="2" class="yellow" rx="12"/><text x="162" y="496" class="box-title">本地方法栈</text><text x="300" y="490" class="text">服务 native 方法</text><text x="300" y="512" class="text">HotSpot 中不单独拆分为另一套结构</text><rect width="540" height="330" x="675" y="205" class="panel" rx="14"/><text x="700" y="240" class="section-title">线程共享：随 JVM 生命周期存在</text><rect width="460" height="88" x="710" y="280" stroke-width="2" class="red" rx="12"/><text x="737" y="312" class="box-title">堆 Heap</text><text x="865" y="312" class="text">对象实例和数组；GC 主要管理区域</text><text x="865" y="334" class="text">分代/region 是具体收集器实现策略</text><rect width="460" height="92" x="710" y="395" stroke-width="2" class="violet" rx="12"/><text x="737" y="427" class="box-title">方法区 Method Area</text><text x="910" y="423" class="text">规范概念：类结构、运行时常量池、字段/方法数据</text><text x="910" y="447" class="text">HotSpot 旧实现是 PermGen；JDK 8+ 类元数据在 Metaspace</text><rect width="1180" height="305" x="70" y="600" class="panel" rx="16"/><text x="96" y="636" class="section-title">2. HotSpot JDK 8+ 常见落地位置</text><rect width="245" height="82" x="105" y="690" stroke-width="2" class="violet" rx="12"/><text x="132" y="722" class="box-title">Metaspace</text><text x="132" y="747" class="text">类元数据，使用本地内存</text><rect width="245" height="82" x="400" y="690" stroke-width="2" class="red" rx="12"/><text x="427" y="722" class="box-title">Java Heap</text><text x="427" y="747" class="text">Class 镜像、静态字段值、StringTable</text><rect width="245" height="82" x="695" y="690" stroke-width="2" class="blue" rx="12"/><text x="722" y="722" class="box-title">Code Cache</text><text x="722" y="747" class="text">JIT 编译后的机器码</text><rect width="220" height="82" x="990" y="690" stroke-width="2" class="yellow" rx="12"/><text x="1017" y="722" class="box-title">Direct Memory</text><text x="1017" y="747" class="text">非运行时数据区；NIO/Netty 常见</text><rect width="1030" height="50" x="145" y="815" stroke-width="2" class="cyan" rx="12"/><text x="172" y="846" class="text">答题要区分：方法区是规范概念；永久代/元空间是 HotSpot 实现；字符串常量池和运行时常量池不是同一个东西。</text><rect width="1180" height="250" x="70" y="945" class="panel" rx="16"/><text x="96" y="981" class="section-title">3. OOM/错误先按区域分流</text><rect width="250" height="82" x="105" y="1035" stroke-width="2" class="red" rx="12"/><text x="132" y="1067" class="box-title">Java heap space</text><text x="132" y="1092" class="text">heap dump / MAT / GC Roots</text><rect width="250" height="82" x="405" y="1035" stroke-width="2" class="violet" rx="12"/><text x="432" y="1067" class="box-title">Metaspace</text><text x="432" y="1092" class="text">类加载数、ClassLoader 泄漏、动态代理</text><rect width="250" height="82" x="705" y="1035" stroke-width="2" class="green" rx="12"/><text x="732" y="1067" class="box-title">StackOverflowError</text><text x="732" y="1092" class="text">递归深度、线程栈大小、调用链</text><rect width="205" height="82" x="1005" y="1035" stroke-width="2" class="yellow" rx="12"/><text x="1032" y="1067" class="box-title">Direct buffer memory</text><text x="1032" y="1092" class="text">NMT、直接内存、ByteBuffer/Netty</text><text x="96" y="1308" class="small">面试抓手：五块区域、线程私有/共享、栈帧结构、方法区规范与 Metaspace 实现、StringTable 位置、Direct Memory 边界、按 OOM 类型选工具。</text></svg>