<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1280"><title id="title">ThreadPoolExecutor 接纳路径与反压边界</title><desc id="desc">展示 ThreadPoolExecutor 从任务提交到核心线程、队列、非核心线程和拒绝策略的决策路径，以及队列选择、反压和虚拟线程边界。</desc><defs><marker id="arrow-blue" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#1f5f99" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#b24634" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f7fafc}.title{font:700 30px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#14213d}.subtitle{font:400 15px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.panel{fill:#fff;stroke:#d9e2ec;stroke-width:2;rx:16}.label{fill:#1f2933}.panel-title{font:700 20px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#1f2933}.label{font:700 16px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.small{font:400 14px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#334e68}.tiny{font:400 12px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.blue{fill:#e8f4ff;stroke:#6aa9df}.blue,.gray{stroke-width:2;rx:12}.green{fill:#e9f7ef;stroke:#58b77d}.green,.red,.yellow{stroke-width:2;rx:12}.yellow{fill:#fff5d6;stroke:#e0ae35}.red{fill:#fdecea;stroke:#cf5d4b}.gray{fill:#f1f5f9;stroke:#a7b5c4}.line,.line-red{stroke:#1f5f99;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.line-red{stroke:#b24634;marker-end:url(#arrow-red)}</style></defs><rect width="1280" height="1280" class="bg"/><text x="48" y="56" class="title">ThreadPoolExecutor：接纳路径与反压边界</text><text x="50" y="86" class="subtitle">线程池不是只复用线程，而是在核心线程、队列、最大线程和拒绝策略之间做容量决策。</text><rect width="1200" height="315" x="40" y="120" class="panel"/><text x="68" y="156" class="panel-title">1. execute 的任务接纳路径</text><rect width="135" height="70" x="70" y="208" class="blue"/><text x="106" y="236" class="label">提交任务</text><text x="96" y="260" class="tiny">execute</text><rect width="135" height="70" x="254" y="208" class="gray"/><text x="292" y="236" class="label">RUNNING</text><text x="286" y="260" class="tiny">接收新任务</text><rect width="150" height="70" x="438" y="208" class="green"/><text x="472" y="236" class="label">核心线程</text><text x="466" y="260" class="tiny">worker &lt; core</text><rect width="150" height="70" x="637" y="208" class="yellow"/><text x="676" y="236" class="label">任务队列</text><text x="664" y="260" class="tiny">offer 成功</text><rect width="150" height="70" x="836" y="208" class="green"/><text x="870" y="236" class="label">非核心线程</text><text x="868" y="260" class="tiny">队列满后扩容</text><rect width="150" height="70" x="1035" y="208" class="red"/><text x="1074" y="236" class="label">拒绝策略</text><text x="1068" y="260" class="tiny">池满且队列满</text><line x1="205" x2="254" y1="243" y2="243" class="line"/><line x1="389" x2="438" y1="243" y2="243" class="line"/><line x1="588" x2="637" y1="243" y2="243" class="line"/><line x1="787" x2="836" y1="243" y2="243" class="line-red"/><line x1="986" x2="1035" y1="243" y2="243" class="line-red"/><rect width="744" height="52" x="254" y="328" class="gray"/><text x="282" y="360" class="small">入队后还会二次检查运行状态，处理 shutdown 竞争和 worker 缺位。</text><rect width="585" height="300" x="40" y="475" class="panel"/><text x="68" y="511" class="panel-title">2. 队列选择改变 maximumPoolSize 的意义</text><rect width="150" height="72" x="78" y="558" class="yellow"/><text x="102" y="586" class="label">无界队列</text><text x="98" y="610" class="tiny">持续排队</text><rect width="150" height="72" x="278" y="558" class="red"/><text x="302" y="586" class="label">max 难生效</text><text x="300" y="610" class="tiny">延迟 / 内存风险</text><line x1="228" x2="278" y1="594" y2="594" class="line-red"/><rect width="150" height="72" x="78" y="662" class="green"/><text x="102" y="690" class="label">有界队列</text><text x="98" y="714" class="tiny">容量可观测</text><rect width="150" height="72" x="278" y="662" class="green"/><text x="310" y="690" class="label">扩容 / 拒绝</text><text x="304" y="714" class="tiny">边界清楚</text><line x1="228" x2="278" y1="698" y2="698" class="line"/><rect width="120" height="72" x="462" y="610" class="blue"/><text x="488" y="638" class="label">直接交接</text><text x="486" y="662" class="tiny">SynchronousQueue</text><line x1="428" x2="462" y1="698" y2="646" class="line"/><rect width="585" height="300" x="655" y="475" class="panel"/><text x="683" y="511" class="panel-title">3. 拒绝策略表达系统压力</text><rect width="142" height="72" x="692" y="558" class="red"/><text x="722" y="586" class="label">Abort</text><text x="710" y="610" class="tiny">调用方感知失败</text><rect width="142" height="72" x="878" y="558" class="green"/><text x="908" y="586" class="label">CallerRuns</text><text x="902" y="610" class="tiny">同步反压</text><rect width="142" height="72" x="1064" y="558" class="yellow"/><text x="1094" y="586" class="label">Discard</text><text x="1084" y="610" class="tiny">可丢任务</text><line x1="834" x2="878" y1="594" y2="594" class="line"/><line x1="1020" x2="1064" y1="594" y2="594" class="line-red"/><rect width="430" height="52" x="720" y="682" class="gray"/><text x="748" y="714" class="small">生产拒绝要有线程池名、队列长度、拒绝数和补偿路径。</text><rect width="1200" height="285" x="40" y="815" class="panel"/><text x="68" y="851" class="panel-title">4. 观测、异常与虚拟线程边界</text><rect width="168" height="72" x="78" y="902" class="blue"/><text x="124" y="930" class="label">execute</text><text x="100" y="954" class="tiny">异常到 handler</text><rect width="168" height="72" x="294" y="902" class="yellow"/><text x="342" y="930" class="label">submit</text><text x="318" y="954" class="tiny">异常藏在 Future</text><rect width="168" height="72" x="510" y="902" class="gray"/><text x="552" y="930" class="label">shutdown</text><text x="538" y="954" class="tiny">状态 + 中断语义</text><rect width="168" height="72" x="726" y="902" class="green"/><text x="760" y="930" class="label">metrics</text><text x="750" y="954" class="tiny">active / queue / reject</text><rect width="200" height="72" x="942" y="902" class="red"/><text x="986" y="930" class="label">虚拟线程</text><text x="968" y="954" class="tiny">阻塞 IO per-task</text><line x1="246" x2="294" y1="938" y2="938" class="line"/><line x1="462" x2="510" y1="938" y2="938" class="line"/><line x1="678" x2="726" y1="938" y2="938" class="line"/><line x1="894" x2="942" y1="938" y2="938" class="line-red"/><text x="82" y="1042" class="small">虚拟线程降低阻塞等待占用的平台线程成本，但不替代 CPU 并行度、连接池、下游限流和任务背压。</text><rect width="1200" height="76" x="40" y="1138" class="panel"/><text x="68" y="1172" class="panel-title">回答抓手</text><text x="190" y="1172" class="small">参数组合 -&gt; execute 决策 -&gt; 队列类型 -&gt; 拒绝反压 -&gt; 异常/关闭 -&gt; 指标压测 -&gt; 虚拟线程边界。</text></svg>