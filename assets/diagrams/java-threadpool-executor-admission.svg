<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">ThreadPoolExecutor 接纳路径与反压边界</title>
  <desc id="desc">展示 ThreadPoolExecutor 从任务提交到核心线程、队列、非核心线程和拒绝策略的决策路径，以及队列选择、反压和虚拟线程边界。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5f99"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b24634"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #14213d; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .label { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 14px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .code { font: 600 13px Menlo, Consolas, monospace; fill: #263238; }
      .blue { fill: #e8f4ff; stroke: #6aa9df; stroke-width: 2; rx: 12; }
      .green { fill: #e9f7ef; stroke: #58b77d; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff5d6; stroke: #e0ae35; stroke-width: 2; rx: 12; }
      .red { fill: #fdecea; stroke: #cf5d4b; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #a7b5c4; stroke-width: 2; rx: 12; }
      .line { stroke: #1f5f99; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #b24634; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #7b8794; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">ThreadPoolExecutor：接纳路径与反压边界</text>
  <text x="50" y="86" class="subtitle">线程池不是只复用线程，而是在核心线程、队列、最大线程和拒绝策略之间做容量决策。</text>

  <rect x="40" y="120" width="1200" height="315" class="panel"/>
  <text x="68" y="156" class="panel-title">1. execute 的任务接纳路径</text>
  <rect x="70" y="208" width="135" height="70" class="blue"/>
  <text x="106" y="236" class="label">提交任务</text>
  <text x="96" y="260" class="tiny">execute</text>
  <rect x="254" y="208" width="135" height="70" class="gray"/>
  <text x="292" y="236" class="label">RUNNING</text>
  <text x="286" y="260" class="tiny">接收新任务</text>
  <rect x="438" y="208" width="150" height="70" class="green"/>
  <text x="472" y="236" class="label">核心线程</text>
  <text x="466" y="260" class="tiny">worker &lt; core</text>
  <rect x="637" y="208" width="150" height="70" class="yellow"/>
  <text x="676" y="236" class="label">任务队列</text>
  <text x="664" y="260" class="tiny">offer 成功</text>
  <rect x="836" y="208" width="150" height="70" class="green"/>
  <text x="870" y="236" class="label">非核心线程</text>
  <text x="868" y="260" class="tiny">队列满后扩容</text>
  <rect x="1035" y="208" width="150" height="70" class="red"/>
  <text x="1074" y="236" class="label">拒绝策略</text>
  <text x="1068" y="260" class="tiny">池满且队列满</text>
  <line x1="205" y1="243" x2="254" y2="243" class="line"/>
  <line x1="389" y1="243" x2="438" y2="243" class="line"/>
  <line x1="588" y1="243" x2="637" y2="243" class="line"/>
  <line x1="787" y1="243" x2="836" y2="243" class="line-red"/>
  <line x1="986" y1="243" x2="1035" y2="243" class="line-red"/>
  <rect x="254" y="328" width="744" height="52" class="gray"/>
  <text x="282" y="360" class="small">入队后还会二次检查运行状态，处理 shutdown 竞争和 worker 缺位。</text>

  <rect x="40" y="475" width="585" height="300" class="panel"/>
  <text x="68" y="511" class="panel-title">2. 队列选择改变 maximumPoolSize 的意义</text>
  <rect x="78" y="558" width="150" height="72" class="yellow"/>
  <text x="102" y="586" class="label">无界队列</text>
  <text x="98" y="610" class="tiny">持续排队</text>
  <rect x="278" y="558" width="150" height="72" class="red"/>
  <text x="302" y="586" class="label">max 难生效</text>
  <text x="300" y="610" class="tiny">延迟 / 内存风险</text>
  <line x1="228" y1="594" x2="278" y2="594" class="line-red"/>
  <rect x="78" y="662" width="150" height="72" class="green"/>
  <text x="102" y="690" class="label">有界队列</text>
  <text x="98" y="714" class="tiny">容量可观测</text>
  <rect x="278" y="662" width="150" height="72" class="green"/>
  <text x="310" y="690" class="label">扩容 / 拒绝</text>
  <text x="304" y="714" class="tiny">边界清楚</text>
  <line x1="228" y1="698" x2="278" y2="698" class="line"/>
  <rect x="462" y="610" width="120" height="72" class="blue"/>
  <text x="488" y="638" class="label">直接交接</text>
  <text x="486" y="662" class="tiny">SynchronousQueue</text>
  <line x1="428" y1="698" x2="462" y2="646" class="line"/>

  <rect x="655" y="475" width="585" height="300" class="panel"/>
  <text x="683" y="511" class="panel-title">3. 拒绝策略表达系统压力</text>
  <rect x="692" y="558" width="142" height="72" class="red"/>
  <text x="722" y="586" class="label">Abort</text>
  <text x="710" y="610" class="tiny">调用方感知失败</text>
  <rect x="878" y="558" width="142" height="72" class="green"/>
  <text x="908" y="586" class="label">CallerRuns</text>
  <text x="902" y="610" class="tiny">同步反压</text>
  <rect x="1064" y="558" width="142" height="72" class="yellow"/>
  <text x="1094" y="586" class="label">Discard</text>
  <text x="1084" y="610" class="tiny">可丢任务</text>
  <line x1="834" y1="594" x2="878" y2="594" class="line"/>
  <line x1="1020" y1="594" x2="1064" y2="594" class="line-red"/>
  <rect x="720" y="682" width="430" height="52" class="gray"/>
  <text x="748" y="714" class="small">生产拒绝要有线程池名、队列长度、拒绝数和补偿路径。</text>

  <rect x="40" y="815" width="1200" height="285" class="panel"/>
  <text x="68" y="851" class="panel-title">4. 观测、异常与虚拟线程边界</text>
  <rect x="78" y="902" width="168" height="72" class="blue"/>
  <text x="124" y="930" class="label">execute</text>
  <text x="100" y="954" class="tiny">异常到 handler</text>
  <rect x="294" y="902" width="168" height="72" class="yellow"/>
  <text x="342" y="930" class="label">submit</text>
  <text x="318" y="954" class="tiny">异常藏在 Future</text>
  <rect x="510" y="902" width="168" height="72" class="gray"/>
  <text x="552" y="930" class="label">shutdown</text>
  <text x="538" y="954" class="tiny">状态 + 中断语义</text>
  <rect x="726" y="902" width="168" height="72" class="green"/>
  <text x="760" y="930" class="label">metrics</text>
  <text x="750" y="954" class="tiny">active / queue / reject</text>
  <rect x="942" y="902" width="200" height="72" class="red"/>
  <text x="986" y="930" class="label">虚拟线程</text>
  <text x="968" y="954" class="tiny">阻塞 IO per-task</text>
  <line x1="246" y1="938" x2="294" y2="938" class="line"/>
  <line x1="462" y1="938" x2="510" y2="938" class="line"/>
  <line x1="678" y1="938" x2="726" y2="938" class="line"/>
  <line x1="894" y1="938" x2="942" y2="938" class="line-red"/>
  <text x="82" y="1042" class="small">虚拟线程降低阻塞等待占用的平台线程成本，但不替代 CPU 并行度、连接池、下游限流和任务背压。</text>

  <rect x="40" y="1138" width="1200" height="76" class="panel"/>
  <text x="68" y="1172" class="panel-title">回答抓手</text>
  <text x="190" y="1172" class="small">参数组合 -> execute 决策 -> 队列类型 -> 拒绝反压 -> 异常/关闭 -> 指标压测 -> 虚拟线程边界。</text>
</svg>
