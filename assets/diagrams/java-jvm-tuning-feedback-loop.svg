<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" aria-labelledby="title desc" role="img" viewBox="0 0 1500 1500"><title id="title">JVM tuning feedback loop</title><desc id="desc">A topic-specific diagram explaining JVM tuning as an evidence-driven loop from SLO to observation, parameter families, diagnosis branches, validation, and rollback.</desc><defs><marker id="arrow" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 32px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.section{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1500" height="1500" class="bg"/><g transform="translate(70 0)"><text x="70" y="66" class="title">JVM 参数与调优：证据驱动的闭环</text><text x="70" y="98" class="subtitle">先定义 SLO，再采集证据，最后只改能解释现象的参数，并用相同负载验证。</text><rect width="1220" height="260" x="70" y="130" class="panel" rx="16"/><text x="96" y="168" class="section">1. 先把目标和边界钉住</text><rect width="230" height="70" x="105" y="220" stroke-width="2" class="blue" rx="12"/><text x="132" y="250" class="box-title">业务 SLO</text><text x="132" y="273" class="text">P99/P999、吞吐、错误率</text><path d="M340 255 H390" class="arrow"/><rect width="230" height="70" x="405" y="220" stroke-width="2" class="green" rx="12"/><text x="432" y="250" class="box-title">运行边界</text><text x="432" y="273" class="text">JDK、容器 limit、CPU 核数</text><path d="M640 255 H690" class="arrow"/><rect width="230" height="70" x="705" y="220" stroke-width="2" class="yellow" rx="12"/><text x="732" y="250" class="box-title">负载模型</text><text x="732" y="273" class="text">分配速率、峰值、批量大小</text><path d="M940 255 H990" class="arrow"/><rect width="220" height="70" x="1005" y="220" stroke-width="2" class="violet" rx="12"/><text x="1032" y="250" class="box-title">回滚条件</text><text x="1032" y="273" class="text">CPU/RSS/延迟恶化阈值</text><rect width="940" height="42" x="185" y="322" stroke-width="2" class="cyan" rx="12"/><text x="212" y="349" class="text">堆不是按固定比例拍脑袋设置；要给 direct memory、metaspace、线程栈、JIT code cache、page cache 和系统预留空间。</text><rect width="1220" height="260" x="70" y="430" class="panel" rx="16"/><text x="96" y="468" class="section">2. 采集证据，再决定参数</text><rect width="240" height="62" x="105" y="535" stroke-width="2" class="green" rx="12"/><text x="132" y="562" class="box-title">实际 flags</text><text x="132" y="585" class="mono">PrintCommandLineFlags</text><rect width="240" height="62" x="395" y="535" stroke-width="2" class="blue" rx="12"/><text x="422" y="562" class="box-title">GC 日志</text><text x="422" y="585" class="mono">-Xlog:gc*</text><rect width="240" height="62" x="685" y="535" stroke-width="2" class="yellow" rx="12"/><text x="712" y="562" class="box-title">诊断文件</text><text x="712" y="585" class="text">heap dump / thread dump / JFR</text><rect width="240" height="62" x="975" y="535" stroke-width="2" class="red" rx="12"/><text x="1002" y="562" class="box-title">系统指标</text><text x="1002" y="585" class="text">CPU、RSS、IO、容器 OOM</text><rect width="595" height="330" x="70" y="730" class="panel" rx="16"/><text x="96" y="768" class="section">3. 参数族，不是参数清单</text><rect width="230" height="72" x="105" y="830" stroke-width="2" class="blue" rx="12"/><text x="132" y="858" class="box-title">内存边界</text><text x="132" y="882" class="mono">Xms/Xmx, MaxRAMPercentage</text><rect width="230" height="72" x="385" y="830" stroke-width="2" class="green" rx="12"/><text x="412" y="858" class="box-title">收集器目标</text><text x="412" y="882" class="mono">UseG1GC, UseZGC, GCTimeRatio</text><rect width="230" height="72" x="105" y="930" stroke-width="2" class="yellow" rx="12"/><text x="132" y="958" class="box-title">诊断与失败</text><text x="132" y="982" class="mono">Xlog, HeapDump, ExitOnOOM</text><rect width="230" height="72" x="385" y="930" stroke-width="2" class="violet" rx="12"/><text x="412" y="958" class="box-title">非堆空间</text><text x="412" y="982" class="mono">Metaspace, DirectMemory, Xss</text><rect width="595" height="330" x="695" y="730" class="panel" rx="16"/><text x="721" y="768" class="section">4. 现象到假设</text><rect width="245" height="64" x="730" y="830" stroke-width="2" class="red" rx="12"/><text x="757" y="858" class="box-title">Full/Old GC 后不降</text><text x="757" y="881" class="text">查 live set、缓存、泄漏</text><rect width="245" height="64" x="1010" y="830" stroke-width="2" class="yellow" rx="12"/><text x="1037" y="858" class="box-title">Young GC 过频</text><text x="1037" y="881" class="text">看分配速率和存活率</text><rect width="245" height="64" x="730" y="930" stroke-width="2" class="blue" rx="12"/><text x="757" y="958" class="box-title">P99 停顿长</text><text x="757" y="981" class="text">看 GC 类型、阶段和目标</text><rect width="245" height="64" x="1010" y="930" stroke-width="2" class="green" rx="12"/><text x="1037" y="958" class="box-title">OOM</text><text x="1037" y="981" class="text">区分 heap/metaspace/direct/native</text><rect width="1220" height="305" x="70" y="1100" class="panel" rx="16"/><text x="96" y="1138" class="section">5. 验证和固化</text><rect width="250" height="70" x="105" y="1205" stroke-width="2" class="cyan" rx="12"/><text x="132" y="1234" class="box-title">一次改一个变量</text><text x="132" y="1257" class="text">记录参数、假设和预期变化</text><path d="M360 1240 H410" class="arrow"/><rect width="250" height="70" x="425" y="1205" stroke-width="2" class="yellow" rx="12"/><text x="452" y="1234" class="box-title">同样负载复测</text><text x="452" y="1257" class="text">P99、吞吐、GC pause、RSS</text><path d="M680 1240 H730" class="arrow"/><rect width="250" height="70" x="745" y="1205" stroke-width="2" class="green" rx="12"/><text x="772" y="1234" class="box-title">灰度与告警</text><text x="772" y="1257" class="text">保留回滚和观测窗口</text><path d="M1000 1240 H1050" class="arrow"/><rect width="170" height="70" x="1065" y="1205" stroke-width="2" class="red" rx="12"/><text x="1092" y="1234" class="box-title">回滚</text><text x="1092" y="1257" class="text">指标恶化就撤回</text><text x="96" y="1452" class="small">答题抓手：JVM 调优 = SLO + 证据 + 参数假设 + 同负载验证；没有前后指标对比的改参只是猜测。</text></g></svg>