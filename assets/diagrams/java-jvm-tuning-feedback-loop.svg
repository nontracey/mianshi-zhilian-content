<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500" role="img" aria-labelledby="title desc">
  <title id="title">JVM tuning feedback loop</title>
  <desc id="desc">A topic-specific diagram explaining JVM tuning as an evidence-driven loop from SLO to observation, parameter families, diagnosis branches, validation, and rollback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .gray { fill: #e5e7eb; stroke: #94a3b8; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1500" height="1500"/>
  <g transform="translate(70 0)">
    <text class="title" x="70" y="66">JVM 参数与调优：证据驱动的闭环</text>
    <text class="subtitle" x="70" y="98">先定义 SLO，再采集证据，最后只改能解释现象的参数，并用相同负载验证。</text>

    <rect class="panel" x="70" y="130" width="1220" height="260" rx="16"/>
    <text class="section" x="96" y="168">1. 先把目标和边界钉住</text>

    <rect class="blue" x="105" y="220" width="230" height="70" rx="12" stroke-width="2"/>
    <text class="box-title" x="132" y="250">业务 SLO</text>
    <text class="text" x="132" y="273">P99/P999、吞吐、错误率</text>

    <path class="arrow" d="M340 255 H390"/>

    <rect class="green" x="405" y="220" width="230" height="70" rx="12" stroke-width="2"/>
    <text class="box-title" x="432" y="250">运行边界</text>
    <text class="text" x="432" y="273">JDK、容器 limit、CPU 核数</text>

    <path class="arrow" d="M640 255 H690"/>

    <rect class="yellow" x="705" y="220" width="230" height="70" rx="12" stroke-width="2"/>
    <text class="box-title" x="732" y="250">负载模型</text>
    <text class="text" x="732" y="273">分配速率、峰值、批量大小</text>

    <path class="arrow" d="M940 255 H990"/>

    <rect class="violet" x="1005" y="220" width="220" height="70" rx="12" stroke-width="2"/>
    <text class="box-title" x="1032" y="250">回滚条件</text>
    <text class="text" x="1032" y="273">CPU/RSS/延迟恶化阈值</text>

    <rect class="cyan" x="185" y="322" width="940" height="42" rx="12" stroke-width="2"/>
    <text class="text" x="212" y="349">堆不是按固定比例拍脑袋设置；要给 direct memory、metaspace、线程栈、JIT code cache、page cache 和系统预留空间。</text>

    <rect class="panel" x="70" y="430" width="1220" height="260" rx="16"/>
    <text class="section" x="96" y="468">2. 采集证据，再决定参数</text>

    <rect class="green" x="105" y="535" width="240" height="62" rx="12" stroke-width="2"/>
    <text class="box-title" x="132" y="562">实际 flags</text>
    <text class="mono" x="132" y="585">PrintCommandLineFlags</text>

    <rect class="blue" x="395" y="535" width="240" height="62" rx="12" stroke-width="2"/>
    <text class="box-title" x="422" y="562">GC 日志</text>
    <text class="mono" x="422" y="585">-Xlog:gc*</text>

    <rect class="yellow" x="685" y="535" width="240" height="62" rx="12" stroke-width="2"/>
    <text class="box-title" x="712" y="562">诊断文件</text>
    <text class="text" x="712" y="585">heap dump / thread dump / JFR</text>

    <rect class="red" x="975" y="535" width="240" height="62" rx="12" stroke-width="2"/>
    <text class="box-title" x="1002" y="562">系统指标</text>
    <text class="text" x="1002" y="585">CPU、RSS、IO、容器 OOM</text>

    <rect class="panel" x="70" y="730" width="595" height="330" rx="16"/>
    <text class="section" x="96" y="768">3. 参数族，不是参数清单</text>

    <rect class="blue" x="105" y="830" width="230" height="72" rx="12" stroke-width="2"/>
    <text class="box-title" x="132" y="858">内存边界</text>
    <text class="mono" x="132" y="882">Xms/Xmx, MaxRAMPercentage</text>

    <rect class="green" x="385" y="830" width="230" height="72" rx="12" stroke-width="2"/>
    <text class="box-title" x="412" y="858">收集器目标</text>
    <text class="mono" x="412" y="882">UseG1GC, UseZGC, GCTimeRatio</text>

    <rect class="yellow" x="105" y="930" width="230" height="72" rx="12" stroke-width="2"/>
    <text class="box-title" x="132" y="958">诊断与失败</text>
    <text class="mono" x="132" y="982">Xlog, HeapDump, ExitOnOOM</text>

    <rect class="violet" x="385" y="930" width="230" height="72" rx="12" stroke-width="2"/>
    <text class="box-title" x="412" y="958">非堆空间</text>
    <text class="mono" x="412" y="982">Metaspace, DirectMemory, Xss</text>

    <rect class="panel" x="695" y="730" width="595" height="330" rx="16"/>
    <text class="section" x="721" y="768">4. 现象到假设</text>

    <rect class="red" x="730" y="830" width="245" height="64" rx="12" stroke-width="2"/>
    <text class="box-title" x="757" y="858">Full/Old GC 后不降</text>
    <text class="text" x="757" y="881">查 live set、缓存、泄漏</text>

    <rect class="yellow" x="1010" y="830" width="245" height="64" rx="12" stroke-width="2"/>
    <text class="box-title" x="1037" y="858">Young GC 过频</text>
    <text class="text" x="1037" y="881">看分配速率和存活率</text>

    <rect class="blue" x="730" y="930" width="245" height="64" rx="12" stroke-width="2"/>
    <text class="box-title" x="757" y="958">P99 停顿长</text>
    <text class="text" x="757" y="981">看 GC 类型、阶段和目标</text>

    <rect class="green" x="1010" y="930" width="245" height="64" rx="12" stroke-width="2"/>
    <text class="box-title" x="1037" y="958">OOM</text>
    <text class="text" x="1037" y="981">区分 heap/metaspace/direct/native</text>

    <rect class="panel" x="70" y="1100" width="1220" height="305" rx="16"/>
    <text class="section" x="96" y="1138">5. 验证和固化</text>

    <rect class="cyan" x="105" y="1205" width="250" height="70" rx="12" stroke-width="2"/>
    <text class="box-title" x="132" y="1234">一次改一个变量</text>
    <text class="text" x="132" y="1257">记录参数、假设和预期变化</text>

    <path class="arrow" d="M360 1240 H410"/>

    <rect class="yellow" x="425" y="1205" width="250" height="70" rx="12" stroke-width="2"/>
    <text class="box-title" x="452" y="1234">同样负载复测</text>
    <text class="text" x="452" y="1257">P99、吞吐、GC pause、RSS</text>

    <path class="arrow" d="M680 1240 H730"/>

    <rect class="green" x="745" y="1205" width="250" height="70" rx="12" stroke-width="2"/>
    <text class="box-title" x="772" y="1234">灰度与告警</text>
    <text class="text" x="772" y="1257">保留回滚和观测窗口</text>

    <path class="arrow" d="M1000 1240 H1050"/>

    <rect class="red" x="1065" y="1205" width="170" height="70" rx="12" stroke-width="2"/>
    <text class="box-title" x="1092" y="1234">回滚</text>
    <text class="text" x="1092" y="1257">指标恶化就撤回</text>

    <text class="small" x="96" y="1452">答题抓手：JVM 调优 = SLO + 证据 + 参数假设 + 同负载验证；没有前后指标对比的改参只是猜测。</text>
  </g>
</svg>
