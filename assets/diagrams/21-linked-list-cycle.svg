<svg viewBox="0 0 680 300" width="100%" role="img" aria-label="链表环检测示意图">
<title>链表环检测示意图</title><desc>Floyd快慢指针算法</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">链表环检测 (Floyd)</text>
<text x="340" y="44" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">快慢指针法: O(1)空间</text>
<circle cx="120" cy="100" r="22" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="120" y="101" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">1</text>
<line x1="142" y1="100" x2="198" y2="100" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<circle cx="220" cy="100" r="22" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="220" y="101" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">2</text>
<line x1="242" y1="100" x2="298" y2="100" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<circle cx="320" cy="100" r="22" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="320" y="101" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">3</text>
<line x1="342" y1="100" x2="398" y2="100" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<circle cx="420" cy="100" r="22" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="420" y="101" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">4</text>
<line x1="442" y1="100" x2="498" y2="100" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<circle cx="520" cy="100" r="22" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="520" y="101" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">5</text>
<path d="M542 100 Q580 100 580 140 Q580 180 340 180 Q300 180 300 140 Q300 128 300 100" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#a)"/>
<text x="440" y="190" text-anchor="middle" font-size="11" font-weight="400" fill="#A32D2D" font-family="system-ui, sans-serif">5 -&gt; 3 形成环</text>
<rect x="80" y="210" width="520" height="70" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="230" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">算法步骤</text>
<text x="340" y="250" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">slow每次走1步，fast每次走2步</text>
<text x="340" y="268" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">若有环，fast终会追上slow（相遇）</text>
<text x="340" y="286" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">找环入口: 一个从head出发，一个从相遇点出发，各走1步，再次相遇即入口</text>
</svg>