<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1280"><title id="title">Spring Bean 生命周期、代理与销毁边界</title><desc id="desc">展示 BeanDefinition 后处理、Bean 实例化、属性填充、Aware 回调、BeanPostProcessor、初始化回调、AOP 代理、单例发布和销毁回调顺序。</desc><defs><marker id="arrow-blue" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#b45309" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 30px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#172033}.subtitle{font:400 15px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.panel{fill:#fff;stroke:#d9e2ec;stroke-width:2;rx:16}.box-title{fill:#1f2933}.panel-title{font:700 20px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#1f2933}.box-title{font:700 16px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.small{font:400 13px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#334e68}.tiny{font:400 12px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.blue{fill:#e8f2ff;stroke:#60a5fa;stroke-width:2;rx:12}.green{fill:#e8f8ef;stroke:#4ade80}.gray,.green,.orange,.red,.yellow{stroke-width:2;rx:12}.yellow{fill:#fff7d6;stroke:#facc15}.orange{fill:#fff1e6;stroke:#fb923c}.red{fill:#feecec;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#94a3b8}.line,.line-red{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.line-red{stroke:#b45309;marker-end:url(#arrow-red)}</style></defs><rect width="1280" height="1280" class="bg"/><text x="48" y="56" class="title">Bean 生命周期：目标对象先完成初始化，再可能被代理发布</text><text x="50" y="86" class="subtitle">高质量回答要区分 BeanDefinition 阶段、目标对象生命周期、代理对象返回和容器关闭销毁。</text><rect width="1200" height="225" x="40" y="120" class="panel"/><text x="68" y="156" class="panel-title">0. BeanDefinition 阶段：还没有业务对象实例</text><rect width="180" height="66" x="82" y="210" class="blue"/><text x="116" y="236" class="box-title">扫描 / @Bean</text><text x="104" y="258" class="tiny">注册 BeanDefinition</text><rect width="210" height="66" x="330" y="210" class="yellow"/><text x="362" y="236" class="box-title">BeanFactoryPostProcessor</text><text x="354" y="258" class="tiny">改元数据、占位符、条件</text><rect width="210" height="66" x="608" y="210" class="green"/><text x="646" y="236" class="box-title">BeanPostProcessor</text><text x="632" y="258" class="tiny">先注册成基础设施 Bean</text><rect width="250" height="66" x="886" y="210" class="orange"/><text x="920" y="236" class="box-title">preInstantiateSingletons</text><text x="920" y="258" class="tiny">触发非懒单例创建</text><line x1="262" x2="330" y1="243" y2="243" class="line"/><line x1="540" x2="608" y1="243" y2="243" class="line"/><line x1="818" x2="886" y1="243" y2="243" class="line"/><text x="82" y="312" class="small">BeanFactoryPostProcessor 面向元数据；BeanPostProcessor 面向实例。把这两个扩展点混在一起，生命周期顺序就会说乱。</text><rect width="1200" height="415" x="40" y="385" class="panel"/><text x="68" y="421" class="panel-title">1. createBean：实例到可发布对象的主链路</text><rect width="150" height="64" x="78" y="485" class="blue"/><text x="108" y="511" class="box-title">实例化</text><text x="98" y="532" class="tiny">构造器/工厂方法</text><rect width="150" height="64" x="272" y="485" class="green"/><text x="304" y="511" class="box-title">属性填充</text><text x="292" y="532" class="tiny">依赖注入/配置值</text><rect width="150" height="64" x="466" y="485" class="gray"/><text x="506" y="511" class="box-title">Aware</text><text x="486" y="532" class="tiny">BeanName/Factory/Context</text><rect width="170" height="64" x="660" y="485" class="yellow"/><text x="696" y="511" class="box-title">BPP before</text><text x="684" y="532" class="tiny">初始化前扩展</text><rect width="170" height="64" x="874" y="485" class="orange"/><text x="914" y="511" class="box-title">init callbacks</text><text x="896" y="532" class="tiny">PostConstruct -&gt; after -&gt; init</text><line x1="228" x2="272" y1="517" y2="517" class="line"/><line x1="422" x2="466" y1="517" y2="517" class="line"/><line x1="616" x2="660" y1="517" y2="517" class="line"/><line x1="830" x2="874" y1="517" y2="517" class="line"/><rect width="190" height="64" x="184" y="640" class="yellow"/><text x="226" y="666" class="box-title">BPP after</text><text x="210" y="688" class="tiny">可包装目标对象</text><rect width="190" height="64" x="452" y="640" class="red"/><text x="494" y="666" class="box-title">AOP proxy</text><text x="474" y="688" class="tiny">返回给调用方</text><rect width="190" height="64" x="720" y="640" class="green"/><text x="760" y="666" class="box-title">singletonObjects</text><text x="744" y="688" class="tiny">发布可见性由容器保证</text><rect width="160" height="64" x="988" y="640" class="blue"/><text x="1028" y="666" class="box-title">业务使用</text><text x="1014" y="688" class="tiny">拿到的可能是代理</text><path d="M959,549 C959,612 279,598 279,640" class="line-red"/><line x1="374" x2="452" y1="672" y2="672" class="line"/><line x1="642" x2="720" y1="672" y2="672" class="line"/><line x1="910" x2="988" y1="672" y2="672" class="line"/><text x="78" y="758" class="small">Spring 文档强调：配置的初始化回调在目标 Bean 已注入依赖后执行，此时 AOP 拦截链还未应用到 init 方法。</text><rect width="585" height="285" x="40" y="840" class="panel"/><text x="68" y="876" class="panel-title">2. 销毁和关闭</text><rect width="220" height="64" x="82" y="935" class="green"/><text x="124" y="961" class="box-title">SmartLifecycle stop</text><text x="106" y="983" class="tiny">关闭前按 phase 停止</text><rect width="220" height="64" x="360" y="935" class="yellow"/><text x="408" y="961" class="box-title">@PreDestroy</text><text x="386" y="983" class="tiny">先于 DisposableBean</text><rect width="220" height="64" x="82" y="1038" class="orange"/><text x="122" y="1064" class="box-title">DisposableBean</text><text x="112" y="1086" class="tiny">destroy()</text><rect width="220" height="64" x="360" y="1038" class="red"/><text x="400" y="1064" class="box-title">destroyMethod</text><text x="388" y="1086" class="tiny">或推断 close/shutdown</text><rect width="585" height="285" x="655" y="840" class="panel"/><text x="683" y="876" class="panel-title">3. 边界和排查点</text><text x="692" y="936" class="small">prototype Bean 创建后交给调用方，容器不会自动执行销毁回调。</text><text x="692" y="974" class="small">@PostConstruct 位于 singleton 创建锁内，只做校验和轻量准备；</text><text x="692" y="1000" class="small">重任务放到 SmartInitializingSingleton 或 ContextRefreshedEvent。</text><text x="692" y="1042" class="small">循环依赖、FactoryBean、early proxy、事务代理都会影响“拿到谁”。</text><text x="692" y="1080" class="small">排查先看 BeanDefinition、作用域、BPP 顺序、init 异常和代理类型。</text><rect width="1200" height="64" x="40" y="1170" class="panel"/><text x="68" y="1207" class="panel-title">回答抓手</text><text x="190" y="1207" class="small">BeanDefinition -&gt; BFPP -&gt; 实例化 -&gt; 属性填充 -&gt; Aware -&gt; BPP before -&gt; PostConstruct/afterPropertiesSet/init -&gt; BPP after/AOP -&gt; 缓存发布 -&gt; stop/destroy。</text></svg>