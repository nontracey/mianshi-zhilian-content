<svg xmlns="http://www.w3.org/2000/svg" width="100%" aria-label="Go 内存分配器与 GC" role="img" viewBox="0 0 780 420"><title>Go 内存分配（mcache/mcentral/mheap）与三色并发 GC</title><desc>对象按大小分类，小对象走每-P 的 mcache 无锁分配，不够再向 mcentral、mheap 取 span；GC 用三色标记 + 写屏障并发清扫。</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="390" y="26" fill="#042C53" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">分配：按对象大小分级，逐层向上要内存</text><rect width="150" height="150" x="24" y="48" fill="#E6F1FB" stroke="#378ADD" stroke-width=".6" rx="9"/><text x="99" y="68" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">对象按大小分类</text><text x="36" y="92" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="11">tiny &lt;16B 无指针</text><text x="36" y="116" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="11">small ≤32KB</text><text x="36" y="140" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="11">（67 个 size class）</text><text x="36" y="170" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="11">large &gt;32KB</text><text x="36" y="186" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11">直接找 mheap</text><rect width="150" height="86" x="216" y="48" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".6" rx="9"/><text x="291" y="70" fill="#04342C" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">mcache（每 P）</text><text x="291" y="92" fill="#04342C" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">无锁，命中即返回</text><text x="291" y="112" fill="#04342C" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">持各 class 的 mspan</text><rect width="150" height="86" x="408" y="48" fill="#FEF3E2" stroke="#BA7517" stroke-width=".6" rx="9"/><text x="483" y="70" fill="#7A4D0E" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">mcentral（每 class）</text><text x="483" y="92" fill="#7A4D0E" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">有锁；mcache 空了</text><text x="483" y="112" fill="#7A4D0E" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">来这里补 span</text><rect width="156" height="86" x="600" y="48" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".6" rx="9"/><text x="678" y="70" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">mheap</text><text x="678" y="92" fill="#444441" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">全局堆，管 mspan</text><text x="678" y="112" fill="#444441" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">不够向 OS 要 arena</text><line x1="174" x2="214" y1="91" y2="91" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#a)"/><line x1="366" x2="406" y1="91" y2="91" stroke="#BA7517" stroke-width="1.4" marker-end="url(#a)"/><line x1="558" x2="598" y1="91" y2="91" stroke="#B4B2A9" stroke-width="1.4" marker-end="url(#a)"/><text x="678" y="170" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">逃逸分析决定栈/堆</text><rect width="732" height="172" x="24" y="226" fill="#FBFAF5" stroke="#B4B2A9" stroke-width=".5" rx="10"/><text x="40" y="250" fill="#042C53" font-family="system-ui, sans-serif" font-size="14" font-weight="600">回收：三色标记 + 写屏障，与业务并发（STW 仅在开关标记瞬间）</text><g font-family="system-ui, sans-serif"><circle cx="120" cy="312" r="26" fill="#fff" stroke="#5F5E5A" stroke-width="1.2"/><text x="120" y="316" fill="#2C2C2A" font-size="12" text-anchor="middle">白</text><text x="120" y="356" fill="#5F5E5A" font-size="10.5" text-anchor="middle">未访问→回收</text><circle cx="300" cy="312" r="26" fill="#D9D7CE" stroke="#5F5E5A" stroke-width="1.2"/><text x="300" y="316" fill="#2C2C2A" font-size="12" text-anchor="middle">灰</text><text x="300" y="356" fill="#5F5E5A" font-size="10.5" text-anchor="middle">已发现待扫子节点</text><circle cx="480" cy="312" r="26" fill="#1D9E75" stroke="#04342C" stroke-width="1.2"/><text x="480" y="316" fill="#fff" font-size="12" text-anchor="middle">黑</text><text x="480" y="356" fill="#5F5E5A" font-size="10.5" text-anchor="middle">存活，扫描完毕</text></g><line x1="148" x2="272" y1="306" y2="306" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><line x1="328" x2="452" y1="306" y2="306" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/><text x="560" y="300" fill="#444441" font-family="system-ui, sans-serif" font-size="11">写屏障保证并发中</text><text x="560" y="318" fill="#444441" font-family="system-ui, sans-serif" font-size="11">&quot;黑→白&quot;新引用不漏标</text><text x="560" y="344" fill="#7A4D0E" font-family="system-ui, sans-serif" font-size="11">GOGC/GOMEMLIMIT 控触发节奏</text></svg>