<svg viewBox="0 0 780 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Go 内存分配器与 GC">
<title>Go 内存分配（mcache/mcentral/mheap）与三色并发 GC</title><desc>对象按大小分类，小对象走每-P 的 mcache 无锁分配，不够再向 mcentral、mheap 取 span；GC 用三色标记 + 写屏障并发清扫。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="390" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">分配：按对象大小分级，逐层向上要内存</text>
<rect x="24" y="48" width="150" height="150" rx="9" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.6"/>
<text x="99" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">对象按大小分类</text>
<text x="36" y="92" font-size="11" fill="#2C2C2A" font-family="system-ui, sans-serif">tiny  &lt;16B 无指针</text>
<text x="36" y="92" font-size="11" fill="#2C2C2A" font-family="system-ui, sans-serif"></text>
<text x="36" y="116" font-size="11" fill="#2C2C2A" font-family="system-ui, sans-serif">small ≤32KB</text>
<text x="36" y="140" font-size="11" fill="#2C2C2A" font-family="system-ui, sans-serif">（67 个 size class）</text>
<text x="36" y="170" font-size="11" fill="#2C2C2A" font-family="system-ui, sans-serif">large &gt;32KB</text>
<text x="36" y="186" font-size="11" fill="#5F5E5A" font-family="system-ui, sans-serif">直接找 mheap</text>
<rect x="216" y="48" width="150" height="86" rx="9" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.6"/>
<text x="291" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C" font-family="system-ui, sans-serif">mcache（每 P）</text>
<text x="291" y="92" text-anchor="middle" font-size="11" fill="#04342C" font-family="system-ui, sans-serif">无锁，命中即返回</text>
<text x="291" y="112" text-anchor="middle" font-size="11" fill="#04342C" font-family="system-ui, sans-serif">持各 class 的 mspan</text>
<rect x="408" y="48" width="150" height="86" rx="9" fill="#FEF3E2" stroke="#BA7517" stroke-width="0.6"/>
<text x="483" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="#7A4D0E" font-family="system-ui, sans-serif">mcentral（每 class）</text>
<text x="483" y="92" text-anchor="middle" font-size="11" fill="#7A4D0E" font-family="system-ui, sans-serif">有锁；mcache 空了</text>
<text x="483" y="112" text-anchor="middle" font-size="11" fill="#7A4D0E" font-family="system-ui, sans-serif">来这里补 span</text>
<rect x="600" y="48" width="156" height="86" rx="9" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.6"/>
<text x="678" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="#2C2C2A" font-family="system-ui, sans-serif">mheap</text>
<text x="678" y="92" text-anchor="middle" font-size="11" fill="#444441" font-family="system-ui, sans-serif">全局堆，管 mspan</text>
<text x="678" y="112" text-anchor="middle" font-size="11" fill="#444441" font-family="system-ui, sans-serif">不够向 OS 要 arena</text>
<line x1="174" y1="91" x2="214" y2="91" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="366" y1="91" x2="406" y2="91" stroke="#BA7517" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="558" y1="91" x2="598" y2="91" stroke="#B4B2A9" stroke-width="1.4" marker-end="url(#a)"/>
<text x="678" y="170" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="system-ui, sans-serif">逃逸分析决定栈/堆</text>
<!-- GC -->
<rect x="24" y="226" width="732" height="172" rx="10" fill="#FBFAF5" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="40" y="250" font-size="14" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">回收：三色标记 + 写屏障，与业务并发（STW 仅在开关标记瞬间）</text>
<g font-family="system-ui, sans-serif">
<circle cx="120" cy="312" r="26" fill="#fff" stroke="#5F5E5A" stroke-width="1.2"/><text x="120" y="316" text-anchor="middle" font-size="12" fill="#2C2C2A">白</text><text x="120" y="356" text-anchor="middle" font-size="10.5" fill="#5F5E5A">未访问→回收</text>
<circle cx="300" cy="312" r="26" fill="#D9D7CE" stroke="#5F5E5A" stroke-width="1.2"/><text x="300" y="316" text-anchor="middle" font-size="12" fill="#2C2C2A">灰</text><text x="300" y="356" text-anchor="middle" font-size="10.5" fill="#5F5E5A">已发现待扫子节点</text>
<circle cx="480" cy="312" r="26" fill="#1D9E75" stroke="#04342C" stroke-width="1.2"/><text x="480" y="316" text-anchor="middle" font-size="12" fill="#fff">黑</text><text x="480" y="356" text-anchor="middle" font-size="10.5" fill="#5F5E5A">存活，扫描完毕</text>
</g>
<line x1="148" y1="306" x2="272" y2="306" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="328" y1="306" x2="452" y2="306" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<text x="560" y="300" font-size="11" fill="#444441" font-family="system-ui, sans-serif">写屏障保证并发中</text>
<text x="560" y="318" font-size="11" fill="#444441" font-family="system-ui, sans-serif">"黑→白"新引用不漏标</text>
<text x="560" y="344" font-size="11" fill="#7A4D0E" font-family="system-ui, sans-serif">GOGC/GOMEMLIMIT 控触发节奏</text>
</svg>
