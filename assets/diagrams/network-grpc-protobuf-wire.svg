<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">Protobuf wire format and gRPC over HTTP/2 message layout</title>
  <desc id="desc">Diagram explaining Protobuf field key, wire types, varint encoding, gRPC 5 byte message prefix, HTTP/2 headers, DATA frames and trailers.</desc>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#64748b" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 18; filter: url(#shadow); }
      .proto { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 12; }
      .grpc { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 12; }
      .h2 { fill: #fdf4ff; stroke: #c026d3; stroke-width: 1.5; rx: 12; }
      .warn { fill: #fff7ed; stroke: #f97316; stroke-width: 1.4; rx: 12; }
      .query { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#blue); }
      .title { fill: #0f172a; font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section { fill: #0f172a; font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #334155; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { fill: #475569; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #334155; font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .caption { fill: #475569; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="58" y="52" class="title">gRPC 与 Protobuf：从字段字节到 HTTP/2 stream</text>
  <text x="58" y="84" class="caption">Protobuf 负责对象到字节；gRPC 加 5 字节消息前缀；HTTP/2 提供 stream、headers、DATA 和 trailers。</text>

  <rect x="48" y="120" width="1184" height="300" class="panel"/>
  <text x="76" y="160" class="section">1. Protobuf 字段：key 是 tag，wire type 决定 value 怎么读</text>
  <rect x="76" y="194" width="260" height="82" class="proto"/>
  <text x="100" y="224" class="small">字段 key</text>
  <text x="100" y="248" class="mono">(field_number &lt;&lt; 3) | wire_type</text>
  <rect x="376" y="194" width="190" height="82" class="proto"/>
  <text x="400" y="224" class="small">varint</text>
  <text x="400" y="248" class="tiny">wire type 0</text>
  <text x="400" y="266" class="tiny">小整数少字节</text>
  <rect x="606" y="194" width="220" height="82" class="proto"/>
  <text x="630" y="224" class="small">length-delimited</text>
  <text x="630" y="248" class="tiny">wire type 2</text>
  <text x="630" y="266" class="tiny">string/bytes/message/packed</text>
  <rect x="866" y="194" width="150" height="82" class="proto"/>
  <text x="890" y="224" class="small">fixed32</text>
  <text x="890" y="248" class="tiny">wire type 5</text>
  <rect x="1056" y="194" width="150" height="82" class="proto"/>
  <text x="1080" y="224" class="small">fixed64</text>
  <text x="1080" y="248" class="tiny">wire type 1</text>

  <path class="query" d="M336 235 L376 235"/>
  <path class="query" d="M566 235 L606 235"/>
  <path class="query" d="M826 235 L866 235"/>
  <path class="query" d="M1016 235 L1056 235"/>

  <rect x="76" y="310" width="530" height="70" class="warn"/>
  <text x="100" y="338" class="small">注意：不是所有字段都有 Length</text>
  <text x="100" y="362" class="tiny">只有 wire type 2 才是 key + length + bytes；varint/fixed 是 key + raw value。</text>
  <rect x="650" y="310" width="556" height="70" class="warn"/>
  <text x="674" y="338" class="small">兼容性靠 tag 稳定</text>
  <text x="674" y="362" class="tiny">删字段要 reserved tag/name；字段名和顺序不进入线上字节流。</text>

  <rect x="48" y="470" width="1184" height="276" class="panel"/>
  <text x="76" y="510" class="section">2. gRPC message：每条 Protobuf 消息前面有 5 字节前缀</text>
  <rect x="96" y="560" width="150" height="78" class="grpc"/>
  <text x="120" y="590" class="small">1 byte</text>
  <text x="120" y="614" class="tiny">compressed flag</text>
  <rect x="246" y="560" width="280" height="78" class="grpc"/>
  <text x="270" y="590" class="small">4 bytes</text>
  <text x="270" y="614" class="tiny">message length, big-endian</text>
  <rect x="526" y="560" width="610" height="78" class="grpc"/>
  <text x="550" y="590" class="small">Protobuf body</text>
  <text x="550" y="614" class="tiny">一条逻辑消息可跨多个 DATA frame；一个 DATA frame 也可承载多条消息。</text>
  <text x="96" y="690" class="caption">压缩标志不代表一定压缩；是否压缩还要看 grpc-encoding / grpc-accept-encoding 和实现配置。</text>

  <rect x="48" y="796" width="1184" height="276" class="panel"/>
  <text x="76" y="836" class="section">3. HTTP/2 承载：HEADERS 建流，DATA 传消息，trailers 表达业务状态</text>
  <rect x="76" y="886" width="310" height="92" class="h2"/>
  <text x="100" y="916" class="small">HEADERS</text>
  <text x="100" y="940" class="mono">:method POST</text>
  <text x="100" y="960" class="mono">:path /pkg.Service/Method</text>
  <rect x="446" y="886" width="300" height="92" class="h2"/>
  <text x="470" y="916" class="small">DATA</text>
  <text x="470" y="940" class="tiny">5B prefix + protobuf body</text>
  <text x="470" y="960" class="tiny">streaming = 多条 message</text>
  <rect x="806" y="886" width="330" height="92" class="h2"/>
  <text x="830" y="916" class="small">trailers</text>
  <text x="830" y="940" class="mono">grpc-status: 0</text>
  <text x="830" y="960" class="mono">grpc-message: ...</text>
  <path class="query" d="M386 932 L446 932"/>
  <path class="query" d="M746 932 L806 932"/>

  <rect x="76" y="1012" width="330" height="40" class="warn"/>
  <text x="100" y="1037" class="tiny">deadline：grpc-timeout 随调用链传递，避免下游无限挂起。</text>
  <rect x="474" y="1012" width="330" height="54" class="warn"/>
  <text x="498" y="1034" class="tiny">四种模式：Unary / Server stream</text>
  <text x="498" y="1052" class="tiny">Client stream / Bidi。</text>
  <rect x="872" y="1012" width="330" height="54" class="warn"/>
  <text x="896" y="1034" class="tiny">浏览器：标准 gRPC 通常要</text>
  <text x="896" y="1052" class="tiny">gRPC-Web 代理适配 trailers/streaming。</text>

  <rect x="48" y="1118" width="1184" height="86" class="panel"/>
  <text x="76" y="1152" class="section">高频误区</text>
  <text x="76" y="1184" class="small">int32 负数通常占 10 字节，频繁正负值用 sint32/sint64 + zigzag；proto3 非 optional 标量默认值没有 presence。</text>
</svg>
