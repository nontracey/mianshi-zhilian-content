<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">并发设计模式：固定流程、策略、发布与事件边界</title>
  <desc id="desc">展示 AQS 固定流程、线程池拒绝策略、单例安全发布和事件监听的同步异步边界。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5f99"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b24634"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #14213d; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .label { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 14px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .code { font: 600 13px Menlo, Consolas, monospace; fill: #263238; }
      .blue { fill: #e8f4ff; stroke: #6aa9df; stroke-width: 2; rx: 12; }
      .green { fill: #e9f7ef; stroke: #58b77d; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff5d6; stroke: #e0ae35; stroke-width: 2; rx: 12; }
      .red { fill: #fdecea; stroke: #cf5d4b; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #a7b5c4; stroke-width: 2; rx: 12; }
      .line { stroke: #1f5f99; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #b24634; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #7b8794; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">并发设计模式：名称背后是状态边界</text>
  <text x="50" y="86" class="subtitle">回答时把固定流程、变化点、执行线程和失败路径讲清，比背模式名更重要。</text>

  <rect x="40" y="120" width="1200" height="265" class="panel"/>
  <text x="68" y="156" class="panel-title">1. AQS：固定同步骨架，子类定义 state</text>
  <rect x="82" y="210" width="162" height="70" class="blue"/>
  <text x="124" y="238" class="label">acquire</text>
  <text x="112" y="262" class="tiny">固定入口流程</text>
  <rect x="306" y="210" width="162" height="70" class="yellow"/>
  <text x="340" y="238" class="label">tryAcquire</text>
  <text x="332" y="262" class="tiny">子类钩子</text>
  <rect x="530" y="210" width="162" height="70" class="green"/>
  <text x="572" y="238" class="label">state</text>
  <text x="552" y="262" class="tiny">重入 / 许可 / 计数</text>
  <rect x="754" y="210" width="162" height="70" class="red"/>
  <text x="792" y="238" class="label">CLH 队列</text>
  <text x="786" y="262" class="tiny">失败后等待</text>
  <rect x="978" y="210" width="162" height="70" class="blue"/>
  <text x="1018" y="238" class="label">release</text>
  <text x="1014" y="262" class="tiny">唤醒后继</text>
  <line x1="244" y1="245" x2="306" y2="245" class="line"/>
  <line x1="468" y1="245" x2="530" y2="245" class="line"/>
  <line x1="692" y1="245" x2="754" y2="245" class="line-red"/>
  <line x1="916" y1="245" x2="978" y2="245" class="line"/>
  <text x="86" y="335" class="small">钩子方法写错会破坏整个同步器：非法释放、唤醒丢失、共享传播失败。</text>

  <rect x="40" y="425" width="585" height="310" class="panel"/>
  <text x="68" y="461" class="panel-title">2. 线程池 Strategy：满载后的业务契约</text>
  <rect x="78" y="520" width="145" height="68" class="red"/>
  <text x="114" y="548" class="label">Abort</text>
  <text x="102" y="570" class="tiny">明确失败</text>
  <rect x="278" y="520" width="145" height="68" class="green"/>
  <text x="308" y="548" class="label">CallerRuns</text>
  <text x="312" y="570" class="tiny">入口反压</text>
  <rect x="478" y="520" width="108" height="68" class="yellow"/>
  <text x="506" y="548" class="label">Discard</text>
  <text x="498" y="570" class="tiny">可丢任务</text>
  <line x1="223" y1="554" x2="278" y2="554" class="line"/>
  <line x1="423" y1="554" x2="478" y2="554" class="line-red"/>
  <rect x="78" y="644" width="508" height="50" class="gray"/>
  <text x="104" y="675" class="small">策略选择要回答：能否丢、是否幂等、如何告警、是否补偿。</text>

  <rect x="655" y="425" width="585" height="310" class="panel"/>
  <text x="683" y="461" class="panel-title">3. Singleton：唯一实例与安全发布</text>
  <rect x="692" y="520" width="145" height="68" class="green"/>
  <text x="730" y="548" class="label">enum</text>
  <text x="714" y="570" class="tiny">类初始化保障</text>
  <rect x="878" y="520" width="145" height="68" class="blue"/>
  <text x="904" y="548" class="label">static holder</text>
  <text x="900" y="570" class="tiny">懒加载</text>
  <rect x="1064" y="520" width="145" height="68" class="yellow"/>
  <text x="1102" y="548" class="label">DCL</text>
  <text x="1088" y="570" class="tiny">volatile 发布</text>
  <line x1="837" y1="554" x2="878" y2="554" class="line"/>
  <line x1="1023" y1="554" x2="1064" y2="554" class="line"/>
  <rect x="692" y="644" width="514" height="50" class="red"/>
  <text x="720" y="675" class="small">DCL 要防半初始化可见，也要防构造期间 this 逃逸。</text>

  <rect x="40" y="775" width="1200" height="300" class="panel"/>
  <text x="68" y="811" class="panel-title">4. Observer / Pub-Sub：执行线程改变后，失败语义也改变</text>
  <rect x="86" y="870" width="160" height="70" class="blue"/>
  <text x="124" y="898" class="label">发布事件</text>
  <text x="114" y="922" class="tiny">不可变事件对象</text>
  <rect x="318" y="870" width="160" height="70" class="green"/>
  <text x="356" y="898" class="label">同步监听</text>
  <text x="350" y="922" class="tiny">事务和耗时</text>
  <rect x="550" y="870" width="160" height="70" class="yellow"/>
  <text x="588" y="898" class="label">异步监听</text>
  <text x="582" y="922" class="tiny">线程池 / 队列</text>
  <rect x="782" y="870" width="160" height="70" class="red"/>
  <text x="820" y="898" class="label">失败重试</text>
  <text x="812" y="922" class="tiny">幂等 / 死信</text>
  <rect x="1014" y="870" width="160" height="70" class="gray"/>
  <text x="1052" y="898" class="label">顺序上下文</text>
  <text x="1040" y="922" class="tiny">traceId / tenant</text>
  <line x1="246" y1="905" x2="318" y2="905" class="line"/>
  <line x1="478" y1="905" x2="550" y2="905" class="line"/>
  <line x1="710" y1="905" x2="782" y2="905" class="line-red"/>
  <line x1="942" y1="905" x2="1014" y2="905" class="line"/>
  <text x="88" y="1012" class="small">同步转异步不是只换执行器，还要补事务提交点、重试、幂等、顺序和上下文传播。</text>

  <rect x="40" y="1125" width="1200" height="90" class="panel"/>
  <text x="68" y="1160" class="panel-title">回答抓手</text>
  <text x="190" y="1160" class="small">模式名称 -> 固定流程 -> 变化点 -> 保护状态 -> 执行线程 -> 失败路径 -> 失效条件。</text>
</svg>
