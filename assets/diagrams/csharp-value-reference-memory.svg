<svg viewBox="0 0 780 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="C# 值类型与引用类型内存布局">
<title>C# 值类型 vs 引用类型的栈/堆布局与装箱</title><desc>值类型(struct)内联存放、赋值整体拷贝；引用类型(class)在堆上、变量持引用；装箱把值类型搬到堆并产生拷贝。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="390" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">struct 值内联拷贝；class 引用指向堆对象（由 GC 管理）</text>
<!-- stack -->
<rect x="40" y="56" width="300" height="320" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.6"/>
<text x="190" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">栈 / 内联（线程局部，自动回收）</text>
<rect x="64" y="98" width="252" height="56" rx="6" fill="#fff" stroke="#1D9E75" stroke-width="0.7"/>
<text x="76" y="120" font-size="11.5" fill="#04342C" font-family="ui-monospace, monospace">int a = 5；Point p = (3,4)</text>
<text x="76" y="142" font-size="11" fill="#04342C" font-family="system-ui, sans-serif">值类型：数据就在这里，赋值整体拷贝</text>
<rect x="64" y="168" width="252" height="44" rx="6" fill="#fff" stroke="#378ADD" stroke-width="0.7"/>
<text x="76" y="190" font-size="11.5" fill="#042C53" font-family="ui-monospace, monospace">string s；Order o = new()</text>
<text x="76" y="206" font-size="11" fill="#042C53" font-family="system-ui, sans-serif">引用类型：这里只放"引用(地址)"</text>
<rect x="64" y="230" width="252" height="44" rx="6" fill="#fff" stroke="#BA7517" stroke-width="0.7"/>
<text x="76" y="252" font-size="11.5" fill="#7A4D0E" font-family="ui-monospace, monospace">object boxed = a;</text>
<text x="76" y="268" font-size="11" fill="#7A4D0E" font-family="system-ui, sans-serif">装箱：引用，指向堆上的副本</text>
<text x="190" y="306" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="system-ui, sans-serif">值类型赋值/传参 = 拷贝整个值</text>
<text x="190" y="326" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="system-ui, sans-serif">改副本不影响原值</text>
<text x="190" y="352" text-anchor="middle" font-size="11" fill="#C0392B" font-family="system-ui, sans-serif">大 struct 频繁拷贝有成本 → in/ref</text>
<!-- heap -->
<rect x="440" y="56" width="300" height="320" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.6"/>
<text x="590" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C" font-family="system-ui, sans-serif">托管堆（GC 回收，分代）</text>
<rect x="470" y="100" width="240" height="58" rx="8" fill="#fff" stroke="#378ADD" stroke-width="0.7"/>
<text x="590" y="122" text-anchor="middle" font-size="11.5" fill="#042C53" font-family="ui-monospace, monospace">Order { Id=1, Items=… }</text>
<text x="590" y="144" text-anchor="middle" font-size="11" fill="#444441" font-family="system-ui, sans-serif">对象头 + 字段，class 实例</text>
<rect x="470" y="174" width="240" height="44" rx="8" fill="#fff" stroke="#378ADD" stroke-width="0.7"/>
<text x="590" y="196" text-anchor="middle" font-size="11.5" fill="#042C53" font-family="ui-monospace, monospace">"hello"  (string 对象)</text>
<rect x="470" y="234" width="240" height="44" rx="8" fill="#FEF3E2" stroke="#BA7517" stroke-width="0.7"/>
<text x="590" y="256" text-anchor="middle" font-size="11.5" fill="#7A4D0E" font-family="ui-monospace, monospace">boxed: [ 5 ]  装箱副本</text>
<text x="590" y="306" text-anchor="middle" font-size="11" fill="#04342C" font-family="system-ui, sans-serif">两个引用指向同一对象 → 改一个全改</text>
<text x="590" y="328" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="system-ui, sans-serif">不可达即可被 GC 回收</text>
<text x="590" y="354" text-anchor="middle" font-size="11" fill="#C0392B" font-family="system-ui, sans-serif">装箱/拆箱有分配与拷贝开销，热路径慎用</text>
<line x1="316" y1="190" x2="468" y2="129" stroke="#378ADD" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="316" y1="252" x2="468" y2="256" stroke="#BA7517" stroke-width="1.4" marker-end="url(#a)"/>
</svg>
