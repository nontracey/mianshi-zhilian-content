<svg xmlns="http://www.w3.org/2000/svg" width="100%" aria-label="C# 值类型与引用类型内存布局" role="img" viewBox="0 0 780 420"><title>C# 值类型 vs 引用类型的栈/堆布局与装箱</title><desc>值类型(struct)内联存放、赋值整体拷贝；引用类型(class)在堆上、变量持引用；装箱把值类型搬到堆并产生拷贝。</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="390" y="26" fill="#042C53" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">struct 值内联拷贝；class 引用指向堆对象（由 GC 管理）</text><rect width="300" height="320" x="40" y="56" fill="#E6F1FB" stroke="#378ADD" stroke-width=".6" rx="10"/><text x="190" y="80" fill="#042C53" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">栈 / 内联（线程局部，自动回收）</text><rect width="252" height="56" x="64" y="98" fill="#fff" stroke="#1D9E75" stroke-width=".7" rx="6"/><text x="76" y="120" fill="#04342C" font-family="ui-monospace, monospace" font-size="11.5">int a = 5；Point p = (3,4)</text><text x="76" y="142" fill="#04342C" font-family="system-ui, sans-serif" font-size="11">值类型：数据就在这里，赋值整体拷贝</text><rect width="252" height="44" x="64" y="168" fill="#fff" stroke="#378ADD" stroke-width=".7" rx="6"/><text x="76" y="190" fill="#042C53" font-family="ui-monospace, monospace" font-size="11.5">string s；Order o = new()</text><text x="76" y="206" fill="#042C53" font-family="system-ui, sans-serif" font-size="11">引用类型：这里只放&quot;引用(地址)&quot;</text><rect width="252" height="44" x="64" y="230" fill="#fff" stroke="#BA7517" stroke-width=".7" rx="6"/><text x="76" y="252" fill="#7A4D0E" font-family="ui-monospace, monospace" font-size="11.5">object boxed = a;</text><text x="76" y="268" fill="#7A4D0E" font-family="system-ui, sans-serif" font-size="11">装箱：引用，指向堆上的副本</text><text x="190" y="306" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">值类型赋值/传参 = 拷贝整个值</text><text x="190" y="326" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">改副本不影响原值</text><text x="190" y="352" fill="#C0392B" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">大 struct 频繁拷贝有成本 → in/ref</text><rect width="300" height="320" x="440" y="56" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".6" rx="10"/><text x="590" y="80" fill="#04342C" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">托管堆（GC 回收，分代）</text><rect width="240" height="58" x="470" y="100" fill="#fff" stroke="#378ADD" stroke-width=".7" rx="8"/><text x="590" y="122" fill="#042C53" font-family="ui-monospace, monospace" font-size="11.5" text-anchor="middle">Order { Id=1, Items=… }</text><text x="590" y="144" fill="#444441" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">对象头 + 字段，class 实例</text><rect width="240" height="44" x="470" y="174" fill="#fff" stroke="#378ADD" stroke-width=".7" rx="8"/><text x="590" y="196" fill="#042C53" font-family="ui-monospace, monospace" font-size="11.5" text-anchor="middle">&quot;hello&quot; (string 对象)</text><rect width="240" height="44" x="470" y="234" fill="#FEF3E2" stroke="#BA7517" stroke-width=".7" rx="8"/><text x="590" y="256" fill="#7A4D0E" font-family="ui-monospace, monospace" font-size="11.5" text-anchor="middle">boxed: [ 5 ] 装箱副本</text><text x="590" y="306" fill="#04342C" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">两个引用指向同一对象 → 改一个全改</text><text x="590" y="328" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">不可达即可被 GC 回收</text><text x="590" y="354" fill="#C0392B" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">装箱/拆箱有分配与拷贝开销，热路径慎用</text><line x1="316" x2="468" y1="190" y2="129" stroke="#378ADD" stroke-width="1.4" marker-end="url(#a)"/><line x1="316" x2="468" y1="252" y2="256" stroke="#BA7517" stroke-width="1.4" marker-end="url(#a)"/></svg>