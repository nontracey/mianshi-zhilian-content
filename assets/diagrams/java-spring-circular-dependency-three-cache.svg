<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1280"><title id="title">Spring 循环依赖三级缓存与早期代理</title><desc id="desc">展示 Spring 单例 setter/字段注入循环依赖中 singletonObjects、earlySingletonObjects、singletonFactories 的流转、ObjectFactory 早期代理、构造器和 prototype 失败边界，以及 Boot 2.6 默认禁止循环引用。</desc><defs><marker id="arrow-blue" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#b45309" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 30px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#172033}.subtitle{font:400 15px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.panel{fill:#fff;stroke:#d9e2ec;stroke-width:2;rx:16}.box-title{fill:#1f2933}.panel-title{font:700 20px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#1f2933}.box-title{font:700 16px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.small{font:400 13px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#334e68}.tiny{font:400 12px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.blue{fill:#e8f2ff;stroke:#60a5fa;stroke-width:2;rx:12}.green{fill:#e8f8ef;stroke:#4ade80}.green,.orange,.red,.yellow{stroke-width:2;rx:12}.yellow{fill:#fff7d6;stroke:#facc15}.orange{fill:#fff1e6;stroke:#fb923c}.red{fill:#feecec;stroke:#f87171}.line,.line-red{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.line-red{stroke:#b45309;marker-end:url(#arrow-red)}</style></defs><rect width="1280" height="1280" class="bg"/><text x="48" y="56" class="title">循环依赖：三级缓存解决的是“早期引用一致性”</text><text x="50" y="86" class="subtitle">Spring Boot 2.6 起默认禁止循环引用；理解机制是为了排查遗留系统，不是鼓励设计成环。</text><rect width="1200" height="230" x="40" y="120" class="panel"/><text x="68" y="156" class="panel-title">0. 三个缓存各放什么</text><rect width="250" height="72" x="80" y="210" class="green"/><text x="112" y="238" class="box-title">singletonObjects</text><text x="108" y="262" class="tiny">一级：完整初始化并发布的单例</text><rect width="250" height="72" x="400" y="210" class="yellow"/><text x="428" y="238" class="box-title">earlySingletonObjects</text><text x="430" y="262" class="tiny">二级：已提前暴露的早期引用</text><rect width="250" height="72" x="720" y="210" class="orange"/><text x="755" y="238" class="box-title">singletonFactories</text><text x="746" y="262" class="tiny">三级：ObjectFactory 延迟生成早期引用</text><rect width="150" height="72" x="1040" y="210" class="red"/><text x="1078" y="238" class="box-title">Boot 2.6+</text><text x="1064" y="262" class="tiny">默认 fail fast</text><text x="80" y="318" class="small">三级缓存的价值在 ObjectFactory：有 AOP 时可以在循环发生时提前拿到代理，而不是把原始对象注入给别人。</text><rect width="1200" height="420" x="40" y="390" class="panel"/><text x="68" y="426" class="panel-title">1. A setter 注入 B，B setter 注入 A 的成功路径</text><rect width="140" height="62" x="78" y="488" class="blue"/><text x="108" y="513" class="box-title">create A</text><text x="96" y="534" class="tiny">实例化原始 A</text><rect width="190" height="62" x="262" y="488" class="orange"/><text x="292" y="513" class="box-title">A factory 入三级</text><text x="288" y="534" class="tiny">getEarlyBeanReference</text><rect width="140" height="62" x="496" y="488" class="blue"/><text x="526" y="513" class="box-title">A needs B</text><text x="516" y="534" class="tiny">填充属性</text><rect width="140" height="62" x="680" y="488" class="green"/><text x="710" y="513" class="box-title">create B</text><text x="698" y="534" class="tiny">实例化原始 B</text><rect width="190" height="62" x="864" y="488" class="orange"/><text x="894" y="513" class="box-title">B factory 入三级</text><text x="892" y="534" class="tiny">准备暴露 B</text><line x1="218" x2="262" y1="519" y2="519" class="line"/><line x1="452" x2="496" y1="519" y2="519" class="line"/><line x1="636" x2="680" y1="519" y2="519" class="line"/><line x1="820" x2="864" y1="519" y2="519" class="line"/><rect width="185" height="62" x="102" y="650" class="yellow"/><text x="132" y="675" class="box-title">B needs A</text><text x="124" y="696" class="tiny">查一级 -&gt; 二级 -&gt; 三级</text><rect width="210" height="62" x="357" y="650" class="red"/><text x="388" y="675" class="box-title">ObjectFactory(A)</text><text x="392" y="696" class="tiny">生成早期代理或原始引用</text><rect width="190" height="62" x="637" y="650" class="yellow"/><text x="666" y="675" class="box-title">A early 入二级</text><text x="662" y="696" class="tiny">B 注入同一引用</text><rect width="190" height="62" x="897" y="650" class="green"/><text x="934" y="675" class="box-title">B 完成初始化</text><text x="924" y="696" class="tiny">进入一级缓存</text><path d="M959,550 C959,612 194,600 194,650" class="line"/><line x1="287" x2="357" y1="681" y2="681" class="line-red"/><line x1="567" x2="637" y1="681" y2="681" class="line"/><line x1="827" x2="897" y1="681" y2="681" class="line"/><text x="78" y="766" class="small">B 完成后回到 A，A 注入 B 并完成初始化；如果 A 曾提前暴露，最终放入一级缓存的也应是同一个早期代理。</text><rect width="585" height="275" x="40" y="850" class="panel"/><text x="68" y="886" class="panel-title">2. 失败边界</text><rect width="220" height="64" x="82" y="945" class="red"/><text x="120" y="971" class="box-title">构造器环</text><text x="104" y="993" class="tiny">构造前没有可暴露实例</text><rect width="220" height="64" x="360" y="945" class="red"/><text x="416" y="971" class="box-title">prototype</text><text x="386" y="993" class="tiny">不进入单例缓存</text><rect width="220" height="64" x="82" y="1040" class="yellow"/><text x="132" y="1066" class="box-title">@Lazy</text><text x="104" y="1088" class="tiny">注入延迟代理，临时破环</text><rect width="220" height="64" x="360" y="1040" class="green"/><text x="400" y="1066" class="box-title">重构依赖方向</text><text x="386" y="1088" class="tiny">事件/领域服务/Provider</text><rect width="585" height="275" x="655" y="850" class="panel"/><text x="683" y="886" class="panel-title">3. 排查抓手</text><text x="692" y="944" class="small">先看 Boot 是否允许循环引用；禁用时会在启动阶段快速失败。</text><text x="692" y="982" class="small">再看注入方式：setter/字段可提前暴露，构造器无法先实例化。</text><text x="692" y="1020" class="small">有 AOP 时确认注入给其他 Bean 的是不是最终代理引用。</text><text x="692" y="1058" class="small">解决优先级：重构依赖方向 &gt; Provider/事件 &gt; @Lazy &gt; 临时开关。</text><rect width="1200" height="64" x="40" y="1170" class="panel"/><text x="68" y="1207" class="panel-title">回答抓手</text><text x="190" y="1207" class="small">Boot 默认策略 -&gt; 单例 setter 环 -&gt; A 入三级 -&gt; B 查 A -&gt; ObjectFactory 早期代理 -&gt; 二级缓存 -&gt; B/A 完成 -&gt; 一级缓存 -&gt; 构造器/prototype/设计重构。</text></svg>