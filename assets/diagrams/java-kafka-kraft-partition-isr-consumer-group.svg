<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1280"><title id="title">Kafka KRaft、Partition、ISR 和 Consumer Group</title><desc id="desc">展示 Kafka 4.x 下 KRaft 控制面、Topic Partition 日志、Producer 分区路由、Leader/Follower/ISR、acks all 与 min.insync.replicas、Consumer Group 分区分配和 offset 提交。</desc><defs><marker id="arrow-blue" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-orange" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#b45309" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 30px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#172033}.subtitle{font:400 15px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.panel{fill:#fff;stroke:#d9e2ec;stroke-width:2;rx:14}.box-title{fill:#1f2933}.panel-title{font:700 20px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#1f2933}.box-title{font:700 16px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.small{font:400 13px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#334e68}.tiny{font:400 12px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.blue{fill:#e8f2ff;stroke:#60a5fa;stroke-width:2;rx:12}.green{fill:#e8f8ef;stroke:#4ade80}.gray,.green,.orange,.red,.yellow{stroke-width:2;rx:12}.yellow{fill:#fff7d6;stroke:#facc15}.orange{fill:#fff1e6;stroke:#fb923c}.red{fill:#feecec;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#94a3b8}.line,.line-red{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.line-red{stroke:#dc2626;marker-end:url(#arrow-red)}.dash{stroke-dasharray:7 6}</style></defs><rect width="1280" height="1280" class="bg"/><text x="48" y="56" class="title">Kafka 4.x 核心：KRaft、Partition 日志、ISR 与 Consumer Group</text><text x="50" y="86" class="subtitle">面试要把控制面、数据面和消费位移分开讲；ZooKeeper 不再是 4.x 默认控制面。</text><rect width="1200" height="210" x="40" y="120" class="panel"/><text x="68" y="156" class="panel-title">1. 控制面：KRaft Controller Quorum 管元数据和 Leader 选举</text><rect width="185" height="68" x="86" y="205" class="orange"/><text x="120" y="232" class="box-title">KRaft quorum</text><text x="112" y="254" class="tiny">controller voters</text><rect width="185" height="68" x="352" y="205" class="yellow"/><text x="397" y="232" class="box-title">Metadata log</text><text x="382" y="254" class="tiny">topic / partition / broker</text><rect width="185" height="68" x="618" y="205" class="blue"/><text x="662" y="232" class="box-title">Broker cluster</text><text x="646" y="254" class="tiny">data plane nodes</text><rect width="250" height="68" x="884" y="205" class="gray"/><text x="940" y="232" class="box-title">Compatibility note</text><text x="916" y="254" class="tiny">3.x 迁移系统仍可能见到 ZooKeeper</text><line x1="271" x2="352" y1="239" y2="239" class="line"/><line x1="537" x2="618" y1="239" y2="239" class="line"/><line x1="803" x2="884" y1="239" y2="239" class="line"/><rect width="1200" height="360" x="40" y="370" class="panel"/><text x="68" y="406" class="panel-title">2. 数据面：Producer 路由到 Partition Leader，Follower 复制进入 ISR</text><rect width="150" height="70" x="80" y="500" class="blue"/><text x="122" y="527" class="box-title">Producer</text><text x="104" y="549" class="tiny">key / sticky / batch</text><rect width="180" height="150" x="300" y="460" class="yellow"/><text x="344" y="490" class="box-title">Partitioner</text><text x="328" y="516" class="tiny">key -&gt; same partition</text><text x="328" y="539" class="tiny">no key -&gt; sticky batch</text><text x="328" y="562" class="tiny">custom strategy</text><rect width="230" height="180" x="560" y="445" class="green"/><text x="620" y="475" class="box-title">Partition 2 Leader</text><text x="590" y="503" class="tiny">append-only log segment</text><text x="590" y="526" class="tiny">offset 100, 101, 102...</text><text x="590" y="549" class="tiny">page cache + batch + compression</text><text x="590" y="572" class="tiny">zero-copy fetch path</text><rect width="145" height="62" x="880" y="425" class="green"/><text x="918" y="450" class="box-title">Follower A</text><text x="913" y="471" class="tiny">in ISR</text><rect width="145" height="62" x="880" y="520" class="green"/><text x="918" y="545" class="box-title">Follower B</text><text x="913" y="566" class="tiny">in ISR</text><rect width="145" height="62" x="880" y="615" class="red"/><text x="918" y="640" class="box-title">Follower C</text><text x="913" y="661" class="tiny">lagging, out ISR</text><rect width="140" height="70" x="1060" y="500" class="orange"/><text x="1092" y="527" class="box-title">acks=all</text><text x="1082" y="549" class="tiny">ISR 达标才成功</text><line x1="230" x2="300" y1="535" y2="535" class="line"/><line x1="480" x2="560" y1="535" y2="535" class="line"/><path d="M790,500 C825,464 842,456 880,456" class="line"/><path d="M790,535 C825,547 842,551 880,551" class="line"/><path d="M790,575 C825,625 842,646 880,646" class="line-red dash"/><path d="M1025,456 C1050,470 1062,492 1068,520" class="line"/><path d="M1025,551 C1048,548 1058,543 1060,535" class="line"/><text x="82" y="690" class="small">可靠写入常见组合：replication.factor=3，acks=all，min.insync.replicas=2；ISR 不足时 producer 应看到异常并重试或告警。</text><rect width="575" height="340" x="40" y="770" class="panel"/><text x="68" y="806" class="panel-title">3. 消费面：Consumer Group 分摊 Partition，提交 offset</text><rect width="130" height="58" x="80" y="875" class="green"/><text x="117" y="899" class="box-title">P0</text><text x="105" y="919" class="tiny">offset 0..N</text><rect width="130" height="58" x="80" y="955" class="green"/><text x="117" y="979" class="box-title">P1</text><text x="105" y="999" class="tiny">offset 0..N</text><rect width="130" height="58" x="80" y="1035" class="green"/><text x="117" y="1059" class="box-title">P2</text><text x="105" y="1079" class="tiny">offset 0..N</text><rect width="160" height="58" x="300" y="875" class="blue"/><text x="344" y="899" class="box-title">Consumer A</text><text x="335" y="919" class="tiny">own P0</text><rect width="160" height="58" x="300" y="955" class="blue"/><text x="344" y="979" class="box-title">Consumer B</text><text x="335" y="999" class="tiny">own P1</text><rect width="160" height="58" x="300" y="1035" class="blue"/><text x="344" y="1059" class="box-title">Consumer C</text><text x="335" y="1079" class="tiny">own P2</text><line x1="210" x2="300" y1="904" y2="904" class="line"/><line x1="210" x2="300" y1="984" y2="984" class="line"/><line x1="210" x2="300" y1="1064" y2="1064" class="line"/><text x="78" y="843" class="small">同一个 group 内，一个 Partition 同时只给一个成员；消费者多于 Partition 时会空闲。</text><rect width="585" height="340" x="655" y="770" class="panel"/><text x="683" y="806" class="panel-title">4. Offset、语义和 Rebalance 边界</text><text x="692" y="872" class="small">先处理后提交 offset：at-least-once，可能重复，需要幂等。</text><text x="692" y="912" class="small">先提交后处理：at-most-once，进程崩溃会跳过未处理消息。</text><text x="692" y="952" class="small">事务 Producer：Kafka 内 consume-transform-produce 可把输出和 offset 原子提交。</text><text x="692" y="992" class="small">Rebalance：成员变化、订阅变化、分区变化或 poll 超时都会引发重新分配。</text><text x="692" y="1032" class="small">降低抖动：static membership、cooperative sticky assignor、控制处理耗时。</text><text x="692" y="1072" class="small">顺序边界：Kafka 只承诺同一 Partition 内顺序，不承诺全局顺序。</text><rect width="1200" height="72" x="40" y="1160" class="panel"/><text x="68" y="1203" class="panel-title">回答抓手</text><text x="190" y="1203" class="small">KRaft 管元数据；Producer 按 key/sticky 写 Partition Leader；ISR + acks/minISR 控可靠性；Consumer Group 分摊分区，offset 提交决定交付语义。</text></svg>