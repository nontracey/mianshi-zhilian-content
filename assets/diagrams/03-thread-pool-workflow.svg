<svg viewBox="0 0 680 350" width="100%" role="img" aria-label="线程池工作流程图">
<title>线程池工作流程图</title><desc>提交任务后的完整处理流程</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">线程池工作流程</text>
<rect x="270" y="46" width="140" height="38" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="340" y="66" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">提交任务</text>
<line x1="340" y1="84" x2="340" y2="104" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="220" y="106" width="240" height="38" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="340" y="126" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">核心线程已满?</text>
<line x1="220" y1="125" x2="120" y2="125" stroke="#0F6E56" stroke-width="1" marker-end="url(#a)"/>
<text x="168" y="118" text-anchor="middle" font-size="11" font-weight="400" fill="#0F6E56" font-family="system-ui, sans-serif">否</text>
<rect x="40" y="106" width="80" height="38" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="80" y="126" text-anchor="middle" font-size="11" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">创建核心线程</text>
<line x1="340" y1="144" x2="340" y2="164" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="348" y="158" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">是</text>
<rect x="220" y="166" width="240" height="38" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="340" y="186" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">工作队列已满?</text>
<line x1="220" y1="185" x2="120" y2="185" stroke="#0F6E56" stroke-width="1" marker-end="url(#a)"/>
<text x="168" y="178" text-anchor="middle" font-size="11" font-weight="400" fill="#0F6E56" font-family="system-ui, sans-serif">否</text>
<rect x="40" y="166" width="80" height="38" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="80" y="186" text-anchor="middle" font-size="11" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">加入工作队列</text>
<line x1="340" y1="204" x2="340" y2="224" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="348" y="218" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">是</text>
<rect x="220" y="226" width="240" height="38" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="340" y="246" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">最大线程已满?</text>
<line x1="220" y1="245" x2="120" y2="245" stroke="#BA7517" stroke-width="1" marker-end="url(#a)"/>
<text x="168" y="238" text-anchor="middle" font-size="11" font-weight="400" fill="#BA7517" font-family="system-ui, sans-serif">否</text>
<rect x="30" y="226" width="90" height="38" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="75" y="246" text-anchor="middle" font-size="11" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">创建非核心线程</text>
<line x1="340" y1="264" x2="340" y2="284" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="348" y="278" text-anchor="middle" font-size="11" font-weight="400" fill="#A32D2D" font-family="system-ui, sans-serif">是</text>
<rect x="220" y="286" width="240" height="38" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="340" y="306" text-anchor="middle" font-size="13" font-weight="500" fill="#501313" font-family="system-ui, sans-serif">执行拒绝策略</text>
<rect x="490" y="266" width="170" height="80" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="575" y="284" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">4种拒绝策略:</text>
<text x="575" y="300" text-anchor="middle" font-size="10" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">AbortPolicy (抛异常)</text>
<text x="575" y="314" text-anchor="middle" font-size="10" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">CallerRunsPolicy</text>
<text x="575" y="328" text-anchor="middle" font-size="10" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">DiscardPolicy (丢弃)</text>
<text x="575" y="342" text-anchor="middle" font-size="10" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">DiscardOldestPolicy</text>
<line x1="460" y1="305" x2="488" y2="305" stroke="#B4B2A9" stroke-width="1" marker-end="url(#a)"/>
</svg>