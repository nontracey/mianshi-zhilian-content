<svg width="100%" aria-label="线程池工作流程图" role="img" viewBox="0 0 680 350"><title>线程池工作流程图</title><desc>提交任务后的完整处理流程</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="340" y="24" fill="#042C53" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">线程池工作流程</text><rect width="140" height="38" x="270" y="46" fill="#E6F1FB" stroke="#378ADD" stroke-width=".5" rx="8"/><text x="340" y="66" fill="#042C53" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">提交任务</text><line x1="340" x2="340" y1="84" y2="104" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><rect width="240" height="38" x="220" y="106" fill="#EEEDFE" stroke="#7F77DD" stroke-width=".5" rx="8"/><text x="340" y="126" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">核心线程已满?</text><line x1="220" x2="120" y1="125" y2="125" stroke="#0F6E56" stroke-width="1" marker-end="url(#a)"/><text x="168" y="118" fill="#0F6E56" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">否</text><rect width="80" height="38" x="40" y="106" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".5" rx="8"/><text x="80" y="126" fill="#042C53" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">创建核心线程</text><line x1="340" x2="340" y1="144" y2="164" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><text x="348" y="158" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">是</text><rect width="240" height="38" x="220" y="166" fill="#EEEDFE" stroke="#7F77DD" stroke-width=".5" rx="8"/><text x="340" y="186" fill="#042C53" font-family="system-ui, sans-serif" font-size="