<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">ArrayList, LinkedList, ArrayDeque, and thread-safe list choices</title><desc id="desc">A topic-specific diagram comparing ArrayList contiguous array behavior, LinkedList node pointer behavior, ArrayDeque queue choice, fail-fast iteration, and thread-safe alternatives.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 33px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.section{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.cyan{fill:#cffafe;stroke:#06b6d4}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.arrow-blue,.arrow-green{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.arrow-green{stroke:#16a34a;marker-end:url(#arrow-green)}.dash{stroke-dasharray:8 7}</style></defs><rect width="1320" height="1320" class="bg"/><text x="70" y="64" class="title">ArrayList vs LinkedList：复杂度要结合定位成本和缓存</text><text x="70" y="96" class="subtitle">默认优先 ArrayList；队列/栈优先 ArrayDeque；LinkedList 的优势只有在已经定位到节点且频繁改链时才明显。</text><rect width="1180" height="320" x="70" y="130" class="section" rx="16"/><text x="96" y="166" class="section-title">1. ArrayList：连续数组，随机访问和缓存友好是核心优势</text><rect width="110" height="58" x="105" y="210" stroke-width="2" class="blue" rx="10"/><text x="135" y="245" class="mono">[0]</text><rect width="110" height="58" x="220" y="210" stroke-width="2" class="blue" rx="10"/><text x="250" y="245" class="mono">[1]</text><rect width="110" height="58" x="335" y="210" stroke-width="2" class="blue" rx="10"/><text x="365" y="245" class="mono">[2]</text><rect width="110" height="58" x="450" y="210" stroke-width="2" class="blue" rx="10"/><text x="480" y="245" class="mono">[3]</text><rect width="110" height="58" x="565" y="210" stroke-width="2" class="blue" rx="10"/><text x="595" y="245" class="mono">[4]</text><rect width="110" height="58" x="680" y="210" stroke-width="2" class="blue" rx="10"/><text x="710" y="245" class="mono">free</text><rect width="320" height="86" x="850" y="195" stroke-width="2" class="green" rx="14"/><text x="877" y="227" class="box-title">尾部 add</text><text x="877" y="252" class="text">容量够：写 elementData[size++]</text><text x="877" y="272" class="mono">amortized O(1)</text><path d="M790 239 H841" class="arrow-green"/><rect width="300" height="82" x="105" y="325" stroke-width="2" class="yellow" rx="14"/><text x="132" y="357" class="box-title">中间插入/删除</text><text x="132" y="382" class="text">System.arraycopy 移动一段连续内存</text><text x="132" y="402" class="mono">O(n), but cache-friendly</text><rect width="320" height="82" x="455" y="325" stroke-width="2" class="red" rx="14"/><text x="482" y="357" class="box-title">grow</text><text x="482" y="382" class="text">无参构造首次 add 分配 10</text><text x="482" y="402" class="mono">newCap = old + old/2</text><rect width="345" height="82" x="825" y="325" stroke-width="2" class="cyan" rx="14"/><text x="852" y="357" class="box-title">预估容量</text><text x="852" y="382" class="text">new ArrayList&lt;&gt;(n) / ensureCapacity</text><text x="852" y="402" class="text">减少临时数组和 GC 压力</text><rect width="580" height="355" x="70" y="490" class="section" rx="16"/><text x="96" y="526" class="section-title">2. LinkedList：链表改指针快，但定位和内存局部性差</text><rect width="130" height="70" x="105" y="575" stroke-width="2" class="yellow" rx="12"/><text x="132" y="607" class="box-title">Node A</text><text x="132" y="630" class="mono">prev / next</text><rect width="130" height="70" x="290" y="575" stroke-width="2" class="yellow" rx="12"/><text x="317" y="607" class="box-title">Node B</text><text x="317" y="630" class="mono">prev / next</text><rect width="130" height="70" x="475" y="575" stroke-width="2" class="yellow" rx="12"/><text x="502" y="607" class="box-title">Node C</text><text x="502" y="630" class="mono">prev / next</text><path d="M235 610 H281" class="arrow-blue"/><path d="M420 610 H466" class="arrow-blue"/><path d="M475 634 H429" class="arrow-blue dash"/><path d="M290 634 H244" class="arrow-blue dash"/><rect width="500" height="86" x="105" y="700" stroke-width="2" class="red" rx="14"/><text x="132" y="732" class="box-title">关键边界</text><text x="132" y="757" class="text">add/remove 已知节点附近是 O(1)；但 list.add(index, e)</text><text x="132" y="777" class="text">要先从头或尾遍历到 index，整体仍是 O(n)。</text><rect width="560" height="355" x="690" y="490" class="section" rx="16"/><text x="716" y="526" class="section-title">3. 真正的选型</text><rect width="210" height="82" x="725" y="575" stroke-width="2" class="green" rx="12"/><text x="752" y="607" class="box-title">默认 List</text><text x="752" y="632" class="mono">ArrayList</text><text x="752" y="650" class="text">随机读、遍历、尾插</text><rect width="210" height="82" x="985" y="575" stroke-width="2" class="blue" rx="12"/><text x="1012" y="607" class="box-title">队列/栈/双端队列</text><text x="1012" y="632" class="mono">ArrayDeque</text><text x="1012" y="650" class="text">循环数组，通常快于链表</text><rect width="210" height="82" x="725" y="715" stroke-width="2" class="yellow" rx="12"/><text x="752" y="747" class="box-title">读多写少并发</text><text x="752" y="772" class="mono">CopyOnWriteArrayList</text><text x="752" y="790" class="text">读快照，写复制数组</text><rect width="210" height="82" x="985" y="715" stroke-width="2" class="red" rx="12"/><text x="1012" y="747" class="box-title">很窄的链表场景</text><text x="1012" y="772" class="mono">LinkedList</text><text x="1012" y="790" class="text">已定位节点附近频繁改链</text><rect width="1180" height="260" x="70" y="885" class="section" rx="16"/><text x="96" y="921" class="section-title">4. fail-fast 与线程安全</text><rect width="300" height="90" x="105" y="965" stroke-width="2" class="red" rx="12"/><text x="132" y="997" class="box-title">fail-fast</text><text x="132" y="1022" class="text">迭代器记录 expectedModCount；结构性修改</text><text x="132" y="1042" class="text">可能抛 ConcurrentModificationException</text><rect width="300" height="90" x="445" y="965" stroke-width="2" class="green" rx="12"/><text x="472" y="997" class="box-title">安全删除</text><text x="472" y="1022" class="mono">iterator.remove()</text><text x="472" y="1042" class="mono">removeIf(predicate)</text><rect width="385" height="90" x="785" y="965" stroke-width="2" class="yellow" rx="12"/><text x="812" y="997" class="box-title">同步包装不是魔法</text><text x="812" y="1022" class="text">Collections.synchronizedList 迭代时仍要</text><text x="812" y="1042" class="text">手动 synchronized(list) 包住整个遍历。</text><text x="105" y="1105" class="small">fail-fast 是 best-effort 调试保护，不是并发正确性保证；多线程读写需要明确同步策略或并发集合。</text><text x="96" y="1238" class="small">面试抓手：不要只背 O(1)/O(n)，要把“定位成本、内存局部性、扩容拷贝、队列替代、fail-fast 和线程安全”串成选型答案。</text></svg>