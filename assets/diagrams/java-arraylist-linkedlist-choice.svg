<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">ArrayList, LinkedList, ArrayDeque, and thread-safe list choices</title>
  <desc id="desc">A topic-specific diagram comparing ArrayList contiguous array behavior, LinkedList node pointer behavior, ArrayDeque queue choice, fail-fast iteration, and thread-safe alternatives.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 33px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .chip { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-red { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .arrow-green { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="70" y="64">ArrayList vs LinkedList：复杂度要结合定位成本和缓存</text>
  <text class="subtitle" x="70" y="96">默认优先 ArrayList；队列/栈优先 ArrayDeque；LinkedList 的优势只有在已经定位到节点且频繁改链时才明显。</text>

  <rect class="section" x="70" y="130" width="1180" height="320" rx="16"/>
  <text class="section-title" x="96" y="166">1. ArrayList：连续数组，随机访问和缓存友好是核心优势</text>

  <rect class="blue" x="105" y="210" width="110" height="58" rx="10" stroke-width="2"/>
  <text class="mono" x="135" y="245">[0]</text>
  <rect class="blue" x="220" y="210" width="110" height="58" rx="10" stroke-width="2"/>
  <text class="mono" x="250" y="245">[1]</text>
  <rect class="blue" x="335" y="210" width="110" height="58" rx="10" stroke-width="2"/>
  <text class="mono" x="365" y="245">[2]</text>
  <rect class="blue" x="450" y="210" width="110" height="58" rx="10" stroke-width="2"/>
  <text class="mono" x="480" y="245">[3]</text>
  <rect class="blue" x="565" y="210" width="110" height="58" rx="10" stroke-width="2"/>
  <text class="mono" x="595" y="245">[4]</text>
  <rect class="blue" x="680" y="210" width="110" height="58" rx="10" stroke-width="2"/>
  <text class="mono" x="710" y="245">free</text>

  <rect class="green" x="850" y="195" width="320" height="86" rx="14" stroke-width="2"/>
  <text class="box-title" x="877" y="227">尾部 add</text>
  <text class="text" x="877" y="252">容量够：写 elementData[size++]</text>
  <text class="mono" x="877" y="272">amortized O(1)</text>

  <path class="arrow-green" d="M790 239 H841"/>

  <rect class="yellow" x="105" y="325" width="300" height="82" rx="14" stroke-width="2"/>
  <text class="box-title" x="132" y="357">中间插入/删除</text>
  <text class="text" x="132" y="382">System.arraycopy 移动一段连续内存</text>
  <text class="mono" x="132" y="402">O(n), but cache-friendly</text>

  <rect class="red" x="455" y="325" width="320" height="82" rx="14" stroke-width="2"/>
  <text class="box-title" x="482" y="357">grow</text>
  <text class="text" x="482" y="382">无参构造首次 add 分配 10</text>
  <text class="mono" x="482" y="402">newCap = old + old/2</text>

  <rect class="cyan" x="825" y="325" width="345" height="82" rx="14" stroke-width="2"/>
  <text class="box-title" x="852" y="357">预估容量</text>
  <text class="text" x="852" y="382">new ArrayList&lt;&gt;(n) / ensureCapacity</text>
  <text class="text" x="852" y="402">减少临时数组和 GC 压力</text>

  <rect class="section" x="70" y="490" width="580" height="355" rx="16"/>
  <text class="section-title" x="96" y="526">2. LinkedList：链表改指针快，但定位和内存局部性差</text>

  <rect class="yellow" x="105" y="575" width="130" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="607">Node A</text>
  <text class="mono" x="132" y="630">prev / next</text>

  <rect class="yellow" x="290" y="575" width="130" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="317" y="607">Node B</text>
  <text class="mono" x="317" y="630">prev / next</text>

  <rect class="yellow" x="475" y="575" width="130" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="502" y="607">Node C</text>
  <text class="mono" x="502" y="630">prev / next</text>

  <path class="arrow-blue" d="M235 610 H281"/>
  <path class="arrow-blue" d="M420 610 H466"/>
  <path class="arrow-blue dash" d="M475 634 H429"/>
  <path class="arrow-blue dash" d="M290 634 H244"/>

  <rect class="red" x="105" y="700" width="500" height="86" rx="14" stroke-width="2"/>
  <text class="box-title" x="132" y="732">关键边界</text>
  <text class="text" x="132" y="757">add/remove 已知节点附近是 O(1)；但 list.add(index, e)</text>
  <text class="text" x="132" y="777">要先从头或尾遍历到 index，整体仍是 O(n)。</text>

  <rect class="section" x="690" y="490" width="560" height="355" rx="16"/>
  <text class="section-title" x="716" y="526">3. 真正的选型</text>

  <rect class="green" x="725" y="575" width="210" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="752" y="607">默认 List</text>
  <text class="mono" x="752" y="632">ArrayList</text>
  <text class="text" x="752" y="650">随机读、遍历、尾插</text>

  <rect class="blue" x="985" y="575" width="210" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1012" y="607">队列/栈/双端队列</text>
  <text class="mono" x="1012" y="632">ArrayDeque</text>
  <text class="text" x="1012" y="650">循环数组，通常快于链表</text>

  <rect class="yellow" x="725" y="715" width="210" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="752" y="747">读多写少并发</text>
  <text class="mono" x="752" y="772">CopyOnWriteArrayList</text>
  <text class="text" x="752" y="790">读快照，写复制数组</text>

  <rect class="red" x="985" y="715" width="210" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1012" y="747">很窄的链表场景</text>
  <text class="mono" x="1012" y="772">LinkedList</text>
  <text class="text" x="1012" y="790">已定位节点附近频繁改链</text>

  <rect class="section" x="70" y="885" width="1180" height="260" rx="16"/>
  <text class="section-title" x="96" y="921">4. fail-fast 与线程安全</text>

  <rect class="red" x="105" y="965" width="300" height="90" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="997">fail-fast</text>
  <text class="text" x="132" y="1022">迭代器记录 expectedModCount；结构性修改</text>
  <text class="text" x="132" y="1042">可能抛 ConcurrentModificationException</text>

  <rect class="green" x="445" y="965" width="300" height="90" rx="12" stroke-width="2"/>
  <text class="box-title" x="472" y="997">安全删除</text>
  <text class="mono" x="472" y="1022">iterator.remove()</text>
  <text class="mono" x="472" y="1042">removeIf(predicate)</text>

  <rect class="yellow" x="785" y="965" width="385" height="90" rx="12" stroke-width="2"/>
  <text class="box-title" x="812" y="997">同步包装不是魔法</text>
  <text class="text" x="812" y="1022">Collections.synchronizedList 迭代时仍要</text>
  <text class="text" x="812" y="1042">手动 synchronized(list) 包住整个遍历。</text>

  <text class="small" x="105" y="1105">fail-fast 是 best-effort 调试保护，不是并发正确性保证；多线程读写需要明确同步策略或并发集合。</text>

  <text class="small" x="96" y="1238">面试抓手：不要只背 O(1)/O(n)，要把“定位成本、内存局部性、扩容拷贝、队列替代、fail-fast 和线程安全”串成选型答案。</text>
</svg>
