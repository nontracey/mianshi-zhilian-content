<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1280"><title id="title">Nacos Naming 与 Config 双链路</title><desc id="desc">展示 Nacos 服务注册发现、配置发布监听、实例类型一致性取舍、版本边界和生产治理检查点。</desc><defs><marker id="arrow-blue" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#1f5f99" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#b24634" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f7fafc}.title{font:700 30px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#14213d}.subtitle{font:400 15px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.panel{fill:#fff;stroke:#d9e2ec;stroke-width:2;rx:16}.label{fill:#1f2933}.panel-title{font:700 20px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#1f2933}.label{font:700 16px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.small{font:400 14px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#334e68}.tiny{font:400 12px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.blue{fill:#e8f4ff;stroke:#6aa9df}.blue,.gray{stroke-width:2;rx:12}.green{fill:#e9f7ef;stroke:#58b77d}.green,.red,.yellow{stroke-width:2;rx:12}.yellow{fill:#fff5d6;stroke:#e0ae35}.red{fill:#fdecea;stroke:#cf5d4b}.gray{fill:#f1f5f9;stroke:#a7b5c4}.line,.line-red{stroke:#1f5f99;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.line-red{stroke:#b24634;marker-end:url(#arrow-red)}</style></defs><rect width="1280" height="1280" class="bg"/><text x="48" y="56" class="title">Nacos：Naming 与 Config 是两条主链路</text><text x="50" y="86" class="subtitle">传统微服务看注册发现和配置动态刷新；3.x 还扩展 AI Registry 与 API 现代化。</text><rect width="1200" height="285" x="40" y="120" class="panel"/><text x="68" y="156" class="panel-title">1. Naming：注册、健康、订阅、调用</text><rect width="160" height="70" x="82" y="210" class="blue"/><text x="122" y="238" class="label">Provider</text><text x="102" y="262" class="tiny">service/ip/port/meta</text><rect width="180" height="70" x="312" y="210" class="green"/><text x="350" y="238" class="label">Nacos Naming</text><text x="346" y="262" class="tiny">实例列表和健康状态</text><rect width="170" height="70" x="562" y="210" class="yellow"/><text x="594" y="238" class="label">健康管理</text><text x="590" y="262" class="tiny">临时心跳 / 持久探测</text><rect width="160" height="70" x="802" y="210" class="blue"/><text x="842" y="238" class="label">Consumer</text><text x="826" y="262" class="tiny">订阅 serviceName</text><rect width="160" height="70" x="1032" y="210" class="green"/><text x="1070" y="238" class="label">调用实例</text><text x="1058" y="262" class="tiny">健康 + 权重 + cluster</text><line x1="242" x2="312" y1="245" y2="245" class="line"/><line x1="492" x2="562" y1="245" y2="245" class="line"/><line x1="732" x2="802" y1="245" y2="245" class="line"/><line x1="962" x2="1032" y1="245" y2="245" class="line"/><text x="84" y="342" class="small">排查服务发现先核对 namespace/group/serviceName/cluster/metadata，再看实例健康和消费者订阅。</text><rect width="1200" height="285" x="40" y="445" class="panel"/><text x="68" y="481" class="panel-title">2. Config：发布、版本、监听、刷新</text><rect width="170" height="70" x="82" y="535" class="blue"/><text x="126" y="563" class="label">配置发布</text><text x="102" y="587" class="tiny">namespace/group/dataId</text><rect width="160" height="70" x="326" y="535" class="green"/><text x="366" y="563" class="label">Config 存储</text><text x="364" y="587" class="tiny">版本和历史</text><rect width="170" height="70" x="560" y="535" class="yellow"/><text x="602" y="563" class="label">客户端监听</text><text x="584" y="587" class="tiny">收到变更后拉取</text><rect width="160" height="70" x="804" y="535" class="green"/><text x="846" y="563" class="label">校验灰度</text><text x="836" y="587" class="tiny">回滚和审计</text><rect width="150" height="70" x="1038" y="535" class="blue"/><text x="1074" y="563" class="label">应用刷新</text><text x="1062" y="587" class="tiny">Bean / 本地缓存</text><line x1="252" x2="326" y1="570" y2="570" class="line"/><line x1="486" x2="560" y1="570" y2="570" class="line"/><line x1="730" x2="804" y1="570" y2="570" class="line-red"/><line x1="964" x2="1038" y1="570" y2="570" class="line"/><text x="84" y="666" class="small">配置发布成功不等于应用生效；还要看客户端监听、刷新范围、格式校验和回滚能力。</text><rect width="585" height="315" x="40" y="770" class="panel"/><text x="68" y="806" class="panel-title">3. 实例与一致性取舍</text><rect width="150" height="72" x="78" y="858" class="green"/><text x="112" y="886" class="label">临时实例</text><text x="102" y="910" class="tiny">心跳 / 长连接</text><rect width="150" height="72" x="278" y="858" class="yellow"/><text x="318" y="886" class="label">AP 倾向</text><text x="306" y="910" class="tiny">优先可用</text><rect width="150" height="72" x="78" y="976" class="blue"/><text x="112" y="1004" class="label">持久实例</text><text x="100" y="1028" class="tiny">服务端探测/维护</text><rect width="150" height="72" x="278" y="976" class="red"/><text x="318" y="1004" class="label">CP 倾向</text><text x="306" y="1028" class="tiny">优先一致</text><line x1="228" x2="278" y1="894" y2="894" class="line"/><line x1="228" x2="278" y1="1012" y2="1012" class="line-red"/><rect width="132" height="72" x="454" y="916" class="gray"/><text x="486" y="944" class="label">保护阈值</text><text x="474" y="968" class="tiny">避免全量摘除</text><rect width="585" height="315" x="655" y="770" class="panel"/><text x="683" y="806" class="panel-title">4. 版本和生产治理</text><rect width="142" height="70" x="692" y="858" class="green"/><text x="728" y="886" class="label">2.x</text><text x="710" y="910" class="tiny">gRPC 长连接</text><rect width="142" height="70" x="878" y="858" class="yellow"/><text x="914" y="886" class="label">3.2</text><text x="900" y="910" class="tiny">AI Registry / API 现代化</text><rect width="142" height="70" x="1064" y="858" class="red"/><text x="1090" y="886" class="label">升级检查</text><text x="1086" y="910" class="tiny">SDK / 端口 / 协议</text><line x1="834" x2="878" y1="893" y2="893" class="line"/><line x1="1020" x2="1064" y1="893" y2="893" class="line-red"/><rect width="514" height="52" x="692" y="984" class="gray"/><text x="718" y="1016" class="small">生产关注认证、权限、审计、配置灰度、集群指标和回滚。</text><rect width="1200" height="84" x="40" y="1130" class="panel"/><text x="68" y="1164" class="panel-title">回答抓手</text><text x="190" y="1164" class="small">Naming 链路 -&gt; Config 链路 -&gt; 实例类型/AP-CP -&gt; 2.x gRPC -&gt; 3.x 版本边界 -&gt; 生产治理和排查。</text></svg>