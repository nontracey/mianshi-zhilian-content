<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">死锁等待图、破环策略与线上定位</title>
  <desc id="desc">展示两个线程和两把锁如何形成等待环，四个必要条件如何同时成立，以及通过固定加锁顺序、银行家算法、等待图检测和线上工具定位死锁。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .title { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .panel-title { font: 750 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 750 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny-strong { font: 750 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .thread { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 14; }
      .lock { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 14; }
      .strategy { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 14; }
      .risk { fill: #fef2f2; stroke: #f87171; stroke-width: 2; rx: 14; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .line-blue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #dc2626; stroke-width: 4; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="660" y="56" text-anchor="middle">死锁的证据是等待图成环</text>
  <text class="subtitle" x="660" y="90" text-anchor="middle">四个必要条件是检查表，工程修复通常是切断循环等待</text>

  <rect class="panel" x="60" y="125" width="1200" height="360"/>
  <text class="panel-title" x="92" y="168">1. 两把锁如何形成等待环</text>
  <rect class="thread" x="120" y="220" width="220" height="78"/>
  <text class="label" x="230" y="251" text-anchor="middle">Thread A</text>
  <text class="tiny" x="230" y="277" text-anchor="middle">holds lock1, waits lock2</text>
  <rect class="lock" x="530" y="200" width="210" height="78"/>
  <text class="label" x="635" y="231" text-anchor="middle">lock1</text>
  <text class="tiny" x="635" y="257" text-anchor="middle">owned by A</text>
  <rect class="lock" x="530" y="330" width="210" height="78"/>
  <text class="label" x="635" y="361" text-anchor="middle">lock2</text>
  <text class="tiny" x="635" y="387" text-anchor="middle">owned by B</text>
  <rect class="thread" x="940" y="220" width="220" height="78"/>
  <text class="label" x="1050" y="251" text-anchor="middle">Thread B</text>
  <text class="tiny" x="1050" y="277" text-anchor="middle">holds lock2, waits lock1</text>

  <path class="line-blue" d="M 340 258 L 525 238"/>
  <path class="line-red dash" d="M 340 282 C 430 365 450 375 525 370"/>
  <path class="line-blue" d="M 940 282 L 745 370"/>
  <path class="line-red dash" d="M 940 258 C 845 200 820 220 745 238"/>
  <text class="tiny-strong" x="410" y="213" text-anchor="middle">A owns</text>
  <text class="tiny-strong" x="412" y="408" text-anchor="middle">A waits</text>
  <text class="tiny-strong" x="850" y="408" text-anchor="middle">B owns</text>
  <text class="tiny-strong" x="850" y="213" text-anchor="middle">B waits</text>

  <rect class="risk" x="120" y="430" width="1040" height="36"/>
  <text class="tiny-strong" x="640" y="454" text-anchor="middle">互斥 + 持有并等待 + 不可剥夺 + 循环等待同时成立，才构成死锁</text>

  <rect class="panel" x="60" y="520" width="1200" height="300"/>
  <text class="panel-title" x="92" y="563">2. 四类处理策略：从设计到恢复</text>
  <rect class="strategy" x="95" y="610" width="255" height="92"/>
  <text class="label" x="222" y="641" text-anchor="middle">预防</text>
  <text class="tiny" x="222" y="667" text-anchor="middle">统一资源顺序</text>
  <text class="tiny" x="222" y="690" text-anchor="middle">切断循环等待</text>
  <rect class="strategy" x="385" y="610" width="255" height="92"/>
  <text class="label" x="512" y="641" text-anchor="middle">避免</text>
  <text class="tiny" x="512" y="667" text-anchor="middle">银行家算法</text>
  <text class="tiny" x="512" y="690" text-anchor="middle">分配前检查安全序列</text>
  <rect class="strategy" x="675" y="610" width="255" height="92"/>
  <text class="label" x="802" y="641" text-anchor="middle">检测 + 恢复</text>
  <text class="tiny" x="802" y="667" text-anchor="middle">等待图查环</text>
  <text class="tiny" x="802" y="690" text-anchor="middle">回滚/终止 victim</text>
  <rect class="strategy" x="965" y="610" width="255" height="92"/>
  <text class="label" x="1092" y="641" text-anchor="middle">忽略/超时</text>
  <text class="tiny" x="1092" y="667" text-anchor="middle">低概率场景</text>
  <text class="tiny" x="1092" y="690" text-anchor="middle">watchdog / 人工恢复</text>
  <rect class="gray" x="95" y="735" width="1125" height="46"/>
  <text class="small" x="657" y="764" text-anchor="middle">业务代码最常落地：全局锁顺序 + tryLock timeout + 释放已持有锁 + 随机退避</text>

  <rect class="panel" x="60" y="855" width="1200" height="300"/>
  <text class="panel-title" x="92" y="898">3. 线上定位：先证明“环”，再谈修复</text>
  <rect class="gray" x="95" y="945" width="250" height="82"/>
  <text class="label" x="220" y="976" text-anchor="middle">Java</text>
  <text class="tiny" x="220" y="1002" text-anchor="middle">jstack / jcmd Thread.print -l</text>
  <rect class="gray" x="380" y="945" width="250" height="82"/>
  <text class="label" x="505" y="976" text-anchor="middle">InnoDB</text>
  <text class="tiny" x="505" y="1002" text-anchor="middle">LATEST DETECTED DEADLOCK</text>
  <rect class="gray" x="665" y="945" width="250" height="82"/>
  <text class="label" x="790" y="976" text-anchor="middle">C/C++</text>
  <text class="tiny" x="790" y="1002" text-anchor="middle">gdb bt / futex wait / owner tid</text>
  <rect class="gray" x="950" y="945" width="270" height="82"/>
  <text class="label" x="1085" y="976" text-anchor="middle">区分现象</text>
  <text class="tiny" x="1085" y="1002" text-anchor="middle">deadlock / livelock / starvation</text>
  <rect class="risk" x="95" y="1065" width="1125" height="48"/>
  <text class="small" x="657" y="1095" text-anchor="middle">线程池耗尽、下游慢、队列堆积不一定是死锁；没有等待环证据，不要贸然下结论</text>
</svg>
