<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">死锁等待图、破环策略与线上定位</title><desc id="desc">展示两个线程和两把锁如何形成等待环，四个必要条件如何同时成立，以及通过固定加锁顺序、银行家算法、等待图检测和线上工具定位死锁。</desc><defs><marker id="arrow-blue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.title{font:800 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.panel-title{font:750 27px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:750 20px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1e293b}.small{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.tiny-strong{font:750 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.lock,.thread{stroke-width:2;rx:14}.thread{fill:#eff6ff;stroke:#60a5fa}.lock{fill:#fff7ed;stroke:#fb923c}.gray,.risk,.strategy{stroke-width:2;rx:14}.strategy{fill:#ecfdf5;stroke:#34d399}.risk{fill:#fef2f2;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#cbd5e1}.line-blue,.line-red{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow-blue)}.line-red{stroke:#dc2626;marker-end:url(#arrow-red)}.dash{stroke-dasharray:8 8}</style></defs><rect width="1320" height="1320" class="bg"/><text x="660" y="56" class="title" text-anchor="middle">死锁的证据是等待图成环</text><text x="660" y="90" class="subtitle" text-anchor="middle">四个必要条件是检查表，工程修复通常是切断循环等待</text><rect width="1200" height="360" x="60" y="125" class="panel"/><text x="92" y="168" class="panel-title">1. 两把锁如何形成等待环</text><rect width="220" height="78" x="120" y="220" class="thread"/><text x="230" y="251" class="label" text-anchor="middle">Thread A</text><text x="230" y="277" class="tiny" text-anchor="middle">holds lock1, waits lock2</text><rect width="210" height="78" x="530" y="200" class="lock"/><text x="635" y="231" class="label" text-anchor="middle">lock1</text><text x="635" y="257" class="tiny" text-anchor="middle">owned by A</text><rect width="210" height="78" x="530" y="330" class="lock"/><text x="635" y="361" class="label" text-anchor="middle">lock2</text><text x="635" y="387" class="tiny" text-anchor="middle">owned by B</text><rect width="220" height="78" x="940" y="220" class="thread"/><text x="1050" y="251" class="label" text-anchor="middle">Thread B</text><text x="1050" y="277" class="tiny" text-anchor="middle">holds lock2, waits lock1</text><path d="M 340 258 L 525 238" class="line-blue"/><path d="M 340 282 C 430 365 450 375 525 370" class="line-red dash"/><path d="M 940 282 L 745 370" class="line-blue"/><path d="M 940 258 C 845 200 820 220 745 238" class="line-red dash"/><text x="410" y="213" class="tiny-strong" text-anchor="middle">A owns</text><text x="412" y="408" class="tiny-strong" text-anchor="middle">A waits</text><text x="850" y="408" class="tiny-strong" text-anchor="middle">B owns</text><text x="850" y="213" class="tiny-strong" text-anchor="middle">B waits</text><rect width="1040" height="36" x="120" y="430" class="risk"/><text x="640" y="454" class="tiny-strong" text-anchor="middle">互斥 + 持有并等待 + 不可剥夺 + 循环等待同时成立，才构成死锁</text><rect width="1200" height="300" x="60" y="520" class="panel"/><text x="92" y="563" class="panel-title">2. 四类处理策略：从设计到恢复</text><rect width="255" height="92" x="95" y="610" class="strategy"/><text x="222" y="641" class="label" text-anchor="middle">预防</text><text x="222" y="667" class="tiny" text-anchor="middle">统一资源顺序</text><text x="222" y="690" class="tiny" text-anchor="middle">切断循环等待</text><rect width="255" height="92" x="385" y="610" class="strategy"/><text x="512" y="641" class="label" text-anchor="middle">避免</text><text x="512" y="667" class="tiny" text-anchor="middle">银行家算法</text><text x="512" y="690" class="tiny" text-anchor="middle">分配前检查安全序列</text><rect width="255" height="92" x="675" y="610" class="strategy"/><text x="802" y="641" class="label" text-anchor="middle">检测 + 恢复</text><text x="802" y="667" class="tiny" text-anchor="middle">等待图查环</text><text x="802" y="690" class="tiny" text-anchor="middle">回滚/终止 victim</text><rect width="255" height="92" x="965" y="610" class="strategy"/><text x="1092" y="641" class="label" text-anchor="middle">忽略/超时</text><text x="1092" y="667" class="tiny" text-anchor="middle">低概率场景</text><text x="1092" y="690" class="tiny" text-anchor="middle">watchdog / 人工恢复</text><rect width="1125" height="46" x="95" y="735" class="gray"/><text x="657" y="764" class="small" text-anchor="middle">业务代码最常落地：全局锁顺序 + tryLock timeout + 释放已持有锁 + 随机退避</text><rect width="1200" height="300" x="60" y="855" class="panel"/><text x="92" y="898" class="panel-title">3. 线上定位：先证明“环”，再谈修复</text><rect width="250" height="82" x="95" y="945" class="gray"/><text x="220" y="976" class="label" text-anchor="middle">Java</text><text x="220" y="1002" class="tiny" text-anchor="middle">jstack / jcmd Thread.print -l</text><rect width="250" height="82" x="380" y="945" class="gray"/><text x="505" y="976" class="label" text-anchor="middle">InnoDB</text><text x="505" y="1002" class="tiny" text-anchor="middle">LATEST DETECTED DEADLOCK</text><rect width="250" height="82" x="665" y="945" class="gray"/><text x="790" y="976" class="label" text-anchor="middle">C/C++</text><text x="790" y="1002" class="tiny" text-anchor="middle">gdb bt / futex wait / owner tid</text><rect width="270" height="82" x="950" y="945" class="gray"/><text x="1085" y="976" class="label" text-anchor="middle">区分现象</text><text x="1085" y="1002" class="tiny" text-anchor="middle">deadlock / livelock / starvation</text><rect width="1125" height="48" x="95" y="1065" class="risk"/><text x="657" y="1095" class="small" text-anchor="middle">线程池耗尽、下游慢、队列堆积不一定是死锁；没有等待环证据，不要贸然下结论</text></svg>