<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">页面置换算法：Belady、Clock/WSClock 与 Linux 回收路径</title><desc id="desc">展示 FIFO 的 Belady 异常示例、Clock/WSClock 的引用位、年龄、脏位决策，以及 Linux active/inactive LRU 的回收链路和观测指标。</desc><defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:600 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.h2{font:700 25px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:700 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:600 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:700 14px &quot;SFMono-Regular&quot;,Consolas,monospace;fill:#0f172a}.amber,.blue,.green{stroke-width:2}.blue,.green{fill:#eff6ff;stroke:#60a5fa}.green{fill:#ecfdf5;stroke:#34d399}.amber{fill:#fffbeb;stroke:#f59e0b}.gray{stroke-width:2}.red{fill:#fef2f2;stroke:#f87171}.red,.violet{stroke-width:2}.gray{fill:#f1f5f9;stroke:#cbd5e1}.violet{fill:#f5f3ff;stroke:#a78bfa}.arrow,.warnArrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}.warnArrow{stroke:#dc2626;marker-end:url(#warnArrow)}</style><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#2563eb" d="M2,2 L10,6 L2,10 Z"/></marker><marker id="warnArrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#dc2626" d="M2,2 L10,6 L2,10 Z"/></marker></defs><rect width="1320" height="1320" class="bg"/><text x="660" y="55" class="title" text-anchor="middle">页面置换不是背算法名：看“用什么信号预测未来”</text><text x="660" y="88" class="subtitle" text-anchor="middle">FIFO 用进入时间，LRU 用最近访问，Clock/WSClock 用硬件位与年龄近似，Linux 用可扩展的回收链表</text><rect width="1204" height="375" x="58" y="120" class="panel" rx="10"/><text x="90" y="162" class="h2">1. 同一访问串：FIFO 可能 Belady，LRU 依赖栈性质</text><text x="98" y="212" class="label">访问串</text><g transform="translate(180 188)"><rect width="54" height="52" x="0" y="0" class="blue" rx="8"/><text x="27" y="33" class="label" text-anchor="middle">1</text><rect width="54" height="52" x="66" y="0" class="blue" rx="8"/><text x="93" y="33" class="label" text-anchor="middle">2</text><rect width="54" height="52" x="132" y="0" class="blue" rx="8"/><text x="159" y="33" class="label" text-anchor="middle">3</text><rect width="54" height="52" x="198" y="0" class="blue" rx="8"/><text x="225" y="33" class="label" text-anchor="middle">4</text><rect width="54" height="52" x="264" y="0" class="blue" rx="8"/><text x="291" y="33" class="label" text-anchor="middle">1</text><rect width="54" height="52" x="330" y="0" class="blue" rx="8"/><text x="357" y="33" class="label" text-anchor="middle">2</text><rect width="54" height="52" x="396" y="0" class="blue" rx="8"/><text x="423" y="33" class="label" text-anchor="middle">5</text><rect width="54" height="52" x="462" y="0" class="blue" rx="8"/><text x="489" y="33" class="label" text-anchor="middle">1</text><rect width="54" height="52" x="528" y="0" class="blue" rx="8"/><text x="555" y="33" class="label" text-anchor="middle">2</text><rect width="54" height="52" x="594" y="0" class="blue" rx="8"/><text x="621" y="33" class="label" text-anchor="middle">3</text><rect width="54" height="52" x="660" y="0" class="blue" rx="8"/><text x="687" y="33" class="label" text-anchor="middle">4</text><rect width="54" height="52" x="726" y="0" class="blue" rx="8"/><text x="753" y="33" class="label" text-anchor="middle">5</text></g><rect width="355" height="150" x="95" y="282" class="gray" rx="8"/><text x="272" y="315" class="label" text-anchor="middle">FIFO：按进入时间淘汰</text><text x="272" y="350" class="text" text-anchor="middle">3 页框缺页：9 次</text><text x="272" y="380" class="text" text-anchor="middle">4 页框缺页：10 次</text><text x="272" y="410" class="tiny" text-anchor="middle">页框变多反而更差，这就是 Belady 异常</text><rect width="355" height="150" x="482" y="282" class="green" rx="8"/><text x="659" y="315" class="label" text-anchor="middle">LRU：按最近访问淘汰</text><text x="659" y="350" class="text" text-anchor="middle">3 页框缺页：10 次</text><text x="659" y="380" class="text" text-anchor="middle">4 页框缺页：8 次</text><text x="659" y="410" class="tiny" text-anchor="middle">N 页框驻留集合包含于 N+1 页框集合</text><rect width="325" height="150" x="869" y="282" class="amber" rx="8"/><text x="1031" y="315" class="label" text-anchor="middle">核心结论</text><text x="1031" y="350" class="text" text-anchor="middle">Belady 只由非栈性质算法触发</text><text x="1031" y="380" class="text" text-anchor="middle">Clock 不是精确栈算法</text><text x="1031" y="410" class="tiny" text-anchor="middle">真实系统更看扫描成本与写回成本</text><rect width="1204" height="390" x="58" y="535" class="panel" rx="10"/><text x="90" y="577" class="h2">2. Clock/WSClock：只在缺页路径扫描，用硬件位近似“最近性”</text><circle cx="260" cy="750" r="100" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><path d="M260 750 L328 704" class="warnArrow"/><circle cx="260" cy="627" r="38" class="blue"/><text x="260" y="622" class="mono" text-anchor="middle">P1</text><text x="260" y="644" class="tiny" text-anchor="middle">R=1 D=0</text><circle cx="370" cy="690" r="38" class="amber"/><text x="370" y="685" class="mono" text-anchor="middle">P2</text><text x="370" y="707" class="tiny" text-anchor="middle">R=0 D=1</text><circle cx="370" cy="810" r="38" class="green"/><text x="370" y="805" class="mono" text-anchor="middle">P3</text><text x="370" y="827" class="tiny" text-anchor="middle">R=0 D=0</text><circle cx="260" cy="872" r="38" class="violet"/><text x="260" y="867" class="mono" text-anchor="middle">P4</text><text x="260" y="889" class="tiny" text-anchor="middle">young</text><circle cx="150" cy="810" r="38" class="blue"/><text x="150" y="805" class="mono" text-anchor="middle">P5</text><text x="150" y="827" class="tiny" text-anchor="middle">R=1 D=1</text><circle cx="150" cy="690" r="38" class="green"/><text x="150" y="685" class="mono" text-anchor="middle">P6</text><text x="150" y="707" class="tiny" text-anchor="middle">old clean</text><text x="260" y="753" class="label" text-anchor="middle">hand</text><text x="260" y="777" class="tiny" text-anchor="middle">扫描候选页框</text><rect width="285" height="75" x="510" y="625" class="blue" rx="8"/><text x="652" y="654" class="label" text-anchor="middle">R=1</text><text x="652" y="680" class="text" text-anchor="middle">清引用位，给第二次机会</text><path d="M798 662 H855" class="arrow"/><rect width="285" height="75" x="860" y="625" class="violet" rx="8"/><text x="1002" y="654" class="label" text-anchor="middle">R=0 且年龄未超窗口</text><text x="1002" y="680" class="text" text-anchor="middle">仍属于工作集，跳过</text><rect width="285" height="75" x="510" y="747" class="amber" rx="8"/><text x="652" y="776" class="label" text-anchor="middle">R=0、老页、脏页</text><text x="652" y="802" class="text" text-anchor="middle">发起写回，继续找牺牲页</text><path d="M798 784 H855" class="arrow"/><rect width="285" height="75" x="860" y="747" class="green" rx="8"/><text x="1002" y="776" class="label" text-anchor="middle">R=0、老页、干净</text><text x="1002" y="802" class="text" text-anchor="middle">选择牺牲页，换入目标页</text><text x="830" y="878" class="tiny" text-anchor="middle">WSClock 比 Clock 多看年龄；改进型 Clock 多看 Dirty 位，目标是减少无意义换出和同步写回</text><rect width="1204" height="370" x="58" y="940" class="panel" rx="10"/><text x="90" y="982" class="h2">3. Linux active/inactive LRU：工程目标是可扩展回收，不是精确 LRU</text><rect width="210" height="88" x="95" y="1032" class="red" rx="8"/><text x="200" y="1062" class="label" text-anchor="middle">内存压力</text><text x="200" y="1090" class="tiny" text-anchor="middle">缺页 / 分配失败 / memcg limit</text><path d="M308 1076 H370" class="warnArrow"/><rect width="230" height="88" x="375" y="1032" class="blue" rx="8"/><text x="490" y="1062" class="label" text-anchor="middle">扫描 inactive</text><text x="490" y="1090" class="tiny" text-anchor="middle">kswapd 或 direct reclaim</text><path d="M608 1076 H670" class="arrow"/><rect width="230" height="88" x="675" y="1032" class="green" rx="8"/><text x="790" y="1062" class="label" text-anchor="middle">最近访问过</text><text x="790" y="1090" class="tiny" text-anchor="middle">重新激活到 active</text><path d="M908 1076 H970" class="arrow"/><rect width="220" height="88" x="975" y="1032" class="amber" rx="8"/><text x="1085" y="1062" class="label" text-anchor="middle">未访问候选页</text><text x="1085" y="1090" class="tiny" text-anchor="middle">按文件/匿名/脏页处理</text><rect width="250" height="75" x="95" y="1155" class="green" rx="8"/><text x="220" y="1183" class="label" text-anchor="middle">干净文件页</text><text x="220" y="1209" class="tiny" text-anchor="middle">可丢弃，需要时从文件重读</text><rect width="250" height="75" x="380" y="1155" class="amber" rx="8"/><text x="505" y="1183" class="label" text-anchor="middle">脏文件页</text><text x="505" y="1209" class="tiny" text-anchor="middle">writeback 后才能安全回收</text><rect width="250" height="75" x="665" y="1155" class="violet" rx="8"/><text x="790" y="1183" class="label" text-anchor="middle">匿名页</text><text x="790" y="1209" class="tiny" text-anchor="middle">通常需要 swap 才能换出</text><rect width="245" height="75" x="950" y="1155" class="gray" rx="8"/><text x="1072" y="1183" class="label" text-anchor="middle">观测证据</text><text x="1072" y="1209" class="tiny" text-anchor="middle">pgscan / pgsteal / pgmajfault</text><rect width="1100" height="42" x="95" y="1255" class="gray" rx="8"/><text x="645" y="1282" class="text" text-anchor="middle">线上结论必须串起：工作集是否超内存 → major fault / swap / writeback / direct reclaim → P99 延迟是否同步抬升</text></svg>