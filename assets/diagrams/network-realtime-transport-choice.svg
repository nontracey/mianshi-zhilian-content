<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">短轮询、长轮询、SSE 与 WebSocket 选型图</title><desc id="desc">对比短轮询、长轮询、SSE、WebSocket 的报文时序、选型决策和生产风险，包括代理缓冲、空闲超时、消息补拉和跨实例广播。</desc><defs><marker id="arrow-blue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#059669" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.title{font:800 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.panel-title{font:750 27px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:750 20px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1e293b}.small{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.tiny-strong{font:750 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.poll{fill:#eff6ff;stroke:#60a5fa}.gray,.poll,.risk,.sse,.ws{stroke-width:2;rx:14}.sse{fill:#ecfdf5;stroke:#34d399}.ws{fill:#fff7ed;stroke:#fb923c}.risk{fill:#fef2f2;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#cbd5e1}.line-blue,.line-green{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow-blue)}.line-green{stroke:#059669;marker-end:url(#arrow-green)}.dash{stroke-dasharray:8 8}</style></defs><rect width="1320" height="1320" class="bg"/><text x="660" y="56" class="title" text-anchor="middle">实时推送选型：先方向，再频率，再网络环境</text><text x="660" y="90" class="subtitle" text-anchor="middle">短轮询、长轮询、SSE、WebSocket 不是“越新越好”，差别在时序、恢复能力和运维成本</text><rect width="1200" height="390" x="60" y="125" class="panel"/><text x="92" y="168" class="panel-title">1. 四种报文时序：谁在等待，谁在持续流</text><rect width="255" height="110" x="95" y="205" class="poll"/><text x="222" y="234" class="label" text-anchor="middle">短轮询</text><text x="222" y="260" class="tiny" text-anchor="middle">每隔 N 秒发 GET</text><text x="222" y="284" class="tiny" text-anchor="middle">平均等待约 N/2</text><rect width="255" height="110" x="385" y="205" class="poll"/><text x="512" y="234" class="label" text-anchor="middle">长轮询</text><text x="512" y="260" class="tiny" text-anchor="middle">服务端 hold 请求</text><text x="512" y="284" class="tiny" text-anchor="middle">事件或超时后返回</text><rect width="255" height="110" x="675" y="205" class="sse"/><text x="802" y="234" class="label" text-anchor="middle">SSE</text><text x="802" y="260" class="tiny" text-anchor="middle">一次 GET 持续下行</text><text x="802" y="284" class="tiny" text-anchor="middle">id / data / retry</text><rect width="255" height="110" x="965" y="205" class="ws"/><text x="1092" y="234" class="label" text-anchor="middle">WebSocket</text><text x="1092" y="260" class="tiny" text-anchor="middle">Upgrade 后双向帧</text><text x="1092" y="284" class="tiny" text-anchor="middle">text / binary / ping</text><rect width="255" height="92" x="95" y="350" class="gray"/><text x="222" y="376" class="tiny-strong" text-anchor="middle">GET, 200, sleep, repeat</text><text x="222" y="400" class="tiny" text-anchor="middle">低频状态、可容忍秒级延迟</text><rect width="255" height="92" x="385" y="350" class="gray"/><text x="512" y="376" class="tiny-strong" text-anchor="middle">GET held 25-30s</text><text x="512" y="400" class="tiny" text-anchor="middle">兼容兜底，待决请求多</text><rect width="255" height="92" x="675" y="350" class="gray"/><text x="802" y="376" class="tiny-strong" text-anchor="middle">text/event-stream</text><text x="802" y="400" class="tiny" text-anchor="middle">单向流、自动重连、Last-Event-ID</text><rect width="255" height="92" x="965" y="350" class="gray"/><text x="1092" y="376" class="tiny-strong" text-anchor="middle">101 + WS frames</text><text x="1092" y="400" class="tiny" text-anchor="middle">双向实时、需自管可靠性</text><rect width="1200" height="330" x="60" y="550" class="panel"/><text x="92" y="593" class="panel-title">2. 选型决策树：不要默认 WebSocket</text><rect width="250" height="78" x="95" y="635" class="gray"/><text x="220" y="666" class="label" text-anchor="middle">需要实时上行？</text><text x="220" y="692" class="tiny" text-anchor="middle">IM、协同、游戏、信令</text><path d="M 350 674 L 475 674" class="line-green"/><rect width="230" height="78" x="480" y="635" class="ws"/><text x="595" y="666" class="label" text-anchor="middle">选 WebSocket</text><text x="595" y="692" class="tiny" text-anchor="middle">双向、二进制、业务 ack</text><path d="M 220 718 L 220 775 L 355 775" class="line-blue dash"/><rect width="250" height="78" x="360" y="735" class="gray"/><text x="485" y="766" class="label" text-anchor="middle">只需要下行流？</text><text x="485" y="792" class="tiny" text-anchor="middle">通知、行情、LLM token</text><path d="M 615 774 L 735 774" class="line-green"/><rect width="220" height="78" x="740" y="735" class="sse"/><text x="850" y="766" class="label" text-anchor="middle">优先 SSE</text><text x="850" y="792" class="tiny" text-anchor="middle">HTTP 友好、自带重连</text><rect width="250" height="78" x="795" y="635" class="gray"/><text x="920" y="666" class="label" text-anchor="middle">低频可等待？</text><text x="920" y="692" class="tiny" text-anchor="middle">30s 级状态刷新</text><path d="M 1050 674 L 1120 674" class="line-blue"/><rect width="95" height="78" x="1125" y="635" class="poll"/><text x="1172" y="666" class="tiny-strong" text-anchor="middle">短轮询</text><text x="1172" y="692" class="tiny" text-anchor="middle">最简单</text><rect width="230" height="78" x="990" y="735" class="gray"/><text x="1105" y="766" class="label" text-anchor="middle">代理/旧环境受限？</text><text x="1105" y="792" class="tiny" text-anchor="middle">Upgrade 或 EventSource 不稳</text><path d="M 1105 815 L 1105 822" class="line-blue dash"/><rect width="230" height="42" x="990" y="825" class="poll"/><text x="1105" y="852" class="tiny-strong" text-anchor="middle">长轮询兜底</text><rect width="1200" height="285" x="60" y="915" class="panel"/><text x="92" y="958" class="panel-title">3. 生产风险：协议能连上，不等于消息可靠</text><rect width="250" height="78" x="95" y="1000" class="risk"/><text x="220" y="1031" class="label" text-anchor="middle">代理缓冲</text><text x="220" y="1057" class="tiny" text-anchor="middle">SSE 关 buffering，禁缓存</text><rect width="250" height="78" x="385" y="1000" class="risk"/><text x="510" y="1031" class="label" text-anchor="middle">空闲超时</text><text x="510" y="1057" class="tiny" text-anchor="middle">服务端心跳小于 idle timeout</text><rect width="250" height="78" x="675" y="1000" class="risk"/><text x="800" y="1031" class="label" text-anchor="middle">断线缺口</text><text x="800" y="1057" class="tiny" text-anchor="middle">sequence / Last-Event-ID 补拉</text><rect width="255" height="78" x="965" y="1000" class="risk"/><text x="1092" y="1031" class="label" text-anchor="middle">多实例</text><text x="1092" y="1057" class="tiny" text-anchor="middle">外部化订阅或消息总线</text><rect width="1125" height="52" x="95" y="1120" class="gray"/><text x="657" y="1142" class="small" text-anchor="middle">选型口诀：双向实时 WebSocket；单向流 SSE；低频短轮询；被代理限制或旧环境用长轮询兜底</text><text x="657" y="1164" class="tiny" text-anchor="middle">可靠性靠业务层：ack、游标、补拉、幂等和退避，而不是靠“长连接”三个字自动保证</text></svg>