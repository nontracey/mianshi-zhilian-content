<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">Spring AOP 代理创建、通知链与自调用边界</title>
  <desc id="desc">展示 Spring AOP 从 Advisor 匹配、代理选择、容器暴露代理，到外部调用进入 MethodInvocation 通知链，以及 this 自调用、final/private 方法和 AspectJ 织入边界。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .box-title { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 13px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .blue { fill: #e8f2ff; stroke: #60a5fa; stroke-width: 2; rx: 12; }
      .green { fill: #e8f8ef; stroke: #4ade80; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff7d6; stroke: #facc15; stroke-width: 2; rx: 12; }
      .orange { fill: #fff1e6; stroke: #fb923c; stroke-width: 2; rx: 12; }
      .red { fill: #feecec; stroke: #f87171; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #b45309; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">Spring AOP：代理语义决定增强能不能执行</text>
  <text x="50" y="86" class="subtitle">关键不是“注解写没写”，而是 Bean 是否被代理、调用是否进入代理、方法是否可被代理覆盖。</text>

  <rect x="40" y="120" width="1200" height="270" class="panel"/>
  <text x="68" y="156" class="panel-title">1. Bean 后置处理阶段：从 Advisor 到代理对象</text>
  <rect x="78" y="220" width="165" height="66" class="blue"/>
  <text x="113" y="246" class="box-title">目标 Bean</text>
  <text x="100" y="268" class="tiny">依赖注入和 init 已完成</text>
  <rect x="292" y="220" width="210" height="66" class="yellow"/>
  <text x="322" y="246" class="box-title">AutoProxyCreator</text>
  <text x="316" y="268" class="tiny">查找可用 Advisor</text>
  <rect x="552" y="220" width="185" height="66" class="green"/>
  <text x="588" y="246" class="box-title">Pointcut 匹配</text>
  <text x="582" y="268" class="tiny">只匹配方法执行</text>
  <rect x="787" y="220" width="170" height="66" class="orange"/>
  <text x="820" y="246" class="box-title">选择代理</text>
  <text x="812" y="268" class="tiny">JDK 或 CGLIB</text>
  <rect x="1008" y="220" width="160" height="66" class="red"/>
  <text x="1040" y="246" class="box-title">暴露代理</text>
  <text x="1032" y="268" class="tiny">容器返回的是 proxy</text>
  <line x1="243" y1="253" x2="292" y2="253" class="line"/>
  <line x1="502" y1="253" x2="552" y2="253" class="line"/>
  <line x1="737" y1="253" x2="787" y2="253" class="line"/>
  <line x1="957" y1="253" x2="1008" y2="253" class="line"/>
  <text x="78" y="345" class="small">Spring Framework 文档强调：核心框架倾向接口代理；Boot 常见默认配置会让 class-based proxy 打开。配置会合并到统一的 auto-proxy creator。</text>

  <rect x="40" y="430" width="1200" height="405" class="panel"/>
  <text x="68" y="466" class="panel-title">2. 外部调用经过代理：MethodInvocation 通知链包住目标方法</text>
  <rect x="80" y="552" width="165" height="66" class="blue"/>
  <text x="124" y="578" class="box-title">Client</text>
  <text x="104" y="600" class="tiny">拿到容器中的 Bean</text>
  <rect x="302" y="552" width="170" height="66" class="red"/>
  <text x="348" y="578" class="box-title">Proxy</text>
  <text x="326" y="600" class="tiny">JdkDynamic / CGLIB</text>
  <rect x="530" y="515" width="155" height="58" class="yellow"/>
  <text x="570" y="539" class="box-title">@Around</text>
  <text x="558" y="558" class="tiny">可决定 proceed</text>
  <rect x="730" y="515" width="145" height="58" class="green"/>
  <text x="772" y="539" class="box-title">@Before</text>
  <text x="754" y="558" class="tiny">进入前增强</text>
  <rect x="920" y="515" width="155" height="58" class="orange"/>
  <text x="960" y="539" class="box-title">Target</text>
  <text x="942" y="558" class="tiny">真实业务方法</text>
  <rect x="730" y="655" width="145" height="58" class="green"/>
  <text x="760" y="679" class="box-title">@After...</text>
  <text x="754" y="698" class="tiny">返回或异常分支</text>
  <rect x="530" y="655" width="155" height="58" class="yellow"/>
  <text x="568" y="679" class="box-title">@Around</text>
  <text x="552" y="698" class="tiny">返回值由它交给调用方</text>
  <line x1="245" y1="585" x2="302" y2="585" class="line"/>
  <line x1="472" y1="585" x2="530" y2="546" class="line"/>
  <line x1="685" y1="544" x2="730" y2="544" class="line"/>
  <line x1="875" y1="544" x2="920" y2="544" class="line"/>
  <path d="M998,573 C998,640 875,658 875,684" class="line"/>
  <line x1="730" y1="684" x2="685" y2="684" class="line"/>
  <path d="M530,684 C444,684 413,640 387,618" class="line"/>
  <text x="80" y="782" class="small">同一个 join point 上有多个切面时按优先级组成链；高优先级先进入，返回路径上后退出。@Around 不调用 proceed 时目标方法不会运行。</text>

  <rect x="40" y="875" width="585" height="255" class="panel"/>
  <text x="68" y="911" class="panel-title">3. this 自调用：从目标对象内部绕过代理</text>
  <rect x="82" y="970" width="160" height="62" class="orange"/>
  <text x="118" y="995" class="box-title">Target.foo()</text>
  <text x="104" y="1016" class="tiny">已经进入真实对象</text>
  <rect x="360" y="970" width="180" height="62" class="red"/>
  <text x="397" y="995" class="box-title">this.bar()</text>
  <text x="384" y="1016" class="tiny">直接调本对象方法</text>
  <line x1="242" y1="1001" x2="360" y2="1001" class="line-red"/>
  <text x="82" y="1078" class="small">这里不会回到 proxy，所以 bar 上的事务、缓存、权限、日志增强不会被触发。</text>
  <text x="82" y="1105" class="small">优先拆 Bean 或注入自身代理；AopContext.currentProxy 需要暴露代理且会耦合代码。</text>

  <rect x="655" y="875" width="585" height="255" class="panel"/>
  <text x="683" y="911" class="panel-title">4. 能力边界和排查顺序</text>
  <rect x="692" y="958" width="210" height="60" class="gray"/>
  <text x="732" y="982" class="box-title">final / private</text>
  <text x="718" y="1002" class="tiny">CGLIB 无法覆盖增强</text>
  <rect x="958" y="958" width="210" height="60" class="yellow"/>
  <text x="1003" y="982" class="box-title">非容器对象</text>
  <text x="986" y="1002" class="tiny">没有进入代理创建链</text>
  <rect x="692" y="1045" width="210" height="60" class="green"/>
  <text x="736" y="1069" class="box-title">AspectJ</text>
  <text x="712" y="1089" class="tiny">字节码织入可覆盖更多点</text>
  <rect x="958" y="1045" width="210" height="60" class="blue"/>
  <text x="1001" y="1069" class="box-title">排查抓手</text>
  <text x="982" y="1089" class="tiny">代理类型、切点、调用入口</text>

  <rect x="40" y="1170" width="1200" height="64" class="panel"/>
  <text x="68" y="1207" class="panel-title">回答抓手</text>
  <text x="190" y="1207" class="small">Advisor 匹配 -> JDK/CGLIB 代理 -> MethodInvocation 通知链 -> proceed -> 目标方法 -> 返回/异常通知 -> this/final/private/非容器边界 -> AspectJ 取舍。</text>
</svg>
