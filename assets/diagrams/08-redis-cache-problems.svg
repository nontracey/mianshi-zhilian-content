<svg width="100%" aria-label="Redis缓存问题示意图" role="img" viewBox="0 0 680 395"><title>Redis缓存问题示意图</title><desc>穿透、雪崩、击穿的原因与解决方案</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="340" y="24" fill="#042C53" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">Redis 缓存三大问题</text><rect width="600" height="95" x="40" y="50" fill="#E6F1FB" stroke="#378ADD" stroke-width=".5" rx="10"/><text x="160" y="72" fill="#042C53" font-family="system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="middle">缓存穿透</text><text x="160" y="92" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">查询不存在的数据</text><text x="440" y="72" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">原因:</text><text x="440" y="90" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">缓存和DB都没有</text><text x="440" y="110" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">解决:</text><text x="440" y="128" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">布隆过滤器 / 空值缓存</text><rect width="600" height="95" x="40" y="160" fill="#FAEEDA" stroke="#BA7517" stroke-width=".5" rx="10"/><text x="160" y="182" fill="#042C53" font-family="system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="middle">缓存雪崩</text><text x="160" y="202" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">大量key同时过期</text><text x="440" y="182" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">原因:</text><text x="440" y="200" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">缓存集中失效</text><text x="440" y="220" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">解决:</text><text x="440" y="238" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">随机过期时间 / 多级缓存</text><rect width="600" height="95" x="40" y="270" fill="#FCEBEB" stroke="#A32D2D" stroke-width=".5" rx="10"/><text x="160" y="292" fill="#042C53" font-family="system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="middle">缓存击穿</text><text x="160" y="312" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">热点key过期</text><text x="440" y="292" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">原因:</text><text x="440" y="310" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">并发查询同一key</text><text x="440" y="330" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">解决:</text><text x="440" y="348" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">互斥锁 / 永不过期+异步更新</text></svg>