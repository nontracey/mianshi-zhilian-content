<svg viewBox="0 0 680 395" width="100%" role="img" aria-label="Redis缓存问题示意图">
<title>Redis缓存问题示意图</title><desc>穿透、雪崩、击穿的原因与解决方案</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Redis 缓存三大问题</text>
<rect x="40" y="50" width="600" height="95" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="160" y="72" text-anchor="middle" font-size="15" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">缓存穿透</text>
<text x="160" y="92" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">查询不存在的数据</text>
<text x="440" y="72" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">原因:</text>
<text x="440" y="90" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">缓存和DB都没有</text>
<text x="440" y="110" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">解决:</text>
<text x="440" y="128" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">布隆过滤器 / 空值缓存</text>
<rect x="40" y="160" width="600" height="95" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="160" y="182" text-anchor="middle" font-size="15" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">缓存雪崩</text>
<text x="160" y="202" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">大量key同时过期</text>
<text x="440" y="182" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">原因:</text>
<text x="440" y="200" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">缓存集中失效</text>
<text x="440" y="220" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">解决:</text>
<text x="440" y="238" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">随机过期时间 / 多级缓存</text>
<rect x="40" y="270" width="600" height="95" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="160" y="292" text-anchor="middle" font-size="15" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">缓存击穿</text>
<text x="160" y="312" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">热点key过期</text>
<text x="440" y="292" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">原因:</text>
<text x="440" y="310" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">并发查询同一key</text>
<text x="440" y="330" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">解决:</text>
<text x="440" y="348" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">互斥锁 / 永不过期+异步更新</text>
</svg>