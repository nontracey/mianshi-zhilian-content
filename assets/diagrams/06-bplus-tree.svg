<svg width="100%" aria-label="B+树结构图" role="img" viewBox="0 0 680 325"><title>B+树结构图</title><desc>MySQL InnoDB索引的底层数据结构</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="340" y="24" fill="#042C53" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">B+树结构</text><text x="340" y="44" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">MySQL InnoDB 索引结构</text><rect width="240" height="36" x="220" y="64" fill="#EEEDFE" stroke="#7F77DD" stroke-width=".5" rx="8"/><text x="340" y="86" fill="#26215C" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">[10 | 30 | 50] 非叶子节点只存Key</text><rect width="120" height="36" x="80" y="140" fill="#E6F1FB" stroke="#378ADD" stroke-width=".5" rx="8"/><text x="140" y="162" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">[1-9]</text><line x1="340" x2="140" y1="100" y2="140" stroke="#7F77DD" stroke-width=".8"/><rect width="120" height="36" x="225" y="140" fill="#E1F5EE" stroke="#378ADD" stroke-width=".5" rx="8"/><text x="285" y="162" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">[10-29]</text><line x1="340" x2="285" y1="100" y2="140" stroke="#7F77DD" stroke-width=".8"/><rect width="120" height="36" x="370" y="140" fill="#FAEEDA" stroke="#378ADD" stroke-width=".5" rx="8"/><text x="430" y="162" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">[30-49]</text><line x1="340" x2="430" y1="100" y2="140" stroke="#7F77DD" stroke-width=".8"/><rect width="120" height="36" x="515" y="140" fill="#FCEBEB" stroke="#378ADD" stroke-width=".5" rx="8"/><text x="575" y="162" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">[50-70]</text><line x1="340" x2="575" y1="100" y2="140" stroke="#7F77DD" stroke-width=".8"/><line x1="200" x2="225" y1="158" y2="158" stroke="#1D9E75" stroke-width="1" marker-end="url(#a)"/><line x1="345" x2="370" y1="158" y2="158" stroke="#1D9E75" stroke-width="1" marker-end="url(#a)"/><line x1="490" x2="515" y1="158" y2="158" stroke="#1D9E75" stroke-width="1" marker-end="url(#a)"/><text x="340" y="200" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">叶子节点通过链表相连，支持范围查询</text><rect width="520" height="80" x="80" y="224" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="10"/><text x="340" y="244" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">B+树特点</text><text x="340" y="264" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">非叶子节点只存Key，叶子节点存数据+链表指针</text><text x="340" y="282" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">树高通常3-4层，亿级数据只需3-4次IO</text><text x="340" y="298" fill="#888780" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">聚簇索引叶子存整行，二级索引叶子存主键</text></svg>