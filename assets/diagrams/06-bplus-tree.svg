<svg viewBox="0 0 680 325" width="100%" role="img" aria-label="B+树结构图">
<title>B+树结构图</title><desc>MySQL InnoDB索引的底层数据结构</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">B+树结构</text>
<text x="340" y="44" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">MySQL InnoDB 索引结构</text>
<rect x="220" y="64" width="240" height="36" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="340" y="86" text-anchor="middle" font-size="12" font-weight="500" fill="#26215C" font-family="system-ui, sans-serif">[10 | 30 | 50]  非叶子节点只存Key</text>
<rect x="80" y="140" width="120" height="36" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="140" y="162" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">[1-9]</text>
<line x1="340" y1="100" x2="140" y2="140" stroke="#7F77DD" stroke-width="0.8"/>
<rect x="225" y="140" width="120" height="36" rx="8" fill="#E1F5EE" stroke="#378ADD" stroke-width="0.5"/>
<text x="285" y="162" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">[10-29]</text>
<line x1="340" y1="100" x2="285" y2="140" stroke="#7F77DD" stroke-width="0.8"/>
<rect x="370" y="140" width="120" height="36" rx="8" fill="#FAEEDA" stroke="#378ADD" stroke-width="0.5"/>
<text x="430" y="162" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">[30-49]</text>
<line x1="340" y1="100" x2="430" y2="140" stroke="#7F77DD" stroke-width="0.8"/>
<rect x="515" y="140" width="120" height="36" rx="8" fill="#FCEBEB" stroke="#378ADD" stroke-width="0.5"/>
<text x="575" y="162" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">[50-70]</text>
<line x1="340" y1="100" x2="575" y2="140" stroke="#7F77DD" stroke-width="0.8"/>
<line x1="200" y1="158" x2="225" y2="158" stroke="#1D9E75" stroke-width="1" marker-end="url(#a)"/>
<line x1="345" y1="158" x2="370" y2="158" stroke="#1D9E75" stroke-width="1" marker-end="url(#a)"/>
<line x1="490" y1="158" x2="515" y2="158" stroke="#1D9E75" stroke-width="1" marker-end="url(#a)"/>
<text x="340" y="200" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">叶子节点通过链表相连，支持范围查询</text>
<rect x="80" y="224" width="520" height="80" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="244" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">B+树特点</text>
<text x="340" y="264" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">非叶子节点只存Key，叶子节点存数据+链表指针</text>
<text x="340" y="282" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">树高通常3-4层，亿级数据只需3-4次IO</text>
<text x="340" y="298" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">聚簇索引叶子存整行，二级索引叶子存主键</text>
</svg>