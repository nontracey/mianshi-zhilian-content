<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">从输入 URL 到首屏渲染的网络与浏览器流水线</title>
  <desc id="desc">展示 URL 导航时浏览器如何先做缓存和 Service Worker 判定，再经过 DNS、连接、HTTP/CDN，随后 HTML 流式解析、预加载扫描、构建 DOM/CSSOM、布局绘制并产出 LCP/INP/CLS 指标。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .title { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .panel-title { font: 750 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 750 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .net { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 14; }
      .cache { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; rx: 14; }
      .render { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 14; }
      .metric { fill: #fef2f2; stroke: #f87171; stroke-width: 2; rx: 14; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .line-blue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .line-green { stroke: #059669; stroke-width: 4; fill: none; marker-end: url(#arrow-green); }
      .line-dash { stroke: #64748b; stroke-width: 3; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="660" y="56" text-anchor="middle">URL 到首屏：网络瀑布和渲染流水线是重叠的</text>
  <text class="subtitle" x="660" y="90" text-anchor="middle">不要背成线性清单：缓存可直接短路网络，HTML 到达后 parser、preload scanner 与资源下载会并行推进</text>

  <rect class="panel" x="60" y="125" width="1200" height="315"/>
  <text class="panel-title" x="92" y="168">1. 导航请求的网络路径</text>
  <rect class="cache" x="95" y="205" width="175" height="76"/>
  <text class="label" x="182" y="236" text-anchor="middle">URL / 缓存</text>
  <text class="tiny" x="182" y="262" text-anchor="middle">HSTS、SW、强缓存</text>
  <path class="line-blue" d="M 275 243 L 355 243"/>
  <rect class="net" x="360" y="205" width="150" height="76"/>
  <text class="label" x="435" y="236" text-anchor="middle">DNS</text>
  <text class="tiny" x="435" y="262" text-anchor="middle">缓存或递归解析</text>
  <path class="line-blue" d="M 515 243 L 595 243"/>
  <rect class="net" x="600" y="205" width="175" height="76"/>
  <text class="label" x="687" y="236" text-anchor="middle">连接</text>
  <text class="tiny" x="687" y="262" text-anchor="middle">TCP+TLS 或 QUIC</text>
  <path class="line-blue" d="M 780 243 L 860 243"/>
  <rect class="net" x="865" y="205" width="165" height="76"/>
  <text class="label" x="947" y="236" text-anchor="middle">HTTP/CDN</text>
  <text class="tiny" x="947" y="262" text-anchor="middle">HIT、304 或回源</text>
  <path class="line-blue" d="M 1035 243 L 1115 243"/>
  <rect class="render" x="1120" y="205" width="105" height="76"/>
  <text class="label" x="1172" y="236" text-anchor="middle">HTML</text>
  <text class="tiny" x="1172" y="262" text-anchor="middle">流式到达</text>

  <rect class="gray" x="95" y="320" width="1130" height="54"/>
  <text class="small" x="660" y="342" text-anchor="middle">冷启动 TTFB = DNS/连接/请求传输/服务端处理/响应首字节的叠加；连接复用、缓存命中或 0-RTT 会改变公式</text>
  <text class="tiny" x="660" y="365" text-anchor="middle">DevTools Network 里分别看 DNS Lookup、Initial connection、SSL、Waiting for server response、Content Download</text>

  <rect class="panel" x="60" y="475" width="1200" height="360"/>
  <text class="panel-title" x="92" y="518">2. HTML 到达后，解析和资源发现并行</text>
  <rect class="render" x="105" y="560" width="185" height="76"/>
  <text class="label" x="197" y="590" text-anchor="middle">HTML parser</text>
  <text class="tiny" x="197" y="616" text-anchor="middle">构建 DOM</text>
  <path class="line-green" d="M 295 598 L 390 598"/>
  <rect class="render" x="395" y="560" width="170" height="76"/>
  <text class="label" x="480" y="590" text-anchor="middle">CSSOM</text>
  <text class="tiny" x="480" y="616" text-anchor="middle">样式规则完成</text>
  <path class="line-green" d="M 570 598 L 665 598"/>
  <rect class="render" x="670" y="560" width="160" height="76"/>
  <text class="label" x="750" y="590" text-anchor="middle">Layout</text>
  <text class="tiny" x="750" y="616" text-anchor="middle">几何尺寸</text>
  <path class="line-green" d="M 835 598 L 930 598"/>
  <rect class="render" x="935" y="560" width="160" height="76"/>
  <text class="label" x="1015" y="590" text-anchor="middle">Paint</text>
  <text class="tiny" x="1015" y="616" text-anchor="middle">绘制与合成</text>

  <rect class="net" x="260" y="700" width="270" height="70"/>
  <text class="label" x="395" y="728" text-anchor="middle">preload scanner</text>
  <text class="tiny" x="395" y="753" text-anchor="middle">主 parser 被阻塞时仍可发现资源</text>
  <path class="line-dash" d="M 395 695 L 395 645"/>
  <path class="line-blue" d="M 535 735 L 770 735"/>
  <rect class="net" x="775" y="700" width="270" height="70"/>
  <text class="label" x="910" y="728" text-anchor="middle">CSS / JS / 图片</text>
  <text class="tiny" x="910" y="753" text-anchor="middle">preload、preconnect、lazy loading</text>

  <rect class="panel" x="60" y="870" width="1200" height="190"/>
  <text class="panel-title" x="92" y="913">3. 指标定位：把问题落到阶段</text>
  <rect class="metric" x="115" y="948" width="290" height="72"/>
  <text class="label" x="260" y="977" text-anchor="middle">LCP</text>
  <text class="tiny" x="260" y="1003" text-anchor="middle">网络、服务端、渲染关键资源</text>
  <rect class="metric" x="515" y="948" width="290" height="72"/>
  <text class="label" x="660" y="977" text-anchor="middle">INP</text>
  <text class="tiny" x="660" y="1003" text-anchor="middle">主线程长任务、事件回调、重绘</text>
  <rect class="metric" x="915" y="948" width="290" height="72"/>
  <text class="label" x="1060" y="977" text-anchor="middle">CLS</text>
  <text class="tiny" x="1060" y="1003" text-anchor="middle">图片尺寸、字体、异步插入内容</text>
</svg>
