<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">从输入 URL 到首屏渲染的网络与浏览器流水线</title><desc id="desc">展示 URL 导航时浏览器如何先做缓存和 Service Worker 判定，再经过 DNS、连接、HTTP/CDN，随后 HTML 流式解析、预加载扫描、构建 DOM/CSSOM、布局绘制并产出 LCP/INP/CLS 指标。</desc><defs><marker id="arrow-blue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#059669" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.title{font:800 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.panel-title{font:750 27px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:750 20px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1e293b}.small{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.cache,.net{stroke-width:2;rx:14}.net{fill:#eff6ff;stroke:#60a5fa}.cache{fill:#fffbeb;stroke:#f59e0b}.gray,.metric,.render{stroke-width:2;rx:14}.render{fill:#ecfdf5;stroke:#34d399}.metric{fill:#fef2f2;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#cbd5e1}.line-blue,.line-green{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow-blue)}.line-green{stroke:#059669;marker-end:url(#arrow-green)}.line-dash{stroke:#64748b;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow-blue)}</style></defs><rect width="1320" height="1320" class="bg"/><text x="660" y="56" class="title" text-anchor="middle">URL 到首屏：网络瀑布和渲染流水线是重叠的</text><text x="660" y="90" class="subtitle" text-anchor="middle">不要背成线性清单：缓存可直接短路网络，HTML 到达后 parser、preload scanner 与资源下载会并行推进</text><rect width="1200" height="315" x="60" y="125" class="panel"/><text x="92" y="168" class="panel-title">1. 导航请求的网络路径</text><rect width="175" height="76" x="95" y="205" class="cache"/><text x="182" y="236" class="label" text-anchor="middle">URL / 缓存</text><text x="182" y="262" class="tiny" text-anchor="middle">HSTS、SW、强缓存</text><path d="M 275 243 L 355 243" class="line-blue"/><rect width="150" height="76" x="360" y="205" class="net"/><text x="435" y="236" class="label" text-anchor="middle">DNS</text><text x="435" y="262" class="tiny" text-anchor="middle">缓存或递归解析</text><path d="M 515 243 L 595 243" class="line-blue"/><rect width="175" height="76" x="600" y="205" class="net"/><text x="687" y="236" class="label" text-anchor="middle">连接</text><text x="687" y="262" class="tiny" text-anchor="middle">TCP+TLS 或 QUIC</text><path d="M 780 243 L 860 243" class="line-blue"/><rect width="165" height="76" x="865" y="205" class="net"/><text x="947" y="236" class="label" text-anchor="middle">HTTP/CDN</text><text x="947" y="262" class="tiny" text-anchor="middle">HIT、304 或回源</text><path d="M 1035 243 L 1115 243" class="line-blue"/><rect width="105" height="76" x="1120" y="205" class="render"/><text x="1172" y="236" class="label" text-anchor="middle">HTML</text><text x="1172" y="262" class="tiny" text-anchor="middle">流式到达</text><rect width="1130" height="54" x="95" y="320" class="gray"/><text x="660" y="342" class="small" text-anchor="middle">冷启动 TTFB = DNS/连接/请求传输/服务端处理/响应首字节的叠加；连接复用、缓存命中或 0-RTT 会改变公式</text><text x="660" y="365" class="tiny" text-anchor="middle">DevTools Network 里分别看 DNS Lookup、Initial connection、SSL、Waiting for server response、Content Download</text><rect width="1200" height="360" x="60" y="475" class="panel"/><text x="92" y="518" class="panel-title">2. HTML 到达后，解析和资源发现并行</text><rect width="185" height="76" x="105" y="560" class="render"/><text x="197" y="590" class="label" text-anchor="middle">HTML parser</text><text x="197" y="616" class="tiny" text-anchor="middle">构建 DOM</text><path d="M 295 598 L 390 598" class="line-green"/><rect width="170" height="76" x="395" y="560" class="render"/><text x="480" y="590" class="label" text-anchor="middle">CSSOM</text><text x="480" y="616" class="tiny" text-anchor="middle">样式规则完成</text><path d="M 570 598 L 665 598" class="line-green"/><rect width="160" height="76" x="670" y="560" class="render"/><text x="750" y="590" class="label" text-anchor="middle">Layout</text><text x="750" y="616" class="tiny" text-anchor="middle">几何尺寸</text><path d="M 835 598 L 930 598" class="line-green"/><rect width="160" height="76" x="935" y="560" class="render"/><text x="1015" y="590" class="label" text-anchor="middle">Paint</text><text x="1015" y="616" class="tiny" text-anchor="middle">绘制与合成</text><rect width="270" height="70" x="260" y="700" class="net"/><text x="395" y="728" class="label" text-anchor="middle">preload scanner</text><text x="395" y="753" class="tiny" text-anchor="middle">主 parser 被阻塞时仍可发现资源</text><path d="M 395 695 L 395 645" class="line-dash"/><path d="M 535 735 L 770 735" class="line-blue"/><rect width="270" height="70" x="775" y="700" class="net"/><text x="910" y="728" class="label" text-anchor="middle">CSS / JS / 图片</text><text x="910" y="753" class="tiny" text-anchor="middle">preload、preconnect、lazy loading</text><rect width="1200" height="190" x="60" y="870" class="panel"/><text x="92" y="913" class="panel-title">3. 指标定位：把问题落到阶段</text><rect width="290" height="72" x="115" y="948" class="metric"/><text x="260" y="977" class="label" text-anchor="middle">LCP</text><text x="260" y="1003" class="tiny" text-anchor="middle">网络、服务端、渲染关键资源</text><rect width="290" height="72" x="515" y="948" class="metric"/><text x="660" y="977" class="label" text-anchor="middle">INP</text><text x="660" y="1003" class="tiny" text-anchor="middle">主线程长任务、事件回调、重绘</text><rect width="290" height="72" x="915" y="948" class="metric"/><text x="1060" y="977" class="label" text-anchor="middle">CLS</text><text x="1060" y="1003" class="tiny" text-anchor="middle">图片尺寸、字体、异步插入内容</text></svg>