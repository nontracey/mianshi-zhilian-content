<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">Thread synchronization primitives, wait location, and common risks</title><desc id="desc">A topic-specific diagram mapping mutex, spinlock, rwlock, condition variable, semaphore and atomics to the shared-state problem they solve, showing condition-variable wait ordering, futex fast and slow paths, and engineering verification signals.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.section{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.box-title{font:700 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 14px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.arrow-blue{stroke:#2563eb;marker-end:url(#arrow-blue)}.arrow-blue,.arrow-green,.arrow-red{stroke-width:3;fill:none}.arrow-red{stroke:#dc2626;marker-end:url(#arrow-red)}.arrow-green{stroke:#16a34a;marker-end:url(#arrow-green)}.dash{stroke-dasharray:8 7}</style></defs><rect width="1320" height="1320" class="bg"/><text x="70" y="64" class="title">线程同步机制：先识别共享状态，再选择等待方式</text><text x="70" y="96" class="subtitle">同步原语不是名词清单；关键是临界区长度、读写比例、等待条件、许可数量、失败时该睡眠还是自旋。</text><rect width="1180" height="300" x="70" y="130" class="section" rx="16"/><text x="96" y="166" class="section-title">1. 先判断保护对象和等待目标</text><rect width="210" height="130" x="105" y="195" stroke-width="2" class="yellow" rx="14"/><text x="132" y="229" class="box-title">共享状态</text><text x="132" y="257" class="text">队列、计数器、缓存、</text><text x="132" y="280" class="text">连接池、文件句柄</text><text x="132" y="306" class="mono">invariant must hold</text><rect width="225" height="92" x="370" y="185" stroke-width="2" class="blue" rx="14"/><text x="397" y="218" class="box-title">临界区互斥</text><text x="397" y="245" class="text">一次只允许一个线程修改</text><text x="397" y="265" class="mono">mutex / spinlock</text><rect width="225" height="92" x="370" y="308" stroke-width="2" class="green" rx="14"/><text x="397" y="341" class="box-title">读多写少</text><text x="397" y="368" class="text">读共享，写排他</text><text x="397" y="388" class="mono">rwlock</text><rect width="235" height="92" x="650" y="185" stroke-width="2" class="violet" rx="14"/><text x="677" y="218" class="box-title">等待谓词成立</text><text x="677" y="245" class="text">队列非空、状态变化</text><text x="677" y="265" class="mono">condvar + mutex</text><rect width="235" height="92" x="650" y="308" stroke-width="2" class="cyan" rx="14"/><text x="677" y="341" class="box-title">限制并发许可</text><text x="677" y="368" class="text">最多 N 个资源被占用</text><text x="677" y="388" class="mono">semaphore</text><rect width="235" height="92" x="940" y="245" stroke-width="2" class="red" rx="14"/><text x="967" y="278" class="box-title">单变量原子更新</text><text x="967" y="305" class="text">计数器、状态位、引用计数</text><text x="967" y="325" class="mono">CAS / fetch_add</text><path d="M315 260 H360" class="arrow-blue"/><path d="M315 275 C340 320 340 354 360 354" class="arrow-blue"/><path d="M595 231 H640" class="arrow-blue"/><path d="M595 354 H640" class="arrow-blue"/><path d="M885 315 H931" class="arrow-blue"/><rect width="555" height="500" x="70" y="470" class="section" rx="16"/><text x="96" y="506" class="section-title">2. 条件变量的正确时序</text><text x="96" y="533" class="small">它不保存“通知”；保存的是受 mutex 保护的 predicate。</text><rect width="190" height="84" x="105" y="565" stroke-width="2" class="violet" rx="12"/><text x="131" y="597" class="box-title">Consumer</text><text x="131" y="622" class="mono">lock(m)</text><text x="131" y="641" class="mono">while (!ready)</text><rect width="210" height="84" x="360" y="565" stroke-width="2" class="violet" rx="12"/><text x="386" y="597" class="box-title">cond_wait</text><text x="386" y="622" class="text">原子地解锁并睡眠</text><text x="386" y="641" class="mono">unlock(m) + park</text><rect width="190" height="84" x="105" y="700" stroke-width="2" class="green" rx="12"/><text x="131" y="732" class="box-title">Producer</text><text x="131" y="757" class="mono">lock(m)</text><text x="131" y="776" class="text">修改 ready/data</text><rect width="210" height="84" x="360" y="700" stroke-width="2" class="green" rx="12"/><text x="386" y="732" class="box-title">signal / broadcast</text><text x="386" y="757" class="text">唤醒等待者</text><text x="386" y="776" class="mono">unlock(m)</text><rect width="465" height="92" x="105" y="835" stroke-width="2" class="yellow" rx="12"/><text x="131" y="868" class="box-title">被唤醒后必须重新抢锁并重查 predicate</text><text x="131" y="895" class="text">原因：虚假唤醒、广播惊群、其他线程先消费、signal 不是状态本身。</text><text x="131" y="916" class="mono">while (!ready) pthread_cond_wait(&amp;cv, &amp;m);</text><path d="M295 607 H350" class="arrow-blue"/><path d="M295 742 H350" class="arrow-green"/><path d="M465 700 C465 662 465 662 465 654" class="arrow-green"/><path d="M465 649 C520 700 520 798 475 835" class="arrow-blue"/><path d="M200 835 C180 790 180 720 200 653" class="arrow-red dash"/><text x="122" y="948" class="small">反例：用 if 等待、未持锁修改 predicate、把 signal 当成消息队列，都会制造丢唤醒或竞态。</text><rect width="585" height="500" x="665" y="470" class="section" rx="16"/><text x="691" y="506" class="section-title">3. mutex/futex 快慢路径与选型风险</text><text x="691" y="533" class="small">用户态快路径靠原子指令；竞争严重才进内核睡眠/唤醒。</text><rect width="190" height="82" x="700" y="565" stroke-width="2" class="blue" rx="12"/><text x="726" y="597" class="box-title">无竞争 mutex</text><text x="726" y="622" class="mono">CAS 0 -&gt; 1</text><text x="726" y="640" class="text">用户态完成</text><rect width="250" height="82" x="930" y="565" stroke-width="2" class="yellow" rx="12"/><text x="956" y="597" class="box-title">竞争 mutex</text><text x="956" y="622" class="text">自旋一小段或直接睡眠</text><text x="956" y="640" class="mono">futex_wait / wake</text><rect width="215" height="92" x="700" y="700" stroke-width="2" class="red" rx="12"/><text x="726" y="732" class="box-title">spinlock 风险</text><text x="726" y="758" class="text">持锁者不在运行时，自旋</text><text x="726" y="778" class="text">只是在烧 CPU</text><rect width="215" height="92" x="965" y="700" stroke-width="2" class="green" rx="12"/><text x="991" y="732" class="box-title">rwlock 风险</text><text x="991" y="758" class="text">读者多未必更快；写者</text><text x="991" y="778" class="text">饥饿和升级死锁要看策略</text><rect width="215" height="92" x="700" y="835" stroke-width="2" class="cyan" rx="12"/><text x="726" y="867" class="box-title">semaphore</text><text x="726" y="893" class="text">计数许可，不强调</text><text x="726" y="913" class="text">同一线程释放所有权</text><rect width="215" height="92" x="965" y="835" stroke-width="2" class="violet" rx="12"/><text x="991" y="867" class="box-title">atomics</text><text x="991" y="893" class="text">注意内存序、ABA、</text><text x="991" y="913" class="text">缓存行争用和可读性</text><path d="M890 606 H921" class="arrow-blue"/><path d="M1055 647 C1055 676 855 674 812 700" class="arrow-red"/><path d="M1055 647 C1055 674 1072 676 1072 700" class="arrow-green"/><rect width="1180" height="210" x="70" y="1010" class="section" rx="16"/><text x="96" y="1046" class="section-title">4. 工程验证：同步问题看结果，也看等待位置</text><rect width="245" height="80" x="105" y="1080" stroke-width="2" class="blue" rx="12"/><text x="131" y="1112" class="box-title">正确性</text><text x="131" y="1138" class="text">race detector、TSAN、</text><text x="131" y="1158" class="text">压测下 invariant 断言</text><rect width="245" height="80" x="390" y="1080" stroke-width="2" class="green" rx="12"/><text x="416" y="1112" class="box-title">等待成本</text><text x="416" y="1138" class="text">锁等待时间、上下文切换、</text><text x="416" y="1158" class="text">run queue、CPU 自旋比例</text><rect width="245" height="80" x="675" y="1080" stroke-width="2" class="yellow" rx="12"/><text x="701" y="1112" class="box-title">热点定位</text><text x="701" y="1138" class="text">perf lock、火焰图、</text><text x="701" y="1158" class="text">eBPF/futex 延迟分布</text><rect width="245" height="80" x="960" y="1080" stroke-width="2" class="red" rx="12"/><text x="986" y="1112" class="box-title">设计复盘</text><text x="986" y="1138" class="text">缩短临界区、分片、队列化、</text><text x="986" y="1158" class="text">不可变数据或无共享</text><text x="96" y="1268" class="small">面试抓手：先说保护的共享不变量，再说等待在哪里发生；最后用“是否会丢唤醒、是否忙等、是否饥饿、如何观测”验证选择。</text></svg>