<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">Thread synchronization primitives, wait location, and common risks</title>
  <desc id="desc">A topic-specific diagram mapping mutex, spinlock, rwlock, condition variable, semaphore and atomics to the shared-state problem they solve, showing condition-variable wait ordering, futex fast and slow paths, and engineering verification signals.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .box-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .chip { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-red { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .arrow-green { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="70" y="64">线程同步机制：先识别共享状态，再选择等待方式</text>
  <text class="subtitle" x="70" y="96">同步原语不是名词清单；关键是临界区长度、读写比例、等待条件、许可数量、失败时该睡眠还是自旋。</text>

  <rect class="section" x="70" y="130" width="1180" height="300" rx="16"/>
  <text class="section-title" x="96" y="166">1. 先判断保护对象和等待目标</text>

  <rect class="yellow" x="105" y="195" width="210" height="130" rx="14" stroke-width="2"/>
  <text class="box-title" x="132" y="229">共享状态</text>
  <text class="text" x="132" y="257">队列、计数器、缓存、</text>
  <text class="text" x="132" y="280">连接池、文件句柄</text>
  <text class="mono" x="132" y="306">invariant must hold</text>

  <rect class="blue" x="370" y="185" width="225" height="92" rx="14" stroke-width="2"/>
  <text class="box-title" x="397" y="218">临界区互斥</text>
  <text class="text" x="397" y="245">一次只允许一个线程修改</text>
  <text class="mono" x="397" y="265">mutex / spinlock</text>

  <rect class="green" x="370" y="308" width="225" height="92" rx="14" stroke-width="2"/>
  <text class="box-title" x="397" y="341">读多写少</text>
  <text class="text" x="397" y="368">读共享，写排他</text>
  <text class="mono" x="397" y="388">rwlock</text>

  <rect class="violet" x="650" y="185" width="235" height="92" rx="14" stroke-width="2"/>
  <text class="box-title" x="677" y="218">等待谓词成立</text>
  <text class="text" x="677" y="245">队列非空、状态变化</text>
  <text class="mono" x="677" y="265">condvar + mutex</text>

  <rect class="cyan" x="650" y="308" width="235" height="92" rx="14" stroke-width="2"/>
  <text class="box-title" x="677" y="341">限制并发许可</text>
  <text class="text" x="677" y="368">最多 N 个资源被占用</text>
  <text class="mono" x="677" y="388">semaphore</text>

  <rect class="red" x="940" y="245" width="235" height="92" rx="14" stroke-width="2"/>
  <text class="box-title" x="967" y="278">单变量原子更新</text>
  <text class="text" x="967" y="305">计数器、状态位、引用计数</text>
  <text class="mono" x="967" y="325">CAS / fetch_add</text>

  <path class="arrow-blue" d="M315 260 H360"/>
  <path class="arrow-blue" d="M315 275 C340 320 340 354 360 354"/>
  <path class="arrow-blue" d="M595 231 H640"/>
  <path class="arrow-blue" d="M595 354 H640"/>
  <path class="arrow-blue" d="M885 315 H931"/>

  <rect class="section" x="70" y="470" width="555" height="500" rx="16"/>
  <text class="section-title" x="96" y="506">2. 条件变量的正确时序</text>
  <text class="small" x="96" y="533">它不保存“通知”；保存的是受 mutex 保护的 predicate。</text>

  <rect class="violet" x="105" y="565" width="190" height="84" rx="12" stroke-width="2"/>
  <text class="box-title" x="131" y="597">Consumer</text>
  <text class="mono" x="131" y="622">lock(m)</text>
  <text class="mono" x="131" y="641">while (!ready)</text>

  <rect class="violet" x="360" y="565" width="210" height="84" rx="12" stroke-width="2"/>
  <text class="box-title" x="386" y="597">cond_wait</text>
  <text class="text" x="386" y="622">原子地解锁并睡眠</text>
  <text class="mono" x="386" y="641">unlock(m) + park</text>

  <rect class="green" x="105" y="700" width="190" height="84" rx="12" stroke-width="2"/>
  <text class="box-title" x="131" y="732">Producer</text>
  <text class="mono" x="131" y="757">lock(m)</text>
  <text class="text" x="131" y="776">修改 ready/data</text>

  <rect class="green" x="360" y="700" width="210" height="84" rx="12" stroke-width="2"/>
  <text class="box-title" x="386" y="732">signal / broadcast</text>
  <text class="text" x="386" y="757">唤醒等待者</text>
  <text class="mono" x="386" y="776">unlock(m)</text>

  <rect class="yellow" x="105" y="835" width="465" height="92" rx="12" stroke-width="2"/>
  <text class="box-title" x="131" y="868">被唤醒后必须重新抢锁并重查 predicate</text>
  <text class="text" x="131" y="895">原因：虚假唤醒、广播惊群、其他线程先消费、signal 不是状态本身。</text>
  <text class="mono" x="131" y="916">while (!ready) pthread_cond_wait(&amp;cv, &amp;m);</text>

  <path class="arrow-blue" d="M295 607 H350"/>
  <path class="arrow-green" d="M295 742 H350"/>
  <path class="arrow-green" d="M465 700 C465 662 465 662 465 654"/>
  <path class="arrow-blue" d="M465 649 C520 700 520 798 475 835"/>
  <path class="arrow-red dash" d="M200 835 C180 790 180 720 200 653"/>
  <text class="small" x="122" y="948">反例：用 if 等待、未持锁修改 predicate、把 signal 当成消息队列，都会制造丢唤醒或竞态。</text>

  <rect class="section" x="665" y="470" width="585" height="500" rx="16"/>
  <text class="section-title" x="691" y="506">3. mutex/futex 快慢路径与选型风险</text>
  <text class="small" x="691" y="533">用户态快路径靠原子指令；竞争严重才进内核睡眠/唤醒。</text>

  <rect class="blue" x="700" y="565" width="190" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="726" y="597">无竞争 mutex</text>
  <text class="mono" x="726" y="622">CAS 0 -> 1</text>
  <text class="text" x="726" y="640">用户态完成</text>

  <rect class="yellow" x="930" y="565" width="250" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="956" y="597">竞争 mutex</text>
  <text class="text" x="956" y="622">自旋一小段或直接睡眠</text>
  <text class="mono" x="956" y="640">futex_wait / wake</text>

  <rect class="red" x="700" y="700" width="215" height="92" rx="12" stroke-width="2"/>
  <text class="box-title" x="726" y="732">spinlock 风险</text>
  <text class="text" x="726" y="758">持锁者不在运行时，自旋</text>
  <text class="text" x="726" y="778">只是在烧 CPU</text>

  <rect class="green" x="965" y="700" width="215" height="92" rx="12" stroke-width="2"/>
  <text class="box-title" x="991" y="732">rwlock 风险</text>
  <text class="text" x="991" y="758">读者多未必更快；写者</text>
  <text class="text" x="991" y="778">饥饿和升级死锁要看策略</text>

  <rect class="cyan" x="700" y="835" width="215" height="92" rx="12" stroke-width="2"/>
  <text class="box-title" x="726" y="867">semaphore</text>
  <text class="text" x="726" y="893">计数许可，不强调</text>
  <text class="text" x="726" y="913">同一线程释放所有权</text>

  <rect class="violet" x="965" y="835" width="215" height="92" rx="12" stroke-width="2"/>
  <text class="box-title" x="991" y="867">atomics</text>
  <text class="text" x="991" y="893">注意内存序、ABA、</text>
  <text class="text" x="991" y="913">缓存行争用和可读性</text>

  <path class="arrow-blue" d="M890 606 H921"/>
  <path class="arrow-red" d="M1055 647 C1055 676 855 674 812 700"/>
  <path class="arrow-green" d="M1055 647 C1055 674 1072 676 1072 700"/>

  <rect class="section" x="70" y="1010" width="1180" height="210" rx="16"/>
  <text class="section-title" x="96" y="1046">4. 工程验证：同步问题看结果，也看等待位置</text>
  <rect class="blue" x="105" y="1080" width="245" height="80" rx="12" stroke-width="2"/>
  <text class="box-title" x="131" y="1112">正确性</text>
  <text class="text" x="131" y="1138">race detector、TSAN、</text>
  <text class="text" x="131" y="1158">压测下 invariant 断言</text>

  <rect class="green" x="390" y="1080" width="245" height="80" rx="12" stroke-width="2"/>
  <text class="box-title" x="416" y="1112">等待成本</text>
  <text class="text" x="416" y="1138">锁等待时间、上下文切换、</text>
  <text class="text" x="416" y="1158">run queue、CPU 自旋比例</text>

  <rect class="yellow" x="675" y="1080" width="245" height="80" rx="12" stroke-width="2"/>
  <text class="box-title" x="701" y="1112">热点定位</text>
  <text class="text" x="701" y="1138">perf lock、火焰图、</text>
  <text class="text" x="701" y="1158">eBPF/futex 延迟分布</text>

  <rect class="red" x="960" y="1080" width="245" height="80" rx="12" stroke-width="2"/>
  <text class="box-title" x="986" y="1112">设计复盘</text>
  <text class="text" x="986" y="1138">缩短临界区、分片、队列化、</text>
  <text class="text" x="986" y="1158">不可变数据或无共享</text>

  <text class="small" x="96" y="1268">面试抓手：先说保护的共享不变量，再说等待在哪里发生；最后用“是否会丢唤醒、是否忙等、是否饥饿、如何观测”验证选择。</text>
</svg>
