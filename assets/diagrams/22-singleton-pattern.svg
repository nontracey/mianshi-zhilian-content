<svg viewBox="0 0 680 384" width="100%" role="img" aria-label="单例模式5种写法对比图">
<title>单例模式5种写法对比图</title><desc>饿汉、懒汉、DCL、静态内部类、枚举</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">单例模式 5种写法</text>
<rect x="60" y="50" width="560" height="40" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="160" y="74" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">饿汉式</text>
<text x="360" y="74" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">类加载时创建</text>
<text x="540" y="74" text-anchor="middle" font-size="11" font-weight="500" fill="#378ADD" font-family="system-ui, sans-serif">线程安全</text>
<rect x="60" y="102" width="560" height="40" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="160" y="126" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">懒汉式</text>
<text x="360" y="126" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">首次调用时创建</text>
<text x="540" y="126" text-anchor="middle" font-size="11" font-weight="500" fill="#7F77DD" font-family="system-ui, sans-serif">需加锁</text>
<rect x="60" y="154" width="560" height="40" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="160" y="178" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">双重检查锁</text>
<text x="360" y="178" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">DCL + volatile</text>
<text x="540" y="178" text-anchor="middle" font-size="11" font-weight="500" fill="#1D9E75" font-family="system-ui, sans-serif">推荐</text>
<rect x="60" y="206" width="560" height="40" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="160" y="230" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">静态内部类</text>
<text x="360" y="230" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">延迟加载</text>
<text x="540" y="230" text-anchor="middle" font-size="11" font-weight="500" fill="#BA7517" font-family="system-ui, sans-serif">推荐</text>
<rect x="60" y="258" width="560" height="40" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="160" y="282" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">枚举</text>
<text x="360" y="282" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">最简洁</text>
<text x="540" y="282" text-anchor="middle" font-size="11" font-weight="500" fill="#A32D2D" font-family="system-ui, sans-serif">最佳</text>
<rect x="80" y="314" width="520" height="50" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="334" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">枚举单例最安全: 天然防反射、防序列化破坏</text>
<text x="340" y="352" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">DCL必须加volatile: 防止指令重排序</text>
</svg>