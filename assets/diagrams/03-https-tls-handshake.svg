<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, sans-serif" viewBox="0 0 800 480"><text x="400" y="30" fill="#2C3E50" font-size="18" font-weight="bold" text-anchor="middle">HTTPS / TLS 握手流程</text><rect width="100" height="30" x="80" y="55" fill="#3498DB" stroke="#3498DB" opacity=".2" rx="4"/><text x="130" y="75" fill="#3498DB" font-size="13" font-weight="bold" text-anchor="middle">客户端</text><rect width="100" height="30" x="620" y="55" fill="#E74C3C" stroke="#E74C3C" opacity=".2" rx="4"/><text x="670" y="75" fill="#E74C3C" font-size="13" font-weight="bold" text-anchor="middle">服务端</text><line x1="130" x2="130" y1="90" y2="430" stroke="#3498DB" stroke-dasharray="4" stroke-width="2"/><line x1="670" x2="670" y1="90" y2="430" stroke="#E74C3C" stroke-dasharray="4" stroke-width="2"/><line x1="135" x2="665" y1="115" y2="135" stroke="#27AE60" stroke-width="2" marker-end="url(#a1)"/><text x="400" y="112" fill="#27AE60" font-size="12" font-weight="bold" text-anchor="middle">① Client Hello</text><text x="400" y="128" fill="#7F8C8D" font-size="10" text-anchor="middle">支持的 TLS 版本 + 加密套件列表 + 随机数 Random_C</text><line x1="665" x2="135" y1="150" y2="170" stroke="#E67E22" stroke-width="2" marker-end="url(#a2)"/><text x="400" y="148" fill="#E67E22" font-size="12" font-weight="bold" text-anchor="middle">② Server Hello</text><text x="400" y="164" fill="#7F8C8D" font-size="10" text-anchor="middle">选定加密套件 + 随机数 Random_S + 证书</text><rect width="300" height="50" x="250" y="180" fill="#FDF2E9" stroke="#E67E22" rx="6"/><text x="400" y="200" fill="#E67E22" font-size="12" font-weight="bold" text-anchor="middle">③ 客户端验证证书</text><text x="400" y="218" fill="#7F8C8D" font-size="10" text-anchor="middle">CA 链验证 → 公钥提取 → 证书是否过期/吊销</text><line x1="135" x2="665" y1="245" y2="265" stroke="#27AE60" stroke-width="2" marker-end="url(#a1)"/><text x="400" y="242" fill="#27AE60" font-size="12" font-weight="bold" text-anchor="middle">④ 密钥交换</text><text x="400" y="258" fill="#7F8C8D" font-size="10" text-anchor="middle">Pre-Master Secret（用服务端公钥加密）+ Change Cipher Spec</text><rect width="300" height="50" x="250" y="275" fill="#D5F5E3" stroke="#27AE60" rx="6"/><text x="400" y="295" fill="#27AE60" font-size="12" font-weight="bold" text-anchor="middle">⑤ 双方计算会话密钥</text><text x="400" y="313" fill="#7F8C8D" font-size="10" text-anchor="middle">Master Secret = PRF(Random_C + Random_S + Pre_Master)</text><line x1="135" x2="665" y1="340" y2="355" stroke="#27AE60" stroke-width="2" marker-end="url(#a1)"/><text x="400" y="345" fill="#27AE60" font-size="12" font-weight="bold" text-anchor="middle">⑥ Finished（加密通信开始）</text><rect width="300" height="40" x="250" y="370" fill="#D5F5E3" stroke="#27AE60" rx="6"/><text x="400" y="395" fill="#27AE60" font-size="12" font-weight="bold" text-anchor="middle">🔒 应用数据加密传输</text><text x="400" y="465" fill="#7F8C8D" font-size="11" text-anchor="middle">核心：非对称加密交换密钥 → 对称加密传输数据 → 证书体系保证身份可信</text><defs><marker id="a1" markerHeight="6" markerWidth="8" orient="auto" refX="8" refY="3"><path fill="#27AE60" d="M0,0 L8,3 L0,6"/></marker><marker id="a2" markerHeight="6" markerWidth="8" orient="auto" refX="8" refY="3"><path fill="#E67E22" d="M0,0 L8,3 L0,6"/></marker></defs></svg>