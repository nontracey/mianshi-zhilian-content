<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Microsoft YaHei, sans-serif">
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2C3E50">HTTPS / TLS 握手流程</text>
  <rect x="80" y="55" width="100" height="30" rx="4" fill="#3498DB" opacity="0.2" stroke="#3498DB"/>
  <text x="130" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#3498DB">客户端</text>
  <rect x="620" y="55" width="100" height="30" rx="4" fill="#E74C3C" opacity="0.2" stroke="#E74C3C"/>
  <text x="670" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#E74C3C">服务端</text>
  <line x1="130" y1="90" x2="130" y2="430" stroke="#3498DB" stroke-width="2" stroke-dasharray="4"/>
  <line x1="670" y1="90" x2="670" y2="430" stroke="#E74C3C" stroke-width="2" stroke-dasharray="4"/>
  <!-- Step 1: Client Hello -->
  <line x1="135" y1="115" x2="665" y2="135" stroke="#27AE60" stroke-width="2" marker-end="url(#a1)"/>
  <text x="400" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#27AE60">① Client Hello</text>
  <text x="400" y="128" text-anchor="middle" font-size="10" fill="#7F8C8D">支持的 TLS 版本 + 加密套件列表 + 随机数 Random_C</text>
  <!-- Step 2: Server Hello -->
  <line x1="665" y1="150" x2="135" y2="170" stroke="#E67E22" stroke-width="2" marker-end="url(#a2)"/>
  <text x="400" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#E67E22">② Server Hello</text>
  <text x="400" y="164" text-anchor="middle" font-size="10" fill="#7F8C8D">选定加密套件 + 随机数 Random_S + 证书</text>
  <!-- Step 3: Certificate Verify -->
  <rect x="250" y="180" width="300" height="50" rx="6" fill="#FDF2E9" stroke="#E67E22"/>
  <text x="400" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#E67E22">③ 客户端验证证书</text>
  <text x="400" y="218" text-anchor="middle" font-size="10" fill="#7F8C8D">CA 链验证 → 公钥提取 → 证书是否过期/吊销</text>
  <!-- Step 4: Key Exchange -->
  <line x1="135" y1="245" x2="665" y2="265" stroke="#27AE60" stroke-width="2" marker-end="url(#a1)"/>
  <text x="400" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#27AE60">④ 密钥交换</text>
  <text x="400" y="258" text-anchor="middle" font-size="10" fill="#7F8C8D">Pre-Master Secret（用服务端公钥加密）+ Change Cipher Spec</text>
  <!-- Step 5: Session Key -->
  <rect x="250" y="275" width="300" height="50" rx="6" fill="#D5F5E3" stroke="#27AE60"/>
  <text x="400" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#27AE60">⑤ 双方计算会话密钥</text>
  <text x="400" y="313" text-anchor="middle" font-size="10" fill="#7F8C8D">Master Secret = PRF(Random_C + Random_S + Pre_Master)</text>
  <!-- Step 6: Finished -->
  <line x1="135" y1="340" x2="665" y2="355" stroke="#27AE60" stroke-width="2" marker-end="url(#a1)"/>
  <text x="400" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#27AE60">⑥ Finished（加密通信开始）</text>
  <!-- Encrypted data -->
  <rect x="250" y="370" width="300" height="40" rx="6" fill="#D5F5E3" stroke="#27AE60"/>
  <text x="400" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#27AE60">🔒 应用数据加密传输</text>
  <text x="400" y="465" text-anchor="middle" font-size="11" fill="#7F8C8D">核心：非对称加密交换密钥 → 对称加密传输数据 → 证书体系保证身份可信</text>
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#27AE60"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#E67E22"/></marker>
  </defs>
</svg>
