<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">AQS state、同步队列与 Condition 队列</title>
  <desc id="desc">展示 AQS 的 state 语义、同步队列、独占/共享 acquire-release、park/unpark 和 Condition 队列迁移。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5f99"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b24634"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #14213d; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .label { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 14px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .code { font: 600 13px Menlo, Consolas, monospace; fill: #263238; }
      .blue { fill: #e8f4ff; stroke: #6aa9df; stroke-width: 2; rx: 12; }
      .green { fill: #e9f7ef; stroke: #58b77d; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff5d6; stroke: #e0ae35; stroke-width: 2; rx: 12; }
      .red { fill: #fdecea; stroke: #cf5d4b; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #a7b5c4; stroke-width: 2; rx: 12; }
      .line { stroke: #1f5f99; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line-red { stroke: #b24634; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #7b8794; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">AQS：state、同步队列与条件队列</text>
  <text x="50" y="86" class="subtitle">AQS 负责排队、park/unpark 和固定流程；具体同步语义由子类定义 state。</text>

  <rect x="40" y="120" width="1200" height="250" class="panel"/>
  <text x="68" y="156" class="panel-title">1. state 的语义由同步器定义</text>
  <rect x="84" y="202" width="190" height="78" class="green"/>
  <text x="132" y="232" class="label">state</text>
  <text x="116" y="256" class="code">volatile int</text>
  <rect x="342" y="188" width="160" height="58" class="blue"/>
  <text x="370" y="214" class="label">ReentrantLock</text>
  <text x="368" y="234" class="tiny">重入次数</text>
  <rect x="542" y="188" width="160" height="58" class="yellow"/>
  <text x="584" y="214" class="label">Semaphore</text>
  <text x="588" y="234" class="tiny">许可数</text>
  <rect x="742" y="188" width="160" height="58" class="red"/>
  <text x="774" y="214" class="label">CountDownLatch</text>
  <text x="784" y="234" class="tiny">剩余计数</text>
  <rect x="942" y="188" width="190" height="58" class="gray"/>
  <text x="982" y="214" class="label">ReadWriteLock</text>
  <text x="978" y="234" class="tiny">读写计数复用位段</text>
  <line x1="274" y1="241" x2="342" y2="217" class="line"/>
  <line x1="502" y1="217" x2="542" y2="217" class="line"/>
  <line x1="702" y1="217" x2="742" y2="217" class="line"/>
  <line x1="902" y1="217" x2="942" y2="217" class="line"/>
  <text x="84" y="324" class="small">AQS 提供 CAS 修改 state、同步队列、park/unpark；tryAcquire 语义由子类实现。</text>

  <rect x="40" y="410" width="1200" height="330" class="panel"/>
  <text x="68" y="446" class="panel-title">2. 独占 acquire/release：失败入队，释放唤醒后继</text>
  <rect x="78" y="494" width="150" height="72" class="blue"/>
  <text x="110" y="522" class="label">tryAcquire</text>
  <text x="104" y="546" class="tiny">CAS state / owner</text>
  <rect x="274" y="494" width="150" height="72" class="yellow"/>
  <text x="318" y="522" class="label">入队尾</text>
  <text x="304" y="546" class="tiny">Node(prev,next,thread)</text>
  <rect x="470" y="494" width="150" height="72" class="gray"/>
  <text x="510" y="522" class="label">park</text>
  <text x="498" y="546" class="tiny">等待前驱释放</text>
  <rect x="666" y="494" width="150" height="72" class="green"/>
  <text x="706" y="522" class="label">unpark</text>
  <text x="694" y="546" class="tiny">后继重新竞争</text>
  <rect x="862" y="494" width="150" height="72" class="blue"/>
  <text x="902" y="522" class="label">setHead</text>
  <text x="894" y="546" class="tiny">获取成功出队</text>
  <rect x="1058" y="494" width="120" height="72" class="red"/>
  <text x="1094" y="522" class="label">release</text>
  <text x="1082" y="546" class="tiny">完全释放</text>
  <line x1="228" y1="530" x2="274" y2="530" class="line-red"/>
  <line x1="424" y1="530" x2="470" y2="530" class="line"/>
  <line x1="620" y1="530" x2="666" y2="530" class="line"/>
  <line x1="816" y1="530" x2="862" y2="530" class="line"/>
  <line x1="1012" y1="530" x2="1058" y2="530" class="line"/>
  <rect x="238" y="628" width="780" height="58" class="gray"/>
  <text x="270" y="658" class="small">公平锁在 tryAcquire 中检查 hasQueuedPredecessors；非公平锁先 CAS 抢 state。</text>

  <rect x="40" y="780" width="585" height="300" class="panel"/>
  <text x="68" y="816" class="panel-title">3. 共享模式：成功可继续传播</text>
  <rect x="78" y="864" width="152" height="72" class="yellow"/>
  <text x="104" y="892" class="label">tryAcquireShared</text>
  <text x="112" y="916" class="tiny">负数失败，非负成功</text>
  <rect x="278" y="864" width="152" height="72" class="green"/>
  <text x="318" y="892" class="label">releaseShared</text>
  <text x="306" y="916" class="tiny">可能传播唤醒</text>
  <rect x="478" y="864" width="112" height="72" class="blue"/>
  <text x="506" y="892" class="label">传播</text>
  <text x="500" y="916" class="tiny">共享节点检查</text>
  <line x1="230" y1="900" x2="278" y2="900" class="line"/>
  <line x1="430" y1="900" x2="478" y2="900" class="line"/>
  <rect x="78" y="982" width="512" height="50" class="gray"/>
  <text x="104" y="1012" class="small">Semaphore 是许可数；CountDownLatch 是计数归零后释放等待者。</text>

  <rect x="655" y="780" width="585" height="300" class="panel"/>
  <text x="683" y="816" class="panel-title">4. Condition：条件队列转同步队列</text>
  <rect x="690" y="864" width="148" height="72" class="blue"/>
  <text x="728" y="892" class="label">持有独占锁</text>
  <text x="714" y="916" class="tiny">await 前置条件</text>
  <rect x="872" y="864" width="148" height="72" class="yellow"/>
  <text x="910" y="892" class="label">条件队列</text>
  <text x="900" y="916" class="tiny">释放 state 后 park</text>
  <rect x="1054" y="864" width="148" height="72" class="green"/>
  <text x="1092" y="892" class="label">同步队列</text>
  <text x="1080" y="916" class="tiny">signal 转移后重争锁</text>
  <line x1="838" y1="900" x2="872" y2="900" class="line"/>
  <line x1="1020" y1="900" x2="1054" y2="900" class="line"/>
  <rect x="690" y="982" width="512" height="50" class="gray"/>
  <text x="716" y="1012" class="small">signal 不等于立刻运行；await 返回后仍要 while 重查条件。</text>

  <rect x="40" y="1120" width="1200" height="92" class="panel"/>
  <text x="68" y="1154" class="panel-title">回答抓手</text>
  <text x="190" y="1154" class="small">state 语义 -> 独占/共享流程 -> 同步队列 park/unpark -> Condition 队列迁移 -> 公平/非公平与线程 dump 判断。</text>
  <text x="190" y="1186" class="small">不要把 state 固定成重入次数，也不要把 signal 理解成直接获得锁。</text>
</svg>
