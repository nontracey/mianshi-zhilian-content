<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1280"><title id="title">AQS state、同步队列与 Condition 队列</title><desc id="desc">展示 AQS 的 state 语义、同步队列、独占/共享 acquire-release、park/unpark 和 Condition 队列迁移。</desc><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#1f5f99" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#b24634" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f7fafc}.title{font:700 30px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#14213d}.subtitle{font:400 15px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.panel{fill:#fff;stroke:#d9e2ec;stroke-width:2;rx:16}.label{fill:#1f2933}.panel-title{font:700 20px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#1f2933}.label{font:700 16px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.small{font:400 14px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#334e68}.tiny{font:400 12px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.code{font:600 13px Menlo,Consolas,monospace;fill:#263238}.blue{fill:#e8f4ff;stroke:#6aa9df}.blue,.gray{stroke-width:2;rx:12}.green{fill:#e9f7ef;stroke:#58b77d}.green,.red,.yellow{stroke-width:2;rx:12}.yellow{fill:#fff5d6;stroke:#e0ae35}.red{fill:#fdecea;stroke:#cf5d4b}.gray{fill:#f1f5f9;stroke:#a7b5c4}.line,.line-red{stroke:#1f5f99;stroke-width:3;fill:none;marker-end:url(#arrow)}.line-red{stroke:#b24634;marker-end:url(#arrow-red)}</style></defs><rect width="1280" height="1280" class="bg"/><text x="48" y="56" class="title">AQS：state、同步队列与条件队列</text><text x="50" y="86" class="subtitle">AQS 负责排队、park/unpark 和固定流程；具体同步语义由子类定义 state。</text><rect width="1200" height="250" x="40" y="120" class="panel"/><text x="68" y="156" class="panel-title">1. state 的语义由同步器定义</text><rect width="190" height="78" x="84" y="202" class="green"/><text x="132" y="232" class="label">state</text><text x="116" y="256" class="code">volatile int</text><rect width="160" height="58" x="342" y="188" class="blue"/><text x="370" y="214" class="label">ReentrantLock</text><text x="368" y="234" class="tiny">重入次数</text><rect width="160" height="58" x="542" y="188" class="yellow"/><text x="584" y="214" class="label">Semaphore</text><text x="588" y="234" class="tiny">许可数</text><rect width="160" height="58" x="742" y="188" class="red"/><text x="774" y="214" class="label">CountDownLatch</text><text x="784" y="234" class="tiny">剩余计数</text><rect width="190" height="58" x="942" y="188" class="gray"/><text x="982" y="214" class="label">ReadWriteLock</text><text x="978" y="234" class="tiny">读写计数复用位段</text><line x1="274" x2="342" y1="241" y2="217" class="line"/><line x1="502" x2="542" y1="217" y2="217" class="line"/><line x1="702" x2="742" y1="217" y2="217" class="line"/><line x1="902" x2="942" y1="217" y2="217" class="line"/><text x="84" y="324" class="small">AQS 提供 CAS 修改 state、同步队列、park/unpark；tryAcquire 语义由子类实现。</text><rect width="1200" height="330" x="40" y="410" class="panel"/><text x="68" y="446" class="panel-title">2. 独占 acquire/release：失败入队，释放唤醒后继</text><rect width="150" height="72" x="78" y="494" class="blue"/><text x="110" y="522" class="label">tryAcquire</text><text x="104" y="546" class="tiny">CAS state / owner</text><rect width="150" height="72" x="274" y="494" class="yellow"/><text x="318" y="522" class="label">入队尾</text><text x="304" y="546" class="tiny">Node(prev,next,thread)</text><rect width="150" height="72" x="470" y="494" class="gray"/><text x="510" y="522" class="label">park</text><text x="498" y="546" class="tiny">等待前驱释放</text><rect width="150" height="72" x="666" y="494" class="green"/><text x="706" y="522" class="label">unpark</text><text x="694" y="546" class="tiny">后继重新竞争</text><rect width="150" height="72" x="862" y="494" class="blue"/><text x="902" y="522" class="label">setHead</text><text x="894" y="546" class="tiny">获取成功出队</text><rect width="120" height="72" x="1058" y="494" class="red"/><text x="1094" y="522" class="label">release</text><text x="1082" y="546" class="tiny">完全释放</text><line x1="228" x2="274" y1="530" y2="530" class="line-red"/><line x1="424" x2="470" y1="530" y2="530" class="line"/><line x1="620" x2="666" y1="530" y2="530" class="line"/><line x1="816" x2="862" y1="530" y2="530" class="line"/><line x1="1012" x2="1058" y1="530" y2="530" class="line"/><rect width="780" height="58" x="238" y="628" class="gray"/><text x="270" y="658" class="small">公平锁在 tryAcquire 中检查 hasQueuedPredecessors；非公平锁先 CAS 抢 state。</text><rect width="585" height="300" x="40" y="780" class="panel"/><text x="68" y="816" class="panel-title">3. 共享模式：成功可继续传播</text><rect width="152" height="72" x="78" y="864" class="yellow"/><text x="104" y="892" class="label">tryAcquireShared</text><text x="112" y="916" class="tiny">负数失败，非负成功</text><rect width="152" height="72" x="278" y="864" class="green"/><text x="318" y="892" class="label">releaseShared</text><text x="306" y="916" class="tiny">可能传播唤醒</text><rect width="112" height="72" x="478" y="864" class="blue"/><text x="506" y="892" class="label">传播</text><text x="500" y="916" class="tiny">共享节点检查</text><line x1="230" x2="278" y1="900" y2="900" class="line"/><line x1="430" x2="478" y1="900" y2="900" class="line"/><rect width="512" height="50" x="78" y="982" class="gray"/><text x="104" y="1012" class="small">Semaphore 是许可数；CountDownLatch 是计数归零后释放等待者。</text><rect width="585" height="300" x="655" y="780" class="panel"/><text x="683" y="816" class="panel-title">4. Condition：条件队列转同步队列</text><rect width="148" height="72" x="690" y="864" class="blue"/><text x="728" y="892" class="label">持有独占锁</text><text x="714" y="916" class="tiny">await 前置条件</text><rect width="148" height="72" x="872" y="864" class="yellow"/><text x="910" y="892" class="label">条件队列</text><text x="900" y="916" class="tiny">释放 state 后 park</text><rect width="148" height="72" x="1054" y="864" class="green"/><text x="1092" y="892" class="label">同步队列</text><text x="1080" y="916" class="tiny">signal 转移后重争锁</text><line x1="838" x2="872" y1="900" y2="900" class="line"/><line x1="1020" x2="1054" y1="900" y2="900" class="line"/><rect width="512" height="50" x="690" y="982" class="gray"/><text x="716" y="1012" class="small">signal 不等于立刻运行；await 返回后仍要 while 重查条件。</text><rect width="1200" height="92" x="40" y="1120" class="panel"/><text x="68" y="1154" class="panel-title">回答抓手</text><text x="190" y="1154" class="small">state 语义 -&gt; 独占/共享流程 -&gt; 同步队列 park/unpark -&gt; Condition 队列迁移 -&gt; 公平/非公平与线程 dump 判断。</text><text x="190" y="1186" class="small">不要把 state 固定成重入次数，也不要把 signal 理解成直接获得锁。</text></svg>