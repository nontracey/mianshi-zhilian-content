<svg viewBox="0 0 800 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Transformer 自注意力 Q/K/V 计算">
<title>自注意力：Q/K/V 与缩放点积，多头并行</title><desc>输入嵌入经三组线性投影得到 Q/K/V，QKᵀ 除以 √dk 后 softmax 得权重再加权 V；多头在不同子空间并行后拼接。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="400" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">Self-Attention = softmax(QKᵀ / √dₖ) · V</text>
<!-- input -->
<rect x="24" y="120" width="116" height="64" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.6"/>
<text x="82" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#2C2C2A" font-family="system-ui, sans-serif">输入嵌入 X</text>
<text x="82" y="166" text-anchor="middle" font-size="10.5" fill="#5F5E5A" font-family="system-ui, sans-serif">+ 位置编码</text>
<!-- Q K V -->
<rect x="190" y="60" width="104" height="44" rx="7" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.6"/><text x="242" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">Q = X·Wq</text><text x="242" y="96" text-anchor="middle" font-size="10" fill="#5F5E5A" font-family="system-ui, sans-serif">"我想找什么"</text>
<rect x="190" y="130" width="104" height="44" rx="7" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.6"/><text x="242" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C" font-family="system-ui, sans-serif">K = X·Wk</text><text x="242" y="166" text-anchor="middle" font-size="10" fill="#5F5E5A" font-family="system-ui, sans-serif">"我能被匹配的特征"</text>
<rect x="190" y="200" width="104" height="44" rx="7" fill="#FEF3E2" stroke="#BA7517" stroke-width="0.6"/><text x="242" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#7A4D0E" font-family="system-ui, sans-serif">V = X·Wv</text><text x="242" y="236" text-anchor="middle" font-size="10" fill="#5F5E5A" font-family="system-ui, sans-serif">"被选中后给的信息"</text>
<line x1="140" y1="145" x2="188" y2="82" stroke="#378ADD" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="140" y1="152" x2="188" y2="152" stroke="#1D9E75" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="140" y1="159" x2="188" y2="222" stroke="#BA7517" stroke-width="1.3" marker-end="url(#a)"/>
<!-- scores -->
<rect x="344" y="95" width="118" height="64" rx="8" fill="#fff" stroke="#378ADD" stroke-width="0.7"/>
<text x="403" y="120" text-anchor="middle" font-size="12.5" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">QKᵀ / √dₖ</text>
<text x="403" y="140" text-anchor="middle" font-size="10" fill="#5F5E5A" font-family="system-ui, sans-serif">相关性打分</text>
<text x="403" y="153" text-anchor="middle" font-size="9.5" fill="#5F5E5A" font-family="system-ui, sans-serif">√dₖ 防点积过大梯度消失</text>
<line x1="294" y1="82" x2="342" y2="112" stroke="#378ADD" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="294" y1="152" x2="342" y2="135" stroke="#1D9E75" stroke-width="1.3" marker-end="url(#a)"/>
<!-- softmax -->
<rect x="500" y="95" width="104" height="64" rx="8" fill="#fff" stroke="#8E44AD" stroke-width="0.7"/>
<text x="552" y="122" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5B2C6F" font-family="system-ui, sans-serif">softmax</text>
<text x="552" y="142" text-anchor="middle" font-size="10" fill="#5F5E5A" font-family="system-ui, sans-serif">→ 注意力权重</text>
<line x1="462" y1="127" x2="498" y2="127" stroke="#8E44AD" stroke-width="1.3" marker-end="url(#a)"/>
<!-- weighted V -->
<rect x="644" y="95" width="132" height="64" rx="8" fill="#FEF3E2" stroke="#BA7517" stroke-width="0.7"/>
<text x="710" y="122" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7A4D0E" font-family="system-ui, sans-serif">权重 · V → 输出</text>
<text x="710" y="142" text-anchor="middle" font-size="10" fill="#5F5E5A" font-family="system-ui, sans-serif">上下文化表示</text>
<line x1="604" y1="127" x2="642" y2="127" stroke="#BA7517" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M 296 222 C 470 250, 560 200, 690 161" fill="none" stroke="#BA7517" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/>
<!-- multi-head + notes -->
<rect x="24" y="280" width="752" height="132" rx="10" fill="#FBFAF5" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="40" y="304" font-size="13" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">多头注意力（Multi-Head）：h 个头在不同子空间并行</text>
<g font-family="system-ui, sans-serif" font-size="11.5" fill="#2C2C2A">
<text x="40" y="330">• d_model 拆成 h 份，每头 d_k = d_model/h，各学一种关系（语法/共指/位置）</text>
<text x="40" y="352">• h 个头输出 concat 后过 W_o 融合；总计算量与单头相当，参数量增加</text>
<text x="40" y="374" fill="#C0392B">• Decoder 用 causal mask：未来位置打 -∞，softmax 后权重为 0，保证自回归</text>
<text x="40" y="396" fill="#7A4D0E">• 推理优化：KV Cache 缓存历史 K/V 把生成降为 O(n)；GQA/MQA 共享 KV 省显存</text>
</g>
</svg>
