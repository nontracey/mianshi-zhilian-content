<svg viewBox="0 0 680 485" width="100%" role="img" aria-label="Bean生命周期流程图">
<title>Bean生命周期流程图</title><desc>Spring Bean从创建到销毁的完整生命周期</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Spring Bean 生命周期</text>
<rect x="230" y="48" width="220" height="36" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="340" y="67" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">1. 实例化</text>
<line x1="340" y1="84" x2="340" y2="100" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="230" y="100" width="220" height="36" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="340" y="119" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">2. 属性填充</text>
<line x1="340" y1="136" x2="340" y2="152" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="230" y="152" width="220" height="36" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="340" y="171" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">3. Aware接口回调</text>
<line x1="340" y1="188" x2="340" y2="204" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="230" y="204" width="220" height="36" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="340" y="223" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">4. BeanPostProcessor前置</text>
<line x1="340" y1="240" x2="340" y2="256" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="230" y="256" width="220" height="36" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="340" y="275" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">5. InitializingBean</text>
<line x1="340" y1="292" x2="340" y2="308" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="230" y="308" width="220" height="36" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="340" y="327" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">6. init-method</text>
<line x1="340" y1="344" x2="340" y2="360" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="230" y="360" width="220" height="36" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="340" y="379" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">7. BeanPostProcessor后置</text>
<line x1="340" y1="396" x2="340" y2="412" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="230" y="412" width="220" height="36" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="431" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Bean就绪可用</text>
<rect x="480" y="48" width="180" height="90" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="570" y="66" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">三级缓存:</text>
<text x="570" y="82" text-anchor="middle" font-size="10" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">L1: singletonObjects</text>
<text x="570" y="96" text-anchor="middle" font-size="10" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">L2: earlySingletonObjects</text>
<text x="570" y="110" text-anchor="middle" font-size="10" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">L3: singletonFactories</text>
<text x="570" y="128" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">解决循环依赖</text>
<rect x="480" y="200" width="180" height="50" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="570" y="220" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">AOP代理:</text>
<text x="570" y="238" text-anchor="middle" font-size="10" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">步骤7中创建代理对象</text>
</svg>