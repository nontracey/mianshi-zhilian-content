<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">反射与注解的运行时边界</title>
  <desc id="desc">展示 Class 镜像来源、反射 API、注解保留阶段、模块访问边界和框架消费链路。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5f99"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b24634"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #14213d; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .label { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 14px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .code { font: 600 13px Menlo, Consolas, monospace; fill: #263238; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .box-blue { fill: #e8f4ff; stroke: #7bb6e8; stroke-width: 2; rx: 12; }
      .box-green { fill: #e9f7ef; stroke: #6abf8a; stroke-width: 2; rx: 12; }
      .box-yellow { fill: #fff6d9; stroke: #e3b64b; stroke-width: 2; rx: 12; }
      .box-red { fill: #fdecea; stroke: #d46a5b; stroke-width: 2; rx: 12; }
      .box-gray { fill: #f1f5f9; stroke: #a7b5c4; stroke-width: 2; rx: 12; }
      .line { stroke: #1f5f99; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #b24634; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #7b8794; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">反射与注解：从 Class 镜像到框架行为</text>
  <text x="50" y="86" class="subtitle">理解元数据从哪里来、谁能读、在哪里会被模块和性能边界拦住。</text>

  <rect x="40" y="120" width="560" height="310" class="panel"/>
  <text x="68" y="156" class="panel-title">1. Class 镜像身份</text>
  <rect x="76" y="190" width="160" height="76" class="box-blue"/>
  <text x="112" y="220" class="label">ClassLoader</text>
  <text x="104" y="246" class="tiny">定义类的加载器</text>
  <rect x="364" y="190" width="160" height="76" class="box-blue"/>
  <text x="400" y="220" class="label">二进制类名</text>
  <text x="403" y="246" class="code">pkg.User</text>
  <line x1="236" y1="228" x2="364" y2="228" class="line"/>
  <rect x="188" y="304" width="224" height="82" class="box-green"/>
  <text x="242" y="334" class="label">Class 镜像</text>
  <text x="218" y="360" class="small">同名类 + 不同加载器</text>
  <text x="224" y="380" class="small">会得到不同 Class</text>
  <line x1="156" y1="266" x2="244" y2="304" class="line"/>
  <line x1="444" y1="266" x2="354" y2="304" class="line"/>
  <text x="84" y="412" class="tiny">入口：T.class / obj.getClass() / Class.forName</text>

  <rect x="640" y="120" width="600" height="310" class="panel"/>
  <text x="668" y="156" class="panel-title">2. 反射 API 与访问检查</text>
  <rect x="672" y="192" width="126" height="72" class="box-yellow"/>
  <text x="690" y="220" class="label">Constructor</text>
  <text x="700" y="244" class="tiny">newInstance</text>
  <rect x="818" y="192" width="126" height="72" class="box-yellow"/>
  <text x="862" y="220" class="label">Field</text>
  <text x="858" y="244" class="tiny">get / set</text>
  <rect x="964" y="192" width="126" height="72" class="box-yellow"/>
  <text x="998" y="220" class="label">Method</text>
  <text x="1007" y="244" class="tiny">invoke</text>
  <rect x="1110" y="192" width="104" height="72" class="box-red"/>
  <text x="1124" y="220" class="label">访问边界</text>
  <text x="1126" y="244" class="tiny">private / JPMS</text>
  <line x1="798" y1="228" x2="818" y2="228" class="line"/>
  <line x1="944" y1="228" x2="964" y2="228" class="line"/>
  <line x1="1090" y1="228" x2="1110" y2="228" class="line-red"/>
  <rect x="672" y="312" width="542" height="74" class="box-gray"/>
  <text x="698" y="342" class="small">getXxx：public + 继承成员；getDeclaredXxx：当前类声明成员</text>
  <text x="698" y="366" class="small">setAccessible / trySetAccessible 仍受 opens、--add-opens、Lookup 权限影响</text>

  <rect x="40" y="470" width="560" height="354" class="panel"/>
  <text x="68" y="506" class="panel-title">3. 注解保留阶段决定谁能消费</text>
  <rect x="76" y="544" width="134" height="78" class="box-green"/>
  <text x="106" y="575" class="label">SOURCE</text>
  <text x="102" y="600" class="tiny">源码/编译器</text>
  <rect x="232" y="544" width="134" height="78" class="box-yellow"/>
  <text x="268" y="575" class="label">CLASS</text>
  <text x="258" y="600" class="tiny">class 文件</text>
  <rect x="388" y="544" width="134" height="78" class="box-blue"/>
  <text x="418" y="575" class="label">RUNTIME</text>
  <text x="418" y="600" class="tiny">运行时反射</text>
  <line x1="210" y1="583" x2="232" y2="583" class="line"/>
  <line x1="366" y1="583" x2="388" y2="583" class="line"/>
  <rect x="78" y="672" width="132" height="76" class="box-gray"/>
  <text x="106" y="702" class="small">APT</text>
  <text x="92" y="726" class="tiny">生成代码/报错</text>
  <rect x="232" y="672" width="132" height="76" class="box-gray"/>
  <text x="260" y="702" class="small">字节码工具</text>
  <text x="254" y="726" class="tiny">扫描/增强</text>
  <rect x="386" y="672" width="132" height="76" class="box-gray"/>
  <text x="418" y="702" class="small">运行框架</text>
  <text x="408" y="726" class="tiny">Spring / JUnit</text>
  <line x1="143" y1="622" x2="144" y2="672" class="line"/>
  <line x1="299" y1="622" x2="298" y2="672" class="line"/>
  <line x1="455" y1="622" x2="452" y2="672" class="line"/>
  <text x="72" y="792" class="small">注解只声明元数据；处理器读取后才注册 Bean、路由、校验、事务或测试用例。</text>

  <rect x="640" y="470" width="600" height="354" class="panel"/>
  <text x="668" y="506" class="panel-title">4. 框架使用方式与性能出口</text>
  <rect x="672" y="544" width="136" height="72" class="box-blue"/>
  <text x="704" y="572" class="label">扫描类</text>
  <text x="688" y="596" class="tiny">Classpath / module</text>
  <rect x="860" y="544" width="136" height="72" class="box-blue"/>
  <text x="896" y="572" class="label">读注解</text>
  <text x="882" y="596" class="tiny">Class / Method</text>
  <rect x="1048" y="544" width="136" height="72" class="box-blue"/>
  <text x="1080" y="572" class="label">注册行为</text>
  <text x="1070" y="596" class="tiny">Bean / route / test</text>
  <line x1="808" y1="580" x2="860" y2="580" class="line"/>
  <line x1="996" y1="580" x2="1048" y2="580" class="line"/>
  <rect x="672" y="668" width="230" height="92" class="box-green"/>
  <text x="720" y="700" class="label">低频路径</text>
  <text x="702" y="726" class="small">启动扫描、对象装配</text>
  <text x="710" y="748" class="small">缓存 Method / Field</text>
  <rect x="954" y="668" width="230" height="92" class="box-red"/>
  <text x="1002" y="700" class="label">热点路径</text>
  <text x="984" y="726" class="small">MethodHandle / lambda</text>
  <text x="984" y="748" class="small">字节码生成 / 直接调用</text>
  <path d="M 740 616 C 742 644, 764 656, 786 668" class="line"/>
  <path d="M 1116 616 C 1114 644, 1092 656, 1068 668" class="line-red"/>
  <text x="674" y="794" class="small">先用 JFR 或火焰图确认热点，再决定是否替换反射调用。</text>

  <path d="M 600 278 C 620 278, 626 278, 640 278" class="dash"/>
  <text x="562" y="258" class="tiny">Class 展开</text>
  <path d="M 1116 430 C 1088 456, 1080 486, 1080 544" class="dash"/>
  <text x="1040" y="458" class="tiny">框架扫描</text>
  <path d="M 452 748 C 590 806, 764 800, 954 714" class="dash"/>
  <text x="520" y="846" class="tiny">RUNTIME 注解驱动运行时框架行为</text>

  <rect x="40" y="868" width="1200" height="330" class="panel"/>
  <text x="68" y="904" class="panel-title">5. 读图路径：回答时按这条线展开</text>
  <rect x="78" y="944" width="184" height="92" class="box-blue"/>
  <text x="118" y="978" class="label">确定 Class</text>
  <text x="102" y="1004" class="small">ClassLoader + 类名</text>
  <rect x="304" y="944" width="184" height="92" class="box-yellow"/>
  <text x="344" y="978" class="label">展开成员</text>
  <text x="330" y="1004" class="small">构造器 / 字段 / 方法</text>
  <rect x="530" y="944" width="184" height="92" class="box-red"/>
  <text x="570" y="978" class="label">检查边界</text>
  <text x="558" y="1004" class="small">访问权限与 JPMS</text>
  <rect x="756" y="944" width="184" height="92" class="box-green"/>
  <text x="796" y="978" class="label">读取注解</text>
  <text x="782" y="1004" class="small">按 Retention 分流</text>
  <rect x="982" y="944" width="184" height="92" class="box-gray"/>
  <text x="1022" y="978" class="label">选择出口</text>
  <text x="1006" y="1004" class="small">缓存 / MH / 生成类</text>
  <line x1="262" y1="990" x2="304" y2="990" class="line"/>
  <line x1="488" y1="990" x2="530" y2="990" class="line"/>
  <line x1="714" y1="990" x2="756" y2="990" class="line"/>
  <line x1="940" y1="990" x2="982" y2="990" class="line"/>
  <rect x="78" y="1084" width="1088" height="70" class="box-gray"/>
  <text x="104" y="1114" class="small">一句话收束：反射解决“运行时不知道具体类也能操作元数据”，注解提供声明，处理器负责把声明变成框架行为。</text>
  <text x="104" y="1140" class="small">加分点：同名类受 ClassLoader 隔离，私有访问受 JPMS 限制，热点路径先度量再替换。</text>
</svg>
