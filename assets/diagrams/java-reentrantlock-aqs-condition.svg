<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">ReentrantLock 获取、重入与 Condition 路径</title>
  <desc id="desc">展示 ReentrantLock 基于 AQS 的 state 重入计数、非公平与公平获取差异、超时/中断等待，以及 Condition 条件队列到同步队列的迁移。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5f99"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b24634"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #14213d; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .label { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 14px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .code { font: 600 13px Menlo, Consolas, monospace; fill: #263238; }
      .blue { fill: #e8f4ff; stroke: #6aa9df; stroke-width: 2; rx: 12; }
      .green { fill: #e9f7ef; stroke: #58b77d; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff5d6; stroke: #e0ae35; stroke-width: 2; rx: 12; }
      .red { fill: #fdecea; stroke: #cf5d4b; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #a7b5c4; stroke-width: 2; rx: 12; }
      .line { stroke: #1f5f99; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #b24634; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #7b8794; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">ReentrantLock：AQS 独占锁的真实路径</text>
  <text x="50" y="86" class="subtitle">重入层数、fair/nonfair 获取入口、可中断/超时等待，以及 Condition 条件队列迁移。</text>

  <rect x="40" y="120" width="1200" height="255" class="panel"/>
  <text x="68" y="156" class="panel-title">1. state 是同一 owner 的重入层数</text>
  <rect x="80" y="198" width="150" height="72" class="gray"/>
  <text x="112" y="226" class="label">state = 0</text>
  <text x="114" y="250" class="tiny">未被持有</text>
  <rect x="286" y="198" width="172" height="72" class="blue"/>
  <text x="326" y="226" class="label">Thread-A</text>
  <text x="316" y="250" class="tiny">CAS state 0 -> 1</text>
  <rect x="514" y="198" width="172" height="72" class="green"/>
  <text x="548" y="226" class="label">再次进入</text>
  <text x="548" y="250" class="tiny">state 1 -> 2</text>
  <rect x="742" y="198" width="172" height="72" class="yellow"/>
  <text x="788" y="226" class="label">unlock</text>
  <text x="784" y="250" class="tiny">state 2 -> 1</text>
  <rect x="970" y="198" width="172" height="72" class="red"/>
  <text x="1016" y="226" class="label">完全释放</text>
  <text x="1004" y="250" class="tiny">state 1 -> 0, clear owner</text>
  <line x1="230" y1="234" x2="286" y2="234" class="line"/>
  <line x1="458" y1="234" x2="514" y2="234" class="line"/>
  <line x1="686" y1="234" x2="742" y2="234" class="line"/>
  <line x1="914" y1="234" x2="970" y2="234" class="line-red"/>
  <text x="84" y="322" class="small">只有 owner 线程可以重入；释放到 0 时才唤醒 AQS 同步队列中的后继重新竞争。</text>

  <rect x="40" y="415" width="585" height="330" class="panel"/>
  <text x="68" y="451" class="panel-title">2. 非公平锁：先抢，再排队</text>
  <rect x="76" y="500" width="156" height="72" class="blue"/>
  <text x="112" y="528" class="label">lock()</text>
  <text x="100" y="552" class="tiny">入口先尝试 CAS</text>
  <rect x="276" y="500" width="156" height="72" class="green"/>
  <text x="318" y="528" class="label">抢到 state</text>
  <text x="306" y="552" class="tiny">直接成为 owner</text>
  <rect x="276" y="626" width="156" height="72" class="yellow"/>
  <text x="318" y="654" class="label">抢不到</text>
  <text x="306" y="678" class="tiny">进入同步队列</text>
  <rect x="474" y="626" width="116" height="72" class="gray"/>
  <text x="506" y="654" class="label">park</text>
  <text x="496" y="678" class="tiny">等前驱释放</text>
  <line x1="232" y1="536" x2="276" y2="536" class="line"/>
  <line x1="154" y1="572" x2="154" y2="662" class="dash"/>
  <line x1="154" y1="662" x2="276" y2="662" class="line-red"/>
  <line x1="432" y1="662" x2="474" y2="662" class="line"/>
  <text x="82" y="711" class="small">队列里已有等待者时，新线程仍可能在锁空闲瞬间抢到，吞吐优先但等待时间更抖。</text>

  <rect x="655" y="415" width="585" height="330" class="panel"/>
  <text x="683" y="451" class="panel-title">3. 公平锁：先看队列前驱</text>
  <rect x="692" y="500" width="156" height="72" class="blue"/>
  <text x="730" y="528" class="label">lock()</text>
  <text x="714" y="552" class="tiny">hasQueuedPredecessors</text>
  <rect x="892" y="500" width="156" height="72" class="yellow"/>
  <text x="930" y="528" class="label">前面有人</text>
  <text x="926" y="552" class="tiny">入队等待</text>
  <rect x="892" y="626" width="156" height="72" class="green"/>
  <text x="930" y="654" class="label">前面没人</text>
  <text x="918" y="678" class="tiny">CAS 获取 state</text>
  <rect x="1084" y="500" width="116" height="72" class="gray"/>
  <text x="1116" y="528" class="label">队首</text>
  <text x="1104" y="552" class="tiny">释放后唤醒</text>
  <line x1="848" y1="536" x2="892" y2="536" class="line-red"/>
  <line x1="848" y1="536" x2="892" y2="662" class="line"/>
  <line x1="1048" y1="536" x2="1084" y2="536" class="line"/>
  <text x="696" y="711" class="small">公平改善排队解释性；代价是更多队列检查和线程切换，常见吞吐会下降。</text>

  <rect x="40" y="785" width="1200" height="300" class="panel"/>
  <text x="68" y="821" class="panel-title">4. Condition：保存持有层数，释放锁，signal 后回同步队列</text>
  <rect x="76" y="872" width="150" height="72" class="blue"/>
  <text x="108" y="900" class="label">await()</text>
  <text x="96" y="924" class="tiny">持锁线程调用</text>
  <rect x="276" y="872" width="170" height="72" class="yellow"/>
  <text x="310" y="900" class="label">保存 hold count</text>
  <text x="304" y="924" class="tiny">完全释放 state</text>
  <rect x="496" y="872" width="170" height="72" class="gray"/>
  <text x="536" y="900" class="label">条件队列</text>
  <text x="526" y="924" class="tiny">等待业务条件</text>
  <rect x="716" y="872" width="170" height="72" class="green"/>
  <text x="762" y="900" class="label">signal()</text>
  <text x="744" y="924" class="tiny">转入同步队列</text>
  <rect x="936" y="872" width="190" height="72" class="red"/>
  <text x="976" y="900" class="label">重新 acquire</text>
  <text x="968" y="924" class="tiny">恢复原持有层数</text>
  <line x1="226" y1="908" x2="276" y2="908" class="line"/>
  <line x1="446" y1="908" x2="496" y2="908" class="line"/>
  <line x1="666" y1="908" x2="716" y2="908" class="line"/>
  <line x1="886" y1="908" x2="936" y2="908" class="line-red"/>
  <rect x="96" y="1000" width="1020" height="50" class="gray"/>
  <text x="124" y="1030" class="small">等待条件使用 while 重查；signal 只是迁移节点，不代表等待线程已经获得锁或业务条件仍然成立。</text>

  <rect x="40" y="1125" width="1200" height="90" class="panel"/>
  <text x="68" y="1160" class="panel-title">选型抓手</text>
  <text x="188" y="1160" class="small">简单互斥优先 synchronized；需要中断、超时、公平或多个条件队列时选择 ReentrantLock。</text>
  <text x="188" y="1192" class="small">线上优化先看持锁时长和慢调用位置，再决定是否调整公平策略、拆锁或改用无锁/分段结构。</text>
</svg>
