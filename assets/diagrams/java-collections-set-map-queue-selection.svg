<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">Java Set, TreeMap, LinkedHashMap, Queue collection choices</title>
  <desc id="desc">A topic-specific diagram mapping Java collection choices to semantics: uniqueness, sorted/range lookup, insertion/access order, FIFO/deque, and priority heap, with implementation and common pitfalls.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 33px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .chip { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="70" y="64">Set、TreeMap 与 Queue：按语义选集合，而不是背类名</text>
  <text class="subtitle" x="70" y="96">先判断是否去重、是否排序/范围查询、是否保持访问顺序、是否队列/优先级，再落到具体实现和坑。</text>

  <rect class="section" x="70" y="130" width="1180" height="350" rx="16"/>
  <text class="section-title" x="96" y="166">1. 去重集合：HashSet、LinkedHashSet、TreeSet</text>

  <rect class="blue" x="105" y="215" width="310" height="112" rx="14" stroke-width="2"/>
  <text class="box-title" x="132" y="247">HashSet</text>
  <text class="text" x="132" y="272">HashMap key + PRESENT 哑 value</text>
  <text class="mono" x="132" y="294">hashCode + equals</text>
  <text class="text" x="132" y="314">查找/插入平均 O(1)，无遍历顺序承诺</text>

  <rect class="green" x="505" y="215" width="310" height="112" rx="14" stroke-width="2"/>
  <text class="box-title" x="532" y="247">LinkedHashSet</text>
  <text class="text" x="532" y="272">HashSet + 双向链表顺序</text>
  <text class="mono" x="532" y="294">insertion order</text>
  <text class="text" x="532" y="314">需要去重且保留插入顺序</text>

  <rect class="yellow" x="905" y="215" width="310" height="112" rx="14" stroke-width="2"/>
  <text class="box-title" x="932" y="247">TreeSet</text>
  <text class="text" x="932" y="272">TreeMap 红黑树 key</text>
  <text class="mono" x="932" y="294">compare(a,b) == 0 means duplicate</text>
  <text class="text" x="932" y="314">排序、first/last、范围视图 O(log n)</text>

  <text class="small" x="105" y="385">关键坑：HashSet 去重看 equals/hashCode；TreeSet 去重看 Comparable/Comparator 的比较结果，比较为 0 就视为同一个元素，即使 equals 为 false。</text>
  <text class="small" x="105" y="412">自然排序下 TreeSet/TreeMap 通常不接受 null；若自定义 Comparator 明确处理 null，才可支持。</text>

  <rect class="section" x="70" y="520" width="580" height="345" rx="16"/>
  <text class="section-title" x="96" y="556">2. 有序 Map 与 LRU</text>

  <rect class="yellow" x="105" y="605" width="235" height="96" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="637">TreeMap</text>
  <text class="text" x="132" y="662">红黑树，key 有序</text>
  <text class="mono" x="132" y="682">floor/ceiling/subMap</text>

  <rect class="green" x="390" y="605" width="220" height="96" rx="12" stroke-width="2"/>
  <text class="box-title" x="417" y="637">LinkedHashMap</text>
  <text class="text" x="417" y="662">HashMap + 双向链表</text>
  <text class="mono" x="417" y="682">insertion/access order</text>

  <rect class="red" x="105" y="750" width="505" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="780">LRU 的正确边界</text>
  <text class="text" x="132" y="804">accessOrder=true + removeEldestEntry；非线程安全，get 也会改变访问顺序。</text>

  <rect class="section" x="690" y="520" width="560" height="345" rx="16"/>
  <text class="section-title" x="716" y="556">3. Queue：FIFO/Deque 与 PriorityQueue 是两类问题</text>

  <rect class="blue" x="725" y="605" width="220" height="96" rx="12" stroke-width="2"/>
  <text class="box-title" x="752" y="637">ArrayDeque</text>
  <text class="text" x="752" y="662">循环数组，头尾操作快</text>
  <text class="mono" x="752" y="682">stack / queue / deque</text>

  <rect class="violet" x="995" y="605" width="220" height="96" rx="12" stroke-width="2"/>
  <text class="box-title" x="1022" y="637">PriorityQueue</text>
  <text class="text" x="1022" y="662">Object[] 完全二叉堆</text>
  <text class="mono" x="1022" y="682">peek O(1), offer/poll O(log n)</text>

  <rect class="red" x="725" y="750" width="490" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="752" y="780">PriorityQueue 的坑</text>
  <text class="text" x="752" y="804">iterator 不保证排序；只有连续 poll 才按优先级输出。默认小顶堆，不稳定，不允许 null。</text>

  <rect class="section" x="70" y="905" width="1180" height="250" rx="16"/>
  <text class="section-title" x="96" y="941">4. 选型速查</text>

  <rect class="blue" x="105" y="980" width="200" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="1010">只去重</text>
  <text class="mono" x="132" y="1035">HashSet</text>

  <rect class="green" x="340" y="980" width="200" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="367" y="1010">去重且保序</text>
  <text class="mono" x="367" y="1035">LinkedHashSet</text>

  <rect class="yellow" x="575" y="980" width="200" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="602" y="1010">排序/范围查询</text>
  <text class="mono" x="602" y="1035">TreeSet / TreeMap</text>

  <rect class="cyan" x="810" y="980" width="180" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="837" y="1010">FIFO/Deque</text>
  <text class="mono" x="837" y="1035">ArrayDeque</text>

  <rect class="violet" x="1025" y="980" width="180" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="1052" y="1010">TopK/调度</text>
  <text class="mono" x="1052" y="1035">PriorityQueue</text>

  <text class="small" x="105" y="1110">多线程默认不要换 Hashtable/Vector；Map 用 ConcurrentHashMap，队列用 concurrent 包里的 BlockingQueue/ConcurrentLinkedQueue，根据阻塞语义选择。</text>

  <text class="small" x="96" y="1238">面试抓手：把“去重依据、排序依据、范围操作、访问顺序、堆语义、iterator 顺序、线程安全”说清，比背集合继承树更有价值。</text>
</svg>
