<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">Java Set, TreeMap, LinkedHashMap, Queue collection choices</title><desc id="desc">A topic-specific diagram mapping Java collection choices to semantics: uniqueness, sorted/range lookup, insertion/access order, FIFO/deque, and priority heap, with implementation and common pitfalls.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 33px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.section{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}</style></defs><rect width="1320" height="1320" class="bg"/><text x="70" y="64" class="title">Set、TreeMap 与 Queue：按语义选集合，而不是背类名</text><text x="70" y="96" class="subtitle">先判断是否去重、是否排序/范围查询、是否保持访问顺序、是否队列/优先级，再落到具体实现和坑。</text><rect width="1180" height="350" x="70" y="130" class="section" rx="16"/><text x="96" y="166" class="section-title">1. 去重集合：HashSet、LinkedHashSet、TreeSet</text><rect width="310" height="112" x="105" y="215" stroke-width="2" class="blue" rx="14"/><text x="132" y="247" class="box-title">HashSet</text><text x="132" y="272" class="text">HashMap key + PRESENT 哑 value</text><text x="132" y="294" class="mono">hashCode + equals</text><text x="132" y="314" class="text">查找/插入平均 O(1)，无遍历顺序承诺</text><rect width="310" height="112" x="505" y="215" stroke-width="2" class="green" rx="14"/><text x="532" y="247" class="box-title">LinkedHashSet</text><text x="532" y="272" class="text">HashSet + 双向链表顺序</text><text x="532" y="294" class="mono">insertion order</text><text x="532" y="314" class="text">需要去重且保留插入顺序</text><rect width="310" height="112" x="905" y="215" stroke-width="2" class="yellow" rx="14"/><text x="932" y="247" class="box-title">TreeSet</text><text x="932" y="272" class="text">TreeMap 红黑树 key</text><text x="932" y="294" class="mono">compare(a,b) == 0 means duplicate</text><text x="932" y="314" class="text">排序、first/last、范围视图 O(log n)</text><text x="105" y="385" class="small">关键坑：HashSet 去重看 equals/hashCode；TreeSet 去重看 Comparable/Comparator 的比较结果，比较为 0 就视为同一个元素，即使 equals 为 false。</text><text x="105" y="412" class="small">自然排序下 TreeSet/TreeMap 通常不接受 null；若自定义 Comparator 明确处理 null，才可支持。</text><rect width="580" height="345" x="70" y="520" class="section" rx="16"/><text x="96" y="556" class="section-title">2. 有序 Map 与 LRU</text><rect width="235" height="96" x="105" y="605" stroke-width="2" class="yellow" rx="12"/><text x="132" y="637" class="box-title">TreeMap</text><text x="132" y="662" class="text">红黑树，key 有序</text><text x="132" y="682" class="mono">floor/ceiling/subMap</text><rect width="220" height="96" x="390" y="605" stroke-width="2" class="green" rx="12"/><text x="417" y="637" class="box-title">LinkedHashMap</text><text x="417" y="662" class="text">HashMap + 双向链表</text><text x="417" y="682" class="mono">insertion/access order</text><rect width="505" height="78" x="105" y="750" stroke-width="2" class="red" rx="12"/><text x="132" y="780" class="box-title">LRU 的正确边界</text><text x="132" y="804" class="text">accessOrder=true + removeEldestEntry；非线程安全，get 也会改变访问顺序。</text><rect width="560" height="345" x="690" y="520" class="section" rx="16"/><text x="716" y="556" class="section-title">3. Queue：FIFO/Deque 与 PriorityQueue 是两类问题</text><rect width="220" height="96" x="725" y="605" stroke-width="2" class="blue" rx="12"/><text x="752" y="637" class="box-title">ArrayDeque</text><text x="752" y="662" class="text">循环数组，头尾操作快</text><text x="752" y="682" class="mono">stack / queue / deque</text><rect width="220" height="96" x="995" y="605" stroke-width="2" class="violet" rx="12"/><text x="1022" y="637" class="box-title">PriorityQueue</text><text x="1022" y="662" class="text">Object[] 完全二叉堆</text><text x="1022" y="682" class="mono">peek O(1), offer/poll O(log n)</text><rect width="490" height="78" x="725" y="750" stroke-width="2" class="red" rx="12"/><text x="752" y="780" class="box-title">PriorityQueue 的坑</text><text x="752" y="804" class="text">iterator 不保证排序；只有连续 poll 才按优先级输出。默认小顶堆，不稳定，不允许 null。</text><rect width="1180" height="250" x="70" y="905" class="section" rx="16"/><text x="96" y="941" class="section-title">4. 选型速查</text><rect width="200" height="78" x="105" y="980" stroke-width="2" class="blue" rx="12"/><text x="132" y="1010" class="box-title">只去重</text><text x="132" y="1035" class="mono">HashSet</text><rect width="200" height="78" x="340" y="980" stroke-width="2" class="green" rx="12"/><text x="367" y="1010" class="box-title">去重且保序</text><text x="367" y="1035" class="mono">LinkedHashSet</text><rect width="200" height="78" x="575" y="980" stroke-width="2" class="yellow" rx="12"/><text x="602" y="1010" class="box-title">排序/范围查询</text><text x="602" y="1035" class="mono">TreeSet / TreeMap</text><rect width="180" height="78" x="810" y="980" stroke-width="2" class="cyan" rx="12"/><text x="837" y="1010" class="box-title">FIFO/Deque</text><text x="837" y="1035" class="mono">ArrayDeque</text><rect width="180" height="78" x="1025" y="980" stroke-width="2" class="violet" rx="12"/><text x="1052" y="1010" class="box-title">TopK/调度</text><text x="1052" y="1035" class="mono">PriorityQueue</text><text x="105" y="1110" class="small">多线程默认不要换 Hashtable/Vector；Map 用 ConcurrentHashMap，队列用 concurrent 包里的 BlockingQueue/ConcurrentLinkedQueue，根据阻塞语义选择。</text><text x="96" y="1238" class="small">面试抓手：把“去重依据、排序依据、范围操作、访问顺序、堆语义、iterator 顺序、线程安全”说清，比背集合继承树更有价值。</text></svg>