<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">Sentinel 资源、Slot Chain 与规则判定</title>
  <desc id="desc">展示 Sentinel 从资源入口、Context 和 Entry、Slot Chain 统计、流控/热点/系统/授权/熔断规则、BlockException、fallback、Dashboard 和规则持久化的完整链路。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .box-title { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 13px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .blue { fill: #e8f2ff; stroke: #60a5fa; stroke-width: 2; rx: 12; }
      .green { fill: #e8f8ef; stroke: #4ade80; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff7d6; stroke: #facc15; stroke-width: 2; rx: 12; }
      .orange { fill: #fff1e6; stroke: #fb923c; stroke-width: 2; rx: 12; }
      .red { fill: #feecec; stroke: #f87171; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #b45309; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">Sentinel：以资源为入口，用统计和规则保护调用链</text>
  <text x="50" y="86" class="subtitle">核心不是“熔断开关”，而是 Resource、Slot Chain、实时统计、规则判定、阻塞处理和规则治理。</text>

  <rect x="40" y="120" width="1200" height="355" class="panel"/>
  <text x="68" y="156" class="panel-title">1. 资源进入 Slot Chain</text>
  <rect x="78" y="220" width="160" height="64" class="blue"/>
  <text x="112" y="246" class="box-title">Request</text>
  <text x="100" y="268" class="tiny">接口/方法/代码块</text>
  <rect x="292" y="220" width="170" height="64" class="green"/>
  <text x="326" y="246" class="box-title">Resource</text>
  <text x="316" y="268" class="tiny">SphU.entry / 注解</text>
  <rect x="516" y="220" width="170" height="64" class="gray"/>
  <text x="560" y="246" class="box-title">Context</text>
  <text x="540" y="268" class="tiny">调用入口和调用树</text>
  <rect x="740" y="220" width="170" height="64" class="yellow"/>
  <text x="780" y="246" class="box-title">Statistic</text>
  <text x="764" y="268" class="tiny">QPS/并发/RT/异常</text>
  <rect x="964" y="220" width="180" height="64" class="orange"/>
  <text x="1002" y="246" class="box-title">Rule check</text>
  <text x="986" y="268" class="tiny">按资源查规则</text>
  <line x1="238" y1="252" x2="292" y2="252" class="line"/>
  <line x1="462" y1="252" x2="516" y2="252" class="line"/>
  <line x1="686" y1="252" x2="740" y2="252" class="line"/>
  <line x1="910" y1="252" x2="964" y2="252" class="line"/>

  <rect x="110" y="360" width="160" height="58" class="green"/>
  <text x="150" y="384" class="box-title">Pass</text>
  <text x="134" y="404" class="tiny">执行业务并 exit</text>
  <rect x="360" y="360" width="185" height="58" class="red"/>
  <text x="402" y="384" class="box-title">BlockException</text>
  <text x="388" y="404" class="tiny">blockHandler 处理</text>
  <rect x="635" y="360" width="185" height="58" class="yellow"/>
  <text x="680" y="384" class="box-title">Business error</text>
  <text x="660" y="404" class="tiny">fallback 或上抛</text>
  <rect x="910" y="360" width="210" height="58" class="gray"/>
  <text x="958" y="384" class="box-title">Metrics</text>
  <text x="940" y="404" class="tiny">Dashboard / logs / datasource</text>
  <path d="M1054,284 C1054,330 190,320 190,360" class="line"/>
  <path d="M1054,284 C1054,330 452,320 452,360" class="line-red"/>
  <line x1="270" y1="389" x2="360" y2="389" class="line-red"/>
  <line x1="820" y1="389" x2="910" y2="389" class="line"/>

  <rect x="40" y="515" width="1200" height="325" class="panel"/>
  <text x="68" y="551" class="panel-title">2. 规则类型和常见误区</text>
  <rect x="82" y="610" width="210" height="64" class="blue"/>
  <text x="130" y="636" class="box-title">FlowRule</text>
  <text x="104" y="658" class="tiny">QPS/并发，直接/关联/链路</text>
  <rect x="348" y="610" width="210" height="64" class="yellow"/>
  <text x="392" y="636" class="box-title">ParamFlowRule</text>
  <text x="372" y="658" class="tiny">热点参数和单值阈值</text>
  <rect x="614" y="610" width="210" height="64" class="green"/>
  <text x="668" y="636" class="box-title">SystemRule</text>
  <text x="638" y="658" class="tiny">入口 QPS/CPU/负载/RT</text>
  <rect x="880" y="610" width="210" height="64" class="orange"/>
  <text x="932" y="636" class="box-title">DegradeRule</text>
  <text x="904" y="658" class="tiny">慢调用/异常比例/异常数</text>
  <rect x="212" y="740" width="210" height="64" class="gray"/>
  <text x="260" y="766" class="box-title">AuthorityRule</text>
  <text x="236" y="788" class="tiny">黑白名单来源控制</text>
  <rect x="482" y="740" width="210" height="64" class="red"/>
  <text x="522" y="766" class="box-title">Rule persistence</text>
  <text x="506" y="788" class="tiny">Nacos/Apollo/OpenSergo 等</text>
  <rect x="752" y="740" width="230" height="64" class="green"/>
  <text x="792" y="766" class="box-title">Dashboard</text>
  <text x="778" y="788" class="tiny">监控和规则下发，不替代治理</text>

  <rect x="40" y="880" width="585" height="245" class="panel"/>
  <text x="68" y="916" class="panel-title">3. 和 Hystrix / Resilience4j 的差异</text>
  <text x="82" y="972" class="small">Sentinel 更强调流量治理：QPS、并发、热点参数、系统自适应保护。</text>
  <text x="82" y="1012" class="small">Hystrix 已停更，重点是线程池/信号量隔离和熔断。</text>
  <text x="82" y="1052" class="small">Resilience4j 是轻量函数式容错库，常组合限流、重试、舱壁和熔断。</text>
  <text x="82" y="1092" class="small">选型不要只看功能名，要看隔离模型、控制面、规则治理和观测接入。</text>

  <rect x="655" y="880" width="585" height="245" class="panel"/>
  <text x="683" y="916" class="panel-title">4. 排查抓手</text>
  <text x="692" y="972" class="small">先区分是 BlockException 还是业务异常；两者处理链不同。</text>
  <text x="692" y="1012" class="small">再看资源名是否一致、规则是否下发、窗口统计是否达到阈值。</text>
  <text x="692" y="1052" class="small">最后看 Dashboard、日志、metrics、规则数据源和机器时间是否一致。</text>
  <text x="692" y="1092" class="small">压测时验证拒绝比例、恢复时间、fallback 语义和下游压力。</text>

  <rect x="40" y="1170" width="1200" height="64" class="panel"/>
  <text x="68" y="1207" class="panel-title">回答抓手</text>
  <text x="190" y="1207" class="small">Resource -> Entry/Context -> Slot Chain 统计 -> Flow/Param/System/Authority/Degrade -> BlockException/blockHandler -> 业务异常/fallback -> Dashboard/数据源治理。</text>
</svg>
