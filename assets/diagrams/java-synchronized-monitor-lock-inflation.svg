<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1280"><title id="title">synchronized 从字节码到 ObjectMonitor</title><desc id="desc">展示 synchronized 的锁对象、字节码入口、Mark Word 轻量级锁、ObjectMonitor 膨胀、EntryList、WaitSet、可见性和版本边界。</desc><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#1f5f99" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#b24634" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f7fafc}.title{font:700 30px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#14213d}.subtitle{font:400 15px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.panel{fill:#fff;stroke:#d9e2ec;stroke-width:2;rx:16}.label{fill:#1f2933}.panel-title{font:700 20px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#1f2933}.label{font:700 16px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.small{font:400 14px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#334e68}.tiny{font:400 12px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.code{font:600 13px Menlo,Consolas,monospace;fill:#263238}.blue{fill:#e8f4ff;stroke:#6aa9df}.blue,.gray{stroke-width:2;rx:12}.green{fill:#e9f7ef;stroke:#58b77d}.green,.red,.yellow{stroke-width:2;rx:12}.yellow{fill:#fff5d6;stroke:#e0ae35}.red{fill:#fdecea;stroke:#cf5d4b}.gray{fill:#f1f5f9;stroke:#a7b5c4}.line,.line-red{stroke:#1f5f99;stroke-width:3;fill:none;marker-end:url(#arrow)}.line-red{stroke:#b24634;marker-end:url(#arrow-red)}</style></defs><rect width="1280" height="1280" class="bg"/><text x="48" y="56" class="title">synchronized：锁对象、monitor 与锁膨胀</text><text x="50" y="86" class="subtitle">先确认锁对象，再从字节码进入 HotSpot 快路径和 ObjectMonitor 慢路径。</text><rect width="1200" height="220" x="40" y="120" class="panel"/><text x="68" y="156" class="panel-title">1. 三种写法锁不同对象</text><rect width="260" height="76" x="84" y="196" class="blue"/><text x="130" y="226" class="label">实例同步方法</text><text x="126" y="250" class="code">synchronized void m()</text><text x="126" y="268" class="tiny">锁 this，不同实例不互斥</text><rect width="260" height="76" x="510" y="196" class="green"/><text x="558" y="226" class="label">静态同步方法</text><text x="556" y="250" class="code">static synchronized m()</text><text x="568" y="268" class="tiny">锁 Class 对象</text><rect width="260" height="76" x="936" y="196" class="yellow"/><text x="994" y="226" class="label">同步代码块</text><text x="1000" y="250" class="code">synchronized (lock)</text><text x="1004" y="268" class="tiny">锁括号里的对象</text><line x1="344" x2="510" y1="234" y2="234" class="line"/><line x1="770" x2="936" y1="234" y2="234" class="line"/><text x="84" y="314" class="small">代码审查先看锁对象是否统一：读写是否走同一把锁，实例锁是否误用于静态共享状态。</text><rect width="585" height="330" x="40" y="380" class="panel"/><text x="68" y="416" class="panel-title">2. 字节码入口</text><rect width="210" height="90" x="78" y="466" class="blue"/><text x="128" y="498" class="label">同步代码块</text><text x="110" y="524" class="code">monitorenter</text><text x="110" y="546" class="code">monitorexit</text><rect width="210" height="90" x="356" y="466" class="green"/><text x="404" y="498" class="label">同步方法</text><text x="384" y="524" class="code">ACC_SYNCHRONIZED</text><text x="392" y="546" class="tiny">JVM 调用前后加锁/释放</text><line x1="288" x2="356" y1="511" y2="511" class="line"/><rect width="488" height="58" x="78" y="604" class="gray"/><text x="104" y="634" class="small">释放锁 happens-before 后续同一把锁的获取，因此读写都要走同一 monitor。</text><rect width="585" height="330" x="655" y="380" class="panel"/><text x="683" y="416" class="panel-title">3. HotSpot 快路径与膨胀</text><rect width="168" height="84" x="690" y="462" class="green"/><text x="724" y="494" class="label">Mark Word</text><text x="716" y="518" class="tiny">对象头记录锁状态</text><rect width="168" height="84" x="908" y="462" class="blue"/><text x="946" y="494" class="label">Lock Record</text><text x="932" y="518" class="tiny">线程栈轻量级路径</text><line x1="858" x2="908" y1="504" y2="504" class="line"/><rect width="292" height="70" x="738" y="594" class="red"/><text x="812" y="624" class="label">ObjectMonitor</text><text x="774" y="648" class="tiny">owner / recursions / EntryList / WaitSet</text><path d="M 992 546 C 978 574, 936 590, 884 594" class="line-red"/><text x="726" y="690" class="small">竞争持续、阻塞唤醒或 wait 时，锁进入 monitor 慢路径。</text><rect width="585" height="330" x="40" y="750" class="panel"/><text x="68" y="786" class="panel-title">4. wait/notify 与等待集合</text><rect width="160" height="72" x="78" y="832" class="blue"/><text x="122" y="860" class="label">Owner</text><text x="104" y="884" class="tiny">持有 monitor</text><rect width="160" height="72" x="306" y="832" class="yellow"/><text x="352" y="860" class="label">WaitSet</text><text x="334" y="884" class="tiny">wait 释放锁后进入</text><rect width="160" height="72" x="306" y="956" class="green"/><text x="350" y="984" class="label">EntryList</text><text x="326" y="1008" class="tiny">重新竞争 monitor</text><line x1="238" x2="306" y1="868" y2="868" class="line"/><path d="M 386 904 C 386 928, 386 936, 386 956" class="line"/><text x="88" y="1050" class="small">`wait` 前必须持锁；醒来后还要重新竞争，所以条件检查写 while。</text><rect width="585" height="330" x="655" y="750" class="panel"/><text x="683" y="786" class="panel-title">5. 版本边界与选型</text><rect width="210" height="78" x="690" y="832" class="gray"/><text x="738" y="862" class="label">偏向锁</text><text x="720" y="886" class="tiny">JDK 15 默认禁用并废弃相关选项</text><rect width="210" height="78" x="958" y="832" class="blue"/><text x="1008" y="862" class="label">虚拟线程</text><text x="984" y="886" class="tiny">JDK 24 改善 synchronized pinning</text><rect width="210" height="76" x="690" y="958" class="green"/><text x="728" y="988" class="label">synchronized</text><text x="722" y="1012" class="tiny">普通互斥，语法简洁</text><rect width="210" height="76" x="958" y="958" class="yellow"/><text x="1002" y="988" class="label">ReentrantLock</text><text x="976" y="1012" class="tiny">公平/中断/超时/多条件</text><line x1="900" x2="958" y1="996" y2="996" class="line"/><rect width="1200" height="92" x="40" y="1120" class="panel"/><text x="68" y="1154" class="panel-title">回答抓手</text><text x="190" y="1154" class="small">锁对象 -&gt; 字节码入口 -&gt; Mark Word 快路径 -&gt; ObjectMonitor 膨胀 -&gt; wait/notify -&gt; JDK 版本边界 -&gt; 选型。</text><text x="190" y="1186" class="small">不要只背“偏向、轻量、重量”，要能说清它保护的共享状态和 happens-before 语义。</text></svg>