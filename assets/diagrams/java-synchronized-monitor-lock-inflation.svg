<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">synchronized 从字节码到 ObjectMonitor</title>
  <desc id="desc">展示 synchronized 的锁对象、字节码入口、Mark Word 轻量级锁、ObjectMonitor 膨胀、EntryList、WaitSet、可见性和版本边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5f99"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b24634"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #14213d; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .label { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 14px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .code { font: 600 13px Menlo, Consolas, monospace; fill: #263238; }
      .blue { fill: #e8f4ff; stroke: #6aa9df; stroke-width: 2; rx: 12; }
      .green { fill: #e9f7ef; stroke: #58b77d; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff5d6; stroke: #e0ae35; stroke-width: 2; rx: 12; }
      .red { fill: #fdecea; stroke: #cf5d4b; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #a7b5c4; stroke-width: 2; rx: 12; }
      .line { stroke: #1f5f99; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line-red { stroke: #b24634; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #7b8794; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">synchronized：锁对象、monitor 与锁膨胀</text>
  <text x="50" y="86" class="subtitle">先确认锁对象，再从字节码进入 HotSpot 快路径和 ObjectMonitor 慢路径。</text>

  <rect x="40" y="120" width="1200" height="220" class="panel"/>
  <text x="68" y="156" class="panel-title">1. 三种写法锁不同对象</text>
  <rect x="84" y="196" width="260" height="76" class="blue"/>
  <text x="130" y="226" class="label">实例同步方法</text>
  <text x="126" y="250" class="code">synchronized void m()</text>
  <text x="126" y="268" class="tiny">锁 this，不同实例不互斥</text>
  <rect x="510" y="196" width="260" height="76" class="green"/>
  <text x="558" y="226" class="label">静态同步方法</text>
  <text x="556" y="250" class="code">static synchronized m()</text>
  <text x="568" y="268" class="tiny">锁 Class 对象</text>
  <rect x="936" y="196" width="260" height="76" class="yellow"/>
  <text x="994" y="226" class="label">同步代码块</text>
  <text x="1000" y="250" class="code">synchronized (lock)</text>
  <text x="1004" y="268" class="tiny">锁括号里的对象</text>
  <line x1="344" y1="234" x2="510" y2="234" class="line"/>
  <line x1="770" y1="234" x2="936" y2="234" class="line"/>
  <text x="84" y="314" class="small">代码审查先看锁对象是否统一：读写是否走同一把锁，实例锁是否误用于静态共享状态。</text>

  <rect x="40" y="380" width="585" height="330" class="panel"/>
  <text x="68" y="416" class="panel-title">2. 字节码入口</text>
  <rect x="78" y="466" width="210" height="90" class="blue"/>
  <text x="128" y="498" class="label">同步代码块</text>
  <text x="110" y="524" class="code">monitorenter</text>
  <text x="110" y="546" class="code">monitorexit</text>
  <rect x="356" y="466" width="210" height="90" class="green"/>
  <text x="404" y="498" class="label">同步方法</text>
  <text x="384" y="524" class="code">ACC_SYNCHRONIZED</text>
  <text x="392" y="546" class="tiny">JVM 调用前后加锁/释放</text>
  <line x1="288" y1="511" x2="356" y2="511" class="line"/>
  <rect x="78" y="604" width="488" height="58" class="gray"/>
  <text x="104" y="634" class="small">释放锁 happens-before 后续同一把锁的获取，因此读写都要走同一 monitor。</text>

  <rect x="655" y="380" width="585" height="330" class="panel"/>
  <text x="683" y="416" class="panel-title">3. HotSpot 快路径与膨胀</text>
  <rect x="690" y="462" width="168" height="84" class="green"/>
  <text x="724" y="494" class="label">Mark Word</text>
  <text x="716" y="518" class="tiny">对象头记录锁状态</text>
  <rect x="908" y="462" width="168" height="84" class="blue"/>
  <text x="946" y="494" class="label">Lock Record</text>
  <text x="932" y="518" class="tiny">线程栈轻量级路径</text>
  <line x1="858" y1="504" x2="908" y2="504" class="line"/>
  <rect x="738" y="594" width="292" height="70" class="red"/>
  <text x="812" y="624" class="label">ObjectMonitor</text>
  <text x="774" y="648" class="tiny">owner / recursions / EntryList / WaitSet</text>
  <path d="M 992 546 C 978 574, 936 590, 884 594" class="line-red"/>
  <text x="726" y="690" class="small">竞争持续、阻塞唤醒或 wait 时，锁进入 monitor 慢路径。</text>

  <rect x="40" y="750" width="585" height="330" class="panel"/>
  <text x="68" y="786" class="panel-title">4. wait/notify 与等待集合</text>
  <rect x="78" y="832" width="160" height="72" class="blue"/>
  <text x="122" y="860" class="label">Owner</text>
  <text x="104" y="884" class="tiny">持有 monitor</text>
  <rect x="306" y="832" width="160" height="72" class="yellow"/>
  <text x="352" y="860" class="label">WaitSet</text>
  <text x="334" y="884" class="tiny">wait 释放锁后进入</text>
  <rect x="306" y="956" width="160" height="72" class="green"/>
  <text x="350" y="984" class="label">EntryList</text>
  <text x="326" y="1008" class="tiny">重新竞争 monitor</text>
  <line x1="238" y1="868" x2="306" y2="868" class="line"/>
  <path d="M 386 904 C 386 928, 386 936, 386 956" class="line"/>
  <text x="88" y="1050" class="small">`wait` 前必须持锁；醒来后还要重新竞争，所以条件检查写 while。</text>

  <rect x="655" y="750" width="585" height="330" class="panel"/>
  <text x="683" y="786" class="panel-title">5. 版本边界与选型</text>
  <rect x="690" y="832" width="210" height="78" class="gray"/>
  <text x="738" y="862" class="label">偏向锁</text>
  <text x="720" y="886" class="tiny">JDK 15 默认禁用并废弃相关选项</text>
  <rect x="958" y="832" width="210" height="78" class="blue"/>
  <text x="1008" y="862" class="label">虚拟线程</text>
  <text x="984" y="886" class="tiny">JDK 24 改善 synchronized pinning</text>
  <rect x="690" y="958" width="210" height="76" class="green"/>
  <text x="728" y="988" class="label">synchronized</text>
  <text x="722" y="1012" class="tiny">普通互斥，语法简洁</text>
  <rect x="958" y="958" width="210" height="76" class="yellow"/>
  <text x="1002" y="988" class="label">ReentrantLock</text>
  <text x="976" y="1012" class="tiny">公平/中断/超时/多条件</text>
  <line x1="900" y1="996" x2="958" y2="996" class="line"/>

  <rect x="40" y="1120" width="1200" height="92" class="panel"/>
  <text x="68" y="1154" class="panel-title">回答抓手</text>
  <text x="190" y="1154" class="small">锁对象 -> 字节码入口 -> Mark Word 快路径 -> ObjectMonitor 膨胀 -> wait/notify -> JDK 版本边界 -> 选型。</text>
  <text x="190" y="1186" class="small">不要只背“偏向、轻量、重量”，要能说清它保护的共享状态和 happens-before 语义。</text>
</svg>
