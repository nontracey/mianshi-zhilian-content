<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">三种计数协作工具的状态路径</title>
  <desc id="desc">对比 CountDownLatch、CyclicBarrier 和 Semaphore 的等待关系、状态变化、复用能力和失败边界。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5f99"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b24634"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #14213d; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .label { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 14px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .code { font: 600 13px Menlo, Consolas, monospace; fill: #263238; }
      .blue { fill: #e8f4ff; stroke: #6aa9df; stroke-width: 2; rx: 12; }
      .green { fill: #e9f7ef; stroke: #58b77d; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff5d6; stroke: #e0ae35; stroke-width: 2; rx: 12; }
      .red { fill: #fdecea; stroke: #cf5d4b; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #a7b5c4; stroke-width: 2; rx: 12; }
      .line { stroke: #1f5f99; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #b24634; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #7b8794; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">CountDownLatch / CyclicBarrier / Semaphore</text>
  <text x="50" y="86" class="subtitle">同样是计数，真正要区分的是等待关系、复用代际和许可配平。</text>

  <rect x="40" y="120" width="1200" height="285" class="panel"/>
  <text x="68" y="156" class="panel-title">1. CountDownLatch：等待一批事件完成，一次打开</text>
  <rect x="84" y="208" width="160" height="70" class="blue"/>
  <text x="118" y="236" class="label">await 线程</text>
  <text x="112" y="260" class="tiny">等 state 归零</text>
  <rect x="314" y="208" width="160" height="70" class="yellow"/>
  <text x="350" y="236" class="label">state = 3</text>
  <text x="336" y="260" class="tiny">剩余任务数</text>
  <rect x="544" y="208" width="160" height="70" class="green"/>
  <text x="574" y="236" class="label">countDown</text>
  <text x="582" y="260" class="tiny">3 -> 2 -> 1</text>
  <rect x="774" y="208" width="160" height="70" class="green"/>
  <text x="820" y="236" class="label">state = 0</text>
  <text x="810" y="260" class="tiny">释放等待者</text>
  <rect x="1004" y="208" width="160" height="70" class="gray"/>
  <text x="1042" y="236" class="label">后续 await</text>
  <text x="1038" y="260" class="tiny">直接通过</text>
  <line x1="244" y1="243" x2="314" y2="243" class="line"/>
  <line x1="474" y1="243" x2="544" y2="243" class="line"/>
  <line x1="704" y1="243" x2="774" y2="243" class="line"/>
  <line x1="934" y1="243" x2="1004" y2="243" class="line"/>
  <text x="86" y="337" class="small">任务异常也要 countDown；否则等待者看不到完成信号。Latch 不重置，适合启动就绪和任务汇总。</text>

  <rect x="40" y="445" width="1200" height="315" class="panel"/>
  <text x="68" y="481" class="panel-title">2. CyclicBarrier：一组线程到齐后进入下一代</text>
  <rect x="80" y="532" width="160" height="72" class="blue"/>
  <text x="118" y="560" class="label">generation N</text>
  <text x="112" y="584" class="tiny">count = parties</text>
  <rect x="306" y="532" width="160" height="72" class="yellow"/>
  <text x="352" y="560" class="label">await</text>
  <text x="328" y="584" class="tiny">每到一个 count--</text>
  <rect x="532" y="532" width="170" height="72" class="green"/>
  <text x="566" y="560" class="label">最后到达者</text>
  <text x="556" y="584" class="tiny">执行 barrierAction</text>
  <rect x="768" y="532" width="160" height="72" class="green"/>
  <text x="802" y="560" class="label">唤醒本代</text>
  <text x="806" y="584" class="tiny">一起继续</text>
  <rect x="994" y="532" width="160" height="72" class="blue"/>
  <text x="1032" y="560" class="label">generation N+1</text>
  <text x="1032" y="584" class="tiny">count 重置</text>
  <line x1="240" y1="568" x2="306" y2="568" class="line"/>
  <line x1="466" y1="568" x2="532" y2="568" class="line"/>
  <line x1="702" y1="568" x2="768" y2="568" class="line"/>
  <line x1="928" y1="568" x2="994" y2="568" class="line"/>
  <rect x="306" y="650" width="398" height="58" class="red"/>
  <text x="338" y="681" class="small">中断 / 超时 / reset / action 失败会打破当前 generation</text>
  <line x1="386" y1="604" x2="386" y2="650" class="line-red"/>
  <text x="760" y="684" class="small">BrokenBarrierException 代表本轮协作失败，需要参与者统一处理。</text>

  <rect x="40" y="800" width="1200" height="285" class="panel"/>
  <text x="68" y="836" class="panel-title">3. Semaphore：许可证限制同时进入资源的线程数</text>
  <rect x="84" y="888" width="160" height="70" class="blue"/>
  <text x="118" y="916" class="label">permits = 2</text>
  <text x="114" y="940" class="tiny">剩余许可证</text>
  <rect x="314" y="888" width="160" height="70" class="green"/>
  <text x="354" y="916" class="label">acquire</text>
  <text x="348" y="940" class="tiny">拿到后进入</text>
  <rect x="544" y="888" width="160" height="70" class="yellow"/>
  <text x="584" y="916" class="label">无许可</text>
  <text x="580" y="940" class="tiny">排队等待</text>
  <rect x="774" y="888" width="160" height="70" class="green"/>
  <text x="818" y="916" class="label">release</text>
  <text x="806" y="940" class="tiny">归还并唤醒</text>
  <rect x="1004" y="888" width="160" height="70" class="red"/>
  <text x="1040" y="916" class="label">配平风险</text>
  <text x="1026" y="940" class="tiny">泄漏或超发</text>
  <line x1="244" y1="923" x2="314" y2="923" class="line"/>
  <line x1="474" y1="923" x2="544" y2="923" class="line-red"/>
  <line x1="704" y1="923" x2="774" y2="923" class="line"/>
  <line x1="934" y1="923" x2="1004" y2="923" class="line-red"/>
  <text x="86" y="1017" class="small">Semaphore 只维护许可计数，不管理真实连接或下游资源；多实例总量控制需要分布式配额。</text>

  <rect x="40" y="1125" width="1200" height="90" class="panel"/>
  <text x="68" y="1160" class="panel-title">一句话选择</text>
  <text x="202" y="1160" class="small">等任务完成用 Latch；多轮阶段对齐用 Barrier；限制并发访问资源用 Semaphore。</text>
  <text x="202" y="1192" class="small">排查时同时看等待栈、剩余计数或许可、屏障 generation 状态，以及异常路径是否释放了计数/许可。</text>
</svg>
