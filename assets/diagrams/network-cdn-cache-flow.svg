<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">CDN scheduling, cache hit, origin shielding and cache failure modes</title>
  <desc id="desc">CDN diagram showing DNS CNAME to GSLB, edge selection, L1 cache hit, miss coalescing, L2 shield, origin fetch, cache headers, preload and common cache breakdown, penetration and avalanche risks.</desc>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#64748b" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 18; filter: url(#shadow); }
      .dns { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; rx: 12; }
      .edge { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.6; rx: 12; }
      .shield { fill: #fdf4ff; stroke: #c026d3; stroke-width: 1.5; rx: 12; }
      .origin { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; rx: 12; }
      .risk { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.4; rx: 12; }
      .tool { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.2; rx: 12; }
      .query { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#blue); }
      .hit { fill: none; stroke: #059669; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#green); }
      .warn { fill: none; stroke: #dc2626; stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#red); }
      .title { fill: #0f172a; font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section { fill: #0f172a; font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #334155; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { fill: #475569; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .caption { fill: #475569; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .num { fill: #ffffff; font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .numCircle { fill: #2563eb; }
      .greenCircle { fill: #059669; }
      .redCircle { fill: #dc2626; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="56" y="52" class="title">CDN 调度、缓存命中与回源保护链路</text>
  <text x="56" y="84" class="caption">上半部分是正常路径；下半部分是命中率下降和回源洪峰的真实故障入口。</text>

  <rect x="48" y="120" width="1184" height="372" class="panel"/>
  <text x="76" y="158" class="section">正常请求路径：先调度到边缘，再按缓存层级逐级兜底</text>
  <rect x="76" y="192" width="180" height="82" class="dns"/>
  <text x="100" y="220" class="small">用户 / 浏览器</text>
  <text x="100" y="244" class="tiny">访问 img.example.com</text>
  <rect x="304" y="192" width="190" height="82" class="dns"/>
  <text x="328" y="220" class="small">CNAME 到 CDN</text>
  <text x="328" y="244" class="tiny">交给 CDN 权威 DNS</text>
  <rect x="542" y="192" width="210" height="82" class="dns"/>
  <text x="566" y="220" class="small">GSLB 选边缘</text>
  <text x="566" y="244" class="tiny">LDNS/ECS + 健康 + 负载</text>
  <rect x="800" y="192" width="190" height="82" class="edge"/>
  <text x="824" y="220" class="small">边缘 L1 缓存</text>
  <text x="824" y="244" class="tiny">HIT 直接返回</text>
  <rect x="1040" y="192" width="160" height="82" class="edge"/>
  <text x="1064" y="220" class="small">响应用户</text>
  <text x="1064" y="244" class="tiny">Age / cache status</text>

  <rect x="304" y="352" width="190" height="82" class="tool"/>
  <text x="328" y="380" class="small">请求合并</text>
  <text x="328" y="404" class="tiny">同 key MISS 只放一个回源</text>
  <rect x="542" y="352" width="210" height="82" class="shield"/>
  <text x="566" y="380" class="small">L2 / Shield 父层</text>
  <text x="566" y="404" class="tiny">收敛跨边缘 MISS</text>
  <rect x="800" y="352" width="190" height="82" class="origin"/>
  <text x="824" y="380" class="small">源站</text>
  <text x="824" y="404" class="tiny">返回内容与缓存头</text>
  <rect x="1040" y="352" width="160" height="82" class="origin"/>
  <text x="1064" y="380" class="small">缓存策略</text>
  <text x="1064" y="404" class="tiny">Cache-Control / ETag</text>

  <circle cx="280" cy="233" r="13" class="numCircle"/><text x="276" y="238" class="num">1</text>
  <circle cx="518" cy="233" r="13" class="numCircle"/><text x="514" y="238" class="num">2</text>
  <circle cx="776" cy="233" r="13" class="numCircle"/><text x="772" y="238" class="num">3</text>
  <circle cx="1016" cy="233" r="13" class="greenCircle"/><text x="1012" y="238" class="num">4</text>
  <circle cx="776" cy="393" r="13" class="numCircle"/><text x="772" y="398" class="num">5</text>

  <path class="query" d="M256 233 L304 233"/>
  <path class="query" d="M494 233 L542 233"/>
  <path class="query" d="M752 233 L800 233"/>
  <path class="hit" d="M990 233 L1040 233"/>
  <path class="query" d="M895 274 C860 316 505 310 399 352"/>
  <path class="query" d="M494 393 L542 393"/>
  <path class="query" d="M752 393 L800 393"/>
  <path class="query" d="M990 393 L1040 393"/>
  <path class="hit" d="M1120 352 C1020 308 690 300 895 274"/>
  <text x="822" y="310" class="tiny">MISS 才进入回源链</text>

  <rect x="48" y="548" width="1184" height="316" class="panel"/>
  <text x="76" y="588" class="section">命中率和源站压力的三个高频故障</text>
  <rect x="76" y="622" width="330" height="112" class="risk"/>
  <text x="104" y="652" class="small">缓存 key 碎片 / 穿透</text>
  <text x="104" y="680" class="tiny">随机 query、utm、Vary: Cookie</text>
  <text x="104" y="700" class="tiny">或大量不存在 path 让 L1/L2 全 MISS</text>
  <rect x="474" y="622" width="330" height="112" class="risk"/>
  <text x="502" y="652" class="small">热点 key 击穿</text>
  <text x="502" y="680" class="tiny">同一资源 TTL 到期，大量并发 MISS</text>
  <text x="502" y="700" class="tiny">没有请求合并就会打满源站</text>
  <rect x="872" y="622" width="330" height="112" class="risk"/>
  <text x="900" y="652" class="small">批量 TTL 雪崩</text>
  <text x="900" y="680" class="tiny">资源同一时刻过期或节点故障切换</text>
  <text x="900" y="700" class="tiny">回源带宽和连接数瞬时升高</text>

  <rect x="76" y="780" width="330" height="54" class="tool"/>
  <text x="104" y="810" class="small">白名单 cache key + 404/410 负缓存</text>
  <rect x="474" y="780" width="330" height="54" class="tool"/>
  <text x="502" y="810" class="small">proxy_cache_lock / request coalescing</text>
  <rect x="872" y="780" width="330" height="54" class="tool"/>
  <text x="900" y="810" class="small">TTL 抖动 + 预热 + stale-while-revalidate</text>

  <rect x="48" y="920" width="1184" height="138" class="panel"/>
  <text x="76" y="960" class="section">面试里要主动说出的验收指标</text>
  <text x="76" y="996" class="small">命中率：按资源类型分开看，可缓存静态资源通常应接近或超过 95%，弱动态内容不能用同一目标衡量。</text>
  <text x="76" y="1030" class="small">回源：看 MISS 数、回源带宽、源站 4xx/5xx；发布和刷新动作要观察是否制造回源尖峰。</text>
  <text x="76" y="1086" class="caption">HIT/MISS/STALE/UPDATING、Age、ETag、Cache-Control 和回源日志样本，是判断 CDN 是否真正生效的第一组证据。</text>
</svg>
