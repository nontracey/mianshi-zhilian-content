<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">Linux 进程状态、信号控制与排查路径</title>
  <desc id="desc">展示 Linux 进程从 fork/exec 到运行、睡眠、暂停、僵尸与 wait 回收的状态变化，并给出 CPU、D 状态、Z 状态、内存和文件描述符问题的排查证据链。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .h2 { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 700 14px "SFMono-Regular", Consolas, monospace; fill: #0f172a; }
      .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .green { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; }
      .red { fill: #fef2f2; stroke: #f87171; stroke-width: 2; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
      .violet { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .warnArrow { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#warnArrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="warnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="660" y="55" text-anchor="middle">进程管理不是“会 kill”：先读状态，再选证据和信号</text>
  <text class="subtitle" x="660" y="88" text-anchor="middle">R/S/D/Z/T 表示它在做什么；TERM、KILL、STOP、CONT 只是不同控制手段</text>

  <rect class="panel" x="58" y="120" width="1204" height="350" rx="10"/>
  <text class="h2" x="90" y="160">1. 进程状态：从创建、执行到退出回收</text>
  <rect class="blue" x="95" y="205" width="165" height="82" rx="8"/>
  <text class="label" x="177" y="235" text-anchor="middle">fork</text>
  <text class="tiny" x="177" y="262" text-anchor="middle">复制进程上下文</text>
  <path class="arrow" d="M263 246 H325"/>
  <rect class="blue" x="330" y="205" width="165" height="82" rx="8"/>
  <text class="label" x="412" y="235" text-anchor="middle">exec</text>
  <text class="tiny" x="412" y="262" text-anchor="middle">装载新程序映像</text>
  <path class="arrow" d="M498 246 H560"/>
  <rect class="green" x="565" y="205" width="165" height="82" rx="8"/>
  <text class="label" x="647" y="235" text-anchor="middle">R</text>
  <text class="tiny" x="647" y="262" text-anchor="middle">运行或可运行</text>
  <path class="arrow" d="M733 246 H795"/>
  <rect class="amber" x="800" y="205" width="165" height="82" rx="8"/>
  <text class="label" x="882" y="235" text-anchor="middle">S / D</text>
  <text class="tiny" x="882" y="262" text-anchor="middle">可中断/不可中断等待</text>
  <path class="warnArrow" d="M968 246 H1030"/>
  <rect class="red" x="1035" y="205" width="165" height="82" rx="8"/>
  <text class="label" x="1117" y="235" text-anchor="middle">Z</text>
  <text class="tiny" x="1117" y="262" text-anchor="middle">已退出，等父进程 wait</text>

  <rect class="violet" x="330" y="340" width="250" height="78" rx="8"/>
  <text class="label" x="455" y="369" text-anchor="middle">T stopped</text>
  <text class="tiny" x="455" y="396" text-anchor="middle">SIGSTOP 暂停，SIGCONT 恢复</text>
  <path class="arrow" d="M535 340 C560 318 590 304 622 292"/>
  <rect class="gray" x="710" y="340" width="300" height="78" rx="8"/>
  <text class="label" x="860" y="369" text-anchor="middle">父进程 wait/waitpid</text>
  <text class="tiny" x="860" y="396" text-anchor="middle">回收退出码，释放进程表项</text>
  <path class="arrow" d="M1013 378 C1070 365 1105 338 1117 292"/>

  <rect class="panel" x="58" y="510" width="1204" height="315" rx="10"/>
  <text class="h2" x="90" y="550">2. 信号控制：优雅终止优先，KILL 只是最后兜底</text>
  <rect class="green" x="95" y="605" width="250" height="82" rx="8"/>
  <text class="label" x="220" y="635" text-anchor="middle">SIGTERM 15</text>
  <text class="tiny" x="220" y="662" text-anchor="middle">可捕获，清理连接/落盘/注销</text>
  <path class="arrow" d="M348 646 H410"/>
  <rect class="blue" x="415" y="605" width="250" height="82" rx="8"/>
  <text class="label" x="540" y="635" text-anchor="middle">等待并验证</text>
  <text class="mono" x="540" y="662" text-anchor="middle">kill -0 / logs / metrics</text>
  <path class="warnArrow" d="M668 646 H730"/>
  <rect class="red" x="735" y="605" width="250" height="82" rx="8"/>
  <text class="label" x="860" y="635" text-anchor="middle">SIGKILL 9</text>
  <text class="tiny" x="860" y="662" text-anchor="middle">不可捕获，不会执行清理逻辑</text>
  <rect class="violet" x="1015" y="605" width="180" height="82" rx="8"/>
  <text class="label" x="1105" y="635" text-anchor="middle">STOP / CONT</text>
  <text class="tiny" x="1105" y="662" text-anchor="middle">暂停/恢复，不等于退出</text>

  <rect class="gray" x="95" y="725" width="1100" height="48" rx="8"/>
  <text class="text" x="645" y="755" text-anchor="middle">生产默认流程：TERM → 给超时窗口 → 确认进程仍存在和业务影响 → 必要时 KILL；不要直接 pkill 模糊匹配</text>

  <rect class="panel" x="58" y="865" width="1204" height="360" rx="10"/>
  <text class="h2" x="90" y="905">3. 排查路径：不同状态对应不同证据</text>
  <rect class="red" x="95" y="955" width="250" height="88" rx="8"/>
  <text class="label" x="220" y="985" text-anchor="middle">CPU 高 / R 多</text>
  <text class="tiny" x="220" y="1012" text-anchor="middle">top/ps 进程 → 线程 → perf/jstack</text>
  <rect class="amber" x="380" y="955" width="250" height="88" rx="8"/>
  <text class="label" x="505" y="985" text-anchor="middle">D 状态</text>
  <text class="tiny" x="505" y="1012" text-anchor="middle">IO/NFS/块设备，查 wchan、iostat</text>
  <rect class="violet" x="665" y="955" width="250" height="88" rx="8"/>
  <text class="label" x="790" y="985" text-anchor="middle">Z 僵尸</text>
  <text class="tiny" x="790" y="1012" text-anchor="middle">查 PPID，修父进程 wait 逻辑</text>
  <rect class="green" x="950" y="955" width="245" height="88" rx="8"/>
  <text class="label" x="1072" y="985" text-anchor="middle">S 长等待</text>
  <text class="tiny" x="1072" y="1012" text-anchor="middle">锁、网络、定时等待，结合 strace</text>

  <rect class="blue" x="95" y="1085" width="250" height="82" rx="8"/>
  <text class="label" x="220" y="1115" text-anchor="middle">内存高</text>
  <text class="tiny" x="220" y="1142" text-anchor="middle">RSS / smaps / heap / native</text>
  <rect class="blue" x="380" y="1085" width="250" height="82" rx="8"/>
  <text class="label" x="505" y="1115" text-anchor="middle">fd/连接多</text>
  <text class="tiny" x="505" y="1142" text-anchor="middle">lsof / fd 数 / ss / 连接池</text>
  <rect class="blue" x="665" y="1085" width="250" height="82" rx="8"/>
  <text class="label" x="790" y="1115" text-anchor="middle">系统压力</text>
  <text class="tiny" x="790" y="1142" text-anchor="middle">vmstat / iostat / load / context switch</text>
  <rect class="gray" x="950" y="1085" width="245" height="82" rx="8"/>
  <text class="label" x="1072" y="1115" text-anchor="middle">收口</text>
  <text class="tiny" x="1072" y="1142" text-anchor="middle">证据 → 根因 → 最小动作 → 验证</text>

  <rect class="gray" x="95" y="1248" width="1100" height="44" rx="8"/>
  <text class="text" x="645" y="1276" text-anchor="middle">面试表达：进程管理要能解释状态、父子回收、信号语义和资源证据，而不是背一串命令</text>
</svg>
