<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">Zero-copy data paths and boundaries</title>
  <desc id="desc">A topic-specific diagram comparing read/write, mmap/write, sendfile with scatter-gather DMA, splice, MSG_ZEROCOPY, kTLS, and user-space networking, with copy counts and constraints.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 33px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .chip { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-red { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .arrow-green { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="70" y="64">零拷贝：减少 CPU 载荷拷贝，而不是“没有任何移动”</text>
  <text class="subtitle" x="70" y="96">要数清楚 payload 的 CPU copy、DMA、系统调用入口和限制条件；协议头、描述符、校验和、页 pin 仍然存在。</text>

  <rect class="section" x="70" y="130" width="1180" height="305" rx="16"/>
  <text class="section-title" x="96" y="166">1. 传统 read + write：应用只转发，却把 payload 进出用户态各搬一次</text>

  <rect class="blue" x="105" y="205" width="130" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="235">Disk</text>
  <text class="mono" x="132" y="258">file blocks</text>

  <rect class="green" x="285" y="205" width="165" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="312" y="235">Page Cache</text>
  <text class="text" x="312" y="258">内核缓存文件页</text>

  <rect class="yellow" x="500" y="205" width="165" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="527" y="235">User Buffer</text>
  <text class="text" x="527" y="258">应用临时缓冲</text>

  <rect class="violet" x="715" y="205" width="170" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="742" y="235">Socket Buffer</text>
  <text class="text" x="742" y="258">内核网络队列</text>

  <rect class="cyan" x="935" y="205" width="130" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="962" y="235">NIC</text>
  <text class="mono" x="962" y="258">wire</text>

  <path class="arrow-green" d="M235 240 H276"/>
  <text class="chip" x="243" y="223">DMA</text>
  <path class="arrow-red" d="M450 240 H491"/>
  <text class="chip" x="455" y="223">CPU copy</text>
  <path class="arrow-red" d="M665 240 H706"/>
  <text class="chip" x="670" y="223">CPU copy</text>
  <path class="arrow-green" d="M885 240 H926"/>
  <text class="chip" x="892" y="223">DMA</text>

  <rect class="red" x="130" y="315" width="970" height="70" rx="14" stroke-width="2"/>
  <text class="box-title" x="158" y="345">成本账本</text>
  <text class="text" x="158" y="369">2 次 payload CPU copy + 2 次 DMA；read/write 两个系统调用带来 4 次用户态/内核态往返。若应用不修改数据，这两次 CPU copy 没有业务价值。</text>

  <rect class="section" x="70" y="475" width="1180" height="350" rx="16"/>
  <text class="section-title" x="96" y="511">2. sendfile + scatter-gather DMA：payload 不再经过用户缓冲区</text>

  <rect class="blue" x="105" y="560" width="135" height="76" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="592">Disk</text>
  <text class="mono" x="132" y="616">file</text>

  <rect class="green" x="300" y="560" width="180" height="76" rx="12" stroke-width="2"/>
  <text class="box-title" x="327" y="592">Page Cache</text>
  <text class="text" x="327" y="616">仍然承载文件页</text>

  <rect class="yellow" x="540" y="560" width="210" height="76" rx="12" stroke-width="2"/>
  <text class="box-title" x="567" y="592">Kernel metadata</text>
  <text class="text" x="567" y="616">offset/len/skb/frags</text>

  <rect class="violet" x="810" y="560" width="190" height="76" rx="12" stroke-width="2"/>
  <text class="box-title" x="837" y="592">Socket / TCP</text>
  <text class="text" x="837" y="616">协议头仍需处理</text>

  <rect class="cyan" x="1060" y="560" width="130" height="76" rx="12" stroke-width="2"/>
  <text class="box-title" x="1087" y="592">NIC SG-DMA</text>
  <text class="text" x="1087" y="616">按描述符取页</text>

  <path class="arrow-green" d="M240 598 H291"/>
  <text class="chip" x="249" y="581">DMA</text>
  <path class="arrow-blue" d="M480 598 H531"/>
  <text class="chip" x="491" y="581">page refs</text>
  <path class="arrow-blue" d="M750 598 H801"/>
  <text class="chip" x="760" y="581">descriptors</text>
  <path class="arrow-green" d="M1000 598 H1051"/>
  <text class="chip" x="1005" y="581">DMA from pages</text>

  <rect class="green" x="105" y="690" width="320" height="84" rx="14" stroke-width="2"/>
  <text class="box-title" x="132" y="722">“零拷贝”的精确定义</text>
  <text class="text" x="132" y="748">热路径上没有 payload 的 CPU 数据拷贝；</text>
  <text class="text" x="132" y="768">不是没有 DMA、系统调用、描述符或协议处理。</text>

  <rect class="yellow" x="475" y="690" width="315" height="84" rx="14" stroke-width="2"/>
  <text class="box-title" x="502" y="722">没有 SG-DMA 时</text>
  <text class="text" x="502" y="748">sendfile 仍可减少态切换和用户态拷贝，</text>
  <text class="text" x="502" y="768">但内核到 socket 可能仍有 CPU copy。</text>

  <rect class="red" x="840" y="690" width="350" height="84" rx="14" stroke-width="2"/>
  <text class="box-title" x="867" y="722">TLS / 压缩 / 改协议头</text>
  <text class="text" x="867" y="748">用户态要加工 payload 时通常破坏 sendfile 路径；</text>
  <text class="text" x="867" y="768">kTLS、NIC offload 或预格式化可部分恢复。</text>

  <rect class="section" x="70" y="865" width="1180" height="250" rx="16"/>
  <text class="section-title" x="96" y="901">3. 常见方案：优化点不同，别混成一个词</text>

  <rect class="blue" x="105" y="935" width="210" height="100" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="967">mmap + write</text>
  <text class="text" x="132" y="992">省 Page Cache 到用户缓冲 copy</text>
  <text class="text" x="132" y="1012">仍要写入 socket buffer</text>

  <rect class="green" x="355" y="935" width="210" height="100" rx="12" stroke-width="2"/>
  <text class="box-title" x="382" y="967">sendfile / transferTo</text>
  <text class="text" x="382" y="992">文件页到 socket 的内核路径</text>
  <text class="text" x="382" y="1012">Kafka、静态文件、Netty FileRegion</text>

  <rect class="yellow" x="605" y="935" width="210" height="100" rx="12" stroke-width="2"/>
  <text class="box-title" x="632" y="967">splice</text>
  <text class="text" x="632" y="992">fd 与 pipe 间搬运页引用</text>
  <text class="text" x="632" y="1012">管道参与，接口限制更多</text>

  <rect class="violet" x="855" y="935" width="210" height="100" rx="12" stroke-width="2"/>
  <text class="box-title" x="882" y="967">MSG_ZEROCOPY</text>
  <text class="text" x="882" y="992">发送用户页，等待异步完成</text>
  <text class="text" x="882" y="1012">大包更划算，小包管理成本高</text>

  <rect class="cyan" x="1090" y="935" width="125" height="100" rx="12" stroke-width="2"/>
  <text class="box-title" x="1112" y="967">DPDK</text>
  <text class="text" x="1112" y="992">用户态网络栈</text>
  <text class="text" x="1112" y="1012">换来运维复杂度</text>

  <rect class="section" x="70" y="1155" width="1180" height="95" rx="16"/>
  <text class="section-title" x="96" y="1190">4. 验证指标</text>
  <text class="mono" x="105" y="1224">strace -c: read/write vs sendfile calls    perf: cycles, cache-misses, copy_user hot path</text>
  <text class="mono" x="105" y="1248">业务指标: CPU per Gbps, throughput, P99, TLS/compression path, fallback count, error queue completions</text>
  <text class="small" x="105" y="1282">面试抓手：先数 payload copy，再说哪些 API 省了哪一步；最后讲前提、fallback 和如何证明 CPU/Gbps 真的下降。</text>
</svg>
