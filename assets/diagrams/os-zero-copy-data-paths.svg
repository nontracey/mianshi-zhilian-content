<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">Zero-copy data paths and boundaries</title><desc id="desc">A topic-specific diagram comparing read/write, mmap/write, sendfile with scatter-gather DMA, splice, MSG_ZEROCOPY, kTLS, and user-space networking, with copy counts and constraints.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 33px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.section{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.chip{fill:#0f172a}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.chip{font:700 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.arrow-blue{stroke:#2563eb;marker-end:url(#arrow-blue)}.arrow-blue,.arrow-green,.arrow-red{stroke-width:3;fill:none}.arrow-red{stroke:#dc2626;marker-end:url(#arrow-red)}.arrow-green{stroke:#16a34a;marker-end:url(#arrow-green)}</style></defs><rect width="1320" height="1320" class="bg"/><text x="70" y="64" class="title">零拷贝：减少 CPU 载荷拷贝，而不是“没有任何移动”</text><text x="70" y="96" class="subtitle">要数清楚 payload 的 CPU copy、DMA、系统调用入口和限制条件；协议头、描述符、校验和、页 pin 仍然存在。</text><rect width="1180" height="305" x="70" y="130" class="section" rx="16"/><text x="96" y="166" class="section-title">1. 传统 read + write：应用只转发，却把 payload 进出用户态各搬一次</text><rect width="130" height="70" x="105" y="205" stroke-width="2" class="blue" rx="12"/><text x="132" y="235" class="box-title">Disk</text><text x="132" y="258" class="mono">file blocks</text><rect width="165" height="70" x="285" y="205" stroke-width="2" class="green" rx="12"/><text x="312" y="235" class="box-title">Page Cache</text><text x="312" y="258" class="text">内核缓存文件页</text><rect width="165" height="70" x="500" y="205" stroke-width="2" class="yellow" rx="12"/><text x="527" y="235" class="box-title">User Buffer</text><text x="527" y="258" class="text">应用临时缓冲</text><rect width="170" height="70" x="715" y="205" stroke-width="2" class="violet" rx="12"/><text x="742" y="235" class="box-title">Socket Buffer</text><text x="742" y="258" class="text">内核网络队列</text><rect width="130" height="70" x="935" y="205" stroke-width="2" class="cyan" rx="12"/><text x="962" y="235" class="box-title">NIC</text><text x="962" y="258" class="mono">wire</text><path d="M235 240 H276" class="arrow-green"/><text x="243" y="223" class="chip">DMA</text><path d="M450 240 H491" class="arrow-red"/><text x="455" y="223" class="chip">CPU copy</text><path d="M665 240 H706" class="arrow-red"/><text x="670" y="223" class="chip">CPU copy</text><path d="M885 240 H926" class="arrow-green"/><text x="892" y="223" class="chip">DMA</text><rect width="970" height="70" x="130" y="315" stroke-width="2" class="red" rx="14"/><text x="158" y="345" class="box-title">成本账本</text><text x="158" y="369" class="text">2 次 payload CPU copy + 2 次 DMA；read/write 两个系统调用带来 4 次用户态/内核态往返。若应用不修改数据，这两次 CPU copy 没有业务价值。</text><rect width="1180" height="350" x="70" y="475" class="section" rx="16"/><text x="96" y="511" class="section-title">2. sendfile + scatter-gather DMA：payload 不再经过用户缓冲区</text><rect width="135" height="76" x="105" y="560" stroke-width="2" class="blue" rx="12"/><text x="132" y="592" class="box-title">Disk</text><text x="132" y="616" class="mono">file</text><rect width="180" height="76" x="300" y="560" stroke-width="2" class="green" rx="12"/><text x="327" y="592" class="box-title">Page Cache</text><text x="327" y="616" class="text">仍然承载文件页</text><rect width="210" height="76" x="540" y="560" stroke-width="2" class="yellow" rx="12"/><text x="567" y="592" class="box-title">Kernel metadata</text><text x="567" y="616" class="text">offset/len/skb/frags</text><rect width="190" height="76" x="810" y="560" stroke-width="2" class="violet" rx="12"/><text x="837" y="592" class="box-title">Socket / TCP</text><text x="837" y="616" class="text">协议头仍需处理</text><rect width="130" height="76" x="1060" y="560" stroke-width="2" class="cyan" rx="12"/><text x="1087" y="592" class="box-title">NIC SG-DMA</text><text x="1087" y="616" class="text">按描述符取页</text><path d="M240 598 H291" class="arrow-green"/><text x="249" y="581" class="chip">DMA</text><path d="M480 598 H531" class="arrow-blue"/><text x="491" y="581" class="chip">page refs</text><path d="M750 598 H801" class="arrow-blue"/><text x="760" y="581" class="chip">descriptors</text><path d="M1000 598 H1051" class="arrow-green"/><text x="1005" y="581" class="chip">DMA from pages</text><rect width="320" height="84" x="105" y="690" stroke-width="2" class="green" rx="14"/><text x="132" y="722" class="box-title">“零拷贝”的精确定义</text><text x="132" y="748" class="text">热路径上没有 payload 的 CPU 数据拷贝；</text><text x="132" y="768" class="text">不是没有 DMA、系统调用、描述符或协议处理。</text><rect width="315" height="84" x="475" y="690" stroke-width="2" class="yellow" rx="14"/><text x="502" y="722" class="box-title">没有 SG-DMA 时</text><text x="502" y="748" class="text">sendfile 仍可减少态切换和用户态拷贝，</text><text x="502" y="768" class="text">但内核到 socket 可能仍有 CPU copy。</text><rect width="350" height="84" x="840" y="690" stroke-width="2" class="red" rx="14"/><text x="867" y="722" class="box-title">TLS / 压缩 / 改协议头</text><text x="867" y="748" class="text">用户态要加工 payload 时通常破坏 sendfile 路径；</text><text x="867" y="768" class="text">kTLS、NIC offload 或预格式化可部分恢复。</text><rect width="1180" height="250" x="70" y="865" class="section" rx="16"/><text x="96" y="901" class="section-title">3. 常见方案：优化点不同，别混成一个词</text><rect width="210" height="100" x="105" y="935" stroke-width="2" class="blue" rx="12"/><text x="132" y="967" class="box-title">mmap + write</text><text x="132" y="992" class="text">省 Page Cache 到用户缓冲 copy</text><text x="132" y="1012" class="text">仍要写入 socket buffer</text><rect width="210" height="100" x="355" y="935" stroke-width="2" class="green" rx="12"/><text x="382" y="967" class="box-title">sendfile / transferTo</text><text x="382" y="992" class="text">文件页到 socket 的内核路径</text><text x="382" y="1012" class="text">Kafka、静态文件、Netty FileRegion</text><rect width="210" height="100" x="605" y="935" stroke-width="2" class="yellow" rx="12"/><text x="632" y="967" class="box-title">splice</text><text x="632" y="992" class="text">fd 与 pipe 间搬运页引用</text><text x="632" y="1012" class="text">管道参与，接口限制更多</text><rect width="210" height="100" x="855" y="935" stroke-width="2" class="violet" rx="12"/><text x="882" y="967" class="box-title">MSG_ZEROCOPY</text><text x="882" y="992" class="text">发送用户页，等待异步完成</text><text x="882" y="1012" class="text">大包更划算，小包管理成本高</text><rect width="125" height="100" x="1090" y="935" stroke-width="2" class="cyan" rx="12"/><text x="1112" y="967" class="box-title">DPDK</text><text x="1112" y="992" class="text">用户态网络栈</text><text x="1112" y="1012" class="text">换来运维复杂度</text><rect width="1180" height="95" x="70" y="1155" class="section" rx="16"/><text x="96" y="1190" class="section-title">4. 验证指标</text><text x="105" y="1224" class="mono">strace -c: read/write vs sendfile calls perf: cycles, cache-misses, copy_user hot path</text><text x="105" y="1248" class="mono">业务指标: CPU per Gbps, throughput, P99, TLS/compression path, fallback count, error queue completions</text><text x="105" y="1282" class="small">面试抓手：先数 payload copy，再说哪些 API 省了哪一步；最后讲前提、fallback 和如何证明 CPU/Gbps 真的下降。</text></svg>