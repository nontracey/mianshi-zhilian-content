<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">Spring 事务代理、传播行为、回滚规则和失效边界</title>
  <desc id="desc">展示 @Transactional 从外部调用进入代理、TransactionInterceptor 读取属性、REQUIRED/REQUIRES_NEW/NESTED 的物理事务差异、回滚规则和常见失效边界。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .box-title { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 13px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .blue { fill: #e8f2ff; stroke: #60a5fa; stroke-width: 2; rx: 12; }
      .green { fill: #e8f8ef; stroke: #4ade80; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff7d6; stroke: #facc15; stroke-width: 2; rx: 12; }
      .orange { fill: #fff1e6; stroke: #fb923c; stroke-width: 2; rx: 12; }
      .red { fill: #feecec; stroke: #f87171; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #b45309; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">@Transactional：先进入代理，再按传播和回滚规则收口</text>
  <text x="50" y="86" class="subtitle">面试要把代理入口、物理事务、连接占用、保存点、异常规则和失效边界放在一条链里。</text>

  <rect x="40" y="120" width="1200" height="230" class="panel"/>
  <text x="68" y="156" class="panel-title">1. 生效入口：外部调用必须进入代理</text>
  <rect x="78" y="215" width="150" height="62" class="blue"/>
  <text x="118" y="240" class="box-title">Caller</text>
  <text x="98" y="261" class="tiny">另一个 Bean / 控制器</text>
  <rect x="286" y="215" width="155" height="62" class="red"/>
  <text x="328" y="240" class="box-title">Proxy</text>
  <text x="310" y="261" class="tiny">JDK 或 CGLIB</text>
  <rect x="500" y="215" width="225" height="62" class="yellow"/>
  <text x="535" y="240" class="box-title">TransactionInterceptor</text>
  <text x="528" y="261" class="tiny">读取 propagation / rollback</text>
  <rect x="784" y="215" width="175" height="62" class="green"/>
  <text x="828" y="240" class="box-title">TxManager</text>
  <text x="812" y="261" class="tiny">绑定连接和事务状态</text>
  <rect x="1018" y="215" width="150" height="62" class="orange"/>
  <text x="1056" y="240" class="box-title">Target</text>
  <text x="1042" y="261" class="tiny">真实业务方法</text>
  <line x1="228" y1="246" x2="286" y2="246" class="line"/>
  <line x1="441" y1="246" x2="500" y2="246" class="line"/>
  <line x1="725" y1="246" x2="784" y2="246" class="line"/>
  <line x1="959" y1="246" x2="1018" y2="246" class="line"/>
  <text x="78" y="315" class="small">自调用、非容器对象、切点不匹配或方法不可代理时，调用不会进入这条链；注解只会变成元数据。</text>

  <rect x="40" y="390" width="1200" height="405" class="panel"/>
  <text x="68" y="426" class="panel-title">2. 三个常考传播行为：看物理事务和资源占用</text>
  <rect x="82" y="485" width="310" height="245" class="green"/>
  <text x="116" y="516" class="box-title">REQUIRED</text>
  <text x="108" y="550" class="small">无事务：新建物理事务 T1</text>
  <text x="108" y="582" class="small">有事务：加入 T1，形成多个逻辑 scope</text>
  <text x="108" y="614" class="small">内层标记 rollback-only 后，外层提交会抛</text>
  <text x="108" y="642" class="small">UnexpectedRollbackException</text>
  <rect x="130" y="675" width="210" height="36" class="gray"/>
  <text x="168" y="699" class="tiny">一个连接 / 一个物理事务</text>

  <rect x="486" y="485" width="310" height="245" class="orange"/>
  <text x="520" y="516" class="box-title">REQUIRES_NEW</text>
  <text x="512" y="550" class="small">挂起外层 T1</text>
  <text x="512" y="582" class="small">内层新开物理事务 T2</text>
  <text x="512" y="614" class="small">内外可独立提交或回滚</text>
  <text x="512" y="646" class="small">T1 连接仍被占用，T2 还要再拿连接</text>
  <rect x="534" y="675" width="210" height="36" class="red"/>
  <text x="560" y="699" class="tiny">连接池需比并发线程多至少 1</text>

  <rect x="890" y="485" width="310" height="245" class="yellow"/>
  <text x="924" y="516" class="box-title">NESTED</text>
  <text x="916" y="550" class="small">仍在同一个物理事务 T1</text>
  <text x="916" y="582" class="small">进入内层时创建 JDBC savepoint</text>
  <text x="916" y="614" class="small">内层失败可回滚到保存点</text>
  <text x="916" y="646" class="small">外层提交仍决定最终结果</text>
  <rect x="938" y="675" width="210" height="36" class="gray"/>
  <text x="984" y="699" class="tiny">依赖 JDBC 保存点能力</text>

  <rect x="40" y="835" width="585" height="295" class="panel"/>
  <text x="68" y="871" class="panel-title">3. 回滚规则：异常要冒出事务边界</text>
  <rect x="82" y="930" width="220" height="62" class="red"/>
  <text x="112" y="955" class="box-title">RuntimeException / Error</text>
  <text x="110" y="976" class="tiny">默认触发回滚</text>
  <rect x="360" y="930" width="220" height="62" class="yellow"/>
  <text x="398" y="955" class="box-title">checked exception</text>
  <text x="386" y="976" class="tiny">默认提交，需 rollbackFor</text>
  <rect x="82" y="1025" width="220" height="62" class="green"/>
  <text x="128" y="1050" class="box-title">Spring 6.1</text>
  <text x="106" y="1071" class="tiny">返回异常完成的 Future 可触发回滚</text>
  <rect x="360" y="1025" width="220" height="62" class="orange"/>
  <text x="398" y="1050" class="box-title">catch 后吞掉</text>
  <text x="386" y="1071" class="tiny">拦截器看不到异常，按提交处理</text>

  <rect x="655" y="835" width="585" height="295" class="panel"/>
  <text x="683" y="871" class="panel-title">4. 工程排查顺序</text>
  <text x="692" y="936" class="small">先确认对象是否是 Spring proxy，调用是否来自外部 Bean。</text>
  <text x="692" y="974" class="small">再看传播行为：REQUIRED 共用物理事务，REQUIRES_NEW 新拿连接，NESTED 用保存点。</text>
  <text x="692" y="1012" class="small">接着看异常是否越过边界、rollbackFor/noRollbackFor 是否匹配。</text>
  <text x="692" y="1050" class="small">最后看慢 RPC、MQ、大循环是否被放进长事务，导致锁等待或连接耗尽。</text>
  <text x="692" y="1088" class="small">需要可靠发消息时，优先 afterCommit 或本地消息表。</text>

  <rect x="40" y="1170" width="1200" height="64" class="panel"/>
  <text x="68" y="1207" class="panel-title">回答抓手</text>
  <text x="190" y="1207" class="small">代理入口 -> TransactionInterceptor -> REQUIRED/REQUIRES_NEW/NESTED -> 回滚规则 -> UnexpectedRollbackException -> 连接池/savepoint -> 自调用/吞异常/线程边界。</text>
</svg>
