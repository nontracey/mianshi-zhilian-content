<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1280"><title id="title">JMM 与 happens-before 推导三类并发问题</title><desc id="desc">展示共享状态、三类并发失败、happens-before 规则和修复手段之间的对应关系。</desc><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#1f5f99" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path fill="#b24634" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f7fafc}.title{font:700 30px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#14213d}.subtitle{font:400 15px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.panel{fill:#fff;stroke:#d9e2ec;stroke-width:2;rx:16}.label{fill:#1f2933}.panel-title{font:700 20px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#1f2933}.label{font:700 16px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.small{font:400 14px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#334e68}.tiny{font:400 12px Arial,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#52606d}.code{font:600 13px Menlo,Consolas,monospace;fill:#263238}.blue{fill:#e8f4ff;stroke:#6aa9df}.blue,.gray{stroke-width:2;rx:12}.green{fill:#e9f7ef;stroke:#58b77d}.green,.red,.yellow{stroke-width:2;rx:12}.yellow{fill:#fff5d6;stroke:#e0ae35}.red{fill:#fdecea;stroke:#cf5d4b}.gray{fill:#f1f5f9;stroke:#a7b5c4}.line{stroke:#1f5f99;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#7b8794;stroke-width:2;fill:none;stroke-dasharray:7 6}</style></defs><rect width="1280" height="1280" class="bg"/><text x="48" y="56" class="title">并发理论基础：用 JMM 推导三类问题</text><text x="50" y="86" class="subtitle">共享可变状态遇到线程交错、缓存可见性和重排序，才需要 happens-before、锁、volatile 和 Atomic。</text><rect width="1200" height="250" x="40" y="120" class="panel"/><text x="68" y="156" class="panel-title">1. 共享状态是问题入口</text><rect width="168" height="86" x="80" y="202" class="blue"/><text x="126" y="234" class="label">Thread A</text><text x="108" y="258" class="tiny">本地寄存器 / 缓存 / 优化路径</text><rect width="168" height="86" x="1032" y="202" class="blue"/><text x="1078" y="234" class="label">Thread B</text><text x="1060" y="258" class="tiny">本地寄存器 / 缓存 / 优化路径</text><rect width="296" height="122" x="492" y="184" class="green"/><text x="574" y="220" class="label">共享可变状态</text><text x="544" y="248" class="small">counter / flag / object reference</text><text x="534" y="272" class="small">线程安全取决于读写之间的同步关系</text><line x1="248" x2="492" y1="245" y2="245" class="line"/><line x1="1032" x2="788" y1="245" y2="245" class="line"/><text x="80" y="340" class="small">JMM 的主内存/工作内存是规范抽象：它规定哪些读写结果合法，不是直接画硬件缓存拓扑。</text><rect width="1200" height="320" x="40" y="410" class="panel"/><text x="68" y="446" class="panel-title">2. 三类失败：先判断 bug 属于哪一类</text><rect width="324" height="146" x="80" y="492" class="red"/><text x="174" y="526" class="label">原子性失败</text><text x="112" y="556" class="code">count++: read -&gt; add -&gt; write</text><text x="112" y="582" class="small">两个线程交错，后写覆盖先写</text><text x="112" y="610" class="small">修复：锁、Atomic、LongAdder</text><rect width="324" height="146" x="478" y="492" class="yellow"/><text x="572" y="526" class="label">可见性失败</text><text x="510" y="556" class="code">while (!flag) { ... }</text><text x="510" y="582" class="small">写线程改了，读线程没有同步边</text><text x="510" y="610" class="small">修复：volatile、锁、正确发布</text><rect width="324" height="146" x="876" y="492" class="blue"/><text x="970" y="526" class="label">有序性失败</text><text x="908" y="556" class="code">ref = new Object()</text><text x="908" y="582" class="small">引用发布早于字段初始化可见</text><text x="908" y="610" class="small">修复：volatile、锁、final 安全发布</text><line x1="404" x2="478" y1="565" y2="565" class="line"/><line x1="802" x2="876" y1="565" y2="565" class="line"/><text x="80" y="694" class="small">as-if-serial 只保护单线程观察结果；跨线程必须看 happens-before 是否存在。</text><rect width="585" height="330" x="40" y="770" class="panel"/><text x="68" y="806" class="panel-title">3. happens-before 不是时间先后</text><rect width="200" height="74" x="78" y="850" class="green"/><text x="124" y="878" class="label">A 写入共享变量</text><text x="110" y="902" class="tiny">例如 x = 42</text><rect width="200" height="74" x="348" y="850" class="blue"/><text x="396" y="878" class="label">B 读取共享变量</text><text x="378" y="902" class="tiny">例如 print(x)</text><line x1="278" x2="348" y1="887" y2="887" class="line"/><text x="294" y="868" class="tiny">有 hb 边</text><rect width="470" height="76" x="78" y="970" class="gray"/><text x="104" y="1000" class="small">有 hb：A 对 B 可见，且顺序受 JMM 约束</text><text x="104" y="1026" class="small">只有时间先后：不保证 B 读到 A 的写入</text><path d="M 448 850 C 446 822, 338 822, 178 850" class="dash"/><text x="218" y="832" class="tiny">时间更早不等于可见</text><rect width="585" height="330" x="655" y="770" class="panel"/><text x="683" y="806" class="panel-title">4. 常见 hb 规则与工程映射</text><rect width="138" height="64" x="688" y="848" class="blue"/><text x="722" y="874" class="label">程序顺序</text><text x="714" y="894" class="tiny">同一线程内</text><rect width="138" height="64" x="850" y="848" class="green"/><text x="884" y="874" class="label">锁规则</text><text x="872" y="894" class="tiny">unlock -&gt; lock</text><rect width="138" height="64" x="1012" y="848" class="yellow"/><text x="1038" y="874" class="label">volatile</text><text x="1036" y="894" class="tiny">write -&gt; read</text><rect width="138" height="64" x="688" y="954" class="gray"/><text x="728" y="980" class="label">start</text><text x="710" y="1000" class="tiny">启动前写入可见</text><rect width="138" height="64" x="850" y="954" class="gray"/><text x="898" y="980" class="label">join</text><text x="874" y="1000" class="tiny">线程结束后可见</text><rect width="138" height="64" x="1012" y="954" class="red"/><text x="1052" y="980" class="label">传递性</text><text x="1036" y="1000" class="tiny">A hb B, B hb C</text><text x="692" y="1060" class="small">用规则推导：x=42 -&gt; volatile 写 flag -&gt; volatile 读 flag -&gt; 读 x。</text><rect width="1200" height="92" x="40" y="1134" class="panel"/><text x="68" y="1168" class="panel-title">回答抓手</text><text x="190" y="1168" class="small">先问是否共享，再判断违反原子性、可见性还是有序性；最后选线程封闭、不可变、锁、volatile、Atomic 或 LongAdder。</text><text x="190" y="1200" class="small">能把“工具解决什么问题”和“工具不解决什么问题”说清，才算真正理解并发基础。</text></svg>