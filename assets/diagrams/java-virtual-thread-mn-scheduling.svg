<svg xmlns="http://www.w3.org/2000/svg" width="100%" aria-label="虚拟线程 M:N 调度与 pinning" role="img" viewBox="0 0 780 430"><title>虚拟线程 M:N 调度与 Pinning</title><desc>大量虚拟线程挂载到少量 carrier 平台线程；阻塞时 unmount 释放 carrier，synchronized/native 调用导致 pinning 占住 carrier。</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="390" y="26" fill="#042C53" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">虚拟线程 M:N 调度：M 个 VThread 复用 N 个 carrier</text><rect width="150" height="300" x="24" y="56" fill="#E6F1FB" stroke="#378ADD" stroke-width=".6" rx="10"/><text x="99" y="78" fill="#042C53" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">M 个虚拟线程（廉价）</text><g fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="11"><rect width="118" height="22" x="40" y="90" fill="#fff" stroke="#378ADD" stroke-width=".5" rx="5"/><text x="99" y="105" text-anchor="middle">VT-1 (栈在堆上)</text><rect width="118" height="22" x="40" y="118" fill="#fff" stroke="#378ADD" stroke-width=".5" rx="5"/><text x="99" y="133" text-anchor="middle">VT-2</text><rect width="118" height="22" x="40" y="146" fill="#fff" stroke="#378ADD" stroke-width=".5" rx="5"/><text x="99" y="161" text-anchor="middle">VT-3</text><text x="99" y="186" fill="#5F5E5A" text-anchor="middle">… 可达百万级</text><rect width="118" height="22" x="40" y="198" fill="#fff" stroke="#378ADD" stroke-width=".5" rx="5"/><text x="99" y="213" text-anchor="middle">VT-n</text></g><text x="99" y="246" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">阻塞即 unmount，</text><text x="99" y="262" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">续体(continuation)留堆</text><rect width="150" height="90" x="300" y="120" fill="#FEF3E2" stroke="#BA7517" stroke-width=".6" rx="10"/><text x="375" y="150" fill="#7A4D0E" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">JDK 调度器</text><text x="375" y="172" fill="#7A4D0E" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">ForkJoinPool</text><text x="375" y="190" fill="#7A4D0E" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">mount / unmount</text><rect width="186" height="300" x="566" y="56" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".6" rx="10"/><text x="659" y="78" fill="#04342C" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">N 个 carrier (≈CPU 核数)</text><rect width="154" height="40" x="582" y="92" fill="#fff" stroke="#1D9E75" stroke-width=".5" rx="6"/><text x="659" y="116" fill="#04342C" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Carrier-1 ↔ OS 线程</text><rect width="154" height="40" x="582" y="138" fill="#fff" stroke="#1D9E75" stroke-width=".5" rx="6"/><text x="659" y="162" fill="#04342C" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Carrier-2 ↔ OS 线程</text><rect width="154" height="40" x="582" y="184" fill="#fff" stroke="#1D9E75" stroke-width=".5" rx="6"/><text x="659" y="208" fill="#04342C" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Carrier-N ↔ OS 线程</text><line x1="174" x2="298" y1="140" y2="155" stroke="#378ADD" stroke-width="1.4" marker-end="url(#a)"/><line x1="452" x2="564" y1="150" y2="150" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#a)"/><rect width="424" height="110" x="24" y="300" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="10"/><text x="40" y="322" fill="#04342C" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ 正常阻塞（socket/sleep/JDK 改造过的 IO）</text><text x="40" y="342" fill="#444441" font-family="system-ui, sans-serif" font-size="11">VT 阻塞 → 从 carrier unmount → carrier 立刻去跑别的 VT</text><text x="40" y="360" fill="#444441" font-family="system-ui, sans-serif" font-size="11">→ 少量 carrier 撑起海量并发，吞吐随连接数扩展</text><text x="40" y="386" fill="#1D9E75" font-family="system-ui, sans-serif" font-size="11" font-weight="600">关键：阻塞的是 VT，不是宝贵的平台线程</text><rect width="186" height="116" x="566" y="240" fill="#FBE9E7" stroke="#C0392B" stroke-width=".6" rx="10"/><text x="659" y="262" fill="#922B21" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✗ Pinning（钉住）</text><text x="659" y="282" fill="#922B21" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">synchronized 临界区 /</text><text x="659" y="298" fill="#922B21" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">native(JNI)/老 IO 内</text><text x="659" y="318" fill="#922B21" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">阻塞 → 不能 unmount</text><text x="659" y="338" fill="#922B21" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">carrier 被占住 → 池耗尽</text><text x="390" y="424" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">排查：-Djdk.tracePinnedThreads / JFR VirtualThreadPinned；synchronized 换 ReentrantLock</text></svg>