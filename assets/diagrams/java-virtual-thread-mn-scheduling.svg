<svg viewBox="0 0 780 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="虚拟线程 M:N 调度与 pinning">
<title>虚拟线程 M:N 调度与 Pinning</title><desc>大量虚拟线程挂载到少量 carrier 平台线程；阻塞时 unmount 释放 carrier，synchronized/native 调用导致 pinning 占住 carrier。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="390" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">虚拟线程 M:N 调度：M 个 VThread 复用 N 个 carrier</text>
<!-- VThreads -->
<rect x="24" y="56" width="150" height="300" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.6"/>
<text x="99" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#042C53" font-family="system-ui, sans-serif">M 个虚拟线程（廉价）</text>
<g font-size="11" fill="#2C2C2A" font-family="system-ui, sans-serif">
<rect x="40" y="90" width="118" height="22" rx="5" fill="#fff" stroke="#378ADD" stroke-width="0.5"/><text x="99" y="105" text-anchor="middle">VT-1 (栈在堆上)</text>
<rect x="40" y="118" width="118" height="22" rx="5" fill="#fff" stroke="#378ADD" stroke-width="0.5"/><text x="99" y="133" text-anchor="middle">VT-2</text>
<rect x="40" y="146" width="118" height="22" rx="5" fill="#fff" stroke="#378ADD" stroke-width="0.5"/><text x="99" y="161" text-anchor="middle">VT-3</text>
<text x="99" y="186" text-anchor="middle" fill="#5F5E5A">… 可达百万级</text>
<rect x="40" y="198" width="118" height="22" rx="5" fill="#fff" stroke="#378ADD" stroke-width="0.5"/><text x="99" y="213" text-anchor="middle">VT-n</text>
</g>
<text x="99" y="246" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="system-ui, sans-serif">阻塞即 unmount，</text>
<text x="99" y="262" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="system-ui, sans-serif">续体(continuation)留堆</text>
<!-- scheduler -->
<rect x="300" y="120" width="150" height="90" rx="10" fill="#FEF3E2" stroke="#BA7517" stroke-width="0.6"/>
<text x="375" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#7A4D0E" font-family="system-ui, sans-serif">JDK 调度器</text>
<text x="375" y="172" text-anchor="middle" font-size="11" fill="#7A4D0E" font-family="system-ui, sans-serif">ForkJoinPool</text>
<text x="375" y="190" text-anchor="middle" font-size="11" fill="#7A4D0E" font-family="system-ui, sans-serif">mount / unmount</text>
<!-- carriers -->
<rect x="566" y="56" width="186" height="300" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.6"/>
<text x="659" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C" font-family="system-ui, sans-serif">N 个 carrier (≈CPU 核数)</text>
<rect x="582" y="92" width="154" height="40" rx="6" fill="#fff" stroke="#1D9E75" stroke-width="0.5"/><text x="659" y="116" text-anchor="middle" font-size="11" fill="#04342C" font-family="system-ui, sans-serif">Carrier-1 ↔ OS 线程</text>
<rect x="582" y="138" width="154" height="40" rx="6" fill="#fff" stroke="#1D9E75" stroke-width="0.5"/><text x="659" y="162" text-anchor="middle" font-size="11" fill="#04342C" font-family="system-ui, sans-serif">Carrier-2 ↔ OS 线程</text>
<rect x="582" y="184" width="154" height="40" rx="6" fill="#fff" stroke="#1D9E75" stroke-width="0.5"/><text x="659" y="208" text-anchor="middle" font-size="11" fill="#04342C" font-family="system-ui, sans-serif">Carrier-N ↔ OS 线程</text>
<line x1="174" y1="140" x2="298" y2="155" stroke="#378ADD" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="452" y1="150" x2="564" y2="150" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#a)"/>
<!-- two scenarios -->
<rect x="24" y="300" width="424" height="110" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="40" y="322" font-size="12" font-weight="600" fill="#04342C" font-family="system-ui, sans-serif">✓ 正常阻塞（socket/sleep/JDK 改造过的 IO）</text>
<text x="40" y="342" font-size="11" fill="#444441" font-family="system-ui, sans-serif">VT 阻塞 → 从 carrier unmount → carrier 立刻去跑别的 VT</text>
<text x="40" y="360" font-size="11" fill="#444441" font-family="system-ui, sans-serif">→ 少量 carrier 撑起海量并发，吞吐随连接数扩展</text>
<text x="40" y="386" font-size="11" fill="#1D9E75" font-weight="600" font-family="system-ui, sans-serif">关键：阻塞的是 VT，不是宝贵的平台线程</text>
<rect x="566" y="240" width="186" height="116" rx="10" fill="#FBE9E7" stroke="#C0392B" stroke-width="0.6"/>
<text x="659" y="262" text-anchor="middle" font-size="12" font-weight="600" fill="#922B21" font-family="system-ui, sans-serif">✗ Pinning（钉住）</text>
<text x="659" y="282" text-anchor="middle" font-size="10.5" fill="#922B21" font-family="system-ui, sans-serif">synchronized 临界区 /</text>
<text x="659" y="298" text-anchor="middle" font-size="10.5" fill="#922B21" font-family="system-ui, sans-serif">native(JNI)/老 IO 内</text>
<text x="659" y="318" text-anchor="middle" font-size="10.5" fill="#922B21" font-family="system-ui, sans-serif">阻塞 → 不能 unmount</text>
<text x="659" y="338" text-anchor="middle" font-size="10.5" fill="#922B21" font-family="system-ui, sans-serif">carrier 被占住 → 池耗尽</text>
<text x="390" y="424" text-anchor="middle" font-size="10.5" fill="#5F5E5A" font-family="system-ui, sans-serif">排查：-Djdk.tracePinnedThreads / JFR VirtualThreadPinned；synchronized 换 ReentrantLock</text>
</svg>
