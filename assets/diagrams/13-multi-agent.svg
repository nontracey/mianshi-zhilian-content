<svg viewBox="0 0 680 230" width="100%" role="img" aria-label="多Agent协作架构图">
<title>多Agent协作架构图</title><desc>四种多Agent协作模式对比</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">多Agent协作模式</text>
<rect x="40" y="52" width="140" height="90" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="110" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Supervisor</text>
<text x="110" y="98" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">调度Agent分配任务</text>
<text x="110" y="118" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">AgentA/B/C并行</text>
<rect x="200" y="52" width="140" height="90" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="270" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Pipeline</text>
<text x="270" y="98" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">流水线式传递</text>
<text x="270" y="118" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">A-&gt;B-&gt;C串行</text>
<rect x="360" y="52" width="140" height="90" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="430" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Debate</text>
<text x="430" y="98" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">多Agent辩论决策</text>
<text x="430" y="118" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">正方/反方辩论</text>
<rect x="520" y="52" width="140" height="90" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="590" y="78" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Swarm</text>
<text x="590" y="98" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">动态交接路由</text>
<text x="590" y="118" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">按问题类型路由</text>
<rect x="60" y="160" width="560" height="50" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="180" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">选型建议</text>
<text x="340" y="200" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">工具少用单Agent，任务可分解用Supervisor，需质量保证用Debate</text>
</svg>