<svg width="100%" aria-label="多Agent协作架构图" role="img" viewBox="0 0 680 230"><title>多Agent协作架构图</title><desc>四种多Agent协作模式对比</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="340" y="24" fill="#042C53" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">多Agent协作模式</text><rect width="140" height="90" x="40" y="52" fill="#E6F1FB" stroke="#378ADD" stroke-width=".5" rx="10"/><text x="110" y="78" fill="#042C53" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Supervisor</text><text x="110" y="98" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">调度Agent分配任务</text><text x="110" y="118" fill="#888780" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">AgentA/B/C并行</text><rect width="140" height="90" x="200" y="52" fill="#EEEDFE" stroke="#7F77DD" stroke-width=".5" rx="10"/><text x="270" y="78" fill="#042C53" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Pipeline</text><text x="270" y="98" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">流水线式传递</text><text x="270" y="118" fill="#888780" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">A-&gt;B-&gt;C串行</text><rect width="140" height="90" x="360" y="52" fill="#FAEEDA" stroke="#BA7517" stroke-width=".5" rx="10"/><text x="430" y="78" fill="#042C53" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Debate</text><text x="430" y="98" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">多Agent辩论决策</text><text x="430" y="118" fill="#888780" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">正方/反方辩论</text><rect width="140" height="90" x="520" y="52" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".5" rx="10"/><text x="590" y="78" fill="#042C53" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Swarm</text><text x="590" y="98" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">动态交接路由</text><text x="590" y="118" fill="#888780" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">按问题类型路由</text><rect width="560" height="50" x="60" y="160" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="10"/><text x="340" y="180" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">选型建议</text><text x="340" y="200" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">工具少用单Agent，任务可分解用Supervisor，需质量保证用Debate</text></svg>