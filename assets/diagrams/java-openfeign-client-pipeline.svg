<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">Spring Cloud OpenFeign 调用链路</title>
  <desc id="desc">展示 OpenFeign 从 @FeignClient 注册、命名客户端上下文、接口代理调用、请求构造、负载均衡、HTTP Client、编解码、超时和熔断降级的关键路径。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .box-title { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 13px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .blue { fill: #e8f2ff; stroke: #60a5fa; stroke-width: 2; rx: 12; }
      .green { fill: #e8f8ef; stroke: #4ade80; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff7d6; stroke: #facc15; stroke-width: 2; rx: 12; }
      .orange { fill: #fff1e6; stroke: #fb923c; stroke-width: 2; rx: 12; }
      .red { fill: #feecec; stroke: #f87171; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #b45309; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">OpenFeign：声明式接口背后是一条同步 HTTP 客户端链</text>
  <text x="50" y="86" class="subtitle">2026 维护口径：OpenFeign 仍可维护存量微服务，新系统要评估 Spring HTTP Service Clients / RestClient。</text>

  <rect x="40" y="120" width="1200" height="265" class="panel"/>
  <text x="68" y="156" class="panel-title">1. 启动期：每个 @FeignClient 都有一组命名组件</text>
  <rect x="78" y="210" width="180" height="70" class="blue"/>
  <text x="108" y="238" class="box-title">@EnableFeignClients</text>
  <text x="100" y="262" class="tiny">扫描接口和属性</text>
  <rect x="315" y="210" width="180" height="70" class="green"/>
  <text x="350" y="238" class="box-title">@FeignClient</text>
  <text x="336" y="262" class="tiny">name / url / contextId</text>
  <rect x="552" y="210" width="210" height="70" class="yellow"/>
  <text x="584" y="238" class="box-title">Named client context</text>
  <text x="580" y="262" class="tiny">Encoder / Decoder / Contract</text>
  <rect x="820" y="210" width="180" height="70" class="orange"/>
  <text x="858" y="238" class="box-title">Feign.Builder</text>
  <text x="842" y="262" class="tiny">CircuitBreaker builder</text>
  <rect x="1060" y="210" width="140" height="70" class="red"/>
  <text x="1090" y="238" class="box-title">代理 Bean</text>
  <text x="1082" y="262" class="tiny">注入给业务类</text>
  <line x1="258" y1="245" x2="315" y2="245" class="line"/>
  <line x1="495" y1="245" x2="552" y2="245" class="line"/>
  <line x1="762" y1="245" x2="820" y2="245" class="line"/>
  <line x1="1000" y1="245" x2="1060" y2="245" class="line"/>
  <text x="78" y="335" class="small">OpenFeign 4.x 起 @FeignClient 属性默认提前解析，利于 AOT；Contract 默认是 SpringMvcContract，负责解释 Spring MVC 注解。</text>

  <rect x="40" y="425" width="1200" height="365" class="panel"/>
  <text x="68" y="461" class="panel-title">2. 调用期：接口方法被代理转换成 HTTP 请求</text>
  <rect x="78" y="522" width="150" height="62" class="blue"/>
  <text x="114" y="547" class="box-title">业务调用</text>
  <text x="96" y="568" class="tiny">userClient.get(7)</text>
  <rect x="272" y="522" width="150" height="62" class="green"/>
  <text x="304" y="547" class="box-title">JDK proxy</text>
  <text x="294" y="568" class="tiny">拦截方法和参数</text>
  <rect x="466" y="522" width="170" height="62" class="yellow"/>
  <text x="506" y="547" class="box-title">Contract</text>
  <text x="488" y="568" class="tiny">读取映射注解</text>
  <rect x="680" y="522" width="170" height="62" class="orange"/>
  <text x="714" y="547" class="box-title">RequestTemplate</text>
  <text x="702" y="568" class="tiny">path/header/body</text>
  <rect x="894" y="522" width="150" height="62" class="gray"/>
  <text x="928" y="547" class="box-title">Interceptor</text>
  <text x="914" y="568" class="tiny">鉴权/Trace/租户</text>
  <rect x="1088" y="522" width="112" height="62" class="blue"/>
  <text x="1114" y="547" class="box-title">Target</text>
  <text x="1104" y="568" class="tiny">name 或 url</text>
  <line x1="228" y1="553" x2="272" y2="553" class="line"/>
  <line x1="422" y1="553" x2="466" y2="553" class="line"/>
  <line x1="636" y1="553" x2="680" y2="553" class="line"/>
  <line x1="850" y1="553" x2="894" y2="553" class="line"/>
  <line x1="1044" y1="553" x2="1088" y2="553" class="line"/>

  <rect x="152" y="662" width="180" height="64" class="green"/>
  <text x="180" y="688" class="box-title">LoadBalancer</text>
  <text x="176" y="710" class="tiny">服务名选实例</text>
  <rect x="408" y="662" width="190" height="64" class="orange"/>
  <text x="448" y="688" class="box-title">HTTP Client</text>
  <text x="432" y="710" class="tiny">HC5 / HTTP2 / default</text>
  <rect x="674" y="662" width="180" height="64" class="yellow"/>
  <text x="710" y="688" class="box-title">Encoder/Decoder</text>
  <text x="704" y="710" class="tiny">消息转换</text>
  <rect x="930" y="662" width="180" height="64" class="red"/>
  <text x="966" y="688" class="box-title">ErrorDecoder</text>
  <text x="958" y="710" class="tiny">非 2xx 映射异常</text>
  <path d="M1144,584 C1144,625 242,610 242,662" class="line"/>
  <line x1="332" y1="694" x2="408" y2="694" class="line"/>
  <line x1="598" y1="694" x2="674" y2="694" class="line"/>
  <line x1="854" y1="694" x2="930" y2="694" class="line-red"/>

  <rect x="40" y="830" width="585" height="300" class="panel"/>
  <text x="68" y="866" class="panel-title">3. 失败治理：别把同步调用放大成线程堆积</text>
  <rect x="82" y="918" width="220" height="64" class="yellow"/>
  <text x="122" y="944" class="box-title">connect/read timeout</text>
  <text x="104" y="966" class="tiny">DNS、建连、响应耗时分开看</text>
  <rect x="360" y="918" width="220" height="64" class="red"/>
  <text x="405" y="944" class="box-title">CircuitBreaker</text>
  <text x="386" y="966" class="tiny">需 classpath + enabled=true</text>
  <rect x="82" y="1028" width="220" height="64" class="green"/>
  <text x="132" y="1054" class="box-title">fallbackFactory</text>
  <text x="106" y="1076" class="tiny">保留异常原因，便于打点</text>
  <rect x="360" y="1028" width="220" height="64" class="gray"/>
  <text x="394" y="1054" class="box-title">连接池 Singleton</text>
  <text x="382" y="1076" class="tiny">避免重复初始化耗尽资源</text>

  <rect x="655" y="830" width="585" height="300" class="panel"/>
  <text x="683" y="866" class="panel-title">4. 选型边界：存量可用，新系统要比较</text>
  <rect x="692" y="920" width="235" height="70" class="blue"/>
  <text x="728" y="948" class="box-title">OpenFeign</text>
  <text x="714" y="972" class="tiny">声明式接口 + Spring Cloud 集成</text>
  <rect x="968" y="920" width="235" height="70" class="green"/>
  <text x="1000" y="948" class="box-title">HTTP Service Clients</text>
  <text x="990" y="972" class="tiny">Spring Framework 原生接口代理</text>
  <text x="692" y="1026" class="small">官方仓库已标注 OpenFeign feature-complete；维护存量时关注</text>
  <text x="692" y="1052" class="small">依赖版本、负载均衡、观测、熔断和 HTTP Client 行为。</text>
  <text x="692" y="1090" class="small">新系统如果不依赖 Spring Cloud 命名客户端生态，可评估</text>
  <text x="692" y="1116" class="small">RestClient/WebClient + HTTP Service Clients。</text>

  <rect x="40" y="1170" width="1200" height="64" class="panel"/>
  <text x="68" y="1207" class="panel-title">回答抓手</text>
  <text x="190" y="1207" class="small">扫描注册 -> 命名客户端组件 -> 代理调用 -> RequestTemplate -> 拦截器 -> LoadBalancer/URL -> Client -> 编解码 -> 超时/熔断/降级 -> 选型边界。</text>
</svg>
