<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1420" viewBox="0 0 1320 1420" role="img" aria-labelledby="title desc">
  <title id="title">Java Stream pipeline, laziness, collectors, and parallel boundaries</title>
  <desc id="desc">A topic-specific diagram for Java Stream API showing data source, spliterator, lazy intermediate operations, terminal operations, stateful and short-circuit behavior, collectors, resource streams, and parallel stream constraints.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1420"/>
  <text class="title" x="70" y="64">Stream API：一次性惰性管道，而不是集合本身</text>
  <text class="subtitle" x="70" y="96">面试核心是数据源、Spliterator、中间操作融合、终端触发、Collector 语义和 parallelStream 的边界。</text>

  <rect class="panel" x="70" y="130" width="1180" height="395" rx="16"/>
  <text class="section-title" x="96" y="166">1. 顺序流执行模型</text>

  <rect class="blue" x="105" y="215" width="180" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="247">数据源</text>
  <text class="mono" x="132" y="272">List / array / file</text>
  <text class="text" x="132" y="292">Stream 不存元素</text>

  <rect class="green" x="330" y="215" width="190" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="357" y="247">Spliterator</text>
  <text class="text" x="357" y="272">遍历元素</text>
  <text class="text" x="357" y="292">描述拆分能力</text>

  <rect class="yellow" x="565" y="215" width="170" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="592" y="247">filter</text>
  <text class="text" x="592" y="272">无状态中间操作</text>
  <text class="text" x="592" y="292">逐元素判断</text>

  <rect class="yellow" x="780" y="215" width="170" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="807" y="247">map / flatMap</text>
  <text class="text" x="807" y="272">变换或展开</text>
  <text class="text" x="807" y="292">仍然惰性</text>

  <rect class="violet" x="995" y="215" width="190" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="1022" y="247">终端操作</text>
  <text class="mono" x="1022" y="272">collect / reduce</text>
  <text class="text" x="1022" y="292">触发遍历并消费流</text>

  <path class="arrow-blue" d="M285 259 H321"/>
  <path class="arrow-blue" d="M520 259 H556"/>
  <path class="arrow-blue" d="M735 259 H771"/>
  <path class="arrow-blue" d="M950 259 H986"/>

  <rect class="cyan" x="125" y="355" width="300" height="96" rx="12" stroke-width="2"/>
  <text class="box-title" x="152" y="386">没有终端操作</text>
  <text class="text" x="152" y="411">只是组装管道，不遍历数据源</text>
  <text class="mono" x="152" y="433">stream.map(...); // 不执行映射</text>

  <rect class="green" x="500" y="355" width="300" height="96" rx="12" stroke-width="2"/>
  <text class="box-title" x="527" y="386">操作融合</text>
  <text class="text" x="527" y="411">元素按管道流动</text>
  <text class="text" x="527" y="433">通常不为每个中间步骤建集合</text>

  <rect class="red" x="875" y="355" width="300" height="96" rx="12" stroke-width="2"/>
  <text class="box-title" x="902" y="386">流只能消费一次</text>
  <text class="text" x="902" y="411">终端操作后再用会抛异常</text>
  <text class="mono" x="902" y="433">IllegalStateException</text>

  <rect class="panel" x="70" y="565" width="575" height="305" rx="16"/>
  <text class="section-title" x="96" y="601">2. 有状态与短路操作</text>

  <rect class="violet" x="105" y="650" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="682">有状态中间操作</text>
  <text class="mono" x="132" y="706">sorted / distinct</text>
  <text class="text" x="132" y="724">可能缓存、排序或去重</text>

  <rect class="yellow" x="375" y="650" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="402" y="682">短路中间操作</text>
  <text class="mono" x="402" y="706">limit / skip</text>
  <text class="text" x="402" y="724">有顺序时成本更高</text>

  <rect class="green" x="105" y="765" width="230" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="795">短路终端操作</text>
  <text class="mono" x="132" y="817">findFirst / anyMatch</text>

  <rect class="red" x="375" y="765" width="230" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="402" y="795">副作用警戒</text>
  <text class="text" x="402" y="817">不要用 peek 承载业务写入</text>

  <rect class="panel" x="675" y="565" width="575" height="305" rx="16"/>
  <text class="section-title" x="701" y="601">3. Collector 与资源语义</text>

  <rect class="green" x="710" y="650" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="737" y="682">分组与分区</text>
  <text class="mono" x="737" y="706">groupingBy / partitioningBy</text>
  <text class="text" x="737" y="724">关注结果类型和顺序</text>

  <rect class="yellow" x="980" y="650" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1007" y="682">toMap</text>
  <text class="text" x="1007" y="706">key 冲突需 merge</text>
  <text class="text" x="1007" y="724">必要时指定 Map 工厂</text>

  <rect class="blue" x="710" y="765" width="230" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="737" y="795">toList 差异</text>
  <text class="text" x="737" y="817">Stream.toList 返回不可变结果</text>

  <rect class="red" x="980" y="765" width="230" height="70" rx="12" stroke-width="2"/>
  <text class="box-title" x="1007" y="795">资源型 Stream</text>
  <text class="mono" x="1007" y="817">try (Files.lines(...))</text>

  <rect class="panel" x="70" y="910" width="1180" height="330" rx="16"/>
  <text class="section-title" x="96" y="946">4. parallelStream：可拆分、无共享状态、合并可证明</text>

  <rect class="blue" x="110" y="1010" width="200" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="137" y="1042">Spliterator 拆分</text>
  <text class="text" x="137" y="1067">能均匀切任务才划算</text>

  <rect class="green" x="370" y="985" width="200" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="397" y="1017">ForkJoin 任务 A</text>
  <text class="text" x="397" y="1042">CPU 计算</text>

  <rect class="green" x="370" y="1095" width="200" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="397" y="1127">ForkJoin 任务 B</text>
  <text class="text" x="397" y="1152">避免阻塞 IO</text>

  <rect class="yellow" x="635" y="1010" width="220" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="662" y="1042">归约 / 合并</text>
  <text class="text" x="662" y="1067">函数需满足结合律</text>

  <rect class="red" x="920" y="985" width="250" height="92" rx="12" stroke-width="2"/>
  <text class="box-title" x="947" y="1017">不要共享可变集合</text>
  <text class="text" x="947" y="1042">竞态、锁竞争、顺序不确定</text>
  <text class="text" x="947" y="1062">用 collect/reduce 表达结果</text>

  <rect class="red" x="920" y="1105" width="250" height="72" rx="12" stroke-width="2"/>
  <text class="box-title" x="947" y="1137">公共池影响</text>
  <text class="text" x="947" y="1162">默认 commonPool，可能互相挤占</text>

  <path class="arrow-green" d="M310 1051 H361"/>
  <path class="arrow-green" d="M570 1026 C600 1026 604 1051 626 1051"/>
  <path class="arrow-green" d="M570 1136 C600 1136 604 1076 626 1076"/>
  <path class="arrow-blue" d="M855 1051 H911"/>
  <path class="dash" d="M745 1092 C760 1160 835 1180 920 1160"/>

  <text class="small" x="110" y="1220">并行流不是免费加速。是否使用要看数据量、拆分成本、函数是否纯、合并是否便宜、顺序要求和公共线程池竞争。</text>

  <text class="small" x="96" y="1348">答题抓手：Stream 不存数据且只能消费一次；中间操作惰性，终端操作触发；Collector 要讲清冲突、顺序、可变性；并行流必须用压测或 profiling 证明收益。</text>
</svg>
