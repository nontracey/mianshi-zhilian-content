<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1420" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1420"><title id="title">Java Stream pipeline, laziness, collectors, and parallel boundaries</title><desc id="desc">A topic-specific diagram for Java Stream API showing data source, spliterator, lazy intermediate operations, terminal operations, stateful and short-circuit behavior, collectors, resource streams, and parallel stream constraints.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 32px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.arrow-blue,.arrow-green{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.arrow-green{stroke:#16a34a;marker-end:url(#arrow-green)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:7 6}</style></defs><rect width="1320" height="1420" class="bg"/><text x="70" y="64" class="title">Stream API：一次性惰性管道，而不是集合本身</text><text x="70" y="96" class="subtitle">面试核心是数据源、Spliterator、中间操作融合、终端触发、Collector 语义和 parallelStream 的边界。</text><rect width="1180" height="395" x="70" y="130" class="panel" rx="16"/><text x="96" y="166" class="section-title">1. 顺序流执行模型</text><rect width="180" height="88" x="105" y="215" stroke-width="2" class="blue" rx="12"/><text x="132" y="247" class="box-title">数据源</text><text x="132" y="272" class="mono">List / array / file</text><text x="132" y="292" class="text">Stream 不存元素</text><rect width="190" height="88" x="330" y="215" stroke-width="2" class="green" rx="12"/><text x="357" y="247" class="box-title">Spliterator</text><text x="357" y="272" class="text">遍历元素</text><text x="357" y="292" class="text">描述拆分能力</text><rect width="170" height="88" x="565" y="215" stroke-width="2" class="yellow" rx="12"/><text x="592" y="247" class="box-title">filter</text><text x="592" y="272" class="text">无状态中间操作</text><text x="592" y="292" class="text">逐元素判断</text><rect width="170" height="88" x="780" y="215" stroke-width="2" class="yellow" rx="12"/><text x="807" y="247" class="box-title">map / flatMap</text><text x="807" y="272" class="text">变换或展开</text><text x="807" y="292" class="text">仍然惰性</text><rect width="190" height="88" x="995" y="215" stroke-width="2" class="violet" rx="12"/><text x="1022" y="247" class="box-title">终端操作</text><text x="1022" y="272" class="mono">collect / reduce</text><text x="1022" y="292" class="text">触发遍历并消费流</text><path d="M285 259 H321" class="arrow-blue"/><path d="M520 259 H556" class="arrow-blue"/><path d="M735 259 H771" class="arrow-blue"/><path d="M950 259 H986" class="arrow-blue"/><rect width="300" height="96" x="125" y="355" stroke-width="2" class="cyan" rx="12"/><text x="152" y="386" class="box-title">没有终端操作</text><text x="152" y="411" class="text">只是组装管道，不遍历数据源</text><text x="152" y="433" class="mono">stream.map(...); // 不执行映射</text><rect width="300" height="96" x="500" y="355" stroke-width="2" class="green" rx="12"/><text x="527" y="386" class="box-title">操作融合</text><text x="527" y="411" class="text">元素按管道流动</text><text x="527" y="433" class="text">通常不为每个中间步骤建集合</text><rect width="300" height="96" x="875" y="355" stroke-width="2" class="red" rx="12"/><text x="902" y="386" class="box-title">流只能消费一次</text><text x="902" y="411" class="text">终端操作后再用会抛异常</text><text x="902" y="433" class="mono">IllegalStateException</text><rect width="575" height="305" x="70" y="565" class="panel" rx="16"/><text x="96" y="601" class="section-title">2. 有状态与短路操作</text><rect width="230" height="82" x="105" y="650" stroke-width="2" class="violet" rx="12"/><text x="132" y="682" class="box-title">有状态中间操作</text><text x="132" y="706" class="mono">sorted / distinct</text><text x="132" y="724" class="text">可能缓存、排序或去重</text><rect width="230" height="82" x="375" y="650" stroke-width="2" class="yellow" rx="12"/><text x="402" y="682" class="box-title">短路中间操作</text><text x="402" y="706" class="mono">limit / skip</text><text x="402" y="724" class="text">有顺序时成本更高</text><rect width="230" height="70" x="105" y="765" stroke-width="2" class="green" rx="12"/><text x="132" y="795" class="box-title">短路终端操作</text><text x="132" y="817" class="mono">findFirst / anyMatch</text><rect width="230" height="70" x="375" y="765" stroke-width="2" class="red" rx="12"/><text x="402" y="795" class="box-title">副作用警戒</text><text x="402" y="817" class="text">不要用 peek 承载业务写入</text><rect width="575" height="305" x="675" y="565" class="panel" rx="16"/><text x="701" y="601" class="section-title">3. Collector 与资源语义</text><rect width="230" height="82" x="710" y="650" stroke-width="2" class="green" rx="12"/><text x="737" y="682" class="box-title">分组与分区</text><text x="737" y="706" class="mono">groupingBy / partitioningBy</text><text x="737" y="724" class="text">关注结果类型和顺序</text><rect width="230" height="82" x="980" y="650" stroke-width="2" class="yellow" rx="12"/><text x="1007" y="682" class="box-title">toMap</text><text x="1007" y="706" class="text">key 冲突需 merge</text><text x="1007" y="724" class="text">必要时指定 Map 工厂</text><rect width="230" height="70" x="710" y="765" stroke-width="2" class="blue" rx="12"/><text x="737" y="795" class="box-title">toList 差异</text><text x="737" y="817" class="text">Stream.toList 返回不可变结果</text><rect width="230" height="70" x="980" y="765" stroke-width="2" class="red" rx="12"/><text x="1007" y="795" class="box-title">资源型 Stream</text><text x="1007" y="817" class="mono">try (Files.lines(...))</text><rect width="1180" height="330" x="70" y="910" class="panel" rx="16"/><text x="96" y="946" class="section-title">4. parallelStream：可拆分、无共享状态、合并可证明</text><rect width="200" height="82" x="110" y="1010" stroke-width="2" class="blue" rx="12"/><text x="137" y="1042" class="box-title">Spliterator 拆分</text><text x="137" y="1067" class="text">能均匀切任务才划算</text><rect width="200" height="82" x="370" y="985" stroke-width="2" class="green" rx="12"/><text x="397" y="1017" class="box-title">ForkJoin 任务 A</text><text x="397" y="1042" class="text">CPU 计算</text><rect width="200" height="82" x="370" y="1095" stroke-width="2" class="green" rx="12"/><text x="397" y="1127" class="box-title">ForkJoin 任务 B</text><text x="397" y="1152" class="text">避免阻塞 IO</text><rect width="220" height="82" x="635" y="1010" stroke-width="2" class="yellow" rx="12"/><text x="662" y="1042" class="box-title">归约 / 合并</text><text x="662" y="1067" class="text">函数需满足结合律</text><rect width="250" height="92" x="920" y="985" stroke-width="2" class="red" rx="12"/><text x="947" y="1017" class="box-title">不要共享可变集合</text><text x="947" y="1042" class="text">竞态、锁竞争、顺序不确定</text><text x="947" y="1062" class="text">用 collect/reduce 表达结果</text><rect width="250" height="72" x="920" y="1105" stroke-width="2" class="red" rx="12"/><text x="947" y="1137" class="box-title">公共池影响</text><text x="947" y="1162" class="text">默认 commonPool，可能互相挤占</text><path d="M310 1051 H361" class="arrow-green"/><path d="M570 1026 C600 1026 604 1051 626 1051" class="arrow-green"/><path d="M570 1136 C600 1136 604 1076 626 1076" class="arrow-green"/><path d="M855 1051 H911" class="arrow-blue"/><path d="M745 1092 C760 1160 835 1180 920 1160" class="dash"/><text x="110" y="1220" class="small">并行流不是免费加速。是否使用要看数据量、拆分成本、函数是否纯、合并是否便宜、顺序要求和公共线程池竞争。</text><text x="96" y="1348" class="small">答题抓手：Stream 不存数据且只能消费一次；中间操作惰性，终端操作触发；Collector 要讲清冲突、顺序、可变性；并行流必须用压测或 profiling 证明收益。</text></svg>