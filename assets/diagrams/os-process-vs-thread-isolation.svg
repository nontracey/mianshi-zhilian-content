<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">进程与线程的隔离、共享和切换成本</title><desc id="desc">展示不同进程拥有独立虚拟地址空间，同一进程内线程共享代码、堆、文件描述符等资源但拥有独立栈和寄存器上下文，并说明 Linux clone flags 与上下文切换成本边界。</desc><defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:600 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.h2{font:700 24px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:700 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:600 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.amber,.blue,.green{stroke-width:2}.blue,.green{fill:#eff6ff;stroke:#60a5fa}.green{fill:#ecfdf5;stroke:#34d399}.amber{fill:#fffbeb;stroke:#f59e0b}.gray{stroke-width:2}.red{fill:#fef2f2;stroke:#f87171}.red,.violet{stroke-width:2}.gray{fill:#f1f5f9;stroke:#cbd5e1}.violet{fill:#f5f3ff;stroke:#a78bfa}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#2563eb" d="M2,2 L10,6 L2,10 Z"/></marker><marker id="warnArrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#dc2626" d="M2,2 L10,6 L2,10 Z"/></marker></defs><rect width="1320" height="1320" class="bg"/><text x="660" y="55" class="title" text-anchor="middle">进程 vs 线程：真正差异是资源边界和故障半径</text><text x="660" y="88" class="subtitle" text-anchor="middle">进程拥有独立地址空间；线程是同一地址空间里的多个执行流，共享快但要同步</text><rect width="1204" height="390" x="58" y="120" class="panel" rx="10"/><text x="90" y="160" class="h2">1. 资源边界：两个进程彼此隔离，同一进程内线程共享大部分资源</text><rect width="350" height="230" x="95" y="205" class="blue" rx="10"/><text x="270" y="235" class="label" text-anchor="middle">Process A：独立虚拟地址空间</text><rect width="130" height="50" x="125" y="265" class="green" rx="8"/><text x="190" y="296" class="tiny" text-anchor="middle">code / text</text><rect width="130" height="50" x="285" y="265" class="green" rx="8"/><text x="350" y="296" class="tiny" text-anchor="middle">heap / globals</text><rect width="130" height="50" x="125" y="345" class="violet" rx="8"/><text x="190" y="376" class="tiny" text-anchor="middle">thread stack 1</text><rect width="130" height="50" x="285" y="345" class="violet" rx="8"/><text x="350" y="376" class="tiny" text-anchor="middle">thread stack 2</text><rect width="350" height="230" x="870" y="205" class="red" rx="10"/><text x="1045" y="235" class="label" text-anchor="middle">Process B：另一套地址空间</text><rect width="130" height="50" x="900" y="265" class="green" rx="8"/><text x="965" y="296" class="tiny" text-anchor="middle">code / text</text><rect width="130" height="50" x="1060" y="265" class="green" rx="8"/><text x="1125" y="296" class="tiny" text-anchor="middle">heap / globals</text><rect width="130" height="50" x="900" y="345" class="violet" rx="8"/><text x="965" y="376" class="tiny" text-anchor="middle">thread stack</text><rect width="130" height="50" x="1060" y="345" class="gray" rx="8"/><text x="1125" y="376" class="tiny" text-anchor="middle">fd table</text><rect width="345" height="78" x="485" y="230" class="amber" rx="8"/><text x="657" y="260" class="label" text-anchor="middle">进程间通信 IPC</text><text x="657" y="287" class="tiny" text-anchor="middle">pipe / UDS / shared memory / socket</text><path d="M448 270 H480" class="arrow"/><path d="M832 270 H865" class="arrow"/><rect width="345" height="78" x="485" y="350" class="gray" rx="8"/><text x="657" y="380" class="label" text-anchor="middle">线程间共享内存</text><text x="657" y="407" class="tiny" text-anchor="middle">直接读写快，但必须用锁/原子/队列</text><rect width="1204" height="320" x="58" y="550" class="panel" rx="10"/><text x="90" y="590" class="h2">2. Linux 实现：线程不是神秘对象，而是共享资源更多的 task</text><rect width="250" height="82" x="95" y="645" class="blue" rx="8"/><text x="220" y="675" class="label" text-anchor="middle">fork</text><text x="220" y="702" class="tiny" text-anchor="middle">新 task + 新 mm，COW 延迟复制页</text><path d="M348 686 H410" class="arrow"/><rect width="250" height="82" x="415" y="645" class="green" rx="8"/><text x="540" y="675" class="label" text-anchor="middle">pthread / clone</text><text x="540" y="702" class="tiny" text-anchor="middle">CLONE_VM / FILES / SIGHAND...</text><path d="M668 686 H730" class="arrow"/><rect width="250" height="82" x="735" y="645" class="violet" rx="8"/><text x="860" y="675" class="label" text-anchor="middle">调度对象</text><text x="860" y="702" class="tiny" text-anchor="middle">内核调度 task，保存寄存器/栈等上下文</text><rect width="180" height="82" x="1015" y="645" class="gray" rx="8"/><text x="1105" y="675" class="label" text-anchor="middle">LWP / TID</text><text x="1105" y="702" class="tiny" text-anchor="middle">用户线程映射到内核任务</text><rect width="335" height="58" x="95" y="770" class="amber" rx="8"/><text x="262" y="806" class="text" text-anchor="middle">进程切换：可能切 mm/page table，TLB/缓存成本更高</text><rect width="335" height="58" x="492" y="770" class="amber" rx="8"/><text x="659" y="806" class="text" text-anchor="middle">线程切换：同一 mm 更便宜，但仍有寄存器/栈/缓存成本</text><rect width="306" height="58" x="889" y="770" class="amber" rx="8"/><text x="1042" y="806" class="text" text-anchor="middle">多线程快不等于安全：数据竞争会破坏共享状态</text><rect width="1204" height="310" x="58" y="910" class="panel" rx="10"/><text x="90" y="950" class="h2">3. 选型：看隔离、共享状态、故障半径和部署边界</text><rect width="250" height="82" x="95" y="1005" class="green" rx="8"/><text x="220" y="1035" class="label" text-anchor="middle">选多线程</text><text x="220" y="1062" class="tiny" text-anchor="middle">共享内存、低延迟、同服务并发</text><rect width="250" height="82" x="380" y="1005" class="blue" rx="8"/><text x="505" y="1035" class="label" text-anchor="middle">选多进程</text><text x="505" y="1062" class="tiny" text-anchor="middle">强隔离、独立崩溃、权限边界</text><rect width="250" height="82" x="665" y="1005" class="amber" rx="8"/><text x="790" y="1035" class="label" text-anchor="middle">选进程池</text><text x="790" y="1062" class="tiny" text-anchor="middle">CPU 密集、绕开单进程锁或 GIL</text><rect width="245" height="82" x="950" y="1005" class="red" rx="8"/><text x="1072" y="1035" class="label" text-anchor="middle">高风险点</text><text x="1072" y="1062" class="tiny" text-anchor="middle">共享状态未同步、fd 泄漏、线程崩溃</text><rect width="1100" height="44" x="95" y="1135" class="gray" rx="8"/><text x="645" y="1163" class="text" text-anchor="middle">面试表达：不要停在“进程资源、线程调度”，要能落到 Linux task、clone 共享项、COW、IPC 和故障半径</text></svg>