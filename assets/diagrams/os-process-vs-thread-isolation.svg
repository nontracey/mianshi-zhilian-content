<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">进程与线程的隔离、共享和切换成本</title>
  <desc id="desc">展示不同进程拥有独立虚拟地址空间，同一进程内线程共享代码、堆、文件描述符等资源但拥有独立栈和寄存器上下文，并说明 Linux clone flags 与上下文切换成本边界。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .h2 { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 700 14px "SFMono-Regular", Consolas, monospace; fill: #0f172a; }
      .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .green { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; }
      .red { fill: #fef2f2; stroke: #f87171; stroke-width: 2; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
      .violet { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .warnArrow { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#warnArrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="warnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="660" y="55" text-anchor="middle">进程 vs 线程：真正差异是资源边界和故障半径</text>
  <text class="subtitle" x="660" y="88" text-anchor="middle">进程拥有独立地址空间；线程是同一地址空间里的多个执行流，共享快但要同步</text>

  <rect class="panel" x="58" y="120" width="1204" height="390" rx="10"/>
  <text class="h2" x="90" y="160">1. 资源边界：两个进程彼此隔离，同一进程内线程共享大部分资源</text>

  <rect class="blue" x="95" y="205" width="350" height="230" rx="10"/>
  <text class="label" x="270" y="235" text-anchor="middle">Process A：独立虚拟地址空间</text>
  <rect class="green" x="125" y="265" width="130" height="50" rx="8"/>
  <text class="tiny" x="190" y="296" text-anchor="middle">code / text</text>
  <rect class="green" x="285" y="265" width="130" height="50" rx="8"/>
  <text class="tiny" x="350" y="296" text-anchor="middle">heap / globals</text>
  <rect class="violet" x="125" y="345" width="130" height="50" rx="8"/>
  <text class="tiny" x="190" y="376" text-anchor="middle">thread stack 1</text>
  <rect class="violet" x="285" y="345" width="130" height="50" rx="8"/>
  <text class="tiny" x="350" y="376" text-anchor="middle">thread stack 2</text>

  <rect class="red" x="870" y="205" width="350" height="230" rx="10"/>
  <text class="label" x="1045" y="235" text-anchor="middle">Process B：另一套地址空间</text>
  <rect class="green" x="900" y="265" width="130" height="50" rx="8"/>
  <text class="tiny" x="965" y="296" text-anchor="middle">code / text</text>
  <rect class="green" x="1060" y="265" width="130" height="50" rx="8"/>
  <text class="tiny" x="1125" y="296" text-anchor="middle">heap / globals</text>
  <rect class="violet" x="900" y="345" width="130" height="50" rx="8"/>
  <text class="tiny" x="965" y="376" text-anchor="middle">thread stack</text>
  <rect class="gray" x="1060" y="345" width="130" height="50" rx="8"/>
  <text class="tiny" x="1125" y="376" text-anchor="middle">fd table</text>

  <rect class="amber" x="485" y="230" width="345" height="78" rx="8"/>
  <text class="label" x="657" y="260" text-anchor="middle">进程间通信 IPC</text>
  <text class="tiny" x="657" y="287" text-anchor="middle">pipe / UDS / shared memory / socket</text>
  <path class="arrow" d="M448 270 H480"/>
  <path class="arrow" d="M832 270 H865"/>
  <rect class="gray" x="485" y="350" width="345" height="78" rx="8"/>
  <text class="label" x="657" y="380" text-anchor="middle">线程间共享内存</text>
  <text class="tiny" x="657" y="407" text-anchor="middle">直接读写快，但必须用锁/原子/队列</text>

  <rect class="panel" x="58" y="550" width="1204" height="320" rx="10"/>
  <text class="h2" x="90" y="590">2. Linux 实现：线程不是神秘对象，而是共享资源更多的 task</text>
  <rect class="blue" x="95" y="645" width="250" height="82" rx="8"/>
  <text class="label" x="220" y="675" text-anchor="middle">fork</text>
  <text class="tiny" x="220" y="702" text-anchor="middle">新 task + 新 mm，COW 延迟复制页</text>
  <path class="arrow" d="M348 686 H410"/>
  <rect class="green" x="415" y="645" width="250" height="82" rx="8"/>
  <text class="label" x="540" y="675" text-anchor="middle">pthread / clone</text>
  <text class="tiny" x="540" y="702" text-anchor="middle">CLONE_VM / FILES / SIGHAND...</text>
  <path class="arrow" d="M668 686 H730"/>
  <rect class="violet" x="735" y="645" width="250" height="82" rx="8"/>
  <text class="label" x="860" y="675" text-anchor="middle">调度对象</text>
  <text class="tiny" x="860" y="702" text-anchor="middle">内核调度 task，保存寄存器/栈等上下文</text>
  <rect class="gray" x="1015" y="645" width="180" height="82" rx="8"/>
  <text class="label" x="1105" y="675" text-anchor="middle">LWP / TID</text>
  <text class="tiny" x="1105" y="702" text-anchor="middle">用户线程映射到内核任务</text>

  <rect class="amber" x="95" y="770" width="335" height="58" rx="8"/>
  <text class="text" x="262" y="806" text-anchor="middle">进程切换：可能切 mm/page table，TLB/缓存成本更高</text>
  <rect class="amber" x="492" y="770" width="335" height="58" rx="8"/>
  <text class="text" x="659" y="806" text-anchor="middle">线程切换：同一 mm 更便宜，但仍有寄存器/栈/缓存成本</text>
  <rect class="amber" x="889" y="770" width="306" height="58" rx="8"/>
  <text class="text" x="1042" y="806" text-anchor="middle">多线程快不等于安全：数据竞争会破坏共享状态</text>

  <rect class="panel" x="58" y="910" width="1204" height="310" rx="10"/>
  <text class="h2" x="90" y="950">3. 选型：看隔离、共享状态、故障半径和部署边界</text>
  <rect class="green" x="95" y="1005" width="250" height="82" rx="8"/>
  <text class="label" x="220" y="1035" text-anchor="middle">选多线程</text>
  <text class="tiny" x="220" y="1062" text-anchor="middle">共享内存、低延迟、同服务并发</text>
  <rect class="blue" x="380" y="1005" width="250" height="82" rx="8"/>
  <text class="label" x="505" y="1035" text-anchor="middle">选多进程</text>
  <text class="tiny" x="505" y="1062" text-anchor="middle">强隔离、独立崩溃、权限边界</text>
  <rect class="amber" x="665" y="1005" width="250" height="82" rx="8"/>
  <text class="label" x="790" y="1035" text-anchor="middle">选进程池</text>
  <text class="tiny" x="790" y="1062" text-anchor="middle">CPU 密集、绕开单进程锁或 GIL</text>
  <rect class="red" x="950" y="1005" width="245" height="82" rx="8"/>
  <text class="label" x="1072" y="1035" text-anchor="middle">高风险点</text>
  <text class="tiny" x="1072" y="1062" text-anchor="middle">共享状态未同步、fd 泄漏、线程崩溃</text>

  <rect class="gray" x="95" y="1135" width="1100" height="44" rx="8"/>
  <text class="text" x="645" y="1163" text-anchor="middle">面试表达：不要停在“进程资源、线程调度”，要能落到 Linux task、clone 共享项、COW、IPC 和故障半径</text>
</svg>
