<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1280"><title id="title">HTTP/3 与 QUIC：握手、独立流、迁移与回退</title><desc id="desc">三段式展示 HTTP/3 over QUIC：首次 1-RTT 与受限 0-RTT，QUIC stream 独立重组避免跨流队头阻塞，以及 Connection ID 支持迁移、UDP 不通时回退 HTTP/2。</desc><defs><marker id="arrow-blue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#059669" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.panel-title{font:700 28px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:600 20px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1e293b}.small{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.box-blue{fill:#eff6ff;stroke:#60a5fa}.box-amber,.box-blue{stroke-width:2;rx:14}.box-green{fill:#ecfdf5;stroke:#34d399}.box-green,.box-red{stroke-width:2;rx:14}.box-amber{fill:#fffbeb;stroke:#f59e0b}.box-red{fill:#fef2f2;stroke:#f87171}.line-blue{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow-blue)}.dash-green{stroke:#059669;marker-end:url(#arrow-green)}.dash-green,.dash-red,.line-green{stroke-width:4;fill:none}.line-green{stroke:#059669;marker-end:url(#arrow-green)}.dash-green,.dash-red{stroke-dasharray:10 8}.dash-red{stroke:#dc2626;marker-end:url(#arrow-red)}</style></defs><rect width="1280" height="1280" x="0" y="0" class="bg"/><text x="640" y="58" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="800" text-anchor="middle">HTTP/3 与 QUIC 的真实链路</text><text x="640" y="92" class="small" text-anchor="middle">HTTP 语义不变；变化在 QUIC 传输：更低握手成本、每流独立可靠交付、迁移与回退</text><rect width="1160" height="300" x="60" y="120" class="panel"/><text x="92" y="162" class="panel-title">1. 握手：1-RTT 新建，0-RTT 只放重放安全早期数据</text><rect width="180" height="72" x="100" y="205" class="box-blue"/><text x="190" y="235" class="label" text-anchor="middle">客户端</text><text x="190" y="260" class="tiny" text-anchor="middle">浏览器 / App</text><rect width="180" height="72" x="1000" y="205" class="box-blue"/><text x="1090" y="235" class="label" text-anchor="middle">服务端</text><text x="1090" y="260" class="tiny" text-anchor="middle">CDN / 网关</text><path d="M 285 222 C 455 180, 745 180, 995 222" class="line-blue"/><text x="640" y="190" class="small" text-anchor="middle">Initial: ClientHello + transport parameters</text><path d="M 995 260 C 800 315, 520 315, 285 260" class="line-blue"/><text x="640" y="328" class="small" text-anchor="middle">Server Initial + Handshake: ServerHello / 证书 / 参数</text><path d="M 285 360 C 470 392, 780 392, 995 360" class="line-green"/><text x="640" y="390" class="small" text-anchor="middle">Finished 后发送 HTTP/3 请求：新连接通常 1-RTT</text><path d="M 285 305 C 480 250, 780 250, 995 305" class="dash-green"/><text x="640" y="254" class="tiny" text-anchor="middle">会话恢复可夹带 0-RTT，但服务端可拒绝，写操作不应放早期数据</text><rect width="1160" height="320" x="60" y="455" class="panel"/><text x="92" y="497" class="panel-title">2. 独立 stream：丢包不再卡住其他请求</text><rect width="210" height="175" x="100" y="535" class="box-blue"/><text x="205" y="570" class="label" text-anchor="middle">一个 QUIC 连接</text><text x="205" y="600" class="tiny" text-anchor="middle">统一拥塞控制</text><text x="205" y="628" class="tiny" text-anchor="middle">Packet Number 不复用</text><text x="205" y="656" class="tiny" text-anchor="middle">TLS 保护大部分载荷</text><rect width="720" height="55" x="390" y="528" class="box-red"/><rect width="720" height="55" x="390" y="615" class="box-green"/><rect width="720" height="55" x="390" y="688" class="box-green"/><text x="425" y="563" class="label">Stream A</text><text x="425" y="650" class="label">Stream B</text><text x="425" y="723" class="label">Stream C</text><path d="M 520 556 L 710 556" class="line-blue"/><rect width="54" height="30" x="730" y="541" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="8"/><text x="757" y="562" fill="#b91c1c" class="tiny" text-anchor="middle">丢包</text><path d="M 785 556 C 860 510, 970 510, 1045 548" class="dash-red"/><text x="925" y="520" fill="#b91c1c" class="tiny" text-anchor="middle">只重传 A 的缺口</text><path d="M 520 643 L 1045 643" class="line-green"/><path d="M 520 716 L 1045 716" class="line-green"/><text x="1120" y="648" fill="#047857" class="small" text-anchor="middle">继续交付</text><text x="1120" y="721" fill="#047857" class="small" text-anchor="middle">继续交付</text><text x="640" y="764" class="small" text-anchor="middle">HTTP/2 的多个 stream 卡在同一条 TCP 字节流；QUIC 把可靠交付下沉到每个 stream</text><rect width="1160" height="330" x="60" y="810" class="panel"/><text x="92" y="852" class="panel-title">3. 迁移与回退：Connection ID 续连，UDP 不通就降级 h2</text><rect width="185" height="78" x="110" y="895" class="box-green"/><text x="202" y="928" class="label" text-anchor="middle">Wi-Fi 网络</text><text x="202" y="952" class="tiny" text-anchor="middle">src IP / port A</text><rect width="185" height="78" x="430" y="895" class="box-green"/><text x="522" y="928" class="label" text-anchor="middle">5G 网络</text><text x="522" y="952" class="tiny" text-anchor="middle">src IP / port B</text><path d="M 300 934 L 425 934" class="line-green"/><text x="362" y="908" class="tiny" text-anchor="middle">地址变化</text><rect width="330" height="96" x="745" y="885" class="box-blue"/><text x="910" y="922" class="label" text-anchor="middle">Destination Connection ID</text><text x="910" y="950" class="tiny" text-anchor="middle">端点用 CID 关联原连接；迁移后做路径验证</text><path d="M 620 934 L 740 934" class="line-blue"/><rect width="230" height="76" x="430" y="1024" class="box-blue"/><text x="545" y="1055" class="label" text-anchor="middle">地址验证</text><text x="545" y="1080" class="tiny" text-anchor="middle">PATH_CHALLENGE / RESPONSE</text><path d="M 910 985 C 805 1000, 650 1015, 545 1022" class="line-blue"/><rect width="250" height="76" x="110" y="1024" class="box-red"/><text x="235" y="1055" class="label" text-anchor="middle">UDP 443 受限</text><text x="235" y="1080" class="tiny" text-anchor="middle">防火墙 / NAT / 运营商策略</text><path d="M 365 1040 C 480 980, 610 980, 695 1040" class="dash-red"/><rect width="375" height="76" x="700" y="1024" class="box-amber"/><text x="888" y="1055" class="label" text-anchor="middle">Alt-Svc 尝试 h3，失败回退 HTTP/2</text><text x="888" y="1080" class="tiny" text-anchor="middle">生产应保留可观测的降级路径</text><rect width="1112" height="62" x="84" y="1170" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" rx="16"/><text x="640" y="1197" class="small" text-anchor="middle">关键边界：0-RTT 有重放风险；Initial 受包保护但不等同已认证机密；未验证地址前服务端受 3 倍反放大限制</text><text x="640" y="1222" class="small" text-anchor="middle">QPACK 替代 HPACK，是为了在 QUIC 乱序 stream 下控制头部压缩引入的队头阻塞</text></svg>