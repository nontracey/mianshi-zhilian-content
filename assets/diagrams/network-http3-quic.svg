<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">HTTP/3 与 QUIC：握手、独立流、迁移与回退</title>
  <desc id="desc">三段式展示 HTTP/3 over QUIC：首次 1-RTT 与受限 0-RTT，QUIC stream 独立重组避免跨流队头阻塞，以及 Connection ID 支持迁移、UDP 不通时回退 HTTP/2。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .panel-title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box-blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 14; }
      .box-green { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 14; }
      .box-amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; rx: 14; }
      .box-red { fill: #fef2f2; stroke: #f87171; stroke-width: 2; rx: 14; }
      .line-blue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .line-green { stroke: #059669; stroke-width: 4; fill: none; marker-end: url(#arrow-green); }
      .line-red { stroke: #dc2626; stroke-width: 4; fill: none; marker-end: url(#arrow-red); }
      .line-gray { stroke: #94a3b8; stroke-width: 3; fill: none; stroke-dasharray: 8 8; }
      .dash-green { stroke: #059669; stroke-width: 4; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow-green); }
      .dash-red { stroke: #dc2626; stroke-width: 4; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="1280"/>
  <text x="640" y="58" text-anchor="middle" font-size="36" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#0f172a">HTTP/3 与 QUIC 的真实链路</text>
  <text x="640" y="92" text-anchor="middle" class="small">HTTP 语义不变；变化在 QUIC 传输：更低握手成本、每流独立可靠交付、迁移与回退</text>

  <rect class="panel" x="60" y="120" width="1160" height="300"/>
  <text class="panel-title" x="92" y="162">1. 握手：1-RTT 新建，0-RTT 只放重放安全早期数据</text>
  <rect class="box-blue" x="100" y="205" width="180" height="72"/>
  <text class="label" x="190" y="235" text-anchor="middle">客户端</text>
  <text class="tiny" x="190" y="260" text-anchor="middle">浏览器 / App</text>
  <rect class="box-blue" x="1000" y="205" width="180" height="72"/>
  <text class="label" x="1090" y="235" text-anchor="middle">服务端</text>
  <text class="tiny" x="1090" y="260" text-anchor="middle">CDN / 网关</text>
  <path class="line-blue" d="M 285 222 C 455 180, 745 180, 995 222"/>
  <text class="small" x="640" y="190" text-anchor="middle">Initial: ClientHello + transport parameters</text>
  <path class="line-blue" d="M 995 260 C 800 315, 520 315, 285 260"/>
  <text class="small" x="640" y="328" text-anchor="middle">Server Initial + Handshake: ServerHello / 证书 / 参数</text>
  <path class="line-green" d="M 285 360 C 470 392, 780 392, 995 360"/>
  <text class="small" x="640" y="390" text-anchor="middle">Finished 后发送 HTTP/3 请求：新连接通常 1-RTT</text>
  <path class="dash-green" d="M 285 305 C 480 250, 780 250, 995 305"/>
  <text class="tiny" x="640" y="254" text-anchor="middle">会话恢复可夹带 0-RTT，但服务端可拒绝，写操作不应放早期数据</text>

  <rect class="panel" x="60" y="455" width="1160" height="320"/>
  <text class="panel-title" x="92" y="497">2. 独立 stream：丢包不再卡住其他请求</text>
  <rect class="box-blue" x="100" y="535" width="210" height="175"/>
  <text class="label" x="205" y="570" text-anchor="middle">一个 QUIC 连接</text>
  <text class="tiny" x="205" y="600" text-anchor="middle">统一拥塞控制</text>
  <text class="tiny" x="205" y="628" text-anchor="middle">Packet Number 不复用</text>
  <text class="tiny" x="205" y="656" text-anchor="middle">TLS 保护大部分载荷</text>
  <rect class="box-red" x="390" y="528" width="720" height="55"/>
  <rect class="box-green" x="390" y="615" width="720" height="55"/>
  <rect class="box-green" x="390" y="688" width="720" height="55"/>
  <text class="label" x="425" y="563">Stream A</text>
  <text class="label" x="425" y="650">Stream B</text>
  <text class="label" x="425" y="723">Stream C</text>
  <path class="line-blue" d="M 520 556 L 710 556"/>
  <rect x="730" y="541" width="54" height="30" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text class="tiny" x="757" y="562" text-anchor="middle" fill="#b91c1c">丢包</text>
  <path class="dash-red" d="M 785 556 C 860 510, 970 510, 1045 548"/>
  <text class="tiny" x="925" y="520" text-anchor="middle" fill="#b91c1c">只重传 A 的缺口</text>
  <path class="line-green" d="M 520 643 L 1045 643"/>
  <path class="line-green" d="M 520 716 L 1045 716"/>
  <text class="small" x="1120" y="648" text-anchor="middle" fill="#047857">继续交付</text>
  <text class="small" x="1120" y="721" text-anchor="middle" fill="#047857">继续交付</text>
  <text class="small" x="640" y="764" text-anchor="middle">HTTP/2 的多个 stream 卡在同一条 TCP 字节流；QUIC 把可靠交付下沉到每个 stream</text>

  <rect class="panel" x="60" y="810" width="1160" height="330"/>
  <text class="panel-title" x="92" y="852">3. 迁移与回退：Connection ID 续连，UDP 不通就降级 h2</text>
  <rect class="box-green" x="110" y="895" width="185" height="78"/>
  <text class="label" x="202" y="928" text-anchor="middle">Wi-Fi 网络</text>
  <text class="tiny" x="202" y="952" text-anchor="middle">src IP / port A</text>
  <rect class="box-green" x="430" y="895" width="185" height="78"/>
  <text class="label" x="522" y="928" text-anchor="middle">5G 网络</text>
  <text class="tiny" x="522" y="952" text-anchor="middle">src IP / port B</text>
  <path class="line-green" d="M 300 934 L 425 934"/>
  <text class="tiny" x="362" y="908" text-anchor="middle">地址变化</text>
  <rect class="box-blue" x="745" y="885" width="330" height="96"/>
  <text class="label" x="910" y="922" text-anchor="middle">Destination Connection ID</text>
  <text class="tiny" x="910" y="950" text-anchor="middle">端点用 CID 关联原连接；迁移后做路径验证</text>
  <path class="line-blue" d="M 620 934 L 740 934"/>
  <rect class="box-blue" x="430" y="1024" width="230" height="76"/>
  <text class="label" x="545" y="1055" text-anchor="middle">地址验证</text>
  <text class="tiny" x="545" y="1080" text-anchor="middle">PATH_CHALLENGE / RESPONSE</text>
  <path class="line-blue" d="M 910 985 C 805 1000, 650 1015, 545 1022"/>
  <rect class="box-red" x="110" y="1024" width="250" height="76"/>
  <text class="label" x="235" y="1055" text-anchor="middle">UDP 443 受限</text>
  <text class="tiny" x="235" y="1080" text-anchor="middle">防火墙 / NAT / 运营商策略</text>
  <path class="dash-red" d="M 365 1040 C 480 980, 610 980, 695 1040"/>
  <rect class="box-amber" x="700" y="1024" width="375" height="76"/>
  <text class="label" x="888" y="1055" text-anchor="middle">Alt-Svc 尝试 h3，失败回退 HTTP/2</text>
  <text class="tiny" x="888" y="1080" text-anchor="middle">生产应保留可观测的降级路径</text>

  <rect x="84" y="1170" width="1112" height="62" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text class="small" x="640" y="1197" text-anchor="middle">关键边界：0-RTT 有重放风险；Initial 受包保护但不等同已认证机密；未验证地址前服务端受 3 倍反放大限制</text>
  <text class="small" x="640" y="1222" text-anchor="middle">QPACK 替代 HPACK，是为了在 QUIC 乱序 stream 下控制头部压缩引入的队头阻塞</text>
</svg>
