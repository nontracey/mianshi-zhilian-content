<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">System call path across user mode and kernel mode</title>
  <desc id="desc">A topic-specific diagram showing how a user-space function enters the kernel through a syscall instruction, how the kernel dispatches and validates the request, where cost comes from, how batching and vDSO/io_uring reduce syscall overhead, and how to observe the issue.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .band-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .lane-label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .box-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .box-text { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .note-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .note-text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .chip { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .user-fill { fill: #dbeafe; stroke: #60a5fa; }
      .kernel-fill { fill: #ffedd5; stroke: #fb923c; }
      .dispatch-fill { fill: #fef3c7; stroke: #f59e0b; }
      .safe-fill { fill: #dcfce7; stroke: #22c55e; }
      .risk-fill { fill: #fee2e2; stroke: #ef4444; }
      .observe-fill { fill: #e0f2fe; stroke: #38bdf8; }
      .plain-box { fill: #ffffff; stroke: #cbd5e1; }
      .boundary { stroke: #334155; stroke-width: 2.5; stroke-dasharray: 9 8; }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-orange { stroke: #ea580c; stroke-width: 3; fill: none; marker-end: url(#arrow-orange); }
      .arrow-green { stroke: #15803d; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .thin { stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1320" height="1320"/>
  <text class="title" x="70" y="64">系统调用不是普通函数调用：受控入口、成本来源与优化边界</text>
  <text class="subtitle" x="70" y="96">以 Linux/x86-64 为主线；其他架构入口指令不同，但“用户态受限、内核态代办、返回错误码”的语义一致。</text>

  <rect x="70" y="125" width="800" height="330" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="lane-label" x="96" y="158">User mode / ring3：应用、libc、用户缓冲区</text>
  <rect class="user-fill" x="100" y="190" width="160" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="123" y="222">业务代码</text>
  <text class="mono" x="122" y="247">read(fd, buf, n)</text>
  <text class="small" x="122" y="268">普通函数入口</text>

  <rect class="plain-box" x="310" y="190" width="170" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="339" y="222">libc wrapper</text>
  <text class="small" x="336" y="247">填调用号和参数</text>
  <text class="mono" x="336" y="268">rax, rdi, rsi...</text>

  <rect class="dispatch-fill" x="535" y="190" width="175" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="562" y="222">CPU 入口</text>
  <text class="mono" x="560" y="247">syscall/sysenter</text>
  <text class="small" x="560" y="268">旧 x86 可见 int 0x80</text>

  <rect class="safe-fill" x="150" y="326" width="255" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="176" y="356">不需要陷入的快路径</text>
  <text class="small" x="176" y="380">vDSO 可让部分 clock/getcpu</text>
  <text class="small" x="176" y="399">在用户态完成，失败再 fallback</text>

  <path class="arrow-blue" d="M260 233 H302"/>
  <path class="arrow-blue" d="M480 233 H526"/>
  <path class="arrow-green thin" d="M405 365 C480 365 500 330 535 270"/>

  <line class="boundary" x1="70" y1="500" x2="870" y2="500"/>
  <rect x="356" y="476" width="230" height="48" rx="24" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text class="chip" x="390" y="505">特权级边界：参数可信性在这里重新检查</text>

  <rect x="70" y="545" width="800" height="340" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text class="lane-label" x="96" y="578">Kernel mode / ring0：系统调用表、内核对象、驱动和调度器</text>

  <rect class="kernel-fill" x="110" y="615" width="165" height="90" rx="12" stroke-width="2"/>
  <text class="box-title" x="137" y="647">入口汇编</text>
  <text class="small" x="134" y="672">切到内核栈</text>
  <text class="small" x="134" y="692">保存必要现场</text>

  <rect class="dispatch-fill" x="322" y="615" width="175" height="90" rx="12" stroke-width="2"/>
  <text class="box-title" x="348" y="647">syscall table</text>
  <text class="small" x="348" y="672">按调用号分发</text>
  <text class="mono" x="348" y="693">__x64_sys_read</text>

  <rect class="risk-fill" x="545" y="615" width="178" height="90" rx="12" stroke-width="2"/>
  <text class="box-title" x="571" y="647">边界校验</text>
  <text class="small" x="570" y="672">fd/权限/地址范围</text>
  <text class="mono" x="570" y="693">copy_from_user()</text>

  <rect class="kernel-fill" x="110" y="765" width="205" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="137" y="796">执行内核工作</text>
  <text class="small" x="137" y="820">VFS / socket / driver / scheduler</text>

  <rect class="risk-fill" x="370" y="765" width="190" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="396" y="796">可能阻塞</text>
  <text class="small" x="396" y="820">等待 IO、锁、内存或信号</text>

  <rect class="safe-fill" x="615" y="765" width="200" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="641" y="796">返回用户态</text>
  <text class="small" x="641" y="820">结果或 -errno，libc 转 errno</text>

  <path class="arrow-orange" d="M622 276 C622 380 192 400 192 606"/>
  <path class="arrow-orange" d="M275 660 H314"/>
  <path class="arrow-orange" d="M497 660 H536"/>
  <path class="arrow-orange" d="M634 705 C634 742 320 735 257 764"/>
  <path class="arrow-orange" d="M315 804 H361"/>
  <path class="arrow-orange" d="M560 804 H606"/>
  <path class="arrow-blue" d="M715 765 C765 700 765 610 710 520 C680 468 650 433 635 282"/>

  <rect class="plain-box" x="920" y="125" width="330" height="235" rx="16" stroke-width="2"/>
  <text class="note-title" x="946" y="160">开销从哪里来</text>
  <text class="note-text" x="946" y="191">1. 用户栈/内核栈和寄存器切换</text>
  <text class="note-text" x="946" y="216">2. 入口校验、权限检查和 copy_user</text>
  <text class="note-text" x="946" y="241">3. 分支预测、流水线、缓存扰动</text>
  <text class="note-text" x="946" y="266">4. 安全缓解可能增加入口成本</text>
  <text class="note-text" x="946" y="291">5. 只有阻塞/被抢占时才发生调度切换</text>
  <text class="note-text" x="946" y="326">结论：远贵于函数调用，但别把它等同</text>
  <text class="note-text" x="946" y="346">于一次进程地址空间切换。</text>

  <rect class="observe-fill" x="920" y="390" width="330" height="220" rx="16" stroke-width="2"/>
  <text class="note-title" x="946" y="425">怎么验证不是拍脑袋</text>
  <text class="mono" x="946" y="457">strace -c -T -p PID</text>
  <text class="note-text" x="946" y="480">看调用次数、总耗时、慢调用</text>
  <text class="mono" x="946" y="510">perf trace / perf top</text>
  <text class="note-text" x="946" y="533">看 syscall 热点和内核栈</text>
  <text class="mono" x="946" y="563">eBPF / latency histogram</text>
  <text class="note-text" x="946" y="586">看 P99、阻塞点和参数分布</text>

  <rect class="safe-fill" x="920" y="640" width="330" height="360" rx="16" stroke-width="2"/>
  <text class="note-title" x="946" y="675">减少开销的四类手段</text>
  <text class="note-text" x="946" y="707">批量：readv/writev、sendmmsg、</text>
  <text class="note-text" x="946" y="729">recvmmsg、epoll_wait 多事件返回</text>
  <text class="note-text" x="946" y="764">缓冲：stdio / 应用 buffer 合并小写</text>
  <text class="note-text" x="946" y="799">绕过陷入：vDSO 是快路径，不是承诺</text>
  <text class="note-text" x="946" y="821">所有 clock 调用都零陷入</text>
  <text class="note-text" x="946" y="856">共享队列：io_uring SQ/CQ 批量提交</text>
  <text class="note-text" x="946" y="878">和收割；SQPOLL 可进一步少进内核</text>
  <text class="note-text" x="946" y="913">绕内核：mmap、共享内存、DPDK 适合</text>
  <text class="note-text" x="946" y="935">极端低延迟，但牺牲通用性和运维简洁性</text>
  <text class="note-text" x="946" y="970">工程目标：减少高频小 syscall，而不是</text>
  <text class="note-text" x="946" y="990">追求“完全没有 syscall”。</text>

  <rect class="plain-box" x="70" y="930" width="800" height="290" rx="16" stroke-width="2"/>
  <text class="band-title" x="96" y="967">批处理为什么有效：同样 5 段数据，入口次数不同</text>

  <text class="box-title" x="105" y="1012">多次小写</text>
  <rect x="105" y="1030" width="54" height="44" rx="9" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text class="mono" x="121" y="1058">8B</text>
  <rect x="170" y="1030" width="54" height="44" rx="9" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text class="mono" x="186" y="1058">8B</text>
  <rect x="235" y="1030" width="54" height="44" rx="9" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text class="mono" x="251" y="1058">8B</text>
  <rect x="300" y="1030" width="54" height="44" rx="9" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text class="mono" x="316" y="1058">8B</text>
  <rect x="365" y="1030" width="54" height="44" rx="9" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text class="mono" x="381" y="1058">8B</text>
  <path class="arrow-orange thin" d="M440 1052 H515"/>
  <rect class="risk-fill" x="535" y="1026" width="270" height="56" rx="12" stroke-width="2"/>
  <text class="box-title" x="557" y="1050">5 次 write() 入口</text>
  <text class="small" x="557" y="1070">每次都要边界校验和返回</text>

  <text class="box-title" x="105" y="1135">聚合后写</text>
  <rect x="105" y="1152" width="315" height="46" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text class="mono" x="125" y="1181">iovec[5] / merged buffer = 40B</text>
  <path class="arrow-green thin" d="M440 1175 H515"/>
  <rect class="safe-fill" x="535" y="1148" width="270" height="56" rx="12" stroke-width="2"/>
  <text class="box-title" x="557" y="1172">1 次 writev()/write()</text>
  <text class="small" x="557" y="1192">吞吐常更好，尾延迟要实测</text>

  <text class="small" x="96" y="1260">面试抓手：先说隔离目的，再画入口流程；再用“次数、单次成本、阻塞概率、可观测证据”评价优化是否成立。</text>
</svg>
