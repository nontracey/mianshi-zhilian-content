<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">System call path across user mode and kernel mode</title><desc id="desc">A topic-specific diagram showing how a user-space function enters the kernel through a syscall instruction, how the kernel dispatches and validates the request, where cost comes from, how batching and vDSO/io_uring reduce syscall overhead, and how to observe the issue.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-orange" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#ea580c" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#15803d" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.band-title{font:700 20px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.lane-label{font:700 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.box-title{font:700 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.small{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.note-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.note-text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.chip{font:700 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.user-fill{fill:#dbeafe;stroke:#60a5fa}.kernel-fill{fill:#ffedd5;stroke:#fb923c}.dispatch-fill{fill:#fef3c7;stroke:#f59e0b}.safe-fill{fill:#dcfce7;stroke:#22c55e}.risk-fill{fill:#fee2e2;stroke:#ef4444}.observe-fill{fill:#e0f2fe;stroke:#38bdf8}.plain-box{fill:#fff;stroke:#cbd5e1}.boundary{stroke:#334155;stroke-width:2.5;stroke-dasharray:9 8}.arrow-blue{stroke:#2563eb;marker-end:url(#arrow-blue)}.arrow-blue,.arrow-green,.arrow-orange{stroke-width:3;fill:none}.arrow-orange{stroke:#ea580c;marker-end:url(#arrow-orange)}.arrow-green{stroke:#15803d;marker-end:url(#arrow-green)}.thin{stroke-width:2}</style></defs><rect width="1320" height="1320" x="0" y="0" class="bg"/><text x="70" y="64" class="title">系统调用不是普通函数调用：受控入口、成本来源与优化边界</text><text x="70" y="96" class="subtitle">以 Linux/x86-64 为主线；其他架构入口指令不同，但“用户态受限、内核态代办、返回错误码”的语义一致。</text><rect width="800" height="330" x="70" y="125" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" rx="16"/><text x="96" y="158" class="lane-label">User mode / ring3：应用、libc、用户缓冲区</text><rect width="160" height="86" x="100" y="190" stroke-width="2" class="user-fill" rx="12"/><text x="123" y="222" class="box-title">业务代码</text><text x="122" y="247" class="mono">read(fd, buf, n)</text><text x="122" y="268" class="small">普通函数入口</text><rect width="170" height="86" x="310" y="190" stroke-width="2" class="plain-box" rx="12"/><text x="339" y="222" class="box-title">libc wrapper</text><text x="336" y="247" class="small">填调用号和参数</text><text x="336" y="268" class="mono">rax, rdi, rsi...</text><rect width="175" height="86" x="535" y="190" stroke-width="2" class="dispatch-fill" rx="12"/><text x="562" y="222" class="box-title">CPU 入口</text><text x="560" y="247" class="mono">syscall/sysenter</text><text x="560" y="268" class="small">旧 x86 可见 int 0x80</text><rect width="255" height="78" x="150" y="326" stroke-width="2" class="safe-fill" rx="12"/><text x="176" y="356" class="box-title">不需要陷入的快路径</text><text x="176" y="380" class="small">vDSO 可让部分 clock/getcpu</text><text x="176" y="399" class="small">在用户态完成，失败再 fallback</text><path d="M260 233 H302" class="arrow-blue"/><path d="M480 233 H526" class="arrow-blue"/><path d="M405 365 C480 365 500 330 535 270" class="arrow-green thin"/><line x1="70" x2="870" y1="500" y2="500" class="boundary"/><rect width="230" height="48" x="356" y="476" fill="#fff" stroke="#64748b" stroke-width="2" rx="24"/><text x="390" y="505" class="chip">特权级边界：参数可信性在这里重新检查</text><rect width="800" height="340" x="70" y="545" fill="#fff7ed" stroke="#fdba74" stroke-width="2" rx="16"/><text x="96" y="578" class="lane-label">Kernel mode / ring0：系统调用表、内核对象、驱动和调度器</text><rect width="165" height="90" x="110" y="615" stroke-width="2" class="kernel-fill" rx="12"/><text x="137" y="647" class="box-title">入口汇编</text><text x="134" y="672" class="small">切到内核栈</text><text x="134" y="692" class="small">保存必要现场</text><rect width="175" height="90" x="322" y="615" stroke-width="2" class="dispatch-fill" rx="12"/><text x="348" y="647" class="box-title">syscall table</text><text x="348" y="672" class="small">按调用号分发</text><text x="348" y="693" class="mono">__x64_sys_read</text><rect width="178" height="90" x="545" y="615" stroke-width="2" class="risk-fill" rx="12"/><text x="571" y="647" class="box-title">边界校验</text><text x="570" y="672" class="small">fd/权限/地址范围</text><text x="570" y="693" class="mono">copy_from_user()</text><rect width="205" height="78" x="110" y="765" stroke-width="2" class="kernel-fill" rx="12"/><text x="137" y="796" class="box-title">执行内核工作</text><text x="137" y="820" class="small">VFS / socket / driver / scheduler</text><rect width="190" height="78" x="370" y="765" stroke-width="2" class="risk-fill" rx="12"/><text x="396" y="796" class="box-title">可能阻塞</text><text x="396" y="820" class="small">等待 IO、锁、内存或信号</text><rect width="200" height="78" x="615" y="765" stroke-width="2" class="safe-fill" rx="12"/><text x="641" y="796" class="box-title">返回用户态</text><text x="641" y="820" class="small">结果或 -errno，libc 转 errno</text><path d="M622 276 C622 380 192 400 192 606" class="arrow-orange"/><path d="M275 660 H314" class="arrow-orange"/><path d="M497 660 H536" class="arrow-orange"/><path d="M634 705 C634 742 320 735 257 764" class="arrow-orange"/><path d="M315 804 H361" class="arrow-orange"/><path d="M560 804 H606" class="arrow-orange"/><path d="M715 765 C765 700 765 610 710 520 C680 468 650 433 635 282" class="arrow-blue"/><rect width="330" height="235" x="920" y="125" stroke-width="2" class="plain-box" rx="16"/><text x="946" y="160" class="note-title">开销从哪里来</text><text x="946" y="191" class="note-text">1. 用户栈/内核栈和寄存器切换</text><text x="946" y="216" class="note-text">2. 入口校验、权限检查和 copy_user</text><text x="946" y="241" class="note-text">3. 分支预测、流水线、缓存扰动</text><text x="946" y="266" class="note-text">4. 安全缓解可能增加入口成本</text><text x="946" y="291" class="note-text">5. 只有阻塞/被抢占时才发生调度切换</text><text x="946" y="326" class="note-text">结论：远贵于函数调用，但别把它等同</text><text x="946" y="346" class="note-text">于一次进程地址空间切换。</text><rect width="330" height="220" x="920" y="390" stroke-width="2" class="observe-fill" rx="16"/><text x="946" y="425" class="note-title">怎么验证不是拍脑袋</text><text x="946" y="457" class="mono">strace -c -T -p PID</text><text x="946" y="480" class="note-text">看调用次数、总耗时、慢调用</text><text x="946" y="510" class="mono">perf trace / perf top</text><text x="946" y="533" class="note-text">看 syscall 热点和内核栈</text><text x="946" y="563" class="mono">eBPF / latency histogram</text><text x="946" y="586" class="note-text">看 P99、阻塞点和参数分布</text><rect width="330" height="360" x="920" y="640" stroke-width="2" class="safe-fill" rx="16"/><text x="946" y="675" class="note-title">减少开销的四类手段</text><text x="946" y="707" class="note-text">批量：readv/writev、sendmmsg、</text><text x="946" y="729" class="note-text">recvmmsg、epoll_wait 多事件返回</text><text x="946" y="764" class="note-text">缓冲：stdio / 应用 buffer 合并小写</text><text x="946" y="799" class="note-text">绕过陷入：vDSO 是快路径，不是承诺</text><text x="946" y="821" class="note-text">所有 clock 调用都零陷入</text><text x="946" y="856" class="note-text">共享队列：io_uring SQ/CQ 批量提交</text><text x="946" y="878" class="note-text">和收割；SQPOLL 可进一步少进内核</text><text x="946" y="913" class="note-text">绕内核：mmap、共享内存、DPDK 适合</text><text x="946" y="935" class="note-text">极端低延迟，但牺牲通用性和运维简洁性</text><text x="946" y="970" class="note-text">工程目标：减少高频小 syscall，而不是</text><text x="946" y="990" class="note-text">追求“完全没有 syscall”。</text><rect width="800" height="290" x="70" y="930" stroke-width="2" class="plain-box" rx="16"/><text x="96" y="967" class="band-title">批处理为什么有效：同样 5 段数据，入口次数不同</text><text x="105" y="1012" class="box-title">多次小写</text><rect width="54" height="44" x="105" y="1030" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" rx="9"/><text x="121" y="1058" class="mono">8B</text><rect width="54" height="44" x="170" y="1030" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" rx="9"/><text x="186" y="1058" class="mono">8B</text><rect width="54" height="44" x="235" y="1030" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" rx="9"/><text x="251" y="1058" class="mono">8B</text><rect width="54" height="44" x="300" y="1030" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" rx="9"/><text x="316" y="1058" class="mono">8B</text><rect width="54" height="44" x="365" y="1030" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" rx="9"/><text x="381" y="1058" class="mono">8B</text><path d="M440 1052 H515" class="arrow-orange thin"/><rect width="270" height="56" x="535" y="1026" stroke-width="2" class="risk-fill" rx="12"/><text x="557" y="1050" class="box-title">5 次 write() 入口</text><text x="557" y="1070" class="small">每次都要边界校验和返回</text><text x="105" y="1135" class="box-title">聚合后写</text><rect width="315" height="46" x="105" y="1152" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="10"/><text x="125" y="1181" class="mono">iovec[5] / merged buffer = 40B</text><path d="M440 1175 H515" class="arrow-green thin"/><rect width="270" height="56" x="535" y="1148" stroke-width="2" class="safe-fill" rx="12"/><text x="557" y="1172" class="box-title">1 次 writev()/write()</text><text x="557" y="1192" class="small">吞吐常更好，尾延迟要实测</text><text x="96" y="1260" class="small">面试抓手：先说隔离目的，再画入口流程；再用“次数、单次成本、阻塞概率、可观测证据”评价优化是否成立。</text></svg>