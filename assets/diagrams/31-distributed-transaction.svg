<svg width="100%" aria-label="分布式事务方案选型图" role="img" viewBox="0 0 680 380"><title>分布式事务方案选型图</title><desc>四种分布式事务方案的对比与选型</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="340" y="28" fill="#042C53" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">分布式事务方案选型</text><text x="340" y="48" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">根据业务场景选择合适方案</text><rect width="140" height="90" x="40" y="64" fill="#E6F1FB" stroke="#378ADD" stroke-width=".5" rx="10"/><text x="110" y="88" fill="#042C53" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">2PC / 3PC</text><text x="110" y="108" fill="#0F6E56" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">强一致</text><text x="110" y="124" fill="#993C1D" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">性能差，阻塞</text><text x="110" y="140" fill="#888780" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">XA标准，数据库支持</text><rect width="140" height="90" x="190" y="64" fill="#EEEDFE" stroke="#7F77DD" stroke-width=".5" rx="10"/><text x="260" y="88" fill="#26215C" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">TCC</text><text x="260" y="108" fill="#0F6E56" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">灵活，高并发</text><text x="260" y="124" fill="#993C1D" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">侵入性强</text><text x="260" y="140" fill="#888780" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">Try-Confirm-Cancel</text><rect width="140" height="90" x="340" y="64" fill="#FAEEDA" stroke="#BA7517" stroke-width=".5" rx="10"/><text x="410" y="88" fill="#412402" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Saga</text><text x="410" y="108" fill="#0F6E56" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">长事务，无锁</text><text x="410" y="124" fill="#993C1D" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">补偿逻辑复杂</text><text x="410" y="140" fill="#888780" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">正向+补偿操作</text><rect width="150" height="90" x="490" y="64" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".5" rx="10"/><text x="565" y="88" fill="#04342C" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">本地消息表</text><text x="565" y="108" fill="#0F6E56" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">最终一致</text><text x="565" y="124" fill="#993C1D" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">实时性低</text><text x="565" y="140" fill="#888780" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">实现简单可靠</text><rect width="560" height="80" x="60" y="176" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="10"/><text x="340" y="198" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Seata 框架</text><text x="340" y="218" fill="#444441" font-family="system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">AT模式: 自动补偿，业务无侵入 (推荐)</text><text x="340" y="236" fill="#444441" font-family="system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">TCC模式: 手动编写Try/Confirm/Cancel</text><text x="340" y="250" fill="#888780" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">Saga模式: 长流程业务，状态机驱动</text><rect width="560" height="80" x="60" y="276" fill="#E6F1FB" stroke="#378ADD" stroke-width=".5" rx="10"/><text x="340" y="298" fill="#042C53" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">选型建议</text><text x="340" y="318" fill="#444441" font-family="system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">强一致 + 低并发: 2PC | 高并发 + 有预算: TCC</text><text x="340" y="338" fill="#444441" font-family="system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">长流程: Saga | 简单场景 + 低成本: 本地消息表</text><text x="340" y="352" fill="#888780" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">大多数场景推荐Seata AT模式，零侵入</text></svg>