<svg viewBox="0 0 680 380" width="100%" role="img" aria-label="分布式事务方案选型图">
<title>分布式事务方案选型图</title><desc>四种分布式事务方案的对比与选型</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="28" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">分布式事务方案选型</text>
<text x="340" y="48" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">根据业务场景选择合适方案</text>
<rect x="40" y="64" width="140" height="90" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="110" y="88" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">2PC / 3PC</text>
<text x="110" y="108" text-anchor="middle" font-size="11" font-weight="400" fill="#0F6E56" font-family="system-ui, sans-serif">强一致</text>
<text x="110" y="124" text-anchor="middle" font-size="11" font-weight="400" fill="#993C1D" font-family="system-ui, sans-serif">性能差，阻塞</text>
<text x="110" y="140" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">XA标准，数据库支持</text>
<rect x="190" y="64" width="140" height="90" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="260" y="88" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C" font-family="system-ui, sans-serif">TCC</text>
<text x="260" y="108" text-anchor="middle" font-size="11" font-weight="400" fill="#0F6E56" font-family="system-ui, sans-serif">灵活，高并发</text>
<text x="260" y="124" text-anchor="middle" font-size="11" font-weight="400" fill="#993C1D" font-family="system-ui, sans-serif">侵入性强</text>
<text x="260" y="140" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">Try-Confirm-Cancel</text>
<rect x="340" y="64" width="140" height="90" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="410" y="88" text-anchor="middle" font-size="14" font-weight="500" fill="#412402" font-family="system-ui, sans-serif">Saga</text>
<text x="410" y="108" text-anchor="middle" font-size="11" font-weight="400" fill="#0F6E56" font-family="system-ui, sans-serif">长事务，无锁</text>
<text x="410" y="124" text-anchor="middle" font-size="11" font-weight="400" fill="#993C1D" font-family="system-ui, sans-serif">补偿逻辑复杂</text>
<text x="410" y="140" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">正向+补偿操作</text>
<rect x="490" y="64" width="150" height="90" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="565" y="88" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C" font-family="system-ui, sans-serif">本地消息表</text>
<text x="565" y="108" text-anchor="middle" font-size="11" font-weight="400" fill="#0F6E56" font-family="system-ui, sans-serif">最终一致</text>
<text x="565" y="124" text-anchor="middle" font-size="11" font-weight="400" fill="#993C1D" font-family="system-ui, sans-serif">实时性低</text>
<text x="565" y="140" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">实现简单可靠</text>
<rect x="60" y="176" width="560" height="80" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="198" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">Seata 框架</text>
<text x="340" y="218" text-anchor="middle" font-size="12" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">AT模式: 自动补偿，业务无侵入 (推荐)</text>
<text x="340" y="236" text-anchor="middle" font-size="12" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">TCC模式: 手动编写Try/Confirm/Cancel</text>
<text x="340" y="250" text-anchor="middle" font-size="11" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">Saga模式: 长流程业务，状态机驱动</text>
<rect x="60" y="276" width="560" height="80" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="340" y="298" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">选型建议</text>
<text x="340" y="318" text-anchor="middle" font-size="12" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">强一致 + 低并发: 2PC | 高并发 + 有预算: TCC</text>
<text x="340" y="338" text-anchor="middle" font-size="12" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">长流程: Saga | 简单场景 + 低成本: 本地消息表</text>
<text x="340" y="352" text-anchor="middle" font-size="11" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">大多数场景推荐Seata AT模式，零侵入</text>
</svg>