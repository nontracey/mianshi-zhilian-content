<svg width="100%" aria-label="动态规划状态转移图" role="img" viewBox="0 0 680 296"><title>动态规划状态转移图</title><desc>以爬楼梯为例展示DP核心思路</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="340" y="24" fill="#042C53" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">动态规划思路</text><text x="340" y="44" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">爬楼梯: dp[i] = dp[i-1] + dp[i-2]</text><rect width="520" height="40" x="80" y="64" fill="#E6F1FB" stroke="#378ADD" stroke-width=".5" rx="8"/><text x="340" y="88" fill="#042C53" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">i: 0 1 2 3 4 5</text><rect width="520" height="40" x="80" y="110" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".5" rx="8"/><text x="340" y="134" fill="#04342C" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">dp: 1 1 2 3 5 8</text><text x="340" y="174" fill="#042C53" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">dp[5] = dp[4] + dp[3] = 5 + 3 = 8</text><rect width="560" height="80" x="60" y="196" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="10"/><text x="340" y="216" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">DP三要素</text><text x="180" y="240" fill="#378ADD" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">1. 定义状态</text><text x="180" y="258" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">dp[i]的含义</text><text x="340" y="240" fill="#1D9E75" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">2. 转移方程</text><text x="340" y="258" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">dp[i]与dp[i-1]关系</text><text x="500" y="240" fill="#BA7517" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">3. 初始条件</text><text x="500" y="258" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">dp[0], dp[1]的值</text></svg>