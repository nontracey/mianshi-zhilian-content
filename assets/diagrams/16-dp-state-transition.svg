<svg viewBox="0 0 680 296" width="100%" role="img" aria-label="动态规划状态转移图">
<title>动态规划状态转移图</title><desc>以爬楼梯为例展示DP核心思路</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">动态规划思路</text>
<text x="340" y="44" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">爬楼梯: dp[i] = dp[i-1] + dp[i-2]</text>
<rect x="80" y="64" width="520" height="40" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="340" y="88" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">i:    0    1    2    3    4    5</text>
<rect x="80" y="110" width="520" height="40" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="134" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C" font-family="system-ui, sans-serif">dp:   1    1    2    3    5    8</text>
<text x="340" y="174" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">dp[5] = dp[4] + dp[3] = 5 + 3 = 8</text>
<rect x="60" y="196" width="560" height="80" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="216" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">DP三要素</text>
<text x="180" y="240" text-anchor="middle" font-size="12" font-weight="500" fill="#378ADD" font-family="system-ui, sans-serif">1. 定义状态</text>
<text x="180" y="258" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">dp[i]的含义</text>
<text x="340" y="240" text-anchor="middle" font-size="12" font-weight="500" fill="#1D9E75" font-family="system-ui, sans-serif">2. 转移方程</text>
<text x="340" y="258" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">dp[i]与dp[i-1]关系</text>
<text x="500" y="240" text-anchor="middle" font-size="12" font-weight="500" fill="#BA7517" font-family="system-ui, sans-serif">3. 初始条件</text>
<text x="500" y="258" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">dp[0], dp[1]的值</text>
</svg>