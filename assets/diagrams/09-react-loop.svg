<svg viewBox="0 0 680 385" width="100%" role="img" aria-label="ReAct循环示意图">
<title>ReAct循环示意图</title><desc>Reasoning+Acting的Agent决策循环</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">ReAct 循环</text>
<text x="340" y="44" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">Reasoning + Acting</text>
<rect x="120" y="70" width="140" height="50" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="190" y="92" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Thought</text>
<text x="190" y="110" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">推理思考</text>
<line x1="260" y1="95" x2="300" y2="95" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="300" y="70" width="140" height="50" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="370" y="92" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Action</text>
<text x="370" y="110" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">执行工具</text>
<line x1="440" y1="95" x2="480" y2="95" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="480" y="70" width="140" height="50" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="550" y="92" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Observation</text>
<text x="550" y="110" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">观察结果</text>
<path d="M460 120 Q520 120 520 160 Q520 200 460 200" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<path d="M120 120 Q60 120 60 160 Q60 200 120 200" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="230" y="210" width="220" height="40" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="340" y="231" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Final Answer</text>
<rect x="80" y="274" width="520" height="90" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="294" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">核心逻辑</text>
<text x="340" y="314" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">for step in range(max_steps):</text>
<text x="340" y="330" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">  thought, action = llm.generate(history)</text>
<text x="340" y="346" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">  if action == "Final Answer": return thought</text>
<text x="340" y="358" text-anchor="middle" font-size="11" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">  observation = execute_tool(action)</text>
</svg>