ext-anchor="middle">观察结果</text><path fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)" d="M460 120 Q520 120 520 160 Q520 200 460 200"/><path fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)" d="M120 120 Q60 120 60 160 Q60 200 120 200"/><rect width="220" height="40" x="230" y="210" fill="#FAEEDA" stroke="#BA7517" stroke-width=".5" rx="8"/><text x="340" y="231" fill="#042C53" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Final Answer</text><rect width="520" height="90" x="80" y="274" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="10"/><text x="340" y="294" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">核心逻辑</text><text x="340" y="314" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">for step in range(max_steps):</text><text x="340" y="330" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">thought, action = llm.generate(history)</text><text x="340" y="346" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">if action == &quot;Final Answer&quot;: return thought</text><text x="340" y="358" fill="#888780" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">observation = execute_tool(action)</text></svg>