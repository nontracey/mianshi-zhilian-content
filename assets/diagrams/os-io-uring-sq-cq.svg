<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">io_uring 的 SQ/CQ 双环生命周期</title>
  <desc id="desc">展示用户态如何填写 SQE、发布 SQ tail，通过 io_uring_enter 或 SQPOLL 让内核执行操作，内核写回 CQE 后应用收割 CQ，并检查 res、CQ overflow、固定资源和安全限制。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .h2 { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 700 15px "SFMono-Regular", Consolas, monospace; fill: #0f172a; }
      .user { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 8; }
      .kernel { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 8; }
      .cq { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 8; }
      .warn { fill: #fef2f2; stroke: #f87171; stroke-width: 2; rx: 8; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .ring { fill: none; stroke-width: 18; }
      .sqRing { stroke: #60a5fa; }
      .cqRing { stroke: #34d399; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .orangeArrow { stroke: #ea580c; stroke-width: 3; fill: none; marker-end: url(#orangeArrow); }
      .greenArrow { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#greenArrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ea580c"/>
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="660" y="55" text-anchor="middle">io_uring：提交的是操作，收割的是完成结果</text>
  <text class="subtitle" x="660" y="88" text-anchor="middle">SQE/SQ 负责发布请求，CQE/CQ 负责返回 res；完成不等于成功</text>

  <rect class="panel" x="58" y="120" width="1204" height="700"/>
  <text class="h2" x="90" y="162">1. 一次请求从 SQE 到 CQE 的真实链路</text>

  <rect class="user" x="92" y="205" width="270" height="150"/>
  <text class="label" x="227" y="236" text-anchor="middle">用户态准备 SQE</text>
  <text class="mono" x="227" y="266" text-anchor="middle">opcode / fd / buf</text>
  <text class="mono" x="227" y="292" text-anchor="middle">offset / flags</text>
  <text class="mono" x="227" y="318" text-anchor="middle">user_data</text>
  <path class="arrow" d="M365 280 H435"/>

  <circle class="ring sqRing" cx="535" cy="280" r="72"/>
  <text class="label" x="535" y="270" text-anchor="middle">SQ</text>
  <text class="tiny" x="535" y="296" text-anchor="middle">tail 发布</text>
  <path class="arrow" d="M610 280 H690"/>

  <rect class="gray" x="700" y="210" width="250" height="140"/>
  <text class="label" x="825" y="240" text-anchor="middle">提交方式</text>
  <text class="text" x="825" y="270" text-anchor="middle">普通：io_uring_enter</text>
  <text class="text" x="825" y="298" text-anchor="middle">SQPOLL：内核线程轮询 SQ</text>
  <text class="tiny" x="825" y="324" text-anchor="middle">版本/权限/CPU 代价要核验</text>
  <path class="orangeArrow" d="M954 280 H1026"/>

  <rect class="kernel" x="1035" y="205" width="170" height="150"/>
  <text class="label" x="1120" y="244" text-anchor="middle">内核执行</text>
  <text class="text" x="1120" y="273" text-anchor="middle">read/write</text>
  <text class="text" x="1120" y="299" text-anchor="middle">accept/fsync</text>
  <text class="text" x="1120" y="325" text-anchor="middle">timeout/cancel</text>

  <path class="greenArrow" d="M1120 360 C1120 450 955 475 850 475"/>
  <circle class="ring cqRing" cx="755" cy="475" r="72"/>
  <text class="label" x="755" y="463" text-anchor="middle">CQ</text>
  <text class="tiny" x="755" y="489" text-anchor="middle">CQE 写回</text>

  <rect class="cq" x="420" y="405" width="230" height="140"/>
  <text class="label" x="535" y="438" text-anchor="middle">CQE 内容</text>
  <text class="mono" x="535" y="468" text-anchor="middle">user_data</text>
  <text class="mono" x="535" y="494" text-anchor="middle">res = bytes</text>
  <text class="mono" x="535" y="520" text-anchor="middle">res = -errno</text>
  <path class="greenArrow" d="M682 475 H654"/>

  <path class="greenArrow" d="M417 475 H360"/>
  <rect class="user" x="92" y="405" width="270" height="140"/>
  <text class="label" x="227" y="438" text-anchor="middle">应用收割 CQ</text>
  <text class="text" x="227" y="468" text-anchor="middle">按 user_data 找请求</text>
  <text class="text" x="227" y="494" text-anchor="middle">检查 res：成功/短读/负 errno</text>
  <text class="text" x="227" y="520" text-anchor="middle">推进业务状态机或重试</text>

  <rect class="warn" x="92" y="600" width="350" height="120"/>
  <text class="label" x="267" y="633" text-anchor="middle">CQ 收割慢</text>
  <text class="text" x="267" y="663" text-anchor="middle">CQ backlog 增长，可能 overflow</text>
  <text class="text" x="267" y="691" text-anchor="middle">延迟尖刺、提交反压、错误处理复杂化</text>
  <rect class="warn" x="485" y="600" width="330" height="120"/>
  <text class="label" x="650" y="633" text-anchor="middle">固定资源不是免费</text>
  <text class="text" x="650" y="663" text-anchor="middle">fixed files 减 fdget；fixed buffers 减 pin</text>
  <text class="text" x="650" y="691" text-anchor="middle">代价是生命周期、pinned memory、NUMA</text>
  <rect class="warn" x="858" y="600" width="350" height="120"/>
  <text class="label" x="1033" y="633" text-anchor="middle">多线程 ring 所有权</text>
  <text class="text" x="1033" y="663" text-anchor="middle">SQE 分配、tail 发布、CQ head 推进要分工</text>
  <text class="text" x="1033" y="691" text-anchor="middle">共享 mmap 不代表可任意并发写</text>

  <rect class="panel" x="58" y="850" width="1204" height="200"/>
  <text class="h2" x="90" y="892">2. 跟 epoll 的关键差异</text>
  <rect class="gray" x="100" y="930" width="315" height="80"/>
  <text class="label" x="257" y="960" text-anchor="middle">epoll readiness</text>
  <text class="text" x="257" y="988" text-anchor="middle">返回 fd 已就绪；应用继续 read/write</text>
  <rect class="cq" x="505" y="930" width="315" height="80"/>
  <text class="label" x="662" y="960" text-anchor="middle">io_uring completion</text>
  <text class="text" x="662" y="988" text-anchor="middle">返回本次操作结果；应用消费 CQE</text>
  <rect class="warn" x="910" y="930" width="245" height="80"/>
  <text class="label" x="1032" y="960" text-anchor="middle">选型判断</text>
  <text class="text" x="1032" y="988" text-anchor="middle">瓶颈不在提交路径，迁移收益有限</text>

  <rect class="panel" x="58" y="1080" width="1204" height="190"/>
  <text class="h2" x="90" y="1122">3. 生产准入检查</text>
  <rect class="warn" x="92" y="1155" width="260" height="76"/>
  <text class="label" x="222" y="1184" text-anchor="middle">内核与发行版补丁</text>
  <text class="tiny" x="222" y="1213" text-anchor="middle">opcode、SQPOLL、buffered IO 差异</text>
  <rect class="warn" x="382" y="1155" width="260" height="76"/>
  <text class="label" x="512" y="1184" text-anchor="middle">安全策略</text>
  <text class="tiny" x="512" y="1213" text-anchor="middle">seccomp / LSM / io_uring_disabled</text>
  <rect class="warn" x="672" y="1155" width="260" height="76"/>
  <text class="label" x="802" y="1184" text-anchor="middle">资源注册容量</text>
  <text class="tiny" x="802" y="1213" text-anchor="middle">fd 表、pinned buffer、NUMA 放置</text>
  <rect class="warn" x="962" y="1155" width="250" height="76"/>
  <text class="label" x="1087" y="1184" text-anchor="middle">观测与回退</text>
  <text class="tiny" x="1087" y="1213" text-anchor="middle">SQ/CQ backlog、res 分布、回退 epoll</text>
</svg>
