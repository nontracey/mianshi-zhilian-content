<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">io_uring 的 SQ/CQ 双环生命周期</title><desc id="desc">展示用户态如何填写 SQE、发布 SQ tail，通过 io_uring_enter 或 SQPOLL 让内核执行操作，内核写回 CQE 后应用收割 CQ，并检查 res、CQ overflow、固定资源和安全限制。</desc><defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:10}.title{font:700 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:600 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.h2{font:700 25px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:700 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:600 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:700 15px &quot;SFMono-Regular&quot;,Consolas,monospace;fill:#0f172a}.user{fill:#eff6ff;stroke:#60a5fa}.cq,.gray,.user{stroke-width:2;rx:8}.kernel{fill:#fff7ed;stroke:#fb923c}.kernel,.warn{stroke-width:2;rx:8}.cq{fill:#ecfdf5;stroke:#34d399}.warn{fill:#fef2f2;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#cbd5e1}.ring{fill:none;stroke-width:18}.sqRing{stroke:#60a5fa}.cqRing{stroke:#34d399}.arrow{stroke:#2563eb;marker-end:url(#arrow)}.arrow,.greenArrow,.orangeArrow{stroke-width:3;fill:none}.orangeArrow{stroke:#ea580c;marker-end:url(#orangeArrow)}.greenArrow{stroke:#059669;marker-end:url(#greenArrow)}</style><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#2563eb" d="M2,2 L10,6 L2,10 Z"/></marker><marker id="orangeArrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#ea580c" d="M2,2 L10,6 L2,10 Z"/></marker><marker id="greenArrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#059669" d="M2,2 L10,6 L2,10 Z"/></marker></defs><rect width="1320" height="1320" class="bg"/><text x="660" y="55" class="title" text-anchor="middle">io_uring：提交的是操作，收割的是完成结果</text><text x="660" y="88" class="subtitle" text-anchor="middle">SQE/SQ 负责发布请求，CQE/CQ 负责返回 res；完成不等于成功</text><rect width="1204" height="700" x="58" y="120" class="panel"/><text x="90" y="162" class="h2">1. 一次请求从 SQE 到 CQE 的真实链路</text><rect width="270" height="150" x="92" y="205" class="user"/><text x="227" y="236" class="label" text-anchor="middle">用户态准备 SQE</text><text x="227" y="266" class="mono" text-anchor="middle">opcode / fd / buf</text><text x="227" y="292" class="mono" text-anchor="middle">offset / flags</text><text x="227" y="318" class="mono" text-anchor="middle">user_data</text><path d="M365 280 H435" class="arrow"/><circle cx="535" cy="280" r="72" class="ring sqRing"/><text x="535" y="270" class="label" text-anchor="middle">SQ</text><text x="535" y="296" class="tiny" text-anchor="middle">tail 发布</text><path d="M610 280 H690" class="arrow"/><rect width="250" height="140" x="700" y="210" class="gray"/><text x="825" y="240" class="label" text-anchor="middle">提交方式</text><text x="825" y="270" class="text" text-anchor="middle">普通：io_uring_enter</text><text x="825" y="298" class="text" text-anchor="middle">SQPOLL：内核线程轮询 SQ</text><text x="825" y="324" class="tiny" text-anchor="middle">版本/权限/CPU 代价要核验</text><path d="M954 280 H1026" class="orangeArrow"/><rect width="170" height="150" x="1035" y="205" class="kernel"/><text x="1120" y="244" class="label" text-anchor="middle">内核执行</text><text x="1120" y="273" class="text" text-anchor="middle">read/write</text><text x="1120" y="299" class="text" text-anchor="middle">accept/fsync</text><text x="1120" y="325" class="text" text-anchor="middle">timeout/cancel</text><path d="M1120 360 C1120 450 955 475 850 475" class="greenArrow"/><circle cx="755" cy="475" r="72" class="ring cqRing"/><text x="755" y="463" class="label" text-anchor="middle">CQ</text><text x="755" y="489" class="tiny" text-anchor="middle">CQE 写回</text><rect width="230" height="140" x="420" y="405" class="cq"/><text x="535" y="438" class="label" text-anchor="middle">CQE 内容</text><text x="535" y="468" class="mono" text-anchor="middle">user_data</text><text x="535" y="494" class="mono" text-anchor="middle">res = bytes</text><text x="535" y="520" class="mono" text-anchor="middle">res = -errno</text><path d="M682 475 H654" class="greenArrow"/><path d="M417 475 H360" class="greenArrow"/><rect width="270" height="140" x="92" y="405" class="user"/><text x="227" y="438" class="label" text-anchor="middle">应用收割 CQ</text><text x="227" y="468" class="text" text-anchor="middle">按 user_data 找请求</text><text x="227" y="494" class="text" text-anchor="middle">检查 res：成功/短读/负 errno</text><text x="227" y="520" class="text" text-anchor="middle">推进业务状态机或重试</text><rect width="350" height="120" x="92" y="600" class="warn"/><text x="267" y="633" class="label" text-anchor="middle">CQ 收割慢</text><text x="267" y="663" class="text" text-anchor="middle">CQ backlog 增长，可能 overflow</text><text x="267" y="691" class="text" text-anchor="middle">延迟尖刺、提交反压、错误处理复杂化</text><rect width="330" height="120" x="485" y="600" class="warn"/><text x="650" y="633" class="label" text-anchor="middle">固定资源不是免费</text><text x="650" y="663" class="text" text-anchor="middle">fixed files 减 fdget；fixed buffers 减 pin</text><text x="650" y="691" class="text" text-anchor="middle">代价是生命周期、pinned memory、NUMA</text><rect width="350" height="120" x="858" y="600" class="warn"/><text x="1033" y="633" class="label" text-anchor="middle">多线程 ring 所有权</text><text x="1033" y="663" class="text" text-anchor="middle">SQE 分配、tail 发布、CQ head 推进要分工</text><text x="1033" y="691" class="text" text-anchor="middle">共享 mmap 不代表可任意并发写</text><rect width="1204" height="200" x="58" y="850" class="panel"/><text x="90" y="892" class="h2">2. 跟 epoll 的关键差异</text><rect width="315" height="80" x="100" y="930" class="gray"/><text x="257" y="960" class="label" text-anchor="middle">epoll readiness</text><text x="257" y="988" class="text" text-anchor="middle">返回 fd 已就绪；应用继续 read/write</text><rect width="315" height="80" x="505" y="930" class="cq"/><text x="662" y="960" class="label" text-anchor="middle">io_uring completion</text><text x="662" y="988" class="text" text-anchor="middle">返回本次操作结果；应用消费 CQE</text><rect width="245" height="80" x="910" y="930" class="warn"/><text x="1032" y="960" class="label" text-anchor="middle">选型判断</text><text x="1032" y="988" class="text" text-anchor="middle">瓶颈不在提交路径，迁移收益有限</text><rect width="1204" height="190" x="58" y="1080" class="panel"/><text x="90" y="1122" class="h2">3. 生产准入检查</text><rect width="260" height="76" x="92" y="1155" class="warn"/><text x="222" y="1184" class="label" text-anchor="middle">内核与发行版补丁</text><text x="222" y="1213" class="tiny" text-anchor="middle">opcode、SQPOLL、buffered IO 差异</text><rect width="260" height="76" x="382" y="1155" class="warn"/><text x="512" y="1184" class="label" text-anchor="middle">安全策略</text><text x="512" y="1213" class="tiny" text-anchor="middle">seccomp / LSM / io_uring_disabled</text><rect width="260" height="76" x="672" y="1155" class="warn"/><text x="802" y="1184" class="label" text-anchor="middle">资源注册容量</text><text x="802" y="1213" class="tiny" text-anchor="middle">fd 表、pinned buffer、NUMA 放置</text><rect width="250" height="76" x="962" y="1155" class="warn"/><text x="1087" y="1184" class="label" text-anchor="middle">观测与回退</text><text x="1087" y="1213" class="tiny" text-anchor="middle">SQ/CQ backlog、res 分布、回退 epoll</text></svg>