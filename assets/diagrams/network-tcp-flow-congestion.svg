<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1280"><title id="title">TCP 流量控制与拥塞控制：rwnd、cwnd、Reno/Cubic/BBR</title><desc id="desc">展示 TCP 发送窗口由接收窗口 rwnd 和拥塞窗口 cwnd 共同限制，Reno 慢启动、拥塞避免、快重传、RTO 的窗口变化，以及 Reno、Cubic、BBR 的选型和排查指标。</desc><defs><marker id="arrow-blue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#059669" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.title{font:800 36px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.panel-title{font:700 27px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1e293b}.small{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.blue{fill:#eff6ff;stroke:#60a5fa}.amber,.blue,.gray{stroke-width:2;rx:14}.green{fill:#ecfdf5;stroke:#34d399}.green,.red{stroke-width:2;rx:14}.amber{fill:#fffbeb;stroke:#f59e0b}.red{fill:#fef2f2;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#cbd5e1}.line-blue{stroke:#2563eb;marker-end:url(#arrow-blue)}.line-blue,.line-green,.line-red{stroke-width:4;fill:none}.line-green{stroke:#059669;marker-end:url(#arrow-green)}.line-red{stroke:#dc2626;marker-end:url(#arrow-red)}.axis{stroke:#475569;stroke-width:3;fill:none}.dash{stroke-dasharray:8 8}</style></defs><rect width="1280" height="1280" class="bg"/><text x="640" y="58" class="title" text-anchor="middle">TCP 流量控制与拥塞控制</text><text x="640" y="92" class="subtitle" text-anchor="middle">rwnd 管接收方，cwnd 管网络；真正可发 = min(rwnd, cwnd) - bytes_in_flight</text><rect width="1160" height="300" x="60" y="120" class="panel"/><text x="92" y="162" class="panel-title">1. 两套窗口共同限速：不是只看对端窗口</text><rect width="210" height="88" x="105" y="205" class="blue"/><text x="210" y="240" class="label" text-anchor="middle">发送方内核</text><text x="210" y="266" class="tiny" text-anchor="middle">维护 cwnd / in_flight</text><rect width="210" height="108" x="535" y="195" class="amber"/><text x="640" y="232" class="label" text-anchor="middle">网络路径</text><text x="640" y="258" class="tiny" text-anchor="middle">瓶颈带宽、RTT、丢包</text><text x="640" y="282" class="tiny" text-anchor="middle">拥塞控制估计 cwnd</text><rect width="210" height="88" x="965" y="205" class="green"/><text x="1070" y="240" class="label" text-anchor="middle">接收方应用</text><text x="1070" y="266" class="tiny" text-anchor="middle">读取速度决定 rwnd</text><path d="M 318 248 L 530 248" class="line-blue"/><path d="M 750 248 L 960 248" class="line-green"/><rect width="900" height="54" x="190" y="330" class="gray"/><text x="640" y="364" class="label" text-anchor="middle">send_allowance = min(rwnd, cwnd) - bytes_in_flight</text><text x="640" y="405" class="small" text-anchor="middle">rwnd 小：接收方读慢或缓冲小；cwnd 小且重传高：链路拥塞/丢包；两者都大：查应用写入、TLS、Nagle/delayed ACK</text><rect width="1160" height="345" x="60" y="455" class="panel"/><text x="92" y="497" class="panel-title">2. Reno 窗口曲线：dupACK 减半，RTO 退回慢启动</text><line x1="145" x2="1045" y1="735" y2="735" class="axis"/><line x1="145" x2="145" y1="735" y2="535" class="axis"/><text x="1048" y="762" class="tiny">RTT / ACK 时间</text><text x="100" y="538" class="tiny" transform="rotate(-90 100 538)">cwnd</text><path fill="none" stroke="#2563eb" stroke-width="5" d="M 160 720 C 210 690, 260 635, 310 560"/><text x="245" y="565" fill="#1d4ed8" class="small" text-anchor="middle">慢启动：近似指数涨</text><path fill="none" stroke="#059669" stroke-width="5" d="M 310 560 C 430 552, 560 540, 690 526"/><text x="510" y="520" fill="#047857" class="small" text-anchor="middle">拥塞避免：约每 RTT +1 MSS</text><path d="M 690 526 L 735 620" class="line-red"/><text x="735" y="515" fill="#b91c1c" class="small" text-anchor="middle">3 dupACK</text><path fill="none" stroke="#059669" stroke-width="5" d="M 735 620 C 830 608, 910 596, 980 582"/><text x="870" y="638" fill="#047857" class="small" text-anchor="middle">快恢复后回到拥塞避免</text><path d="M 980 582 L 1015 720" class="line-red dash"/><text x="1010" y="570" fill="#b91c1c" class="small" text-anchor="middle">RTO</text><text x="1030" y="710" fill="#b91c1c" class="tiny">cwnd 降到 loss window</text><rect width="1160" height="305" x="60" y="835" class="panel"/><text x="92" y="877" class="panel-title">3. 算法选型与排查：Reno / Cubic / BBR 看不同信号</text><rect width="295" height="120" x="100" y="920" class="red"/><text x="248" y="955" class="label" text-anchor="middle">Reno / NewReno</text><text x="248" y="984" class="tiny" text-anchor="middle">丢包驱动 AIMD</text><text x="248" y="1010" class="tiny" text-anchor="middle">教学清晰，高 BDP 恢复慢</text><rect width="295" height="120" x="492" y="920" class="amber"/><text x="640" y="955" class="label" text-anchor="middle">CUBIC</text><text x="640" y="984" class="tiny" text-anchor="middle">三次曲线，RFC 9438</text><text x="640" y="1010" class="tiny" text-anchor="middle">高 BDP 更稳，主流默认</text><rect width="295" height="120" x="885" y="920" class="green"/><text x="1032" y="955" class="label" text-anchor="middle">BBR</text><text x="1032" y="984" class="tiny" text-anchor="middle">BtlBw × RTprop 建模</text><text x="1032" y="1010" class="tiny" text-anchor="middle">弱网/跨域需灰度看公平性</text><rect width="1070" height="42" x="105" y="1075" class="gray"/><text x="640" y="1102" class="small" text-anchor="middle">ss -tin 排查：rcv_space / Recv-Q 看接收方；cwnd + retrans 看网络；两者都大再查应用写入与小包策略</text><rect width="1112" height="62" x="84" y="1170" class="gray"/><text x="640" y="1197" class="small" text-anchor="middle">记忆锚点：rwnd 是对端给的，cwnd 是本端估的；bytes_in_flight 是已经发出但尚未确认的数据</text><text x="640" y="1222" class="small" text-anchor="middle">不要把 BBR 当万能加速开关：先看内核是否支持、是否启用 fq pacing、和 Cubic 流共存是否公平</text></svg>