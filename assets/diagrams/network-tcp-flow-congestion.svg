<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">TCP 流量控制与拥塞控制：rwnd、cwnd、Reno/Cubic/BBR</title>
  <desc id="desc">展示 TCP 发送窗口由接收窗口 rwnd 和拥塞窗口 cwnd 共同限制，Reno 慢启动、拥塞避免、快重传、RTO 的窗口变化，以及 Reno、Cubic、BBR 的选型和排查指标。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .title { font: 800 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .panel-title { font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 14; }
      .green { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 14; }
      .amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; rx: 14; }
      .red { fill: #fef2f2; stroke: #f87171; stroke-width: 2; rx: 14; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .line-blue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .line-green { stroke: #059669; stroke-width: 4; fill: none; marker-end: url(#arrow-green); }
      .line-red { stroke: #dc2626; stroke-width: 4; fill: none; marker-end: url(#arrow-red); }
      .axis { stroke: #475569; stroke-width: 3; fill: none; }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text class="title" x="640" y="58" text-anchor="middle">TCP 流量控制与拥塞控制</text>
  <text class="subtitle" x="640" y="92" text-anchor="middle">rwnd 管接收方，cwnd 管网络；真正可发 = min(rwnd, cwnd) - bytes_in_flight</text>

  <rect class="panel" x="60" y="120" width="1160" height="300"/>
  <text class="panel-title" x="92" y="162">1. 两套窗口共同限速：不是只看对端窗口</text>
  <rect class="blue" x="105" y="205" width="210" height="88"/>
  <text class="label" x="210" y="240" text-anchor="middle">发送方内核</text>
  <text class="tiny" x="210" y="266" text-anchor="middle">维护 cwnd / in_flight</text>
  <rect class="amber" x="535" y="195" width="210" height="108"/>
  <text class="label" x="640" y="232" text-anchor="middle">网络路径</text>
  <text class="tiny" x="640" y="258" text-anchor="middle">瓶颈带宽、RTT、丢包</text>
  <text class="tiny" x="640" y="282" text-anchor="middle">拥塞控制估计 cwnd</text>
  <rect class="green" x="965" y="205" width="210" height="88"/>
  <text class="label" x="1070" y="240" text-anchor="middle">接收方应用</text>
  <text class="tiny" x="1070" y="266" text-anchor="middle">读取速度决定 rwnd</text>
  <path class="line-blue" d="M 318 248 L 530 248"/>
  <path class="line-green" d="M 750 248 L 960 248"/>
  <rect class="gray" x="190" y="330" width="900" height="54"/>
  <text class="label" x="640" y="364" text-anchor="middle">send_allowance = min(rwnd, cwnd) - bytes_in_flight</text>
  <text class="small" x="640" y="405" text-anchor="middle">rwnd 小：接收方读慢或缓冲小；cwnd 小且重传高：链路拥塞/丢包；两者都大：查应用写入、TLS、Nagle/delayed ACK</text>

  <rect class="panel" x="60" y="455" width="1160" height="345"/>
  <text class="panel-title" x="92" y="497">2. Reno 窗口曲线：dupACK 减半，RTO 退回慢启动</text>
  <line class="axis" x1="145" y1="735" x2="1045" y2="735"/>
  <line class="axis" x1="145" y1="735" x2="145" y2="535"/>
  <text class="tiny" x="1048" y="762">RTT / ACK 时间</text>
  <text class="tiny" x="100" y="538" transform="rotate(-90 100 538)">cwnd</text>
  <path d="M 160 720 C 210 690, 260 635, 310 560" stroke="#2563eb" stroke-width="5" fill="none"/>
  <text class="small" x="245" y="565" text-anchor="middle" fill="#1d4ed8">慢启动：近似指数涨</text>
  <path d="M 310 560 C 430 552, 560 540, 690 526" stroke="#059669" stroke-width="5" fill="none"/>
  <text class="small" x="510" y="520" text-anchor="middle" fill="#047857">拥塞避免：约每 RTT +1 MSS</text>
  <path class="line-red" d="M 690 526 L 735 620"/>
  <text class="small" x="735" y="515" text-anchor="middle" fill="#b91c1c">3 dupACK</text>
  <path d="M 735 620 C 830 608, 910 596, 980 582" stroke="#059669" stroke-width="5" fill="none"/>
  <text class="small" x="870" y="638" text-anchor="middle" fill="#047857">快恢复后回到拥塞避免</text>
  <path class="line-red dash" d="M 980 582 L 1015 720"/>
  <text class="small" x="1010" y="570" text-anchor="middle" fill="#b91c1c">RTO</text>
  <text class="tiny" x="1030" y="710" fill="#b91c1c">cwnd 降到 loss window</text>

  <rect class="panel" x="60" y="835" width="1160" height="305"/>
  <text class="panel-title" x="92" y="877">3. 算法选型与排查：Reno / Cubic / BBR 看不同信号</text>
  <rect class="red" x="100" y="920" width="295" height="120"/>
  <text class="label" x="248" y="955" text-anchor="middle">Reno / NewReno</text>
  <text class="tiny" x="248" y="984" text-anchor="middle">丢包驱动 AIMD</text>
  <text class="tiny" x="248" y="1010" text-anchor="middle">教学清晰，高 BDP 恢复慢</text>
  <rect class="amber" x="492" y="920" width="295" height="120"/>
  <text class="label" x="640" y="955" text-anchor="middle">CUBIC</text>
  <text class="tiny" x="640" y="984" text-anchor="middle">三次曲线，RFC 9438</text>
  <text class="tiny" x="640" y="1010" text-anchor="middle">高 BDP 更稳，主流默认</text>
  <rect class="green" x="885" y="920" width="295" height="120"/>
  <text class="label" x="1032" y="955" text-anchor="middle">BBR</text>
  <text class="tiny" x="1032" y="984" text-anchor="middle">BtlBw × RTprop 建模</text>
  <text class="tiny" x="1032" y="1010" text-anchor="middle">弱网/跨域需灰度看公平性</text>
  <rect class="gray" x="105" y="1075" width="1070" height="42"/>
  <text class="small" x="640" y="1102" text-anchor="middle">ss -tin 排查：rcv_space / Recv-Q 看接收方；cwnd + retrans 看网络；两者都大再查应用写入与小包策略</text>

  <rect class="gray" x="84" y="1170" width="1112" height="62"/>
  <text class="small" x="640" y="1197" text-anchor="middle">记忆锚点：rwnd 是对端给的，cwnd 是本端估的；bytes_in_flight 是已经发出但尚未确认的数据</text>
  <text class="small" x="640" y="1222" text-anchor="middle">不要把 BBR 当万能加速开关：先看内核是否支持、是否启用 fq pacing、和 Cubic 流共存是否公平</text>
</svg>
