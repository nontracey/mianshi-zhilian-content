<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1340" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1340"><title id="title">Java time type selection, storage conversion, and DST boundaries</title><desc id="desc">A topic-specific diagram explaining java.time type selection: LocalDate, LocalTime, LocalDateTime, ZonedDateTime, OffsetDateTime, Instant, storage conversion, user-zone display, daylight saving gap and overlap, Duration versus Period, and formatter thread safety.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 32px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.arrow-blue,.arrow-green{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.arrow-green{stroke:#16a34a;marker-end:url(#arrow-green)}</style></defs><rect width="1320" height="1340" class="bg"/><text x="70" y="64" class="title">java.time：先选时间语义，再选 API</text><text x="70" y="96" class="subtitle">日期、时间点、时区规则、offset、日历周期和机器时长是不同概念，混用才是线上错乱根源。</text><rect width="1180" height="350" x="70" y="130" class="panel" rx="16"/><text x="96" y="166" class="section-title">1. 类型选择：每个类只表达一种时间语义</text><rect width="180" height="88" x="105" y="215" stroke-width="2" class="green" rx="12"/><text x="132" y="247" class="box-title">LocalDate</text><text x="132" y="272" class="text">自然日 / 生日</text><text x="132" y="292" class="text">无时间、无时区</text><rect width="180" height="88" x="325" y="215" stroke-width="2" class="green" rx="12"/><text x="352" y="247" class="box-title">LocalTime</text><text x="352" y="272" class="text">营业时间 / 班次</text><text x="352" y="292" class="text">无日期、无时区</text><rect width="200" height="88" x="545" y="215" stroke-width="2" class="yellow" rx="12"/><text x="572" y="247" class="box-title">LocalDateTime</text><text x="572" y="272" class="text">表单中的本地时间</text><text x="572" y="292" class="text">还不是时间戳</text><rect width="180" height="88" x="785" y="215" stroke-width="2" class="blue" rx="12"/><text x="812" y="247" class="box-title">Instant</text><text x="812" y="272" class="text">UTC 时间线一点</text><text x="812" y="292" class="text">日志 / 审计 / 存储</text><rect width="190" height="88" x="1005" y="215" stroke-width="2" class="violet" rx="12"/><text x="1032" y="247" class="box-title">ZonedDateTime</text><text x="1032" y="272" class="text">本地时间 + ZoneId</text><text x="1032" y="292" class="text">处理 DST 规则</text><rect width="220" height="74" x="185" y="350" stroke-width="2" class="cyan" rx="12"/><text x="212" y="380" class="box-title">OffsetDateTime</text><text x="212" y="404" class="text">带固定 offset 的接口时间</text><rect width="220" height="74" x="510" y="350" stroke-width="2" class="yellow" rx="12"/><text x="537" y="380" class="box-title">Period</text><text x="537" y="404" class="text">年/月/日，日历周期</text><rect width="220" height="74" x="835" y="350" stroke-width="2" class="blue" rx="12"/><text x="862" y="380" class="box-title">Duration</text><text x="862" y="404" class="text">秒/纳秒，机器时长</text><rect width="1180" height="255" x="70" y="525" class="panel" rx="16"/><text x="96" y="561" class="section-title">2. 存储与展示：LocalDateTime 绑定 ZoneId 后才是时间点</text><rect width="230" height="82" x="120" y="620" stroke-width="2" class="yellow" rx="12"/><text x="147" y="652" class="box-title">用户输入</text><text x="147" y="677" class="mono">2026-06-18 10:30</text><text x="147" y="695" class="text">LocalDateTime</text><rect width="230" height="82" x="430" y="620" stroke-width="2" class="violet" rx="12"/><text x="457" y="652" class="box-title">绑定地区规则</text><text x="457" y="677" class="mono">ZoneId.of(...)</text><text x="457" y="695" class="text">得到 ZonedDateTime</text><rect width="210" height="82" x="740" y="620" stroke-width="2" class="blue" rx="12"/><text x="767" y="652" class="box-title">统一存储</text><text x="767" y="677" class="mono">Instant / UTC</text><text x="767" y="695" class="text">事件时间唯一</text><rect width="160" height="82" x="1030" y="620" stroke-width="2" class="green" rx="12"/><text x="1057" y="652" class="box-title">展示</text><text x="1057" y="677" class="text">按用户 ZoneId</text><text x="1057" y="695" class="text">格式化输出</text><path d="M350 661 H421" class="arrow-blue"/><path d="M660 661 H731" class="arrow-blue"/><path d="M950 661 H1021" class="arrow-green"/><rect width="575" height="290" x="70" y="820" class="panel" rx="16"/><text x="96" y="856" class="section-title">3. DST 边界：不存在与重复的本地时间</text><rect width="230" height="86" x="110" y="905" stroke-width="2" class="red" rx="12"/><text x="137" y="937" class="box-title">Gap</text><text x="137" y="962" class="mono">02:30 不存在</text><text x="137" y="980" class="text">夏令时跳过一段本地时间</text><rect width="230" height="86" x="375" y="905" stroke-width="2" class="yellow" rx="12"/><text x="402" y="937" class="box-title">Overlap</text><text x="402" y="962" class="mono">01:30 出现两次</text><text x="402" y="980" class="text">需要明确早/晚 offset</text><rect width="420" height="54" x="150" y="1020" stroke-width="2" class="cyan" rx="12"/><text x="177" y="1053" class="text">业务规则要写清：拒绝、顺延、选择 earlier/later offset，不能让默认行为悄悄决定。</text><rect width="575" height="290" x="675" y="820" class="panel" rx="16"/><text x="701" y="856" class="section-title">4. Period、Duration 与格式化</text><rect width="230" height="86" x="715" y="905" stroke-width="2" class="yellow" rx="12"/><text x="742" y="937" class="box-title">Period.ofDays(1)</text><text x="742" y="962" class="text">按日历加一天</text><text x="742" y="980" class="text">跨 DST 可能不是 24 小时</text><rect width="230" height="86" x="985" y="905" stroke-width="2" class="blue" rx="12"/><text x="1012" y="937" class="box-title">Duration.ofHours(24)</text><text x="1012" y="962" class="text">按机器时间加 24 小时</text><text x="1012" y="980" class="text">不等于“明天同一墙上时间”</text><rect width="420" height="54" x="755" y="1020" stroke-width="2" class="green" rx="12"/><text x="782" y="1053" class="text">DateTimeFormatter 不可变、线程安全；SimpleDateFormat 可变，多线程共享有风险。</text><text x="96" y="1238" class="small">答题抓手：LocalDate/LocalTime/LocalDateTime 不代表全球唯一瞬间；存储用 Instant 或明确 offset；展示绑定用户 ZoneId；DST 和 Period/Duration 是区分深度的关键。</text></svg>