<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1340" viewBox="0 0 1320 1340" role="img" aria-labelledby="title desc">
  <title id="title">Java time type selection, storage conversion, and DST boundaries</title>
  <desc id="desc">A topic-specific diagram explaining java.time type selection: LocalDate, LocalTime, LocalDateTime, ZonedDateTime, OffsetDateTime, Instant, storage conversion, user-zone display, daylight saving gap and overlap, Duration versus Period, and formatter thread safety.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1340"/>
  <text class="title" x="70" y="64">java.time：先选时间语义，再选 API</text>
  <text class="subtitle" x="70" y="96">日期、时间点、时区规则、offset、日历周期和机器时长是不同概念，混用才是线上错乱根源。</text>

  <rect class="panel" x="70" y="130" width="1180" height="350" rx="16"/>
  <text class="section-title" x="96" y="166">1. 类型选择：每个类只表达一种时间语义</text>

  <rect class="green" x="105" y="215" width="180" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="247">LocalDate</text>
  <text class="text" x="132" y="272">自然日 / 生日</text>
  <text class="text" x="132" y="292">无时间、无时区</text>

  <rect class="green" x="325" y="215" width="180" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="352" y="247">LocalTime</text>
  <text class="text" x="352" y="272">营业时间 / 班次</text>
  <text class="text" x="352" y="292">无日期、无时区</text>

  <rect class="yellow" x="545" y="215" width="200" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="572" y="247">LocalDateTime</text>
  <text class="text" x="572" y="272">表单中的本地时间</text>
  <text class="text" x="572" y="292">还不是时间戳</text>

  <rect class="blue" x="785" y="215" width="180" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="812" y="247">Instant</text>
  <text class="text" x="812" y="272">UTC 时间线一点</text>
  <text class="text" x="812" y="292">日志 / 审计 / 存储</text>

  <rect class="violet" x="1005" y="215" width="190" height="88" rx="12" stroke-width="2"/>
  <text class="box-title" x="1032" y="247">ZonedDateTime</text>
  <text class="text" x="1032" y="272">本地时间 + ZoneId</text>
  <text class="text" x="1032" y="292">处理 DST 规则</text>

  <rect class="cyan" x="185" y="350" width="220" height="74" rx="12" stroke-width="2"/>
  <text class="box-title" x="212" y="380">OffsetDateTime</text>
  <text class="text" x="212" y="404">带固定 offset 的接口时间</text>

  <rect class="yellow" x="510" y="350" width="220" height="74" rx="12" stroke-width="2"/>
  <text class="box-title" x="537" y="380">Period</text>
  <text class="text" x="537" y="404">年/月/日，日历周期</text>

  <rect class="blue" x="835" y="350" width="220" height="74" rx="12" stroke-width="2"/>
  <text class="box-title" x="862" y="380">Duration</text>
  <text class="text" x="862" y="404">秒/纳秒，机器时长</text>

  <rect class="panel" x="70" y="525" width="1180" height="255" rx="16"/>
  <text class="section-title" x="96" y="561">2. 存储与展示：LocalDateTime 绑定 ZoneId 后才是时间点</text>

  <rect class="yellow" x="120" y="620" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="147" y="652">用户输入</text>
  <text class="mono" x="147" y="677">2026-06-18 10:30</text>
  <text class="text" x="147" y="695">LocalDateTime</text>

  <rect class="violet" x="430" y="620" width="230" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="457" y="652">绑定地区规则</text>
  <text class="mono" x="457" y="677">ZoneId.of(...)</text>
  <text class="text" x="457" y="695">得到 ZonedDateTime</text>

  <rect class="blue" x="740" y="620" width="210" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="767" y="652">统一存储</text>
  <text class="mono" x="767" y="677">Instant / UTC</text>
  <text class="text" x="767" y="695">事件时间唯一</text>

  <rect class="green" x="1030" y="620" width="160" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1057" y="652">展示</text>
  <text class="text" x="1057" y="677">按用户 ZoneId</text>
  <text class="text" x="1057" y="695">格式化输出</text>

  <path class="arrow-blue" d="M350 661 H421"/>
  <path class="arrow-blue" d="M660 661 H731"/>
  <path class="arrow-green" d="M950 661 H1021"/>

  <rect class="panel" x="70" y="820" width="575" height="290" rx="16"/>
  <text class="section-title" x="96" y="856">3. DST 边界：不存在与重复的本地时间</text>

  <rect class="red" x="110" y="905" width="230" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="137" y="937">Gap</text>
  <text class="mono" x="137" y="962">02:30 不存在</text>
  <text class="text" x="137" y="980">夏令时跳过一段本地时间</text>

  <rect class="yellow" x="375" y="905" width="230" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="402" y="937">Overlap</text>
  <text class="mono" x="402" y="962">01:30 出现两次</text>
  <text class="text" x="402" y="980">需要明确早/晚 offset</text>

  <rect class="cyan" x="150" y="1020" width="420" height="54" rx="12" stroke-width="2"/>
  <text class="text" x="177" y="1053">业务规则要写清：拒绝、顺延、选择 earlier/later offset，不能让默认行为悄悄决定。</text>

  <rect class="panel" x="675" y="820" width="575" height="290" rx="16"/>
  <text class="section-title" x="701" y="856">4. Period、Duration 与格式化</text>

  <rect class="yellow" x="715" y="905" width="230" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="742" y="937">Period.ofDays(1)</text>
  <text class="text" x="742" y="962">按日历加一天</text>
  <text class="text" x="742" y="980">跨 DST 可能不是 24 小时</text>

  <rect class="blue" x="985" y="905" width="230" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="1012" y="937">Duration.ofHours(24)</text>
  <text class="text" x="1012" y="962">按机器时间加 24 小时</text>
  <text class="text" x="1012" y="980">不等于“明天同一墙上时间”</text>

  <rect class="green" x="755" y="1020" width="420" height="54" rx="12" stroke-width="2"/>
  <text class="text" x="782" y="1053">DateTimeFormatter 不可变、线程安全；SimpleDateFormat 可变，多线程共享有风险。</text>

  <text class="small" x="96" y="1238">答题抓手：LocalDate/LocalTime/LocalDateTime 不代表全球唯一瞬间；存储用 Instant 或明确 offset；展示绑定用户 ZoneId；DST 和 Period/Duration 是区分深度的关键。</text>
</svg>
