<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">Virtual memory address translation, page fault handling, and performance diagnosis</title><desc id="desc">A topic-specific diagram showing virtual address layout, TLB and multilevel page-table translation, page fault resolution through VMA lookup, anonymous/file/COW/swap cases, and performance observability for TLB misses, major faults, swap, and huge pages.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 33px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.section{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.arrow-blue{stroke:#2563eb;marker-end:url(#arrow-blue)}.arrow-blue,.arrow-green,.arrow-red{stroke-width:3;fill:none}.arrow-red{stroke:#dc2626;marker-end:url(#arrow-red)}.arrow-green{stroke:#16a34a;marker-end:url(#arrow-green)}</style></defs><rect width="1320" height="1320" class="bg"/><text x="70" y="64" class="title">虚拟内存：地址翻译、缺页慢路径与性能诊断</text><text x="70" y="96" class="subtitle">程序看到的是连续虚拟地址；真正的物理页、权限、共享、回收和缺页都由 VMA、页表、MMU 与内核共同决定。</text><rect width="1180" height="235" x="70" y="130" class="section" rx="16"/><text x="96" y="166" class="section-title">1. 进程虚拟地址空间：VMA 先描述区间，物理页可延迟绑定</text><rect width="165" height="78" x="100" y="198" stroke-width="2" class="blue" rx="12"/><text x="126" y="229" class="box-title">text / rodata</text><text x="126" y="252" class="mono">r-x / r--</text><text x="126" y="271" class="text">可共享文件页</text><rect width="165" height="78" x="292" y="198" stroke-width="2" class="green" rx="12"/><text x="318" y="229" class="box-title">heap / brk</text><text x="318" y="252" class="mono">rw- anon</text><text x="318" y="271" class="text">首次写入分配</text><rect width="165" height="78" x="484" y="198" stroke-width="2" class="yellow" rx="12"/><text x="510" y="229" class="box-title">mmap file</text><text x="510" y="252" class="mono">r-- / rw-</text><text x="510" y="271" class="text">按页读入文件</text><rect width="165" height="78" x="676" y="198" stroke-width="2" class="violet" rx="12"/><text x="702" y="229" class="box-title">shared lib</text><text x="702" y="252" class="mono">r-x / rw-</text><text x="702" y="271" class="text">代码页跨进程共享</text><rect width="165" height="78" x="868" y="198" stroke-width="2" class="red" rx="12"/><text x="894" y="229" class="box-title">stack</text><text x="894" y="252" class="mono">rw- grow</text><text x="894" y="271" class="text">按需扩展</text><rect width="150" height="78" x="1060" y="198" stroke-width="2" class="cyan" rx="12"/><text x="1086" y="229" class="box-title">guard / hole</text><text x="1086" y="252" class="mono">no map</text><text x="1086" y="271" class="text">越界触发 SIGSEGV</text><text x="100" y="322" class="small">同一个虚拟地址在不同进程可映射到不同 PFN；权限位控制 R/W/X/User，ASLR 只改变虚拟布局，不改变“页表翻译”这件事。</text><rect width="690" height="430" x="70" y="405" class="section" rx="16"/><text x="96" y="441" class="section-title">2. 硬件快路径：TLB 命中直接得到 PFN</text><rect width="210" height="80" x="105" y="475" stroke-width="2" class="blue" rx="12"/><text x="131" y="506" class="box-title">CPU 发出虚拟地址</text><text x="131" y="531" class="mono">VPN + offset</text><text x="131" y="550" class="text">offset 不参与页表翻译</text><rect width="170" height="80" x="365" y="475" stroke-width="2" class="green" rx="12"/><text x="391" y="506" class="box-title">TLB lookup</text><text x="391" y="531" class="mono">ASID/PCID + VPN</text><text x="391" y="550" class="text">缓存最近映射</text><rect width="140" height="80" x="585" y="475" stroke-width="2" class="yellow" rx="12"/><text x="611" y="506" class="box-title">PTE 权限</text><text x="611" y="531" class="mono">P/RW/UXN</text><text x="611" y="550" class="text">读写执行校验</text><rect width="250" height="90" x="255" y="625" stroke-width="2" class="green" rx="12"/><text x="281" y="657" class="box-title">命中：PFN + offset</text><text x="281" y="682" class="text">得到物理地址，继续访问 cache / 内存</text><text x="281" y="704" class="mono">no page walk</text><rect width="190" height="90" x="535" y="625" stroke-width="2" class="red" rx="12"/><text x="561" y="657" class="box-title">未命中</text><text x="561" y="682" class="text">硬件 page walk</text><text x="561" y="704" class="mono">PML4/PUD/PMD/PTE</text><path d="M315 515 H356" class="arrow-blue"/><path d="M535 515 H576" class="arrow-blue"/><path d="M450 555 C450 590 420 606 387 625" class="arrow-green"/><path d="M655 555 C655 590 655 604 655 625" class="arrow-red"/><text x="105" y="758" class="small">TLB miss 不一定是缺页；它可能只是页表在内存里，需要多级遍历后重新填 TLB。</text><text x="105" y="782" class="small">大页/THP/HugeTLB 提高 TLB reach，但会引入内存整理、内部碎片和 split/collapse 成本。</text><text x="105" y="806" class="small">进程切换不一定完全冲掉 TLB；ASID/PCID 可保留不同地址空间的部分翻译缓存。</text><rect width="460" height="430" x="790" y="405" class="section" rx="16"/><text x="816" y="441" class="section-title">3. 缺页慢路径：先查 VMA，再决定能否修复</text><rect width="175" height="75" x="825" y="475" stroke-width="2" class="red" rx="12"/><text x="851" y="505" class="box-title">page fault</text><text x="851" y="530" class="text">PTE 不存在或权限不符</text><rect width="175" height="75" x="1040" y="475" stroke-width="2" class="yellow" rx="12"/><text x="1066" y="505" class="box-title">VMA lookup</text><text x="1066" y="530" class="text">地址是否合法、权限是否允许</text><rect width="175" height="75" x="825" y="590" stroke-width="2" class="green" rx="12"/><text x="851" y="620" class="box-title">匿名页</text><text x="851" y="645" class="text">zero page / 分配物理页</text><rect width="175" height="75" x="1040" y="590" stroke-width="2" class="blue" rx="12"/><text x="1066" y="620" class="box-title">文件映射</text><text x="1066" y="645" class="text">page cache 命中或读盘</text><rect width="175" height="75" x="825" y="705" stroke-width="2" class="violet" rx="12"/><text x="851" y="735" class="box-title">COW 写入</text><text x="851" y="760" class="text">复制页并改写 PTE</text><rect width="175" height="75" x="1040" y="705" stroke-width="2" class="red" rx="12"/><text x="1066" y="735" class="box-title">非法访问</text><text x="1066" y="760" class="mono">SIGSEGV / OOM</text><path d="M1000 512 H1031" class="arrow-red"/><path d="M1128 550 C1128 575 955 575 914 590" class="arrow-green"/><path d="M1128 550 V581" class="arrow-blue"/><path d="M914 665 V696" class="arrow-green"/><path d="M1128 665 V696" class="arrow-red"/><text x="825" y="804" class="small">minor fault：不需要磁盘 IO；major fault：通常需要读文件页或 swap 页。</text><text x="825" y="828" class="small">频繁 major fault 或持续 si/so，才是尾延迟风险信号。</text><rect width="1180" height="235" x="70" y="875" class="section" rx="16"/><text x="96" y="911" class="section-title">4. 物理内存压力：虚拟内存不是 swap，swap 只是回收匿名页的一种后备</text><rect width="225" height="86" x="105" y="945" stroke-width="2" class="green" rx="12"/><text x="131" y="977" class="box-title">文件页</text><text x="131" y="1002" class="text">干净页可直接丢弃</text><text x="131" y="1021" class="text">脏页要 writeback</text><rect width="225" height="86" x="370" y="945" stroke-width="2" class="yellow" rx="12"/><text x="396" y="977" class="box-title">匿名页</text><text x="396" y="1002" class="text">没有文件后备</text><text x="396" y="1021" class="text">必要时换出到 swap</text><rect width="225" height="86" x="635" y="945" stroke-width="2" class="blue" rx="12"/><text x="661" y="977" class="box-title">页面回收</text><text x="661" y="1002" class="text">active/inactive、accessed、dirty</text><text x="661" y="1021" class="text">近似 LRU/Clock</text><rect width="260" height="86" x="900" y="945" stroke-width="2" class="red" rx="12"/><text x="926" y="977" class="box-title">抖动</text><text x="926" y="1002" class="text">工作集大于可用内存</text><text x="926" y="1021" class="text">major fault 与 swap IO 飙升</text><path d="M330 988 H361" class="arrow-blue"/><path d="M595 988 H626" class="arrow-blue"/><path d="M860 988 H891" class="arrow-red"/><text x="105" y="1070" class="small">overcommit 只承诺虚拟地址空间；真正触碰页面时才可能分配物理页，内存不足可能触发回收、OOM 或 SIGBUS（如文件映射越界/后备不足）。</text><rect width="1180" height="115" x="70" y="1150" class="section" rx="16"/><text x="96" y="1186" class="section-title">5. 线上诊断信号</text><text x="105" y="1220" class="mono">perf stat: dTLB-load-misses, page-faults, minor-faults, major-faults</text><text x="105" y="1246" class="mono">vmstat 1: si/so, wa, free/cache /proc/&lt;pid&gt;/smaps: RSS, PSS, AnonHugePages, Private_Dirty</text><text x="105" y="1282" class="small">判断顺序：TLB miss 高但 major fault 低，看工作集/页大小/数据布局；major fault 或 si/so 高，看 page cache、swap、内存压力和 mmap 随机读。</text></svg>