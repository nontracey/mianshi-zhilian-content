<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">Virtual memory address translation, page fault handling, and performance diagnosis</title>
  <desc id="desc">A topic-specific diagram showing virtual address layout, TLB and multilevel page-table translation, page fault resolution through VMA lookup, anonymous/file/COW/swap cases, and performance observability for TLB misses, major faults, swap, and huge pages.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 33px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .chip { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-red { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .arrow-green { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="70" y="64">虚拟内存：地址翻译、缺页慢路径与性能诊断</text>
  <text class="subtitle" x="70" y="96">程序看到的是连续虚拟地址；真正的物理页、权限、共享、回收和缺页都由 VMA、页表、MMU 与内核共同决定。</text>

  <rect class="section" x="70" y="130" width="1180" height="235" rx="16"/>
  <text class="section-title" x="96" y="166">1. 进程虚拟地址空间：VMA 先描述区间，物理页可延迟绑定</text>

  <rect class="blue" x="100" y="198" width="165" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="126" y="229">text / rodata</text>
  <text class="mono" x="126" y="252">r-x / r--</text>
  <text class="text" x="126" y="271">可共享文件页</text>

  <rect class="green" x="292" y="198" width="165" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="318" y="229">heap / brk</text>
  <text class="mono" x="318" y="252">rw- anon</text>
  <text class="text" x="318" y="271">首次写入分配</text>

  <rect class="yellow" x="484" y="198" width="165" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="510" y="229">mmap file</text>
  <text class="mono" x="510" y="252">r-- / rw-</text>
  <text class="text" x="510" y="271">按页读入文件</text>

  <rect class="violet" x="676" y="198" width="165" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="702" y="229">shared lib</text>
  <text class="mono" x="702" y="252">r-x / rw-</text>
  <text class="text" x="702" y="271">代码页跨进程共享</text>

  <rect class="red" x="868" y="198" width="165" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="894" y="229">stack</text>
  <text class="mono" x="894" y="252">rw- grow</text>
  <text class="text" x="894" y="271">按需扩展</text>

  <rect class="cyan" x="1060" y="198" width="150" height="78" rx="12" stroke-width="2"/>
  <text class="box-title" x="1086" y="229">guard / hole</text>
  <text class="mono" x="1086" y="252">no map</text>
  <text class="text" x="1086" y="271">越界触发 SIGSEGV</text>

  <text class="small" x="100" y="322">同一个虚拟地址在不同进程可映射到不同 PFN；权限位控制 R/W/X/User，ASLR 只改变虚拟布局，不改变“页表翻译”这件事。</text>

  <rect class="section" x="70" y="405" width="690" height="430" rx="16"/>
  <text class="section-title" x="96" y="441">2. 硬件快路径：TLB 命中直接得到 PFN</text>

  <rect class="blue" x="105" y="475" width="210" height="80" rx="12" stroke-width="2"/>
  <text class="box-title" x="131" y="506">CPU 发出虚拟地址</text>
  <text class="mono" x="131" y="531">VPN + offset</text>
  <text class="text" x="131" y="550">offset 不参与页表翻译</text>

  <rect class="green" x="365" y="475" width="170" height="80" rx="12" stroke-width="2"/>
  <text class="box-title" x="391" y="506">TLB lookup</text>
  <text class="mono" x="391" y="531">ASID/PCID + VPN</text>
  <text class="text" x="391" y="550">缓存最近映射</text>

  <rect class="yellow" x="585" y="475" width="140" height="80" rx="12" stroke-width="2"/>
  <text class="box-title" x="611" y="506">PTE 权限</text>
  <text class="mono" x="611" y="531">P/RW/UXN</text>
  <text class="text" x="611" y="550">读写执行校验</text>

  <rect class="green" x="255" y="625" width="250" height="90" rx="12" stroke-width="2"/>
  <text class="box-title" x="281" y="657">命中：PFN + offset</text>
  <text class="text" x="281" y="682">得到物理地址，继续访问 cache / 内存</text>
  <text class="mono" x="281" y="704">no page walk</text>

  <rect class="red" x="535" y="625" width="190" height="90" rx="12" stroke-width="2"/>
  <text class="box-title" x="561" y="657">未命中</text>
  <text class="text" x="561" y="682">硬件 page walk</text>
  <text class="mono" x="561" y="704">PML4/PUD/PMD/PTE</text>

  <path class="arrow-blue" d="M315 515 H356"/>
  <path class="arrow-blue" d="M535 515 H576"/>
  <path class="arrow-green" d="M450 555 C450 590 420 606 387 625"/>
  <path class="arrow-red" d="M655 555 C655 590 655 604 655 625"/>
  <text class="small" x="105" y="758">TLB miss 不一定是缺页；它可能只是页表在内存里，需要多级遍历后重新填 TLB。</text>
  <text class="small" x="105" y="782">大页/THP/HugeTLB 提高 TLB reach，但会引入内存整理、内部碎片和 split/collapse 成本。</text>
  <text class="small" x="105" y="806">进程切换不一定完全冲掉 TLB；ASID/PCID 可保留不同地址空间的部分翻译缓存。</text>

  <rect class="section" x="790" y="405" width="460" height="430" rx="16"/>
  <text class="section-title" x="816" y="441">3. 缺页慢路径：先查 VMA，再决定能否修复</text>

  <rect class="red" x="825" y="475" width="175" height="75" rx="12" stroke-width="2"/>
  <text class="box-title" x="851" y="505">page fault</text>
  <text class="text" x="851" y="530">PTE 不存在或权限不符</text>

  <rect class="yellow" x="1040" y="475" width="175" height="75" rx="12" stroke-width="2"/>
  <text class="box-title" x="1066" y="505">VMA lookup</text>
  <text class="text" x="1066" y="530">地址是否合法、权限是否允许</text>

  <rect class="green" x="825" y="590" width="175" height="75" rx="12" stroke-width="2"/>
  <text class="box-title" x="851" y="620">匿名页</text>
  <text class="text" x="851" y="645">zero page / 分配物理页</text>

  <rect class="blue" x="1040" y="590" width="175" height="75" rx="12" stroke-width="2"/>
  <text class="box-title" x="1066" y="620">文件映射</text>
  <text class="text" x="1066" y="645">page cache 命中或读盘</text>

  <rect class="violet" x="825" y="705" width="175" height="75" rx="12" stroke-width="2"/>
  <text class="box-title" x="851" y="735">COW 写入</text>
  <text class="text" x="851" y="760">复制页并改写 PTE</text>

  <rect class="red" x="1040" y="705" width="175" height="75" rx="12" stroke-width="2"/>
  <text class="box-title" x="1066" y="735">非法访问</text>
  <text class="mono" x="1066" y="760">SIGSEGV / OOM</text>

  <path class="arrow-red" d="M1000 512 H1031"/>
  <path class="arrow-green" d="M1128 550 C1128 575 955 575 914 590"/>
  <path class="arrow-blue" d="M1128 550 V581"/>
  <path class="arrow-green" d="M914 665 V696"/>
  <path class="arrow-red" d="M1128 665 V696"/>
  <text class="small" x="825" y="804">minor fault：不需要磁盘 IO；major fault：通常需要读文件页或 swap 页。</text>
  <text class="small" x="825" y="828">频繁 major fault 或持续 si/so，才是尾延迟风险信号。</text>

  <rect class="section" x="70" y="875" width="1180" height="235" rx="16"/>
  <text class="section-title" x="96" y="911">4. 物理内存压力：虚拟内存不是 swap，swap 只是回收匿名页的一种后备</text>

  <rect class="green" x="105" y="945" width="225" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="131" y="977">文件页</text>
  <text class="text" x="131" y="1002">干净页可直接丢弃</text>
  <text class="text" x="131" y="1021">脏页要 writeback</text>

  <rect class="yellow" x="370" y="945" width="225" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="396" y="977">匿名页</text>
  <text class="text" x="396" y="1002">没有文件后备</text>
  <text class="text" x="396" y="1021">必要时换出到 swap</text>

  <rect class="blue" x="635" y="945" width="225" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="661" y="977">页面回收</text>
  <text class="text" x="661" y="1002">active/inactive、accessed、dirty</text>
  <text class="text" x="661" y="1021">近似 LRU/Clock</text>

  <rect class="red" x="900" y="945" width="260" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="926" y="977">抖动</text>
  <text class="text" x="926" y="1002">工作集大于可用内存</text>
  <text class="text" x="926" y="1021">major fault 与 swap IO 飙升</text>

  <path class="arrow-blue" d="M330 988 H361"/>
  <path class="arrow-blue" d="M595 988 H626"/>
  <path class="arrow-red" d="M860 988 H891"/>
  <text class="small" x="105" y="1070">overcommit 只承诺虚拟地址空间；真正触碰页面时才可能分配物理页，内存不足可能触发回收、OOM 或 SIGBUS（如文件映射越界/后备不足）。</text>

  <rect class="section" x="70" y="1150" width="1180" height="115" rx="16"/>
  <text class="section-title" x="96" y="1186">5. 线上诊断信号</text>
  <text class="mono" x="105" y="1220">perf stat: dTLB-load-misses, page-faults, minor-faults, major-faults</text>
  <text class="mono" x="105" y="1246">vmstat 1: si/so, wa, free/cache    /proc/&lt;pid&gt;/smaps: RSS, PSS, AnonHugePages, Private_Dirty</text>
  <text class="small" x="105" y="1282">判断顺序：TLB miss 高但 major fault 低，看工作集/页大小/数据布局；major fault 或 si/so 高，看 page cache、swap、内存压力和 mmap 随机读。</text>
</svg>
