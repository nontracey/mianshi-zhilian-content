<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" viewBox="0 0 1320 1320" role="img" aria-labelledby="title desc">
  <title id="title">协程、纤程、goroutine 与 asyncio 的运行时模型</title>
  <desc id="desc">对比有栈协程、无栈 async 状态机、Go GMP 调度和 Python asyncio 单线程事件循环，说明并发、并行、阻塞和 CPU 密集任务的边界。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .title { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .panel-title { font: 750 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 750 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny-strong { font: 750 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .stack { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 14; }
      .state { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 14; }
      .runtime { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 14; }
      .risk { fill: #fef2f2; stroke: #f87171; stroke-width: 2; rx: 14; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .line-blue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .line-green { stroke: #059669; stroke-width: 4; fill: none; marker-end: url(#arrow-green); }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1320"/>
  <text class="title" x="660" y="56" text-anchor="middle">协程不是魔法线程：关键在运行时如何调度</text>
  <text class="subtitle" x="660" y="90" text-anchor="middle">面试要区分：有栈/无栈、协作式/抢占式、单线程并发/M:N 多线程并行</text>

  <rect class="panel" x="60" y="125" width="1200" height="315"/>
  <text class="panel-title" x="92" y="168">1. 两类实现：保存栈，还是保存状态机</text>
  <rect class="stack" x="95" y="210" width="505" height="145"/>
  <text class="label" x="347" y="242" text-anchor="middle">Stackful：有独立栈</text>
  <text class="tiny" x="347" y="270" text-anchor="middle">可在嵌套调用深处挂起/恢复，像同步代码</text>
  <text class="tiny" x="347" y="298" text-anchor="middle">代表：goroutine、Lua coroutine、fiber</text>
  <text class="tiny" x="347" y="326" text-anchor="middle">代价：每个任务要有栈，需运行时管理增长/迁移</text>

  <rect class="state" x="720" y="210" width="505" height="145"/>
  <text class="label" x="972" y="242" text-anchor="middle">Stackless：async 状态机</text>
  <text class="tiny" x="972" y="270" text-anchor="middle">编译器/解释器把 await 点拆成状态</text>
  <text class="tiny" x="972" y="298" text-anchor="middle">代表：Python asyncio、JS/Rust async</text>
  <text class="tiny" x="972" y="326" text-anchor="middle">边界：只能在 await/yield 点挂起，调用链会函数染色</text>
  <path class="line-blue" d="M 605 283 L 715 283"/>

  <rect class="panel" x="60" y="475" width="1200" height="350"/>
  <text class="panel-title" x="92" y="518">2. Go GMP：goroutine 轻量，但并行来自 M:N 调度</text>
  <rect class="stack" x="95" y="565" width="210" height="78"/>
  <text class="label" x="200" y="596" text-anchor="middle">G</text>
  <text class="tiny" x="200" y="622" text-anchor="middle">goroutine / stack / state</text>
  <rect class="stack" x="95" y="670" width="210" height="78"/>
  <text class="label" x="200" y="701" text-anchor="middle">run queues</text>
  <text class="tiny" x="200" y="727" text-anchor="middle">local + global + stealing</text>
  <path class="line-blue" d="M 310 604 L 420 604"/>
  <path class="line-blue" d="M 310 709 L 420 709"/>

  <rect class="runtime" x="425" y="565" width="210" height="78"/>
  <text class="label" x="530" y="596" text-anchor="middle">P</text>
  <text class="tiny" x="530" y="622" text-anchor="middle">processor, owns runq</text>
  <rect class="runtime" x="425" y="670" width="210" height="78"/>
  <text class="label" x="530" y="701" text-anchor="middle">P</text>
  <text class="tiny" x="530" y="727" text-anchor="middle">GOMAXPROCS 个逻辑处理器</text>
  <path class="line-green" d="M 640 604 L 750 604"/>
  <path class="line-green" d="M 640 709 L 750 709"/>

  <rect class="runtime" x="755" y="565" width="210" height="78"/>
  <text class="label" x="860" y="596" text-anchor="middle">M</text>
  <text class="tiny" x="860" y="622" text-anchor="middle">OS thread</text>
  <rect class="runtime" x="755" y="670" width="210" height="78"/>
  <text class="label" x="860" y="701" text-anchor="middle">M</text>
  <text class="tiny" x="860" y="727" text-anchor="middle">blocking syscall may park</text>
  <path class="line-green" d="M 970 604 L 1080 604"/>
  <path class="line-green" d="M 970 709 L 1080 709"/>

  <rect class="gray" x="1085" y="565" width="135" height="183"/>
  <text class="label" x="1152" y="620" text-anchor="middle">CPU cores</text>
  <text class="tiny" x="1152" y="650" text-anchor="middle">真正并行</text>
  <text class="tiny" x="1152" y="678" text-anchor="middle">靠多个 M</text>
  <text class="tiny" x="1152" y="706" text-anchor="middle">同时运行</text>

  <rect class="risk" x="95" y="765" width="1125" height="42"/>
  <text class="tiny-strong" x="657" y="792" text-anchor="middle">Go 1.14+ goroutine 可异步抢占；但 CPU 密集任务仍会占核心，不能把协程当作免费并行计算</text>

  <rect class="panel" x="60" y="860" width="1200" height="315"/>
  <text class="panel-title" x="92" y="903">3. Python asyncio：单线程事件循环，强在 IO 并发</text>
  <rect class="state" x="95" y="950" width="240" height="82"/>
  <text class="label" x="215" y="982" text-anchor="middle">coroutine objects</text>
  <text class="tiny" x="215" y="1008" text-anchor="middle">async def returns awaitable</text>
  <path class="line-green" d="M 340 991 L 455 991"/>
  <rect class="state" x="460" y="950" width="240" height="82"/>
  <text class="label" x="580" y="982" text-anchor="middle">Tasks</text>
  <text class="tiny" x="580" y="1008" text-anchor="middle">event loop scheduled</text>
  <path class="line-green" d="M 705 991 L 820 991"/>
  <rect class="state" x="825" y="950" width="240" height="82"/>
  <text class="label" x="945" y="982" text-anchor="middle">Selector / IO</text>
  <text class="tiny" x="945" y="1008" text-anchor="middle">await gives control back</text>
  <path class="line-blue dash" d="M 945 1037 L 945 1090 L 700 1090"/>
  <rect class="gray" x="460" y="1060" width="240" height="82"/>
  <text class="label" x="580" y="1092" text-anchor="middle">single loop thread</text>
  <text class="tiny" x="580" y="1118" text-anchor="middle">CPU blocking delays all tasks</text>
  <rect class="risk" x="820" y="1060" width="245" height="82"/>
  <text class="label" x="942" y="1092" text-anchor="middle">CPU work</text>
  <text class="tiny" x="942" y="1118" text-anchor="middle">use process/thread/executor</text>
</svg>
