<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1320" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1320"><title id="title">协程、纤程、goroutine 与 asyncio 的运行时模型</title><desc id="desc">对比有栈协程、无栈 async 状态机、Go GMP 调度和 Python asyncio 单线程事件循环，说明并发、并行、阻塞和 CPU 密集任务的边界。</desc><defs><marker id="arrow-blue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#059669" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.title{font:800 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.panel-title{font:750 27px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:750 20px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1e293b}.tiny{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.tiny-strong{font:750 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.stack{fill:#eff6ff;stroke:#60a5fa;stroke-width:2;rx:14}.state{fill:#ecfdf5;stroke:#34d399}.gray,.risk,.runtime,.state{stroke-width:2;rx:14}.runtime{fill:#fff7ed;stroke:#fb923c}.risk{fill:#fef2f2;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#cbd5e1}.line-blue,.line-green{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow-blue)}.line-green{stroke:#059669;marker-end:url(#arrow-green)}.dash{stroke-dasharray:8 8}</style></defs><rect width="1320" height="1320" class="bg"/><text x="660" y="56" class="title" text-anchor="middle">协程不是魔法线程：关键在运行时如何调度</text><text x="660" y="90" class="subtitle" text-anchor="middle">面试要区分：有栈/无栈、协作式/抢占式、单线程并发/M:N 多线程并行</text><rect width="1200" height="315" x="60" y="125" class="panel"/><text x="92" y="168" class="panel-title">1. 两类实现：保存栈，还是保存状态机</text><rect width="505" height="145" x="95" y="210" class="stack"/><text x="347" y="242" class="label" text-anchor="middle">Stackful：有独立栈</text><text x="347" y="270" class="tiny" text-anchor="middle">可在嵌套调用深处挂起/恢复，像同步代码</text><text x="347" y="298" class="tiny" text-anchor="middle">代表：goroutine、Lua coroutine、fiber</text><text x="347" y="326" class="tiny" text-anchor="middle">代价：每个任务要有栈，需运行时管理增长/迁移</text><rect width="505" height="145" x="720" y="210" class="state"/><text x="972" y="242" class="label" text-anchor="middle">Stackless：async 状态机</text><text x="972" y="270" class="tiny" text-anchor="middle">编译器/解释器把 await 点拆成状态</text><text x="972" y="298" class="tiny" text-anchor="middle">代表：Python asyncio、JS/Rust async</text><text x="972" y="326" class="tiny" text-anchor="middle">边界：只能在 await/yield 点挂起，调用链会函数染色</text><path d="M 605 283 L 715 283" class="line-blue"/><rect width="1200" height="350" x="60" y="475" class="panel"/><text x="92" y="518" class="panel-title">2. Go GMP：goroutine 轻量，但并行来自 M:N 调度</text><rect width="210" height="78" x="95" y="565" class="stack"/><text x="200" y="596" class="label" text-anchor="middle">G</text><text x="200" y="622" class="tiny" text-anchor="middle">goroutine / stack / state</text><rect width="210" height="78" x="95" y="670" class="stack"/><text x="200" y="701" class="label" text-anchor="middle">run queues</text><text x="200" y="727" class="tiny" text-anchor="middle">local + global + stealing</text><path d="M 310 604 L 420 604" class="line-blue"/><path d="M 310 709 L 420 709" class="line-blue"/><rect width="210" height="78" x="425" y="565" class="runtime"/><text x="530" y="596" class="label" text-anchor="middle">P</text><text x="530" y="622" class="tiny" text-anchor="middle">processor, owns runq</text><rect width="210" height="78" x="425" y="670" class="runtime"/><text x="530" y="701" class="label" text-anchor="middle">P</text><text x="530" y="727" class="tiny" text-anchor="middle">GOMAXPROCS 个逻辑处理器</text><path d="M 640 604 L 750 604" class="line-green"/><path d="M 640 709 L 750 709" class="line-green"/><rect width="210" height="78" x="755" y="565" class="runtime"/><text x="860" y="596" class="label" text-anchor="middle">M</text><text x="860" y="622" class="tiny" text-anchor="middle">OS thread</text><rect width="210" height="78" x="755" y="670" class="runtime"/><text x="860" y="701" class="label" text-anchor="middle">M</text><text x="860" y="727" class="tiny" text-anchor="middle">blocking syscall may park</text><path d="M 970 604 L 1080 604" class="line-green"/><path d="M 970 709 L 1080 709" class="line-green"/><rect width="135" height="183" x="1085" y="565" class="gray"/><text x="1152" y="620" class="label" text-anchor="middle">CPU cores</text><text x="1152" y="650" class="tiny" text-anchor="middle">真正并行</text><text x="1152" y="678" class="tiny" text-anchor="middle">靠多个 M</text><text x="1152" y="706" class="tiny" text-anchor="middle">同时运行</text><rect width="1125" height="42" x="95" y="765" class="risk"/><text x="657" y="792" class="tiny-strong" text-anchor="middle">Go 1.14+ goroutine 可异步抢占；但 CPU 密集任务仍会占核心，不能把协程当作免费并行计算</text><rect width="1200" height="315" x="60" y="860" class="panel"/><text x="92" y="903" class="panel-title">3. Python asyncio：单线程事件循环，强在 IO 并发</text><rect width="240" height="82" x="95" y="950" class="state"/><text x="215" y="982" class="label" text-anchor="middle">coroutine objects</text><text x="215" y="1008" class="tiny" text-anchor="middle">async def returns awaitable</text><path d="M 340 991 L 455 991" class="line-green"/><rect width="240" height="82" x="460" y="950" class="state"/><text x="580" y="982" class="label" text-anchor="middle">Tasks</text><text x="580" y="1008" class="tiny" text-anchor="middle">event loop scheduled</text><path d="M 705 991 L 820 991" class="line-green"/><rect width="240" height="82" x="825" y="950" class="state"/><text x="945" y="982" class="label" text-anchor="middle">Selector / IO</text><text x="945" y="1008" class="tiny" text-anchor="middle">await gives control back</text><path d="M 945 1037 L 945 1090 L 700 1090" class="line-blue dash"/><rect width="240" height="82" x="460" y="1060" class="gray"/><text x="580" y="1092" class="label" text-anchor="middle">single loop thread</text><text x="580" y="1118" class="tiny" text-anchor="middle">CPU blocking delays all tasks</text><rect width="245" height="82" x="820" y="1060" class="risk"/><text x="942" y="1092" class="label" text-anchor="middle">CPU work</text><text x="942" y="1118" class="tiny" text-anchor="middle">use process/thread/executor</text></svg>