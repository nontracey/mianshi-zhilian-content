<svg viewBox="0 0 680 250" width="100%" role="img" aria-label="责任链模式流程图">
<title>责任链模式流程图</title><desc>请求沿过滤器链传递直到被处理</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">责任链模式</text>
<text x="340" y="44" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">请求沿链传递，直到被处理</text>
<rect x="80" y="64" width="120" height="50" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="140" y="84" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Filter A</text>
<text x="140" y="102" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">日志记录</text>
<line x1="200" y1="89" x2="230" y2="89" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="230" y="64" width="120" height="50" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="290" y="84" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Filter B</text>
<text x="290" y="102" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">权限校验</text>
<line x1="350" y1="89" x2="380" y2="89" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="380" y="64" width="120" height="50" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="440" y="84" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Filter C</text>
<text x="440" y="102" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">参数校验</text>
<line x1="500" y1="89" x2="530" y2="89" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="530" y="64" width="120" height="50" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="590" y="84" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Filter D</text>
<text x="590" y="102" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">业务处理</text>
<rect x="80" y="130" width="80" height="32" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="120" y="147" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">请求</text>
<line x1="120" y1="146" x2="120" y2="162" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="80" y="170" width="520" height="60" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="190" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">Spring实现</text>
<text x="340" y="210" text-anchor="middle" font-size="11" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">Filter链 (Servlet) / Interceptor链 (SpringMVC)</text>
<text x="340" y="224" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">Pipeline模式: 每个Handler处理后传递给下一个</text>
</svg>