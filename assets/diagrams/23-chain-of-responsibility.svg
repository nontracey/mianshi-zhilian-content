<svg width="100%" aria-label="责任链模式流程图" role="img" viewBox="0 0 680 250"><title>责任链模式流程图</title><desc>请求沿过滤器链传递直到被处理</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="340" y="24" fill="#042C53" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">责任链模式</text><text x="340" y="44" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">请求沿链传递，直到被处理</text><rect width="120" height="50" x="80" y="64" fill="#E6F1FB" stroke="#378ADD" stroke-width=".5" rx="8"/><text x="140" y="84" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Filter A</text><text x="140" y="102" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">日志记录</text><line x1="200" x2="230" y1="89" y2="89" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><rect width="120" height="50" x="230" y="64" fill="#EEEDFE" stroke="#7F77DD" stroke-width=".5" rx="8"/><text x="290" y="84" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Filter B</text><text x="290" y="102" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">权限校验</text><line x1="350" x2="380" y1="89" y2="89" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><rect width="120" height="50" x="380" y="64" fill="#FAEEDA" stroke="#BA7517" stroke-width=".5" rx="8"/><text x="440" y="84" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Filter C</text><text x="440" y="102" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">参数校验</text><line x1="500" x2="530" y1="89" y2="89" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><rect width="120" height="50" x="530" y="64" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".5" rx="8"/><text x="590" y="84" fill="#042C53" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Filter D</text><text x="590" y="102" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">业务处理</text><rect width="80" height="32" x="80" y="130" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="8"/><text x="120" y="147" fill="#042C53" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">请求</text><line x1="120" x2="120" y1="146" y2="162" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><rect width="520" height="60" x="80" y="170" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="10"/><text x="340" y="190" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Spring实现</text><text x="340" y="210" fill="#444441" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">Filter链 (Servlet) / Interceptor链 (SpringMVC)</text><text x="340" y="224" fill="#888780" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">Pipeline模式: 每个Handler处理后传递给下一个</text></svg>