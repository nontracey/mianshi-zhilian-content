<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="title desc">
  <title id="title">RabbitMQ 路由、确认、死信和队列类型</title>
  <desc id="desc">展示 RabbitMQ 中 Producer 经 Connection/Channel 发布到 Exchange，按 Binding 路由到队列，Publisher Confirm 和 mandatory return 的位置，Consumer Ack/Nack、DLX，以及 classic queue、quorum queue、stream 的取舍。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .subtitle { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; rx: 14; }
      .panel-title { font: 700 20px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .box-title { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .small { font: 400 13px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334e68; }
      .tiny { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .blue { fill: #e8f2ff; stroke: #60a5fa; stroke-width: 2; rx: 12; }
      .green { fill: #e8f8ef; stroke: #4ade80; stroke-width: 2; rx: 12; }
      .yellow { fill: #fff7d6; stroke: #facc15; stroke-width: 2; rx: 12; }
      .orange { fill: #fff1e6; stroke: #fb923c; stroke-width: 2; rx: 12; }
      .red { fill: #feecec; stroke: #f87171; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-orange { stroke: #b45309; stroke-width: 3; fill: none; marker-end: url(#arrow-orange); }
      .line-red { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1280"/>
  <text x="48" y="56" class="title">RabbitMQ 核心：Exchange 路由、确认与队列类型</text>
  <text x="50" y="86" class="subtitle">把“消息到哪儿、谁确认、失败去哪儿、队列怎么选”分开讲，才能避免把可靠性问题混成一句口号。</text>

  <rect x="40" y="120" width="1200" height="345" class="panel"/>
  <text x="68" y="156" class="panel-title">1. AMQP 0-9-1 发布链路：Producer 不直接写 Queue</text>
  <rect x="82" y="230" width="160" height="70" class="blue"/>
  <text x="121" y="257" class="box-title">Producer</text>
  <text x="108" y="279" class="tiny">Connection / Channel</text>
  <rect x="310" y="210" width="190" height="110" class="yellow"/>
  <text x="370" y="238" class="box-title">Exchange</text>
  <text x="340" y="262" class="tiny">direct / topic</text>
  <text x="340" y="284" class="tiny">fanout / headers</text>
  <rect x="570" y="190" width="190" height="150" class="orange"/>
  <text x="630" y="219" class="box-title">Binding</text>
  <text x="600" y="245" class="tiny">routing key</text>
  <text x="600" y="268" class="tiny">binding key</text>
  <text x="600" y="291" class="tiny">header match</text>
  <rect x="840" y="170" width="160" height="60" class="green"/>
  <text x="900" y="195" class="box-title">Queue A</text>
  <text x="875" y="216" class="tiny">order.created</text>
  <rect x="840" y="255" width="160" height="60" class="green"/>
  <text x="900" y="280" class="box-title">Queue B</text>
  <text x="880" y="301" class="tiny">order.* / fanout</text>
  <rect x="1072" y="210" width="130" height="72" class="gray"/>
  <text x="1101" y="238" class="box-title">Consumer</text>
  <text x="1095" y="260" class="tiny">prefetch / ack</text>
  <line x1="242" y1="265" x2="310" y2="265" class="line"/>
  <line x1="500" y1="265" x2="570" y2="265" class="line"/>
  <path d="M760,245 C790,218 805,202 840,200" class="line"/>
  <path d="M760,285 C790,286 805,286 840,285" class="line"/>
  <path d="M1000,200 C1035,212 1048,228 1072,240" class="line"/>
  <path d="M1000,285 C1035,278 1048,264 1072,252" class="line"/>
  <path d="M340,210 C305,170 155,170 132,230" class="line-orange dash"/>
  <text x="130" y="176" class="tiny">publisher confirm：Broker/队列副本确认写入</text>
  <path d="M410,320 C385,395 190,395 160,300" class="line-red dash"/>
  <text x="118" y="414" class="tiny">mandatory=true 且不可路由：return 给 Producer；mandatory=false 时可能丢弃或进 alternate exchange。</text>

  <rect x="40" y="505" width="1200" height="285" class="panel"/>
  <text x="68" y="541" class="panel-title">2. 消费确认、重投与死信：Confirm 和 Ack 彼此独立</text>
  <rect x="82" y="615" width="150" height="62" class="green"/>
  <text x="128" y="640" class="box-title">Queue</text>
  <text x="106" y="661" class="tiny">ready / unacked</text>
  <rect x="314" y="615" width="170" height="62" class="blue"/>
  <text x="365" y="640" class="box-title">Consumer</text>
  <text x="343" y="661" class="tiny">prefetch 控制并发</text>
  <rect x="568" y="575" width="150" height="58" class="green"/>
  <text x="625" y="599" class="box-title">Ack</text>
  <text x="604" y="619" class="tiny">消息可删除</text>
  <rect x="568" y="678" width="150" height="58" class="orange"/>
  <text x="610" y="702" class="box-title">Nack</text>
  <text x="592" y="722" class="tiny">requeue true/false</text>
  <rect x="802" y="615" width="170" height="62" class="red"/>
  <text x="854" y="640" class="box-title">DLX</text>
  <text x="825" y="661" class="tiny">TTL / reject / limit</text>
  <rect x="1044" y="615" width="150" height="62" class="gray"/>
  <text x="1086" y="640" class="box-title">DLQ</text>
  <text x="1070" y="661" class="tiny">排障 / 补偿</text>
  <line x1="232" y1="646" x2="314" y2="646" class="line"/>
  <path d="M484,646 C520,620 535,604 568,604" class="line"/>
  <path d="M484,646 C520,680 535,706 568,707" class="line-orange"/>
  <path d="M718,707 C755,690 770,662 802,646" class="line-red"/>
  <line x1="972" y1="646" x2="1044" y2="646" class="line-red"/>
  <path d="M568,700 C495,560 220,560 158,615" class="line-orange dash"/>
  <text x="96" y="742" class="small">手动 Ack 下，连接或 Channel 关闭时未确认消息会回到队列；重复消费是常态，业务侧要幂等。</text>
  <text x="96" y="768" class="small">DLX 默认内部重发布不等于端到端无丢；quorum queue 的 at-least-once dead lettering 更适合关键链路。</text>

  <rect x="40" y="830" width="575" height="305" class="panel"/>
  <text x="68" y="866" class="panel-title">3. 队列类型不是同一种答案</text>
  <rect x="76" y="918" width="150" height="95" class="yellow"/>
  <text x="112" y="945" class="box-title">Classic</text>
  <text x="94" y="971" class="tiny">低开销通用队列</text>
  <text x="94" y="994" class="tiny">镜像队列 4.x 已移除</text>
  <rect x="252" y="918" width="150" height="95" class="green"/>
  <text x="287" y="945" class="box-title">Quorum</text>
  <text x="274" y="971" class="tiny">Raft 复制</text>
  <text x="272" y="994" class="tiny">数据安全优先</text>
  <rect x="428" y="918" width="150" height="95" class="blue"/>
  <text x="475" y="945" class="box-title">Stream</text>
  <text x="452" y="971" class="tiny">追加日志语义</text>
  <text x="450" y="994" class="tiny">大积压 / 多次读</text>
  <text x="78" y="1052" class="small">RabbitMQ 4.3：quorum queue 支持 delayed retry、consumer timeout、严格优先级等新能力。</text>
  <text x="78" y="1082" class="small">普通任务队列看 classic；关键持久队列看 quorum；日志式回放或大 backlog 看 streams。</text>

  <rect x="655" y="830" width="585" height="305" class="panel"/>
  <text x="683" y="866" class="panel-title">4. 生产检查点</text>
  <text x="692" y="925" class="small">发布端：durable topology + persistent message + publisher confirm + return handler。</text>
  <text x="692" y="963" class="small">消费端：manual ack、合理 prefetch、幂等键、失败分类、重试和死信处理。</text>
  <text x="692" y="1001" class="small">拓扑：优先用 policy 管 TTL、DLX、长度限制，减少硬编码 x-arguments。</text>
  <text x="692" y="1039" class="small">高可用：classic mirroring 已退出 4.x；关键数据用 quorum，广播可用 fanout。</text>
  <text x="692" y="1077" class="small">观测：unroutable、confirm latency、ready/unacked、redelivered、DLQ、磁盘和内存水位。</text>

  <rect x="40" y="1175" width="1200" height="60" class="panel"/>
  <text x="68" y="1212" class="panel-title">回答抓手</text>
  <text x="190" y="1212" class="small">Producer -> Exchange -> Binding -> Queue -> Consumer；publisher confirm 只管写入 Broker，consumer ack 只管处理完成，DLX/重试/幂等负责失败收口。</text>
</svg>
