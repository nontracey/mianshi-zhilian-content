<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1280" viewBox="0 0 1320 1280" role="img" aria-labelledby="title desc">
  <title id="title">Java Optional return-value contract and misuse boundaries</title>
  <desc id="desc">A topic-specific diagram explaining Optional as a method return-value contract, of/ofNullable/empty creation, map/flatMap/filter transformations, orElse/orElseGet/orElseThrow strategies, Stream integration, and common misuse boundaries.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .section-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .green { fill: #dcfce7; stroke: #22c55e; }
      .yellow { fill: #fef3c7; stroke: #f59e0b; }
      .red { fill: #fee2e2; stroke: #ef4444; }
      .violet { fill: #ede9fe; stroke: #8b5cf6; }
      .cyan { fill: #cffafe; stroke: #06b6d4; }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-red { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect class="bg" width="1320" height="1280"/>
  <text class="title" x="70" y="64">Optional：让“返回值可能不存在”进入方法签名</text>
  <text class="subtitle" x="70" y="96">它不是全局替代 null，而是把空值处理策略推给调用方：转换、默认值、抛异常或继续传递。</text>

  <rect class="panel" x="70" y="130" width="1180" height="330" rx="16"/>
  <text class="section-title" x="96" y="166">1. 创建契约：先分清调用方错误还是外部不确定</text>

  <rect class="blue" x="115" y="215" width="225" height="92" rx="12" stroke-width="2"/>
  <text class="box-title" x="142" y="247">确定非空</text>
  <text class="mono" x="142" y="272">Optional.of(value)</text>
  <text class="text" x="142" y="292">null 立即暴露契约错误</text>

  <rect class="green" x="420" y="215" width="235" height="92" rx="12" stroke-width="2"/>
  <text class="box-title" x="447" y="247">外部结果不确定</text>
  <text class="mono" x="447" y="272">Optional.ofNullable(x)</text>
  <text class="text" x="447" y="292">兼容历史接口或缓存查询</text>

  <rect class="yellow" x="735" y="215" width="220" height="92" rx="12" stroke-width="2"/>
  <text class="box-title" x="762" y="247">显式没有结果</text>
  <text class="mono" x="762" y="272">Optional.empty()</text>
  <text class="text" x="762" y="292">清楚表达缺失分支</text>

  <rect class="violet" x="1030" y="215" width="170" height="92" rx="12" stroke-width="2"/>
  <text class="box-title" x="1057" y="247">典型位置</text>
  <text class="text" x="1057" y="272">方法返回值</text>
  <text class="mono" x="1057" y="292">findById()</text>

  <path class="arrow-blue" d="M340 261 H411"/>
  <path class="arrow-blue" d="M655 261 H726"/>
  <path class="arrow-blue" d="M955 261 H1021"/>

  <rect class="cyan" x="150" y="345" width="990" height="70" rx="14" stroke-width="2"/>
  <text class="box-title" x="177" y="376">设计定位</text>
  <text class="text" x="177" y="399">Optional 主要用于需要清楚表达“可能没有结果”的返回值；字段、参数、集合元素和锁对象不是它擅长的位置。</text>

  <rect class="panel" x="70" y="500" width="570" height="330" rx="16"/>
  <text class="section-title" x="96" y="536">2. 有值路径：转换、过滤、避免嵌套</text>

  <rect class="green" x="110" y="585" width="220" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="137" y="617">map</text>
  <text class="text" x="137" y="642">T -&gt; U</text>
  <text class="mono" x="137" y="660">map(User::name)</text>

  <rect class="yellow" x="380" y="585" width="220" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="407" y="617">filter</text>
  <text class="text" x="407" y="642">不满足条件转 empty</text>
  <text class="mono" x="407" y="660">filter(User::active)</text>

  <rect class="violet" x="110" y="710" width="220" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="137" y="742">flatMap</text>
  <text class="text" x="137" y="767">T -&gt; Optional&lt;U&gt;</text>
  <text class="text" x="137" y="785">避免 Optional 嵌套</text>

  <rect class="blue" x="380" y="710" width="220" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="407" y="742">Stream 集成</text>
  <text class="mono" x="407" y="767">findFirst()</text>
  <text class="text" x="407" y="785">查询不到时自然 empty</text>

  <rect class="panel" x="680" y="500" width="570" height="330" rx="16"/>
  <text class="section-title" x="706" y="536">3. 空值策略：默认、惰性、失败</text>

  <rect class="yellow" x="720" y="585" width="220" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="747" y="617">便宜常量</text>
  <text class="mono" x="747" y="642">orElse(\"guest\")</text>
  <text class="text" x="747" y="660">参数会先求值</text>

  <rect class="green" x="990" y="585" width="220" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1017" y="617">昂贵或有副作用</text>
  <text class="mono" x="1017" y="642">orElseGet(...)</text>
  <text class="text" x="1017" y="660">仅 empty 时执行</text>

  <rect class="red" x="720" y="710" width="220" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="747" y="742">必须失败</text>
  <text class="mono" x="747" y="767">orElseThrow()</text>
  <text class="text" x="747" y="785">缺失就是业务异常</text>

  <rect class="cyan" x="990" y="710" width="220" height="82" rx="12" stroke-width="2"/>
  <text class="box-title" x="1017" y="742">分支回调</text>
  <text class="mono" x="1017" y="767">ifPresentOrElse</text>
  <text class="text" x="1017" y="785">只做边界副作用</text>

  <rect class="panel" x="70" y="870" width="1180" height="255" rx="16"/>
  <text class="section-title" x="96" y="906">4. 反模式与身份边界</text>

  <rect class="red" x="105" y="955" width="240" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="132" y="987">isPresent + get</text>
  <text class="text" x="132" y="1012">把判 null 写得更绕</text>
  <text class="text" x="132" y="1030">优先 map/orElseThrow</text>

  <rect class="red" x="385" y="955" width="240" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="412" y="987">orElse(expensive())</text>
  <text class="text" x="412" y="1012">有值也会执行默认值构造</text>
  <text class="text" x="412" y="1030">远程调用/写库尤其危险</text>

  <rect class="yellow" x="665" y="955" width="240" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="692" y="987">字段 / 参数滥用</text>
  <text class="text" x="692" y="1012">序列化、框架绑定、调用体验</text>
  <text class="text" x="692" y="1030">都可能变差</text>

  <rect class="violet" x="945" y="955" width="240" height="86" rx="12" stroke-width="2"/>
  <text class="box-title" x="972" y="987">value-based 类</text>
  <text class="text" x="972" y="1012">不要同步、比较 identity</text>
  <text class="mono" x="972" y="1030">== / identityHashCode</text>

  <text class="small" x="105" y="1090">性能判断要具体：Optional 有包装语义，但 JIT 可能消除部分分配；热路径和大集合中是否有压力应靠 profile 证明。</text>

  <text class="small" x="96" y="1208">答题抓手：返回值契约、of/ofNullable/empty、map/flatMap/filter、orElse 与 orElseGet 求值时机、value-based 身份边界、字段参数滥用。</text>
</svg>
