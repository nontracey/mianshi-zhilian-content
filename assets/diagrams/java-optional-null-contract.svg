<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1320 1280"><title id="title">Java Optional return-value contract and misuse boundaries</title><desc id="desc">A topic-specific diagram explaining Optional as a method return-value contract, of/ofNullable/empty creation, map/flatMap/filter transformations, orElse/orElseGet/orElseThrow strategies, Stream integration, and common misuse boundaries.</desc><defs><marker id="arrow-blue" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-red" markerHeight="9" markerWidth="9" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.title{font:700 32px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.section-title{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.box-title{font:700 16px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#111827}.text{font:500 13px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#334155}.blue{fill:#dbeafe;stroke:#60a5fa}.green{fill:#dcfce7;stroke:#22c55e}.yellow{fill:#fef3c7;stroke:#f59e0b}.red{fill:#fee2e2;stroke:#ef4444}.violet{fill:#ede9fe;stroke:#8b5cf6}.cyan{fill:#cffafe;stroke:#06b6d4}.arrow-blue{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}</style></defs><rect width="1320" height="1280" class="bg"/><text x="70" y="64" class="title">Optional：让“返回值可能不存在”进入方法签名</text><text x="70" y="96" class="subtitle">它不是全局替代 null，而是把空值处理策略推给调用方：转换、默认值、抛异常或继续传递。</text><rect width="1180" height="330" x="70" y="130" class="panel" rx="16"/><text x="96" y="166" class="section-title">1. 创建契约：先分清调用方错误还是外部不确定</text><rect width="225" height="92" x="115" y="215" stroke-width="2" class="blue" rx="12"/><text x="142" y="247" class="box-title">确定非空</text><text x="142" y="272" class="mono">Optional.of(value)</text><text x="142" y="292" class="text">null 立即暴露契约错误</text><rect width="235" height="92" x="420" y="215" stroke-width="2" class="green" rx="12"/><text x="447" y="247" class="box-title">外部结果不确定</text><text x="447" y="272" class="mono">Optional.ofNullable(x)</text><text x="447" y="292" class="text">兼容历史接口或缓存查询</text><rect width="220" height="92" x="735" y="215" stroke-width="2" class="yellow" rx="12"/><text x="762" y="247" class="box-title">显式没有结果</text><text x="762" y="272" class="mono">Optional.empty()</text><text x="762" y="292" class="text">清楚表达缺失分支</text><rect width="170" height="92" x="1030" y="215" stroke-width="2" class="violet" rx="12"/><text x="1057" y="247" class="box-title">典型位置</text><text x="1057" y="272" class="text">方法返回值</text><text x="1057" y="292" class="mono">findById()</text><path d="M340 261 H411" class="arrow-blue"/><path d="M655 261 H726" class="arrow-blue"/><path d="M955 261 H1021" class="arrow-blue"/><rect width="990" height="70" x="150" y="345" stroke-width="2" class="cyan" rx="14"/><text x="177" y="376" class="box-title">设计定位</text><text x="177" y="399" class="text">Optional 主要用于需要清楚表达“可能没有结果”的返回值；字段、参数、集合元素和锁对象不是它擅长的位置。</text><rect width="570" height="330" x="70" y="500" class="panel" rx="16"/><text x="96" y="536" class="section-title">2. 有值路径：转换、过滤、避免嵌套</text><rect width="220" height="82" x="110" y="585" stroke-width="2" class="green" rx="12"/><text x="137" y="617" class="box-title">map</text><text x="137" y="642" class="text">T -&gt; U</text><text x="137" y="660" class="mono">map(User::name)</text><rect width="220" height="82" x="380" y="585" stroke-width="2" class="yellow" rx="12"/><text x="407" y="617" class="box-title">filter</text><text x="407" y="642" class="text">不满足条件转 empty</text><text x="407" y="660" class="mono">filter(User::active)</text><rect width="220" height="82" x="110" y="710" stroke-width="2" class="violet" rx="12"/><text x="137" y="742" class="box-title">flatMap</text><text x="137" y="767" class="text">T -&gt; Optional&lt;U&gt;</text><text x="137" y="785" class="text">避免 Optional 嵌套</text><rect width="220" height="82" x="380" y="710" stroke-width="2" class="blue" rx="12"/><text x="407" y="742" class="box-title">Stream 集成</text><text x="407" y="767" class="mono">findFirst()</text><text x="407" y="785" class="text">查询不到时自然 empty</text><rect width="570" height="330" x="680" y="500" class="panel" rx="16"/><text x="706" y="536" class="section-title">3. 空值策略：默认、惰性、失败</text><rect width="220" height="82" x="720" y="585" stroke-width="2" class="yellow" rx="12"/><text x="747" y="617" class="box-title">便宜常量</text><text x="747" y="642" class="mono">orElse(\&quot;guest\&quot;)</text><text x="747" y="660" class="text">参数会先求值</text><rect width="220" height="82" x="990" y="585" stroke-width="2" class="green" rx="12"/><text x="1017" y="617" class="box-title">昂贵或有副作用</text><text x="1017" y="642" class="mono">orElseGet(...)</text><text x="1017" y="660" class="text">仅 empty 时执行</text><rect width="220" height="82" x="720" y="710" stroke-width="2" class="red" rx="12"/><text x="747" y="742" class="box-title">必须失败</text><text x="747" y="767" class="mono">orElseThrow()</text><text x="747" y="785" class="text">缺失就是业务异常</text><rect width="220" height="82" x="990" y="710" stroke-width="2" class="cyan" rx="12"/><text x="1017" y="742" class="box-title">分支回调</text><text x="1017" y="767" class="mono">ifPresentOrElse</text><text x="1017" y="785" class="text">只做边界副作用</text><rect width="1180" height="255" x="70" y="870" class="panel" rx="16"/><text x="96" y="906" class="section-title">4. 反模式与身份边界</text><rect width="240" height="86" x="105" y="955" stroke-width="2" class="red" rx="12"/><text x="132" y="987" class="box-title">isPresent + get</text><text x="132" y="1012" class="text">把判 null 写得更绕</text><text x="132" y="1030" class="text">优先 map/orElseThrow</text><rect width="240" height="86" x="385" y="955" stroke-width="2" class="red" rx="12"/><text x="412" y="987" class="box-title">orElse(expensive())</text><text x="412" y="1012" class="text">有值也会执行默认值构造</text><text x="412" y="1030" class="text">远程调用/写库尤其危险</text><rect width="240" height="86" x="665" y="955" stroke-width="2" class="yellow" rx="12"/><text x="692" y="987" class="box-title">字段 / 参数滥用</text><text x="692" y="1012" class="text">序列化、框架绑定、调用体验</text><text x="692" y="1030" class="text">都可能变差</text><rect width="240" height="86" x="945" y="955" stroke-width="2" class="violet" rx="12"/><text x="972" y="987" class="box-title">value-based 类</text><text x="972" y="1012" class="text">不要同步、比较 identity</text><text x="972" y="1030" class="mono">== / identityHashCode</text><text x="105" y="1090" class="small">性能判断要具体：Optional 有包装语义，但 JIT 可能消除部分分配；热路径和大集合中是否有压力应靠 profile 证明。</text><text x="96" y="1208" class="small">答题抓手：返回值契约、of/ofNullable/empty、map/flatMap/filter、orElse 与 orElseGet 求值时机、value-based 身份边界、字段参数滥用。</text></svg>