<svg viewBox="0 0 680 330" width="100%" role="img" aria-label="代理模式对比图">
<title>代理模式对比图</title><desc>JDK动态代理与CGLIB的区别</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">代理模式对比</text>
<rect x="30" y="54" width="300" height="200" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="180" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">JDK动态代理</text>
<text x="180" y="96" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">基于接口</text>
<rect x="80" y="110" width="80" height="32" rx="6" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
<text x="120" y="130" text-anchor="middle" font-size="11" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">Interface</text>
<rect x="180" y="110" width="80" height="32" rx="6" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
<text x="220" y="130" text-anchor="middle" font-size="11" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">RealSubject</text>
<line x1="160" y1="126" x2="178" y2="126" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="80" y="160" width="80" height="32" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="120" y="180" text-anchor="middle" font-size="11" font-weight="500" fill="#04342C" font-family="system-ui, sans-serif">Proxy</text>
<line x1="120" y1="142" x2="120" y2="158" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="180" y="200" text-anchor="middle" font-size="10" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">Proxy.newProxyInstance()</text>
<text x="180" y="216" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">InvocationHandler</text>
<text x="180" y="240" text-anchor="middle" font-size="11" font-weight="400" fill="#993C1D" font-family="system-ui, sans-serif">只能代理接口方法</text>
<rect x="350" y="54" width="300" height="200" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="500" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="#412402" font-family="system-ui, sans-serif">CGLIB动态代理</text>
<text x="500" y="96" text-anchor="middle" font-size="11" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">基于继承</text>
<rect x="430" y="110" width="80" height="32" rx="6" fill="#FFFFFF" stroke="#BA7517" stroke-width="0.5"/>
<text x="470" y="130" text-anchor="middle" font-size="11" font-weight="500" fill="#412402" font-family="system-ui, sans-serif">SuperClass</text>
<rect x="530" y="110" width="80" height="32" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="570" y="130" text-anchor="middle" font-size="11" font-weight="500" fill="#04342C" font-family="system-ui, sans-serif">SubClass</text>
<line x1="510" y1="126" x2="528" y2="126" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<text x="500" y="168" text-anchor="middle" font-size="10" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">生成子类字节码</text>
<text x="500" y="184" text-anchor="middle" font-size="10" font-weight="400" fill="#444441" font-family="system-ui, sans-serif">MethodInterceptor</text>
<text x="500" y="200" text-anchor="middle" font-size="10" font-weight="400" fill="#888780" font-family="system-ui, sans-serif">FastClass机制(无反射)</text>
<text x="500" y="240" text-anchor="middle" font-size="11" font-weight="400" fill="#993C1D" font-family="system-ui, sans-serif">不能代理final方法</text>
<rect x="100" y="270" width="480" height="40" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="294" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">Spring AOP: 有接口用JDK代理，无接口用CGLIB</text>
</svg>