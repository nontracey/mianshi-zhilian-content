<svg width="100%" aria-label="代理模式对比图" role="img" viewBox="0 0 680 330"><title>代理模式对比图</title><desc>JDK动态代理与CGLIB的区别</desc><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker></defs><text x="340" y="24" fill="#042C53" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">代理模式对比</text><rect width="300" height="200" x="30" y="54" fill="#E6F1FB" stroke="#378ADD" stroke-width=".5" rx="12"/><text x="180" y="76" fill="#042C53" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">JDK动态代理</text><text x="180" y="96" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">基于接口</text><rect width="80" height="32" x="80" y="110" fill="#FFF" stroke="#378ADD" stroke-width=".5" rx="6"/><text x="120" y="130" fill="#042C53" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Interface</text><rect width="80" height="32" x="180" y="110" fill="#FFF" stroke="#378ADD" stroke-width=".5" rx="6"/><text x="220" y="130" fill="#042C53" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">RealSubject</text><line x1="160" x2="178" y1="126" y2="126" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><rect width="80" height="32" x="80" y="160" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".5" rx="6"/><text x="120" y="180" fill="#04342C" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Proxy</text><line x1="120" x2="120" y1="142" y2="158" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><text x="180" y="200" fill="#444441" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">Proxy.newProxyInstance()</text><text x="180" y="216" fill="#888780" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">InvocationHandler</text><text x="180" y="240" fill="#993C1D" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">只能代理接口方法</text><rect width="300" height="200" x="350" y="54" fill="#FAEEDA" stroke="#BA7517" stroke-width=".5" rx="12"/><text x="500" y="76" fill="#412402" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">CGLIB动态代理</text><text x="500" y="96" fill="#5F5E5A" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">基于继承</text><rect width="80" height="32" x="430" y="110" fill="#FFF" stroke="#BA7517" stroke-width=".5" rx="6"/><text x="470" y="130" fill="#412402" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">SuperClass</text><rect width="80" height="32" x="530" y="110" fill="#E1F5EE" stroke="#1D9E75" stroke-width=".5" rx="6"/><text x="570" y="130" fill="#04342C" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">SubClass</text><line x1="510" x2="528" y1="126" y2="126" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/><text x="500" y="168" fill="#444441" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">生成子类字节码</text><text x="500" y="184" fill="#444441" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">MethodInterceptor</text><text x="500" y="200" fill="#888780" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle">FastClass机制(无反射)</text><text x="500" y="240" fill="#993C1D" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">不能代理final方法</text><rect width="480" height="40" x="100" y="270" fill="#F1EFE8" stroke="#B4B2A9" stroke-width=".5" rx="8"/><text x="340" y="294" fill="#2C2C2A" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Spring AOP: 有接口用JDK代理，无接口用CGLIB</text></svg>