<svg viewBox="0 0 680 370" width="100%" role="img" aria-label="微服务拆分决策树">
<title>微服务拆分决策树</title><desc>何时拆、怎么拆的决策流程</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340" y="24" text-anchor="middle" font-size="16" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">微服务拆分决策树</text>
<rect x="240" y="52" width="200" height="38" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="340" y="72" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">是否需要拆分?</text>
<line x1="340" y1="90" x2="200" y2="110" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
