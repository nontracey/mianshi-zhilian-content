<text x="260" y="100" text-anchor="middle" font-size="11" font-weight="400" fill="#0F6E56" font-family="system-ui, sans-serif">否</text>
<text x="420" y="100" text-anchor="middle" font-size="11" font-weight="400" fill="#993C1D" font-family="system-ui, sans-serif">是</text>
<rect x="100" y="112" width="160" height="36" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="180" y="131" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">保持单体</text>
<rect x="400" y="112" width="200" height="36" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="500" y="131" text-anchor="middle" font-size="13" font-weight="500" fill="#042C53" font-family="system-ui, sans-serif">拆分维度?</text>
<line x1="500" y1="148" x2="500" y2="168" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a)"/>
<rect x="400" y="170" width="200" height="32" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="420" y="190" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">业务边界</text>
<text x="540" y="190" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">DDD限界上下文</text>
<rect x="400" y="214" width="200" height="32" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="420" y="234" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">团队结构</text>
<text x="540" y="234" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">两个披萨团队</text>
<rect x="400" y="258" width="200" height="32" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="420" y="278" text-anchor="middle" font-size="11" font-weight="500" fill="#2C2C2A" font-family="system-ui, sans-serif">数据独立性</text>
<text x="540" y="278" text-anchor="middle" font-size="10" font-weight="400" fill="#5F5E5A" font-family="system-ui, sans-serif">独立数据库</text>
<rect x="80" y="310" width="520" height="40" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="340" y="334" text-anchor="middle" font-size="12" font-weight="500" fill="#501313" font-family="system-ui, sans-serif">反模式: 分布式单体 (服务间强耦合，等于白拆)</text>
</svg>