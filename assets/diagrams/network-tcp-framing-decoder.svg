<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1180" aria-labelledby="title desc" role="img" viewBox="0 0 1280 1180"><title id="title">TCP 字节流与应用层分帧</title><desc id="desc">展示应用写入的消息如何变成连续 TCP 字节流，read 如何可能粘连或拆开消息，以及长度前缀解码器如何用累积缓冲区恢复消息边界。</desc><defs><marker id="arrow-blue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#059669" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.title{font:800 34px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.subtitle{font:500 18px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.panel-title{font:750 27px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#0f172a}.label{font:700 21px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#1e293b}.small{font:500 17px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#334155}.tiny{font:500 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#475569}.a{fill:#eff6ff;stroke:#60a5fa}.a,.b,.c,.gray,.warn{stroke-width:2;rx:12}.b{fill:#ecfdf5;stroke:#34d399}.c{fill:#fffbeb;stroke:#f59e0b}.warn{fill:#fef2f2;stroke:#f87171}.gray{fill:#f1f5f9;stroke:#cbd5e1}.line-blue{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow-blue)}.bracket{stroke:#475569;stroke-width:3;fill:none}</style></defs><rect width="1280" height="1180" class="bg"/><text x="640" y="56" class="title" text-anchor="middle">TCP 只承诺有序字节流，不承诺应用消息边界</text><text x="640" y="90" class="subtitle" text-anchor="middle">write 边界、TCP segment 边界、read 边界彼此没有一一对应关系；分帧必须由应用协议恢复</text><rect width="1160" height="330" x="60" y="125" class="panel"/><text x="92" y="168" class="panel-title">1. 写入是消息，传输是连续字节</text><text x="125" y="215" class="small">应用连续 write：</text><rect width="190" height="54" x="285" y="188" class="a"/><text x="380" y="222" class="label" text-anchor="middle">Msg A</text><rect width="190" height="54" x="500" y="188" class="b"/><text x="595" y="222" class="label" text-anchor="middle">Msg B</text><rect width="190" height="54" x="715" y="188" class="c"/><text x="810" y="222" class="label" text-anchor="middle">Msg C</text><path d="M 910 215 L 1035 215" class="line-blue"/><rect width="115" height="54" x="1045" y="188" class="gray"/><text x="1102" y="222" class="small" text-anchor="middle">socket</text><text x="125" y="300" class="small">TCP 看到的是：</text><rect width="160" height="54" x="285" y="274" class="a"/><text x="365" y="308" class="label" text-anchor="middle">A bytes</text><rect width="260" height="54" x="445" y="274" class="b"/><text x="575" y="308" class="label" text-anchor="middle">B bytes</text><rect width="210" height="54" x="705" y="274" class="c"/><text x="810" y="308" class="label" text-anchor="middle">C bytes</text><rect width="630" height="50" x="285" y="345" class="gray"/><text x="600" y="377" class="small" text-anchor="middle">segment 边界可按 MSS、拥塞窗口、发送策略变化；不等于 Msg 边界</text><rect width="1160" height="285" x="60" y="490" class="panel"/><text x="92" y="533" class="panel-title">2. read 可以粘，也可以拆</text><text x="125" y="590" class="small">read #1 可能拿到：</text><rect width="145" height="54" x="330" y="562" class="a"/><text x="402" y="596" class="label" text-anchor="middle">A 完整</text><rect width="150" height="54" x="475" y="562" class="b"/><text x="550" y="596" class="label" text-anchor="middle">B 前半</text><path d="M 330 632 L 625 632" class="bracket"/><text x="477" y="657" class="tiny" text-anchor="middle">既粘到 A，又拆开 B</text><text x="690" y="590" class="small">read #2 可能拿到：</text><rect width="130" height="54" x="895" y="562" class="b"/><text x="960" y="596" class="label" text-anchor="middle">B 后半</text><rect width="135" height="54" x="1025" y="562" class="c"/><text x="1092" y="596" class="label" text-anchor="middle">C 完整</text><path d="M 895 632 L 1160 632" class="bracket"/><text x="1028" y="657" class="tiny" text-anchor="middle">半包 + 下一条消息</text><rect width="1030" height="48" x="125" y="690" class="gray"/><text x="640" y="721" class="small" text-anchor="middle">Nagle 会合并小写入，MSS/PMTU 会影响分段，read(buf,n) 只返回当前可取的 1..n 字节</text><rect width="1160" height="300" x="60" y="810" class="panel"/><text x="92" y="853" class="panel-title">3. 长度前缀解码器：用累积缓冲区恢复边界</text><rect width="220" height="58" x="105" y="900" class="gray"/><text x="215" y="936" class="label" text-anchor="middle">cumulation</text><path d="M 330 929 L 430 929" class="line-blue"/><rect width="150" height="58" x="435" y="900" class="a"/><text x="510" y="923" class="small" text-anchor="middle">peek 4B</text><text x="510" y="947" class="tiny" text-anchor="middle">length=N</text><path d="M 590 929 L 690 929" class="line-blue"/><rect width="170" height="58" x="695" y="900" class="c"/><text x="780" y="923" class="small" text-anchor="middle">N &lt;= max?</text><text x="780" y="947" class="tiny" text-anchor="middle">防 OOM</text><path d="M 870 929 L 910 929" class="line-blue"/><rect width="150" height="58" x="915" y="900" class="b"/><text x="990" y="936" class="label" text-anchor="middle">emit frame</text><rect width="830" height="62" x="225" y="1000" class="warn"/><text x="640" y="1025" class="small" text-anchor="middle">如果 readableBytes &lt; 4 或 readableBytes &lt; 4+N，就不移动 readerIndex</text><text x="640" y="1048" class="tiny" text-anchor="middle">保留半个 length 字段、半个 body 或下一条消息的残留字节，等下一次 channelRead/read 再继续</text></svg>