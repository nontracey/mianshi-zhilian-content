<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1180" viewBox="0 0 1280 1180" role="img" aria-labelledby="title desc">
  <title id="title">TCP 字节流与应用层分帧</title>
  <desc id="desc">展示应用写入的消息如何变成连续 TCP 字节流，read 如何可能粘连或拆开消息，以及长度前缀解码器如何用累积缓冲区恢复消息边界。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .title { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .panel-title { font: 750 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .a { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 12; }
      .b { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 12; }
      .c { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; rx: 12; }
      .warn { fill: #fef2f2; stroke: #f87171; stroke-width: 2; rx: 12; }
      .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .line-blue { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .line-green { stroke: #059669; stroke-width: 4; fill: none; marker-end: url(#arrow-green); }
      .bracket { stroke: #475569; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1180"/>
  <text class="title" x="640" y="56" text-anchor="middle">TCP 只承诺有序字节流，不承诺应用消息边界</text>
  <text class="subtitle" x="640" y="90" text-anchor="middle">write 边界、TCP segment 边界、read 边界彼此没有一一对应关系；分帧必须由应用协议恢复</text>

  <rect class="panel" x="60" y="125" width="1160" height="330"/>
  <text class="panel-title" x="92" y="168">1. 写入是消息，传输是连续字节</text>
  <text class="small" x="125" y="215">应用连续 write：</text>
  <rect class="a" x="285" y="188" width="190" height="54"/>
  <text class="label" x="380" y="222" text-anchor="middle">Msg A</text>
  <rect class="b" x="500" y="188" width="190" height="54"/>
  <text class="label" x="595" y="222" text-anchor="middle">Msg B</text>
  <rect class="c" x="715" y="188" width="190" height="54"/>
  <text class="label" x="810" y="222" text-anchor="middle">Msg C</text>
  <path class="line-blue" d="M 910 215 L 1035 215"/>
  <rect class="gray" x="1045" y="188" width="115" height="54"/>
  <text class="small" x="1102" y="222" text-anchor="middle">socket</text>

  <text class="small" x="125" y="300">TCP 看到的是：</text>
  <rect class="a" x="285" y="274" width="160" height="54"/>
  <text class="label" x="365" y="308" text-anchor="middle">A bytes</text>
  <rect class="b" x="445" y="274" width="260" height="54"/>
  <text class="label" x="575" y="308" text-anchor="middle">B bytes</text>
  <rect class="c" x="705" y="274" width="210" height="54"/>
  <text class="label" x="810" y="308" text-anchor="middle">C bytes</text>
  <rect class="gray" x="285" y="345" width="630" height="50"/>
  <text class="small" x="600" y="377" text-anchor="middle">segment 边界可按 MSS、拥塞窗口、发送策略变化；不等于 Msg 边界</text>

  <rect class="panel" x="60" y="490" width="1160" height="285"/>
  <text class="panel-title" x="92" y="533">2. read 可以粘，也可以拆</text>
  <text class="small" x="125" y="590">read #1 可能拿到：</text>
  <rect class="a" x="330" y="562" width="145" height="54"/>
  <text class="label" x="402" y="596" text-anchor="middle">A 完整</text>
  <rect class="b" x="475" y="562" width="150" height="54"/>
  <text class="label" x="550" y="596" text-anchor="middle">B 前半</text>
  <path class="bracket" d="M 330 632 L 625 632"/>
  <text class="tiny" x="477" y="657" text-anchor="middle">既粘到 A，又拆开 B</text>

  <text class="small" x="690" y="590">read #2 可能拿到：</text>
  <rect class="b" x="895" y="562" width="130" height="54"/>
  <text class="label" x="960" y="596" text-anchor="middle">B 后半</text>
  <rect class="c" x="1025" y="562" width="135" height="54"/>
  <text class="label" x="1092" y="596" text-anchor="middle">C 完整</text>
  <path class="bracket" d="M 895 632 L 1160 632"/>
  <text class="tiny" x="1028" y="657" text-anchor="middle">半包 + 下一条消息</text>

  <rect class="gray" x="125" y="690" width="1030" height="48"/>
  <text class="small" x="640" y="721" text-anchor="middle">Nagle 会合并小写入，MSS/PMTU 会影响分段，read(buf,n) 只返回当前可取的 1..n 字节</text>

  <rect class="panel" x="60" y="810" width="1160" height="300"/>
  <text class="panel-title" x="92" y="853">3. 长度前缀解码器：用累积缓冲区恢复边界</text>
  <rect class="gray" x="105" y="900" width="220" height="58"/>
  <text class="label" x="215" y="936" text-anchor="middle">cumulation</text>
  <path class="line-blue" d="M 330 929 L 430 929"/>
  <rect class="a" x="435" y="900" width="150" height="58"/>
  <text class="small" x="510" y="923" text-anchor="middle">peek 4B</text>
  <text class="tiny" x="510" y="947" text-anchor="middle">length=N</text>
  <path class="line-blue" d="M 590 929 L 690 929"/>
  <rect class="c" x="695" y="900" width="170" height="58"/>
  <text class="small" x="780" y="923" text-anchor="middle">N &lt;= max?</text>
  <text class="tiny" x="780" y="947" text-anchor="middle">防 OOM</text>
  <path class="line-blue" d="M 870 929 L 910 929"/>
  <rect class="b" x="915" y="900" width="150" height="58"/>
  <text class="label" x="990" y="936" text-anchor="middle">emit frame</text>

  <rect class="warn" x="225" y="1000" width="830" height="62"/>
  <text class="small" x="640" y="1025" text-anchor="middle">如果 readableBytes &lt; 4 或 readableBytes &lt; 4+N，就不移动 readerIndex</text>
  <text class="tiny" x="640" y="1048" text-anchor="middle">保留半个 length 字段、半个 body 或下一条消息的残留字节，等下一次 channelRead/read 再继续</text>
</svg>
